name: Certbot Readonly Audit
on:
  push:
    paths:
      - ".github/workflows/certbot-readonly-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect certificate and certbot failure
        env:
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$VPS_SSH_PASSWORD"
          sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 ubuntu@146.59.145.3 '
            echo "CERTBOT_TIMER=$(systemctl is-active certbot.timer 2>/dev/null || true)"
            echo "CERTBOT_ENABLED=$(systemctl is-enabled certbot.timer 2>/dev/null || true)"
            echo "CERTBOT_STATUS=$(systemctl show certbot.service -p Result -p ExecMainStatus -p ExecMainStartTimestamp -p ExecMainExitTimestamp --value 2>/dev/null | tr "\n" " " || true)"
            echo "CERTBOT_LOG_BEGIN"
            sudo -n journalctl -u certbot.service -n 80 --no-pager 2>/dev/null || true
            echo "CERTBOT_LOG_END"
            echo "CERT_EXPIRY_BEGIN"
            echo | openssl s_client -servername lowcost-europa.duckdns.org -connect lowcost-europa.duckdns.org:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>/dev/null || true
            echo "CERT_EXPIRY_END"
          '
