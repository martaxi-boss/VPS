name: Lowcost search recheck DNS crawler proof and live IndexNow
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-search-recheck-20261108.yml']
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Final authoritative DNS and email preservation
        shell: bash
        run: |
          set -euo pipefail
          for resolver in ns1.dyna-ns.net ns2.dyna-ns.net 1.1.1.1; do
            for host in lowcost-europa.eu www.lowcost-europa.eu; do
              [[ "$(dig +short @"$resolver" "$host" A | sort -u)" == 146.59.145.3 ]]
              [[ -z "$(dig +short @"$resolver" "$host" AAAA)" ]]
            done
            [[ "$(dig +short @"$resolver" lowcost-europa.eu MX)" == '0 webhost.dynadot.com.' ]]
            dig +short @"$resolver" lowcost-europa.eu TXT | grep -Fq 'v=spf1 mx include:webhost-mail-out.dynadot.com'
            dig +short @"$resolver" lowcost-europa.eu TXT | grep -Fq 'google-site-verification='
            dig +short @"$resolver" default._domainkey.lowcost-europa.eu CNAME | grep -Fq 'clients._domainkey.webhost.dynadot.com.'
            dig +short @"$resolver" _dmarc.lowcost-europa.eu TXT | grep -Fq 'v=DMARC1; p=none'
          done
          echo LOWCOST_FINAL_DNS_AND_EMAIL=PASS
      - name: Verify pinned VPS SSH host identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/khost"
          chmod 600 "$RUNNER_TEMP/khost"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/khost" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          echo LOWCOST_INDEPENDENT_HOST_PIN=PASS
      - name: Certify running IndexNow without repeating deployment
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/khost" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          root=/srv/projects/lowcost-europa
          current=280fca9dd5ea1b99b734f33df78b8fdd985731e0
          target=2d5a38acc80964535ae3658501d3ae1330e5936e
          g() { git -c "safe.directory=$root" -C "$root" "$@"; }
          [[ "$(g rev-parse HEAD)" == "$current" ]]
          changes="$(g status --porcelain=v1 --untracked-files=no)"
          [[ -z "$changes" ]]
          GIT_TERMINAL_PROMPT=0 g fetch origin main >/dev/null 2>&1
          [[ "$(g rev-parse origin/main)" == "$target" ]]
          g merge-base --is-ancestor "$current" "$target"
          runtime_changes="$(g diff --name-only "$current" "$target" -- . ':(exclude)PROJECT_STATE.md' ':(exclude)docs/operations/international-search-20261108.md')"
          [[ -z "$runtime_changes" ]]
          g checkout --detach "$target" >/dev/null 2>&1
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-indexnow.timer
          systemctl is-enabled --quiet lowcost-europa-indexnow.timer
          nginx -t >/dev/null 2>&1
          curl -fsS --max-time 20 -H 'Host: www.lowcost-europa.eu' -H 'X-Forwarded-Proto: https' http://127.0.0.1:8001/health/ready/ >/dev/null
          [[ "$(stat -c %a "$root/.legal/operator.json")" == 600 ]]
          [[ "$(stat -c %a "$root/.indexnow")" == 700 ]]
          changes="$(g status --porcelain=v1 --untracked-files=no)"
          [[ -z "$changes" ]]
          journalctl -u lowcost-europa-indexnow.service --since '2026-11-08 00:30:00' --no-pager -o cat | grep '^INDEXNOW_'
          echo "SEARCH_FINAL_ALIGNED_SHA=$target"
          echo SEARCH_FINAL_DOCUMENTATION_ONLY=PASS
          echo SEARCH_FINAL_SERVICE_TIMER_HTTPS_PRIVACY=PASS
          echo SEARCH_FINAL_TRACKED_HYGIENE=PASS
          REMOTE
