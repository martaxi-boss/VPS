name: Lowcost Cavitation three owner affiliate links preflight 20261111
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-three-manual-links-preflight-20261111.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-manual-cavitation-links-preflight
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - name: Pinned SSH read-only verify product identities and Cavitation capacity
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          test -d "$ROOT/.git" && test -s "$ENVFILE" && test ! -L "$ENVFILE"
          echo "PRECHECK_PROD_SOURCE_SHA=$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)"
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          test "$(systemctl show lowcost-europa.service -p User --value)" = le001_1789265592
          systemctl is-active --quiet lowcost-europa.service
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u le001_1789265592 -- "$ROOT/.venv/bin/python" - <<'PY'
          import django
          from decimal import Decimal
          django.setup()
          from apps.catalog.models import Offer, OfferClick, OfferFamilyPlacement, ProductFamily
          from apps.catalog.services.public_eligibility import public_eligibility_q,MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY
          from apps.catalog.services.manual_candidate_intake import resolve_aliexpress_product_url
          from apps.integrations.aliexpress.client import AliExpressClient
          urls=(
            "https://s.click.aliexpress.com/e/_c392x2Vp",
            "https://s.click.aliexpress.com/e/_c3yCICGf",
            "https://s.click.aliexpress.com/e/_c3gNtzPv",
          )
          assert len(urls)==3 and len(set(urls))==3
          family=ProductFamily.objects.get(slug="cavitacao-rf-vacuum-corpo")
          placements=OfferFamilyPlacement.objects.filter(product_family=family)
          published=placements.filter(offer__in=Offer.objects.filter(public_eligibility_q()))
          print("CAVITATION_ACTUAL_PLACEMENTS="+str(placements.count()))
          print("CAVITATION_PUBLIC_PLACEMENTS="+str(published.count()))
          print("CAVITATION_OWNER_MANUAL_VISIBLE="+str(published.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()))
          print("CAVITATION_MAX_VISIBLE="+str(MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY))
          assert published.count()==17 and published.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()==17
          test=Offer.objects.get(pk=212,source=Offer.Source.ALIEXPRESS_OWNER,external_product_id="1005013114375206")
          assert test.owner_hidden and test.affiliate_url=="https://s.click.aliexpress.com/e/_c3XC3lgL"
          print("CAVITATION_HIDDEN_TEST_212_PLACEMENTS="+str(placements.filter(offer=test).count()))
          print("CAVITATION_HIDDEN_TEST_CLICKS_PRESERVED="+str(OfferClick.objects.filter(offer=test).count()))
          original=dict(published.values_list("offer__external_product_id","offer__affiliate_url"))
          assert len(original)==17 and len(set(original.values()))==17
          assert original.get("1005013070854347")=="https://s.click.aliexpress.com/e/_c3qslKyf"
          print("CAVITATION_ORIGINAL_17_LINKS=PASS")
          client=AliExpressClient()
          ids=[]
          for n,url in enumerate(urls,1):
              pid,canonical=resolve_aliexpress_product_url(url)
              assert pid.isdigit() and canonical=="https://www.aliexpress.com/item/"+pid+".html"
              assert not Offer.objects.filter(external_product_id=pid).exists(),(n,"EXISTING_PRODUCT")
              assert not Offer.objects.filter(affiliate_url=url).exists(),(n,"EXISTING_LINK")
              details=client.get_product_detail(pid,"PT","EUR")
              assert str(details.product_id)==pid
              assert details.title and str(details.title).strip()
              assert details.price is not None and Decimal(str(details.price))>0 and details.currency=="EUR"
              ids.append(pid)
              print("NEW_LINK_"+str(n)+"_RESOLVED_ID="+pid)
              print("NEW_LINK_"+str(n)+"_TITLE="+str(details.title).replace("\n"," ")[:120])
              print("NEW_LINK_"+str(n)+"_EUR_PRICE="+str(details.price))
          assert len(set(ids))==3
          print("NEW_LINKS_DISTINCT_AND_PRICE_VERIFIED=PASS_3")
          PY
          echo CAVITATION_THREE_LINKS_READONLY_PREFLIGHT=PASS
          REMOTE
