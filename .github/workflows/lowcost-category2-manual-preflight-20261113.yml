name: Lowcost category 2 manual AliExpress link intake preflight 20261113
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-category2-manual-preflight-20261113.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-prod-automation-controls
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Pinned SSH verify current microdermo storefront and services
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          cd "$ROOT"
          test "$(git -c safe.directory="$ROOT" rev-parse HEAD)" = '4c6e75e566dcf317624285fe4f92d5cbdd6ec2dc'
          test -z "$(git -c safe.directory="$ROOT" status --porcelain=v1 --untracked-files=no)"
          test "$(git -c safe.directory="$ROOT" ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = '4c6e75e566dcf317624285fe4f92d5cbdd6ec2dc'
          nginx -t >/dev/null 2>&1
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-cavitation-availability.timer
          systemctl is-active --quiet lowcost-europa-affiliate-report.timer
          systemctl is-active --quiet lowcost-europa-indexnow.timer
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          set -a
          . "$ROOT/private/systemd-env/lowcost-europa.env"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PY'
          import django
          django.setup()
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement,ProductFamily
          from apps.catalog.services.manual_storefront import MANUAL_ONLY_FAMILY_SLUGS
          from apps.catalog.services.public_eligibility import MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY,public_eligibility_q
          slug='hydrodermoabrasao-aqua-facial-multifuncoes'
          assert slug in MANUAL_ONLY_FAMILY_SLUGS
          family=ProductFamily.objects.get(slug=slug)
          qs=OfferFamilyPlacement.objects.filter(product_family=family)
          total=qs.count()
          eligible=qs.filter(public_eligibility_q(prefix='offer__')).count()
          owner=qs.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()
          print('CATEGORY_TWO_NAME='+family.name)
          print('CATEGORY_TWO_STATUS='+family.status)
          print('CATEGORY_TWO_PLACEMENTS='+str(total))
          print('CATEGORY_TWO_PUBLIC='+str(eligible))
          print('CATEGORY_TWO_MANUAL_LINKS='+str(owner))
          print('CATEGORY_TWO_REMAINING_SLOTS='+str(MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY-total))
          print('TOTAL_MANUAL_CATEGORY_PLACEMENTS='+str(OfferFamilyPlacement.objects.filter(product_family__slug__in=MANUAL_ONLY_FAMILY_SLUGS).count()))
          print('HISTORICAL_CLICKS='+str(OfferClick.objects.count()))
          assert total==owner and total+7<=MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY
          assert eligible==total
          assert family.status!=ProductFamily.Status.RETIRED
          print('CATEGORY_TWO_ADD_SEVEN_READY=PASS')
          PY
          echo VPS_GITHUB_CODE_SYNC_AND_SERVICES=PASS
          REMOTE
