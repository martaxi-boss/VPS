name: PINK direct functional proof
on:
  push:
    branches: ["builder/pink-direct-proof"]
    paths: ["ops/pink_direct_artifact.py", ".github/workflows/pink-direct-proof.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: pink-actual-ui-proof-060
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.source.outputs.artifact_id }}
      source_run: ${{ steps.source.outputs.source_run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require exact green source CI and artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ops/pink_direct_artifact.py metadata
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ env.PINK_DIRECT_ARTIFACT }}
          repository: martaxi-boss/pink-iptv
          run-id: ${{ env.PINK_DIRECT_RUN }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/pink056-artifact
      - name: Verify exact APK/source integrity and prepare bounded emulator
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pink056-artifact"
          sha256sum -c SHA256SUMS
          python - <<'PYCODE'
          import json
          from pathlib import Path
          import os,sys
          sys.path.insert(0,os.environ['GITHUB_WORKSPACE'])
          from ops.pink_direct_artifact import SOURCE
          assert json.loads(Path('provenance.json').read_text())['implementation_sha']==SOURCE
          PYCODE
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: reactivecircus/android-emulator-runner
          ref: 1dcd0090116d15e7c562f8db72807de5e036a4ed
          path: _pink060_emulator_runner
          persist-credentials: false
      - name: Verify and pin certified emulator acquisition
        run: python ops/pink_ui_060_runner.py _pink060_emulator_runner
      - name: Real authorized account, Android enrollment, catalog and decoded playback
        uses: ./_pink060_emulator_runner
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        with:
          emulator-build: 16428233
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -dns-server 1.1.1.1
          script: bash ops/pink_ui_060_emulator.sh

  delivery:
    needs: proof
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.proof.outputs.artifact_id }}
          repository: martaxi-boss/pink-iptv
          run-id: ${{ needs.proof.outputs.source_run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/pink-deliverable
      - name: Verify exact tested APK and prepare delivery bytes
        id: package
        env:
          PINK_DIRECT_ARTIFACT: ${{ needs.proof.outputs.artifact_id }}
          PINK_DIRECT_RUN: ${{ needs.proof.outputs.source_run }}
        run: python ops/pink_direct_delivery.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PINK-direct-APK-manifest
          path: ${{ runner.temp }}/pink-direct-delivery/manifest.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PINK-direct-tested-APK
          path: ${{ runner.temp }}/pink-direct-delivery/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ fromJSON(steps.package.outputs.part_count) > 0 }}
        with:
          name: PINK-direct-APK-part-00
          path: ${{ runner.temp }}/pink-direct-delivery/part-00
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
