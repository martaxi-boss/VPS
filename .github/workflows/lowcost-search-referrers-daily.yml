name: Lowcost local referrers - free private hourly report
on:
  push:
    paths:
      - .github/workflows/lowcost-search-referrers-daily.yml
  schedule:
    - cron: '31 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lowcost-search-referrers-private
  cancel-in-progress: false
jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify existing pinned SSH host
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
      - name: Aggregate only sanitized counts inside Lowcost project
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          LOG=/var/log/nginx/lowcost-europa.access.log
          REPORT="$ROOT/.local-metrics/search-referrers.json"
          test -s "$LOG" && test -d "$ROOT/.git"
          git -c safe.directory="$ROOT" -C "$ROOT" merge-base --is-ancestor 12cc13933e7d4a14d27debd51148dc2bb173ef3e HEAD
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          systemctl is-active --quiet lowcost-europa.service
          nginx -t >/dev/null 2>&1
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          test -d "$ROOT/.local-metrics" && test ! -L "$ROOT/.local-metrics"
          cd "$ROOT"
          python3 -m apps.catalog.services.search_referral_metrics --log-dir /var/log/nginx --output "$REPORT"
          chown "$APPUSER:$APPUSER" "$REPORT"
          chmod 600 "$REPORT"
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYVERIFY'
          from pathlib import Path
          from apps.catalog.services.search_referral_metrics import read_private_report
          report=read_private_report(Path('/srv/projects/lowcost-europa/.local-metrics/search-referrers.json'))
          assert report is not None
          print('PRIVATE_SEARCH_REPORT_READABLE=PASS')
          PYVERIFY
          systemctl is-active --quiet lowcost-europa.service
          echo LOCAL_SEO_REFERRER_DAILY=PASS
          echo LOCAL_SEO_REFERRER_HOURLY=PASS
          REMOTE
      - name: Public HTTPS and SEO canary - read only
        shell: bash
        run: |
          set -euo pipefail
          origin='https://www.lowcost-europa.eu'
          # Lightweight external checks; do not read or publish private metrics.
          for path in / /pt/ /es/ /pt/products/hifu/ /pt/products/pressoterapia-vacuum-drenagem/ /robots.txt /sitemap.xml /sitemap.txt /favicon.ico; do
            if ! response="$(curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code} %{time_total}' "$origin$path")"; then
              echo "::error::LOWCOST_PUBLIC_CONNECT_FAILURE path=$path"
              exit 1
            fi
            read -r code elapsed <<< "$response"
            if [[ "$code" != "200" ]]; then
              echo "::error::LOWCOST_PUBLIC_HTTP_NOT_200 path=$path code=$code"
              exit 1
            fi
            printf 'LOWCOST_PUBLIC path=%s http=%s seconds=%s\n' "$path" "$code" "$elapsed"
          done
          sitemap="$(mktemp)"
          robots="$(mktemp)"
          home="$(mktemp)"
          trap 'rm -f "$sitemap" "$robots" "$home"' EXIT
          curl --fail --silent --show-error --location --max-time 30 "$origin/sitemap.xml" -o "$sitemap"
          curl --fail --silent --show-error --location --max-time 30 "$origin/robots.txt" -o "$robots"
          curl --fail --silent --show-error --location --max-time 30 "$origin/pt/" -o "$home"
          python3 - "$sitemap" "$robots" "$home" <<'PYCHECK'
          from pathlib import Path
          from sys import argv
          from urllib.parse import urlsplit
          from xml.etree import ElementTree

          xml = ElementTree.parse(argv[1]).getroot()
          locations = [
              node.text.strip() for node in xml.iter()
              if node.tag.rsplit('}', 1)[-1] == 'loc' and node.text
          ]
          if len(locations) != 23 or len(set(locations)) != 23:
              raise SystemExit("LOWCOST_SITEMAP_23_URLS=FAIL")
          if any(urlsplit(url).scheme != "https"
                 or urlsplit(url).netloc != "www.lowcost-europa.eu"
                 for url in locations):
              raise SystemExit("LOWCOST_SITEMAP_CANONICAL_DOMAIN=FAIL")
          robots = Path(argv[2]).read_text(encoding="utf-8")
          if "sitemap" not in robots.lower():
              raise SystemExit("LOWCOST_ROBOTS_SITEMAP=FAIL")
          home = Path(argv[3]).read_text(encoding="utf-8")
          if 'name="viewport"' not in home or 'rel="canonical"' not in home:
              raise SystemExit("LOWCOST_MOBILE_META_CANONICAL=FAIL")
          if '<meta name="robots" content="noindex' in home.lower():
              raise SystemExit("LOWCOST_PUBLIC_PT_NOINDEX=FAIL")
          print("LOWCOST_SITEMAP_23_URLS=PASS")
          print("LOWCOST_ROBOTS_SITEMAP=PASS")
          print("LOWCOST_MOBILE_META_CANONICAL=PASS")
          print("LOWCOST_PUBLIC_SEO_CANARY=PASS")
          PYCHECK
