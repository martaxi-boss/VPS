name: Lowcost local SEO referrers - free private daily report
on:
  schedule:
    - cron: '29 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lowcost-search-referrers-private
  cancel-in-progress: false
jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify existing pinned SSH host
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
      - name: Aggregate only sanitized counts inside Lowcost project
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          LOG=/var/log/nginx/lowcost-europa.access.log
          REPORT="$ROOT/.local-metrics/search-referrers.json"
          test -s "$LOG" && test -d "$ROOT/.git"
          git -c safe.directory="$ROOT" -C "$ROOT" merge-base --is-ancestor 12cc13933e7d4a14d27debd51148dc2bb173ef3e HEAD
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          systemctl is-active --quiet lowcost-europa.service
          nginx -t >/dev/null 2>&1
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          test -d "$ROOT/.local-metrics" && test ! -L "$ROOT/.local-metrics"
          cd "$ROOT"
          python3 -m apps.catalog.services.search_referral_metrics --log-dir /var/log/nginx --output "$REPORT"
          chown "$APPUSER:$APPUSER" "$REPORT"
          chmod 600 "$REPORT"
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYVERIFY'
          from pathlib import Path
          from apps.catalog.services.search_referral_metrics import read_private_report
          report=read_private_report(Path('/srv/projects/lowcost-europa/.local-metrics/search-referrers.json'))
          assert report is not None
          print('PRIVATE_SEARCH_REPORT_READABLE=PASS')
          PYVERIFY
          systemctl is-active --quiet lowcost-europa.service
          echo LOCAL_SEO_REFERRER_DAILY=PASS
          REMOTE
