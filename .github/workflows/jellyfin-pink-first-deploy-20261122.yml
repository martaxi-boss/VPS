name: Jellyfin Pink - isolated first deployment and TLS
on:
  push:
    branches: [main]
    paths:
      - 'ops/jellyfin_20261122_deploy.sh'
      - '.github/workflows/jellyfin-pink-first-deploy-20261122.yml'
permissions:
  contents: read
concurrency:
  group: jellyfin-pink-isolated-install
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate deploy script and host identity
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/jellyfin_20261122_deploy.sh
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/known-hosts"
          chmod 600 "$RUNNER_TEMP/known-hosts"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/known-hosts" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          echo JELLYFIN_PINNED_HOST=PASS
      - name: Run isolated installation via existing VPS SSH credentials
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known-hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=20 \
            ubuntu@146.59.145.3 'sudo -n bash -s' < ops/jellyfin_20261122_deploy.sh
      - name: Verify external HTTPS and Jellyfin public service info
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 20 https://serveriptv.duckdns.org/System/Info/Public -o "$RUNNER_TEMP/jellyfin-info.json"
          python3 - "$RUNNER_TEMP/jellyfin-info.json" <<'PY'
          import json,sys
          info=json.load(open(sys.argv[1]))
          assert info.get('StartupWizardCompleted') is True
          assert str(info.get('Version','')).startswith('12.4')
          print('JELLYFIN_EXTERNAL_PUBLIC_INFO=PASS')
          PY
          echo JELLYFIN_EXTERNAL_TLS=PASS
