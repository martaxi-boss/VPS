name: Codex - ChatGPT bridge

# Owner-authored [codex audit] Issues trigger the existing VPS Codex login.
# No ChatGPT auth tokens leave the VPS. No deploys, edits or PRs in phase one.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      task:
        description: Read-only audit prompt for the VPS repository
        required: true
        type: string
      mode:
        description: Read-only audit (fix is not enabled)
        required: false
        default: audit
        type: choice
        options: [audit]
      source:
        description: Task source, default manual
        required: false
        default: manual
        type: choice
        options: [manual, telegram]
      issue_number:
        description: Telegram-created GitHub issue for result reporting
        required: false
        default: ''
        type: string
      image_file_id:
        description: Telegram image reference for a private authorized screenshot
        required: false
        default: ''
        type: string
      image_ext:
        description: Image file type jpg, png, or webp
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: codex-vps-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[codex audit]')) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.actor == github.repository_owner ||
        (github.actor == 'github-actions[bot]' &&
         inputs.source == 'telegram' && inputs.mode == 'audit' &&
         inputs.issue_number != '')))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify issue and prompt for Telegram-issued requests
        if: github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          TASK: ${{ inputs.task }}
          TELEGRAM_IMAGE_ID: ${{ inputs.image_file_id }}
          TELEGRAM_IMAGE_EXT: ${{ inputs.image_ext }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          python3 - <<'PY'
          import hashlib, json, os, re, urllib.request
          issue_no = os.environ['ISSUE_NUMBER']
          repo = os.environ['REPO']
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{issue_no}",
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=20) as f:
              issue = json.load(f)
          title = issue.get('title','')
          body = issue.get('body') or ''
          prefix = '## Pedido ao Codex (auditoria, sem alterações)\n\n'
          task = os.environ.get('TASK','').strip()
          if (issue.get('user',{}).get('login') != 'github-actions[bot]' or
                  not title.startswith('[codex audit] Telegram ') or
                  '<!-- telegram-update:' not in body or
                  prefix not in body or
                  body.split(prefix,1)[1].strip() != task):
              raise SystemExit('Telegram request failed authorization checks')
          image_id = os.environ.get('TELEGRAM_IMAGE_ID', '')
          image_ext = os.environ.get('TELEGRAM_IMAGE_EXT', '')
          if image_id:
              if (not re.fullmatch(r'[A-Za-z0-9_-]{8,256}', image_id) or
                      image_ext not in ('jpg', 'png', 'webp')):
                  raise SystemExit('Invalid image metadata')
              hashed = hashlib.sha256(image_id.encode('ascii')).hexdigest()
              expected = ('<!-- telegram-image-sha256:' + hashed +
                          ':' + image_ext + ' -->')
              if expected not in body:
                  raise SystemExit('Telegram image does not match authorized issue')
          elif image_ext or '<!-- telegram-image-sha256:' in body:
              raise SystemExit('Telegram image metadata mismatch')
          PY

      - name: Prepare task as a data file, not a shell command
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          DISPATCH_TASK: ${{ inputs.task }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          task = (os.environ.get('ISSUE_BODY') if os.environ['GITHUB_EVENT_NAME'] == 'issues'
                  else os.environ.get('DISPATCH_TASK')) or ''
          if not task.strip() or len(task) > 15000:
              raise SystemExit('Task must contain 1-15000 characters')
          (Path(os.environ['RUNNER_TEMP']) / 'codex-task.txt').write_text(
              task.strip() + '\n', encoding='utf-8')
          PY

      - name: Privately download Telegram screenshot to temporary runner
        if: github.event_name == 'workflow_dispatch' && inputs.source == 'telegram' && inputs.image_file_id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CODEX_IMAGE_FILE_ID: ${{ inputs.image_file_id }}
          CODEX_IMAGE_EXT: ${{ inputs.image_ext }}
        shell: bash
        run: |
          set -euo pipefail
          ext="$CODEX_IMAGE_EXT"
          case "$ext" in jpg|png|webp) ;; *) echo "Unsupported image extension"; exit 1;; esac
          export CODEX_IMAGE_OUTPUT="$RUNNER_TEMP/codex-input.$ext"
          python3 ops/telegram_gateway.py download

      - name: Check existing VPS credential and install sshpass
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || { echo '::error::Missing VPS_SSH_PASSWORD'; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass > /dev/null

      - name: Stage private work directory on VPS
        id: stage
        env:
          CODEX_IMAGE_EXT: ${{ inputs.image_ext }}
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          job="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote="ubuntu@146.59.145.3"
          dest="/home/ubuntu/codex-bridge/jobs/$job"
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$remote" "install -d -m 700 '$dest'"
          sshpass -e scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$RUNNER_TEMP/codex-task.txt" ops/codex-vps-remote.sh "$remote:$dest/"
          ext="$CODEX_IMAGE_EXT"
          if [ -n "$ext" ]; then
            case "$ext" in jpg|png|webp) ;; *) exit 1;; esac
            test -s "$RUNNER_TEMP/codex-input.$ext"
            # Only temporary runner -> private VPS job dir. Never upload to GitHub.
            sshpass -e scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "$RUNNER_TEMP/codex-input.$ext" "$remote:$dest/"
          fi

      - name: Run signed-in Codex CLI on disposable repository clone
        id: execute
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          job="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=5 \
            ubuntu@146.59.145.3 \
            "bash /home/ubuntu/codex-bridge/jobs/$job/codex-vps-remote.sh '$job'"

      - name: Retrieve audit report
        if: always() && steps.stage.outcome == 'success'
        id: collect
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          job="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sshpass -e scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "ubuntu@146.59.145.3:/home/ubuntu/codex-bridge/jobs/$job/report.md" \
            "$RUNNER_TEMP/codex-report.md"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-vps-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-report.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Return result to ChatGPT-visible GitHub Issue
        if: always() && (github.event_name == 'issues' || inputs.issue_number != '')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'codex-report.md'
          report = (p.read_text(encoding='utf-8', errors='replace') if p.exists()
                    else 'No report was generated. Check the workflow log.')
          msg = (f"**Codex VPS: {os.environ['JOB_STATUS']}**\n\n" + report[:18000] +
                 f"\n\n[Details]({os.environ['RUN_URL']})\n")
          (p.parent / 'issue-comment.md').write_text(msg, encoding='utf-8')
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/issue-comment.md"

      - name: Deliver complete Codex result to private Telegram chat
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CODEX_JOB_STATUS: ${{ job.status }}
          CODEX_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          CODEX_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CODEX_REPORT_PATH: ${{ runner.temp }}/codex-report.md
        run: python3 ops/telegram_gateway.py notify

      - name: Clean completed temporary VPS directory
        if: always() && steps.execute.outcome == 'success' && steps.collect.outcome == 'success'
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          job="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            ubuntu@146.59.145.3 \
            "rm -rf -- /home/ubuntu/codex-bridge/jobs/$job"
