name: Sexshop Sevelora - VPS preflight read only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sexshop-preflight-20261116.yml
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Confirm pinned host identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/known_hosts"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          echo SEXSHOP_HOST_PIN=PASS
      - name: Inspect only Sexshop isolation, DNS and web prerequisites
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || { echo SEXSHOP_SSH_SECRET_MISSING; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=20 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT=/srv/projects/Sexshop
          DOMAIN=sexy-shop.duckdns.org
          test -d /srv/projects
          echo 'SEXSHOP_PREFLIGHT_BEGIN=YES'
          if test -e "$ROOT"; then
            echo SEXSHOP_PROJECT_PATH=EXISTS
            test ! -L "$ROOT" && echo SEXSHOP_PROJECT_SYMLINK=NO
          else
            echo SEXSHOP_PROJECT_PATH=ABSENT
          fi
          if command -v nginx >/dev/null 2>&1; then
            echo SEXSHOP_NGINX_BIN=YES
            nginx -t >/dev/null 2>&1 && echo SEXSHOP_NGINX_CONFIG=PASS || echo SEXSHOP_NGINX_CONFIG=FAIL
            systemctl is-active --quiet nginx && echo SEXSHOP_NGINX_SERVICE=ACTIVE || echo SEXSHOP_NGINX_SERVICE=INACTIVE
            if nginx -T 2>/dev/null | grep -Fq "$DOMAIN"; then
              echo SEXSHOP_NGINX_DOMAIN_CONFIG=EXISTS
            else
              echo SEXSHOP_NGINX_DOMAIN_CONFIG=ABSENT
            fi
          else
            echo SEXSHOP_NGINX_BIN=NO
          fi
          command -v certbot >/dev/null 2>&1 && echo SEXSHOP_CERTBOT=YES || echo SEXSHOP_CERTBOT=NO
          test -d /etc/letsencrypt/live/"$DOMAIN" && echo SEXSHOP_CERT=EXISTS || echo SEXSHOP_CERT=ABSENT
          systemctl list-unit-files 'sexshop*' --no-pager --no-legend | grep -q . && echo SEXSHOP_SYSTEMD_UNIT=EXISTS || echo SEXSHOP_SYSTEMD_UNIT=ABSENT
          if ss -lnt "( sport = :3418 )" | grep -Fq ':3418'; then
            echo SEXSHOP_PORT3418=BUSY
          else
            echo SEXSHOP_PORT3418=FREE
          fi
          actual="$(getent ahostsv4 "$DOMAIN" | awk 'NR==1{print $1}')"
          test "$actual" = "146.59.145.3" && echo SEXSHOP_DNS_IPV4=PASS || echo "SEXSHOP_DNS_IPV4=FAIL"
          echo "SEXSHOP_ROOT_FREE_MB=$(df -Pm /srv/projects | awk 'NR==2{print $4}')"
          systemctl is-active --quiet lowcost-europa.service && echo LOWCOST_SERVICE=ACTIVE || echo LOWCOST_SERVICE=INACTIVE
          echo 'SEXSHOP_PREFLIGHT_END=YES'
          REMOTE