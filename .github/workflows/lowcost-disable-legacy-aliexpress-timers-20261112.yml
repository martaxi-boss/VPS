name: Lowcost disable legacy AliExpress discovery and maintenance safely 20261112
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-disable-legacy-aliexpress-timers-20261112.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-prod-automation-controls
  cancel-in-progress: false
jobs:
  disable:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Pinned SSH disable two legacy timers only and verify live services
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          cd "$ROOT"
          git -c safe.directory="$ROOT" diff --quiet
          test "$(git -c safe.directory="$ROOT" rev-parse HEAD)" = 'd0abb9473be0c6800cca551033d4907b9f8183c6'
          test "$(git -c safe.directory="$ROOT" ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = 'd0abb9473be0c6800cca551033d4907b9f8183c6'
          nginx -t >/dev/null
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-cavitation-availability.timer
          systemctl is-active --quiet lowcost-europa-affiliate-report.timer
          systemctl disable --now lowcost-europa-weekly-discovery.timer lowcost-europa-catalog-maintenance.timer
          systemctl stop lowcost-europa-weekly-discovery.service lowcost-europa-catalog-maintenance.service
          for unit in lowcost-europa-weekly-discovery.timer lowcost-europa-catalog-maintenance.timer; do
            ! systemctl is-active --quiet "$unit"
            state="$(systemctl is-enabled "$unit" 2>/dev/null || true)"
            test "$state" = disabled || test "$state" = masked
            echo "LEGACY_TIMER_$unit=DISABLED state=$state"
          done
          for unit in lowcost-europa-weekly-discovery.service lowcost-europa-catalog-maintenance.service; do
            ! systemctl is-active --quiet "$unit"
            echo "LEGACY_SERVICE_$unit=INACTIVE"
          done
          for unit in lowcost-europa.service lowcost-europa-affiliate-report.timer lowcost-europa-cavitation-availability.timer lowcost-europa-backup.timer lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer lowcost-europa-indexnow.timer; do
            systemctl is-active --quiet "$unit"
            echo "REQUIRED_UNIT_$unit=ACTIVE"
          done
          nginx -t >/dev/null
          echo LOWCOST_LEGACY_AUTOMATION_DISABLED=PASS
          echo LOWCOST_COUNTERS_AND_AVAILABILITY_PRESERVED=PASS
          REMOTE
