name: Ferrari F9 functional QGIS synthetic plot certification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ferrari-f9-functional-qgis-once-20261106.yml'
permissions:
  contents: read
concurrency:
  group: ferrari-f9-functional-qgis-real-plot
  cancel-in-progress: false
jobs:
  qgis-real-functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout pinned Ferrari QGIS real GIS certification source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 2442b478490c7c354b9e1d5d54d9664551fba01f
          persist-credentials: false
          path: ferrari
      - name: Verify real scenario code and negative tests
        run: |
          set -Eeuo pipefail
          python3 -m py_compile ferrari/install/vps-phase9-functional-qgis.py
          python3 -m unittest discover -s ferrari/tests -p test_phase9_functional_qgis.py -v
          echo F9_FUNCTIONAL_QGIS_SOURCE=PASS
      - name: Existing SSH pin, no server modifications
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS" || exit 2
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/f9-known-hosts"
          chmod 600 "$RUNNER_TEMP/f9-known-hosts"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/f9-known-hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' || exit 3
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          echo F9_PINNED_SSH=PASS
      - name: Execute synthetic parcel geometry & CPU render inside Ferrari
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes
                -o "UserKnownHostsFile=$RUNNER_TEMP/f9-known-hosts"
                -o GlobalKnownHostsFile=/dev/null
                -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          root=/srv/projects/skill-universal
          source="$root/.runtime/f9-gis-functional-$GITHUB_RUN_ID.py"
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            'test -d /srv/projects/skill-universal/.runtime && test ! -L /srv/projects/skill-universal'
          sshpass -e scp "${opts[@]}" ferrari/install/vps-phase9-functional-qgis.py \
            "ubuntu@146.59.145.3:$source"
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 'bash -s' -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ulimit -c 0
          root=/srv/projects/skill-universal
          run="$1"
          [[ "$run" =~ ^[0-9]+$ ]] || exit 4
          script="$root/.runtime/f9-gis-functional-$run.py"
          trap 'rm -f -- "$script"' EXIT
          test "$(id -un)" = ubuntu && test "$(id -u)" -ne 0
          test -f "$script" && test ! -L "$script"
          test "$(readlink -f "$root/current")" = "$root/releases/f1f3b03525adec7018d7d629243e7b0fbb7f5087" || exit 5
          test "$(dpkg-query -W -f='${Status}' qgis 2>/dev/null)" = 'install ok installed' || exit 6
          services=(pink-iptv-backend pink-vpn fadego-staging lowcost-europa
                    pm2-iptvpn-bot pm2-telegram-robot-leads nginx postgresql@16-main)
          for s in "${services[@]}"; do
            test "$(systemctl is-active "$s")" = active || { echo "F9_PRE_SERVICE_FAILED:$s"; exit 7; }
          done
          python3 "$script" --certify
          echo F9_QGIS_SYNTHETIC_REAL_GEOMETRY=PASS
          test "$(dpkg-query -W -f='${Status}' qgis 2>/dev/null)" = 'install ok installed' || exit 8
          for s in "${services[@]}"; do
            test "$(systemctl is-active "$s")" = active || { echo "F9_POST_SERVICE_FAILED:$s"; exit 9; }
          done
          test "$(readlink -f "$root/current")" = "$root/releases/f1f3b03525adec7018d7d629243e7b0fbb7f5087" || exit 10
          echo F9_PROTECTED_SERVICES=8_OF_8_PASS
          echo F9_QGIS_GLOBAL_APT_UNCHANGED=PASS
          echo F9_QGIS_FUNCTIONAL_OUTPUT_TEMP_CLEANED=PASS
          REMOTE
