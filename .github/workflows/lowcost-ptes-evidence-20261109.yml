name: Lowcost PT-ES commercial evidence - bounded live validation 20261109
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-ptes-evidence-20261109.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-commercial-evidence-20261109
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Existing pinned SSH to Lowcost only - aggregate safe results
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          APPUSER=le001_1789265592
          EXPECTED_SOURCE=371cce1eca6d75722f2fc02ccc2cc6471b58ccfd
          test -d "$ROOT/.git" && test -s "$ENVFILE" && test ! -L "$ENVFILE"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          test "$(systemctl show lowcost-europa.service -p User --value)" = "$APPUSER"
          for unit in lowcost-europa.service lowcost-europa-catalog-maintenance.timer lowcost-europa-indexnow.timer lowcost-europa-backup.timer lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer lowcost-europa-affiliate-report.timer; do
            systemctl is-active --quiet "$unit"
          done
          echo PRODUCTION_SHA_AND_SEVEN_UNITS=PASS
          test -f "$ROOT/data/offsite-backup.last-success"
          test ! -L "$ROOT/data/offsite-backup.last-success"
          test "$(stat -c %U:%G:%a "$ROOT/data/offsite-backup.last-success")" = root:root:600
          echo OFFSITE_LAST_SUCCESS_MARKER=PASS
          BACKUP="$(find "$ROOT/backups/daily" -maxdepth 1 -type f -name '*.dump' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if test -n "$BACKUP" && test -s "$BACKUP" && test -s "$BACKUP.sha256"; then
            (cd "$ROOT/backups/daily" && sha256sum -c "$(basename "$BACKUP.sha256")" >/dev/null)
            echo LOCAL_POSTGRES_BACKUP_CHECKSUM=PASS
            if command -v pg_restore >/dev/null 2>&1 && pg_restore --list "$BACKUP" >/dev/null 2>&1; then
              echo BACKUP_ARCHIVE_CATALOG_READABLE=PASS
            else
              echo BACKUP_ARCHIVE_CATALOG_READABLE=UNVERIFIED
            fi
          else
            echo LOCAL_POSTGRES_BACKUP_CHECKSUM=UNVERIFIED
          fi
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYLIVE'
          import django
          from datetime import timedelta
          from django.db.models import Exists, OuterRef, Q
          from django.utils import timezone
          django.setup()
          from apps.catalog.models import Offer, OfferObservation, ExternalMetricsSnapshot
          from apps.catalog.services.public_eligibility import public_eligibility_q, ALLOWED_SHIP_FROM_COUNTRIES
          from apps.catalog.services.market_observation import observe_market_offers
          from apps.catalog.services.affiliate_order_reporting import collect_affiliate_order_report, AffiliateOrderReportError
          from apps.integrations.aliexpress.exceptions import AliExpressError

          def audit(tag):
              now = timezone.now()
              published = Offer.objects.filter(public_eligibility_q(now), is_active=True, owner_hidden=False).distinct()
              es = OfferObservation.objects.filter(
                  offer_id=OuterRef('pk'), destination_country='ES',
                  observed_at__gte=now-timedelta(hours=24), observed_at__lte=now,
                  price__gt=0, currency__iexact='EUR')
              pt = OfferObservation.objects.filter(
                  offer_id=OuterRef('pk'), destination_country='PT',
                  observed_at__gte=now-timedelta(hours=24), observed_at__lte=now,
                  price__gt=0, currency__iexact='EUR')
              n = published.count()
              print(f'{tag}_PUBLIC_PT_GATE_COUNT={n}')
              print(f'{tag}_PT_MARKET_PRICE_EUR_COVERED={published.filter(Exists(pt)).count()}')
              print(f'{tag}_ES_MARKET_PRICE_EUR_COVERED={published.filter(Exists(es)).count()}')
              print(f'{tag}_ES_PRICE_UNCOVERED={published.exclude(Exists(es)).count()}')
              origin = published.filter(ship_from_country__in=ALLOWED_SHIP_FROM_COUNTRIES,
                          ship_from_verified_at__isnull=False,ship_from_verified_at__lte=now).count()
              print(f'{tag}_ORIGIN_EDITORIALLY_RECORDED={origin}')
              for country in ('PT', 'ES'):
                  delivery = OfferObservation.objects.filter(
                      offer_id=OuterRef('pk'), destination_country=country,
                      observed_at__gte=now-timedelta(hours=24),
                      observed_at__lte=now).filter(
                      Q(delivery_days__isnull=False) |
                      __import__('django').db.models.Q(search_delivery_days__isnull=False))
                  print(f'{tag}_{country}_RECENT_NUMERIC_DELIVERY_COVERED={published.filter(Exists(delivery)).count()}')
              return n

          first=audit('BEFORE')
          try:
              result=observe_market_offers(country='ES', limit=5, persist=True)
          except (AliExpressError, RuntimeError, ValueError) as exc:
              print('ES_SUPPLIER_PROBE=UNVERIFIED_'+type(exc).__name__)
          else:
              print('ES_SUPPLIER_PROBE=EXECUTED')
              for name in ('selected','attempts','persisted','eur_prices','numeric_delivery','response_unconfirmed'):
                  print('ES_PROBE_'+name.upper()+'='+str(result[name]))
          second=audit('AFTER')
          if second!=first:
              print('PUBLIC_PT_GATE_COUNT_CHANGED_DURING_PROBE=YES')
          else:
              print('PUBLIC_PT_GATE_COUNT_CHANGED_DURING_PROBE=NO')
          snapshot=ExternalMetricsSnapshot.objects.filter(source='ALIEXPRESS').first()
          print('ALIEXPRESS_EXISTING_AGGREGATE_SNAPSHOT_PRESENT='+str(bool(snapshot)))
          if snapshot is not None:
              print('ALIEXPRESS_SNAPSHOT_AGE_HOURS='+str(round((timezone.now()-snapshot.checked_at).total_seconds()/3600, 1)))
          try:
              report,_,_=collect_affiliate_order_report(days=30)
          except (AffiliateOrderReportError, AliExpressError, RuntimeError, ValueError) as exc:
              print('LIVE_READONLY_AFFILIATE_ORDERS=UNVERIFIED_'+type(exc).__name__)
          else:
              print('LIVE_READONLY_AFFILIATE_ORDERS=PASS')
              print('AFFILIATE_ORDERS_ANY_PAID='+('YES' if report['paid_count'] else 'NO'))
              print('AFFILIATE_ORDERS_ANY_RECEIVED='+('YES' if report['received_count'] else 'NO'))
              site_group=next((r for r in report['by_tracking'] if r['tracking_id']=='lowcost_europa'),None)
              print('SITE_TRACKING_PAID_OR_RECEIVED='+('YES' if site_group and (site_group['paid_count'] or site_group['received_count']) else 'NO'))
              print('CAMPAIGN_TO_SALE_ATTRIBUTION=NOT_PROVEN')
          print('REAL_SKU_STOCK_AND_SHIPPING=NOT_CERTIFIED_BY_AFFILIATE_API')
          print('FULL_OFFSITE_RESTORE=NOT_TESTED')
          PYLIVE
          for unit in lowcost-europa.service lowcost-europa-catalog-maintenance.timer lowcost-europa-indexnow.timer lowcost-europa-backup.timer lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer lowcost-europa-affiliate-report.timer; do
            systemctl is-active --quiet "$unit"
          done
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$EXPECTED_SOURCE"
          echo LOWCOST_BOUNDED_VENDOR_VALIDATION=COMPLETE_WITH_EXPLICIT_LIMITATIONS
          REMOTE
