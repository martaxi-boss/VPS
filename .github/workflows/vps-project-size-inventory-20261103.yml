name: VPS Projects and Disk Sizes - read only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-project-size-inventory-20261103.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify pinned VPS SSH host key
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/known-hosts"
          chmod 600 "$RUNNER_TEMP/known-hosts"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/known-hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
      - name: Fetch live VPS project and storage inventory without changing server files
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known-hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=20 \
            ubuntu@146.59.145.3 'sudo -n bash -s' > "$RUNNER_TEMP/vps-project-inventory.txt" <<'REMOTE'
          set -u
          echo '=== DATE_UTC ==='
          date -u +%FT%TZ
          echo '=== DISK_USAGE ==='
          df -hT /
          echo '=== BIG_ROOT_DIRECTORIES_BYTES ==='
          for root in /home /opt /srv /root /var /usr/local; do
            echo "--- $root ---"
            timeout 180 du -x -B1 --max-depth=1 "$root" 2>/dev/null || echo "INCOMPLETE $root"
          done
          echo '=== PROJECT_DIRECTORIES_BYTES ==='
          for root in /home/ubuntu /home/ubuntu/.local/share /home/ubuntu/.local/share/motor-ferrari /home/ubuntu/.local/share/rea-chatgpt-trial /opt /srv /var/www /root /var/lib /var/cache /var/log; do
            if [ -d "$root" ]; then
              echo "--- $root ---"
              timeout 120 du -x -B1 --max-depth=1 "$root" 2>/dev/null || echo "INCOMPLETE $root"
            fi
          done
          echo '=== FERRARI_NESTED_USAGE_BYTES ==='
          FERRARI=/home/ubuntu/.local/share/motor-ferrari
          for root in "$FERRARI/.runtime" "$FERRARI/.runtime/venvs" "$FERRARI/.runtime/venvs/extended" "$FERRARI/.runtime/npm" "$FERRARI/.runtime/npm-cache" "$FERRARI/.runtime/browsers" "$FERRARI/tools" "$FERRARI/runtimes" "$FERRARI/releases"; do
            if [ -d "$root" ]; then
              echo "--- $root ---"
              timeout 160 du -x -B1 --max-depth=1 "$root" 2>/dev/null || echo "INCOMPLETE $root"
            fi
          done
          echo '=== FERRARI_CURRENT_RELEASE ==='
          if [ -L "$FERRARI/current" ]; then readlink -f "$FERRARI/current"; fi
          echo '=== FERRARI_RUNTIME_LARGEST_FILES ==='
          if [ -d "$FERRARI/.runtime" ]; then
            timeout 180 find "$FERRARI/.runtime" -xdev -type f -size +100M -printf '%s|%p\n' 2>/dev/null | sort -nr | head -n 35 || :
          fi
          echo '=== FERRARI_PYTHON_ENV_PACKAGE_VERSIONS ==='
          python3 - <<'PY_FERRARI'
          from pathlib import Path
          from importlib import metadata
          root=Path('/home/ubuntu/.local/share/motor-ferrari/.runtime/venvs/extended')
          chosen=('torch','torchvision','torchaudio','numpy','transformers','docling','gradio','faster-whisper','prefect','pydantic','opencv-python','streamlit','polars','duckdb')
          if root.is_dir():
              for v in sorted(root.iterdir()):
                  if not v.is_dir() or v.is_symlink(): continue
                  found=[]
                  for site in list(v.glob('lib/python*/site-packages'))[:2]:
                      for dist in site.glob('*.dist-info'):
                          try:
                              nm=(dist/'METADATA').read_text(errors='replace').splitlines()[:10]
                              name=next((t.split(':',1)[1].strip().lower() for t in nm if t.lower().startswith('name:')),None)
                              version=next((t.split(':',1)[1].strip() for t in nm if t.lower().startswith('version:')),None)
                              if name in chosen:found.append(name+'='+str(version))
                          except (OSError, UnicodeError): pass
                  print(v.name+'|'+','.join(sorted(set(found))))
          PY_FERRARI
          echo '=== CROSS_PROJECT_REA_IDENTITIES_AND_SIZES ==='
          for root in /home/ubuntu/rea-final-runtime /home/ubuntu/rea-original-upstream-680 /home/ubuntu/rea-original-upstream-680-evidence /home/ubuntu/.local/share/rea-chatgpt-trial /home/ubuntu/.local/share/rea-optional-uv-0.13.6 /home/ubuntu/.local/share/motor-ferrari/.runtime/npm/rea /opt/android-sdk /root/.gradle /root/.android; do
            if [ -d "$root" ]; then
              echo "--- $root ---"
              timeout 120 du -x -B1 --max-depth=1 "$root" 2>/dev/null | sort -nr | head -n 32 || echo "INCOMPLETE $root"
            fi
          done
          echo '=== APT_MANUAL_MAIN_EXECUTABLES ==='
          apt-mark showmanual 2>/dev/null | grep -Ei 'ghidra|jadx|apktool|rizin|binwalk|radare|frida|nodejs|java|openjdk|python|gimp|kdenlive|krita|blender|qgis|inkscape|audacity|openshot|ffmpeg|docker|dotnet|android|libreoffice|scribus|ansible|gradle' | head -n 100 || :
          echo '=== CANDIDATE_GLOBAL_CACHE_USAGE_BYTES ==='
          for root in /var/cache/apt /var/cache/apt/archives /home/ubuntu/.npm /root/.npm /home/ubuntu/.cache /root/.cache /root/.gradle/caches /root/.android/cache /home/ubuntu/.local/share/motor-ferrari/.runtime/npm-cache; do
            if [ -d "$root" ]; then timeout 60 du -x -B1 -s "$root" 2>/dev/null || echo "INCOMPLETE $root"; fi
          done
          echo '=== SELECT_DUPLICATE_LIBRARY_HASHES ==='
          FERRARI=/home/ubuntu/.local/share/motor-ferrari/.runtime/venvs/extended
          for name in comfyui docling; do
            fp="$FERRARI/$name/lib/python3.12/site-packages/torch/lib/libtorch_cpu.so"
            if [ -f "$fp" ]; then
              stat -c "stat|%s|%d|%i|$name" "$fp"
              timeout 60 sha256sum "$fp" | awk -v n="$name" '{print "sha256|"n"|"$1}' || echo "HASH_TIMEOUT $name"
            fi
          done
          echo '=== REA_REFERENCES_IN_SYSTEM_CONFIG_NAMES_ONLY ==='
          python3 - <<'PY_REFS'
          from pathlib import Path
          needles={"rea-final-runtime":b"rea-final-runtime","rea-chatgpt-trial":b"rea-chatgpt-trial","rea-original-upstream-680":b"rea-original-upstream-680","ferrari-private-rea":b"motor-ferrari/.runtime/npm/rea"}
          places=[Path('/etc/systemd/system'),Path('/etc/cron.d'),Path('/etc/supervisor/conf.d'),Path('/root/.pm2/dump.pm2'),Path('/home/ubuntu/.pm2/dump.pm2'),Path('/home/ubuntu/.config')]
          rows=[]
          for root in places:
              try:
                  paths=[root] if root.is_file() else list(root.rglob('*'))[:4000]
              except (OSError,PermissionError): continue
              for p in paths:
                  try:
                      if p.is_symlink() or not p.is_file() or p.stat().st_size>2_000_000:continue
                      data=p.read_bytes()
                  except (OSError,PermissionError):continue
                  for label,needle in needles.items():
                      if needle in data:
                          rows.append((label,str(p)))
          for a,b in sorted(rows)[:120]:print(a+"|"+b)
          if not rows:print("no references in audited config locations")
          PY_REFS
          echo '=== REA_PROCESSES_AND_OPEN_CWD ==='
          python3 - <<'PY_PROC'
          from pathlib import Path
          names=('/home/ubuntu/rea-final-runtime/','/home/ubuntu/.local/share/rea-chatgpt-trial/','/home/ubuntu/rea-original-upstream-680/','/home/ubuntu/.local/share/motor-ferrari/')
          counters={s:0 for s in names}
          samples=[]
          for p in Path('/proc').iterdir():
              if not p.name.isdecimal():continue
              for member in ('cwd','exe'):
                  try:target=(p/member).readlink().as_posix()
                  except (OSError,PermissionError):continue
                  for base in names:
                      if target.startswith(base):
                          counters[base]+=1
                          if len(samples)<55:
                              try:comm=(p/'comm').read_text().strip()
                              except OSError:comm='unknown'
                              samples.append((p.name,comm,member,base))
          print("counts|"+repr(counters))
          for s in samples:print("|".join(s))
          PY_PROC
          echo '=== REA_AND_FERRARI_NPM_PACKAGE_VERSIONS ==='
          for p in /home/ubuntu/.local/share/motor-ferrari/.runtime/npm/rea/node_modules/rea-agents/package.json /home/ubuntu/rea-final-runtime/package.json /home/ubuntu/.local/share/rea-chatgpt-trial/repository/package.json /home/ubuntu/rea-original-upstream-680/package.json; do
            if [ -f "$p" ]; then
              python3 - "$p" <<'PY_PKG'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          try:
              j=json.loads(p.read_text())
              print(str(p)+"|name="+str(j.get('name'))+"|version="+str(j.get('version'))+"|packageManager="+str(j.get('packageManager')))
          except (OSError,ValueError):print(str(p)+"|unparseable")
          PY_PKG
            fi
          done
          echo '=== HOST_SYSTEM_TOOLS_VERSIONS ==='
          for cmd in apktool jadx ghidra node npm java python3 ffmpeg; do
            if command -v "$cmd" >/dev/null 2>&1;then echo "$cmd|$(command -v "$cmd")";fi
          done
          echo '=== REA_VENDOR_INDEPENDENCE_BREAKDOWN ==='
          for root in /home/ubuntu/rea-final-runtime/vendors /home/ubuntu/rea-final-runtime/optional /home/ubuntu/.local/share/rea-chatgpt-trial/tools; do
            if [ -d "$root" ];then
              echo "--- $root ---"
              timeout 120 du -x -B1 --max-depth=1 "$root" 2>/dev/null | sort -nr | head -n 30 || echo "INCOMPLETE $root"
            fi
          done
          echo '=== REA_MCP_TOOL_PARITY_SANITIZED ==='
          sudo -n -u ubuntu python3 - <<'PY_REA_COMPARE'
          import json,os,selectors,subprocess,tempfile,time
          from pathlib import Path
          root=Path('/home/ubuntu/.local/share/motor-ferrari')
          ferrari=str(root/'.runtime/npm/rea/node_modules/.bin/rea')
          old='/home/ubuntu/rea-final-runtime/bin/rea-mcp'
          def run_mcp(program):
              if not Path(program[0]).is_file():
                  return {'error':'executable_missing'}
              with tempfile.TemporaryDirectory(prefix='ferrari-rea-audit-') as home:
                  env=dict(os.environ)
                  env.update({'HOME':home,'TMPDIR':home,'XDG_CONFIG_HOME':home+'/.config',
                    'XDG_CACHE_HOME':home+'/.cache','JAVA_HOME':str(root/'runtimes/jdk-25.0.5_8'),
                    'GHIDRA_JAVA_HOME':str(root/'runtimes/jdk-25.0.5_8'),
                    'GHIDRA_INSTALL_DIR':str(root/'tools/ghidra-12.2'),
                    'PATH':str(root/'runtimes/node-22.23.4/bin')+':'+str(root/'runtimes/jdk-25.0.5_8/bin')+':'+env.get('PATH',''),
                    'REA_MCP_INPUT_SCHEMA_PROFILE':'compact','REA_MCP_OUTPUT_SCHEMA_PROFILE':'compact'})
                  with tempfile.TemporaryFile() as stderr:
                    p=subprocess.Popen(program,stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=stderr,env=env,start_new_session=True)
                    buffer=bytearray()
                    try:
                      with selectors.DefaultSelector() as selector:
                        selector.register(p.stdout,selectors.EVENT_READ)
                        def send(d):
                          p.stdin.write(json.dumps(d,separators=(',',':')).encode()+b'\n')
                          p.stdin.flush()
                        def receive(id,seconds):
                          deadline=time.monotonic()+seconds
                          while time.monotonic()<deadline:
                            while b'\n' in buffer:
                              line,_,tail=buffer.partition(b'\n');buffer[:]=tail
                              if not line.strip():continue
                              m=json.loads(line)
                              if isinstance(m,dict) and m.get('id')==id:return m
                            if p.poll() is not None:return {'error':'server_exited'}
                            if selector.select(timeout=min(1, max(.1,deadline-time.monotonic()))):
                              block=os.read(p.stdout.fileno(),1048576)
                              if not block:return {'error':'pipe_closed'}
                              buffer.extend(block)
                          return {'error':'timeout'}
                        send({'jsonrpc':'2.0','id':1,'method':'initialize','params':{
                          'protocolVersion':'2025-03-26','capabilities':{},
                          'clientInfo':{'name':'ferrari-dependency-audit','version':'1.0'}}})
                        init=receive(1,75)
                        if init.get('error'):return {'error':'initialize_'+str(type(init['error']).__name__)}
                        send({'jsonrpc':'2.0','method':'notifications/initialized'})
                        send({'jsonrpc':'2.0','id':2,'method':'tools/list'})
                        data=receive(2,85)
                        if data.get('error'):return {'error':'tools_list_'+str(type(data['error']).__name__)}
                        names={str(x.get('name')) for x in data.get('result',{}).get('tools',[]) if isinstance(x,dict)}
                        return {'count':len(names),'names':names}
                    except Exception as e:return {'error':type(e).__name__}
                    finally:
                      if p.poll() is None:
                        p.terminate()
                        try:p.wait(timeout=4)
                        except subprocess.TimeoutExpired:p.kill()
          old_result=run_mcp([old])
          new_result=run_mcp([ferrari,'mcp'])
          if 'error' in old_result or 'error' in new_result:
              print('old_status='+old_result.get('error','ready')+'|ferrari_status='+new_result.get('error','ready'))
          else:
              missing=sorted(old_result['names']-new_result['names'])
              added=sorted(new_result['names']-old_result['names'])
              print('old_count='+str(old_result['count'])+'|ferrari_count='+str(new_result['count']))
              print('exact_tool_name_parity='+str(not missing and not added))
              print('missing_in_ferrari_count='+str(len(missing))+'|examples='+','.join(missing[:24]))
              print('extra_in_ferrari_count='+str(len(added))+'|examples='+','.join(added[:24]))
          for name,cmd in [('ferrari_ghidra_doctor',[ferrari,'doctor','--provider','ghidra','--json']),
                           ('ferrari_provider_catalog',[ferrari,'providers','--json']),
                           ('ferrari_capabilities',[ferrari,'capabilities','--json'])]:
              with tempfile.TemporaryDirectory(prefix='ferrari-provider-audit-') as home:
                env=dict(os.environ)
                env.update({'HOME':home,'TMPDIR':home,'XDG_CONFIG_HOME':home+'/.config','XDG_CACHE_HOME':home+'/.cache',
                  'JAVA_HOME':str(root/'runtimes/jdk-25.0.5_8'),'GHIDRA_JAVA_HOME':str(root/'runtimes/jdk-25.0.5_8'),
                  'GHIDRA_INSTALL_DIR':str(root/'tools/ghidra-12.2'),
                  'PATH':str(root/'runtimes/node-22.23.4/bin')+':'+str(root/'runtimes/jdk-25.0.5_8/bin')+':'+env.get('PATH','')})
                try:
                  p=subprocess.run(cmd,env=env,capture_output=True,text=True,timeout=55)
                  print(name+'|exit='+str(p.returncode)+'|json_parse='+str(bool(p.stdout.strip().startswith('{') or p.stdout.strip().startswith('[')))+'|output_bytes='+str(len(p.stdout)))
                except (OSError,subprocess.TimeoutExpired) as e:
                  print(name+'|error='+type(e).__name__)
          PY_REA_COMPARE
          echo '=== TELEGRAM_PROJECT_DIRECTORY_BYTES ==='
          for root in /root/iptvpn_bot /opt/telegram-robot-leads /opt/.telegram-leads-previous-08ffc99ae8b1 /opt/telegram-leads-optin /home/ubuntu/telegram-leads-venv /root/migration-preserved /root/migration-20260923 /root/project-secrets/telegram-robot-leads /root/project-secrets/iptvpn_bot /home/ubuntu/.pm2 /root/.pm2; do
            if [ -d "$root" ]; then du -x -B1 -s "$root" 2>/dev/null; fi
          done
          echo '=== PROJECT_SYSTEMD_ACTIVE ==='
          systemctl --no-legend --no-pager --plain list-units --type=service --state=running 2>/dev/null | awk '{print $1}'
          echo '=== PROJECT_SYSTEMD_INSTALLED ==='
          systemctl --no-legend --no-pager --plain list-unit-files --type=service 2>/dev/null | grep -Ei 'telegram|iptv|leads|pink|ferrari|lowcost|fadego|rea|codex|vpn|supervisor|agent|project|pm2' || :
          echo '=== PM2_SAVED_CONFIGURATION ==='
          python3 - <<'PY'
          from pathlib import Path
          import json
          for user,home in (('root', '/root'),('ubuntu','/home/ubuntu')):
              fp=Path(home)/'.pm2'/'dump.pm2'
              if not fp.is_file():
                  print(user + '|no saved dump')
                  continue
              try:
                  apps=json.loads(fp.read_text())
                  for app in apps:
                      env=app.get('pm2_env') or {}
                      print('|'.join((user,str(app.get('name',env.get('name','?'))),str(env.get('pm_cwd',app.get('pm_cwd','?'))),str(env.get('status','unknown_in_saved_dump')))))
              except Exception: print(user+'|dump unreadable')
          PY
          echo '=== LIVE_RELEVANT_PROCESSES_SANITIZED ==='
          python3 - <<'PY'
          from pathlib import Path
          import os,pwd
          keywords=('telegram','iptvpn','leads','pink','fadego','lowcost','pm2','ferrari','rea','codex','supervisor','wg-quick','wireguard','valkey','prometheus','postgres','nginx','php-fpm')
          for p in Path('/proc').iterdir():
              if not p.name.isdigit(): continue
              try:
                  comm=(p/'comm').read_text().strip()
                  raw=(p/'cmdline').read_bytes().split(b'\0')
                  args=[s.decode('utf8','replace') for s in raw if s]
                  cwd=os.readlink(p/'cwd')
                  matching=[a for a in args[:4] if any(k in a.lower() for k in keywords) and not ('=' in a and not a.startswith('/'))]
                  tagged=any(k in cwd.lower() for k in keywords) or any(k in comm.lower() for k in keywords) or bool(matching)
                  if not tagged: continue
                  name=pwd.getpwuid(p.stat().st_uid).pw_name
                  print('|'.join((p.name,name,comm,cwd)))
              except (OSError,PermissionError,KeyError): pass
          PY
          echo '=== DOCKER_CONTAINERS_AND_SPACE ==='
          if command -v docker >/dev/null 2>&1; then
            docker ps -a --format '{{.Names}}|{{.Image}}|{{.Status}}' 2>/dev/null || :
            docker system df 2>/dev/null || :
          fi
          echo '=== ALL_APT_PACKAGES_NAME_VERSION_KIB ==='
          dpkg-query -W -f='${binary:Package}\t${Version}\t${Installed-Size}\n' 2>/dev/null | sort
          echo '=== NODE_PYTHON_RUNTIMES ==='
          for p in python3 node npm pm2 java git ffmpeg docker pip3 pandoc jadx apktool; do
            if command -v "$p" >/dev/null 2>&1; then printf '%s|%s\n' "$p" "$(command -v "$p")"; else printf '%s|NOT_ON_PATH\n' "$p"; fi
          done
          echo '=== FINISHED ==='
          REMOTE
          echo 'VPS_PROJECT_INVENTORY_RETURNED=PASS'
          grep -q '^=== FINISHED ===' "$RUNNER_TEMP/vps-project-inventory.txt"
          cat "$RUNNER_TEMP/vps-project-inventory.txt"
      - name: Upload full live inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vps-project-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/vps-project-inventory.txt
          if-no-files-found: warn
          retention-days: 7
