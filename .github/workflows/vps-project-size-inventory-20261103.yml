                  stat=(p/'status').read_text(errors='replace')
                  parent=next((int(x.split(':',1)[1].strip()) for x in stat.splitlines() if x.startswith('PPid:')),0)
                  user=pwd.getpwuid(p.stat().st_uid).pw_name
                  cwd=os.readlink(p/'cwd')
                  exe=os.readlink(p/'exe')
                  procs[int(p.name)]=(n,parent,user,cwd,exe)
              except (OSError,PermissionError,KeyError,ValueError):pass
          for pid,(name,parent,user,cwd,exe) in sorted(procs.items()):
              if not name.startswith('PM2'):continue
              found=[]
              frontier=[pid]
              while frontier:
                  parent_id=frontier.pop()
                  kids=[k for k,v in procs.items() if v[1]==parent_id and k not in found]
                  found.extend(kids)
                  frontier.extend(kids)
              child=';'.join(str(k)+':'+procs[k][0][:32] for k in found[:40])
              print('|'.join((str(pid),user,name,cwd[:220],exe[:180],str(len(found)),child)))
          PY_F9_PIDS
          echo '=== F9_GLOBAL_APT_MANUAL_READONLY ==='
          manual="$(apt-mark showmanual 2>/dev/null || :)"
          for pkg in libreoffice ansible yt-dlp gimp blender kdenlive darktable openscad librecad qgis audacity obs-studio solvespace synfigstudio openshot-qt calibre; do
            if printf '%s\n' "$manual" | grep -qx "$pkg"; then echo "$pkg|manual"; else echo "$pkg|auto_or_unknown"; fi
          done
          echo '=== F9_APT_CONSUMER_AUDIT_V2 ==='
          python3 - <<'PY_F9'
          import os,re,subprocess,time
          from pathlib import Path
          pkgs=('libreoffice','ansible','yt-dlp','gimp','blender','kdenlive','darktable','openscad','librecad','qgis','audacity','obs-studio','solvespace','synfigstudio','openshot-qt','calibre')
          exenames={'libreoffice':('soffice','soffice.bin'),'ansible':('ansible','ansible-inventory'),'yt-dlp':('yt-dlp',),'gimp':('gimp','gimp-2.10'),'blender':('blender',),'kdenlive':('kdenlive',),'darktable':('darktable','darktable-cli'),'openscad':('openscad',),'librecad':('librecad',),'qgis':('qgis','qgis-bin'),'audacity':('audacity',),'obs-studio':('obs',),'solvespace':('solvespace',),'synfigstudio':('synfigstudio',),'openshot-qt':('openshot-qt',),'calibre':('ebook-convert','calibre')}
          def run(a,timeout=20):
              try:
                  p=subprocess.run(a,text=True,capture_output=True,timeout=timeout,env={'PATH':'/usr/bin:/bin','LC_ALL':'C'})
                  return (p.returncode,p.stdout)
              except (OSError,subprocess.TimeoutExpired):return (255,'')
          ps=[]
          for p in Path('/proc').iterdir():
              if not p.name.isdigit():continue
              try:ps.append(((p/'comm').read_text().strip(),os.readlink(p/'exe').removesuffix(' (deleted)')))
              except OSError:pass
          roots=('skill-universal','pink-iptv','fadego','lowcost-europa','telegram-robot-leads','iptvpn-bot','Codex','VPS')
          ignored={'.git','.runtime','node_modules','venv','.venv','vendor','dist','build','releases','__pycache__','.next','cache','storage','data','public','assets','tools','runtimes'}
          ext={'.py','.js','.ts','.sh','.json','.yaml','.yml','.service','.toml','.ini','.conf','.go','.rs','.md'}
          res={p:set() for p in pkgs}
          pat={p:re.compile(r'(?<![A-Za-z0-9_])'+re.escape(p)+r'(?![A-Za-z0-9_-])',re.I) for p in pkgs}
          scanned=0; capped=[]
          for name in roots:
