                      dirs.update(re.findall(r'/srv/projects/([A-Za-z0-9_.-]+)',val))
                  print('|'.join((unit,lines.get('ActiveState','unknown'),lines.get('SubState','unknown'),','.join(sorted(dirs)) or 'unresolved')))
              except (OSError,subprocess.TimeoutExpired):print(unit+'|unknown|unknown|probe_error')
          PY_F9_SYSTEMD
          echo '=== F9_PM2_PROCESS_CWD_READONLY ==='
          python3 - <<'PY_F9_PM2'
          from pathlib import Path
          import os
          for p in Path('/proc').iterdir():
