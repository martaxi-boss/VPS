          for p in sorted(root.iterdir(),key=lambda x:x.name.lower()):
              if not p.is_dir() or p.is_symlink():continue
              sha='not_git_worktree'
              try:
                  v=subprocess.run(['git','-C',str(p),'rev-parse','--verify','HEAD'],capture_output=True,text=True,timeout=6)
                  if v.returncode==0 and len(v.stdout.strip())==40:sha=v.stdout.strip()
              except (OSError,subprocess.TimeoutExpired):pass
              current='none'
              try:
                  cur=p/'current'
                  if cur.is_symlink():
                      dest=cur.resolve(strict=False)
                      current=dest.name if str(dest).startswith(str(p)+'/') else 'OUTSIDE_PROJECT'
              except OSError:current='unreadable'
              print('|'.join((p.name,sha,current)))
          PY_F9_SHA
          echo '=== F9_PM2_DESCENDANTS_READONLY ==='
          python3 - <<'PY_F9_PIDS'
          from pathlib import Path
