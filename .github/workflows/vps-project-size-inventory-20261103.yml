                              t=cfg.read_text(errors='replace')
                              match=re.search(r'github\.com[:/]([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+?)(?:\.git)?(?:\s|$)',t)
                              if match:
                                  github=match.group(1).removesuffix('.git')
                                  break
                          except OSError:pass
                      print('|'.join((p.name,kind,owner,size,github)))
                  except (OSError,KeyError):pass
          PY_F9_PROJECTS
          echo '=== F9_SYSTEMD_PROJECT_REFERENCES_READONLY ==='
          python3 - <<'PY_F9_SYSTEMD'
          import re,subprocess
          units=('fadego-staging.service','lowcost-europa.service','pink-iptv-backend.service','pink-vpn.service','pm2-iptvpn-bot.service','pm2-telegram-robot-leads.service','nginx.service','postgresql@16-main.service')
          for unit in units:
