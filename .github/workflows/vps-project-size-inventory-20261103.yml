                  if ('PM2' in name or ' (deleted)' in cwd) and ('/srv/projects/' in cwd or name.startswith('PM2')):
                      print('|'.join((p.name,name[:100],cwd[:220])))
              except (OSError,PermissionError):pass
          PY_F9_PM2
          echo '=== F9_GLOBAL_APT_CANDIDATES_READONLY ==='
          for pkg in libreoffice ansible yt-dlp gimp blender kdenlive darktable openscad librecad qgis audacity obs-studio solvespace synfigstudio openshot-qt calibre; do
            dpkg-query -W "$pkg" 2>/dev/null || echo "$pkg|NOT_INSTALLED"
          done
          echo '=== F9_ROOT_LEGACY_CANDIDATE_SIZE_READONLY ==='
          for d in /root/.cursor /root/.vscode /root/.claude-server-commander /home/ubuntu/.local/share/rea-github-transport /home/ubuntu/.local/share/hopper /root/migration-preserved /root/migration-20260923; do
            if [ -e "$d" ] && [ ! -L "$d" ]; then du -x -s -B1 "$d" 2>/dev/null || echo "ERROR|$d"; else echo "ABSENT|$d"; fi
          done
          echo '=== F9_GIT_RELEASE_SHA_READONLY ==='
          python3 - <<'PY_F9_SHA'
