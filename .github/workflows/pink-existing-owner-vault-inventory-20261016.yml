name: PINK existing owner vault inventory (read-only)
on:
  push:
    branches: ["release/pink-signing-readiness-20261016"]
    paths: [".github/workflows/pink-existing-owner-vault-inventory-20261016.yml"]
permissions:
  contents: read
jobs:
  inspect-vault:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify known official PINK VPS host fingerprint before loading credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "martaxi-boss/VPS"
          test "$GITHUB_REF" = "refs/heads/release/pink-signing-readiness-20261016"
          known_hosts="$RUNNER_TEMP/pink-release-pinned-hosts"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$known_hosts"
          chmod 600 "$known_hosts"
          observed="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}')"
          test "$observed" = "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc"
          ssh-keygen -F 146.59.145.3 -f "$known_hosts" >/dev/null
          echo PINNED_VPS_HOST=PASS
      - name: Prepare SSH helper
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Inspect ONLY metadata for existing owner vault and backup service
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/pink-release-pinned-hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 ubuntu@146.59.145.3 'sudo -n python3 -' <<'PY'
          import json, os, stat, subprocess
          p='/root/project-secrets'
          exists=os.path.lexists(p)
          st=os.lstat(p) if exists else None
          mode=stat.S_IMODE(st.st_mode) if st else None
          service=subprocess.run(
              ['systemctl','show','project-secrets-offsite-backup.service',
               '--property=LoadState,ActiveState','--no-pager'],
              capture_output=True,text=True,timeout=15)
          safe_values={}
          for line in service.stdout.splitlines():
              if line.startswith('LoadState=') or line.startswith('ActiveState='):
                  k,v=line.split('=',1)
                  safe_values[k]=v
          result={
            'mode':'READ_ONLY',
            'host':'vps-32bea5b6',
            'original_root_owner_vault_path':p,
            'exists':exists,
            'directory':bool(st and stat.S_ISDIR(st.st_mode)),
            'symlink':bool(st and stat.S_ISLNK(st.st_mode)),
            'root_owned':bool(st and st.st_uid==0),
            'permission_mode':format(mode,'03o') if mode is not None else None,
            'service_state':safe_values,
            'signing_subfolder_present':os.path.isdir(p+'/OWNER-SIGNING'),
            'passwords_or_key_material_read':False,
            'changes_made':False
          }
          print('OWNER_VAULT_INVENTORY='+json.dumps(result,sort_keys=True))
          assert os.geteuid()==0
          PY
