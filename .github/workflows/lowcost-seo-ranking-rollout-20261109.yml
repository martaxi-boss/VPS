name: Lowcost SEO PT ES guarded launch and ranking audit 20261109
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-seo-ranking-rollout-20261109.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-seo-ranking-production-rollout
  cancel-in-progress: false
jobs:
  rollout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Pinned SSH and exact-source deployment with backup and rollback
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/lowcost-seo-kh"
          chmod 600 "$RUNNER_TEMP/lowcost-seo-kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/lowcost-seo-kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/lowcost-seo-kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          PREVIOUS=371cce1eca6d75722f2fc02ccc2cc6471b58ccfd
          NEW=6edb54f527175d2170a91b90038427312ea7a462
          APPUSER=le001_1789265592
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          TASK="$ROOT/private/ops/seo-ranking-rollout-20261109"
          gitrepo() { git -c safe.directory="$ROOT" -C "$ROOT" "$@"; }
          test -d "$ROOT/.git" && test -s "$ENVFILE" && test ! -L "$ENVFILE"
          exec 9>"$ROOT/private/ops/ptes-deploy.lock"
          flock -n 9
          test "$(gitrepo rev-parse HEAD)" = "$PREVIOUS"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          test "$(gitrepo ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = "$NEW"
          gitrepo fetch --no-tags -q https://github.com/martaxi-boss/lowcost-europa.git main
          test "$(gitrepo rev-parse FETCH_HEAD)" = "$NEW"
          gitrepo merge-base --is-ancestor "$PREVIOUS" "$NEW"
          EXPECTED="$(printf '%s\n' apps/storefront/views.py apps/storefront/ui_translations.py apps/storefront/templates/storefront/product_family_detail.html apps/storefront/templates/storefront/components/offer_card.html apps/storefront/templates/storefront/components/product_family_card.html apps/storefront/static/storefront/storefront.css apps/storefront/tests/test_seo_ranking_readiness.py docs/operations/seo-ranking-pilot-20261109.md tests/browser/staging-browser-smoke.cjs | LC_ALL=C sort)"
          test "$(gitrepo diff --name-only "$PREVIOUS" "$NEW" | LC_ALL=C sort)" = "$EXPECTED"
          test "$(systemctl show lowcost-europa.service -p User --value)" = "$APPUSER"
          for unit in lowcost-europa.service lowcost-europa-catalog-maintenance.timer lowcost-europa-indexnow.timer lowcost-europa-backup.timer lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer lowcost-europa-affiliate-report.timer; do systemctl is-active --quiet "$unit"; done
          nginx -t >/dev/null 2>&1
          ENV_SHA="$(sha256sum "$ENVFILE" | awk '{print $1}')"
          test ! -e "$TASK"
          sh "$ROOT/deploy/scripts/backup-postgres.sh"
          BACKUP="$(find "$ROOT/backups/daily" -maxdepth 1 -type f -name '*.dump' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$BACKUP" && test -s "$BACKUP" && test -s "$BACKUP.sha256"
          (cd "$ROOT/backups/daily" && sha256sum -c "$(basename "$BACKUP.sha256")" >/dev/null)
          echo SEO_RANK_BACKUP_CHECKSUM=PASS
          mkdir -m 700 "$TASK"
          printf '%s\n' "$PREVIOUS" > "$TASK/previous-source-sha"
          PROMOTED=0
          rollback() {
            rc=$?
            trap - EXIT
            if test "$rc" -ne 0 && test "$PROMOTED" = 1; then
              umask 022
              gitrepo checkout --detach -q "$PREVIOUS"
              systemctl restart lowcost-europa.service
              systemctl is-active --quiet lowcost-europa.service
              echo SEO_RANK_ROLLBACK=PASS
            fi
            exit "$rc"
          }
          trap rollback EXIT
          PROMOTED=1
          umask 022
          gitrepo checkout --detach -q "$NEW"
          umask 077
          for path in apps/storefront/views.py apps/storefront/ui_translations.py apps/storefront/templates/storefront/product_family_detail.html; do
            runuser -u "$APPUSER" -- test -r "$ROOT/$path"
          done
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py check
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py makemigrations --check --dry-run
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYDB'
          import django
          django.setup()
          from datetime import timedelta
          from django.db.models import Exists,OuterRef
          from django.utils import timezone
          from django.utils.translation import override
          from apps.catalog.models import Offer,OfferObservation,OfferFamilyPlacement,ProductFamily
          from apps.catalog.services.public_eligibility import public_eligibility_q
          from apps.storefront.views import _family_queryset,_prepare_family
          now=timezone.now()
          eligible=Offer.objects.filter(public_eligibility_q(now),is_active=True,owner_hidden=False)
          count=eligible.count()
          assert count>=1, 'No eligible offers in production'
          es=OfferObservation.objects.filter(
              offer_id=OuterRef('pk'),destination_country='ES',
              observed_at__gte=now-timedelta(hours=24),
              observed_at__lte=now,price__gt=0,currency__iexact='EUR')
          es_count=eligible.filter(Exists(es)).count()
          print('RANK_LIVE_PT_ELIGIBLE_COUNT='+str(count))
          print('RANK_LIVE_ES_PRICE_COVERED_COUNT='+str(es_count))
          if es_count:
              offer=eligible.filter(Exists(es)).first()
              placement=OfferFamilyPlacement.objects.filter(offer=offer).exclude(
                  product_family__status=ProductFamily.Status.RETIRED).first()
              if placement:
                  with override('es'):
                      family=_prepare_family(_family_queryset(include_es_price=True).get(
                          pk=placement.product_family_id))
                  matched=[item for item in family.active_offers if item.pk==offer.pk]
                  assert matched and matched[0].price_market=='ES'
                  assert matched[0].observation_display.price_observation.destination_country=='ES'
                  print('RANK_ES_PRICE_SCOPED_REAL_DB=PASS')
              else:
                  print('RANK_ES_PRICE_SCOPED_REAL_DB=NO_PUBLIC_PLACEMENT')
          else:
              print('RANK_ES_PRICE_SCOPED_REAL_DB=NO_RECENT_ES_PRICE')
          print('RANK_DATABASE_READONLY=PASS')
          PYDB
          systemctl reload lowcost-europa.service
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYHTTP'
          from html.parser import HTMLParser
          import urllib.request,urllib.error,time
          import xml.etree.ElementTree as ET
          base='https://www.lowcost-europa.eu'
          slugs=[
            'cavitacao-rf-vacuum-corpo',
            'hydrodermoabrasao-aqua-facial-multifuncoes',
            'pressoterapia-vacuum-drenagem','hifu',
            'diodo-laser-remocao-tatuagens-pigmentacao']
          paths=['/','/pt/','/es/']
          paths += ['/products/'+slug+'/' for slug in slugs]
          paths += ['/'+locale+'/products/'+slug+'/' for locale in ('pt','es') for slug in slugs]
          paths += ['/'+page+'/' for page in ('como-funciona','afiliados','privacidade','termos','contacto')]
          assert len(paths)==23 and len(set(paths))==23
          class Page(HTMLParser):
            def __init__(self):
              super().__init__();self.canonical=[];self.alternates={};self.lang=None
              self.related=None;self.breadcrumb=None;self._region=None;self._links=[]
              self._trail_links=[]
            def handle_starttag(self,tag,attrs):
              attrs=dict(attrs)
              if tag=='html':self.lang=attrs.get('lang')
              if tag=='link' and attrs.get('rel')=='canonical':self.canonical.append(attrs.get('href'))
              if tag=='link' and attrs.get('rel')=='alternate':
                self.alternates[attrs.get('hreflang')]=attrs.get('href')
              if tag=='nav' and 'related-families-nav' in attrs.get('class',''):
                self._region='related'
              elif tag=='nav' and 'category-breadcrumb' in attrs.get('class',''):
                self._region='trail'
              if tag=='a' and self._region=='related':
                self._links.append(attrs.get('href'))
              if tag=='a' and self._region=='trail':
                self._trail_links.append(attrs.get('href'))
            def handle_endtag(self,tag):
              if tag=='nav' and self._region:
                self._region=None
          def get(path):
            with urllib.request.urlopen(base+path,timeout=25) as r:
              return r.status,r.headers,r.read().decode('utf-8')
          for attempt in range(12):
            status,_,raw=get('/es/products/hifu/')
            if 'Otras especialidades para comparar' in raw and 'category-breadcrumb' in raw:
              break
            time.sleep(1)
          else:raise AssertionError('new SEO content not served')
          counted=0
          for path in paths:
            status,headers,raw=get(path)
            assert status==200 and 'noindex' not in headers.get('X-Robots-Tag',''),path
            parsed=Page();parsed.feed(raw)
            assert parsed.canonical==[base+path],('canonical',path,parsed.canonical)
            assert '<meta name="description"' in raw and '<main id="conteudo">' in raw,path
            if path.startswith('/es/'):assert parsed.lang=='es'
            if path.startswith('/pt/'):assert parsed.lang=='pt-pt'
            root=path
            locale=None
            if path.startswith('/pt/') or path.startswith('/es/'):
              locale=path.split('/')[1]
              root=path[len(locale)+1:]
            is_category=root.startswith('/products/') and root.endswith('/')
            is_home=root=='/'
            if is_category or is_home:
              expected={'pt-PT':base+'/pt'+root,'es-ES':base+'/es'+root,'x-default':base+root}
              assert parsed.alternates==expected,('hreflang',path,parsed.alternates)
            else:
              assert not parsed.alternates,('institutional hreflang',path)
            if is_category:
              slug=root.removeprefix('/products/').rstrip('/')
              current=locale or 'pt'
              expected_links={'/'+current+'/products/'+s+'/' for s in slugs if s!=slug}
              if locale:
                assert set(parsed._links)==expected_links,('related',path,parsed._links)
                assert parsed._trail_links==['/'+current+'/'],('breadcrumb',path,parsed._trail_links)
              else:
                unprefixed={'/products/'+s+'/' for s in slugs if s!=slug}
                assert set(parsed._links)==unprefixed,('related',path,parsed._links)
                assert parsed._trail_links==['/'],('breadcrumb',path,parsed._trail_links)
            counted+=1
          print('RANK_LIVE_PUBLIC_CRAWL=PASS pages='+str(counted))
          _,_,xml=get('/sitemap.xml')
          _,_,txt=get('/sitemap.txt')
          locs=[n.text for n in ET.fromstring(xml).iter('{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          assert locs==[base+p for p in paths] or set(locs)=={base+p for p in paths}
          assert locs==txt.splitlines(), 'xml and text sitemap differ'
          assert len(locs)==23 and len(set(locs))==23
          print('RANK_LIVE_SITEMAPS=PASS urls=23')
          _,_,robots=get('/robots.txt')
          assert 'Sitemap: '+base+'/sitemap.xml' in robots
          assert 'Sitemap: '+base+'/sitemap.txt' in robots
          assert 'Disallow: /painel/' in robots
          print('RANK_LIVE_ROBOTS=PASS')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args,**kwargs):return None
          op=urllib.request.build_opener(NoRedirect)
          try:op.open(base+'/painel/',timeout=20)
          except urllib.error.HTTPError as error:
            assert error.code==302 and 'noindex' in error.headers.get('X-Robots-Tag','')
          else:raise AssertionError('owner route unprotected')
          print('RANK_OWNER_PRIVATE=PASS')
          PYHTTP
          test "$(sha256sum "$ENVFILE" | awk '{print $1}')" = "$ENV_SHA"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          test "$(gitrepo rev-parse HEAD)" = "$NEW"
          for unit in lowcost-europa.service lowcost-europa-catalog-maintenance.timer lowcost-europa-indexnow.timer lowcost-europa-backup.timer lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer lowcost-europa-affiliate-report.timer; do systemctl is-active --quiet "$unit"; done
          echo RANK_PRODUCTION_SHA=PASS
          echo RANK_ENV_UNCHANGED=PASS
          echo RANK_SEVEN_UNITS=PASS
          echo RANK_SEO_PT_ES_GUARDED_ROLLOUT=PASS
          trap - EXIT
          REMOTE
