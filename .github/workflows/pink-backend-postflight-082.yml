name: PINK Backend Independent Postflight 082
on:
  pull_request:
    branches: ["main"]
    paths: ["ops/pink_backend_082_verify.py", ".github/workflows/pink-backend-postflight-082.yml"]
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.pull_request.number == 31 && github.event.pull_request.head.repo.full_name == 'martaxi-boss/VPS'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source scope and compile independent read-only inspector
        run: |
          set -euo pipefail
          python3 -m py_compile ops/pink_backend_082_verify.py
          python3 - <<'PY'
          import subprocess
          base="0612daad9ba393ef08fcbe2c0072855571f281e9"
          subprocess.run(["git","merge-base","--is-ancestor",base,"HEAD"],check=True)
          changed=set(subprocess.check_output(
              ["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          allowed={"ops/pink_backend_082_verify.py", ".github/workflows/pink-backend-postflight-082.yml"}
          assert changed and changed<=allowed,changed-allowed
          print("PINK082_READ_ONLY_SOURCE_SCOPE=PASS")
          PY
      - name: Verify accepted production backend, legacy addresses, and endpoint recovery
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            ubuntu@146.59.145.3 'sudo -n python3 -' < ops/pink_backend_082_verify.py
