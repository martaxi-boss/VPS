name: Ferrari ComfyUI point2 CPU model and image proof one-shot
on:
  push:
    branches: [main]
    paths:
      - 'ferrari-release-requests/comfyui-point2-proof-sd15-20261106.json'
permissions:
  contents: read
concurrency:
  group: ferrari-comfyui-point2-model-once
  cancel-in-progress: false

jobs:
  comfyui-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - name: Checkout new bounded request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate exact one-shot authorization
        id: gate
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          added="$(git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA")"
          changed="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          if [[ -z "$added" ]]; then
            echo 'execute=false' >> "$GITHUB_OUTPUT"
            echo FERRARI_COMFY_POINT2_HYGIENE=PASS
            exit 0
          fi
          test "$added" = ferrari-release-requests/comfyui-point2-proof-sd15-20261106.json
          test "$added" = "$changed"
          python3 - <<'PY'
          import json
          from pathlib import Path
          req=json.loads(Path('ferrari-release-requests/comfyui-point2-proof-sd15-20261106.json').read_text())
          assert req=={'version':1,'task':'comfyui-private-sd15-cpu-install-real-inference',
                      'ferrari_sha':'c88fc260d3aeffa209ba1fc8b5107331ddd4b019','model':'stable-diffusion-v1-5/stable-diffusion-v1-5',
                      'model_revision':'f03de327dd89b501a01da37fc5240cf4fdba85a1'}
          PY
          echo 'execute=true' >> "$GITHUB_OUTPUT"
          echo FERRARI_COMFY_POINT2_REQUEST=PASS

      - name: Pin Ferrari source in detached checkout
        if: steps.gate.outputs.execute == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: c88fc260d3aeffa209ba1fc8b5107331ddd4b019
          path: ferrari
          persist-credentials: false

      - name: Test exact ComfyUI model installer and proof scripts
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile ferrari/install/vps-comfyui-sd15-fp16-model.py ferrari/install/vps-comfyui-cpu-smoke.py
          (cd ferrari && python3 -m unittest discover -s tests -p test_comfyui_cpu_model.py -v)
          echo FERRARI_COMFY_POINT2_SOURCE=PASS

      - name: Verify existing SSH host key and runner-local connection
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/ferrari-comfy-known-host"
          chmod 600 "$RUNNER_TEMP/ferrari-comfy-known-host"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/ferrari-comfy-known-host" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass > /dev/null
          echo FERRARI_COMFY_POINT2_EXISTING_SSH=PASS

      - name: Install pinned standard SD1.5 private model without release/global changes
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          ROOT=/srv/projects/skill-universal
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes
                -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-comfy-known-host"
                -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6)
          previous="$(sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 "readlink -e '$ROOT/current'")"
          test "$previous" = "$ROOT/releases/a266b25e06a9c8acf1fdc940d22b99070cd17ded"
          echo FERRARI_COMFY_POINT2_RELEASE_UNCHANGED_BEFORE=PASS
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            "cd '$ROOT' && '$ROOT/runtimes/python3.12/bin/python3.12' - --apply" \
            < ferrari/install/vps-comfyui-sd15-fp16-model.py
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            "cd '$ROOT' && '$ROOT/runtimes/python3.12/bin/python3.12' - --check" \
            < ferrari/install/vps-comfyui-sd15-fp16-model.py
          actual="$(sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 "readlink -e '$ROOT/current'")"
          test "$previous" = "$actual"
          echo FERRARI_COMFY_POINT2_MODEL_PRIVATE_SHA256=PASS
          echo FERRARI_COMFY_POINT2_RELEASE_UNCHANGED_AFTER=PASS

      - name: Execute actual CPU model in bounded one-shot systemd scope
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          ROOT=/srv/projects/skill-universal
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes
                -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-comfy-known-host"
                -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6)
          # Stage only within Ferrari; refuse to replace another user's file.
          source_hash="$(sha256sum ferrari/install/vps-comfyui-cpu-smoke.py | cut -d' ' -f1)"
          remote_hash="$(sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            "if test -f '$ROOT/.runtime/.ferrari-comfy-point2-proof-sd15.py' && test ! -L '$ROOT/.runtime/.ferrari-comfy-point2-proof-sd15.py'; then sha256sum '$ROOT/.runtime/.ferrari-comfy-point2-proof-sd15.py' | cut -d' ' -f1; fi")"
          if [[ -n "$remote_hash" ]]; then
            test "$remote_hash" = "$source_hash" || {
              echo FERRARI_COMFY_UNKNOWN_STAGED_SCRIPT_BLOCKED; exit 4;
            }
            echo FERRARI_COMFY_REUSE_VERIFIED_STAGED_SMOKE=PASS
          else
            sshpass -e scp -q "${opts[@]}" ferrari/install/vps-comfyui-cpu-smoke.py \
              "ubuntu@146.59.145.3:$ROOT/.runtime/.ferrari-comfy-point2-proof-sd15.py"
          fi
          # A transient scope caps its own CPU/memory and cannot launch a service.
          set +e
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            "timeout 510 sudo -n systemd-run --scope -p MemoryMax=5G -p CPUQuota=150% -p TasksMax=256 -- /usr/sbin/runuser -u ubuntu -- '$ROOT/.runtime/venvs/extended/comfyui/bin/python' '$ROOT/.runtime/.ferrari-comfy-point2-proof-sd15.py'" \
            > "$RUNNER_TEMP/comfy-real-inference.txt" 2>&1
          result=$?
          set -e
          tail -n 100 "$RUNNER_TEMP/comfy-real-inference.txt"
          test "$result" -eq 0
          grep -q '^FERRARI_COMFY_ACTUAL_MODEL_LOAD=PASS' "$RUNNER_TEMP/comfy-real-inference.txt"
          grep -q '^FERRARI_COMFY_IMAGE_REAL=PASS' "$RUNNER_TEMP/comfy-real-inference.txt"
          mkdir -p "$RUNNER_TEMP/comfy-evidence"
          sshpass -e scp -q "${opts[@]}" \
            "ubuntu@146.59.145.3:$ROOT/.runtime/comfyui-proof-20261106/comfyui-sd15-proof.png" \
            "$RUNNER_TEMP/comfy-evidence/image.png"
          sshpass -e scp -q "${opts[@]}" \
            "ubuntu@146.59.145.3:$ROOT/.runtime/comfyui-proof-20261106/report.json" \
            "$RUNNER_TEMP/comfy-evidence/report.json"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,struct
          root=Path(__import__('os').environ['RUNNER_TEMP'])/'comfy-evidence'
          image=(root/'image.png').read_bytes()
          report=json.loads((root/'report.json').read_text())
          assert len(image)>1500 and image[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',image[16:24])==(256,256)
          assert report['status']=='completed' and report['device']=='cpu'
          assert hashlib.sha256(image).hexdigest()==report['sha256']
          print('FERRARI_COMFY_POINT2_IMAGE_ARTIFACT_VERIFIED=PASS')
          print('FERRARI_COMFY_POINT2_PROOF_ELAPSED_SECONDS='+str(report['elapsed_seconds']))
          PY
          # Only temporary transport script removed; model and proof stay project-owned.
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            "test -f '$ROOT/.runtime/.ferrari-comfy-point2-proof-sd15.py' && rm -f -- '$ROOT/.runtime/.ferrari-comfy-point2-proof-sd15.py'"
          # Remove only the exact old staging script from the previous failed
          # test if its bytes match the pinned Git blob. No arbitrary deletion.
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            'old=/srv/projects/skill-universal/.runtime/.ferrari-comfy-point2-proof.py; if test -f "$old" && test ! -L "$old"; then test "$(git hash-object "$old")" = 4435ba6981e9ba89e410a21b3858f2c4ab087b6a && rm -f -- "$old"; fi'
          echo FERRARI_COMFY_POINT2_REAL_INFERENCE=PASS

      - name: Preserve logs and real image proof
        if: always() && steps.gate.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-comfy-point2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/comfy-real-inference.txt
            ${{ runner.temp }}/comfy-evidence/
          retention-days: 14
          if-no-files-found: warn
