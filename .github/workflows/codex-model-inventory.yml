name: Codex VPS model catalog inventory (Owner only, no inference)

# A single explicit Owner GitHub Issue runs a strictly read-only account-catalog
# inspection. PR validation does not receive SSH secrets or execute Codex.
on:
  issues:
    types: [opened]
  pull_request:
    paths:
      - '.github/workflows/codex-model-inventory.yml'
      - 'ops/codex-model-inventory.py'
      - 'ops/tests/test_codex_model_inventory.py'

permissions: {}

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify sanitized model catalog and no-inference gate
        run: |
          python3 -m py_compile ops/codex-model-inventory.py
          python3 -m unittest discover -s ops/tests -p 'test_codex_model_inventory.py' -v

  read-vps-catalog:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[codex model inventory] Read-only VPS catalog'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout only trusted VPS main, never Issue contents
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Pin Owner-observed Ed25519 host key before using SSH credentials
        shell: bash
        run: |
          set -euo pipefail
          expected='SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          known_hosts="$RUNNER_TEMP/codex_inventory_known_hosts"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$known_hosts" || exit 2
          chmod 600 "$known_hosts"
          observed="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}')"
          test "$observed" = "$expected" || exit 2
          ssh-keygen -F 146.59.145.3 -f "$known_hosts" >/dev/null || exit 2
          echo 'SSH_HOST_KEY_PIN=PASS'
      - name: Require case-sensitive Owner issue title before accessing SSH secret
        shell: bash
        env:
          REQUEST_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          expected='[codex model inventory] Read-only VPS catalog'
          test "$REQUEST_TITLE" = "$expected" || { echo "OWNER_TITLE_CASE_MISMATCH"; exit 2; }
      - name: Prepare existing SSH client only after host identity confirmation
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || exit 2
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Query resolved local Codex model catalog without starting models
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -s ops/codex-model-inventory.py
          sshpass -e ssh -T -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/codex_inventory_known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=10 \
            ubuntu@146.59.145.3 'python3 -' \
            < ops/codex-model-inventory.py \
            > "$RUNNER_TEMP/codex-model-inventory.json" 2>/dev/null
          test -s "$RUNNER_TEMP/codex-model-inventory.json"
          echo 'MODEL_INVENTORY=COLLECTED_AND_READY_FOR_VALIDATION'
      - name: Publish only allowlisted metadata, never CLI raw output
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          path = root / 'codex-model-inventory.json'
          allowed_status = {
              'CATALOG_READ', 'CLI_MISSING', 'AUTH_UNVERIFIED',
              'CATALOG_TIMEOUT', 'CATALOG_UNAVAILABLE',
              'CATALOG_COMMAND_FAILED', 'CATALOG_OVERSIZED',
              'CATALOG_UNPARSEABLE', 'INCONCLUSIVE',
          }
          result = {'status': 'INCONCLUSIVE', 'auth_mode': 'unknown',
                    'cli_version': 'unknown', 'catalog_source': 'none', 'models': []}
          if path.is_file() and not path.is_symlink() and path.stat().st_size <= 7500:
              try:
                  raw = json.loads(path.read_text(encoding='utf-8'))
                  if not isinstance(raw, dict):
                      raise ValueError('Not a bounded result')
                  status = raw.get('status')
                  result['status'] = status if status in allowed_status else 'INCONCLUSIVE'
                  result['auth_mode'] = ('chatgpt' if raw.get('auth_mode') == 'chatgpt'
                                         else 'unknown')
                  version = raw.get('cli_version')
                  if isinstance(version, str) and re.fullmatch(r'[0-9][a-zA-Z0-9.-]{1,34}', version):
                      result['cli_version'] = version
                  if result['status'] == 'CATALOG_READ' and result['auth_mode'] == 'chatgpt' \
                          and raw.get('catalog_source') == 'cli_resolved':
                      result['catalog_source'] = 'cli_resolved'
                      for model in raw.get('models', [])[:35]:
                          if not isinstance(model, dict):
                              continue
                          slug = model.get('slug')
                          if not isinstance(slug, str) or not re.fullmatch(r'gpt-[a-zA-Z0-9._-]{1,55}', slug):
                              continue
                          if model.get('visibility') not in ('list', 'unknown'):
                              continue
                          effort = model.get('efforts')
                          if not isinstance(effort, list):
                              continue
                          levels = [e for e in effort if type(e) is str
                                    and e in ('minimal', 'low', 'medium', 'high', 'xhigh')]
                          result['models'].append({'slug': slug, 'efforts': sorted(set(levels))})
                  else:
                      result['models'] = []
              except (ValueError, TypeError, AttributeError, OSError):
                  result = {'status': 'INCONCLUSIVE', 'models': [],
                            'auth_mode': 'unknown', 'cli_version': 'unknown',
                            'catalog_source': 'none'}
          msg = ('## Codex model inventory (metadata only; NO inference)\n\n'
                 + '~~~json\n' + json.dumps(result, indent=2, sort_keys=True)
                 + '\n~~~\n\n'
                 + 'This reads CLI-resolved metadata, NOT proof of executable entitlement '
                   'for every listed model. No model prompt, model usage, deployment, Git '
                   'write, local auth text or private instruction templates were emitted.\n\n'
                 + 'Evidence: ' + os.environ['RUN_URL'] + '\n')
          (root / 'codex-model-inventory-comment.md').write_text(msg, encoding='utf-8')
          verified = (result['status'] == 'CATALOG_READ'
                      and result['auth_mode'] == 'chatgpt'
                      and result['catalog_source'] == 'cli_resolved'
                      and len(result['models']) > 0)
          (root / 'codex-model-inventory-verified.txt').write_text(
              'PASS' if verified else 'FAIL', encoding='ascii')
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/codex-model-inventory-comment.md"
          if [ "$(cat "$RUNNER_TEMP/codex-model-inventory-verified.txt")" != "PASS" ]; then
            echo "CATALOG_UNVERIFIED_FAIL_CLOSED"
            exit 3
          fi
          echo "VPS_CATALOG_METADATA_VERIFIED"
