name: Ferrari F9 isolated CAD/GIS and GUI preflight (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ferrari-f9-runtime-audit-once-20261106.yml'
permissions:
  contents: read
concurrency:
  group: ferrari-f9-runtime-audit
  cancel-in-progress: false
jobs:
  private-tool-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reuse existing pinned SSH host
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS" || exit 2
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/f9-known-hosts"
          chmod 600 "$RUNNER_TEMP/f9-known-hosts"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/f9-known-hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' || exit 3
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          echo F9_SSH_PIN=PASS
      - name: Inspect Ferrari-private and globally installed GUI software (no mutations)
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes
                -o "UserKnownHostsFile=$RUNNER_TEMP/f9-known-hosts"
                -o GlobalKnownHostsFile=/dev/null
                -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ulimit -c 0
          root=/srv/projects/skill-universal
          test "$(id -un)" = ubuntu && test -d "$root" && test ! -L "$root"
          echo "F9_ACTIVE_RELEASE=$(readlink -f "$root/current")"
          echo "F9_GITHUB_BASELINE=d095b394b8c01610284c1dd92985db0df9f64990"
          echo "F9_DISK=$(df -h "$root" | tail -1)"
          echo F9_PRIVATE_TOOL_DIRS
          for t in yt-dlp-2026.10.26 librecad-2.2.1.6 audacity-4.0.2 synfig-1.5.5 openshot-4.1.1 obs-studio-32.2.2; do
            if test -d "$root/tools/$t"; then du -sh "$root/tools/$t"; else echo "MISSING:$t"; fi
          done
          echo F9_GLOBAL_PACKAGE_METADATA
          for pkg in qgis qgis-common qgis-providers python3-qgis solvespace obs-studio; do
            dpkg-query -W -f='${Package}|version=${Version}|installed_size_kib=${Installed-Size}|status=${Status}\n' "$pkg" 2>/dev/null || true
          done
          echo F9_PRIVATE_OBS_ENTRY
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/srv/projects/skill-universal/tools/obs-studio-32.2.2')
          data=json.loads((root/'manifest.json').read_text())
          exe=(root/'payload'/data['obs_relative_exe']).resolve()
          print("obs_release=",data['version'],"executable=",exe)
          print("obs_cli_version_tested=",data.get("cli_version_tested"))
          print("obs_dep_isolation_certified=",data.get("dependency_isolation_certified"))
          PY
          echo F9_GLOBAL_BINARY_DEPENDENCIES
          for exe in /usr/bin/solvespace /usr/bin/qgis /usr/bin/qgis_process; do
            if test -f "$exe"; then
              echo "BINARY:$exe"
              file "$exe" || true
              (ldd "$exe" 2>&1 | grep -E 'not found|libQt|libqgis|libslvs|libGL|libTK|libxcb|libwx' | head -18) || true
            fi
          done
          echo F9_APT_DOWNLOAD_POLICY
          apt-cache policy qgis qgis-common qgis-providers solvespace obs-studio | head -90
          echo F9_QGIS_PROCESS_HELP_SAFE
          (timeout 12 /usr/bin/qgis_process --help 2>&1 | head -20) || true
          echo F9_SOLVESPACE_CLI_HELP_SAFE
          (timeout 8 /usr/bin/solvespace --help 2>&1 | head -15) || true
          echo F9_QGIS_PRIVATE_BUNDLE_PREFLIGHT
          dpkg-query -W -f='${Package}|${Version}|${Installed-Size}KiB\n' 'libqgis*' 'qgis*' 'python3-qgis*' 2>/dev/null | head -65 || true
          for pkg in qgis qgis-common qgis-providers qgis-providers-common libqgis-core3.34.4 libqgis-analysis3.34.4 libqgis-gui3.34.4 libqgis-native3.34.4; do
            echo "APT_DEPENDENCIES:$pkg"
            (apt-cache depends "$pkg" 2>/dev/null | head -30) || true
          done
          echo QGIS_BIN_WRAPPER
          head -30 /usr/bin/qgis_process 2>/dev/null || true
          echo QGIS_PACKAGE_FILE_ROOT
          dpkg -S /usr/bin/qgis_process.bin /usr/bin/qgis_process /usr/lib/qgis/ 2>/dev/null | head -15 || true
          echo QGIS_PROCESS_BINARY_LIBS
          (ldd /usr/bin/qgis_process.bin 2>&1 | grep -E 'libqgis|not found|libQt' | head -25) || true
          echo F9_QGIS_PROCESS_VERSION
          (timeout 12 /usr/bin/qgis_process --version 2>&1 | head -12) || true
          echo F9_PRIVATE_OBS_LIBRARY_CHECK
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('/srv/projects/skill-universal/tools/obs-studio-32.2.2')
          data=json.loads((root/'manifest.json').read_text())
          exe=(root/'payload'/data['obs_relative_exe']).resolve()
          cp=subprocess.run(['ldd',str(exe)],capture_output=True,text=True,timeout=15)
          print('obs_linker_status=',cp.returncode)
          lines=cp.stdout.splitlines()+cp.stderr.splitlines()
          missing=[line.strip() for line in lines if 'not found' in line]
          print('obs_missing_runtime_libraries=',missing[:25])
          PY
          echo F9_GUI_DISPLAY_TOOLS
          for tool in Xvfb xvfb-run weston; do
            echo -n "$tool: "; command -v "$tool" || true
          done
          echo F9_OBS_PRIVATE_LIBS_AND_LDD
          payload="$root/tools/obs-studio-32.2.2/payload"
          find "$payload" -maxdepth 7 -type f -name '*libobs*.so*' -print | head -35 || true
          find "$payload" -maxdepth 7 -type f -name '*frontend*.so*' -print | head -25 || true
          obsbin="$payload/usr/local/bin/obs"
          (ldd "$obsbin" | grep -E 'libobs|frontend|libQt|libavcodec|libavformat' | head -22) || true
          (readelf -d "$obsbin" | grep -E 'NEEDED|RPATH|RUNPATH' | head -23) || true
          echo F9_PRIVATE_OBS_VERSION_PROBE
          probe="$root/.runtime/f9-gui-probe-$BASHPID"
          mkdir -m 700 "$probe"
          trap 'test -d "$probe" && python3 -c "from pathlib import Path; import shutil,sys; p=Path(sys.argv[1]); assert p.parent==Path(sys.argv[2]) and p.name.startswith(\"f9-gui-probe-\"); shutil.rmtree(p)" "$probe" "$root/.runtime"' EXIT
          set +e
          timeout 12 env HOME="$probe" XDG_CONFIG_HOME="$probe" XDG_CACHE_HOME="$probe" \
              XDG_RUNTIME_DIR="$probe" TMPDIR="$probe" QT_QPA_PLATFORM=offscreen \
              "$root/tools/obs-studio-32.2.2/run-obs" --version > "$probe/obs_stdout" 2> "$probe/obs_stderr"
          code=$?
          set -e
          echo "OBS_PROBE_EXIT=$code"
          tail -c 850 "$probe/obs_stdout" || true
          tail -c 1000 "$probe/obs_stderr" || true
          echo F9_SOLVESPACE_RESOURCES_PROVENANCE
          echo F9_SOLVESPACE_PRIVATE_TREE
          find "$root/tools/solvespace-3.1-ubuntu24/usr/share" -maxdepth 4 -type f 2>/dev/null | head -55 || true
          echo F9_SOLVESPACE_PRIVATE_RESOURCE_STATS
          ls -ld "$root/tools/solvespace-3.1-ubuntu24/usr/share/solvespace" /usr/share/solvespace /usr/bin/solvespace 2>&1 || true
          echo F9_SOLVESPACE_GLOBAL_PACKAGE_FILES
          dpkg -L solvespace | grep -E '/solvespace$|/solvespace/|/share/solvespace' | head -60 || true
          echo F9_SOLVESPACE_RESOURCE_COUNTS
          find /usr/share/solvespace -type f 2>/dev/null | wc -l || true
          find "$root/tools/solvespace-3.1-ubuntu24/usr/share/solvespace" -type f 2>/dev/null | wc -l || true
          echo F9_SOLVESPACE_RESOURCE_RELATIVE_PATHS
          find /usr/share/solvespace -type f 2>/dev/null | head -16 || true
          echo F9_SOLVESPACE_PRIVATE_RESOURCE_DIFF
          diff -qr "$root/tools/solvespace-3.1-ubuntu24/usr/share/solvespace" /usr/share/solvespace | head -25 || true
          echo F9_SOLVESPACE_BINARY_IDENTITY
          sha256sum /usr/bin/solvespace "$root/tools/solvespace-3.1-ubuntu24/usr/bin/solvespace"
          echo F9_SOLVESPACE_TRACE_AVAILABLE
          command -v strace || true
          echo F9_SOLVESPACE_PRIVATE_PACKAGE_ROOT
          find "$root/tools/solvespace-3.1-ubuntu24/usr/share/solvespace/fonts" -maxdepth 2 -type f | head -22
          echo F9_SOLVESPACE_THREEJS_SYMLINK_DIAG
          for p in "$root/tools/solvespace-3.1-ubuntu24/usr/share/solvespace/threejs/three.js" "/usr/share/solvespace/threejs/three.js" "/usr/share/javascript/three/three.js"; do
            ls -l "$p" 2>&1 || true
            readlink "$p" || true
            readlink -f "$p" || true
          done
          echo F9_SOLVESPACE_JS_APT_PACKAGE
          dpkg-query -W -f='${Package}|${Version}|${Status}\n' libjs-three
          apt-cache show libjs-three | grep -E '^(Package|Version|Architecture|Filename|Size|SHA256):' | head -10
          echo F9_SOLVESPACE_PRIVATE_SYMLINKS
          find "$root/tools/solvespace-3.1-ubuntu24/usr/share/solvespace" -type l -printf '%p -> %l\n' | head -35
          echo F9_UNIFONT_PACKAGE_OWNER
          dpkg -S /usr/share/unifont/unifont.hex || true
          dpkg-query -W -f='${Package}|${Version}|${Status}\n' unifont fonts-unifont fonts-unifont-core libjs-three 2>/dev/null || true
          for pkg in unifont fonts-unifont fonts-unifont-core; do
            echo "APT_META:$pkg"
            apt-cache show "$pkg" 2>/dev/null | grep -E '^(Package|Version|Architecture|Filename|Size|SHA256):' | head -10 || true
          done
          echo F9_THREEJS_PACKAGE_CONTENTS
          dpkg -L libjs-three | grep 'three.js' | head -25 || true
          echo F9_FERRARI_CURRENT_RELEASE_AFTER_ALIGNMENT
          readlink -f "$root/current"
          echo F9_PRIVATE_RESOURCE_MANIFEST_CHECK
          python3 - "$root" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          doc=json.loads((root/"tools/solvespace-3.1-ubuntu24/ferrari-private-resources.json").read_text())
          for name in ("libjs-three","unifont"):
              item=doc["resources"][name]
              assert Path(item["private_path"]).is_file(),item
              print("F9_SOLVESPACE_PRIVATE_RESOURCE="+name+"=PASS")
          PY
          echo F9_APT_EIGHT_GLOBAL_PACKAGES_PURGE_SIMULATION_ONLY
          sim="$root/.runtime/.f9-apt-purge-sim-$BASHPID"
          trap 'rm -f -- "$sim"' EXIT
          packages=(yt-dlp librecad qgis audacity obs-studio solvespace synfigstudio openshot-qt)
          LC_ALL=C apt-get -s -o Debug::NoLocking=1 purge "${packages[@]}" >"$sim" 2>&1 || {
            echo F9_APT_SIMULATION_BLOCKED
            tail -n 15 "$sim"
            exit 10
          }
          echo F9_APT_SIMULATION_REMOVAL_LINES
          grep '^Remv ' "$sim" | head -50 || true
          echo F9_APT_SIMULATION_AUTOREMOVE=NOT_INVOKED
          python3 - "$sim" <<'PY'
          import sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text()
          planned=[s.split()[1] for s in text.splitlines() if s.startswith("Remv ")]
          wanted={"yt-dlp","librecad","qgis","audacity","obs-studio",
                  "solvespace","synfigstudio","openshot-qt"}
          unexpected=sorted(set(planned)-wanted)
          print("F9_APT_SIMULATION_PACKAGES="+",".join(planned))
          print("F9_APT_SIMULATION_EXTRA="+",".join(unexpected))
          print("F9_APT_SIMULATION_ONLY_EIGHT="+str(not unexpected))
          PY
          services=(pink-iptv-backend pink-vpn fadego-staging lowcost-europa pm2-iptvpn-bot pm2-telegram-robot-leads nginx postgresql@16-main)
          for s in "${services[@]}"; do
            test "$(systemctl is-active "$s")" = active || { echo "F9_SERVICE_FAILED:$s"; exit 5; }
          done
          echo F9_PROTECTED_SERVICES=8_OF_8_PASS
          echo F9_READ_ONLY_AUDIT=PASS
          REMOTE
