name: PINK Extreme Real Flow 056
on:
  push:
    branches: ["builder/pink-extreme-real-flow-056"]
    paths: ["ops/pink_vpn_056*", ".github/workflows/pink-extreme-real-flow-056.yml", ".project-leader/transitions/PINK-IPTV-EXTREME-REAL-FLOW-056-EXECUTE.authorization.json"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pink-extreme-real-flow-056
  cancel-in-progress: false
jobs:
  control_validation:
    if: github.event.head_commit.message == 'Validate bounded hosted recovery records 056'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate proposed records before their durable publication
        run: |
          set -euo pipefail
          git clone -q --no-checkout https://github.com/martaxi-boss/Project-leader.git "$RUNNER_TEMP/pink056-canonical"
          git -C "$RUNNER_TEMP/pink056-canonical" checkout -q --detach c42ed27cc6c520bfd63015097c8c60ee42392ba5
          python - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path(os.environ['RUNNER_TEMP'])/'pink056-canonical'))
          from control.validate_records import validate_recovery_journal,canonical_sha256
          base=Path('.project-leader/recovery-events/PINK-IPTV-EXTREME-REAL-FLOW-056')
          records=[json.loads((base/f'{i:03d}.json').read_text()) for i in range(1,1)]
          pending=json.loads(r'''[{"schema_version":"1.0","task_id":"PINK-IPTV-EXTREME-REAL-FLOW-056","repository":"martaxi-boss/VPS","recorded_at":"2026-10-05T16:33:55.206Z","previous_event_sha256":null,"sequence":1,"event":"FAILURE_OBSERVED","strategy_generation":1,"action_fingerprint":"056-prepared-offline-numeric-ip-capture","attempt_count":2,"identical_failure_count":2,"no_progress_iterations":1,"detail":"Prepared builds8ec2e7d andbf815d3 both used exact PINKc5b36c9d; runs37336925191 and37337046651 failed the same strict startup numeric IPv4 socket-blocking assertion after all APK compilation/JVM and actual Keystore tests passed. No private fixture retrieval, SSH proof or runtime mutation executed; privileged proof remained skipped. Existing gateway054 stays accepted. Preserve both runs; do not rerun the unchanged source."},{"schema_version":"1.0","task_id":"PINK-IPTV-EXTREME-REAL-FLOW-056","repository":"martaxi-boss/VPS","recorded_at":"2026-10-05T16:33:55.206Z","previous_event_sha256":null,"sequence":2,"event":"REPLAN","strategy_generation":2,"action_fingerprint":"056-await-measured-native-route-correction","attempt_count":1,"identical_failure_count":0,"no_progress_iterations":0,"detail":"Suspend prepared real-flow builds until Task055 completes live offline route diagnostics and corrects the demonstrated cause with strict negative checks preserved. Then pin056 to the exact corrected, audited PINK source; include normal system consent, public phase statuses and lint. Validate records with pinned canonical validator in hosted Actions because local shell is nonresponsive. Private account retrieval and real peer proof still require prepared CI success plus separate exact operational transition; no fixture or infrastructure mutation is authorized by this replan."}]''')
          for record in pending:
              record['previous_event_sha256']=canonical_sha256(records[-1]) if records else None
              records.append(record)
          validate_recovery_journal(records)
          for record in pending:
              print('VALIDATED_RECORD_'+str(record['sequence'])+'='+json.dumps(record,separators=(',',':')))
              print('VALIDATED_SHA_'+str(record['sequence'])+'='+canonical_sha256(record))
          print('CANONICAL_BOUNDED_HOSTED_RECOVERY_VALIDATION=PASS')
          PY
  prepare:
    if: github.event.head_commit.message != 'Authorize exact real Android flow 056' && github.event.head_commit.message != 'Validate bounded hosted recovery records 056'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      XT_SKIP_FFMPEG_SIDECAR: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Checkout exact audited PINK source
        run: |
          git clone --no-checkout https://github.com/martaxi-boss/pink-iptv.git "$RUNNER_TEMP/pink055-source"
          git -C "$RUNNER_TEMP/pink055-source" checkout --detach c5b36c9d4d9f69b97289ce4709faf8510a8e36e4
          cp -r "$RUNNER_TEMP/pink055-source/clients" .
          mkdir -p .github/scripts
          cp "$RUNNER_TEMP/pink055-source/.github/scripts/filter_scan_findings.py" .github/scripts/
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.31.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;29.0.13846066"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Prepare complete pinned upstream application
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/infinitel8p/Extreme-InfiniTV.git "$RUNNER_TEMP/pink-extreme"
          git -C "$RUNNER_TEMP/pink-extreme" checkout --detach 1efcc1b4ab3468db04aedd1c466228c52ef001b7
          python clients/extreme/prepare.py "$RUNNER_TEMP/pink-extreme"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: "${{ runner.temp }}/pink-extreme/src-tauri -> target"
          key: pink-extreme-056
      - name: Install and verify login contract
        working-directory: ${{ runner.temp }}/pink-extreme
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run tests/pink-session.test.ts tests/pink-storage.test.ts tests/pink-network.test.ts tests/stall-watchdog.test.ts tests/vod-remux-memory.test.ts
          pnpm run build
      - name: Generate PINK launcher resources
        working-directory: ${{ runner.temp }}/pink-extreme
        run: |
          pnpm tauri icon "$GITHUB_WORKSPACE/clients/extreme/assets/pink-icon.png"
      - name: Build installable Android APK
        working-directory: ${{ runner.temp }}/pink-extreme
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066
        run: pnpm tauri android build --debug --apk --target aarch64 --target armv7 --target x86_64
      - name: Compile instrumentation and verify Android native payload
        working-directory: ${{ runner.temp }}/pink-extreme/src-tauri/gen/android
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066
        run: |
          ./gradlew --no-daemon app:assembleUniversalDebugAndroidTest app:testUniversalDebugUnitTest -x app:rustBuildUniversalDebug
          python - <<'PY'
          from pathlib import Path
          import zipfile
          apks = list(Path('app/build/outputs/apk').rglob('*debug*.apk'))
          candidates = [p for p in apks if 'androidTest' not in str(p)]
          assert candidates
          for path in candidates:
              with zipfile.ZipFile(path) as apk:
                  names = apk.namelist()
                  assert any(n.endswith('/libwg-go.so') for n in names)
                  assert not any(n.endswith('/libwg.so') or n.endswith('/libwg-quick.so') for n in names)
          print('OFFICIAL_NON_ROOT_PAYLOAD=PASS')
          PY
      - name: Prepare real Android emulator verification
        run: |
          set -euo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          test -r /dev/kvm
          test -w /dev/kvm
          cat > "$RUNNER_TEMP/pink053-emulator.sh" <<'SCRIPT'
          set -euo pipefail
          adb install -r app/build/outputs/apk/universal/debug/app-universal-debug.apk
          adb install -r app/build/outputs/apk/androidTest/universal/debug/app-universal-debug-androidTest.apk
          adb shell am instrument -w -r -e class com.pinkiptv.extreme.PinkVpnIdentityTest com.pinkiptv.extreme.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/pink053-identity.txt"
          cat "$RUNNER_TEMP/pink053-identity.txt"
          grep -q 'OK (2 tests)' "$RUNNER_TEMP/pink053-identity.txt"
          adb shell am instrument -w -r -e class com.pinkiptv.extreme.PinkVpnStartupTest com.pinkiptv.extreme.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/pink053-startup.txt"
          cat "$RUNNER_TEMP/pink053-startup.txt"
          grep -q 'OK (1 test)' "$RUNNER_TEMP/pink053-startup.txt"
          echo KEYSTORE_NORMAL_CONSENT_OFFLINE_FAIL_CLOSED_RECREATION=PASS
          SCRIPT
      - name: Real Android Keystore, normal VPN consent and startup capture
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: ${{ runner.temp }}/pink-extreme/src-tauri/gen/android
          script: bash "$RUNNER_TEMP/pink053-emulator.sh"
      - name: PINK source privacy scan
        working-directory: ${{ runner.temp }}/pink055-source
        run: | # pragma: allowlist secret -- scan tool invocation, no credential value
          python -m pip install --disable-pip-version-check detect-secrets==1.5.0
          detect-secrets scan --all-files --exclude-files '(^|/)(\.git|\.pytest_cache|\.ruff_cache|.*egg-info)/' > /tmp/pink-extreme-scan.json
          python .github/scripts/filter_scan_findings.py /tmp/pink-extreme-scan.json
      - name: Package exact source, APK and integrity hashes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pink-deliverable"
          APK="$RUNNER_TEMP/pink-extreme/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          if [ -z "$APK" ]; then
            APK=$(find "$RUNNER_TEMP/pink-extreme/src-tauri/gen/android/app/build/outputs/apk" -name '*debug*.apk' -print -quit)
          fi
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/pink-deliverable/PINK-IPTV-Extreme-1.9.0-debug.apk"
          cp "$RUNNER_TEMP/pink-extreme/src-tauri/gen/android/app/build/outputs/apk/androidTest/universal/debug/app-universal-debug-androidTest.apk" "$RUNNER_TEMP/pink-deliverable/PINK-IPTV-Extreme-instrumentation.apk"
          tar --exclude='.git' --exclude='node_modules' --exclude='target' --exclude='build' --exclude='.gradle' --exclude='dist' --exclude='__pycache__' -czf "$RUNNER_TEMP/pink-deliverable/PINK-IPTV-Extreme-source.tar.gz" -C "$RUNNER_TEMP" pink-extreme
          cp -r clients/extreme "$RUNNER_TEMP/pink-deliverable/rebuild-recipe"
          find "$RUNNER_TEMP/pink-deliverable/rebuild-recipe" -type d -name __pycache__ -prune -exec rm -rf {} +
          cd "$RUNNER_TEMP/pink-deliverable"
          printf '{"implementation_sha":"%s","upstream_sha":"1efcc1b4ab3468db04aedd1c466228c52ef001b7"}\n' "c5b36c9d4d9f69b97289ce4709faf8510a8e36e4" > provenance.json
          sha256sum *.apk *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PINK-IPTV-Extreme-056
          path: ${{ runner.temp }}/pink-deliverable
          if-no-files-found: error
          retention-days: 30

  proof:
    if: github.event.head_commit.message == 'Authorize exact real Android flow 056'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Revalidate exact operational authorization and prepared artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          auth=json.loads(Path('.project-leader/transitions/PINK-IPTV-EXTREME-REAL-FLOW-056-EXECUTE.authorization.json').read_text())
          assert auth['repository']=='martaxi-boss/VPS'
          assert auth['task_id']=='PINK-IPTV-EXTREME-REAL-FLOW-056'
          assert auth['action']=='staging_operational_proof'
          assert auth['target']['environment']=='staging-disposable-emulator'
          source=auth['target']['revision']
          subprocess.run(['git','merge-base','--is-ancestor',source,'HEAD'],check=True)
          assert not subprocess.check_output(['git','diff','--name-only',source,'HEAD','--','ops/pink_vpn_056_runtime.py','ops/pink_vpn_056_emulator.sh','.github/workflows/pink-extreme-real-flow-056.yml'],text=True)
          prefix='OVH:vps-32bea5b6;PINK:c5b36c9d4d9f69b97289ce4709faf8510a8e36e4;artifact-run:'
          assert auth['target']['identifier'].startswith(prefix)
          run_id=auth['target']['identifier'][len(prefix):]
          assert run_id.isdigit()
          request=urllib.request.Request('https://api.github.com/repos/martaxi-boss/VPS/actions/runs/'+run_id,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          run=json.load(urllib.request.urlopen(request,timeout=15))
          assert run['head_sha']==source and run['conclusion']=='success' and run['name']=='PINK Extreme Real Flow 056'
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('PINK056_ARTIFACT_RUN='+run_id+'\n')
          print('EXACT_AUTHORITY_AND_PREPARED_APK=PASS')
          PYCODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: PINK-IPTV-Extreme-056
          run-id: ${{ env.PINK056_ARTIFACT_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pink056-artifact
      - name: Verify exact APK/source integrity and prepare bounded emulator
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pink056-artifact"
          sha256sum -c SHA256SUMS
          python - <<'PYCODE'
          import json
          from pathlib import Path
          assert json.loads(Path('provenance.json').read_text())['implementation_sha']=='c5b36c9d4d9f69b97289ce4709faf8510a8e36e4'
          PYCODE
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Real authorized account, Android enrollment, catalog and decoded playback
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ops/pink_vpn_056_emulator.sh
