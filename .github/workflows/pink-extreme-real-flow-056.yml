name: PINK Extreme Real Flow 056
on:
  push:
    branches: ["builder/pink-extreme-real-flow-056"]
    paths: ["ops/pink_vpn_056*", ".github/workflows/pink-extreme-real-flow-056.yml", ".project-leader/transitions/PINK-IPTV-EXTREME-REAL-FLOW-056-EXECUTE*.authorization.json"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pink-extreme-real-flow-056
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event.head_commit.message != 'Authorize exact real Android flow 056' && github.event.head_commit.message != 'Prepare bounded process-exit diagnostics 056'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      XT_SKIP_FFMPEG_SIDECAR: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate bounded operational scripts and diagnostic privacy
        run: |
          bash -n ops/pink_vpn_056_emulator.sh
          python ops/pink_vpn_056_crash_test.py
      - name: Checkout exact audited PINK source
        run: |
          git clone --no-checkout https://github.com/martaxi-boss/pink-iptv.git "$RUNNER_TEMP/pink055-source"
          git -C "$RUNNER_TEMP/pink055-source" checkout --detach 6d766914a8634f641b5eabc6c18a0dbf13a37d99
          cp -r "$RUNNER_TEMP/pink055-source/clients" .
          mkdir -p .github/scripts
          cp "$RUNNER_TEMP/pink055-source/.github/scripts/filter_scan_findings.py" .github/scripts/
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.31.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;29.0.13846066"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Prepare complete pinned upstream application
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/infinitel8p/Extreme-InfiniTV.git "$RUNNER_TEMP/pink-extreme"
          git -C "$RUNNER_TEMP/pink-extreme" checkout --detach 1efcc1b4ab3468db04aedd1c466228c52ef001b7
          python clients/extreme/prepare.py "$RUNNER_TEMP/pink-extreme"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: "${{ runner.temp }}/pink-extreme/src-tauri -> target"
          key: pink-extreme-056
          cache-on-failure: "true"
      - name: Install and verify login contract
        working-directory: ${{ runner.temp }}/pink-extreme
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run tests/pink-session.test.ts tests/pink-storage.test.ts tests/pink-network.test.ts tests/pink-bridge.test.ts tests/pink-presentation.test.ts tests/stall-watchdog.test.ts tests/vod-remux-memory.test.ts
          pnpm run build
      - name: Generate PINK launcher resources
        working-directory: ${{ runner.temp }}/pink-extreme
        run: |
          pnpm tauri icon "$GITHUB_WORKSPACE/clients/extreme/assets/pink-icon.png"
      - name: Build installable Android APK
        working-directory: ${{ runner.temp }}/pink-extreme
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066
        run: pnpm tauri android build --debug --apk --target aarch64 --target armv7 --target x86_64
      - name: Compile instrumentation and verify Android native payload
        working-directory: ${{ runner.temp }}/pink-extreme/src-tauri/gen/android
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066
        run: |
          ./gradlew --no-daemon app:assembleUniversalDebugAndroidTest app:testUniversalDebugUnitTest -x app:rustBuildUniversalDebug
          python - <<'PY'
          from pathlib import Path
          import zipfile
          apks = list(Path('app/build/outputs/apk').rglob('*debug*.apk'))
          candidates = [p for p in apks if 'androidTest' not in str(p)]
          assert candidates
          for path in candidates:
              with zipfile.ZipFile(path) as apk:
                  names = apk.namelist()
                  assert any(n.endswith('/libwg-go.so') for n in names)
                  assert not any(n.endswith('/libwg.so') or n.endswith('/libwg-quick.so') for n in names)
          print('OFFICIAL_NON_ROOT_PAYLOAD=PASS')
          PY
      - name: Prepare real Android emulator verification
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/pink-extreme/src-tauri/gen/android" && ./gradlew --stop)
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          test -r /dev/kvm
          test -w /dev/kvm
          cat > "$RUNNER_TEMP/pink053-emulator.sh" <<'SCRIPT'
          set -euo pipefail
          adb install -r app/build/outputs/apk/universal/debug/app-universal-debug.apk
          adb install -r app/build/outputs/apk/androidTest/universal/debug/app-universal-debug-androidTest.apk
          adb shell am instrument -w -r -e class com.pinkiptv.extreme.PinkVpnIdentityTest com.pinkiptv.extreme.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/pink053-identity.txt"
          cat "$RUNNER_TEMP/pink053-identity.txt"
          grep -q 'OK (2 tests)' "$RUNNER_TEMP/pink053-identity.txt"
          adb shell am instrument -w -r -e class com.pinkiptv.extreme.PinkWebBridgeTest com.pinkiptv.extreme.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/pink055-origin.txt"
          cat "$RUNNER_TEMP/pink055-origin.txt"
          grep -q 'OK (1 test)' "$RUNNER_TEMP/pink055-origin.txt"
          adb shell am instrument -w -r -e class com.pinkiptv.extreme.PinkVpnStartupTest com.pinkiptv.extreme.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/pink053-startup.txt"
          cat "$RUNNER_TEMP/pink053-startup.txt"
          if ! grep -q 'OK (1 test)' "$RUNNER_TEMP/pink053-startup.txt"; then
            adb logcat -b crash -d -t 100
            adb shell ip -4 rule
            adb shell ip -6 rule
            adb shell ip -4 route show table all
            adb shell ip -6 route show table all
          fi
          grep -q 'OK (1 test)' "$RUNNER_TEMP/pink053-startup.txt"
          adb shell am force-stop com.pinkiptv.extreme
          echo KEYSTORE_NORMAL_CONSENT_OFFLINE_FAIL_CLOSED_RECREATION=PASS
          SCRIPT
      - name: Real Android Keystore, normal VPN consent and startup capture
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: ${{ runner.temp }}/pink-extreme/src-tauri/gen/android
          script: bash "$RUNNER_TEMP/pink053-emulator.sh"
      - name: PINK source privacy scan
        working-directory: ${{ runner.temp }}/pink055-source
        run: | # pragma: allowlist secret -- scan tool invocation, no credential value
          python -m pip install --disable-pip-version-check detect-secrets==1.5.0
          detect-secrets scan --all-files --exclude-files '(^|/)(\.git|\.pytest_cache|\.ruff_cache|.*egg-info)/' > /tmp/pink-extreme-scan.json
          python .github/scripts/filter_scan_findings.py /tmp/pink-extreme-scan.json
      - name: Audit complete Android lint report
        if: ${{ always() && !cancelled() }}
        working-directory: ${{ runner.temp }}/pink-extreme/src-tauri/gen/android
        run: |
          set +e
          ./gradlew --no-daemon app:lintUniversalDebug -x app:rustBuildUniversalDebug
          pink_lint_status=$?
          report="app/build/intermediates/lint_intermediate_text_report/universalDebug/lintReportUniversalDebug/lint-results-universalDebug.txt"
          if [ -f "$report" ]; then cat "$report"; fi
          exit "$pink_lint_status"
      - name: Preserve full public-source lint reports for review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PINK-Android-lint-056
          path: ${{ runner.temp }}/pink-extreme/src-tauri/gen/android/app/build/reports/lint-results-universalDebug.*
          if-no-files-found: ignore
          retention-days: 30
      - name: Package exact source, APK and integrity hashes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pink-deliverable"
          APK="$RUNNER_TEMP/pink-extreme/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk"
          if [ -z "$APK" ]; then
            APK=$(find "$RUNNER_TEMP/pink-extreme/src-tauri/gen/android/app/build/outputs/apk" -name '*debug*.apk' -print -quit)
          fi
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/pink-deliverable/PINK-IPTV-Extreme-1.9.0-debug.apk"
          cp "$RUNNER_TEMP/pink-extreme/src-tauri/gen/android/app/build/outputs/apk/androidTest/universal/debug/app-universal-debug-androidTest.apk" "$RUNNER_TEMP/pink-deliverable/PINK-IPTV-Extreme-instrumentation.apk"
          tar --exclude='.git' --exclude='node_modules' --exclude='target' --exclude='build' --exclude='.gradle' --exclude='dist' --exclude='__pycache__' -czf "$RUNNER_TEMP/pink-deliverable/PINK-IPTV-Extreme-source.tar.gz" -C "$RUNNER_TEMP" pink-extreme
          cp -r clients/extreme "$RUNNER_TEMP/pink-deliverable/rebuild-recipe"
          find "$RUNNER_TEMP/pink-deliverable/rebuild-recipe" -type d -name __pycache__ -prune -exec rm -rf {} +
          cd "$RUNNER_TEMP/pink-deliverable"
          printf '{"implementation_sha":"%s","upstream_sha":"1efcc1b4ab3468db04aedd1c466228c52ef001b7"}\n' "6d766914a8634f641b5eabc6c18a0dbf13a37d99" > provenance.json
          sha256sum *.apk *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PINK-IPTV-Extreme-056
          path: ${{ runner.temp }}/pink-deliverable
          if-no-files-found: error
          retention-days: 30

  diagnostic_prepare:
    # Only unchanged APK bytes from a full successful native preparation may be reused.
    if: github.event.head_commit.message == 'Prepare bounded process-exit diagnostics 056'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate bounded diagnostics and unchanged protected fixture helper
        run: |
          bash -n ops/pink_vpn_056_emulator.sh
          python ops/pink_vpn_056_crash_test.py
          git diff --exit-code af91c7d9f61cf91a94a71aa3be231f103a91816c HEAD -- ops/pink_vpn_056_runtime.py
      - name: Verify full native APK certification and exact product source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import json,os,urllib.request
          def get(repo,path):
              request=urllib.request.Request('https://api.github.com/repos/martaxi-boss/'+repo+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              return json.load(urllib.request.urlopen(request,timeout=20))
          for repo,run_id,sha,name in [('pink-iptv',37381060672,'6d766914a8634f641b5eabc6c18a0dbf13a37d99','PINK Extreme Android 042'),('pink-iptv',37381060663,'6d766914a8634f641b5eabc6c18a0dbf13a37d99','Backend CI'),('VPS',37381174693,'af91c7d9f61cf91a94a71aa3be231f103a91816c','PINK Extreme Real Flow 056')]:
              run=get(repo,'actions/runs/'+str(run_id))
              assert run['head_sha']==sha and run['name']==name and run['status']=='completed' and run['conclusion']=='success'
          jobs=get('VPS','actions/runs/37381174693/jobs')['jobs']
          steps={step['name']:step['conclusion'] for job in jobs if job['name']=='prepare' for step in job['steps']}
          for name in ['Compile instrumentation and verify Android native payload','Real Android Keystore, normal VPN consent and startup capture','PINK source privacy scan','Audit complete Android lint report','Package exact source, APK and integrity hashes']:
              assert steps.get(name)=='success'
          print('UNCHANGED_EXACT_APK_FULL_NATIVE_CERTIFICATION=PASS')
          PYCODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: PINK-IPTV-Extreme-056
          run-id: 37381174693
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pink-deliverable
      - name: Verify byte-identical certified APK and preserve artifact lineage
        env:
          PINK_DELIVERY: ${{ runner.temp }}/pink-deliverable
        run: |
          cd "$PINK_DELIVERY"
          sha256sum -c SHA256SUMS
          python - <<'PYCODE'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['PINK_DELIVERY'])
          assert json.loads((root/'provenance.json').read_text())['implementation_sha']=='6d766914a8634f641b5eabc6c18a0dbf13a37d99'
          expected='0cca06dc873295196efbf0098e7e835fc1e049397cf4755dd6ae65062ed8c4ef'
          assert hashlib.sha256((root/'PINK-IPTV-Extreme-1.9.0-debug.apk').read_bytes()).hexdigest()==expected
          (root/'artifact-lineage.json').write_text(json.dumps({'full_native_preparation_run':37381174693,'full_native_preparation_source':'af91c7d9f61cf91a94a71aa3be231f103a91816c','pink_source':'6d766914a8634f641b5eabc6c18a0dbf13a37d99','apk_sha256':expected,'operational_source':os.environ['GITHUB_SHA']})+'\n')
          print('BYTE_IDENTICAL_APK_WITH_TESTED_DIAGNOSTICS=PASS')
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PINK-IPTV-Extreme-056
          path: ${{ runner.temp }}/pink-deliverable
          if-no-files-found: error
          retention-days: 30

  proof:
    if: github.event.head_commit.message == 'Authorize exact real Android flow 056'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Revalidate exact operational authorization and prepared artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import json,os,subprocess,urllib.request
          from pathlib import Path
          added=subprocess.check_output(['git','diff','--name-only','--diff-filter=A','HEAD^','HEAD'],text=True).splitlines()
          authorities=[path for path in added if path.startswith('.project-leader/transitions/PINK-IPTV-EXTREME-REAL-FLOW-056-EXECUTE') and path.endswith('.authorization.json')]
          assert len(authorities)==1
          auth=json.loads(Path(authorities[0]).read_text())
          assert authorities[0]=='.project-leader/transitions/'+auth['transition_id']+'.authorization.json'
          assert auth['repository']=='martaxi-boss/VPS'
          assert auth['task_id']=='PINK-IPTV-EXTREME-REAL-FLOW-056'
          assert auth['action']=='staging_operational_proof'
          assert auth['target']['environment']=='staging-disposable-emulator'
          source=auth['target']['revision']
          subprocess.run(['git','merge-base','--is-ancestor',source,'HEAD'],check=True)
          assert not subprocess.check_output(['git','diff','--name-only',source,'HEAD','--','ops/pink_vpn_056_runtime.py','ops/pink_vpn_056_emulator.sh','ops/pink_vpn_056_crash.py','ops/pink_vpn_056_crash_test.py','.github/workflows/pink-extreme-real-flow-056.yml'],text=True)
          prefix='OVH:vps-32bea5b6;PINK:6d766914a8634f641b5eabc6c18a0dbf13a37d99;artifact-run:'
          assert auth['target']['identifier'].startswith(prefix)
          run_id=auth['target']['identifier'][len(prefix):]
          assert run_id.isdigit()
          request=urllib.request.Request('https://api.github.com/repos/martaxi-boss/VPS/actions/runs/'+run_id,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          run=json.load(urllib.request.urlopen(request,timeout=15))
          assert run['head_sha']==source and run['conclusion']=='success' and run['name']=='PINK Extreme Real Flow 056'
          product_request=urllib.request.Request('https://api.github.com/repos/martaxi-boss/pink-iptv/actions/runs/37381060672',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          product_run=json.load(urllib.request.urlopen(product_request,timeout=15))
          assert product_run['head_sha']=='6d766914a8634f641b5eabc6c18a0dbf13a37d99' and product_run['status']=='completed' and product_run['conclusion']=='success'
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('PINK056_ARTIFACT_RUN='+run_id+'\n')
          print('EXACT_AUTHORITY_AND_PREPARED_APK=PASS')
          PYCODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: PINK-IPTV-Extreme-056
          run-id: ${{ env.PINK056_ARTIFACT_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pink056-artifact
      - name: Verify exact APK/source integrity and prepare bounded emulator
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pink056-artifact"
          sha256sum -c SHA256SUMS
          python - <<'PYCODE'
          import json
          from pathlib import Path
          assert json.loads(Path('provenance.json').read_text())['implementation_sha']=='6d766914a8634f641b5eabc6c18a0dbf13a37d99'
          PYCODE
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Real authorized account, Android enrollment, catalog and decoded playback
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ops/pink_vpn_056_emulator.sh
