name: Lowcost Yandex ownership proof guarded deploy once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-yandex-proof-deploy-once-20261108.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-yandex-ownership-20261108
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Deploy project-owned proof with automatic rollback and no submissions
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          echo LOWCOST_YANDEX_DIAGNOSTIC=READ_ONLY
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('/etc/nginx/sites-enabled').iterdir():
              if p.is_file():
                  target=p.resolve()
                  body=target.read_text()
                  if 'server_name www.lowcost-europa.eu;' in body:
                      print('LOWCOST_VHOST_LINK='+str(p))
                      print('LOWCOST_VHOST_TARGET='+str(target))
                      print('LOWCOST_VHOST_MATCHES_SOURCE='+str(body==Path('/srv/projects/lowcost-europa/deploy/nginx/lowcost-europa.eu.conf').read_text()))
          print('LOWCOST_YANDEX_ROLLBACK_DIR_PRESENT='+str(Path('/srv/projects/lowcost-europa/private/yandex-ownership-20261108/rollback').exists()))
          PY
          git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD
          REMOTE
