name: Lowcost Yandex ownership proof guarded deploy once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-yandex-proof-deploy-once-20261108.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-yandex-ownership-20261108
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Deploy project-owned proof with automatic rollback and no submissions
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          TASK="$ROOT/private/yandex-ownership-20261108"
          OLD=f157e3b98786db21d6f541917ec7b545e9913485
          NEW=ffbacda4c5c166e204a0bf2b8d621099480c8f7e
          [[ -f "$TASK/transport.pem" && ! -e "$TASK/rollback" ]]
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" == "$OLD" ]]
          [[ -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-indexnow.timer
          nginx -t >/dev/null 2>&1
          CONF="$(python3 - <<'PY_CONF'
          from pathlib import Path
          paths={p.resolve() for p in Path('/etc/nginx/sites-enabled').iterdir() if p.is_file()}
          found=[p for p in paths if 'server_name www.lowcost-europa.eu;' in p.read_text() and 'root /srv/projects/lowcost-europa/www;' in p.read_text()]
          assert len(found)==1
          p=found[0]
          assert str(p).startswith('/etc/nginx/sites-available/')
          print(p)
          PY_CONF
          )"
          cmp -s "$CONF" "$ROOT/deploy/nginx/lowcost-europa.eu.conf"
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          LEGAL="$ROOT/.legal/operator.json"
          ENVHASH="$(sha256sum "$ENVFILE" | cut -d' ' -f1)"
          LEGALHASH="$(sha256sum "$LEGAL" | cut -d' ' -f1)"
          git -c safe.directory="$ROOT" -C "$ROOT" fetch -q https://github.com/martaxi-boss/lowcost-europa.git main
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse FETCH_HEAD)" == "$NEW" ]]
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" merge-base "$OLD" "$NEW")" == "$OLD" ]]
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" diff --name-only "$OLD" "$NEW" | sort)" == "$(printf '%s\n' apps/storefront/tests/test_visual_professional.py deploy/nginx/lowcost-europa.eu.conf | sort)" ]]
          printf '%s' '' | base64 -d > "$TASK/token.encrypted"
          openssl pkeyutl -decrypt -inkey "$TASK/transport.pem" -in "$TASK/token.encrypted" -out "$TASK/token" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          TOKEN="$(cat "$TASK/token")"
          [[ "$TOKEN" =~ ^[a-f0-9]{16}$ ]]
          PROOF="$ROOT/www/yandex_$TOKEN.html"
          [[ ! -e "$PROOF" ]]
          mkdir -m 700 "$TASK/rollback"
          cp -a "$CONF" "$TASK/rollback/nginx.conf"
          printf '%s\n' "$OLD" > "$TASK/rollback/old-sha"
          printf '%s\n' "$CONF" > "$TASK/rollback/nginx-path"
          MUTATED=0
          rollback() {
            result=$?
            trap - EXIT
            if [[ "$result" -ne 0 && "$MUTATED" == 1 ]]; then
              cp -a "$TASK/rollback/nginx.conf" "$CONF"
              git -c safe.directory="$ROOT" -C "$ROOT" checkout --detach -q "$OLD"
              rm -f -- "$PROOF"
              nginx -t >/dev/null 2>&1
              systemctl reload nginx
              echo LOWCOST_YANDEX_ROLLBACK=PASS
            fi
            exit "$result"
          }
          trap rollback EXIT
          MUTATED=1
          umask 022
          git -c safe.directory="$ROOT" -C "$ROOT" checkout --detach -q "$NEW"
          printf '<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"></head><body>Verification: %s</body></html>\n' "$TOKEN" > "$PROOF"
          chmod 644 "$PROOF"
          install -m 644 "$ROOT/deploy/nginx/lowcost-europa.eu.conf" "$CONF"
          umask 077
          nginx -t >/dev/null 2>&1
          systemctl reload nginx
          curl -fsS --max-time 20 --resolve www.lowcost-europa.eu:443:146.59.145.3 "https://www.lowcost-europa.eu/yandex_$TOKEN.html" -o "$TASK/proof-response.html"
          cmp -s "$PROOF" "$TASK/proof-response.html"
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 https://www.lowcost-europa.eu/)" == 200 ]]
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --resolve lowcost-europa.eu:443:146.59.145.3 https://lowcost-europa.eu/)" == 301 ]]
          for slug in cavitacao-rf-vacuum-corpo hydrodermoabrasao-aqua-facial-multifuncoes pressoterapia-vacuum-drenagem hifu diodo-laser-remocao-tatuagens-pigmentacao; do
            [[ "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 "https://www.lowcost-europa.eu/products/$slug/")" == 200 ]]
          done
          for path in painel/ admin/; do
            curl -sS -D "$TASK/private-headers" -o /dev/null --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 "https://www.lowcost-europa.eu/$path"
            grep -Eq '^HTTP/.* 302' "$TASK/private-headers"
            grep -Eiq '^x-robots-tag:.*noindex' "$TASK/private-headers"
            grep -Eiq '^cache-control:.*private' "$TASK/private-headers"
          done
          curl -fsS --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 https://www.lowcost-europa.eu/sitemap.xml -o "$TASK/sitemap.xml"
          [[ "$(sha256sum "$ENVFILE" | cut -d' ' -f1)" == "$ENVHASH" ]]
          [[ "$(sha256sum "$LEGAL" | cut -d' ' -f1)" == "$LEGALHASH" ]]
          [[ -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-indexnow.timer
          systemctl is-active --quiet certbot.timer
          STATEHASH="$(sha256sum "$ROOT/.indexnow/accepted.json" | cut -d' ' -f1)"
          systemd-run --quiet --wait --pipe --collect --unit=lowcost-yandex-indexnow-audit-20261108 \
            -p User=le001_1789265592 -p WorkingDirectory="$ROOT" \
            -p EnvironmentFile="$ENVFILE" -p NoNewPrivileges=true -p PrivateTmp=true -p UMask=0077 \
            "$ROOT/.venv/bin/python" manage.py notify_indexnow --dry-run > "$TASK/indexnow-audit"
          grep -E '^INDEXNOW_DRY_RUN public=[0-9]+ changed=[0-9]+ removed=[0-9]+$' "$TASK/indexnow-audit"
          [[ "$(sha256sum "$ROOT/.indexnow/accepted.json" | cut -d' ' -f1)" == "$STATEHASH" ]]
          echo LOWCOST_INDEXNOW_NO_SUBMISSION_STATE_PRESERVED=PASS
          echo LOWCOST_YANDEX_PROOF_HTTP_CONTENT=PASS
          echo LOWCOST_YANDEX_CANONICAL_AND_CATEGORIES=PASS
          echo LOWCOST_YANDEX_PANEL_PRIVACY=PASS
          echo LOWCOST_YANDEX_PRIVATE_CONFIG_UNCHANGED=PASS
          echo "LOWCOST_YANDEX_GITHUB_VPS_SHA=$NEW"
          echo LOWCOST_YANDEX_DEPLOY=PASS
          trap - EXIT
          rm -f -- "$TASK/token" "$TASK/token.encrypted" "$TASK/transport.pem" "$TASK/transport-public.pem" "$TASK/proof-response.html" "$TASK/private-headers" "$TASK/sitemap.xml" "$TASK/indexnow-audit"
          REMOTE
