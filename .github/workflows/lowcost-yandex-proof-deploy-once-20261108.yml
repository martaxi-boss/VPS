name: Lowcost Yandex ownership proof guarded deploy once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-yandex-proof-deploy-once-20261108.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-yandex-ownership-20261108
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Deploy project-owned proof with automatic rollback and no submissions
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          TASK="$ROOT/private/yandex-ownership-20261108"
          OLD=f157e3b98786db21d6f541917ec7b545e9913485
          NEW=ffbacda4c5c166e204a0bf2b8d621099480c8f7e
          CONF="$ROOT/deploy/nginx/lowcost-europa.eu.conf"
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" == "$NEW" ]]
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" diff --name-only)" == deploy/nginx/lowcost-europa.eu.conf ]]
          cmp -s "$CONF" "$TASK/rollback/nginx.conf"
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" hash-object "$CONF")" == "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse "$OLD:deploy/nginx/lowcost-europa.eu.conf")" ]]
          TOKEN="$(cat "$TASK/token")"
          [[ "$TOKEN" =~ ^[a-f0-9]{16}$ ]]
          PROOF="$ROOT/www/yandex_$TOKEN.html"
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 "https://www.lowcost-europa.eu/yandex_$TOKEN.html")"
          echo "LOWCOST_YANDEX_PRIOR_PROOF_HTTP=$status"
          git -c safe.directory="$ROOT" -C "$ROOT" restore --source=HEAD --worktree -- deploy/nginx/lowcost-europa.eu.conf
          [[ -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          git -c safe.directory="$ROOT" -C "$ROOT" checkout --detach -q "$OLD"
          cmp -s "$CONF" "$TASK/rollback/nginx.conf"
          nginx -t >/dev/null 2>&1
          systemctl reload nginx
          rm -f -- "$PROOF"
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 https://www.lowcost-europa.eu/)" == 200 ]]
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-indexnow.timer
          echo LOWCOST_YANDEX_BASELINE_RECOVERY=PASS
          REMOTE
