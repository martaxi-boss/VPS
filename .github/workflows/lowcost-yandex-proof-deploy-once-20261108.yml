name: Lowcost Yandex ownership proof guarded deploy once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-yandex-proof-deploy-once-20261108.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-yandex-ownership-20261108
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Deploy project-owned proof with automatic rollback and no submissions
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          TASK="$ROOT/private/yandex-ownership-20261108"
          OLD=ffbacda4c5c166e204a0bf2b8d621099480c8f7e
          NEW=80e5544b8f3a510973beb63a44a791e4341f29c0
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" == "$OLD" ]]
          [[ -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          CONF="$ROOT/deploy/nginx/lowcost-europa.eu.conf"
          CONFHASH="$(sha256sum "$CONF" | cut -d' ' -f1)"
          git -c safe.directory="$ROOT" -C "$ROOT" fetch -q https://github.com/martaxi-boss/lowcost-europa.git main
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse FETCH_HEAD)" == "$NEW" ]]
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" merge-base "$OLD" "$NEW")" == "$OLD" ]]
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" diff --name-only "$OLD" "$NEW" | sort)" == "$(printf '%s\n' PROJECT_STATE.md docs/operations/international-search-20261108.md | sort)" ]]
          umask 022
          git -c safe.directory="$ROOT" -C "$ROOT" checkout --detach -q "$NEW"
          umask 077
          [[ "$(sha256sum "$CONF" | cut -d' ' -f1)" == "$CONFHASH" ]]
          [[ -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          [[ ! -e "$TASK/transport.pem" && ! -e "$TASK/token" && ! -e "$TASK/token.encrypted" ]]
          # Drop only the redundant task checkpoint, after exact comparison.
          for name in nginx.conf old-sha nginx-path; do
            cmp -s "$TASK/rollback/$name" "$TASK/rollback2/$name"
          done
          for name in nginx.conf old-sha nginx-path; do rm -- "$TASK/rollback2/$name"; done
          rmdir "$TASK/rollback2"
          nginx -t >/dev/null 2>&1
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-indexnow.timer
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 https://www.lowcost-europa.eu/)" == 200 ]]
          echo "LOWCOST_SEARCH_EVIDENCE_GITHUB_VPS_SHA=$NEW"
          echo LOWCOST_YANDEX_TASK_ONLY_HYGIENE=PASS
          echo LOWCOST_SEARCH_EVIDENCE_ALIGNMENT=PASS
          REMOTE
