name: Codex model metadata diagnostic (temporary)
on:
  push:
    branches: ['diagnostic/codex-model-20261010']
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare SSH using the existing VPS connection
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || { echo "VPS_ACCESS=NOT_CONFIGURED"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass > /dev/null
      - name: Inspect Codex model metadata without making an inference call
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 ubuntu@146.59.145.3 'bash -s' <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          def safe_model(value):
              return (value if isinstance(value, str) and
                      re.fullmatch(r'[A-Za-z][A-Za-z0-9._-]{0,79}', value)
                      else 'UNKNOWN')

          exe = Path.home() / 'codex-agent/node_modules/.bin/codex'
          print('CODEX_CLI_INSTALLED=' + ('yes' if exe.is_file() else 'no'))
          if exe.is_file():
              try:
                  p = subprocess.run([str(exe), '--version'], capture_output=True,
                                     text=True, timeout=8, check=False)
                  match = re.search(r'\b(?:codex-cli\s+)?(\d+\.\d+\.\d+)\b',
                                    p.stdout)
                  print('CODEX_CLI_VERSION=' + (match.group(1) if match else 'UNKNOWN'))
              except Exception:
                  print('CODEX_CLI_VERSION=UNAVAILABLE')

          root = Path(os.environ.get('CODEX_HOME') or Path.home() / '.codex')
          config_path = root / 'config.toml'
          print('CODEX_CONFIG_EXISTS=' + ('yes' if config_path.is_file() else 'no'))
          try:
              config = tomllib.loads(config_path.read_text(encoding='utf-8')) if config_path.is_file() else {}
          except Exception:
              config = {}
              print('CODEX_CONFIG_READABLE=no')
          print('CODEX_CONFIG_MODEL=' + safe_model(config.get('model')))
          print('CODEX_CONFIG_EFFORT=' + safe_model(config.get('model_reasoning_effort')))

          sessions = root / 'sessions'
          selected = 'UNKNOWN'
          if sessions.is_dir():
              try:
                  recent = sorted(sessions.rglob('*.jsonl'), key=lambda f: f.stat().st_mtime,
                                  reverse=True)[:8]
                  for file in recent:
                      with file.open('r', encoding='utf-8', errors='replace') as handle:
                          for line in handle:
                              if '"turn_context"' not in line or '"model"' not in line:
                                  continue
                              try:
                                  item = json.loads(line)
                              except json.JSONDecodeError:
                                  continue
                              if item.get('type') == 'turn_context':
                                  model = safe_model((item.get('payload') or {}).get('model'))
                                  if model != 'UNKNOWN':
                                      selected = model
                                      break
                      if selected != 'UNKNOWN':
                          break
              except Exception:
                  pass
          print('CODEX_LAST_SESSION_MODEL=' + selected)

          logs = Path.home() / 'codex-bridge/jobs'
          logmodel = 'UNKNOWN'
          if logs.is_dir():
              try:
                  recent = sorted(logs.glob('*/cli.log'), key=lambda f: f.stat().st_mtime,
                                  reverse=True)[:8]
                  pattern = re.compile(r'^\s*model:\s*([A-Za-z][A-Za-z0-9._-]{0,79})\s*$', re.I)
                  for file in recent:
                      with file.open('r', encoding='utf-8', errors='replace') as handle:
                          for line_no, line in enumerate(handle):
                              if line_no > 120:
                                  break
                              match = pattern.match(line)
                              if match:
                                  logmodel = safe_model(match.group(1))
                                  break
                      if logmodel != 'UNKNOWN':
                          break
              except Exception:
                  pass
          print('CODEX_LAST_BRIDGE_EXEC_MODEL=' + logmodel)
          PY
          REMOTE
