name: Ferrari F9 - one time idle PM2 orphan cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ferrari-f9-idle-pm2-one-time.yml']
permissions:
  contents: read
concurrency:
  group: ferrari-f9-idle-pm2-one-time
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'martaxi-boss/VPS' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify pinned SSH host key before credentials
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/f9-known-hosts"
          chmod 600 "$RUNNER_TEMP/f9-known-hosts"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/f9-known-hosts" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          echo 'F9_SSH_PIN=PASS'
      - name: Install disposable SSH helper on GitHub runner only
        shell: bash
        env:
          SSHPASS: '${{ secrets.VPS_SSH_PASSWORD }}'
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Terminate only verified empty PM2 of deleted Ferrari release
        shell: bash
        env:
          SSHPASS: '${{ secrets.VPS_SSH_PASSWORD }}'
        run: |
          set -euo pipefail
          sshpass -e ssh -T \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/f9-known-hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=10 \
            ubuntu@146.59.145.3 'sudo -n python3 -' > "$RUNNER_TEMP/f9-pm2-hygiene.txt" <<'PY_REMOTE'
          import os,pwd,signal,subprocess,time
          from pathlib import Path
          root=Path('/srv/projects/skill-universal')
          target=str(root/'releases/0a1a4c190a7d33752d6dc3f4418ed44735c8a7dd')+' (deleted)'
          units=('fadego-staging.service','lowcost-europa.service','pink-iptv-backend.service','pink-vpn.service',
                 'pm2-iptvpn-bot.service','pm2-telegram-robot-leads.service','nginx.service','postgresql@16-main.service')
          def active(u):
              p=subprocess.run(['systemctl','is-active',u],capture_output=True,text=True,timeout=8)
              return p.stdout.strip()
          before={u:active(u) for u in units}
          if any(v!='active' for v in before.values()):
              raise SystemExit('BLOCKED_PREEXISTING_SERVICE_HEALTH')
          if not (root/'current').is_symlink() or not (root/'current').resolve().is_dir():
              raise SystemExit('BLOCKED_FERRARI_CURRENT_MISSING')
          if Path('/home/ubuntu/.pm2/dump.pm2').exists():
              raise SystemExit('BLOCKED_SAVED_UBUNTU_PM2_APPS')
          uid=pwd.getpwnam('ubuntu').pw_uid
          procs={}
          for p in Path('/proc').iterdir():
              if not p.name.isdigit():continue
              try:
                  status=(p/'status').read_text()
                  pp=int(next(x.split(':',1)[1].strip() for x in status.splitlines() if x.startswith('PPid:')))
                  procs[int(p.name)]=((p/'comm').read_text().strip(),pp,p.stat().st_uid,os.readlink(p/'cwd'),os.readlink(p/'exe'))
              except (OSError,ValueError,StopIteration):pass
          matches=[pid for pid,(name,pp,owner,cwd,exe) in procs.items()
                   if name=='PM2 v7.0.4: God' and owner==uid and cwd==target and exe=='/usr/bin/node']
          if len(matches)==0:
              print('F9_STALE_FERRARI_PM2=ALREADY_ABSENT')
              raise SystemExit(0)
          if len(matches)!=1:raise SystemExit('BLOCKED_MULTIPLE_STALE_FERRARI_PM2')
          pid=matches[0]
          descendants=set(); frontier=[pid]
          while frontier:
              parent=frontier.pop()
              for k,info in procs.items():
                  if info[1]==parent and k not in descendants:
                      descendants.add(k);frontier.append(k)
          if descendants:raise SystemExit('BLOCKED_HAS_MANAGED_PROCESSES')
          proc=Path('/proc')/str(pid)
          if (proc/'comm').read_text().strip()!='PM2 v7.0.4: God' or proc.stat().st_uid!=uid:
              raise SystemExit('BLOCKED_PID_IDENTITY_CHANGED')
          if os.readlink(proc/'cwd')!=target or os.readlink(proc/'exe')!='/usr/bin/node':
              raise SystemExit('BLOCKED_PM2_PATH_CHANGED')
          fd=os.pidfd_open(pid)
          try:signal.pidfd_send_signal(fd,signal.SIGTERM)
          finally:os.close(fd)
          for _ in range(60):
              if not proc.exists():break
              try:
                  status=(proc/'status').read_text()
                  if any(x.startswith('State:') and 'Z' in x for x in status.splitlines()):break
              except OSError:break
              time.sleep(.1)
          else:raise SystemExit('BLOCKED_GRACEFUL_EXIT_INCOMPLETE')
          if {u:active(u) for u in units}!=before:
              raise SystemExit('BLOCKED_POSTCHECK_SERVICE_HEALTH_CHANGED')
          print('F9_STALE_FERRARI_PM2=REMOVED_SAFELY')
          print('F9_PROTECTED_SERVICES_UNCHANGED=8')
          PY_REMOTE
          cat "$RUNNER_TEMP/f9-pm2-hygiene.txt"
          grep -Eq '^F9_STALE_FERRARI_PM2=(REMOVED_SAFELY|ALREADY_ABSENT)$' "$RUNNER_TEMP/f9-pm2-hygiene.txt"
          echo 'F9_PM2_ONLY_HYGIENE=PASS'
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-f9-idle-pm2-${{ github.run_id }}
          path: ${{ runner.temp }}/f9-pm2-hygiene.txt
          if-no-files-found: warn
          retention-days: 7
