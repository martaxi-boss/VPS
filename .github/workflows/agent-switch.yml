name: Agent switch (Owner GitHub order)

# Names select the executor; an authenticated Owner Issue is the durable task.
# Unsupported providers fail BEFORE any Codex tokens are consumed.
on:
  workflow_call:
    outputs:
      task_count:
        description: Verified number of routed Codex workers
        value: ${{ jobs.preflight.outputs.task_count }}
      phase_count:
        description: Validated DAG phases, including held phases
        value: ${{ jobs.preflight.outputs.phase_count }}
      worker_1_status:
        description: First executor verified result
        value: ${{ jobs.codex.outputs.publication_status || jobs.codex_parallel_1.outputs.publication_status || jobs.codex_serial_1.outputs.publication_status }}
      worker_1_pr:
        description: First worker trusted PR locator
        value: ${{ jobs.codex.outputs.publication_pr || jobs.codex_parallel_1.outputs.publication_pr || jobs.codex_serial_1.outputs.publication_pr }}
      worker_1_sha:
        description: First worker trusted implementation SHA
        value: ${{ jobs.codex.outputs.publication_sha || jobs.codex_parallel_1.outputs.publication_sha || jobs.codex_serial_1.outputs.publication_sha }}
      worker_1_canonical_sha:
        description: Project Leader SHA verified by first worker publisher
        value: ${{ jobs.codex.outputs.publication_canonical_sha || jobs.codex_parallel_1.outputs.publication_canonical_sha || jobs.codex_serial_1.outputs.publication_canonical_sha }}
      worker_2_status:
        description: Second executor verified result
        value: ${{ jobs.codex_parallel_2.outputs.publication_status || jobs.codex_serial_2.outputs.publication_status }}
      worker_2_pr:
        description: Second worker trusted PR locator
        value: ${{ jobs.codex_parallel_2.outputs.publication_pr || jobs.codex_serial_2.outputs.publication_pr }}
      worker_2_sha:
        description: Second worker trusted implementation SHA
        value: ${{ jobs.codex_parallel_2.outputs.publication_sha || jobs.codex_serial_2.outputs.publication_sha }}
      worker_2_canonical_sha:
        description: Project Leader SHA verified by second worker publisher
        value: ${{ jobs.codex_parallel_2.outputs.publication_canonical_sha || jobs.codex_serial_2.outputs.publication_canonical_sha }}
    inputs:
      coordinator_plan_b64:
        description: Authenticated Owner Coordinator audit; consumed by existing bounded router
        required: true
        type: string
      phase_number:
        description: Trusted original Owner DAG phase number (local caller only)
        required: false
        type: number
        default: 1
  issues:
    types: [opened]
  # A fresh authenticated Owner Issue is required after a quota hold.
  pull_request:
    paths:
      - '.github/workflows/agent-switch.yml'
      - '.github/workflows/codex-autonomous.yml'
      - 'ops/agent_switch.py'
      - 'ops/codex_audit_strategy.py'
      - 'ops/tests/test_codex_audit_strategy.py'
      - 'ops/tests/test_audited_owner_phase.py'
      - 'ops/tests/test_agent_switch.py'
      - 'ops/codex_resource_policy.py'
      - 'ops/tests/test_codex_resource_policy.py'
      - 'ops/codex_quota_resume.py'
      - 'ops/codex_quota_workspace.py'
      - 'ops/tests/test_codex_quota_resume.py'
      - 'ops/tests/test_codex_quota_workspace.py'
      - '.github/workflows/coordinator-owner-order.yml'
      - 'ops/tests/test_coordinator_owner_routing.py'

permissions: {}

# Each Owner-authorized task is isolated. No timer can resume a worker.
concurrency:
  group: ${{ format('agent-switch-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4
      - run: |
          python3 -m py_compile ops/agent_switch.py ops/codex_audit_strategy.py
          python3 -m unittest discover -s ops/tests -p test_codex_audit_strategy.py -v
          python3 -m unittest discover -s ops/tests -p test_audited_owner_phase.py -v
          python3 -m unittest discover -s ops/tests -p test_agent_switch.py -v
          python3 -m unittest discover -s ops/tests -p test_codex_resource_policy.py -v
          python3 -m unittest discover -s ops/tests -p test_codex_quota_resume.py -v
          python3 -m unittest discover -s ops/tests -p test_codex_quota_workspace.py -v
          python3 -m unittest discover -s ops/tests -p test_codex_resume_stage_routing.py -v
          python3 -m unittest discover -s ops/tests -p test_coordinator_owner_routing.py -v

  preflight:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, '[agents run]') ||
       (startsWith(github.event.issue.title, '[coordinator run] ') &&
        inputs.coordinator_plan_b64 != ''))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      actions: read
    outputs:
      issue_number: ${{ steps.validate.outputs.issue_number }}
      codex: ${{ steps.validate.outputs.codex }}
      codex_task_b64: ${{ steps.validate.outputs.codex_task_b64 }}
      task_count: ${{ steps.validate.outputs.task_count }}
      mode: ${{ steps.validate.outputs.mode }}
      serial_independent: ${{ steps.validate.outputs.serial_independent }}
      audit_managed: ${{ steps.validate.outputs.audit_managed }}
      phase_count: ${{ steps.validate.outputs.phase_count }}
      held_task_count: ${{ steps.validate.outputs.held_task_count }}
      phase_owner_digest: ${{ steps.validate.outputs.phase_owner_digest }}
      run_stage_1: ${{ steps.validate.outputs.run_stage_1 }}
      run_stage_2: ${{ steps.validate.outputs.run_stage_2 }}
      codex_1_task_b64: ${{ steps.validate.outputs.codex_1_task_b64 }}
      codex_2_task_b64: ${{ steps.validate.outputs.codex_2_task_b64 }}
      allow_no_change_1: ${{ steps.validate.outputs.allow_no_change_1 }}
      allow_no_change_2: ${{ steps.validate.outputs.allow_no_change_2 }}
      codex_1_reasoning_effort: ${{ steps.validate.outputs.codex_1_reasoning_effort }}
      codex_2_reasoning_effort: ${{ steps.validate.outputs.codex_2_reasoning_effort }}
    steps:
      - name: Read only reviewed router from default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate bounded Owner order and agent availability
        id: validate
        env:
          ORDER_BODY: ${{ github.event.issue.body }}
          COORDINATOR_PLAN_B64: ${{ inputs.coordinator_plan_b64 }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_SOURCE: ${{ github.event.issue.number || '0' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, sys, json
          from pathlib import Path
          import importlib.util

          spec = importlib.util.spec_from_file_location('switch', 'ops/agent_switch.py')
          switch = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(switch)
          state = Path(os.environ['RUNNER_TEMP']) / 'agent-switch-preflight.txt'
          try:
              if os.environ.get('COORDINATOR_PLAN_B64'):
                  # This branch is enabled only for an exact Owner-authored
                  # Coordinator Issue through the reviewed reusable caller.
                  if not os.environ.get('ORDER_BODY', '').startswith(
                          'TARGET_REPOSITORY=martaxi-boss/Project-leader-codex'):
                      raise switch.OrderError('Coordinator Issue target mismatch')
                  order, phase_meta = switch.parse_coordinator_envelope(
                      os.environ['COORDINATOR_PLAN_B64'])
                  issue_number = int(os.environ['ISSUE_SOURCE'])
              else:
                  order, phase_meta = switch.parse_owner_envelope(
                      os.environ.get('ORDER_BODY', ''))
                  issue_number = int(os.environ['ISSUE_SOURCE'])
              values = switch.workflow_values(order)
              values['issue_number'] = str(issue_number)
              # The normalized Owner order carries exact phase metadata on
              # authenticated Owner Issue and Coordinator routes.
              # Reporting must not forget held work when phase_meta is absent.
              values['phase_count'] = str(order.get('phase_count', 1))
              values['held_task_count'] = str(order.get('held_task_count', 0))
              values['phase_owner_digest'] = order.get('phase_owner_digest', '')
              # Do not quietly substitute Codex for Gemini or Composer.
              # A future adapter must prove authentication, isolated execution,
              # Project Leader rules and independent GitHub publication first.
              missing = [name for name in ('gemini', 'composer') if values[name] == 'true']
              if missing:
                  raise switch.OrderError(
                      'Provider execution not connected/verified: ' + ', '.join(missing) +
                      '. No agent started. Codex remains available via a separate one-agent order.')
              if values['codex'] != 'true':
                  raise switch.OrderError('No connected executor selected')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                  for key, value in values.items():
                      out.write(f'{key}={value}\n')
              message = ('Bounded Codex order validated; only the selected '
                         'workers will run. Final status comes from verified results.')
              if order.get('phase_count', 1) > 1:
                  message += (' PHASE 1/' + str(order['phase_count']) +
                              ' only; remaining tasks HOLD_FOR_CI_AND_NEXT_PHASE (' +
                              str(order['held_task_count']) + ' pending).' +
                              ' Owner order SHA-256: ' + order['phase_owner_digest'])
              state.write_text(message, encoding='utf-8')
          except (switch.OrderError, ValueError) as exc:
              state.write_text('BLOCKED BEFORE EXECUTION: ' + str(exc), encoding='utf-8')
              print('Safe preflight refused the task: ' + str(exc), file=sys.stderr)
              raise SystemExit(2)
          PY
      - name: Record verified preflight in the Owner Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.validate.outputs.issue_number || github.event.issue.number }}
        shell: bash
        run: |
          if ! [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "NO_AUTHORIZED_OWNER_ISSUE_FOR_REPORT"
            exit 0
          fi
          status="$RUNNER_TEMP/agent-switch-preflight.txt"
          if test -s "$status"; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$status"
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body 'BLOCKED: router could not produce a verified preflight result.'
          fi

  codex:
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.codex == 'true' && needs.preflight.outputs.task_count == '1' && needs.preflight.outputs.run_stage_1 == 'true'
    permissions:
      contents: read
      issues: write
      actions: read  # Required by the called worker to attest a real quota hold
    uses: ./.github/workflows/codex-autonomous.yml
    with:
      task_b64: ${{ needs.preflight.outputs.codex_task_b64 }}
      issue_number: ${{ fromJSON(needs.preflight.outputs.issue_number) }}
      instance_id: ${{ inputs.phase_number > 1 && format('p{0}-1', inputs.phase_number) || '' }}
      no_auto_merge: ${{ fromJSON(needs.preflight.outputs.audit_managed) }}
      allow_no_change: ${{ fromJSON(needs.preflight.outputs.allow_no_change_1) }}
      reasoning_effort: ${{ needs.preflight.outputs.codex_1_reasoning_effort }}
    secrets: inherit

  # Two independent workers are launched only by an explicit, fully validated
  # parallel request. Both use PR-only publication to prevent stale-base or
  # concurrent merges from silently clobbering sibling changes.
  codex_parallel_1:
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.task_count == '2' && needs.preflight.outputs.mode == 'parallel' && needs.preflight.outputs.run_stage_1 == 'true'
    permissions:
      contents: read
      issues: write
      actions: read  # Required by the called worker to attest a real quota hold
    uses: ./.github/workflows/codex-autonomous.yml
    with:
      task_b64: ${{ needs.preflight.outputs.codex_1_task_b64 }}
      issue_number: ${{ fromJSON(needs.preflight.outputs.issue_number) }}
      instance_id: ${{ inputs.phase_number > 1 && format('p{0}-1', inputs.phase_number) || '1' }}
      no_auto_merge: true
      allow_no_change: ${{ fromJSON(needs.preflight.outputs.allow_no_change_1) }}
      reasoning_effort: ${{ needs.preflight.outputs.codex_1_reasoning_effort }}
    secrets: inherit

  codex_parallel_2:
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.task_count == '2' && needs.preflight.outputs.mode == 'parallel' && needs.preflight.outputs.run_stage_2 == 'true'
    permissions:
      contents: read
      issues: write
      actions: read  # Required by the called worker to attest a real quota hold
    uses: ./.github/workflows/codex-autonomous.yml
    with:
      task_b64: ${{ needs.preflight.outputs.codex_2_task_b64 }}
      issue_number: ${{ fromJSON(needs.preflight.outputs.issue_number) }}
      instance_id: ${{ inputs.phase_number > 1 && format('p{0}-2', inputs.phase_number) || '2' }}
      no_auto_merge: true
      allow_no_change: ${{ fromJSON(needs.preflight.outputs.allow_no_change_2) }}
      reasoning_effort: ${{ needs.preflight.outputs.codex_2_reasoning_effort }}
    secrets: inherit

  # Serial work waits for successful completion of stage 1. The second worker
  # uses a fresh main checkout, so it never invents access to unmerged changes.
  codex_serial_1:
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.task_count == '2' && needs.preflight.outputs.mode == 'serial' && needs.preflight.outputs.run_stage_1 == 'true'
    permissions:
      contents: read
      issues: write
      actions: read  # Required by the called worker to attest a real quota hold
    uses: ./.github/workflows/codex-autonomous.yml
    with:
      task_b64: ${{ needs.preflight.outputs.codex_1_task_b64 }}
      issue_number: ${{ fromJSON(needs.preflight.outputs.issue_number) }}
      instance_id: ${{ inputs.phase_number > 1 && format('p{0}-1', inputs.phase_number) || '1' }}
      no_auto_merge: ${{ fromJSON(needs.preflight.outputs.serial_independent) || fromJSON(needs.preflight.outputs.audit_managed) }}
      allow_no_change: ${{ fromJSON(needs.preflight.outputs.allow_no_change_1) }}
      reasoning_effort: ${{ needs.preflight.outputs.codex_1_reasoning_effort }}
    secrets: inherit

  codex_serial_2:
    needs: [preflight, codex_serial_1]
    # GitHub normally skips a dependent job when its predecessor was skipped.
    # Explicit always() keeps skipped predecessors visible to the blocking gate.
    # Serial worker two requires first worker's accepted publication result.
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.task_count == '2' &&
      needs.preflight.outputs.mode == 'serial' &&
      needs.preflight.outputs.run_stage_2 == 'true' &&
      needs.codex_serial_1.result == 'success' &&
      (needs.codex_serial_1.outputs.publication_status == 'MERGED' ||
       needs.codex_serial_1.outputs.publication_status == 'NO_CHANGE' ||
       (needs.preflight.outputs.serial_independent == 'true' &&
        needs.codex_serial_1.outputs.publication_status == 'PR_STAGED'))
    permissions:
      contents: read
      issues: write
      actions: read  # Required by the called worker to attest a real quota hold
    uses: ./.github/workflows/codex-autonomous.yml
    with:
      task_b64: ${{ needs.preflight.outputs.codex_2_task_b64 }}
      issue_number: ${{ fromJSON(needs.preflight.outputs.issue_number) }}
      instance_id: ${{ inputs.phase_number > 1 && format('p{0}-2', inputs.phase_number) || '2' }}
      no_auto_merge: ${{ fromJSON(needs.preflight.outputs.serial_independent) || fromJSON(needs.preflight.outputs.audit_managed) }}
      allow_no_change: ${{ fromJSON(needs.preflight.outputs.allow_no_change_2) }}
      reasoning_effort: ${{ needs.preflight.outputs.codex_2_reasoning_effort }}
    secrets: inherit

  # Every unstarted serial step must be recorded in the Owner Issue.
  codex_serial_blocked:
    needs: [preflight, codex_serial_1]
    if: >-
      always() && needs.preflight.result == 'success' &&
      needs.preflight.outputs.task_count == '2' &&
      needs.preflight.outputs.mode == 'serial' &&
      needs.preflight.outputs.run_stage_2 == 'true' &&
      (needs.codex_serial_1.result != 'success' ||
       (needs.codex_serial_1.outputs.publication_status != 'MERGED' &&
        needs.codex_serial_1.outputs.publication_status != 'NO_CHANGE' &&
        (needs.preflight.outputs.serial_independent != 'true' ||
         needs.codex_serial_1.outputs.publication_status != 'PR_STAGED')))
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Notify Owner of the unstarted dependent task
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.preflight.outputs.issue_number }}
          FIRST_RESULT: ${{ needs.codex_serial_1.result }}
          FIRST_PUBLICATION: ${{ needs.codex_serial_1.outputs.publication_status }}
        run: |
          set -euo pipefail
          case "$FIRST_PUBLICATION" in
            MERGED|NO_CHANGE|PR_STAGED|PR_NEEDS_ATTENTION|NO_CHANGE_UNVERIFIED|FAILED) ;;
            *) FIRST_PUBLICATION='NOT_VERIFIED' ;;
          esac
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "CODEX_2_NOT_STARTED: serial stage 1 outcome=$FIRST_RESULT, publication=$FIRST_PUBLICATION. Dependent worker 2 requires MERGED or owner-approved NO_CHANGE; only an explicitly independent serial order may proceed after CI-verified PR_STAGED on fresh main."
