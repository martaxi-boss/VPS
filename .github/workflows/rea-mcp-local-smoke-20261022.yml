name: REA MCP local smoke 20261022
on:
  push:
    branches:
      - trial/rea-chatgpt-20261022
    paths:
      - "ops/rea_mcp_local_smoke_20261022.py"
      - ".github/workflows/rea-mcp-local-smoke-20261022.yml"
permissions:
  contents: read
jobs:
  mcp-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout isolated trial code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate one-shot smoke and source isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/rea_mcp_local_smoke_20261022.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path("ops/rea_mcp_local_smoke_20261022.py").read_text()
          assert "127.0.0.1" in s and "REA_MCP_TOOLS_COUNT" in s
          assert "start_new_session=True" in s
          for v in ("apt-get", "systemctl start", "nginx ", "sudo ", "write_text("):
              assert v not in s,v
          print("MCP_TEST_ISOLATED=PASS")
          PY
      - name: Verify owner-pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          known="$RUNNER_TEMP/rea-mcp-known"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$known"
          chmod 600 "$known"
          observed="$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')"
          test "$observed" = "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc"
          echo "VPS_HOST_PIN=PASS"
      - name: Prepare temporary SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Verify real REA MCP over VPS localhost
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rea-mcp-known" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=5 \
            ubuntu@146.59.145.3 "python3 -" \
            < ops/rea_mcp_local_smoke_20261022.py
