name: Ferrari F9 APT exact safe removal plan one-shot
on:
  push:
    branches: [main]
    paths:
      - ferrari-release-requests/ferrari-f9-apt-simulate-20261106.json
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact F9 simulation authorization
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          CHANGED="$(git diff --name-only "$BEFORE" "$AFTER")"
          test "$CHANGED" = ferrari-release-requests/ferrari-f9-apt-simulate-20261106.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('ferrari-release-requests/ferrari-f9-apt-simulate-20261106.json').read_text())
          assert d=={'version':1,'phase':9,'mode':'apt-simulate-private-alternatives','no_writes':True}
          print('FERRARI_F9_APT_PLAN_GATE=PASS')
          PY
      - name: Pin existing SSH host and prepare runner only
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/known"
          chmod 600 "$RUNNER_TEMP/known"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/known" -E sha256 | awk '{print $2}')" = SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Dry run exact apt purge for ONLY 8 private-replaced Ferrari applications
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known"
                -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 'sudo -n /usr/bin/python3 -' > "$RUNNER_TEMP/ferrari-f9-apt-plan.json" <<'PY'
          import subprocess,json,os,re,shutil
          from pathlib import Path
          eight=['libreoffice','ansible','gimp','blender','kdenlive','darktable','openscad','calibre']
          def cmd(args,seconds=50):
            p=subprocess.run(args,capture_output=True,text=True,timeout=seconds,
              env=dict(os.environ,LC_ALL='C',LANG='C',DEBIAN_FRONTEND='noninteractive'))
            return p.returncode,p.stdout,p.stderr
          out={'phase':9,'kind':'APT simulation only','selected':eight,'versions':{},'private':{},'host':{}}
          root=Path('/srv/projects/skill-universal')
          out['host']['release']=(root/'current').resolve().name
          for s in ('pink-iptv-backend','pink-vpn','fadego-staging','lowcost-europa','pm2-iptvpn-bot','pm2-telegram-robot-leads','nginx','postgresql@16-main'):
            r,sout,_=cmd(['systemctl','is-active',s],9)
            out['host'][s]=sout.strip()
          check_paths={
            'libreoffice':['tools/libreoffice/program/soffice'],
            'ansible':['tools/ubuntu-cli/bin/ansible-inventory'],
            'gimp':['tools/ubuntu-cli/bin/gimp'],
            'blender':['tools/blender/blender'],
            'kdenlive':['tools/ubuntu-cli/bin/melt'],
            'darktable':['tools/ubuntu-cli/bin/darktable-cli'],
            'openscad':['tools/openscad/bin/openscad'],
            'calibre':['tools/ubuntu-cli/bin/ebook-convert']
          }
          for name in eight:
            r,v,e=cmd(['dpkg-query','-W','-f=${Version}',name],8)
            candidate=cmd(['apt-cache','policy',name],8)
            out['versions'][name]={'installed':v.strip() if r==0 else None,
              'candidate': next((line.strip().split(':',1)[-1].strip() for line in candidate[1].splitlines() if line.strip().startswith('Candidate:')),None)}
            out['private'][name]={x:(root/x).is_file() for x in check_paths[name]}
          rc,s,e=cmd(['apt-get','-s','purge',*eight],110)
          out['simulation_exit']=rc
          out['simulation_errors']=e[-750:] if rc else ''
          steps=[l.split()[:3] for l in s.splitlines() if l.startswith(('Remv ','Purg ','Inst ','Conf '))]
          out['steps']=[{'kind':t[0],'name':t[1]} for t in steps if len(t)>=2]
          out['removes']=[t[1] for t in steps if t[0] in ('Remv','Purg') and len(t)>=2]
          out['installs']=[t[1] for t in steps if t[0]=='Inst' and len(t)>=2]
          out['no_additional_removal']=set(out['removes'])==set(eight)
          out['eight_services_active']=all(out['host'][name]=='active' for name in
              ('pink-iptv-backend','pink-vpn','fadego-staging','lowcost-europa','pm2-iptvpn-bot','pm2-telegram-robot-leads','nginx','postgresql@16-main'))
          print(json.dumps(out,sort_keys=True))
          PY
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'ferrari-f9-apt-plan.json').read_text())
          print('FERRARI_F9_APT_PURGE_SIM_EXIT='+str(d['simulation_exit']))
          print('FERRARI_F9_APT_REMOVAL_SET='+','.join(d['removes']))
          print('FERRARI_F9_NO_ADDITIONAL_PACKAGE_REMOVAL='+str(d['no_additional_removal']))
          print('FERRARI_F9_PRIVATE_PATHS='+str(sum(v for row in d['private'].values() for v in row.values()))+'/8')
          print('FERRARI_F9_SERVICES='+str(d['eight_services_active']))
          print('FERRARI_F9_APT_SIMULATION_DONE=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ferrari-f9-apt-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/ferrari-f9-apt-plan.json
          if-no-files-found: warn
          retention-days: 14
