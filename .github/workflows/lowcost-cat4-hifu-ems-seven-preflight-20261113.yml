name: Lowcost category4 HIFU EMS seven original owner links preflight 20261113
on:
  push:
    branches: [main]
    paths: [.github/workflows/lowcost-cat4-hifu-ems-seven-preflight-20261113.yml]
permissions: {contents: read}
concurrency:
  group: lowcost-prod-automation-controls
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Pinned SSH read-only identity and category 4 capacity audit
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          cd "$ROOT"
          EXPECTED=4c6e75e566dcf317624285fe4f92d5cbdd6ec2dc
          test "$(git -c safe.directory="$ROOT" rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git -c safe.directory="$ROOT" status --porcelain=v1 --untracked-files=no)"
          test "$(git -c safe.directory="$ROOT" ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = "$EXPECTED"
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-affiliate-report.timer
          set -a
          . "$ROOT/private/systemd-env/lowcost-europa.env"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u le001_1789265592 -- "$ROOT/.venv/bin/python" - <<'PY'
          import django
          django.setup()
          from apps.catalog.models import Offer,OfferFamilyPlacement,ProductFamily
          from apps.catalog.services.manual_candidate_intake import resolve_aliexpress_product_url,ManualCandidateIntakeError
          from apps.catalog.services.manual_storefront import MANUAL_ONLY_FAMILY_SLUGS
          from apps.catalog.services.public_eligibility import public_eligibility_q,MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY
          from apps.integrations.aliexpress.affiliate_url import is_https_affiliate_url
          from urllib.parse import urlsplit
          links=["https://s.click.aliexpress.com/e/_c3awXG6B","https://s.click.aliexpress.com/e/_c3F3aGWB","https://s.click.aliexpress.com/e/_c43vIMZl","https://s.click.aliexpress.com/e/_c3c7kurZ","https://s.click.aliexpress.com/e/_c44ymfkJ","https://s.click.aliexpress.com/e/_c3ZyZiCL","https://s.click.aliexpress.com/e/_c2RbTg6B"]
          assert len(links)==len(set(links))==7
          assert all(is_https_affiliate_url(u) and urlsplit(u).hostname=='s.click.aliexpress.com' for u in links)
          family=ProductFamily.objects.get(slug='hifu')
          assert family.display_order==4 and family.name=='HIFU / EMS'
          assert family.slug in MANUAL_ONLY_FAMILY_SLUGS
          placements=OfferFamilyPlacement.objects.filter(product_family=family)
          count=placements.count()
          public=placements.filter(public_eligibility_q(prefix='offer__')).count()
          manual=placements.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()
          print('CAT4_NAME='+family.name)
          print('CAT4_ORIGINAL_PLACEMENTS='+str(count))
          print('CAT4_PUBLIC='+str(public))
          print('CAT4_MANUAL='+str(manual))
          print('CAT4_REMAINING_SLOTS='+str(MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY-count))
          assert count==manual and count>=0 and count+7<=MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY
          seen=set()
          added=[]
          for i,url in enumerate(links,1):
              try:
                  pid,_=resolve_aliexpress_product_url(url)
                  prior=Offer.objects.filter(source=Offer.Source.ALIEXPRESS_OWNER,external_product_id=pid).first()
                  if pid in seen: status='DUPLICATE_WITHIN_INPUT'
                  elif prior is None:
                      status='NEW'
                      added.append(i)
                  elif prior.affiliate_url==url and placements.filter(offer=prior).exists():
                      status='ALREADY_IN_CATEGORY'
                  elif prior.affiliate_url==url:
                      status='EXISTS_SAME_LINK_OTHER_CATEGORY'
                  else:
                      status='EXISTS_DIFFERENT_MANUAL_LINK'
                  seen.add(pid)
              except ManualCandidateIntakeError:status='UNRESOLVED'
              print('CAT4_LINK_'+str(i).zfill(2)+'='+status)
          print('CAT4_NEW_COUNT='+str(len(added)))
          print('CAT4_NEW_INDICES='+','.join(map(str,added)))
          print('CAT4_NEW_PRODUCTS_FIT='+str(count+len(added)<=MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY).upper())
          assert count+len(added)<=MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY
          print('CAT4_OWNER_LINKS_READONLY_PREFLIGHT=PASS')
          PY
          REMOTE
