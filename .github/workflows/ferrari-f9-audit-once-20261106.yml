name: Ferrari F9 live consumer and isolation audit (one shot)
on:
  push:
    branches: [main]
    paths:
      - ferrari-release-requests/ferrari-f9-consumers-20261106.json
permissions:
  contents: read
concurrency:
  group: ferrari-phase9-readonly-20261106
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact F9 read-only request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          added="$(git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA")"
          changed="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          test "$added" = ferrari-release-requests/ferrari-f9-consumers-20261106.json
          test "$changed" = "$added"
          python3 - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('ferrari-release-requests/ferrari-f9-consumers-20261106.json').read_text())
          assert obj=={'version':1,'phase':9,'mode':'read-only-consumer-proof','project':'skill-universal','no_packages_changed':True,'no_other_projects_changed':True}
          print('FERRARI_F9_AUDIT_GATE=PASS')
          PY
      - name: Reuse pinned SSH without changing production tools or credentials
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/known"
          chmod 600 "$RUNNER_TEMP/known"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/known" -E sha256 | awk '{print $2}')" = SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          echo 'FERRARI_F9_EXISTING_SSH_PIN=PASS'
      - name: Read only global package consumers project mapping and protected services
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known"
                -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 'sudo -n /usr/bin/python3 -' > "$RUNNER_TEMP/ferrari-f9-audit.json" <<'PY'
          import os,json,sys,time,subprocess,re,shutil
          from pathlib import Path
          PKGS=('libreoffice','ansible','yt-dlp','gimp','blender','kdenlive','darktable','openscad','librecad','qgis','audacity','obs-studio','solvespace','synfigstudio','openshot-qt','calibre')
          ROOT=Path('/srv/projects')
          FERRARI=ROOT/'skill-universal'
          SERVICES=('pink-iptv-backend','pink-vpn','fadego-staging','lowcost-europa','pm2-iptvpn-bot','pm2-telegram-robot-leads','nginx','postgresql@16-main')
          def run(argv,timeout=16):
            try:
              p=subprocess.run(argv,text=True,capture_output=True,timeout=timeout,env=dict(os.environ,LANG='C',LC_ALL='C'),check=False)
              return p.returncode,p.stdout,p.stderr
            except (OSError,subprocess.TimeoutExpired):return -1,'',''
          def dirsize(p,max_files=40000):
            num=0; total=0;subdirs=0
            for dirpath,dirs,files in os.walk(p,followlinks=False):
              dirs[:]=[x for x in dirs if not os.path.islink(os.path.join(dirpath,x))]
              subdirs+=len(dirs)
              for name in files:
                num+=1
                if num>max_files:return {'files_at_least':num,'incomplete':True,'subdirs':subdirs}
                try:
                  t=os.lstat(os.path.join(dirpath,name))
                  if not os.path.islink(os.path.join(dirpath,name)):total+=t.st_size
                except OSError:pass
            return {'files':num,'bytes':total,'subdirs':subdirs}
          started=time.monotonic()
          out={'schema':1,'scope':'VPS_phase9_read_only','project_dir':'/srv/projects',
               'ferrari':{},'services':{},'packages':{},'projects':{},'external_roots':{},
               'disk_free_bytes':shutil.disk_usage('/').free}
          active=(FERRARI/'current')
          out['ferrari']={
            'root_present':FERRARI.is_dir() and not FERRARI.is_symlink(),
            'current_release':active.resolve().name if active.is_symlink() else 'missing',
            'private_ruflo':(FERRARI/'.runtime/npm/ruflo/node_modules/ruflo/bin/ruflo.js').is_file(),
            'private_rea':(FERRARI/'.runtime/npm/rea').is_dir(),
            'private_tool_catalog':(active/'engine/tool_actions.json').is_file(),
            'release_count':sum(1 for x in (FERRARI/'releases').iterdir() if x.is_dir() and not x.is_symlink()) if (FERRARI/'releases').is_dir() else -1
          }
          for name in SERVICES:
            ret,s,_=run(['systemctl','is-active',name],6)
            out['services'][name]=s.strip() if ret in (0,3) else 'error'
          procs=[]
          for p in Path('/proc').iterdir():
            if not p.name.isdecimal():continue
            try:
              exe=os.readlink(p/'exe')
              cwd=os.readlink(p/'cwd')
              status=(p/'comm').read_text()[:70].strip()
              procs.append((exe,cwd,status))
            except OSError:pass
          out['running_processes_observed']=len(procs)
          private=('/srv/projects/skill-universal/',)
          for name in PKGS:
            dpkg=run(['dpkg-query','-W','-f=${Status}| ${Installed-Size}\n',name],6)
            is_installed=dpkg[0]==0 and 'install ok installed' in dpkg[1]
            r={'installed':is_installed}
            if is_installed:
              try:r['installed_kib']=int(dpkg[1].split('|')[-1].strip())
              except ValueError:r['installed_kib']=None
              sim=run(['apt-get','-s','purge',name],14)
              pkglist=[]
              for line in sim[1].splitlines():
                if line.startswith('Remv '):
                  z=line.split()
                  if len(z)>1:pkglist.append(z[1])
              r['simulation_ok']=sim[0]==0
              r['simulation_remove_count']=len(pkglist)
              r['simulation_extra_packages']=[x for x in pkglist if x!=name][:22]
              files=run(['dpkg-query','-L',name],7)
              binaries=[x for x in files[1].splitlines() if x.startswith(('/usr/bin/','/usr/sbin/','/usr/libexec/')) and Path(x).is_file() and os.access(x,os.X_OK)]
              paths=set(binaries)
              # Package may be a meta-package; inspect known binary through PATH as well.
              appbin=shutil.which(name)
              if appbin:paths.add(appbin)
              candidates=[p for p in paths if not p.endswith('.desktop')]
              direct=sum(1 for exe,cwd,cmd in procs if exe in paths or cwd in paths)
              r['owned_executables_count']=len(binaries)
              r['direct_live_binary_consumers']=direct
              rc,dependents,_=run(['apt-cache','rdepends','--installed',name],8)
              # Conservative summary; other installed packages may depend.
              depnames=[l.strip() for l in dependents.splitlines()[2:] if l.startswith('  ') and not l.lstrip().startswith(('|','<'))]
              r['installed_reverse_dependent_candidates']=list(dict.fromkeys(depnames))[:22]
            out['packages'][name]=r
          # Scan only text/config/launchers in existing project trees, no file contents or names emitted.
          patterns={name:re.compile(rb'(?i)(?<![A-Za-z0-9])'+re.escape(name.encode())+rb'(?![A-Za-z0-9])') for name in PKGS}
          exts={'.sh','.py','.js','.ts','.json','.yaml','.yml','.service','.toml','.md','.txt','.ini','.conf','.cfg','.bash','.env.example'}
          ignored={'.git','node_modules','.venv','venv','site-packages','dist','build','release','releases','.runtime','cache','caches','.next','.nuxt','.terraform','__pycache__'}
          for p in sorted(ROOT.iterdir()) if ROOT.is_dir() else []:
            if not p.is_dir() or p.is_symlink():continue
            record={'directory_exists':True}
            if (p/'.git').exists():
              head=run(['git','-C',str(p),'rev-parse','HEAD'],5)
              branch=run(['git','-C',str(p),'branch','--show-current'],5)
              status=run(['git','-C',str(p),'status','--porcelain','--untracked-files=no'],12)
              remote=run(['git','-C',str(p),'remote','get-url','origin'],5)
              record.update({'git_head':head[1].strip() if head[0]==0 else None,
                             'git_branch':branch[1].strip() if branch[0]==0 else None,
                             'tracked_changes_count':len(status[1].splitlines()) if status[0]==0 else -1,
                             'git_repo_name_matches_folder':bool(re.search(r'/'+re.escape(p.name)+r'(\.git)?$',remote[1].strip(),re.I)) if remote[0]==0 else None})
            else:record['git_head']=None
            refs={name:0 for name in PKGS};files_read=0;truncated=False
            if p.name!='skill-universal':
              for base,dirs,files in os.walk(p,followlinks=False):
                dirs[:]=[x for x in dirs if x not in ignored and not os.path.islink(os.path.join(base,x))]
                for filename in files:
                  q=Path(base)/filename
                  if q.suffix not in exts and q.name not in ('Dockerfile','Procfile','Makefile'):continue
                  try:
                    if q.is_symlink() or q.stat().st_size>100000:continue
                    blob=q.read_bytes()
                    files_read+=1
                    for name,pat in patterns.items():
                      if pat.search(blob):refs[name]+=1
                  except (OSError,PermissionError):pass
                  if files_read>=6000:truncated=True;break
                if truncated:break
            record['searched_text_files']=files_read
            record['search_truncated']=truncated
            record['global_application_name_ref_counts']={k:v for k,v in refs.items() if v}
            out['projects'][p.name]=record
          # No contents read; check only names, owner uid, directory size and references.
          external=('/root/.cursor','/root/.vscode','/root/.claude-server-commander',
                    '/home/ubuntu/.local/share/rea-github-transport',
                    '/root/migration-preserved','/root/migration-20260923',
                    '/home/ubuntu/.local/share/hopper',
                    '/home/ubuntu/.local/share/motor-ferrari')
          for name in external:
            p=Path(name)
            if not p.exists() and not p.is_symlink():
              out['external_roots'][name]={'exists':False};continue
            r={'exists':True,'is_symlink':p.is_symlink(),'owner_uid':p.lstat().st_uid}
            if p.is_dir() and not p.is_symlink():
              r.update(dirsize(p,40000))
            out['external_roots'][name]=r
          out['elapsed_seconds']=round(time.monotonic()-started,2)
          print(json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
          test -s "$RUNNER_TEMP/ferrari-f9-audit.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'ferrari-f9-audit.json').read_text())
          assert r['schema']==1 and len(r['packages'])==16
          assert len(r['services'])==8 and r['ferrari']['root_present']
          print('FERRARI_F9_PROJECTS='+str(len(r['projects'])))
          print('FERRARI_F9_GLOBAL_APT_PRESENT='+str(sum(x['installed'] for x in r['packages'].values())))
          print('FERRARI_F9_PROTECTED_SERVICES='+str(sum(x=='active' for x in r['services'].values()))+'/8')
          print('FERRARI_F9_FERRARI_RELEASE='+r['ferrari']['current_release'])
          print('FERRARI_F9_READONLY_AUDIT=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ferrari-f9-consumers-${{ github.run_id }}
          path: ${{ runner.temp }}/ferrari-f9-audit.json
          if-no-files-found: warn
          retention-days: 14
