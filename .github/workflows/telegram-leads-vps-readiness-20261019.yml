name: Telegram Leads VPS scoped read-only readiness 20261019

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-leads-vps-readiness-20261019.yml'
      - 'ops/telegram_leads_vps_readiness_20261019.py'
  pull_request:
    branches: [main]
    paths:
      - 'ops/telegram_leads_vps_readiness_20261019.py'
      - '.github/workflows/telegram-leads-vps-readiness-20261019.yml'

permissions:
  contents: read

concurrency:
  group: telegram-leads-vps-readiness-20261019
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'martaxi-boss/VPS' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'martaxi-boss/VPS')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact event snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify read-only source and change scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/telegram_leads_vps_readiness_20261019.py
          python3 - <<'PY'
          from pathlib import Path
          source=Path('ops/telegram_leads_vps_readiness_20261019.py').read_text()
          assert 'subprocess.run(["pm2", "jlist"]' in source
          assert 'LEADS_VPS_READ_ONLY_20261019' in source
          print('SCOPED_LEADS_READ_ONLY_SOURCE=PASS')
          PY
      - name: Verify Owner-pinned SSH host identity
        shell: bash
        run: |
          set -euo pipefail
          known="$RUNNER_TEMP/telegram-leads-vps-known"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$known"
          chmod 600 "$known"
          observed="$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')"
          test "$observed" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          ssh-keygen -F 146.59.145.3 -f "$known" >/dev/null
          echo 'SSH_HOST_IDENTITY=VERIFIED'
      - name: Run non-mutating live VPS inventory through existing SSH credentials
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/telegram-leads-vps-known" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            ubuntu@146.59.145.3 'sudo -n python3 -' \
            < ops/telegram_leads_vps_readiness_20261019.py \
            > "$RUNNER_TEMP/telegram-leads-readiness.json"
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          path=Path(os.environ["RUNNER_TEMP"])/"telegram-leads-readiness.json"
          data=json.loads(path.read_text())
          assert data["probe"]=="LEADS_VPS_READ_ONLY_20261019"
          assert data["side_effects"] is False
          assert isinstance(data["vault"],dict)
          print("TELEGRAM_LEADS_VPS_READ_ONLY_RESULT="+json.dumps(data,sort_keys=True))
          PY
