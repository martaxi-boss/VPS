          print("OWNER_LINK_PRODUCT_URL="+canonical)
          rows=list(Offer.objects.filter(external_product_id=pid).values("id","source","external_product_id","title","affiliate_url","is_active","owner_hidden"))
          print("OWNER_LINK_EXISTING_PRODUCT_ENTRIES="+str(len(rows)))
          for row in rows:
              print("OWNER_LINK_MATCH_ID="+str(row["id"]))
              print("OWNER_LINK_MATCH_SOURCE="+row["source"])
              print("OWNER_LINK_MATCH_IN_CATEGORY="+str(placements.filter(offer_id=row["id"]).exists()).upper())
              print("OWNER_LINK_MATCH_AFFILIATE_SAME="+str(row["affiliate_url"]==link).upper())
              print("OWNER_LINK_MATCH_TITLE="+row["title"][:130])
          try:
              details=AliExpressClient().get_product_detail(pid,"PT","EUR")
              print("OWNER_LINK_API_DETAIL=PASS")
              print("OWNER_LINK_API_ID_MATCH="+str(details.product_id==pid).upper())
              print("OWNER_LINK_API_TITLE="+str(details.title)[:130])
              print("OWNER_LINK_API_PRICE_EUR_POSITIVE="+str(details.price is not None and details.price>0 and details.currency=="EUR").upper())
          except Exception as e:
              print("OWNER_LINK_API_DETAIL=FAILED_"+type(e).__name__)
          PY
          echo OWNER_LINK_AUDIT_READONLY=PASS
          REMOTE
