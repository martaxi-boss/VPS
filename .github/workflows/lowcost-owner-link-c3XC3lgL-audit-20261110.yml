          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          URL='https://s.click.aliexpress.com/e/_c3XC3lgL'
          cd "$ROOT"
          test "$(git -c safe.directory="$ROOT" rev-parse HEAD)" = "7580bfa844aad2c9047c832b0446bd0ec8794e08"
          test -z "$(git -c safe.directory="$ROOT" status --porcelain=v1 --untracked-files=no)"
          test "$(systemctl show lowcost-europa.service -p User --value)" = "le001_1789265592"
          systemctl is-active --quiet lowcost-europa.service
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          test -s "$ENVFILE" && test ! -L "$ENVFILE"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u le001_1789265592 -- "$ROOT/.venv/bin/python" - <<'PY'
          import django
          django.setup()
          from apps.catalog.services.manual_candidate_intake import resolve_aliexpress_product_url
          from apps.catalog.models import Offer, OfferFamilyPlacement, ProductFamily
          from apps.integrations.aliexpress.affiliate_url import is_https_affiliate_url
          from apps.integrations.aliexpress.client import AliExpressClient
          from urllib.parse import urlparse
          link="https://s.click.aliexpress.com/e/_c3XC3lgL"
          assert is_https_affiliate_url(link)
          family=ProductFamily.objects.get(slug="cavitacao-rf-vacuum-corpo")
          placements=OfferFamilyPlacement.objects.filter(product_family=family)
          print("OWNER_LINK_EXISTING_CATEGORY_PLACEMENTS="+str(placements.count()))
          print("OWNER_LINK_EXISTING_MANUAL_OFFERS="+str(placements.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()))
          exact=Offer.objects.filter(affiliate_url=link)
          print("OWNER_LINK_ALREADY_STORED="+str(exact.count()))
