name: REA ChatGPT isolated trial 20261022
on:
  push:
    branches:
      - trial/rea-chatgpt-20261022
    paths:
      - "ops/rea_chatgpt_trial_20261022.sh"
      - ".github/workflows/rea-chatgpt-trial-20261022.yml"
permissions:
  contents: read
concurrency:
  group: rea-chatgpt-trial-single-install
  cancel-in-progress: false
jobs:
  install-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Checkout isolated staging branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect installer syntax and forbidden mutations
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/rea_chatgpt_trial_20261022.sh
          python3 - <<'PY'
          from pathlib import Path
          s=Path("ops/rea_chatgpt_trial_20261022.sh").read_text()
          assert "REA_VPS_TRIAL_V1" in s
          for banned in ("sudo ", "apt-get", "systemctl", "service ", "docker ",
                          "nginx ", "ufw ", "iptables ", "rm -rf /", "curl |", "wget |"):
              assert banned not in s, banned
          assert "/.local/share/rea-chatgpt-trial" in s
          print("ISOLATED_SCRIPT=PASS")
          PY
      - name: Verify pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          known="$RUNNER_TEMP/rea-trial-known"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$known"
          chmod 600 "$known"
          observed="$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')"
          test "$observed" = "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc"
          echo "VPS_PIN=PASS"
      - name: Install SSH helper on ephemeral runner only
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Prepare REA locally in separate VPS directory
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rea-trial-known" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=5 \
            ubuntu@146.59.145.3 "bash -s" \
            < ops/rea_chatgpt_trial_20261022.sh
