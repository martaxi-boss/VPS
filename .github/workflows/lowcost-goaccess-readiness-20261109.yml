name: Lowcost GoAccess private analytics readiness (one-shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-goaccess-readiness-20261109.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-ptes-production-rollout
  cancel-in-progress: false
jobs:
  readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check pinned VPS SSH identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
      - name: Inspect project and sanitized Nginx logging capabilities
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          test -d "$ROOT/.git" && test -d "$ROOT/private"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = 8254a1fc5845233da4877cdf4af2ab3340873e54
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain --untracked-files=no)"
          systemctl is-active --quiet lowcost-europa.service
          nginx -t >/dev/null 2>&1
          echo 'GOACCESS_READINESS_START=PASS'
          for name in goaccess gcc make pkg-config; do
            if command -v "$name" >/dev/null 2>&1; then echo "AVAILABLE_$name=YES"; else echo "AVAILABLE_$name=NO"; fi
          done
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          root=pathlib.Path('/srv/projects/lowcost-europa')
          paths=[
             pathlib.Path('/var/log/nginx/access.log'),
             pathlib.Path('/var/log/nginx/lowcost-europa.eu.access.log'),
             pathlib.Path('/var/log/nginx/lowcost-europa.access.log'),
             root/'private/logs/access.log',
          ]
          for p in paths:
              print(f"LOG_CANDIDATE_{p.name.replace('.', '_').upper()}_PRESENT={int(p.is_file())}")
              if p.is_file():
                  print(f"LOG_CANDIDATE_{p.name.replace('.', '_').upper()}_NONEMPTY={int(p.stat().st_size>0)}")
          config=subprocess.run(['nginx','-T'],capture_output=True,text=True,timeout=20)
          print('NGINX_TEST_PASS='+str(config.returncode==0))
          cfg=config.stdout
          print('NGINX_DIRECTIVES_LOG_FORMAT_COUNT='+str(len(re.findall(r'(?m)^\s*log_format\b',cfg))))
          print('NGINX_DIRECTIVES_ACCESS_LOG_COUNT='+str(len(re.findall(r'(?m)^\s*access_log\b',cfg))))
          print('NGINX_LOG_WITH_HOST_FIELD='+str(bool(re.search(r'(?m)^\s*log_format\b[^;]*\$host',cfg,re.S))))
          print('LOWCOST_SPECIFIC_LOG_DIRECTIVE='+str(bool(re.search(r'(?m)^\s*access_log\s+[^;]*lowcost[^;]*;',cfg,re.I))))
          print('PRIVATE_INSTALL_ROOT_PRESENT='+str((root/'private/tools').is_dir()))
          print('PYTHON_VENV_PRESENT='+str((root/'.venv/bin/python').is_file()))
          print('LOWCOST_GITHUB_SHA_MATCH=PASS')
          PY
          REMOTE
