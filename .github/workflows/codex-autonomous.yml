name: Codex autonomous execution (Owner-authorized)

# A single Owner-authored Issue starts the entire bounded implementation path.
# The VPS holds the Codex login. GitHub write credentials stay on the runner.
on:
  issues:
    types: [opened]
  workflow_call:
    outputs:
      publication_status:
        description: Trusted first worker publication result for dependent serial tasks
        value: ${{ jobs.execute.outputs.publication_status }}
      publication_pr:
        description: Trusted publisher PR URL; never model text
        value: ${{ jobs.execute.outputs.publication_pr }}
      publication_sha:
        description: Trusted publisher exact SHA
        value: ${{ jobs.execute.outputs.publication_sha }}
      publication_canonical_sha:
        description: Canonical Project Leader revision verified for this worker
        value: ${{ jobs.execute.outputs.publication_canonical_sha }}
    inputs:
      task_b64:
        description: Validated owner task, encoded to avoid multiline output injection
        required: true
        type: string
      issue_number:
        description: Original Owner issue that stores this job and receives reports
        required: true
        type: number
      instance_id:
        description: Trusted bounded worker identity for explicit jobs
        required: false
        type: string
        default: ''
      no_auto_merge:
        description: Return a validated PR without merging parallel changes
        required: false
        type: boolean
        default: false
      allow_no_change:
        description: Owner explicitly permits a read-only, no-diff task result
        required: false
        type: boolean
        default: false
      reasoning_effort:
        description: Offline validated reasoning for this exact Codex worker
        required: false
        type: string
        default: medium

permissions: {}

concurrency:
  group: codex-autonomous-${{ github.repository }}-${{ inputs.instance_id || 'single' }}
  cancel-in-progress: false
  # GitHub defaults to replacing an older pending run. Keep up to 100 queued.
  queue: max

jobs:
  execute:
    if: >-
      (github.event.issue.user.login == github.repository_owner &&
       (startsWith(github.event.issue.title, '[codex run]') ||
        ((startsWith(github.event.issue.title, '[agents run]') ||
          startsWith(github.event.issue.title, '[coordinator run] ')) &&
         inputs.task_b64 != '' &&
         inputs.issue_number == github.event.issue.number))) ||
      (github.event_name == 'repository_dispatch' &&
       github.event.action == 'codex_quota_resume' &&
       inputs.task_b64 != '' && inputs.issue_number > 0)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    outputs:
      publication_status: ${{ steps.publish.outputs.publication_status }}
      publication_pr: ${{ steps.publish.outputs.publication_pr }}
      publication_sha: ${{ steps.publish.outputs.publication_sha }}
      publication_canonical_sha: ${{ steps.publish.outputs.publication_canonical_sha }}
    env:
      CODEX_INSTANCE_ID: ${{ inputs.instance_id }}
      CODEX_REASONING_EFFORT: ${{ inputs.reasoning_effort || 'medium' }}
    steps:
      - name: Load reviewed VPS executor only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate Owner task and publication credential BEFORE consuming Codex quota
        env:
          OWNER_TASK: ${{ github.event.issue.body }}
          ROUTED_TASK_B64: ${{ inputs.task_b64 }}
          CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, base64, binascii
          from pathlib import Path
          task = os.environ.get('OWNER_TASK', '').strip()
          routed = os.environ.get('ROUTED_TASK_B64', '')
          if routed:
              try:
                  task = base64.b64decode(routed, validate=True).decode('utf-8').strip()
              except (binascii.Error, UnicodeDecodeError) as exc:
                  raise SystemExit('Malformed validated task encoding') from exc
          lines = task.splitlines()
          if not 1 <= len(task) <= 7000 or not lines:
              raise SystemExit('Task length must be 1-7000 characters')
          allowed = ('TARGET_REPOSITORY=martaxi-boss/Project-leader',
                     'TARGET_REPOSITORY=martaxi-boss/Project-leader-codex',
                     'TARGET_REPOSITORY=martaxi-boss/VPS',
                     'TARGET_REPOSITORY=martaxi-boss/pink-iptv')
          if lines[0] not in allowed:
              raise SystemExit('First line must be an allowlisted TARGET_REPOSITORY')
          if not os.environ.get('CODEX_GITHUB_TOKEN'):
              (Path(os.environ['RUNNER_TEMP']) / 'codex-preflight-status.txt').write_text(
                  'Missing GitHub Actions secret CODEX_GITHUB_TOKEN in martaxi-boss/VPS. Codex was NOT started.', encoding='utf-8')
              raise SystemExit('CODEX_GITHUB_TOKEN missing: publication cannot work; Codex not started')
          (Path(os.environ['RUNNER_TEMP']) / 'codex-task.txt').write_text(
              task + '\n', encoding='utf-8')
          # Verify the token can actually WRITE the selected repository before invoking Codex.
          import json, urllib.request, urllib.error
          target = lines[0].split('=', 1)[1]
          request = urllib.request.Request(
              'https://api.github.com/repos/' + target,
              headers={'Authorization': 'Bearer ' + os.environ['CODEX_GITHUB_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'X-GitHub-Api-Version': '2022-11-28'})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  info = json.load(response)
          except urllib.error.HTTPError as exc:
              (Path(os.environ['RUNNER_TEMP']) / 'codex-preflight-status.txt').write_text(
                  'GitHub token could not access the selected repository (HTTP ' + str(exc.code) + '). Codex was NOT started.', encoding='utf-8')
              raise SystemExit('CODEX_GITHUB_TOKEN failed GitHub preflight HTTP ' + str(exc.code))
          if info.get('permissions', {}).get('push') is not True:
              (Path(os.environ['RUNNER_TEMP']) / 'codex-preflight-status.txt').write_text(
                  'GitHub token does not have Contents write on the selected repository. Codex was NOT started.', encoding='utf-8')
              raise SystemExit('CODEX_GITHUB_TOKEN lacks target repository Contents write permission')
          print('Owner task/target/GitHub write access verified. No token printed.')
          PY
          bash -n ops/codex-autonomous-remote.sh
          python3 -m py_compile ops/codex-autonomous-publish.py ops/codex_patch_guard.py ops/codex-project-leader-bootstrap.py ops/codex_quota_resume.py ops/codex_audit_strategy.py

      - name: Verify actual Git branch publication permission without model calls
        shell: bash
        env:
          CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
          CODEX_ORDER_ISSUE: ${{ inputs.issue_number || github.event.issue.number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, os, sys
          from pathlib import Path
          f = Path('ops/codex-autonomous-publish.py')
          # Inline Python runs from repo root, unlike the standalone publisher.
          # Allow only the trusted checked-out ops/ sibling import.
          sys.path.insert(0, str(f.parent.resolve()))
          spec = importlib.util.spec_from_file_location('trusted_publisher', f)
          publisher = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(publisher)
          task = (Path(os.environ['RUNNER_TEMP']) / 'codex-task.txt').read_text(encoding='utf-8')
          target = task.splitlines()[0].partition('=')[2]
          status = publisher.verify_git_publication_dry_run(
              target, os.environ['CODEX_ORDER_ISSUE'],
              os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT'],
              os.environ.get('CODEX_INSTANCE_ID', ''))
          if status != 'PASS':
              (Path(os.environ['RUNNER_TEMP']) / 'codex-preflight-signal.txt').write_bytes(
                  b'GITHUB_PUBLISH_PERMISSION_MISSING\n')
              raise SystemExit('CODEX_PUBLISH_PREFLIGHT_DENIED: ' + status + '; no model started')
          print('CODEX_PUBLISH_GIT_DRY_RUN=PASS (no branch created)')
          PY

      - name: Pin Owner-provided SSH host key before using any VPS credential
        shell: bash
        run: |
          set -euo pipefail
          # Owner-observed Ed25519 identity also validated in the successful dual smoke.
          # This pins the GitHub runner; separate provider attestation remains pending.
          expected="SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc"
          known_hosts="$RUNNER_TEMP/vps_smoke_known_hosts"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$known_hosts" ||
            { echo 'VPS SSH fingerprint probe unavailable'; exit 2; }
          chmod 600 "$known_hosts"
          observed="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}')"
          echo "Observed public VPS Ed25519 fingerprint: $observed"
          test "$observed" = "$expected" ||
            { echo 'VPS SSH host fingerprint mismatch; refusing password connection'; exit 2; }
          ssh-keygen -F 146.59.145.3 -f "$known_hosts" >/dev/null ||
            { echo 'Pinned VPS SSH host missing'; exit 2; }

      - name: Prepare isolated SSH client
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || { echo 'Missing existing VPS_SSH_PASSWORD'; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Stage disposable Codex workspace on VPS
        id: stage
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          case "$CODEX_INSTANCE_ID" in ''|1|2|p[2-8]-[12]) ;; *) echo 'Invalid Codex worker identity' >&2; exit 12;; esac
          case "$CODEX_REASONING_EFFORT" in low|medium|high) ;; *) echo 'Invalid Codex reasoning level; no model started' >&2; exit 12;; esac
          printf '%s\n' "$CODEX_REASONING_EFFORT" > "$RUNNER_TEMP/codex-reasoning.txt"
          job="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT${CODEX_INSTANCE_ID:+-$CODEX_INSTANCE_ID}"
          [[ "$job" =~ ^[0-9]+-[0-9]+(-[12]|-p[2-8]-[12])?$ ]]
          remote='ubuntu@146.59.145.3'
          dest="/home/ubuntu/codex-bridge/jobs/$job"
          sshpass -e ssh -T -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/vps_smoke_known_hosts" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=20 \
            "$remote" "install -d -m 700 '$dest'"
          sshpass -e scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/vps_smoke_known_hosts" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=20 \
            "$RUNNER_TEMP/codex-task.txt" "$RUNNER_TEMP/codex-reasoning.txt" \
            ops/codex-autonomous-remote.sh ops/codex_resource_policy.py \
            ops/codex_quota_resume.py ops/codex_audit_strategy.py \
            ops/codex_patch_guard.py \
            ops/codex-project-leader-bootstrap.py "$remote:$dest/"

      - name: Run signed-in Codex CLI with workspace-write sandbox
        id: codex
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          case "$CODEX_INSTANCE_ID" in ''|1|2|p[2-8]-[12]) ;; *) echo 'Invalid Codex worker identity' >&2; exit 12;; esac
          job="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT${CODEX_INSTANCE_ID:+-$CODEX_INSTANCE_ID}"
          sshpass -e ssh -T -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/vps_smoke_known_hosts" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=5 \
            ubuntu@146.59.145.3 \
            "bash /home/ubuntu/codex-bridge/jobs/$job/codex-autonomous-remote.sh '$job'"

      - name: Retrieve patch, provenance and private agent report
        id: collect
        if: always() && steps.stage.outcome == 'success'
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          case "$CODEX_INSTANCE_ID" in ''|1|2|p[2-8]-[12]) ;; *) echo 'Invalid Codex worker identity' >&2; exit 12;; esac
          job="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT${CODEX_INSTANCE_ID:+-$CODEX_INSTANCE_ID}"
          remote="ubuntu@146.59.145.3:/home/ubuntu/codex-bridge/jobs/$job"
          for file in patch.diff target.txt base-sha.txt codex-task.txt usage.json project-leader-runtime.json report.md codex-preflight-signal.txt; do
            sshpass -e scp -q -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/vps_smoke_known_hosts" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
              -o ConnectTimeout=20 "$remote/$file" "$RUNNER_TEMP/$file" || true
          done
          test -s "$RUNNER_TEMP/target.txt"
          test -s "$RUNNER_TEMP/base-sha.txt"
          test -s "$RUNNER_TEMP/codex-task.txt"
          if [ '${{ steps.codex.outcome }}' = 'success' ]; then
            test -s "$RUNNER_TEMP/project-leader-runtime.json" || { echo 'Missing pinned Project Leader runtime'; exit 13; }
            test -s "$RUNNER_TEMP/report.md" || { echo 'Missing private Codex report; no publication'; exit 13; }
          fi
          test -f "$RUNNER_TEMP/patch.diff" || test '${{ steps.codex.outcome }}' != 'success'

      # The Project Leader worker already decided what its report says, including
      # whether it reached a genuine Human Gate. Do not parse or redefine it.
      # Deliver that exact private report promptly, before publication/CI wait.
      - name: Passive Supervisor forwards Project Leader worker report privately
        id: supervisor_report
        if: always() && steps.collect.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: \${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: \${{ secrets.TELEGRAM_CHAT_ID }}
          SUPERVISOR_OBSERVATION: WORKER_REPORT
          CODEX_REPORT_MODE: worker
          CODEX_JOB_STATUS: WORKER_REPORT_RECEIVED
          CODEX_REPORT_PATH: \${{ runner.temp }}/report.md
          CODEX_ISSUE_NUMBER: \${{ inputs.issue_number || github.event.issue.number }}
          CODEX_RUN_URL: https://github.com/\${{ github.repository }}/actions/runs/\${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          status="$RUNNER_TEMP/codex-worker-report-private-status.txt"
          if ! test -s "$CODEX_REPORT_PATH"; then
            echo "NOT_OBSERVED" > "$status"
            exit 0
          fi
          if test -z "$TELEGRAM_BOT_TOKEN" || test -z "$TELEGRAM_CHAT_ID"; then
            echo "NOT_CONFIGURED" > "$status"
            exit 0
          fi
          if [[ ! "$TELEGRAM_CHAT_ID" =~ ^[1-9][0-9]{3,17}$ ]]; then
            echo "INVALID_PRIVATE_DESTINATION" > "$status"
            exit 1
          fi
          if test "$(wc -c < "$CODEX_REPORT_PATH")" -gt 65536; then
            echo "OVERSIZED_REPORT_NOT_SENT" > "$status"
            exit 1
          fi
          echo "NOT_DELIVERED" > "$status"
          if python3 ops/coordinator_supervisor.py observe; then
            echo "SENT_TO_PRIVATE_TELEGRAM" > "$status"
          else
            exit 1
          fi

      - name: Publish guarded PR, validate exact CI, merge only if explicitly permitted
        id: publish
        if: steps.codex.outcome == 'success' && steps.collect.outcome == 'success'
        env:
          CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
          CODEX_JOB_DIR: ${{ runner.temp }}
          CODEX_RESULT_PATH: ${{ runner.temp }}/codex-result.json
          CODEX_ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          CODEX_PR_ONLY: ${{ inputs.no_auto_merge }}
          CODEX_ALLOW_NO_CHANGE: ${{ inputs.allow_no_change }}
        run: |
          set -euo pipefail
          python3 ops/codex-autonomous-publish.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["CODEX_RESULT_PATH"])
          result = json.loads(path.read_text(encoding="utf-8"))
          status = result.get("status")
          if status not in {"MERGED", "NO_CHANGE", "PR_STAGED"}:
              raise SystemExit("Unverified publication; dependent worker blocked")
          pr = result.get('pull_request', '')
          sha = result.get('commit_sha', '')
          if status == 'PR_STAGED':
              from urllib.parse import urlparse
              import re
              location = urlparse(pr)
              if (location.scheme != 'https' or location.netloc != 'github.com'
                  or not re.fullmatch(
                      r'/martaxi-boss/Project-leader-codex/pull/[1-9][0-9]*',
                      location.path
                  ) or location.query or location.fragment
                  or not isinstance(sha, str)
                  or not re.fullmatch(r'[0-9a-f]{40}', sha)):
                  raise SystemExit("Trusted publication metadata missing or invalid")
          else:
              pr, sha = '', ''
          import re
          from pathlib import Path
          runtime = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) /
               "project-leader-runtime.json").read_text(encoding="utf-8")
          )
          canonical = runtime.get("canonical_revision", "")
          if (not re.fullmatch(r"[0-9a-f]{40}", canonical) or
              runtime.get("source_repository") != "martaxi-boss/Project-leader" or
              runtime.get("mode") != "PINNED_CANONICAL_SKILL"):
              raise SystemExit("Unverified Project Leader runtime at worker boundary")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("publication_status=" + status + "\n")
              out.write("publication_pr=" + pr + "\n")
              out.write("publication_sha=" + sha + "\n")
              out.write("publication_canonical_sha=" + canonical + "\n")
          PY

      # A public GitHub Issue must NEVER contain untrusted model report text.
      # The existing Telegram bot can deliver it to the Owner's private chat
      # only when both dedicated secrets are already configured.
      # After the separate publisher/CI step, send ONLY the final pipeline
      # outcome. This is not another model report or a Human Gate decision.
      - name: Passive Supervisor sends final publication state without replaying report
        id: private_report
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: \${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: \${{ secrets.TELEGRAM_CHAT_ID }}
          SUPERVISOR_OBSERVATION: FINAL_STATE
          CODEX_REPORT_MODE: status
          CODEX_ISSUE_NUMBER: \${{ inputs.issue_number || github.event.issue.number }}
          CODEX_RUN_URL: https://github.com/\${{ github.repository }}/actions/runs/\${{ github.run_id }}
          STAGE_OUTCOME: \${{ steps.stage.outcome }}
          CODEX_OUTCOME: \${{ steps.codex.outcome }}
          PUBLISH_OUTCOME: \${{ steps.publish.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          status="$RUNNER_TEMP/codex-private-status.txt"
          if test -z "$TELEGRAM_BOT_TOKEN" || test -z "$TELEGRAM_CHAT_ID"; then
            echo "NOT_CONFIGURED" > "$status"
            exit 0
          fi
          if [[ ! "$TELEGRAM_CHAT_ID" =~ ^[1-9][0-9]{3,17}$ ]]; then
            echo "INVALID_PRIVATE_DESTINATION" > "$status"
            exit 1
          fi
          CODEX_JOB_STATUS="NOT_COMPLETED"
          if test -s "$RUNNER_TEMP/codex-result.json"; then
            CODEX_JOB_STATUS="$(python3 - <<'PY_STATUS'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) /
                               'codex-result.json').read_text(encoding='utf-8'))
          valid = {'MERGED', 'NO_CHANGE', 'PR_STAGED',
                   'PR_NEEDS_ATTENTION', 'NO_CHANGE_UNVERIFIED', 'FAILED'}
          value = result.get('status')
          print(value if value in valid else 'NOT_COMPLETED')
          PY_STATUS
            )"
          elif test "$STAGE_OUTCOME" != 'success'; then
            CODEX_JOB_STATUS="NOT_STARTED"
          elif test "$CODEX_OUTCOME" != 'success' || test "$PUBLISH_OUTCOME" = 'failure'; then
            CODEX_JOB_STATUS="FAILED"
          fi
          export CODEX_JOB_STATUS
          echo "NOT_DELIVERED" > "$status"
          if python3 ops/coordinator_supervisor.py observe; then
            echo "SENT_TO_PRIVATE_TELEGRAM" > "$status"
          else
            exit 1
          fi

      - name: Publish truthful execution result to Owner Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STAGE_OUTCOME: ${{ steps.stage.outcome }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          dest = Path(os.environ['RUNNER_TEMP']) / 'owner-result.md'
          path = Path(os.environ['RUNNER_TEMP']) / 'codex-result.json'
          if path.exists():
              data = json.loads(path.read_text(encoding='utf-8'))
              status = data.get('status', 'UNKNOWN')
              lines = ['## Codex execution: ' + status,
                       'Target: ' + data.get('repository', 'UNKNOWN'),
                       'Result: ' + data.get('reason', 'See trusted runner checks')]
              if os.environ.get('CODEX_INSTANCE_ID'):
                  lines.append('Worker: Codex ' + os.environ['CODEX_INSTANCE_ID'])
              effort = os.environ.get('CODEX_REASONING_EFFORT', '')
              if effort in {'low', 'medium', 'high'}:
                  lines.append('Chosen reasoning effort: ' + effort + ' (per task)')
              else:
                  lines.append('Reasoning effort: NOT_VERIFIED')
              if data.get('pull_request'):
                  lines.append('PR: ' + data['pull_request'])
              if data.get('merge_sha'):
                  lines.append('Merged main SHA: `' + data['merge_sha'] + '`')
              usage = data.get('usage') or {}
              if usage.get('observed') is True:
                  lines.append('Observed Codex tokens — input: ' + str(usage['input_tokens']) +
                               '; cached input: ' + str(usage['cached_input_tokens']) +
                               '; output: ' + str(usage['output_tokens']) + '.')
              else:
                  lines.append('Codex token count: NOT_OBSERVED.')
          else:
              signal_path = Path(os.environ['RUNNER_TEMP']) / 'codex-preflight-signal.txt'
              # Never publish any remote file contents. Only a fixed trusted
              # enum can distinguish a pre-model policy denial from a crash.
              signal = None
              if (signal_path.is_file() and not signal_path.is_symlink()
                      and signal_path.stat().st_size <= 64):
                  allowed_signals = {
                      b'LOCAL_LEDGER_PREFLIGHT_FAILED\n':
                          'The private usage ledger or duplicate job failed validation; no model started.',
                      b'CHATGPT_AUTH_REQUIRED\n':
                          'The VPS Codex login is not verified as ChatGPT subscription; no model started.',
                      b'GITHUB_PUBLISH_PERMISSION_MISSING\n':
                          'GitHub publisher cannot create an authorized target branch; no model started.',
                      b'CODEX_QUOTA_BLOCKED\n':
                          'Provider-reported Codex quota exhausted; this phase is paused for a safely validated scheduled retry.',
                      b'AUDIT_STALE_BLOCKED\n':
                          'Audited repository HEAD changed; no Codex model started.',
                  }
                  candidate = signal_path.read_bytes()
                  if candidate in allowed_signals:
                      signal = candidate
              preflight_path = Path(os.environ['RUNNER_TEMP']) / 'codex-preflight-status.txt'
              preflight = (
                  allowed_signals[signal] if signal is not None
                  else (preflight_path.read_text(encoding='utf-8') if preflight_path.exists()
                        else 'No verified preflight diagnosis available')
              )
              classification = (
                  'PAUSED_QUOTA' if signal == b'CODEX_QUOTA_BLOCKED\n'
                  else 'NOT_STARTED' if signal is not None else 'NOT_COMPLETED'
              )
              lines = ['## Codex execution: ' + classification,
                       'Preflight: ' + preflight,
                       'The pipeline stopped before trusted publication.',
                       'Stage: ' + os.environ['STAGE_OUTCOME'],
                       'Codex: ' + os.environ['CODEX_OUTCOME'],
                       'Publisher: ' + os.environ['PUBLISH_OUTCOME']]
          runtime_path = Path(os.environ['RUNNER_TEMP']) / 'project-leader-runtime.json'
          if runtime_path.exists():
              runtime = json.loads(runtime_path.read_text(encoding='utf-8'))
              lines.append('Project Leader: canonical Skill v' +
                           runtime['plugin_version'] + ' at `' +
                           runtime['canonical_revision'] + '` (pinned).')
          else:
              lines.append('Project Leader Skill: NOT_OBSERVED (execution not certified).')
          private_path = Path(os.environ['RUNNER_TEMP']) / 'codex-private-status.txt'
          delivery = (private_path.read_text(encoding='utf-8').strip()
                      if private_path.is_file() else 'NOT_OBSERVED')
          if delivery not in {
              'SENT_TO_PRIVATE_TELEGRAM', 'NOT_OBSERVED', 'NOT_CONFIGURED',
              'INVALID_PRIVATE_DESTINATION', 'OVERSIZED_REPORT_NOT_SENT', 'NOT_DELIVERED'
          }:
              delivery = 'NOT_OBSERVED'
          lines.append('Full model report (not published publicly): ' + delivery)
          lines.extend(['Weekly Codex quota percentage: UNKNOWN (not provided by the CLI).',
                        'Actions evidence: ' + os.environ['RUN_URL']])
          dest.write_text('\n\n'.join(lines) + '\n', encoding='utf-8')
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/owner-result.md"

      - name: Continue authorized serial phase two after accepted resumed phase one
        if: >-
          github.event_name == 'repository_dispatch' &&
          inputs.instance_id == '1' &&
          steps.publish.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          [[ "$ORIGINAL_ISSUE" =~ ^[1-9][0-9]*$ ]] || exit 3
          test -s "$RUNNER_TEMP/codex-result.json"
          python3 ops/codex_quota_resume.py ready "$ORIGINAL_ISSUE" \
            "$GITHUB_RUN_ID" "$RUNNER_TEMP/codex-result.json"

      - name: Persist provider quota checkpoint (Owner Issue)
        if: always() && steps.codex.outcome == 'failure' && steps.collect.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_ISSUE: ${{ inputs.issue_number || github.event.issue.number }}
          RESUME_STAGE: ${{ inputs.instance_id || '1' }}
          RESUME_ATTEMPT: ${{ github.event.client_payload.attempt || '0' }}
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/codex-preflight-signal.txt"
          if ! test -f "$marker" || test -L "$marker"; then
            exit 0
          fi
          if [ "$(cat "$marker")" != 'CODEX_QUOTA_BLOCKED' ]; then
            exit 0
          fi
          case "$RESUME_STAGE" in 1|2) ;; *) echo 'INVALID_RESUME_STAGE'; exit 3;; esac
          [[ "$ORIGINAL_ISSUE" =~ ^[1-9][0-9]*$ ]] || exit 3
          [[ "$RESUME_ATTEMPT" =~ ^[0-9]{1,4}$ ]] || exit 3
          python3 ops/codex_quota_resume.py pause "$ORIGINAL_ISSUE" "$RESUME_STAGE" \
            "$GITHUB_RUN_ID" "$RESUME_ATTEMPT"
          echo 'CODEX_QUOTA_CHECKPOINT=PERSISTED'

      - name: Remove completed disposable VPS workspace
        if: always() && steps.stage.outcome != 'skipped'
        continue-on-error: true
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          case "$CODEX_INSTANCE_ID" in ''|1|2|p[2-8]-[12]) ;; *) echo 'Invalid Codex worker identity' >&2; exit 12;; esac
          job="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT${CODEX_INSTANCE_ID:+-$CODEX_INSTANCE_ID}"
          [[ "$job" =~ ^[0-9]+-[0-9]+(-[12]|-p[2-8]-[12])?$ ]] || exit 2
          sshpass -e ssh -T -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/vps_smoke_known_hosts" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 ubuntu@146.59.145.3 \
            "rm -rf -- '/home/ubuntu/codex-bridge/jobs/$job'"
