name: Codex autonomous execution (Owner-authorized)

# A single Owner-authored Issue starts the entire bounded implementation path.
# The VPS holds the Codex login. GitHub write credentials stay on the runner.
on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: codex-autonomous-${{ github.repository }}
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[codex run]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - name: Load reviewed VPS executor only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate Owner task and publication credential BEFORE consuming Codex quota
        env:
          OWNER_TASK: ${{ github.event.issue.body }}
          CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          task = os.environ.get('OWNER_TASK', '').strip()
          lines = task.splitlines()
          if not 1 <= len(task) <= 7000 or not lines:
              raise SystemExit('Task length must be 1-7000 characters')
          allowed = ('TARGET_REPOSITORY=martaxi-boss/Project-leader',
                     'TARGET_REPOSITORY=martaxi-boss/VPS')
          if lines[0] not in allowed:
              raise SystemExit('First line must be an allowlisted TARGET_REPOSITORY')
          if not os.environ.get('CODEX_GITHUB_TOKEN'):
              raise SystemExit('CODEX_GITHUB_TOKEN missing: publication cannot work; Codex not started')
          (Path(os.environ['RUNNER_TEMP']) / 'codex-task.txt').write_text(
              task + '\n', encoding='utf-8')
          # Verify the token can actually WRITE the selected repository before invoking Codex.
          import json, urllib.request, urllib.error
          target = lines[0].split('=', 1)[1]
          request = urllib.request.Request(
              'https://api.github.com/repos/' + target,
              headers={'Authorization': 'Bearer ' + os.environ['CODEX_GITHUB_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'X-GitHub-Api-Version': '2022-11-28'})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  info = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit('CODEX_GITHUB_TOKEN failed GitHub preflight HTTP ' + str(exc.code))
          if info.get('permissions', {}).get('push') is not True:
              raise SystemExit('CODEX_GITHUB_TOKEN lacks target repository Contents write permission')
          print('Owner task/target/GitHub write access verified. No token printed.')
          PY
          bash -n ops/codex-autonomous-remote.sh
          python3 -m py_compile ops/codex-autonomous-publish.py ops/codex_patch_guard.py

      - name: Prepare isolated SSH client
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || { echo 'Missing existing VPS_SSH_PASSWORD'; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Stage disposable Codex workspace on VPS
        id: stage
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          job="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$job" =~ ^[0-9]+-[0-9]+$ ]]
          remote='ubuntu@146.59.145.3'
          dest="/home/ubuntu/codex-bridge/jobs/$job"
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$remote" "install -d -m 700 '$dest'"
          sshpass -e scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$RUNNER_TEMP/codex-task.txt" ops/codex-autonomous-remote.sh \
            ops/codex_patch_guard.py "$remote:$dest/"

      - name: Run signed-in Codex CLI with workspace-write sandbox
        id: codex
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          job="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=5 \
            ubuntu@146.59.145.3 \
            "bash /home/ubuntu/codex-bridge/jobs/$job/codex-autonomous-remote.sh '$job'"

      - name: Retrieve patch, provenance and observed token counts only
        id: collect
        if: always() && steps.stage.outcome == 'success'
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          job="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote="ubuntu@146.59.145.3:/home/ubuntu/codex-bridge/jobs/$job"
          for file in patch.diff target.txt base-sha.txt codex-task.txt usage.json; do
            sshpass -e scp -q -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 "$remote/$file" "$RUNNER_TEMP/$file" || true
          done
          test -s "$RUNNER_TEMP/target.txt"
          test -s "$RUNNER_TEMP/base-sha.txt"
          test -s "$RUNNER_TEMP/codex-task.txt"
          test -f "$RUNNER_TEMP/patch.diff" || test '${{ steps.codex.outcome }}' != 'success'

      - name: Publish reviewed patch and merge only with exact trusted CI
        id: publish
        if: steps.codex.outcome == 'success' && steps.collect.outcome == 'success'
        env:
          CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
          CODEX_JOB_DIR: ${{ runner.temp }}
          CODEX_RESULT_PATH: ${{ runner.temp }}/codex-result.json
          CODEX_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 ops/codex-autonomous-publish.py

      - name: Publish truthful execution result to Owner Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STAGE_OUTCOME: ${{ steps.stage.outcome }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          dest = Path(os.environ['RUNNER_TEMP']) / 'owner-result.md'
          path = Path(os.environ['RUNNER_TEMP']) / 'codex-result.json'
          if path.exists():
              data = json.loads(path.read_text(encoding='utf-8'))
              status = data.get('status', 'UNKNOWN')
              lines = ['## Codex execution: ' + status,
                       'Target: ' + data.get('repository', 'UNKNOWN'),
                       'Result: ' + data.get('reason', 'See trusted runner checks')]
              if data.get('pull_request'):
                  lines.append('PR: ' + data['pull_request'])
              if data.get('merge_sha'):
                  lines.append('Merged main SHA: `' + data['merge_sha'] + '`')
              usage = data.get('usage') or {}
              if usage.get('observed') is True:
                  lines.append('Observed Codex tokens — input: ' + str(usage['input_tokens']) +
                               '; cached input: ' + str(usage['cached_input_tokens']) +
                               '; output: ' + str(usage['output_tokens']) + '.')
              else:
                  lines.append('Codex token count: NOT_OBSERVED.')
          else:
              lines = ['## Codex execution: NOT_COMPLETED',
                       'The pipeline stopped before trusted publication.',
                       'Stage: ' + os.environ['STAGE_OUTCOME'],
                       'Codex: ' + os.environ['CODEX_OUTCOME'],
                       'Publisher: ' + os.environ['PUBLISH_OUTCOME']]
          lines.extend(['Weekly Codex quota percentage: UNKNOWN (not provided by the CLI).',
                        'Actions evidence: ' + os.environ['RUN_URL']])
          dest.write_text('\n\n'.join(lines) + '\n', encoding='utf-8')
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/owner-result.md"

      - name: Remove completed disposable VPS workspace
        if: always() && steps.codex.outcome == 'success' && steps.collect.outcome == 'success'
        continue-on-error: true
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          job="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$job" =~ ^[0-9]+-[0-9]+$ ]] || exit 2
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 ubuntu@146.59.145.3 \
            "rm -rf -- '/home/ubuntu/codex-bridge/jobs/$job'"
