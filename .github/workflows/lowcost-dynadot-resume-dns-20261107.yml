name: Lowcost Dynadot WWW apex mail propagation audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-dynadot-resume-dns-20261107.yml'
permissions:
  contents: read
jobs:
  propagation:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Exact workflow-only change
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")" == '.github/workflows/lowcost-dynadot-resume-dns-20261107.yml' ]]
      - name: Read back both authoritative nameservers and public resolver
        shell: bash
        run: |
          set -euo pipefail
          zone=lowcost-europa.eu
          for resolver in ns1.dyna-ns.net ns2.dyna-ns.net 1.1.1.1; do
            for pair in "$zone|A" "www.$zone|A" "$zone|MX" "$zone|TXT" "default._domainkey.$zone|CNAME" "_dmarc.$zone|TXT"; do
              name="${pair%%|*}"
              type="${pair#*|}"
              answer="$(dig +tries=1 +time=4 +short @"$resolver" "$name" "$type" | tr '\n' ' ' | cut -c1-400)"
              echo "DNS_RECORD resolver=$resolver host=$name type=$type answer=$answer"
            done
          done
          for host in lowcost-europa.eu www.lowcost-europa.eu; do
            a="$(dig +short +tries=1 +time=4 @ns1.dyna-ns.net "$host" A | sort -u)"
            b="$(dig +short +tries=1 +time=4 @ns2.dyna-ns.net "$host" A | sort -u)"
            p="$(dig +short +tries=1 +time=4 @1.1.1.1 "$host" A | sort -u)"
            if [[ "$a" == 146.59.145.3 && "$b" == 146.59.145.3 && "$p" == 146.59.145.3 ]]; then
              echo "DOMAIN_A_$host=READY"
            else
              echo "DOMAIN_A_$host=PENDING"
            fi
          done
          echo "LOWCOST_DNS_PROPAGATION_READONLY=PASS"
