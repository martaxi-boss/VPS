name: Sevelora - prepare definitive domain
on:
  push:
    branches: [main]
    paths: [.github/workflows/sexshop-catalog-deploy-20261118.yml]
permissions:
  contents: read
concurrency:
  group: sexshop-catalog-deploy
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect only Sevelora domain infrastructure
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT=/srv/projects/Sexshop
          systemctl is-active --quiet sexshop.service
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet nginx
          mkdir -p "$ROOT/infra" "$ROOT/acme/.well-known/acme-challenge"
          test -f /etc/nginx/conf.d/sexshop.conf
          if test ! -f "$ROOT/infra/sexshop.before-sevelora-domain.conf"; then
            cp -a /etc/nginx/conf.d/sexshop.conf "$ROOT/infra/sexshop.before-sevelora-domain.conf"
          fi
          BEFORE=$(sha256sum /srv/projects/lowcost-europa/deploy/nginx/lowcost-europa.eu.conf | cut -d' ' -f1)
          cat > "$ROOT/infra/sevelora.eu.conf" <<'NGINX'
          server {
            listen 80;
            server_name sevelora.eu www.sevelora.eu;
            location ^~ /.well-known/acme-challenge/ {
              root /srv/projects/Sexshop/acme;
              default_type text/plain;
            }
            location / { return 503; }
          }
          NGINX
          if test -e /etc/nginx/conf.d/sevelora.eu.conf; then
            test "$(readlink /etc/nginx/conf.d/sevelora.eu.conf)" = "$ROOT/infra/sevelora.eu.conf"
          else
            ln -s "$ROOT/infra/sevelora.eu.conf" /etc/nginx/conf.d/sevelora.eu.conf
          fi
          nginx -t
          systemctl reload nginx
          printf 'sevelora-domain-ready\n' > "$ROOT/acme/.well-known/acme-challenge/sevelora-check"
          READY=0
          for n in $(seq 1 12); do
            if test "$(curl -fsS -H 'Host: sevelora.eu' http://127.0.0.1/.well-known/acme-challenge/sevelora-check || true)" = sevelora-domain-ready; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1
          test "$BEFORE" = "$(sha256sum /srv/projects/lowcost-europa/deploy/nginx/lowcost-europa.eu.conf | cut -d' ' -f1)"
          systemctl is-active --quiet lowcost-europa.service
          echo SEVELORA_ACME_HTTP=PASS
          echo LOWCOST_UNCHANGED=PASS
          REMOTE
