name: Sevelora - domain migration preflight
on:
  push:
    branches: [main]
    paths: [.github/workflows/sexshop-catalog-deploy-20261118.yml]
permissions:
  contents: read
concurrency:
  group: sexshop-catalog-deploy
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect only Sevelora domain infrastructure
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -euo pipefail
          systemctl is-active sexshop.service lowcost-europa.service nginx
          readlink /srv/projects/Sexshop/current
          ls -l /etc/nginx/sites-enabled
          for f in /etc/nginx/sites-enabled/*; do
            if grep -q 'sexy-shop.duckdns.org' "$f"; then
              echo "SEVELORA_NGINX_CONFIG=$f"
              cat "$f"
            fi
          done
          command -v certbot || true
          certbot --version || true
          ls /etc/letsencrypt/renewal
          echo DOMAIN_PREFLIGHT=PASS
          REMOTE
