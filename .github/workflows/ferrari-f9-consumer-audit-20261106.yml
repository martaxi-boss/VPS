name: Ferrari F9 final global-consumer read-only audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ferrari-f9-consumer-audit-20261106.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Connect using existing pinned host identity
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/host"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/host" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          opts=(-T -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/host" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=20)
          sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          test "$(id -un)" = ubuntu
          root=/srv/projects/skill-universal
          echo "F9_ACTIVE_RELEASE=$(readlink -f "$root/current")"
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          root=Path("/srv/projects")
          names=("yt-dlp","librecad","qgis","audacity","obs-studio",
                 "openshot-qt","solvespace","synfigstudio")
          words=re.compile(r"(?i)(?<![a-z0-9])(?:yt-dlp|yt_dlp|librecad|qgis|audacity|obs-studio|openshot-qt|openshot|solvespace|synfigstudio|synfig)(?![a-z0-9])")
          skips={".git","node_modules",".runtime","__pycache__", ".next",
                 "dist","build",".venv","venv","vendor","backup","backups",
                 "archives","archive",".cache","android","gradle"}
          exts={".py",".sh",".js",".ts",".jsx",".tsx",".mjs",".cjs",".json",".yml",".yaml",
                ".toml",".ini",".conf",".service",".env",".pm2",".properties"}
          summary=[]
          for project in sorted(root.iterdir()):
              if not project.is_dir() or project.is_symlink() or project.name=="skill-universal":
                  continue
              if "secret" in project.name.lower() or "vault" in project.name.lower():
                  continue
              count=0; scanned=0; partial=False; refs=[]
              for base,dirs,files in os.walk(project,followlinks=False):
                  dirs[:]=[d for d in dirs if d not in skips and not d.startswith(".") and not (Path(base)/d).is_symlink()]
                  for fname in files:
                      f=Path(base)/fname
                      if f.suffix.lower() not in exts or f.is_symlink():
                          continue
                      scanned+=1
                      if scanned>35000:
                          partial=True; break
                      try:
                          if f.stat().st_size>1_000_000:
                              continue
                          text=f.read_text(encoding="utf-8",errors="replace")
                      except OSError:
                          partial=True; continue
                      matches=sorted(set(x.group(0).lower() for x in words.finditer(text)))
                      if matches:
                          count+=1
                          if len(refs)<35:
                              refs.append({"file":str(f.relative_to(project)),"terms":matches})
                  if partial and scanned>35000:
                      break
              summary.append({"project":project.name,"files_scanned":scanned,
                              "reference_files":count,"partial":partial,
                              "references":refs})
          for item in summary:
              print("F9_OTHER_PROJECT="+json.dumps(item,sort_keys=True),flush=True)
          failures=[s["project"] for s in summary if s["partial"]]
          print("F9_SCANNER_COMPLETE="+str(not failures))
          print("F9_SCANNER_UNREADABLE="+",".join(failures))
          processes=subprocess.run(["/usr/bin/ps","-eo","args="],capture_output=True,text=True,check=True,timeout=15).stdout
          for name in names:
              matches=sum(1 for line in processes.splitlines() if ("/usr/bin/"+name) in line and "ps -eo" not in line)
              print("F9_GLOBAL_EXEC_PROCESSES="+name+":"+str(matches))
          print("F9_CROSS_PROJECT_READ_ONLY=PASS")
          PY
          echo F9_SIMULATE_EIGHT_PURGE
          LC_ALL=C apt-get -s -o Debug::NoLocking=1 purge yt-dlp librecad qgis audacity obs-studio solvespace synfigstudio openshot-qt |
              grep -E '^(Remv|Purg) ' || true
          for service in pink-iptv-backend pink-vpn fadego-staging lowcost-europa pm2-iptvpn-bot pm2-telegram-robot-leads nginx postgresql@16-main; do
            test "$(systemctl is-active "$service")" = active || exit 15
          done
          echo F9_PROTECTED_SERVICES=8_OF_8_PASS
          echo F9_NO_HOST_MUTATIONS=PASS
          REMOTE
