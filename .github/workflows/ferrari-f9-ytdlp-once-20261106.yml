name: Ferrari F9 one-time private yt-dlp install
# Single-use Ferrari-only action; no global APT removal, SSH changes or shared dependencies.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ferrari-f9-ytdlp-once-20261106.yml'

permissions:
  contents: read

concurrency:
  group: ferrari-f9-private-ytdlp-20261106
  cancel-in-progress: false

jobs:
  install-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Read exact certified Ferrari installer source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: a6e0f04aa0cfcb15c4a8a1d67361d8d4c82334af
          persist-credentials: false
          path: ferrari
      - name: Verify installer and guard tests on runner
        run: |
          set -Eeuo pipefail
          python3 -m py_compile ferrari/install/vps-phase9-private-ytdlp.py
          python3 -m unittest discover -s ferrari/tests -p test_phase9_private_ytdlp.py -v
          echo 'F9_YTDLP_PINNED_SOURCE_AND_GUARDS=PASS'
      - name: Reuse existing pinned VPS SSH transport
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS" || { echo 'F9_SSH_SECRET_MISSING'; exit 2; }
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/f9-known-hosts"
          chmod 600 "$RUNNER_TEMP/f9-known-hosts"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/f9-known-hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ||
            { echo 'F9_SSH_HOST_KEY_MISMATCH'; exit 3; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          echo 'F9_EXISTING_SSH_PIN=PASS'
      - name: Transfer only installer and execute under Ferrari project
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes
                -o "UserKnownHostsFile=$RUNNER_TEMP/f9-known-hosts"
                -o GlobalKnownHostsFile=/dev/null
                -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          target="/srv/projects/skill-universal/.runtime/f9-ytdlp-$GITHUB_RUN_ID.py"
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            'test -d /srv/projects/skill-universal/.runtime && test ! -L /srv/projects/skill-universal'
          sshpass -e scp "${opts[@]}" ferrari/install/vps-phase9-private-ytdlp.py \
            "ubuntu@146.59.145.3:$target"
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 'bash -s' -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -Eeuo pipefail
          root=/srv/projects/skill-universal
          job="$1"
          [[ "$job" =~ ^[0-9]+$ ]] || exit 4
          installer="$root/.runtime/f9-ytdlp-$job.py"
          trap 'rm -f -- "$installer"' EXIT
          test "$(id -un)" = ubuntu && test "$(id -u)" -ne 0
          test -f "$installer" && test ! -L "$installer"
          test "$(readlink -f "$root/current")" = "$root/releases/f1f3b03525adec7018d7d629243e7b0fbb7f5087" ||
            { echo 'F9_FERRARI_RELEASE_MOVED'; exit 5; }
          services=(pink-iptv-backend pink-vpn fadego-staging lowcost-europa
                    pm2-iptvpn-bot pm2-telegram-robot-leads nginx postgresql@16-main)
          for service in "${services[@]}"; do
            test "$(systemctl is-active "$service")" = active || { echo "F9_PRE_SERVICE_FAILED:$service"; exit 6; }
          done
          test "$(dpkg-query -W -f='${Status}' yt-dlp 2>/dev/null)" = 'install ok installed' ||
            { echo 'F9_ORIGINAL_PACKAGE_CHANGED'; exit 7; }
          python3 "$installer" --install
          python3 "$installer" --check
          private="$root/tools/yt-dlp-2026.10.26/yt-dlp"
          test -f "$private" && test ! -L "$private" && test -x "$private"
          test "$(sha256sum "$private" | awk '{print $1}')" = 767ba9dce7052aa196f8b12652f433d76de128ba168966fa84b6394d5e6c6795
          test "$(dpkg-query -W -f='${Status}' yt-dlp 2>/dev/null)" = 'install ok installed'
          for service in "${services[@]}"; do
            test "$(systemctl is-active "$service")" = active || { echo "F9_POST_SERVICE_FAILED:$service"; exit 8; }
          done
          test "$(readlink -f "$root/current")" = "$root/releases/f1f3b03525adec7018d7d629243e7b0fbb7f5087"
          echo 'F9_YTDLP_PRIVATE_BINARY_AND_EXTRACTORS=PASS'
          echo 'F9_GLOBAL_YTDLP_PRESERVED=PASS'
          echo 'F9_PROTECTED_SERVICES=8/8_PASS'
          echo 'F9_FERRARI_ACTIVE_RELEASE_UNCHANGED=PASS'
          REMOTE
