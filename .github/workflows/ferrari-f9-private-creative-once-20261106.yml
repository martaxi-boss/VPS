name: Ferrari F9 private OBS library repair Ubuntu 24.04
# One-time Ferrari-only, no global APT, no streaming service, no shared bridge changes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ferrari-f9-private-creative-once-20261106.yml'
permissions:
  contents: read
concurrency:
  group: ferrari-f9-private-obs-libobs
  cancel-in-progress: false
jobs:
  obs-private-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact certified Ferrari OBS repair source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 3a43f7be0553151f9e62b20d737a62760433cbec
          persist-credentials: false
          path: ferrari
      - name: Validate code and non-destructive private launcher tests
        run: |
          set -Eeuo pipefail
          python3 -m py_compile ferrari/install/vps-phase9-private-obs24.py
          python3 -m unittest discover -s ferrari/tests -p test_phase9_private_obs24.py -v
          echo F9_OBS_PRIVATE_REPAIR_TESTS=PASS
      - name: Pinned existing VPS SSH identity
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS" || exit 2
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/f9-known-hosts"
          chmod 600 "$RUNNER_TEMP/f9-known-hosts"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/f9-known-hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' || exit 3
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          echo F9_EXISTING_SSH_PIN=PASS
      - name: Repair only Ferrari private OBS launcher and certify bundled libobs
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes
                -o "UserKnownHostsFile=$RUNNER_TEMP/f9-known-hosts"
                -o GlobalKnownHostsFile=/dev/null
                -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=30 -o ServerAliveInterval=15)
          root=/srv/projects/skill-universal
          target="$root/.runtime/f9-obs-library-$GITHUB_RUN_ID.py"
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            'test -d /srv/projects/skill-universal/.runtime && test ! -L /srv/projects/skill-universal'
          sshpass -e scp "${opts[@]}" ferrari/install/vps-phase9-private-obs24.py \
            "ubuntu@146.59.145.3:$target"
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 'bash -s' -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ulimit -c 0
          root=/srv/projects/skill-universal
          run="$1"
          [[ "$run" =~ ^[0-9]+$ ]] || exit 4
          script="$root/.runtime/f9-obs-library-$run.py"
          trap 'rm -f -- "$script"' EXIT
          test "$(id -un)" = ubuntu && test -f "$script" && test ! -L "$script"
          test "$(readlink -f "$root/current")" = "$root/releases/f1f3b03525adec7018d7d629243e7b0fbb7f5087" || exit 5
          test "$(dpkg-query -W -f='${Status}' obs-studio 2>/dev/null)" = 'install ok installed' || exit 6
          services=(pink-iptv-backend pink-vpn fadego-staging lowcost-europa
                    pm2-iptvpn-bot pm2-telegram-robot-leads nginx postgresql@16-main)
          for s in "${services[@]}"; do test "$(systemctl is-active "$s")" = active || exit 7; done
          python3 "$script" --repair-launcher
          out="$(python3 "$script" --check)"
          echo "$out"
          python3 - "$out" <<'PY'
          import json,sys
          o=json.loads(sys.argv[1])
          assert o.get('status')=='private_obs_package_verified',o
          assert o.get('private_libobs_linked') is True,o
          print('F9_OBS_PRIVATE_LIBOBS_LINKED=PASS')
          print('F9_OBS_CLI_VERSION='+('PASS' if o.get('cli_version_tested') else 'PENDING'))
          PY
          test "$(dpkg-query -W -f='${Status}' obs-studio 2>/dev/null)" = 'install ok installed' || exit 8
          for s in "${services[@]}"; do test "$(systemctl is-active "$s")" = active || exit 9; done
          test "$(readlink -f "$root/current")" = "$root/releases/f1f3b03525adec7018d7d629243e7b0fbb7f5087" || exit 10
          echo F9_OBS_SERVICES=8_OF_8_PASS
          echo F9_OBS_GLOBAL_APT_PRESERVED=PASS
          echo F9_OBS_GUI_STREAMING_WEBSOCKET=NOT_TESTED
          REMOTE
