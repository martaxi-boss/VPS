name: Ferrari F9 one-time private OBS Ubuntu 24.04
# One-time guarded migration. No global APT changes, GUI daemon or shared bridge edits.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ferrari-f9-private-creative-once-20261106.yml'
permissions:
  contents: read
concurrency:
  group: ferrari-f9-obs24-20261106
  cancel-in-progress: false
jobs:
  private-obs:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact merged Ferrari OBS source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: d095b394b8c01610284c1dd92985db0df9f64990
          persist-credentials: false
          path: ferrari
      - name: Verify OBS installer tests
        run: |
          set -Eeuo pipefail
          python3 -m py_compile ferrari/install/vps-phase9-private-obs24.py
          python3 -m unittest discover -s ferrari/tests -p test_phase9_private_obs24.py -v
          echo F9_PRIVATE_OBS_SOURCE_CHECK=PASS
      - name: Reuse existing pinned VPS SSH connection
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS" || exit 2
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/f9-known-hosts"
          chmod 600 "$RUNNER_TEMP/f9-known-hosts"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/f9-known-hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' || exit 3
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          echo F9_EXISTING_SSH_PIN=PASS
      - name: Check and install official OBS only inside Ferrari
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes
                -o "UserKnownHostsFile=$RUNNER_TEMP/f9-known-hosts"
                -o GlobalKnownHostsFile=/dev/null
                -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          root=/srv/projects/skill-universal
          source="$root/.runtime/f9-obs-$GITHUB_RUN_ID.py"
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            'test -d /srv/projects/skill-universal/.runtime && test ! -L /srv/projects/skill-universal'
          sshpass -e scp "${opts[@]}" ferrari/install/vps-phase9-private-obs24.py \
            "ubuntu@146.59.145.3:$source"
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 'bash -s' -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ulimit -c 0
          root=/srv/projects/skill-universal
          run="$1"
          [[ "$run" =~ ^[0-9]+$ ]] || exit 4
          script="$root/.runtime/f9-obs-$run.py"
          trap 'rm -f -- "$script"' EXIT
          test "$(id -un)" = ubuntu && test "$(id -u)" -ne 0
          test -f "$script" && test ! -L "$script"
          test "$(readlink -f "$root/current")" = "$root/releases/f1f3b03525adec7018d7d629243e7b0fbb7f5087" || exit 5
          test "$(dpkg-query -W -f='${Status}' obs-studio 2>/dev/null)" = 'install ok installed' || exit 6
          services=(pink-iptv-backend pink-vpn fadego-staging lowcost-europa
                    pm2-iptvpn-bot pm2-telegram-robot-leads nginx postgresql@16-main)
          for s in "${services[@]}"; do
            test "$(systemctl is-active "$s")" = active || { echo "F9_PRE_SERVICE_FAILED:$s"; exit 7; }
          done
          echo F9_OBS_PRIVATE_PRECHECK=PASS
          python3 "$script" --install
          python3 "$script" --check
          test "$(dpkg-query -W -f='${Status}' obs-studio 2>/dev/null)" = 'install ok installed' || exit 8
          for s in "${services[@]}"; do
            test "$(systemctl is-active "$s")" = active || { echo "F9_POST_SERVICE_FAILED:$s"; exit 9; }
          done
          test "$(readlink -f "$root/current")" = "$root/releases/f1f3b03525adec7018d7d629243e7b0fbb7f5087" || exit 10
          du -sh "$root/tools/obs-studio-32.2.2"
          df -hT "$root"
          echo F9_OBS_PRIVATE_PACKAGE=PASS
          echo F9_OBS_OTHER_SERVICES=8_OF_8_PASS
          echo F9_OBS_GUI_WEBSOCKET_AND_DEPENDENCIES=NOT_YET_CERTIFIED
          REMOTE
