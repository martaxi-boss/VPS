name: Temporary Telegram Leads username probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/telegram_leads_identity_probe_tmp.py'
      - '.github/workflows/telegram-leads-identity-probe-tmp.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == 'martaxi-boss/VPS'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify probe syntax
        run: python3 -m py_compile ops/telegram_leads_identity_probe_tmp.py
      - name: Verify VPS host identity
        shell: bash
        run: |
          set -euo pipefail
          known="$RUNNER_TEMP/leads-identity-known"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$known"
          chmod 600 "$known"
          observed="$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')"
          test "$observed" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
      - name: Read Telegram usernames only
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          known="$RUNNER_TEMP/leads-identity-known"
          sshpass -e ssh -T \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 ubuntu@146.59.145.3 \
            'sudo -n /opt/telegram-robot-leads/.venv/bin/python -' \
            < ops/telegram_leads_identity_probe_tmp.py
