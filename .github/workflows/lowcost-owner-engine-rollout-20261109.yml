name: Lowcost owner engine comparison - guarded UI deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-owner-engine-rollout-20261109.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-owner-production-rollout
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Deploy owner search-engine UI through pinned SSH and rollback
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          OLD=381c34adcff8f26fab3e60a86979c488e73a680f
          NEW=070ee07fe8efe4fe4c4a00edf15246cf32995c3d
          TASK="$ROOT/private/ops/owner-engines-20261109"
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          mkdir -p -m 700 "$ROOT/private/ops"
          exec 9>"$ROOT/private/ops/ptes-deploy.lock"
          flock -n 9
          test ! -e "$TASK"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$OLD"
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = "$NEW"
          test "$(df -Pk "$ROOT" | awk 'END{print $4}')" -gt 500000
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          for unit in lowcost-europa.service lowcost-europa-indexnow.timer lowcost-europa-catalog-maintenance.timer lowcost-europa-backup.timer lowcost-europa-affiliate-report.timer lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer; do
           systemctl is-active --quiet "$unit"
          done
          nginx -t >/dev/null 2>&1
          git -c safe.directory="$ROOT" -C "$ROOT" fetch -q https://github.com/martaxi-boss/lowcost-europa.git main
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse FETCH_HEAD)" = "$NEW"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" diff --name-only "$OLD" "$NEW" | wc -l)" -eq 3
          while IFS= read -r file; do
           case "$file" in
           apps/catalog/owner_panel_views.py|apps/catalog/templates/catalog/owner_panel/dashboard.html|apps/catalog/tests/test_owner_engine_comparison.py) ;;
           *) echo "UNEXPECTED_SOURCE_PATH=$file"; exit 12;;
           esac
          done < <(git -c safe.directory="$ROOT" -C "$ROOT" diff --name-only "$OLD" "$NEW")
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" diff --name-only "$OLD" "$NEW" -- requirements deploy config apps/catalog/models.py apps/catalog/migrations)"
          sh "$ROOT/deploy/scripts/backup-postgres.sh"
          BACKUP="$(find "$ROOT/backups/daily" -maxdepth 1 -type f -name '*.dump' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$BACKUP" && test -s "$BACKUP" && test -s "$BACKUP.sha256"
          (cd "$ROOT/backups/daily" && sha256sum -c "$(basename "$BACKUP.sha256")" >/dev/null)
          echo OWNER_ENGINE_BACKUP=PASS
          mkdir -m 700 "$TASK"
          cp -a "$ENVFILE" "$TASK/env.before"
          printf '%s\n' "$OLD" > "$TASK/previous-source-sha"
          rollback() {
           result=$?
           trap - EXIT
           if test "$result" -ne 0; then
            cp -a "$TASK/env.before" "$ENVFILE"
            git -c safe.directory="$ROOT" -C "$ROOT" checkout --detach -q "$OLD"
            if systemctl restart lowcost-europa.service && systemctl is-active --quiet lowcost-europa.service; then
             echo OWNER_ENGINE_ROLLBACK=PASS
            else
             echo OWNER_ENGINE_ROLLBACK=FAILED
            fi
           fi
           exit "$result"
          }
          trap rollback EXIT
          umask 022
          git -c safe.directory="$ROOT" -C "$ROOT" checkout --detach -q "$NEW"
          umask 077
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py check
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py check --deploy
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py makemigrations --check --dry-run
          test "$(cmp "$ENVFILE" "$TASK/env.before" >/dev/null; echo $?)" = 0
          systemctl reload lowcost-europa.service
          systemctl is-active --quiet lowcost-europa.service
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYCHECK'
          import os,urllib.request,urllib.error
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings.production')
          import django
          django.setup()
          from django.contrib.auth import get_user_model
          from django.test import RequestFactory
          from apps.catalog.owner_panel_views import dashboard
          from apps.catalog.models import ExternalMetricsSnapshot
          from django.conf import settings
          before=ExternalMetricsSnapshot.objects.count()
          owner=get_user_model().objects.filter(is_staff=True,is_active=True).first()
          assert owner
          req=RequestFactory().get('/painel/',secure=True,HTTP_HOST='www.lowcost-europa.eu')
          req.user=owner
          res=dashboard(req)
          assert res.status_code==200
          body=res.content.decode()
          for name in ('Motores de pesquisa','Google','Bing','Yahoo','DuckDuckGo','Brave','Seznam','Yandex'):
           assert name in body,name
          assert 'indisponível' in body
          assert 'não recolhe aqui novos dados dos visitantes' in body
          assert res['Cache-Control']=='private, no-store' and 'noindex' in res['X-Robots-Tag']
          assert ExternalMetricsSnapshot.objects.count()==before
          base='https://www.lowcost-europa.eu'
          for path in ('/','/pt/','/sitemap.xml','/robots.txt'):
           for i in range(3):
            with urllib.request.urlopen(base+path,timeout=20) as r:assert r.status==200
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect)
          try:r=opener.open(base+'/painel/',timeout=20)
          except urllib.error.HTTPError as exc:
           assert exc.code==302 and 'noindex' in exc.headers['X-Robots-Tag'] and 'private' in exc.headers['Cache-Control']
           exc.close()
          else:raise AssertionError('owner panel exposed')
          print('OWNER_ENGINE_PRIVATE_PANEL=PASS')
          print('OWNER_ENGINE_PUBLIC_ROUTES=PASS')
          print('OWNER_ENGINE_SNAPSHOT_UNCHANGED=PASS')
          PYCHECK
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$NEW"
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          nginx -t >/dev/null 2>&1
          for unit in lowcost-europa.service lowcost-europa-indexnow.timer lowcost-europa-catalog-maintenance.timer lowcost-europa-backup.timer lowcost-europa-affiliate-report.timer lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer; do
           systemctl is-active --quiet "$unit"
          done
          echo "LOWCOST_DEPLOYED_SHA=$NEW"
          echo OWNER_ENGINE_PRODUCTION_DEPLOY=PASS
          trap - EXIT
          REMOTE
