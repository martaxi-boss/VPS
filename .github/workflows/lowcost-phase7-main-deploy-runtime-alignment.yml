name: Lowcost Europa Phase 7 Git Credential Audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lowcost-phase7-main-deploy-runtime-alignment.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Audit existing GitHub credential path on OVH
        env:
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          HOST="146.59.145.3"
          USER="ubuntu"
          test -n "${VPS_SSH_PASSWORD:-}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

          sshpass -p "$VPS_SSH_PASSWORD" ssh             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -o StrictHostKeyChecking=accept-new             -o ConnectTimeout=10             "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP="/srv/lowcost-europa"
          APP_USER="le001_1789265592"
          EXPECTED_HEAD="d568c0bc77698b593b862b0a2e5a5b4305cfde26"
          EXPECTED_BRANCH="ops/ovh-cutover-001"

          HEAD_NOW="$(sudo -u "$APP_USER" git -C "$APP" rev-parse HEAD)"
          BRANCH_NOW="$(sudo -u "$APP_USER" git -C "$APP" branch --show-current)"
          STATUS_NOW="$(sudo -u "$APP_USER" git -C "$APP" status --short)"
          echo "HEAD=$HEAD_NOW"
          echo "BRANCH=$BRANCH_NOW"
          [ -z "$STATUS_NOW" ] && echo "WORKTREE=CLEAN" || { echo "WORKTREE=DIRTY"; exit 20; }
          [ "$HEAD_NOW" = "$EXPECTED_HEAD" ]
          [ "$BRANCH_NOW" = "$EXPECTED_BRANCH" ]

          ORIGIN="$(sudo -u "$APP_USER" git -C "$APP" remote get-url origin)"
          case "$ORIGIN" in
            https://github.com/*) echo "ORIGIN_KIND=GITHUB_HTTPS" ;;
            git@github.com:*) echo "ORIGIN_KIND=GITHUB_SSH" ;;
            *) echo "ORIGIN_KIND=OTHER" ;;
          esac
          echo "ORIGIN_REPO_MATCH=$([ "$ORIGIN" = "https://github.com/martaxi-boss/lowcost-europa.git" ] || [ "$ORIGIN" = "git@github.com:martaxi-boss/lowcost-europa.git" ] && echo YES || echo NO)"

          APP_HOME="$(getent passwd "$APP_USER" | cut -d: -f6)"
          echo "APP_HOME_PRESENT=$([ -d "$APP_HOME" ] && echo YES || echo NO)"

          LOCAL_HELPER="$(sudo -u "$APP_USER" git -C "$APP" config --local --get credential.helper || true)"
          GLOBAL_HELPER="$(sudo -u "$APP_USER" git config --global --get credential.helper || true)"
          echo "LOCAL_CREDENTIAL_HELPER_PRESENT=$([ -n "$LOCAL_HELPER" ] && echo YES || echo NO)"
          echo "GLOBAL_CREDENTIAL_HELPER_PRESENT=$([ -n "$GLOBAL_HELPER" ] && echo YES || echo NO)"

          for p in "$APP_HOME/.git-credentials" "$APP_HOME/.netrc"; do
            label="$(basename "$p" | tr '.-' '__' | tr '[:lower:]' '[:upper:]')"
            if sudo -u "$APP_USER" test -f "$p" && ! sudo -u "$APP_USER" test -L "$p"; then
              echo "${label}_PRESENT=YES"
              echo "${label}_MODE=$(stat -c '%a' "$p")"
              echo "${label}_OWNER=$(stat -c '%U' "$p")"
            else
              echo "${label}_PRESENT=NO"
            fi
          done

          if command -v gh >/dev/null 2>&1; then
            echo "GH_CLI_PRESENT=YES"
            if sudo -u "$APP_USER" gh auth status -h github.com >/dev/null 2>&1; then
              echo "GH_AUTH_PRESENT=YES"
            else
              echo "GH_AUTH_PRESENT=NO"
            fi
          else
            echo "GH_CLI_PRESENT=NO"
            echo "GH_AUTH_PRESENT=NO"
          fi

          SSH_DIR="$APP_HOME/.ssh"
          if [ -d "$SSH_DIR" ]; then
            echo "SSH_DIR_PRESENT=YES"
            KEY_COUNT="$(find "$SSH_DIR" -maxdepth 1 -type f \( -name 'id_*' ! -name '*.pub' \) | wc -l)"
            echo "SSH_PRIVATE_KEY_FILE_COUNT=$KEY_COUNT"
          else
            echo "SSH_DIR_PRESENT=NO"
            echo "SSH_PRIVATE_KEY_FILE_COUNT=0"
          fi

          set +e
          sudo -u "$APP_USER" env GIT_TERMINAL_PROMPT=0 git -C "$APP" ls-remote origin HEAD >/dev/null 2>&1
          HTTPS_RC=$?
          sudo -u "$APP_USER" env GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8'             git ls-remote git@github.com:martaxi-boss/lowcost-europa.git HEAD >/dev/null 2>&1
          SSH_RC=$?
          set -e
          echo "EXISTING_ORIGIN_AUTH_WORKS=$([ "$HTTPS_RC" -eq 0 ] && echo YES || echo NO)"
          echo "EXISTING_SSH_GITHUB_AUTH_WORKS=$([ "$SSH_RC" -eq 0 ] && echo YES || echo NO)"

          if sudo -n test -f /etc/lowcost-europa/lowcost-europa.env; then
            for key in GITHUB_TOKEN GH_TOKEN GITHUB_PAT GIT_TOKEN; do
              if sudo -n grep -qE "^$key=" /etc/lowcost-europa/lowcost-europa.env; then
                echo "APP_ENV_${key}_PRESENT=YES"
              else
                echo "APP_ENV_${key}_PRESENT=NO"
              fi
            done
          fi

          echo "SECRETS_PRINTED=NO"
          REMOTE
