name: REA P265 activate reviewed original dist and restore 11 Evidence
on:
  push:
    branches:
      - rea/one-skill-bridge-20261023
    paths:
      - ".github/workflows/rea-p265-activate-restore.yml"
permissions:
  contents: read
concurrency:
  group: rea-one-skill-bridge
  cancel-in-progress: false
jobs:
  activate-restore:
    if: github.actor == 'martaxi-boss'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout original authenticated SSH and MCP bridge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Confirm one-use encrypted owner-signed import is staged
        shell: bash
        run: |
          set -euo pipefail
          request='rea-linux/release-escrow/p263-owner-signed-restore-encrypted-01852e68.json'
          test -f "$request"
          echo 'fbd3ac3feb4a616b1dbe131ba256c00b44e021a28f8dcd3b7a0228338d814240  rea-linux/release-escrow/p263-owner-signed-restore-encrypted-01852e68.json' | sha256sum --check --status
          python3 -m py_compile ops/rea_mobile_mcp_bridge_20261022.py ops/rea_secure_protocol_20261022.py
          python3 ops/rea_mobile_mcp_bridge_20261022.py --validate "$request"
          echo REA_P265_ENCRYPTED_SIGNED_REQUEST_SHAPE=PASS
      - name: Verify existing pinned owner SSH identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/rea-p265-known"
          chmod 600 "$RUNNER_TEMP/rea-p265-known"
          observed="$(ssh-keygen -lf "$RUNNER_TEMP/rea-p265-known" -E sha256 | awk '{print $2}')"
          test "$observed" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          echo REA_P265_SSH_PIN=PASS
      - name: Prepare existing SSH client and sealed-response verifier
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass python3-cryptography python3-jsonschema > /dev/null
          /usr/bin/python3 -c 'from cryptography.hazmat.primitives.ciphers.aead import AESGCM'
          /usr/bin/python3 -m unittest -q ops.tests.test_rea_secure_protocol_20261022 ops.tests.test_rea_describe_delivery_20261022
      - name: Prepare guarded exact-P265 source-module activation script
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rea-p265-activate-private.py" <<'PY'
          import hashlib, os, pathlib, pwd, shutil, socket, stat, subprocess, sys, tarfile, time
          root=pathlib.Path('/opt/rea-reversa/rea')
          private=root/'.rea-private'
          checkpoint=private/'p262-live-evidence-11-8b17734c.json'
          staged=private/'p265-staged-original-fixed-dist.tar.gz'
          prepared=private/'p265-extracted-reviewed-dist'
          rollback=private/'p265-original-dist-rollback'
          failed=private/'p265-failed-dist-rollback'
          baseline='8b17734cba53e5332e4780ce8ad4dad068a394fe3e52227274ab7c43712f5380'
          tarhash='5935ad19b76d4d8b91d191a3c72ae6d4cb8bda643cdfa821f0fca6835ff90fdf'
          checks={
            'application/binary/BinarySession.js':'06194e106c791c652f5eaed5c1d5327cacff9f9f4491156e43a75baecfbf4f17',
            'application/binary/BinarySessionRecords.js':'cfa157e47e030ea945b80b5ee5e88a651fb03f35f6f882b4cb1f28ee79f4af69',
            'mcp/main.js':'3ab3bee473a77ed4d52cc530e92c5df28e8da9deb61e925cb59c8271ca5ec907',
          }
          def sha(path):
            h=hashlib.sha256()
            with open(path,'rb') as f:
              for block in iter(lambda:f.read(1024*1024),b''):h.update(block)
            return h.hexdigest()
          def run(*argv,timeout=90):
            return subprocess.run(argv,check=True,timeout=timeout,capture_output=True,text=True)
          unit='rea-reversa-mcp.service'
          serviceuid=pwd.getpwnam('rea-reversa').pw_uid
          for item in (private,checkpoint,staged):
            if item.is_symlink() or not item.exists():raise RuntimeError('Missing or symlinked prerequisite: '+str(item))
          if checkpoint.stat().st_uid!=serviceuid or (stat.S_IMODE(checkpoint.stat().st_mode)&0o077):
            raise RuntimeError('Existing backup owner/mode insecure')
          if sha(checkpoint)!=baseline or sha(staged)!=tarhash:
            raise RuntimeError('Approved checkpoint or staged release hash drift')
          if prepared.exists() or rollback.exists() or failed.exists():
            raise RuntimeError('Previous release or rollback already exists; fail closed')
          original=root/'dist'
          if not original.is_dir() or original.is_symlink():raise RuntimeError('Original dist absent or symlinked')
          if sha(original/'application/binary/BinarySession.js')!='0e74d6b0b47a35eac6a3ec6afd954006fc86c5e869777834c256f7b8f3a258d3':
            raise RuntimeError('Original BinarySession.js different than P263 preflight')
          if sha(original/'application/binary/BinarySessionRecords.js')!='ec1913fd02ea3fabf684ffc13659e8b4d3d86efa44a3ae2dc9f2a1f02efde3fd':
            raise RuntimeError('Original BinarySessionRecords.js drift')
          pid_before=run('systemctl','show',unit,'-p','MainPID','--value').stdout.strip()
          if not pid_before.isdigit() or int(pid_before)<2:raise RuntimeError('Live original REA service not running')
          prepared.mkdir(mode=0o700)
          try:
            with tarfile.open(staged,'r:gz') as archive:
              members=archive.getmembers()
              if len(members)>4000 or len(members)<1000:raise RuntimeError('Unexpected compiled release member count')
              for m in members:
                p=pathlib.PurePosixPath(m.name)
                if p.is_absolute() or '..' in p.parts or p.parts[0]!='dist' or not (m.isfile() or m.isdir()):
                  raise RuntimeError('Unsafe release archive member')
              archive.extractall(prepared,filter='data')
            new=prepared/'dist'
            for relative,expected in checks.items():
              if sha(new/relative)!=expected:raise RuntimeError('Pinned compiled module differs: '+relative)
            if sha(checkpoint)!=baseline:raise RuntimeError('Evidence backup changed during staging')
            print('REA_P265_PRE_DEPLOY_BACKUP=PASS',flush=True)
            print('REA_P265_PINNED_COMPILED_MODULES=PASS',flush=True)
            run('systemctl','stop',unit,timeout=65)
            try:
              os.replace(original,rollback)
              os.replace(new,original)
              run('systemctl','start',unit,timeout=85)
              alive=False
              for _ in range(32):
                if run('systemctl','is-active',unit,timeout=8).stdout.strip()=='active':
                  try:
                    with socket.create_connection(('127.0.0.1',8765),timeout=2):pass
                    alive=True
                    break
                  except OSError:pass
                time.sleep(1)
              if not alive:raise RuntimeError('Original MCP socket did not reopen')
            except Exception:
              try:
                subprocess.run(['systemctl','stop',unit],timeout=60,check=False)
                if original.exists():os.replace(original,failed)
                if rollback.exists():os.replace(rollback,original)
                subprocess.run(['systemctl','start',unit],timeout=90,check=False)
                print('REA_P265_AUTO_ROLLBACK_ATTEMPTED=YES',flush=True)
              finally:raise
            if sha(checkpoint)!=baseline:raise RuntimeError('Evidence backup unexpectedly changed on disk')
            print('REA_P265_FIXED_BINARY_DIST_ACTIVE=PASS',flush=True)
            print('REA_P265_PRIVATE_EVIDENCE_ARCHIVE_SHA256=PASS',flush=True)
            print('REA_P265_RESTORE_IS_REQUIRED=YES',flush=True)
          finally:
            if prepared.exists():shutil.rmtree(prepared)
          PY
      - name: Activate fixed original MCP then apply EXACT owner signed P263 restoration
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          umask 077
          ssh_args=(-T -o PreferredAuthentications=password -o PubkeyAuthentication=no
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/rea-p265-known"
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
            -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=5)
          sshpass -e ssh "${ssh_args[@]}" ubuntu@146.59.145.3 'sudo -n python3 -' \
            < "$RUNNER_TEMP/rea-p265-activate-private.py"
          echo REA_P265_PATCH_ACTIVATION_STEP=PASS
          request='rea-linux/release-escrow/p263-owner-signed-restore-encrypted-01852e68.json'
          request64="$(base64 -w0 "$request")"
          raw="$RUNNER_TEMP/rea-p265-private-remote-output.txt"
          {
            printf 'import base64,sys,types,os\nos.environ["REA_MOBILE_JOB_B64"]="%s"\n_rea_secure=types.ModuleType("rea_secure_protocol_20261022")\nexec(base64.b64decode("%s"),_rea_secure.__dict__)\nsys.modules["rea_secure_protocol_20261022"]=_rea_secure\n' \
              "$request64" "$(base64 -w0 ops/rea_secure_protocol_20261022.py)"
            cat ops/rea_mobile_mcp_bridge_20261022.py
          } > "$RUNNER_TEMP/rea-p265-original-bridge.py"
          sshpass -e ssh "${ssh_args[@]}" ubuntu@146.59.145.3 \
            'REA_MOBILE_ENVELOPE_CAPTURE=1 python3 -' \
            < "$RUNNER_TEMP/rea-p265-original-bridge.py" > "$raw"
          /usr/bin/python3 ops/rea_mobile_mcp_bridge_20261022.py \
            --envelope "$raw" "$request" "$RUNNER_TEMP/rea-p265-restore-envelope.json"
          rm -f "$raw" "$RUNNER_TEMP/rea-p265-original-bridge.py"
          echo REA_P265_SIGNED_RESTORE_BRIDGE_EXECUTED=YES
      - name: Preserve encrypted restored state for independent private verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-p265-restoration-encrypted-original-mcp
          path: ${{ runner.temp }}/rea-p265-restore-envelope.json
          if-no-files-found: ignore
          retention-days: 1
