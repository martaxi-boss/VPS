name: Lowcost Traffic Audit Corrected
on:
  push:
    branches: ['ops/traffic-audit-*']
    paths: ['.github/workflows/traffic-audit-corrected.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit traffic
        env:
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$VPS_SSH_PASSWORD"
          cat >/tmp/a.py <<'PY'
          import re,glob,gzip,datetime,collections
          from urllib.parse import urlsplit
          from zoneinfo import ZoneInfo
          UTC=datetime.timezone.utc; LIS=ZoneInfo("Europe/Lisbon")
          start=datetime.datetime(2026,9,23,17,5,17,tzinfo=UTC); end=datetime.datetime.now(UTC)
          owner={"89.214.112.247","89.214.113.61","89.214.116.217","89.214.116.15","89.214.112.225","85.247.222.132","95.177.101.141","89.214.118.145","85.244.90.90"}
          meta=("157.240.","173.252.","31.13.","69.63.","66.220.","129.134.")
          bot=re.compile(r"bot|crawler|spider|slurp|measurement|scan|curl|wget|python|go-http|headless|facebookexternalhit|meta-external|preview|monitor|zgrab|censys|masscan|nmap|httpx|semrush|ahrefs|mj12|petalbot|duckassist|perplexity|claude|chatgpt|amazonbot|applebot|googlebot|bingbot|yandex|baiduspider|bytespider|hunyuan|deepseek|yibot|domain-harvester|internetmeasurement|google-read-aloud",re.I)
          pat=re.compile(r'^(\S+) \S+ \S+ \[([^\]]+)\] "(\S+) ([^ ]+) [^"]+" (\d{3}) (\S+) "([^"]*)" "([^"]*)"')
          rows=[]
          for f in glob.glob("/var/log/nginx/access.log*"):
              try: h=gzip.open(f,"rt",errors="ignore") if f.endswith(".gz") else open(f,errors="ignore")
              except OSError: continue
              with h:
                  for line in h:
                      m=pat.match(line)
                      if not m: continue
                      ip,ts,method,path,status,_,ref,ua=m.groups()
                      try: dt=datetime.datetime.strptime(ts,"%d/%b/%Y:%H:%M:%S %z")
                      except: continue
                      if start<=dt<=end: rows.append({"ip":ip,"dt":dt,"method":method,"path":path,"status":int(status),"ref":ref,"ua":ua})
          for x in rows:
              s=(x["path"]+" "+x["ref"]).lower()
              if "2201116sc" in x["ua"].lower() or "gestao=" in s or "/admin/" in s: owner.add(x["ip"])
          def p(x): return urlsplit(x["path"]).path
          exact={"/","/contacto/","/como-funciona/","/afiliados/","/privacidade/","/termos/"}
          def page(x): return x["method"]=="GET" and x["status"]==200 and (p(x) in exact or p(x).startswith("/products/"))
          def isgo(x): return x["method"]=="GET" and x["status"] in (301,302,303,307,308) and bool(re.fullmatch(r"/go/\d+/?",p(x)))
          def paid(x):
              s=(x["path"]+" "+x["ref"]+" "+x["ua"]).lower()
              return ("utm_source=fb" in s and "utm_medium=paid" in s) or ("fbclid=" in s and ("facebook.com" in s or "fb.com" in s or "fb_iab" in s or "fbav/" in s))
          base=[x for x in rows if x["ip"] not in owner and not bot.search(x["ua"]) and not x["ip"].startswith(meta) and (page(x) or isgo(x))]
          groups=collections.defaultdict(list)
          for x in base: groups[(x["ip"],x["ua"])].append(x)
          sessions=[]; gap=datetime.timedelta(minutes=45)
          for evs in groups.values():
              evs.sort(key=lambda e:e["dt"]); cur=[]; prev=None
              for e in evs:
                  if prev is not None and e["dt"]-prev>gap: sessions.append(cur); cur=[]
                  cur.append(e); prev=e["dt"]
              if cur: sessions.append(cur)
          def suspicious(s):
              g=sum(1 for e in s if isgo(e))
              if g>=10: return True
              return len(s)>=30 and (s[-1]["dt"]-s[0]["dt"]).total_seconds()<=600
          sus=[s for s in sessions if suspicious(s)]
          sessions=[s for s in sessions if not suspicious(s)]
          ev=[e for s in sessions for e in s]; pages=[e for e in ev if page(e)]; gos=[e for e in ev if isgo(e)]
          fam=[e for e in pages if p(e).startswith("/products/")]
          ps=[s for s in sessions if any(paid(e) for e in s)]; pev=[e for s in ps for e in s]
          def likely(s):
              if any(paid(e) for e in s): return True
              if any(p(e).startswith("/products/") or p(e)=="/contacto/" or isgo(e) for e in s): return True
              if sum(page(e) for e in s)>=2: return True
              u=s[0]["ua"].lower(); return "iphone" in u or "ipad" in u or "android" in u
          lh=[s for s in sessions if likely(s)]
          print("START_LOCAL="+start.astimezone(LIS).isoformat())
          print("END_LOCAL="+end.astimezone(LIS).isoformat())
          print("SUSPICIOUS_SESSIONS="+str(len(sus)))
          print("SUSPICIOUS_GO_EVENTS="+str(sum(1 for s in sus for e in s if isgo(e))))
          print("EXTERNAL_PAGEVIEWS="+str(len(pages)))
          print("EXTERNAL_UNIQUE_IPS="+str(len({e["ip"] for e in pages})))
          print("EXTERNAL_SESSIONS="+str(len(sessions)))
          print("LIKELY_HUMAN_SESSIONS="+str(len(lh)))
          print("LIKELY_HUMAN_PAGEVIEWS="+str(sum(1 for s in lh for e in s if page(e))))
          print("HOME="+str(sum(p(e)=="/" for e in pages)))
          print("FAMILY="+str(len(fam)))
          print("FAMILY_SESSIONS="+str(sum(any(page(e) and p(e).startswith("/products/") for e in s) for s in sessions)))
          print("CONTACT="+str(sum(p(e)=="/contacto/" for e in pages)))
          print("GO="+str(len(gos)))
          print("GO_SESSIONS="+str(sum(any(isgo(e) for e in s) for s in sessions)))
          print("PAID_FB_SESSIONS="+str(len(ps)))
          print("PAID_FB_PAGEVIEWS="+str(sum(page(e) for e in pev)))
          print("PAID_FB_UNIQUE_IPS="+str(len({e["ip"] for e in pev if page(e)})))
          print("PAID_FB_FAMILY="+str(sum(page(e) and p(e).startswith("/products/") for e in pev)))
          print("PAID_FB_GO="+str(sum(isgo(e) for e in pev)))
          print("DAILY")
          days=sorted({e["dt"].astimezone(LIS).strftime("%Y-%m-%d") for e in pages})
          for d in days:
              pp=[e for e in pages if e["dt"].astimezone(LIS).strftime("%Y-%m-%d")==d]
              ss=[s for s in sessions if s[0]["dt"].astimezone(LIS).strftime("%Y-%m-%d")==d]
              pss=[s for s in ps if s[0]["dt"].astimezone(LIS).strftime("%Y-%m-%d")==d]
              gg=[e for e in gos if e["dt"].astimezone(LIS).strftime("%Y-%m-%d")==d]
              print(f"{d} PV={len(pp)} UNIQUE={len({e['ip'] for e in pp})} SESSIONS={len(ss)} HOME={sum(p(e)=='/' for e in pp)} FAMILY={sum(p(e).startswith('/products/') for e in pp)} GO={len(gg)} PAID_FB={len(pss)}")
          print("FAMILIES")
          for k,v in collections.Counter(p(e) for e in fam).most_common(): print(v,k)
          PY
          sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 ubuntu@146.59.145.3 'sudo -n python3 -' </tmp/a.py
