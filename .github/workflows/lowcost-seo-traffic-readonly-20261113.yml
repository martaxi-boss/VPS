name: Lowcost SEO traffic and current live status read-only 20261113
on:
  push:
    paths:
      - .github/workflows/lowcost-seo-traffic-readonly-20261113.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  traffic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify public SEO pages from independent runner
        shell: bash
        run: |
          set -euo pipefail
          for path in / /pt/ /pt/products/hifu/ /es/products/hifu/ /robots.txt /sitemap.xml /sitemap.txt; do
            status="$(curl -sS -L --retry 2 --retry-delay 2 --max-time 15 -o /dev/null -w '%{http_code}' "https://www.lowcost-europa.eu$path")"
            printf 'PUBLIC_SEO_%s=%s\n' "$path" "$status"
            test "$status" = 200
          done
          echo PUBLIC_SEO_QA=PASS
      - name: Read only sanitized private counters over existing authenticated bridge
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT=/srv/projects/lowcost-europa
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = 719738cbb80f366255c2adf1a6a60e445e6d9250
          systemctl is-active --quiet lowcost-europa.service
          nginx -t >/dev/null 2>&1
          cd "$ROOT"
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PY'
          from pathlib import Path
          from apps.catalog.services.search_referral_metrics import read_private_report
          p = Path('/srv/projects/lowcost-europa/.local-metrics/search-referrers.json')
          report = read_private_report(p)
          assert report is not None, 'private report missing or stale'
          print('REPORT_CHECKED_AT='+report['checked_at'].isoformat())
          print('SEARCH_REQUESTS_7D='+str(report['total']))
          for row in report['rows']:
              print('ENGINE_'+row['name'].upper()+'='+str(row['requests']))
          m = report['meta']
          if m is None:
              print('META_REPORT=UNAVAILABLE')
          else:
              for key in ('total','facebook','instagram','unspecified','paid_tagged','today','yesterday'):
                  print('META_'+key.upper()+'='+str(m[key]))
              for day in m['daily']:
                  print('META_DAY_'+day['date']+'='+str(day['requests']))
              print('META_REPORT=PASS')
          print('PRIVATE_COUNTERS_VALIDATED=PASS')
          PY
          REMOTE
