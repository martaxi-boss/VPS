name: Ferrari P4 Ruflo test daemon provenance and exact hygiene once
on:
  push:
    branches: [main]
    paths:
      - ferrari-release-requests/ruflo-p4-daemon-hygiene-20261106.json
permissions:
  contents: read
concurrency:
  group: ferrari-ruflo-p4-daemon-hygiene
  cancel-in-progress: false
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact one-shot hygiene request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Only accept exact new one-shot request
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          added="$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER")"
          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          if [[ -z "$added" ]]; then
            echo execute=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$added" = 'ferrari-release-requests/ruflo-p4-daemon-hygiene-20261106.json'
          test "$added" = "$changed"
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('ferrari-release-requests/ruflo-p4-daemon-hygiene-20261106.json').read_text())
          assert actual=={
            "version":1,"task":"audit-and-stop-only-proven-ruflo-p4-ephemeral-test-daemon",
            "project_root":"/srv/projects/skill-universal",
            "test_temp_prefix":".ruflo-functional-p4-",
            "never_stop_other_projects":True
          }
          print('FERRARI_RUFLO_P4_PROVENANCE_REQUEST=PASS')
          PY
          echo execute=true >> "$GITHUB_OUTPUT"
      - name: Pinned SSH existing connection
        if: steps.gate.outputs.execute == 'true'
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/host"
          chmod 600 "$RUNNER_TEMP/host"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/host" -E sha256 | awk '{print $2}')" = SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Verify project ownership then stop only process proven born in this test
        if: steps.gate.outputs.execute == 'true'
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
             -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/host"
             -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
             -o ConnectTimeout=20 -o ServerAliveInterval=15)
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 'python3 -' > "$RUNNER_TEMP/ruflo-p4-daemon-hygiene.txt" <<'PY'
          import os,signal,time
          from pathlib import Path
          project=Path('/srv/projects/skill-universal')
          base=project.resolve(strict=True)
          assert project==base and project.is_dir() and not project.is_symlink()
          assert project.stat().st_uid==os.getuid()
          assert (project/'current').resolve(strict=True)==project/'releases/a266b25e06a9c8acf1fdc940d22b99070cd17ded'
          prefix=str(project/'.runtime/.ruflo-functional-p4-')
          own_uid=os.getuid()
          observed=[]
          matched=[]
          def describe(pid:int):
              proc=Path('/proc')/str(pid)
              try:
                  if proc.stat().st_uid!=own_uid:return None
                  cmd=(proc/'cmdline').read_bytes().replace(b'\0',b' ').decode(errors='replace')
                  cwd=os.readlink(proc/'cwd')
                  env=(proc/'environ').read_bytes().split(b'\0')
                  related_env=any(x.startswith((b'HOME=',b'XDG_CONFIG_HOME=',b'TMPDIR=')) and prefix.encode() in x for x in env)
                  starttime=(proc/'stat').read_text().rsplit(') ',1)[1].split()[19]
                  return {'cmd':cmd,'cwd':cwd,'env':related_env,'start':starttime}
              except (FileNotFoundError,PermissionError,ProcessLookupError,NotADirectoryError):
                  return None
          for proc in Path('/proc').iterdir():
              if not proc.name.isdigit():continue
              pid=int(proc.name)
              if pid==os.getpid():continue
              x=describe(pid)
              if x is None:continue
              # Only test-origin evidence: exact temporary folder marker in
              # current working directory or process env, combined with
              # Ruflo-owned binary/daemon command. No broad pkill.
              relevant=('ruflo' in x['cmd'].lower() or 'claude-flow' in x['cmd'].lower()
                        or '.runtime/npm/ruflo/' in x['cmd'].lower())
              if relevant:
                  observed.append(pid)
              origin=(x['cwd'].startswith(prefix) or x['env'])
              if origin and relevant:
                  matched.append((pid,x['start']))
          print('FERRARI_RUFLO_P4_OWNED_RUFLO_PROCESS_COUNT='+str(len(observed)),flush=True)
          print('FERRARI_RUFLO_P4_EXACT_TEST_ORIGIN_COUNT='+str(len(matched)),flush=True)
          for pid,start in matched:
              current=describe(pid)
              if not current or current['start']!=start:continue
              print('FERRARI_RUFLO_P4_PROVEN_PROCESS_STOP_REQUEST pid='+str(pid),flush=True)
              os.kill(pid,signal.SIGTERM)
          for _ in range(12):
              alive=[]
              for pid,start in matched:
                  x=describe(pid)
                  if x and x['start']==start:
                      alive.append((pid,start))
              if not alive:break
              time.sleep(0.25)
          if alive:
              # Fail closed: no aggressive SIGKILL of unknown process.
              print('FERRARI_RUFLO_P4_TEST_DAEMON_STILL_ALIVE='+str(len(alive)),flush=True)
              raise RuntimeError('Ruflo daemon test process did not terminate by SIGTERM')
          print('FERRARI_RUFLO_P4_EXACT_TEST_DAEMON_STOPPED_OR_ABSENT=PASS',flush=True)
          print('FERRARI_RUFLO_P4_OTHER_PROCESSES_UNTOUCHED=PASS',flush=True)
          assert (project/'current').resolve(strict=True)==project/'releases/a266b25e06a9c8acf1fdc940d22b99070cd17ded'
          print('FERRARI_RUFLO_P4_CURRENT_UNCHANGED=PASS',flush=True)
          PY
          cat "$RUNNER_TEMP/ruflo-p4-daemon-hygiene.txt"
          grep -q '^FERRARI_RUFLO_P4_EXACT_TEST_DAEMON_STOPPED_OR_ABSENT=PASS' "$RUNNER_TEMP/ruflo-p4-daemon-hygiene.txt"
      - name: Retain audit results
        if: steps.gate.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-ruflo-p4-daemon-hygiene-${{ github.run_id }}
          path: ${{ runner.temp }}/ruflo-p4-daemon-hygiene.txt
          retention-days: 14
          if-no-files-found: error
