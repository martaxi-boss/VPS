name: Sevelora - one-off guarded release hygiene
on:
  push:
    branches: [main]
    paths: [".github/workflows/sexshop-guarded-hygiene-20261119.yml"]

permissions:
  contents: read

concurrency:
  group: sexshop-catalog-deploy
  cancel-in-progress: false

jobs:
  guarded-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Validate pinned SSH host and reach only Sevelora project
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/known_hosts"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/known_hosts" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          chmod 600 "$RUNNER_TEMP/known_hosts"
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/Sexshop
          EXPECTED=e594211c575333aebee39968d2427ddcdcf0595a
          test -d "$ROOT/releases"
          test -L "$ROOT/current"
          CURRENT=$(readlink "$ROOT/current")
          test "$CURRENT" = "releases/$EXPECTED/app"
          test -s "$ROOT/infra/previous-release.txt"
          PREVIOUS=$(cat "$ROOT/infra/previous-release.txt")
          if [[ ! "$PREVIOUS" =~ ^releases/([0-9a-f]{40})/app$ ]]; then echo BAD_ROLLBACK_PATH; exit 10; fi
          PREVIOUS_SHA="${BASH_REMATCH[1]}"
          test "$PREVIOUS_SHA" != "$EXPECTED"
          test -f "$ROOT/releases/$EXPECTED/app/apps/ecommerce-shop-demo/server.js"
          test -f "$ROOT/releases/$PREVIOUS_SHA/app/apps/ecommerce-shop-demo/server.js"
          test -s "$ROOT/data/catalog.json"
          test -s "$ROOT/.private/diversual-feed-url"
          systemctl is-active --quiet sexshop.service
          systemctl is-active --quiet sexshop-catalog-sync.timer
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet nginx
          nginx -t
          curl -fsS --resolve sevelora.eu:443:127.0.0.1 https://sevelora.eu/ -o /dev/null
          echo "ACTIVE_SHA=$EXPECTED ROLLBACK_SHA=$PREVIOUS_SHA"
          echo "BEFORE_RELEASE_COUNT=$(find "$ROOT/releases" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          du -sh "$ROOT/releases" || true
          retained=0
          removed=0
          for dir in "$ROOT"/releases/*; do
            test -d "$dir" || continue
            test ! -L "$dir" || { echo "SKIP_SYMLINK"; continue; }
            sha="${dir##*/}"
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "SKIP_NON_RELEASE_DIRECTORY"
              continue
            fi
            if test "$sha" = "$EXPECTED" || test "$sha" = "$PREVIOUS_SHA"; then
              retained=$((retained+1))
              continue
            fi
            if test ! -f "$dir/app/apps/ecommerce-shop-demo/server.js"; then
              echo "SKIP_UNRECOGNIZED_RELEASE_LAYOUT"
              continue
            fi
            rm -rf --one-file-system -- "$dir"
            removed=$((removed+1))
          done
          test "$retained" = 2
          test -f "$ROOT/releases/$EXPECTED/app/apps/ecommerce-shop-demo/server.js"
          test -f "$ROOT/releases/$PREVIOUS_SHA/app/apps/ecommerce-shop-demo/server.js"
          if test -d "$ROOT/.incoming"; then
            find "$ROOT/.incoming" -maxdepth 1 -type f \( -name 'release.tgz' -o -name 'release.sha256' -o -name 'catalog-check.html' -o -name 'home-check.html' -o -name 'canonical-home-check.html' -o -name 'logo-check.svg' -o -name 'icon-check.svg' -o -name 'product-check.html' \) -delete
          fi
          systemctl is-active --quiet sexshop.service
          systemctl is-active --quiet lowcost-europa.service
          test "$(readlink "$ROOT/current")" = "releases/$EXPECTED/app"
          echo "SEVELORA_RELEASES_RETAINED=$retained"
          echo "SEVELORA_OBSOLETE_RELEASES_REMOVED=$removed"
          echo "SEVELORA_GUARDED_HYGIENE=PASS"
          echo "AFTER_RELEASE_COUNT=$(find "$ROOT/releases" -mindepth 1 -maxdepth 1 -type d | wc -l)"
          du -sh "$ROOT/releases" || true
          REMOTE
