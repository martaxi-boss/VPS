name: Ferrari private REA runtime root diagnostics one-time
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-ferrari-rea-root-check-20261103.yml'
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify existing pinned VPS SSH host
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/ferrari-known-host"
          chmod 600 "$RUNNER_TEMP/ferrari-known-host"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/ferrari-known-host" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
      - name: Inspect Ferrari installation path and original REA MCP runtime
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-known-host" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 ubuntu@146.59.145.3 'python3 -' \
            > "$RUNNER_TEMP/ferrari-rea-root-check.json" <<'PY'
          import json,os,sys
          from pathlib import Path
          root=Path.home()/'.local/share/motor-ferrari'
          paths={
            'root':root,
            'node_modules':root/'.runtime/npm/rea/node_modules',
            'rea_cli':root/'.runtime/npm/rea/node_modules/.bin/rea',
            'current':root/'current',
            'ghidra':root/'tools/rea-providers/ghidra-12.1.4',
            'jadx_jar':root/'tools/rea-providers/jadx-headless-mcp-0.7.1-all.jar',
          }
          summary={'uid':os.geteuid(),'home_matches_ubuntu':str(Path.home())=='/home/ubuntu',
                   'paths':{k:{'exists':p.exists(),'is_dir':p.is_dir(),'is_file':p.is_file(),
                      'is_symlink':p.is_symlink()} for k,p in paths.items()}}
          summary['resolved_ferrari_root']=str(root.resolve())
          summary['resolved_current_release']=str((root/'current').resolve())
          summary['resolved_cli']=str((root/'.runtime/npm/rea/node_modules/.bin/rea').resolve())
          summary['root_owner_uid']=root.stat().st_uid if root.exists() else None
          summary['root_parent_resolved']=str(root.parent.resolve())
          sys.path.insert(0,str(root/'current'))
          try:
            from engine import rea_mcp
            summary['rea_mcp_module_root_correct']=str(rea_mcp.ROOT)==str(root)
            try:
              cli,env=rea_mcp._resources(rea_mcp.ROOT)
              summary['resource_check']='PASS'
              summary['private_rea_cli']=str(cli).startswith(str(root))
            except Exception as ex:
              summary['resource_check']='FAIL'
              summary['error_type']=type(ex).__name__
              summary['error_text']=str(ex)[:100]
          except Exception as ex:
            summary['module_import']='FAIL'
            summary['error_type']=type(ex).__name__
          print(json.dumps(summary,sort_keys=True))
          PY
          cat "$RUNNER_TEMP/ferrari-rea-root-check.json"
      - name: Keep read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-rea-root-check-${{ github.run_id }}
          path: ${{ runner.temp }}/ferrari-rea-root-check.json
          if-no-files-found: warn
          retention-days: 7
