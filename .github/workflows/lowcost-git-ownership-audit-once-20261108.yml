name: Lowcost Git ownership and lock audit read only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-git-ownership-audit-once-20261108.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify one-file scope and SSH pin
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git diff --name-only HEAD^ HEAD)" == '.github/workflows/lowcost-git-ownership-audit-once-20261108.yml' ]]
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
      - name: Inspect only Lowcost Git metadata owners without source content
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SSHPASS" ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          [[ "$(git -c "safe.directory=$ROOT" -C "$ROOT" rev-parse HEAD)" == f157e3b98786db21d6f541917ec7b545e9913485 ]]
          echo LOWCOST_GIT_OWNER_FILES_BEGIN
          find "$ROOT/.git" -xdev -type f -printf '%u\n' | sort | uniq -c
          echo LOWCOST_GIT_OWNER_FILES_END
          echo LOWCOST_GIT_OWNER_DIRS_BEGIN
          find "$ROOT/.git" -xdev -type d -printf '%u\n' | sort | uniq -c
          echo LOWCOST_GIT_OWNER_DIRS_END
          for dir in .git .git/objects .git/objects/pack .git/refs .git/logs; do
            if [[ -d "$ROOT/$dir" ]]; then
              printf 'LOWCOST_GIT_OWNER_%s=' "$dir"
              stat -c '%U:%G %a' "$ROOT/$dir"
            fi
          done
          printf 'LOWCOST_GIT_LOCK_FILES='
          find "$ROOT/.git" -xdev -type f -name '*.lock' | wc -l
          if runuser -u le001_1789265592 -- test -w "$ROOT/.git/objects/pack"; then
            echo LOWCOST_GIT_OWNER_PACK_WRITABLE=YES
          else
            echo LOWCOST_GIT_OWNER_PACK_WRITABLE=NO
          fi
          echo LOWCOST_GIT_OWNER_READ_ONLY=PASS
          REMOTE
