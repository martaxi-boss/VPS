name: Lowcost Yandex ownership private transport prepare once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-yandex-proof-prepare-once-20261108.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-yandex-ownership-20261108
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prepare project-local private transport without proof values
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          TASK="$ROOT/private/yandex-ownership-20261108"
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" == f157e3b98786db21d6f541917ec7b545e9913485 ]]
          [[ -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          [[ ! -e "$TASK" ]]
          systemctl is-active --quiet lowcost-europa.service
          nginx -t >/dev/null 2>&1
          mkdir -m 700 "$TASK"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$TASK/transport.pem" 2>/dev/null
          chmod 600 "$TASK/transport.pem"
          openssl pkey -in "$TASK/transport.pem" -pubout -out "$TASK/transport-public.pem"
          echo LOWCOST_YANDEX_TRANSPORT_PUBLIC_BEGIN
          cat "$TASK/transport-public.pem"
          echo LOWCOST_YANDEX_TRANSPORT_PUBLIC_END
          echo LOWCOST_YANDEX_PREPARE=PASS
          REMOTE
