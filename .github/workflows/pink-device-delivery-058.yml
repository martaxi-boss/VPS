name: PINK device delivery 058
on:
  push:
    branches: ["builder/pink-device-delivery-058"]
    paths: ["ops/pink_delivery_058.py", ".github/workflows/pink-device-delivery-058.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: pink-device-delivery-058
  cancel-in-progress: false
jobs:
  delivery:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/Project-leader
          ref: 8efecaccfb5708d3689f9fcd0ad3bb77ec8e40db
          path: _canonical
          persist-credentials: false
      - name: Verify immutable authority and exact scoped diff
        run: |
          set -euo pipefail
          task=".project-leader/tasks/PINK-IPTV-DEVICE-DELIVERY-058.json"
          git show 37ba40317e7d98f5be41c04d634eb37a19352872:$task > "$RUNNER_TEMP/original-task.json"
          cmp "$task" "$RUNNER_TEMP/original-task.json"
          python _canonical/control/validate_records.py task "$task"
          python _canonical/control/validate_records.py scope "$task" $(git diff --name-only 5c2a8a5f6b8a3b3dafbd9236a516ddc62aca0d21 HEAD)
          python - <<'PY'
          import hashlib,json
          task=json.load(open(".project-leader/tasks/PINK-IPTV-DEVICE-DELIVERY-058.json"))
          assert hashlib.sha256(open("_canonical/control/generic-project-policy.json","rb").read()).hexdigest()==task["policy"]["sha256"]
          assert task["policy"]["revision"]=="8efecaccfb5708d3689f9fcd0ad3bb77ec8e40db"
          print("CANONICAL_IMMUTABLE_AUTHORITY_SCOPE_POLICY=PASS")
          PY
      - name: Copy and validate exact certified APK
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          PINK_OUTPUT: ${{ runner.temp }}/delivery058
        run: python ops/pink_delivery_058.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PINK-delivery-058-manifest
          path: ${{ runner.temp }}/delivery058/manifest.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ fromJSON(steps.package.outputs.part_count) > 0 }}
        with:
          name: PINK-delivery-058-part-00
          path: ${{ runner.temp }}/delivery058/part-00
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ fromJSON(steps.package.outputs.part_count) > 1 }}
