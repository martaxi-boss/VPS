name: Lowcost Europa safe staging one-shot 20261107
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-one-shot-rollout-20261107.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-one-shot-rollout-20261107
  cancel-in-progress: false
jobs:
  rollout:
    if: github.repository == 'martaxi-boss/VPS' && github.actor == 'martaxi-boss'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Verify pinned VPS SSH host identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/lowcost-known-hosts"
          chmod 600 "$RUNNER_TEMP/lowcost-known-hosts"
          observed="$(ssh-keygen -lf "$RUNNER_TEMP/lowcost-known-hosts" -E sha256 | awk '{print $2}')"
          test "$observed" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          echo 'LOWCOST_PINNED_VPS=PASS'
      - name: Verify and execute bounded rollback-safe deployment
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          printf '%s' '' | base64 -d | gzip -dc > "$RUNNER_TEMP/lowcost-rollout-once.sh"
          printf '%s  %s\n' '27e1e6409f7204e7d98dd2899d2fda1f30ad96db80da252b2c9463be96281c31' "$RUNNER_TEMP/lowcost-rollout-once.sh" | sha256sum -c - >/dev/null
          bash -n "$RUNNER_TEMP/lowcost-rollout-once.sh"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/lowcost-known-hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' < "$RUNNER_TEMP/lowcost-rollout-once.sh"
      - name: Preserve audited rollout procedure (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowcost-one-shot-procedure-${{ github.run_id }}
          path: ${{ runner.temp }}/lowcost-rollout-once.sh
          if-no-files-found: warn
          retention-days: 7
      - name: Verify external HTTPS and staging noindex
        shell: bash
        run: |
          set -euo pipefail
          base=https://lowcost-europa.duckdns.org
          headers="$(curl -fsSIL --max-time 35 "$base/")"
          printf '%s\n' "$headers" | grep -Eiq '^x-robots-tag:.*noindex'
          robots="$(curl -fsSL --max-time 35 "$base/robots.txt")"
          [[ "$robots" == *'Disallow: /'* ]]
          home="$(curl -fsSL --max-time 35 "$base/")"
          [[ "$home" == *'Escolhas mais claras.'* ]]
          js="$(curl -fsSL --max-time 35 "$base/static/storefront/catalog-explorer.js?v=ux-20261107")"
          [[ "$js" == *'data-compare-dock'* ]]
          echo 'LOWCOST_LIVE_HTTPS_AND_NOINDEX=PASS'
