name: Lowcost final WWW QA with category structure evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-www-preflight-20261107.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-www-cutover-20261107
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Exact one-file read-only source scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")" == '.github/workflows/lowcost-www-preflight-20261107.yml' ]]
          echo LOWCOST_FINAL_QA_SCOPE=PASS
      - name: Verify Dynadot authoritative A records and mail MX
        shell: bash
        run: |
          set -euo pipefail
          for host in lowcost-europa.eu www.lowcost-europa.eu; do
            a="$(dig +time=3 +tries=1 +short @ns1.dyna-ns.net "$host" A | sort -u | tr '\n' ' ')"
            echo "DNS_AUTH_HOST=$host A=$a"
            if [[ "$a" == '146.59.145.3 ' ]]; then echo DNS_TARGET=READY; else echo DNS_TARGET=PENDING_DYNADOT; fi
          done
          echo "DNS_MAIL_MX=$(dig +time=3 +tries=1 +short @ns1.dyna-ns.net lowcost-europa.eu MX | tr '\n' ' ')"
      - name: Read-only live VPS six-country and domain prelaunch QA
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          root=/srv/projects/lowcost-europa
          appuser=le001_1789265592
          target=bb3921b646102cba0af0f397bddfde8b2f37d39a
          [[ "$(git -c "safe.directory=$root" -C "$root" rev-parse HEAD)" == "$target" ]]
          [[ -z "$(git -c "safe.directory=$root" -C "$root" status --porcelain=v1 --untracked-files=no)" ]]
          echo LOWCOST_FINAL_GITHUB_VPS_SHA=PASS
          systemctl is-active --quiet lowcost-europa.service
          nginx -t >/dev/null 2>&1
          [[ -L /etc/nginx/sites-enabled/lowcost-europa-eu-acme.conf ]]
          [[ "$(readlink /etc/nginx/sites-enabled/lowcost-europa-eu-acme.conf)" == "$root/deploy/nginx/lowcost-europa.eu-acme.conf" ]]
          [[ ! -e /etc/letsencrypt/live/lowcost-europa.eu/fullchain.pem ]]
          echo LOWCOST_FINAL_NGINX_HTTP_ONLY_READY=PASS
          for rel in apps/storefront/ui_translations.py apps/storefront/templates/storefront/contacto.html apps/storefront/templates/storefront/privacidade.html; do
            runuser -u "$appuser" -- test -r "$root/$rel"
          done
          echo LOWCOST_FINAL_SOURCE_PERMISSIONS=PASS
          env="$root/private/systemd-env/lowcost-europa.env"
          grep -E '^DJANGO_ALLOWED_HOSTS=' "$env" | grep -qF 'www.lowcost-europa.eu'
          grep -E '^DJANGO_CSRF_TRUSTED_ORIGINS=' "$env" | grep -qF 'https://www.lowcost-europa.eu'
          grep -Eq '^DJANGO_GEO_LANGUAGE_ENABLED=true$' "$env"
          ! grep -Eq '^DJANGO_PUBLIC_INDEXING_ENABLED=true$' "$env"
          echo LOWCOST_FINAL_SAFE_ENV=PASS
          test -f "$root/private/deploy-rollbacks/www-domain-prestage-20261107-01/env.bak"
          echo LOWCOST_FINAL_PRIVATE_ROLLBACK=READY
          appurl=http://127.0.0.1:8001
          home="$(curl -fsS --max-time 20 -H 'Host: lowcost-europa.duckdns.org' -H 'X-Forwarded-Proto: https' "$appurl/")"
          [[ "$home" == *'id="familias"'* && "$home" == *'<meta name="robots" content="noindex, nofollow">'* ]]
          cards="$(printf '%s' "$home" | grep -o 'class="product-card' | wc -l)"
          echo "LOWCOST_PUBLIC_PRODUCT_CARDS=$cards"
          [[ "$home" == *'<nav class="family-index'* ]] || { echo LOWCOST_FINAL_FAMILY_NAV=MISSING; exit 4; }
          family_nav="${home#*<nav class=\"family-index}"
          family_nav="${family_nav%%</nav>*}"
          family_count="$(printf '%s' "$family_nav" | grep -o 'href="[^"]*"' | wc -l)"
          echo "LOWCOST_PUBLIC_FAMILY_NAV_COUNT=$family_count"
          family_links="$(printf '%s' "$family_nav" | grep -o 'href="[^"]*"' | head -n 30 | tr '\n' ' ')"
          echo "LOWCOST_PUBLIC_FAMILY_LINKS=$family_links"
          [[ "$family_count" -ge 5 ]] || { echo LOWCOST_FINAL_CATEGORY_MINIMUM=FAIL; exit 4; }
          if [[ "$family_count" -eq 5 ]]; then
            echo LOWCOST_FINAL_FIVE_CATEGORIES=PASS
          else
            echo "LOWCOST_FINAL_FIVE_CATEGORIES=REVIEW_REQUIRED_COUNT_$family_count"
          fi
          for page in contacto privacidade; do
            html="$(curl -fsS --max-time 20 -H 'Host: lowcost-europa.duckdns.org' -H 'X-Forwarded-Proto: https' "$appurl/$page/")"
            [[ "$html" == *'mailto:geral@lowcost-europa.eu'* ]]
            [[ "$html" != *'help.onlinefuture@gmail.com'* ]]
          done
          echo LOWCOST_FINAL_PUBLIC_CONTACT=PASS
          panel="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 -H 'Host: www.lowcost-europa.eu' -H 'X-Forwarded-Proto: https' "$appurl/painel/")"
          [[ "$panel" == 302 ]]
          echo LOWCOST_FINAL_OWNER_PANEL_PRIVACY=PASS
          www="$(curl -fsSI --max-time 10 -H 'Host: www.lowcost-europa.eu' http://127.0.0.1/)"
          [[ "$www" == *'302'* && "$www" == *'https://lowcost-europa.duckdns.org'* ]]
          echo LOWCOST_FINAL_WWW_HTTP_FALLBACK=PASS
          samples="$(runuser -u "$appuser" -- "$root/.venv/bin/python" - "$root/.geoip/dbip-country-lite.mmdb" <<'PY'
          import ipaddress,sys,maxminddb
          wanted={"PT":"pt-pt","ES":"es","FR":"fr","DE":"de","GB":"en","NL":"en"}
          found={}
          with maxminddb.open_database(sys.argv[1]) as db:
            for network,record in db:
              if network.version!=4 or not isinstance(record,dict): continue
              cc=(record.get("country") or {}).get("iso_code")
              if cc not in wanted or cc in found: continue
              ip=network.network_address if network.prefixlen==32 else network.network_address+1
              if ipaddress.ip_address(ip).is_global: found[cc]=str(ip)
              if len(found)==len(wanted): break
          if len(found)!=len(wanted): raise SystemExit("Not all countries present")
          for cc,lang in wanted.items(): print(cc+"|"+found[cc]+"|"+lang)
          PY
          )"
          count=0
          while IFS='|' read -r cc ip lang; do
            [[ "$cc" =~ ^(PT|ES|FR|DE|GB|NL)$ && "$ip" =~ ^[0-9.]+$ ]]
            html="$(curl -fsS --max-time 16 -H 'Host: lowcost-europa.duckdns.org' -H 'X-Forwarded-Proto: https' -H "X-Real-IP: $ip" -H 'Accept-Language: ja-JP' "$appurl/")"
            [[ "$html" == *"<html lang=\"$lang\">"* ]] || { echo "LOWCOST_FINAL_COUNTRY_$cc=FAIL"; exit 4; }
            echo "LOWCOST_FINAL_COUNTRY_$cc=PASS"
            count=$((count+1))
          done <<< "$samples"
          [[ "$count" -eq 6 ]]
          echo LOWCOST_FINAL_SIX_COUNTRIES=PASS
          echo LOWCOST_FINAL_VPS_TECHNICAL_QA=PASS
          REMOTE
      - name: Public DuckDNS HTTPS and noindex final readback
        shell: bash
        run: |
          set -euo pipefail
          base=https://lowcost-europa.duckdns.org
          hdr="$(curl -fsSI --max-time 30 "$base/")"
          printf '%s\n' "$hdr" | grep -Eiq '^x-robots-tag:.*noindex'
          body="$(curl -fsSL --max-time 30 "$base/contacto/")"
          [[ "$body" == *'mailto:geral@lowcost-europa.eu'* ]]
          echo LOWCOST_FINAL_PUBLIC_HTTPS_NOINDEX=PASS
