name: Lowcost manual category 2 affiliate link identification preflight 20261109
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-cat2-manual-link-preflight-20261109.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-cat2-manual-link-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read-only identify owner affiliate link and target category 2
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          EXPECTED=19090664e63ab00ffca86947c5109f0a906bc4a7
          test -s "$ENVFILE" && test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$EXPECTED"
          systemctl is-active --quiet lowcost-europa.service
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PY'
          from urllib import request
          from django.utils.translation import override
          import django
          django.setup()
          from apps.catalog.models import ProductFamily,Offer,OfferFamilyPlacement
          from apps.catalog.services.public_eligibility import public_eligibility_q
          from apps.catalog.services.manual_candidate_intake import resolve_aliexpress_product_url, ManualCandidateIntakeError
          from apps.integrations.aliexpress.client import AliExpressClient
          from apps.integrations.aliexpress.config import AliExpressConfig
          URL='https://s.click.aliexpress.com/e/_c3QmGcwL'
          families=list(ProductFamily.objects.exclude(status='RETIRED').order_by('display_order','name','pk'))
          for family in families:
              print('PREFLIGHT_CATEGORY display_order='+str(family.display_order)+' slug='+family.slug+' title='+family.name)
          target=ProductFamily.objects.get(display_order=2,status__in=['NEW','TESTING','VERIFIED','PROVEN','WINNER','OBSERVATION'])
          assert target.slug=='hydrodermoabrasao-aqua-facial-multifuncoes', 'Incorrect category 2'
          old=list(OfferFamilyPlacement.objects.filter(product_family=target).values_list('offer_id',flat=True))
          visible=list(OfferFamilyPlacement.objects.filter(product_family=target).filter(public_eligibility_q(prefix='offer__')).values_list('offer_id',flat=True))
          print('PREFLIGHT_CAT2_TOTAL_PLACEMENTS='+str(len(old)))
          print('PREFLIGHT_CAT2_PUBLIC_VISIBLE_COUNT='+str(len(visible)))
          print('PREFLIGHT_CAT2_OLD_PUBLIC_OFFER_IDS='+','.join(map(str,sorted(visible))))
          print('PREFLIGHT_AFFILIATE_URL_TYPE=OWNER_SUPPLIED_SHORT_HTTPS_ALIEXPRESS')
          try:
              product_id,canonical=resolve_aliexpress_product_url(URL)
          except Exception as exc:
              print('PREFLIGHT_LINK_RESOLUTION=ERROR_'+type(exc).__name__)
              raise
          print('PREFLIGHT_LINK_RESOLUTION=PASS product_id='+product_id)
          offer=Offer.objects.filter(source='ALIEXPRESS',external_product_id=product_id).first()
          if offer:
              current=list(OfferFamilyPlacement.objects.filter(offer=offer).values_list('product_family__display_order',flat=True))
              print('PREFLIGHT_EXISTING_OFFER_ID='+str(offer.pk))
              print('PREFLIGHT_EXISTING_IN_CATEGORY_ORDERS='+','.join(map(str,current)))
          else:
              print('PREFLIGHT_EXISTING_OFFER_ID=NONE')
          try:
              client=AliExpressClient(config=AliExpressConfig.from_env())
              detail=client.get_product_detail(product_id,'PT','EUR')
              assert detail.product_id==product_id
              print('PREFLIGHT_OFFICIAL_PRODUCT_DETAIL=PASS')
              print('PREFLIGHT_PRODUCT_TITLE='+(detail.title or '')[:155].replace('\n',' '))
              print('PREFLIGHT_PRODUCT_PRICE_EUR='+
                  (str(detail.price) if detail.price is not None and detail.currency=='EUR' else 'UNAVAILABLE'))
              print('PREFLIGHT_PRODUCT_IMAGE_PRESENT='+str(bool(detail.image_url)).upper())
              print('PREFLIGHT_PRODUCT_URL_PRESENT='+str(bool(detail.product_url)).upper())
              print('PREFLIGHT_PRODUCT_AVAILABILITY='+(detail.availability_raw or 'UNKNOWN')[:48])
          except Exception as exc:
              print('PREFLIGHT_OFFICIAL_PRODUCT_DETAIL=ERROR_'+type(exc).__name__)
          print('PREFLIGHT_DATA_WRITES=ZERO')
          PY
          echo PREFLIGHT_APP_UNCHANGED=PASS
          REMOTE
