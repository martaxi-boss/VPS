name: Lowcost IndexNow actual service result diagnostic 20261112
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-indexnow-current-state-diagnostic-20261112.yml'
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Pinned SSH IndexNow read-only current status and private accepted metadata
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = 4c6e75e566dcf317624285fe4f92d5cbdd6ec2dc
          nginx -t >/dev/null 2>&1
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-indexnow.timer
          for property in Result ExecMainStatus ActiveState SubState InactiveEnterTimestamp; do
            echo "INDEXNOW_SERVICE_$property=$(systemctl show lowcost-europa-indexnow.service --property=$property --value)"
          done
          for property in ActiveState SubState Unit NextElapseUSecRealtime LastTriggerUSec; do
            echo "INDEXNOW_TIMER_$property=$(systemctl show lowcost-europa-indexnow.timer --property=$property --value)"
          done
          echo INDEXNOW_JOURNAL_SANITIZED_BEGIN
          journalctl -u lowcost-europa-indexnow.service --since '2026-11-12 15:00:00 UTC' --no-pager -o cat \
            | grep -E '^(INDEXNOW_|lowcost-europa-indexnow.service:|Failed to start|Failed with result|Job .* failed|Main process exited|Starting|Finished)' \
            | tail -n 30 || true
          echo INDEXNOW_JOURNAL_SANITIZED_END
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/srv/projects/lowcost-europa/.indexnow/accepted.json')
          if p.is_file() and not p.is_symlink():
              obj=json.loads(p.read_text())
              assert isinstance(obj,dict)
              print('INDEXNOW_SAVED_ACCEPTED_URL_COUNT='+str(len(obj)))
              print('INDEXNOW_SAVED_STATE_BYTES='+str(p.stat().st_size))
          else:
              print('INDEXNOW_SAVED_STATE=UNAVAILABLE')
          PY
          echo INDEXNOW_CURRENT_STATE_DIAG_DONE=PASS
          REMOTE
