name: Lowcost local Git object compact - project-only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-git-compact-once-20261108.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-git-compact-20261108
  cancel-in-progress: false
jobs:
  compact:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify single workflow commit and pinned server
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git diff --name-only HEAD^ HEAD)" == '.github/workflows/lowcost-git-compact-once-20261108.yml' ]]
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
      - name: GC only Lowcost Git objects as repository owner, never other projects
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SSHPASS" ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          [[ "$(git -c "safe.directory=$ROOT" -C "$ROOT" rev-parse HEAD)" == f157e3b98786db21d6f541917ec7b545e9913485 ]]
          [[ -z "$(git -c "safe.directory=$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          systemctl is-active --quiet lowcost-europa.service
          owner="$(stat -c %U "$ROOT/.git")"
          [[ "$owner" != root ]]
          getent passwd "$owner" >/dev/null
          printf 'LOWCOST_GIT_COMPACT_OWNER='; echo "$owner"
          printf 'LOWCOST_GIT_COMPACT_BEFORE_KIB='
          du -sk "$ROOT/.git" | awk '{print $1}'
          if runuser -u "$owner" -- git -c "safe.directory=$ROOT" -C "$ROOT" gc --prune=2.weeks.ago >/dev/null 2>&1; then
            echo LOWCOST_GIT_COMPACT_GC=PASS
          else
            echo LOWCOST_GIT_COMPACT_GC=SKIPPED_PERMISSION_OR_LOCK
          fi
          printf 'LOWCOST_GIT_COMPACT_AFTER_KIB='
          du -sk "$ROOT/.git" | awk '{print $1}'
          [[ "$(git -c "safe.directory=$ROOT" -C "$ROOT" rev-parse HEAD)" == f157e3b98786db21d6f541917ec7b545e9913485 ]]
          [[ -z "$(git -c "safe.directory=$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          systemctl is-active --quiet lowcost-europa.service
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 https://www.lowcost-europa.eu/)" == 200 ]]
          echo LOWCOST_GIT_COMPACT_SITE=PASS
          echo LOWCOST_GIT_COMPACT_SAFETY=PASS
          REMOTE
