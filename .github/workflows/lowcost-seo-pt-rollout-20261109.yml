name: Lowcost SEO PT - guarded one-time production rollout 20261109
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-seo-pt-rollout-20261109.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-ptes-production-rollout
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Pinned SSH deploy with strict four-file gate and rollback
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          OLD=08324e61ef28f01507dabba993472b35ff013465
          NEW=0f47a0a6d22343979352adaecaae25228d0ce3e7
          REPO=https://github.com/martaxi-boss/lowcost-europa.git
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          TASK="$ROOT/private/ops/seo-pt-publish-20261109"
          gitrepo() { git -c safe.directory="$ROOT" -C "$ROOT" "$@"; }
          test -d "$ROOT/.git" && test -s "$ENVFILE" && test ! -L "$ENVFILE"
          test -d "$ROOT/private/ops"
          exec 9>"$ROOT/private/ops/ptes-deploy.lock"
          flock -n 9
          CURRENT="$(gitrepo rev-parse HEAD)"
          case "$CURRENT" in "$OLD"|"$NEW") ;; *) echo "PREFLIGHT_SHA_UNEXPECTED"; exit 12 ;; esac
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          test "$(gitrepo ls-remote "$REPO" refs/heads/main | awk '{print $1}')" = "$NEW"
          test "$(df -Pk "$ROOT" | awk 'END{print $4}')" -gt 500000
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          for unit in lowcost-europa.service lowcost-europa-catalog-maintenance.timer lowcost-europa-indexnow.timer lowcost-europa-backup.timer lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer lowcost-europa-affiliate-report.timer; do
            systemctl is-active --quiet "$unit" || { echo "INACTIVE_UNIT=$unit"; exit 13; }
          done
          nginx -t >/dev/null 2>&1
          SECRET_BEFORE="$(sha256sum "$ENVFILE" | cut -d' ' -f1)"
          gitrepo fetch --no-tags -q "$REPO" main
          test "$(gitrepo rev-parse FETCH_HEAD)" = "$NEW"
          gitrepo merge-base --is-ancestor "$OLD" "$NEW"
          EXPECTED="$(printf '%s\n' apps/storefront/seo_editorial.py apps/storefront/templates/storefront/product_family_detail.html apps/storefront/tests/test_seo_editorial_pt.py apps/storefront/views.py | LC_ALL=C sort)"
          ACTUAL="$(gitrepo diff --name-only "$OLD" "$NEW" | LC_ALL=C sort)"
          test "$ACTUAL" = "$EXPECTED" || { echo "FOUR_FILE_SCOPE_MISMATCH"; exit 12; }
          test -z "$(gitrepo diff --name-only "$OLD" "$NEW" -- config deploy requirements apps/catalog apps/core apps/integrations)"
          echo "SOURCE_SCOPE_FOUR_FILES=PASS"
          PROMOTED=0
          rollback() {
            rc=$?
            trap - EXIT
            if test "$rc" -ne 0 && test "$PROMOTED" = 1; then
              umask 022
              if gitrepo checkout --detach -q "$OLD"; then
                chmod 644 "$ROOT/apps/storefront/views.py" "$ROOT/apps/storefront/templates/storefront/product_family_detail.html"
                if systemctl restart lowcost-europa.service && systemctl is-active --quiet lowcost-europa.service; then
                  echo "SEO_PT_ROLLBACK=PASS"
                else
                  echo "SEO_PT_ROLLBACK=SERVICE_FAILED"
                fi
              else
                echo "SEO_PT_ROLLBACK=CHECKOUT_FAILED"
              fi
            fi
            exit "$rc"
          }
          trap rollback EXIT
          if test "$CURRENT" = "$OLD"; then
            test ! -e "$TASK"
            sh "$ROOT/deploy/scripts/backup-postgres.sh"
            BACKUP="$(find "$ROOT/backups/daily" -maxdepth 1 -type f -name '*.dump' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
            test -n "$BACKUP" && test -s "$BACKUP" && test -s "$BACKUP.sha256"
            (cd "$ROOT/backups/daily" && sha256sum -c "$(basename "$BACKUP.sha256")" >/dev/null)
            echo "SEO_PT_BACKUP_VERIFIED=PASS"
            mkdir -m 700 "$TASK"
            printf '%s\n' "$OLD" > "$TASK/previous-source-sha"
            PROMOTED=1
            umask 022
            gitrepo checkout --detach -q "$NEW"
            chmod 644 "$ROOT/apps/storefront/seo_editorial.py" "$ROOT/apps/storefront/views.py" "$ROOT/apps/storefront/templates/storefront/product_family_detail.html" "$ROOT/apps/storefront/tests/test_seo_editorial_pt.py"
            umask 077
            for rel in apps/storefront/seo_editorial.py apps/storefront/views.py apps/storefront/templates/storefront/product_family_detail.html apps/storefront/tests/test_seo_editorial_pt.py; do
              test -f "$ROOT/$rel" && test ! -L "$ROOT/$rel"
              runuser -u "$APPUSER" -- test -r "$ROOT/$rel"
            done
            echo "SEO_PT_FILES_READABLE=PASS"
          else
            echo "SEO_PT_TARGET_ALREADY_PRESENT=PASS"
          fi
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py check
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py check --deploy
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py makemigrations --check --dry-run
          if test "$PROMOTED" = 1; then
            systemctl reload lowcost-europa.service
          fi
          systemctl is-active --quiet lowcost-europa.service
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYAPP'
          import time
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          
          base = 'https://www.lowcost-europa.eu'
          families = {
              'cavitacao-rf-vacuum-corpo': 'Como comparar máquinas de cavitação e radiofrequência',
              'hydrodermoabrasao-aqua-facial-multifuncoes': 'O que verificar num equipamento Aqua Facial',
              'pressoterapia-vacuum-drenagem': 'Pressoterapia e RF Tecar: diferenças a confirmar',
              'hifu': 'Como avaliar uma máquina HIFU profissional',
              'diodo-laser-remocao-tatuagens-pigmentacao': 'Laser de díodo e remoção de pigmentos não são equivalentes',
          }
          class Metadata(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.canonical = []
                  self.alternates = {}
                  self.robot = []
                  self.title = []
                  self.description = []
                  self.in_title = False
              def handle_starttag(self, tag, attrs):
                  attr = dict(attrs)
                  if tag == 'link' and attr.get('rel') == 'canonical':
                      self.canonical.append(attr.get('href'))
                  if tag == 'link' and attr.get('rel') == 'alternate':
                      self.alternates[attr.get('hreflang')] = attr.get('href')
                  if tag == 'meta' and attr.get('name') == 'robots':
                      self.robot.append(attr.get('content', ''))
                  if tag == 'meta' and attr.get('name') == 'description':
                      self.description.append(attr.get('content', ''))
                  if tag == 'title':
                      self.in_title = True
              def handle_endtag(self, tag):
                  if tag == 'title':
                      self.in_title = False
              def handle_data(self, data):
                  if self.in_title:
                      self.title.append(data)
          def get(path):
              with urllib.request.urlopen(base + path, timeout=18) as r:
                  return r.status, r.headers, r.read().decode('utf-8')
          
          for attempt in range(18):
              try:
                  _,_,body=get('/pt/products/hifu/')
                  if families['hifu'] in body and 'Guia de compra para Portugal' in body:
                      break
              except (urllib.error.URLError, TimeoutError):
                  pass
              time.sleep(1)
          else:
              raise AssertionError('new SEO workers unavailable')
          
          for slug, heading in families.items():
              path='/pt/products/'+slug+'/'
              status,headers,body=get(path)
              assert status == 200, path
              assert heading in body, path
              assert 'Guia de compra para Portugal' in body, path
              parsed=Metadata()
              parsed.feed(body)
              assert parsed.canonical == [base+path], path
              assert set(parsed.alternates)=={'pt-PT','es-ES','x-default'}, path
              assert all('noindex' not in x for x in parsed.robot), path
              assert len(parsed.description)==1 and len(parsed.description[0])>=80,path
              assert len(''.join(parsed.title))>=15,path
              assert 'Preço, stock, entrega e condições finais' in body,path
          print('SEO_PT_FIVE_LIVE_GUIDES=PASS')
          status,_,es_body=get('/es/products/hifu/')
          assert status==200 and 'Guia de compra para Portugal' not in es_body
          assert 'Guia de compra para Portugal' not in get('/es/')[2]
          print('SEO_ES_LANGUAGE_ISOLATION=PASS')
          status,_,xml=get('/sitemap.xml')
          assert status==200
          locs=[x.text for x in ET.fromstring(xml).iter('{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          assert len(locs)==len(set(locs))==23
          assert all(base+'/pt/products/'+slug+'/' in locs for slug in families)
          assert get('/robots.txt')[0]==200 and get('/')[0]==200
          print('SEO_SITEMAP_23_AND_HOME=PASS')
          class StopRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  return None
          opener=urllib.request.build_opener(StopRedirect)
          for path in ('/painel/','/admin/'):
              try:
                  response=opener.open(base+path,timeout=18)
              except urllib.error.HTTPError as ex:
                  assert ex.code == 302,path
                  assert 'noindex' in ex.headers.get('X-Robots-Tag',''),path
                  assert 'private' in ex.headers.get('Cache-Control',''),path
                  ex.close()
              else:
                  response.close()
                  raise AssertionError('private route exposed')
          print('SEO_OWNER_ROUTES_PROTECTED=PASS')
          PYAPP
          test "$(sha256sum "$ENVFILE" | cut -d' ' -f1)" = "$SECRET_BEFORE"
          test "$(gitrepo rev-parse HEAD)" = "$NEW"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          nginx -t >/dev/null 2>&1
          for unit in lowcost-europa.service lowcost-europa-catalog-maintenance.timer lowcost-europa-indexnow.timer lowcost-europa-backup.timer lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer lowcost-europa-affiliate-report.timer; do systemctl is-active --quiet "$unit"; done
          echo "SEO_SECRETS_UNCHANGED=PASS"
          echo "SEO_SITE_AND_SEVEN_TIMERS=PASS"
          echo "LOWCOST_DEPLOYED_SHA=$NEW"
          echo "LOWCOST_SEO_PT_PRODUCTION_DEPLOY=PASS"
          trap - EXIT
          REMOTE
