name: Lowcost Europa five-language verified staging one-shot 20261107
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-five-language-rollout-20261107.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: lowcost-five-language-rollout-20261107
  cancel-in-progress: false
jobs:
  rollout:
    if: github.repository == 'martaxi-boss/VPS' && github.actor == 'martaxi-boss'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Retrieve previously audited successful rollback-safe procedure
        uses: actions/download-artifact@v4
        with:
          name: lowcost-one-shot-procedure-42394698529
          run-id: 42394698529
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/lowcost-audited
      - name: Verify pinned SSH host identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/lowcost-known-hosts"
          chmod 600 "$RUNNER_TEMP/lowcost-known-hosts"
          observed="$(ssh-keygen -lf "$RUNNER_TEMP/lowcost-known-hosts" -E sha256 | awk '{print $2}')"
          test "$observed" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          echo 'LOWCOST_PINNED_VPS=PASS'
      - name: Verify hashes, pin tested revisions and install with automatic rollback
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          script="$RUNNER_TEMP/lowcost-audited/lowcost-rollout-once.sh"
          test -s "$script"
          printf '%s  %s\n' '3848bd8350de4ec3bd5ed4b3d1d4c4720dbb1ebeec9496bd89725313adc854d1' "$script" | sha256sum -c - >/dev/null
          printf '%s' '' | base64 -d | gzip -dc > "$RUNNER_TEMP/lowcost-i18n-patch.py"
          printf '%s  %s\n' '51f84cc30096e7de18b39d3a5474c69e30640f803db269a5b1ea3ff8bcb0ff52' "$RUNNER_TEMP/lowcost-i18n-patch.py" | sha256sum -c - >/dev/null
          python3 "$RUNNER_TEMP/lowcost-i18n-patch.py" "$script"
          printf '%s  %s\n' '47d66c7a7093a4f3014a3b85d75aa77af1d2f7e08656fb79ebc02a594e979d94' "$script" | sha256sum -c - >/dev/null
          bash -n "$script"
          echo 'LOWCOST_PINNED_DEPLOY_SCRIPT=PASS'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/lowcost-known-hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' < "$script"
      - name: Verify HTTPS, original category layout and five-language changes
        shell: bash
        run: |
          set -euo pipefail
          base=https://lowcost-europa.duckdns.org
          headers="$(curl -fsSIL --max-time 35 "$base/")"
          printf '%s\n' "$headers" | grep -Eiq '^x-robots-tag:.*noindex'
          robots="$(curl -fsSL --max-time 35 "$base/robots.txt")"
          [[ "$robots" == *'Disallow: /'* ]]
          home="$(curl -fsSL --max-time 35 "$base/")"
          [[ "$home" == *'Escolhas mais claras.'* ]]
          [[ "$home" == *'family-index family-index--compact'* ]]
          [[ "$home" == *'/i18n/setlang/'* ]]
          [[ "$home" == *'i18n-20261107'* ]]
          css="$(curl -fsSL --max-time 35 "$base/static/storefront/storefront.css?v=i18n-20261107")"
          [[ "$css" == *'.locale-switch'* ]]
          spanish="$(curl -fsSL --max-time 35 -H 'Accept-Language: es-ES,es;q=0.9' "$base/")"
          [[ "$spanish" == *'Decisiones más claras.'* ]]
          [[ "$spanish" == *'<html lang="es">'* ]]
          echo 'LOWCOST_LIVE_HTTPS_FIVE_LANGUAGES_NOINDEX=PASS'
