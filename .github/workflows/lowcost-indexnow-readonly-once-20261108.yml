name: Lowcost IndexNow read-only stability certificate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-indexnow-readonly-once-20261108.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Compare accepted state with stable snapshots without submissions
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          TASK="$ROOT/private/indexing-check-20261108-1645"
          [[ ! -e "$TASK" ]]
          mkdir -m 700 "$TASK"
          trap 'rm -f -- "$TASK/check.py"; rmdir -- "$TASK"' EXIT
          cat > "$TASK/check.py" <<'PY'
          import collections,datetime,fcntl,hashlib,json,os,subprocess,sys
          from pathlib import Path
          root=Path('/srv/projects/lowcost-europa')
          sys.path.insert(0,str(root))
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          import django
          django.setup()
          from django.conf import settings
          from apps.storefront.management.commands.notify_indexnow import snapshot
          state=root/'.indexnow/accepted.json'
          with (root/'.indexnow/notify.lock').open('r') as lock:
              fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)
              before=state.read_bytes()
              accepted=json.loads(before)
              first=snapshot(settings.PUBLIC_SITE_URL)
              second=snapshot(settings.PUBLIC_SITE_URL)
              assert first==second,'Snapshot instability reproduced'
              assert state.read_bytes()==before,'Accepted state changed unexpectedly'
              changed=[u for u in second if second[u]!=accepted.get(u)]
              removed=sorted(set(accepted)-set(second))
              print('INDEXNOW_READ_ONLY='+json.dumps(dict(public=len(second),accepted=len(accepted),changed=len(changed),removed=len(removed),snapshots_stable=True,accepted_state_unchanged=True)))
              print('INDEXNOW_CHANGED_PUBLIC_URLS='+json.dumps(changed))
              print('INDEXNOW_ACCEPTED_STATE_MTIME_UTC='+datetime.datetime.fromtimestamp(state.stat().st_mtime,datetime.timezone.utc).isoformat())
          r=subprocess.run(['journalctl','-u','lowcost-europa-indexnow.service','--since','2026-11-08 13:00:00','--no-pager','-o','cat'],capture_output=True,text=True,check=True)
          import re
          safe=[x for x in r.stdout.splitlines() if re.fullmatch(r'INDEXNOW_(?:RECEIVED http=(?:200|202) urls=\d+ key_verification=(?:pending|accepted) index_inclusion=unconfirmed|UNCHANGED public=\d+ changed=\d+ removed=\d+)',x)]
          print('INDEXNOW_SANITIZED_RECENT_EVENTS='+json.dumps(safe[-8:]))
          PY
          chmod 644 "$TASK/check.py"
          systemd-run --quiet --wait --pipe --collect --unit=lowcost-indexnow-readonly-20261108-1645 --property=User=le001_1789265592 --property=WorkingDirectory="$ROOT" --property=EnvironmentFile="$ROOT/private/systemd-env/lowcost-europa.env" "$ROOT/.venv/bin/python" -B -c "$(< "$TASK/check.py")"
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-indexnow.timer
          nginx -t >/dev/null 2>&1
          echo "LOWCOST_READONLY_SHA=$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)"
          echo LOWCOST_READONLY_CERTIFICATE=PASS
          REMOTE
