name: REA P311 owner approval preview (no VPS)
run-name: "REA owner approval preview / ${{ github.sha }}"
on:
  push:
    branches:
      - rea/p311-autonomia-escopos-20261026
    paths:
      - "rea-linux/owner-review-requests/*.json"
permissions:
  contents: read
  actions: read
concurrency:
  group: rea-p311-owner-review-preview-${{ github.sha }}
  cancel-in-progress: false
jobs:
  check-preview-request:
    if: github.actor == 'martaxi-boss'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      request_file: ${{ steps.check.outputs.request_file }}
    steps:
      - name: Checkout exact GitHub commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate one public digest-only REA request
        id: check
        run: python3 ops/rea_p311_owner_gate_20261026.py --mode preflight
  wait-for-real-owner-button:
    name: REA — Confirmar ou recusar (demonstracao)
    needs: check-preview-request
    if: github.actor == 'martaxi-boss'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: rea-p311-owner-consent
    steps:
      - name: Checkout exact GitHub commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate authenticated GitHub reviewer and workflow-run SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REA_REQUEST_FILE: ${{ needs.check-preview-request.outputs.request_file }}
        run: python3 ops/rea_p311_owner_gate_20261026.py --mode verify-review --request "$REA_REQUEST_FILE"
      - name: Validate GitHub-signed OIDC token for this approved job (preview)
        id: oidc
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REA_REQUEST_FILE: ${{ needs.check-preview-request.outputs.request_file }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/rea-p311-oidc-only"
          "$RUNNER_TEMP/rea-p311-oidc-only/bin/python" -m pip install --quiet --disable-pip-version-check cryptography==46.0.3
          "$RUNNER_TEMP/rea-p311-oidc-only/bin/python" -m ops.rea_p311_github_oidc_20261026 --request "$REA_REQUEST_FILE"
          if test -f "$RUNNER_TEMP/rea-p311-oidc-encrypted.json"; then
            echo "sealed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload ONLY encrypted owner OIDC preview, using pinned public key
        if: steps.oidc.outputs.sealed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-p311-oidc-encrypted-preview
          path: ${{ runner.temp }}/rea-p311-oidc-encrypted.json
          if-no-files-found: error
          retention-days: 1
      - name: Preview confirmation only - no REA or VPS execution
        run: |
          echo "REA_P311_OWNER_BUTTON_PREVIEW_ONLY=PASS"
          echo "REA_P311_OWNER_PERMISSION_REGISTERED=false"
          echo "REA_P311_VPS_CHANGED=false"
