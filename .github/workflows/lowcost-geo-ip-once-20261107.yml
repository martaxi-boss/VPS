name: Lowcost Europa - GeoIP read-only Python module diagnosis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-geo-ip-once-20261107.yml'
permissions: {}
concurrency:
  group: lowcost-geo-ip-staging-once
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Require one exact workflow-only change
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          [[ "$changed" == '.github/workflows/lowcost-geo-ip-once-20261107.yml' ]]
          echo GEOIP_DIAGNOSTIC_SCOPE=PASS
      - name: Verify existing pinned VPS identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/lowcost-geo-known-hosts"
          chmod 600 "$RUNNER_TEMP/lowcost-geo-known-hosts"
          observed="$(ssh-keygen -lf "$RUNNER_TEMP/lowcost-geo-known-hosts" -E sha256 | awk '{print $2}')"
          [[ "$observed" == "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc" ]]
          ssh-keygen -F 146.59.145.3 -f "$RUNNER_TEMP/lowcost-geo-known-hosts" >/dev/null
          echo GEOIP_DIAGNOSTIC_HOST_PIN=PASS
      - name: Inspect imported Python module in place, no project writes
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/lowcost-geo-known-hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          APP_USER=le001_1789265592
          [[ -d "$ROOT" && ! -L "$ROOT" ]] || exit 3
          echo "GEOIP_LIVE_SHA=$(git -c "safe.directory=$ROOT" -C "$ROOT" rev-parse HEAD)"
          echo "GEOIP_VENV_REALPATH=$(readlink -f "$ROOT/.venv")"
          echo 'GEOIP_NORMAL_IMPORT_START'
          cd "$ROOT"
          runuser -u "$APP_USER" -- "$ROOT/.venv/bin/python" - <<'PY'
          import importlib.metadata,importlib.util,maxminddb,sys
          print("sys_executable",sys.executable)
          print("module_path",getattr(maxminddb,"__file__",None))
          print("module_namespace",list(getattr(maxminddb,"__path__",[])))
          print("module_spec",maxminddb.__spec__)
          print("open_database",hasattr(maxminddb,"open_database"))
          print("module_attributes",[x for x in dir(maxminddb) if not x.startswith("_")][:30])
          print("dist_version",importlib.metadata.version("maxminddb"))
          print("sys_path_head",sys.path[:4])
          PY
          echo 'GEOIP_ISOLATED_IMPORT_START'
          runuser -u "$APP_USER" -- "$ROOT/.venv/bin/python" -I - <<'PY'
          import importlib.metadata,maxminddb,sys
          print("module_path",getattr(maxminddb,"__file__",None))
          print("module_namespace",list(getattr(maxminddb,"__path__",[])))
          print("open_database",hasattr(maxminddb,"open_database"))
          print("dist_version",importlib.metadata.version("maxminddb"))
          print("sys_path_head",sys.path[:4])
          PY
          echo 'GEOIP_PACKAGE_FILES'
          "$ROOT/.venv/bin/python" -m pip show -f maxminddb | head -n 35
          echo 'GEOIP_DIAG_COMPLETE=PASS'
          REMOTE
