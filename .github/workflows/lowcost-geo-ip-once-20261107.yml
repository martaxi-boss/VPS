      - name: Verify pinned authorized VPS SSH identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/lowcost-geo-known-hosts"
          chmod 600 "$RUNNER_TEMP/lowcost-geo-known-hosts"
          observed="$(ssh-keygen -lf "$RUNNER_TEMP/lowcost-geo-known-hosts" -E sha256 | awk '{print $2}')"
          test "$observed" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          ssh-keygen -F 146.59.145.3 -f "$RUNNER_TEMP/lowcost-geo-known-hosts" >/dev/null
          echo LOWCOST_GEO_HOST_PIN=PASS
      - name: Apply guarded app-only staging change with automatic rollback
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || exit 2
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/lowcost-geo-known-hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' \
            < "$RUNNER_TEMP/lowcost-geo-rollout.sh"
      - name: Verify public HTTPS and noindex without assuming runner country
        shell: bash
        run: |
          set -euo pipefail
          base='https://lowcost-europa.duckdns.org'
          headers="$(curl -fsSI --max-time 35 "$base/")"
          printf '%s\n' "$headers" | grep -Eiq '^x-robots-tag:.*noindex'
          home="$(curl -fsSL --max-time 35 -H 'Accept-Language: de-DE' "$base/")"
          [[ "$home" == *'IP Geolocation by DB-IP'* ]]
          [[ "$home" == *'id="familias"'* ]]
          [[ "$home" == *'<html lang="'* ]]
          [[ "$home" != *'class="locale-switch"'* ]]
          echo LOWCOST_GEO_PUBLIC_HTTPS_NOINDEX=PASS
