name: Lowcost Europa - IP-country end-to-end read-only six-country QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-geo-ip-once-20261107.yml'
permissions: {}
concurrency:
  group: lowcost-geo-ip-staging-once
  cancel-in-progress: false
jobs:
  country-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify one exact workflow-only change
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")" == '.github/workflows/lowcost-geo-ip-once-20261107.yml' ]]
          echo LOWCOST_GEO_QA_SCOPE=PASS
      - name: Verify existing pinned VPS identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/lowcost-geo-known-hosts"
          chmod 600 "$RUNNER_TEMP/lowcost-geo-known-hosts"
          observed="$(ssh-keygen -lf "$RUNNER_TEMP/lowcost-geo-known-hosts" -E sha256 | awk '{print $2}')"
          [[ "$observed" == "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc" ]]
          echo LOWCOST_GEO_QA_HOST_PIN=PASS
      - name: Verify database-country-IP mapping and served HTML in six regions
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/lowcost-geo-known-hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          APP_USER=le001_1789265592
          TARGET=fefd5df92753382bb7ad191ee19e38b90d8167a3
          DBFILE="$ROOT/.geoip/dbip-country-lite.mmdb"
          [[ -f "$DBFILE" && ! -L "$DBFILE" ]] || exit 2
          [[ "$(git -c "safe.directory=$ROOT" -C "$ROOT" rev-parse HEAD)" == "$TARGET" ]] || exit 2
          systemctl is-active --quiet lowcost-europa.service || exit 2
          samples="$(runuser -u "$APP_USER" -- "$ROOT/.venv/bin/python" - "$DBFILE" <<'PY'
          import ipaddress,sys,maxminddb
          wanted={"PT":"pt-pt","ES":"es","FR":"fr","DE":"de","GB":"en","NL":"en"}
          picked={}
          with maxminddb.open_database(sys.argv[1]) as reader:
              for network,record in reader:
                  if network.version!=4 or not isinstance(record,dict): continue
                  country=(record.get("country") or {}).get("iso_code")
                  if country not in wanted or country in picked: continue
                  candidate=network.network_address if network.prefixlen==32 else network.network_address+1
                  if ipaddress.ip_address(candidate).is_global: picked[country]=str(candidate)
                  if len(picked)==len(wanted): break
          if len(picked)!=len(wanted): raise SystemExit(f"Missing country samples: {set(wanted)-set(picked)}")
          for cc,lang in wanted.items(): print(cc+"|"+picked[cc]+"|"+lang)
          PY
          )"
          count=0
          while IFS='|' read -r cc ip lang; do
            [[ "$cc" =~ ^(PT|ES|FR|DE|GB|NL)$ ]] || exit 3
            [[ "$ip" =~ ^[0-9.]+$ ]] || exit 3
            page="$(curl -fsS --max-time 20 -H 'Host: lowcost-europa.duckdns.org' -H 'X-Forwarded-Proto: https' -H "X-Real-IP: $ip" -H 'Accept-Language: ja-JP' -H 'Cookie: lowcost_language=de' http://127.0.0.1:8001/)"
            [[ "$page" == *"<html lang=\"$lang\">"* ]] || { echo "LOWCOST_GEO_COUNTRY_$cc=FAIL"; exit 4; }
            [[ "$page" == *'id="familias"'* ]] || exit 4
            echo "LOWCOST_GEO_COUNTRY_$cc=PASS"
            count=$((count+1))
          done <<< "$samples"
          [[ "$count" -eq 6 ]] || exit 4
          echo LOWCOST_GEO_SIX_COUNTRIES=PASS
          REMOTE
      - name: Confirm external DuckDNS still HTTPS and noindex
        shell: bash
        run: |
          set -euo pipefail
          base=https://lowcost-europa.duckdns.org
          headers="$(curl -fsSI --max-time 35 "$base/")"
          printf '%s\n' "$headers" | grep -Eiq '^x-robots-tag:.*noindex'
          body="$(curl -fsSL --max-time 35 "$base/")"
          [[ "$body" == *'IP Geolocation by DB-IP'* ]]
          [[ "$body" == *'id="familias"'* ]]
          echo LOWCOST_GEO_EXTERNAL_NOINDEX=PASS
