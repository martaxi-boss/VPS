name: Sevelora - verificacao apos publicacao
on:
  push:
    branches: [main]
    paths: [.github/workflows/sevelora-final-readonly-20261119.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify pinned SSH host and inspect only Sevelora
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 ubuntu@146.59.145.3 'sudo -n python3 -' <<'PY'
          import os, pathlib, json, subprocess, urllib.request, socket, re, collections
          root=pathlib.Path('/srv/projects/Sexshop')
          print('AUDIT_UTC='+subprocess.check_output(['date','-u','+%FT%TZ'],text=True).strip())
          print('CURRENT_RELEASE='+os.readlink(root/'current'))
          assert os.readlink(root/'current') == 'releases/1213f5a12ef2862de373f1dd79eed35474d93556/app'
          previous=(root/'infra/previous-release.txt').read_text().strip()
          print('ROLLBACK_RELEASE='+previous)
          print('ROLLBACK_SERVER_EXISTS='+str((root/previous/'apps/ecommerce-shop-demo/server.js').is_file()))
          print('RELEASE_COUNT='+str(len([p for p in (root/'releases').iterdir() if p.is_dir()])))
          for service in ['sexshop.service','sexshop-catalog-sync.timer','nginx']:
              p=subprocess.run(['systemctl','is-active',service],capture_output=True,text=True)
              print(service+'='+p.stdout.strip())
          cat=json.loads((root/'data/catalog.json').read_text())
          print('CATALOG_PRODUCTS='+str(len(cat['products'])))
          print('CATALOG_UPDATED_AT='+str(cat.get('updatedAt')))
          print('CATALOG_MERCHANT='+str(cat.get('merchantId')))
          secret=root/'.private/diversual-feed-url'
          print('FEED_SECRET_PRESENT='+str(secret.is_file()))
          print('FEED_SECRET_MODE='+oct(secret.stat().st_mode & 0o777))
          for host in ['sevelora.eu','www.sevelora.eu']:
              print('DNS_'+host+'='+json.dumps(sorted(set((x[0].name,x[4][0]) for x in socket.getaddrinfo(host,443)))))
          for path in ['/','/robots.txt','/sitemap.xml','/catalogo']:
              req=urllib.request.Request('https://sevelora.eu'+path,headers={'User-Agent':'Sevelora-Authorized-ReadOnly-Audit/1.0'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  body=response.read()
                  print('LIVE_FETCH='+json.dumps({'path':path,'status':response.status,'mime':response.headers.get('Content-Type'),'bytes':len(body)}))
          config=(root/'infra/sevelora.eu.conf').read_text()
          log_paths=re.findall(r'^\s*(?:access_log|error_log)\s+([^;\s]+)',config,re.M)
          print('DEDICATED_LOG_PATHS='+json.dumps(log_paths))
          access=pathlib.Path('/var/log/nginx/access.log')
          if access.is_file():
              counts=collections.Counter()
              for line in access.read_text(errors='replace').splitlines()[-50000:]:
                  match=re.search(r'"(?:GET|HEAD) /(sitemap\.xml|robots\.txt)(?:\?[^ ]*)? HTTP/[^"]+" (\d{3}) ',line)
                  if match and re.search(r'Googlebot|Google-InspectionTool',line,re.I):
                      counts[(match[1],match[2])]+=1
              print('SHARED_NGINX_GOOGLE_REQUEST_COUNTS_NOT_HOST_ATTRIBUTABLE='+json.dumps({str(k):v for k,v in counts.items()}))
          errors=pathlib.Path('/var/log/nginx/error.log')
          if errors.is_file():
              lines=errors.read_text(errors='replace').splitlines()[-10000:]
              relevant=[x for x in lines if 'server: sevelora.eu' in x]
              print('SEVELORA_RECENT_NGINX_ERROR_COUNT='+str(len(relevant)))
              print('SEVELORA_ERROR_CLASSES='+json.dumps(dict(collections.Counter('upstream timeout' if 'upstream timed out' in x else 'connection refused' if 'Connection refused' in x else 'other' for x in relevant))))
          import html
          found=set()
          path='/catalogo'
          visited=set()
          while path:
              assert path not in visited
              visited.add(path)
              with urllib.request.urlopen('https://sevelora.eu'+path,timeout=30) as response:
                  assert response.status==200
                  body=response.read().decode()
              canonical=re.search(r'<link rel="canonical" href="([^"]+)"',body)
              assert canonical and html.unescape(canonical[1])=='https://sevelora.eu'+path
              ids=set(re.findall(r'href="/produto/(\d+)"',body))
              assert ids and not (ids & found) and len(ids)<=24
              found.update(ids)
              more=re.search(r'<a\b[^>]*href="([^"]+)"[^>]*>Mostrar mais produtos',body)
              path=html.unescape(more[1]) if more else None
              assert len(visited)<=10
          assert found==set(p['id'] for p in cat['products'])
          print('LIVE_HTML_PAGINATION_PRODUCTS='+str(len(found)))
          print('LIVE_HTML_PAGINATION_PAGES='+str(len(visited)))
          print('LIVE_HTML_PAGINATION_ALL_CATALOG_PRODUCTS=PASS')
          print('ACTIVE_COMMIT_MATCHES_MAIN=PASS')
          print('AUDIT_MODE=READ_ONLY_NO_VPS_WRITES')
          PY
