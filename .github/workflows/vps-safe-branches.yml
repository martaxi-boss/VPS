name: VPS Repository Safe Ref Hygiene (Owner only)

on:
  pull_request:
    paths:
      - '.github/workflows/vps-safe-branches.yml'
      - 'ops/vps_branch_housekeeping.py'
      - 'ops/tests/test_vps_branch_housekeeping.py'
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: vps-owner-git-ref-hygiene
  cancel-in-progress: false

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate conservative PR and ancestry filters without network writes
        run: |
          python3 -m py_compile ops/vps_branch_housekeeping.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s ops/tests -p test_vps_branch_housekeeping.py -v

  owner-ref-hygiene:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.title, '[vps hygiene]')
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    permissions:
      contents: write
      pull-requests: read
      issues: write
    steps:
      - name: Checkout trusted main, with exact-lease Git remote credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Enforce exact, case-sensitive Owner request before any Git writes
        shell: bash
        env:
          REQUEST_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          if [ "$REQUEST_TITLE" = '[vps hygiene] audit safe caches' ]; then
            echo 'HYG_MODE=audit' >> "$GITHUB_ENV"
          elif [ "$REQUEST_TITLE" = '[vps hygiene] clean verified caches' ]; then
            echo 'HYG_MODE=clean' >> "$GITHUB_ENV"
          else
            echo 'OWNER_ISSUE_TITLE_NOT_EXACT'
            exit 2
          fi

      - name: Fetch complete remote ref graph in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*' >/dev/null 2>&1
          test "$(git rev-parse refs/remotes/origin/main)" = "$(git rev-parse HEAD)"
          echo "VPS_MAIN_REFS_PINNED=PASS"

      - name: Audit or prune only old, fully merged, unreferenced refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: 0
        run: |
          set -euo pipefail
          test "$HYG_MODE" = audit || test "$HYG_MODE" = clean
          python3 ops/vps_branch_housekeeping.py "$HYG_MODE" \
            > "$RUNNER_TEMP/vps_branch_hygiene_result.json" 2>/dev/null
          test -s "$RUNNER_TEMP/vps_branch_hygiene_result.json"
          echo 'REF_HYGIENE_RUN=COMPLETED'

      - name: Publish bounded branch reference summary to the Owner's issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          path = root / 'vps_branch_hygiene_result.json'
          output = {'status': 'BRANCH_SWEEP_UNVERIFIED'}
          statuses = ('AUDIT_ONLY', 'BRANCH_SWEEP_FINISHED', 'BRANCH_HYGIENE_FAILED')
          allowed = ('remote_branches_checked', 'fully_merged_candidates',
                     'preserved_or_ineligible', 'deleted_merged_refs',
                     'preserved_changed', 'preserved_open_pr', 'preserved_refused')
          if path.is_file() and not path.is_symlink() and path.stat().st_size < 2000:
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
                  if isinstance(data, dict) and data.get('status') in statuses:
                      output = {'status': data['status']}
                      if data.get('mode') in ('audit', 'clean'):
                          output['mode'] = data['mode']
                      for key in allowed:
                          value = data.get(key)
                          if type(value) is int and 0 <= value <= 10000:
                              output[key] = value
              except (OSError, ValueError, AttributeError, TypeError):
                  pass
          (root / 'vps_branch_status.txt').write_text(output['status'], encoding='ascii')
          (root / 'vps_branch_comment.md').write_text(
              '## VPS GitHub repository: old refs hygiene\n\n'
              + '~~~json\n' + json.dumps(output, indent=2, sort_keys=True)
              + '\n~~~\n\n'
              + 'No active/open-PR, unmerged, recent, protected, trust/control/recovery, '
                'workflow-referenced or changed branch was eligible for deletion. '
                'Only GitHub refs proven fully merged into the exact pinned VPS/main '
                'could be removed with exact-SHA lease. No history rewrite, no '
                'Project Leader source change and no VPS disk effect.\n\n'
              + 'Evidence: ' + os.environ['RUN_URL'] + '\n', encoding='utf-8')
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/vps_branch_comment.md"
          case "$(cat "$RUNNER_TEMP/vps_branch_status.txt")" in
            AUDIT_ONLY|BRANCH_SWEEP_FINISHED) echo 'BRANCH_REFS_HYGIENE=PASS' ;;
            *) echo 'BRANCH_REFS_HYGIENE_FAIL_CLOSED'; exit 3 ;;
          esac
