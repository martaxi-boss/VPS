name: Final mission Lowcost external closeout - protected read-only evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-final-mission-preflight-20261109.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-evidence-20261109
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Gather live PT ES indexing and commercial proof counts without secrets
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          EXPECTED=253a946fb8f8dc91e9cfcc11739c6976b614b1ea
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          echo "LOWCOST_PREFLIGHT_SHA=$EXPECTED"
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          for unit in lowcost-europa.service lowcost-europa-indexnow.timer lowcost-europa-catalog-maintenance.timer lowcost-europa-backup.timer lowcost-europa-affiliate-report.timer lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer; do
           systemctl is-active --quiet "$unit"
           echo "$unit=active"
          done
          nginx -t >/dev/null 2>&1
          BACKUP="$(find "$ROOT/backups/daily" -maxdepth 1 -type f -name '*.dump' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$BACKUP" && test -s "$BACKUP.sha256"
          (cd "$ROOT/backups/daily" && sha256sum -c "$(basename "$BACKUP.sha256")" >/dev/null)
          echo LOWCOST_EXISTING_BACKUP_CHECKSUM=PASS
          cd "$ROOT"
          set -a
          . "$ROOT/private/systemd-env/lowcost-europa.env"
          set +a
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYAPP'
          import os,io,json,hashlib
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings.production')
          import django
          django.setup()
          from django.conf import settings
          from django.core.management import call_command
          from django.contrib.auth import get_user_model
          from django.test import RequestFactory
          from apps.catalog.owner_panel_views import dashboard
          from apps.catalog.models import Offer,OfferObservation,ExternalMetricsSnapshot
          from apps.catalog.services.public_eligibility import public_eligibility_q
          from apps.catalog.services.windsor_search_console_reporting import collect_search_console_report,SearchConsoleReportError,EXPECTED_PROPERTY
          print('PUBLIC_INDEXING='+str(settings.PUBLIC_INDEXING_ENABLED))
          print('LOCALE_SEO='+str(settings.LOCALE_SEO_ENABLED))
          print('WINDSOR_KEY_CONFIGURED='+str(bool(os.environ.get('WINDSOR_API_KEY'))))
          print('GSC_PROPERTY_CONFIGURED='+str(os.environ.get('GOOGLE_SEARCH_CONSOLE_PROPERTY')==EXPECTED_PROPERTY))
          try:
           report,_,_=collect_search_console_report()
           print('GSC_EXISTING_SERVER_INTEGRATION=VERIFIED_DATA')
           print('GSC_VERIFIED_METRICS='+json.dumps({k:report[k] for k in ['property','clicks','impressions','ctr_percent','average_position']}))
          except SearchConsoleReportError as exc:
           print('GSC_EXISTING_SERVER_INTEGRATION='+type(exc).__name__+':'+str(exc))
          print('GSC_SNAPSHOT_COUNT='+str(ExternalMetricsSnapshot.objects.filter(source='GOOGLE_SEARCH_CONSOLE').count()))
          print('ELIGIBLE_TECHNICAL='+str(Offer.objects.filter(public_eligibility_q(require_recent_price=False)).count()))
          print('ES_PERSISTED_OBSERVATIONS='+str(OfferObservation.objects.filter(destination_country='ES').count()))
          owner=get_user_model().objects.filter(is_staff=True,is_active=True).first()
          assert owner is not None
          request=RequestFactory().get('/painel/',secure=True,HTTP_HOST='www.lowcost-europa.eu')
          request.user=owner
          response=dashboard(request)
          assert response.status_code==200 and b'Google' in response.content
          assert 'noindex' in response['X-Robots-Tag'] and 'private' in response['Cache-Control']
          print('PRIVATE_PANEL_IN_PROCESS_STAFF_RENDER=PASS')
          from pathlib import Path
          accepted=Path('.indexnow/accepted.json')
          before=hashlib.sha256(accepted.read_bytes()).hexdigest()
          state=json.loads(accepted.read_text())
          print('INDEXNOW_ACCEPTED_STATE_TYPE='+type(state).__name__)
          print('INDEXNOW_ACCEPTED_STATE_KEYS='+','.join(sorted(state.keys())))
          out=io.StringIO()
          call_command('notify_indexnow',dry_run=True,stdout=out)
          print(out.getvalue().strip())
          assert before==hashlib.sha256(accepted.read_bytes()).hexdigest()
          print('INDEXNOW_ACCEPTED_UNCHANGED=PASS')
          print('NO_PROVIDER_PRODUCT_CALLS=PASS')
          PYAPP
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$EXPECTED"
          echo LOWCOST_FINAL_PREFLIGHT=PASS
          REMOTE
