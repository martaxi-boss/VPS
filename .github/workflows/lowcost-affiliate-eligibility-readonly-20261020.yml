name: Lowcost affiliate promotion eligibility live read-only audit 20261020

on:
  push:
    branches: ['ops/lowcost-night-readonly-20261020']
    paths: ['.github/workflows/lowcost-affiliate-eligibility-readonly-20261020.yml']

permissions:
  contents: read

jobs:
  observe:
    if: github.repository == 'martaxi-boss/VPS'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify exact Owner-pinned VPS SSH identity
        shell: bash
        run: |
          set -euo pipefail
          known="$RUNNER_TEMP/lowcost-promotions-known"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$known"
          chmod 600 "$known"
          observed="$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')"
          test "$observed" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          ssh-keygen -F 146.59.145.3 -f "$known" >/dev/null
          echo 'LOWCOST_SSH_HOST_PIN=VERIFIED'
      - name: Read promotion states from live PostgreSQL without modifying offers
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}" || { echo 'VPS_SSH_PASSWORD_UNAVAILABLE'; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/lowcost-promotions-known" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            ubuntu@146.59.145.3 'sudo -n python3 -' <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import stat
          import subprocess
          import sys
          from pathlib import Path
          
          ENV = Path("/etc/lowcost-europa/lowcost-europa.env")
          def extract(key):
              st=ENV.lstat()
              if not stat.S_ISREG(st.st_mode) or st.st_uid != 0 or st.st_mode & 0o077 or st.st_size>65536:
                  raise RuntimeError("Protected env missing or unsafe")
              for line in ENV.read_text(encoding="utf-8").splitlines():
                  if line.lstrip().startswith("#") or "=" not in line:
                      continue
                  k,_,v=line.partition("=")
                  if k.strip()==key:
                      v=v.strip()
                      if len(v)>1 and v[0] in ("'", '"') and v[-1]==v[0]:
                          v=v[1:-1]
                      return v
              return ""
          
          sql = """
          WITH base AS (
           SELECT o.id, o.title, COALESCE(f.slug,'sem-familia') family, o.affiliate_promotion_status promotion_status,
           o.is_active, o.owner_hidden, o.affiliate_promotion_verified_at,
           (COALESCE(o.affiliate_url,'') <> '') has_link,
           (o.is_active AND NOT o.owner_hidden AND COALESCE(o.affiliate_url,'') <> ''
           AND o.affiliate_promotion_status = 'ELIGIBLE' AND o.affiliate_promotion_verified_at IS NOT NULL
           AND o.protocol_verified_at IS NOT NULL AND o.protocol_verified_at <= now()) core_gate
           FROM catalog_offer o
           LEFT JOIN catalog_productfamily f ON f.id=o.product_family_id
          )
          SELECT row_to_json(t)::text FROM (
           SELECT
            (SELECT count(*) FROM base) total_offers,
            (SELECT count(*) FROM base WHERE promotion_status='ELIGIBLE') eligible_offers,
            (SELECT count(*) FROM base WHERE promotion_status='INELIGIBLE') ineligible_offers,
            (SELECT count(*) FROM base WHERE promotion_status='UNKNOWN') unknown_offers,
            (SELECT count(*) FROM base WHERE core_gate) core_gate_offers,
            (SELECT count(*) FROM base WHERE promotion_status='INELIGIBLE'
              AND affiliate_promotion_verified_at >= '2026-10-19 22:00:00+00'::timestamptz) ineligible_verified_since_night,
            (SELECT count(*) FROM base WHERE promotion_status='ELIGIBLE'
              AND affiliate_promotion_verified_at >= '2026-10-19 22:00:00+00'::timestamptz) eligible_verified_since_night,
            (SELECT coalesce(json_agg(row_to_json(q)),'[]'::json) FROM (
              SELECT family,promotion_status,count(*) AS offers FROM base GROUP BY 1,2 ORDER BY 1,2
            ) q) by_family,
            (SELECT coalesce(json_agg(row_to_json(q)),'[]'::json) FROM (
              SELECT id,
                left(regexp_replace(coalesce(title,''),'https?://[^[:space:]]+','[link]','gi'),84) title,
                family,is_active,owner_hidden,has_link,core_gate,
                to_char(affiliate_promotion_verified_at AT TIME ZONE 'UTC','YYYY-MM-DD"T"HH24:MI:SS"Z"') last_status_verified_utc
              FROM base WHERE promotion_status='INELIGIBLE' ORDER BY id LIMIT 30
            ) q) ineligible_details,
            (SELECT coalesce(json_agg(row_to_json(q)),'[]'::json) FROM (
              SELECT id,family,is_active,owner_hidden,has_link,core_gate
              FROM base WHERE promotion_status='UNKNOWN' ORDER BY id LIMIT 15
            ) q) unknown_details
          ) t;
          """
          try:
              db=extract("POSTGRES_DB")
              if not re.fullmatch(r"[a-zA-Z0-9_]{1,90}",db):
                  raise RuntimeError("Unsafe DB identifier")
              tracking=extract("ALIEXPRESS_TRACKING_ID").lower()
              tracking_class=("LOWCOST_LABELED" if "lowcost" in tracking or "low_cost" in tracking else
                              "DEFAULT_LABELED" if "default" in tracking else "OTHER_OR_UNSET")
              proc=subprocess.run(
                  ["runuser","-u","postgres","--","psql","-X","-q","-A","-t","-v","ON_ERROR_STOP=1","-d",db,
                   "-c","BEGIN READ ONLY; "+sql+" COMMIT;"],
                  capture_output=True,text=True,timeout=22,check=False)
              if proc.returncode:
                  error=proc.stderr.lower()
                  reason=next((label for k,label in (
                      ("peer authentication failed","PEER_AUTH"),
                      ("password authentication failed","PASSWORD_AUTH"),
                      ("role","ROLE"),
                      ("database","DATABASE"),
                      ("connection refused","CONNECTION_REFUSED"),
                      ("permission denied","PERMISSION_DENIED"),
                      ("syntax error","QUERY_SYNTAX"),
                      ("relation","TABLE_NOT_FOUND"),
                      ("runuser","RUNUSER"),
                  ) if k in error),"UNKNOWN_PSQL_FAILURE")
                  print("LOWCOST_PROMOTION_READONLY_RESULT="+json.dumps({
                      "probe":"LOWCOST_AFFILIATE_ELIGIBILITY_READONLY_20261020",
                      "read_only":True,"status":"PSQL_ERROR",
                      "category":reason,"exit":proc.returncode},sort_keys=True))
                  sys.exit(1)
              data=next((json.loads(l.strip()) for l in proc.stdout.splitlines() if l.strip().startswith("{")),None)
              if not isinstance(data,dict):
                  raise RuntimeError("No JSON data from database")
              report={"probe":"LOWCOST_AFFILIATE_ELIGIBILITY_READONLY_20261020",
                "read_only":True,
                "checked_at_utc":dt.datetime.now(dt.timezone.utc).isoformat(timespec="seconds"),
                "tracking_class":tracking_class,
                "database":data,
                "distinct_vs_checks":"Counts are distinct offers currently; previous 17 ineligible were repeated checks",
                "external_api_calls":0}
              print("LOWCOST_PROMOTION_READONLY_RESULT="+json.dumps(report,sort_keys=True,ensure_ascii=False))
          except Exception as exc:
              print("LOWCOST_PROMOTION_READONLY_RESULT="+json.dumps({
                 "probe":"LOWCOST_AFFILIATE_ELIGIBILITY_READONLY_20261020",
                 "read_only":True,"status":"ERROR","error_type":type(exc).__name__},sort_keys=True))
              sys.exit(1)
          PY
