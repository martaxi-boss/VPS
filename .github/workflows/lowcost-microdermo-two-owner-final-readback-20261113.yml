name: Lowcost microdermo two owner links live sixteen-product QA 20261113
on:
  push:
    paths: [.github/workflows/lowcost-microdermo-two-owner-final-readback-20261113.yml]
permissions: {contents: read}
concurrency:
  group: lowcost-prod-automation-controls
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: SSH verify all 16 original affiliate URLs in live public page
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -euo pipefail
          cd /srv/projects/lowcost-europa
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = '4c6e75e566dcf317624285fe4f92d5cbdd6ec2dc'
          test -z "$(git -c safe.directory="$PWD" status --porcelain=v1 --untracked-files=no)"
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-cavitation-availability.timer
          set -a
          . private/systemd-env/lowcost-europa.env
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u le001_1789265592 -- .venv/bin/python - <<'PY'
          import django
          django.setup()
          from urllib.request import Request,urlopen
          from django.test import Client
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement
          from apps.catalog.services.manual_storefront import MANUAL_ONLY_FAMILY_SLUGS
          from apps.catalog.services.public_eligibility import public_eligibility_q
          slug='hydrodermoabrasao-aqua-facial-multifuncoes'
          qs=OfferFamilyPlacement.objects.filter(product_family__slug=slug).select_related('offer')
          rows=list(qs)
          assert len(rows)==16
          assert all(p.offer.source==Offer.Source.ALIEXPRESS_OWNER for p in rows)
          assert qs.filter(public_eligibility_q(prefix='offer__')).count()==16
          clicks=OfferClick.objects.count()
          with urlopen(Request('https://www.lowcost-europa.eu/products/'+slug+'/',headers={'User-Agent':'LowcostEuropaOwnerQA/1.0'}),timeout=18) as resp:
              assert resp.status==200
              html=resp.read(1500000).decode('utf-8','replace')
          for p in rows:assert p.offer.affiliate_url in html
          assert html.count('data-affiliate-original-url=')>=16
          c=Client()
          for p in rows:
              resp=c.head('/go/'+str(p.offer_id)+'/',secure=True,HTTP_HOST='www.lowcost-europa.eu')
              assert resp.status_code==302 and resp['Location']==p.offer.affiliate_url
          assert OfferClick.objects.count()==clicks
          print('MICRODERMO_FINAL_16_ORIGINAL_AFFILIATE_URLS_IN_LIVE_HTML=PASS')
          print('MICRODERMO_FINAL_16_EXACT_HEAD_REDIRECTS=PASS')
          print('MICRODERMO_FINAL_16_PUBLIC_AND_MANUAL=PASS')
          print('MICRODERMO_FINAL_CLICKS_UNCHANGED_BY_AUDIT=PASS')
          print('MICRODERMO_FINAL_FIVE_FAMILY_PLACEMENTS='+str(OfferFamilyPlacement.objects.filter(product_family__slug__in=MANUAL_ONLY_FAMILY_SLUGS).count()))
          PY
          echo MICRODERMO_FINAL_GITHUB_VPS_LIVE_PUBLIC_PAGE=PASS
          REMOTE
