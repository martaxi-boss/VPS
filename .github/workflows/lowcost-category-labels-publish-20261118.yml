name: Lowcost category labels guarded rollout 20261118
on:
  push:
    paths:
      - .github/workflows/lowcost-category-labels-publish-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lowcost-category-labels-source-rollout
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify pinned VPS SSH host
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
      - name: Deploy verified category labels with backup and rollback
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 022
          export GIT_TERMINAL_PROMPT=0
          ROOT=/srv/projects/lowcost-europa
          TARGET=61d1197ad050902bee81c378fab34a4d82ffbd1c
          test -d "$ROOT/.git"
          g() { git -c safe.directory="$ROOT" -C "$ROOT" "$@"; }
          test -z "$(g status --porcelain=v1 --untracked-files=no)"
          systemctl is-active --quiet lowcost-europa.service
          nginx -t >/dev/null 2>&1
          case "$(g remote get-url origin)" in
            https://github.com/martaxi-boss/lowcost-europa|https://github.com/martaxi-boss/lowcost-europa.git|git@github.com:martaxi-boss/lowcost-europa.git) ;;
            *) echo 'LABELS_ORIGIN_UNEXPECTED'; exit 1 ;;
          esac
          exec 9< "$ROOT/.git/HEAD"
          flock -n 9
          OLD="$(g rev-parse HEAD)"
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          SOURCE=apps/storefront/ui_translations.py
          test -f "$ROOT/$SOURCE" && test ! -L "$ROOT/$SOURCE"
          test "$(g rev-parse HEAD:$SOURCE)" = 4c3a9235b220d3c27d0afe3f8463ee4f5bb3228f
          runuser -u "$APPUSER" -- test -r "$ROOT/$SOURCE"
          g fetch -q --no-tags origin main
          test "$(g rev-parse FETCH_HEAD)" = "$TARGET"
          g merge-base --is-ancestor "$OLD" "$TARGET"
          g diff --name-only "$OLD" "$TARGET" | python3 -c '
          import sys
          allowed = {
          "apps/storefront/ui_translations.py",
          "apps/storefront/tests/test_current_category_languages.py",
          ".github/workflows/production-mobile-lighthouse.yml",
          "PROJECT_STATE.md",
          "docs/operations/international-search-20261108.md",
          "docs/operations/seo-auditoria-fecho-20261115.md",
          "docs/operations/seo-pt-es-core-20261108.md",
          "docs/operations/seo-trafego-verificado-20261113.md",
          }
          actual=set(sys.stdin.read().splitlines())
          assert "apps/storefront/ui_translations.py" in actual
          assert actual <= allowed, "Unexpected source diff"
          print("LABELS_SOURCE_SCOPE=PASS")
          '
          BACKUP="$ROOT/.deploy-backups/spanish-labels-20261118-$(date -u +%H%M%S)"
          install -d -m 700 "$BACKUP"
          g archive "$OLD" "$SOURCE" | gzip > "$BACKUP/source-before.tar.gz"
          chmod 600 "$BACKUP/source-before.tar.gz"
          printf '%s\n' "$OLD" > "$BACKUP/source-before.sha"
          TIMER_BEFORE="$(systemctl is-active lowcost-europa-indexnow.timer lowcost-europa-affiliate-report.timer lowcost-europa-cavitation-availability.timer)"
          cat > "$BACKUP/check.py" <<'PYCHECK'
          import hashlib,json,re,subprocess,sys
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          from xml.etree import ElementTree as ET
          BASE="https://www.lowcost-europa.eu"
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__();self.canon=[];self.alts={};self.h1=[];self.in_h1=False;self.go=set();self.noindex=False
              def handle_starttag(self,t,a):
                  d=dict(a)
                  if t=="link" and d.get("rel")=="canonical":self.canon.append(d.get("href"))
                  if t=="link" and d.get("hreflang"):self.alts[d["hreflang"]]=d.get("href")
                  if t=="meta" and d.get("name")=="robots" and "noindex" in d.get("content",""):self.noindex=True
                  if t=="h1":self.in_h1=True
                  if t=="a" and urlsplit(d.get("href","")).path.startswith("/go/"):self.go.add(urlsplit(d["href"]).path)
              def handle_endtag(self,t):
                  if t=="h1":self.in_h1=False
              def handle_data(self,d):
                  if self.in_h1:self.h1.append(d)
          def get(path):
              return subprocess.check_output(["curl","-fsS","--retry","8","--retry-delay","1","--retry-connrefused","--max-time","20","--resolve","www.lowcost-europa.eu:443:127.0.0.1",BASE+path]).decode()
          urls=get("/sitemap.txt").split()
          xml=[n.text for n in ET.fromstring(get("/sitemap.xml")).iter() if n.tag.rsplit("}",1)[-1]=="loc"]
          assert len(urls)==len(set(urls))==23 and set(urls)==set(xml)
          robots=get("/robots.txt")
          assert BASE+"/sitemap.xml" in robots and BASE+"/sitemap.txt" in robots
          pages={}
          for u in urls:
              p=Page();p.feed(get(urlsplit(u).path));assert p.canon==[u] and not p.noindex
              pages[u]=p
          for u,p in pages.items():
              for target in p.alts.values():assert pages[target].alts==p.alts
          protected={u:{"heading":"".join(p.h1),"links":sorted(p.go)} for u,p in pages.items() if "/pt/" in u}
          links=sorted(set(x for p in protected.values() for x in p["links"]))
          snapshot={"pt":protected,"links":links}
          mode=sys.argv[1];path=Path(sys.argv[2])
          if mode=="before":
              path.write_text(json.dumps(snapshot,ensure_ascii=False))
          else:
              assert snapshot==json.loads(path.read_text()),"Portuguese headings or storefront links changed"
              expected={
                  "cavitacao-rf-vacuum-corpo":"Cavitación + RF + vacío",
                  "hydrodermoabrasao-aqua-facial-multifuncoes":"Microdermoabrasión / Hidrodermoabrasión / Multifunción facial",
                  "pressoterapia-vacuum-drenagem":"Presoterapia / RF Tecar",
                  "diodo-laser-remocao-tatuagens-pigmentacao":"Láser de diodo / Eliminación de tatuajes / Pigmentación",
              }
              for slug,label in expected.items():assert "".join(pages[BASE+"/es/products/"+slug+"/"].h1)==label
              assert "".join(pages[BASE+"/es/products/hifu/"].h1)=="HIFU / EMS"
          print("LABELS_"+mode.upper()+"_23_PAGES_CANONICAL_HREFLANG=PASS")
          print("LABELS_"+mode.upper()+"_STOREFRONT_LINKS="+str(len(links)))
          PYCHECK
          chmod 600 "$BACKUP/check.py"
          python3 "$BACKUP/check.py" before "$BACKUP/public-before.json"
          chmod 600 "$BACKUP/public-before.json"
          echo "LABELS_BACKUP=PASS"
          DEPLOYED=0
          rollback() {
            code=$?
            if [ "$code" -ne 0 ] && [ "$DEPLOYED" = 1 ]; then
              g checkout --detach "$OLD" >/dev/null || true
              chmod 644 "$ROOT/$SOURCE" || true
              systemctl reload lowcost-europa.service || systemctl restart lowcost-europa.service || true
              echo 'LABELS_ROLLBACK_ATTEMPTED=YES'
            fi
            exit "$code"
          }
          trap rollback EXIT
          DEPLOYED=1
          g checkout --detach "$TARGET" >/dev/null
          chmod 644 "$ROOT/$SOURCE" "$ROOT/apps/storefront/tests/test_current_category_languages.py"
          runuser -u "$APPUSER" -- test -r "$ROOT/$SOURCE"
          python3 -c 'import ast,pathlib;ast.parse(pathlib.Path("/srv/projects/lowcost-europa/apps/storefront/ui_translations.py").read_text())'
          systemctl reload lowcost-europa.service
          systemctl is-active --quiet lowcost-europa.service
          nginx -t >/dev/null 2>&1
          python3 "$BACKUP/check.py" after "$BACKUP/public-before.json"
          test "$TIMER_BEFORE" = "$(systemctl is-active lowcost-europa-indexnow.timer lowcost-europa-affiliate-report.timer lowcost-europa-cavitation-availability.timer)"
          test "$(g rev-parse HEAD)" = "$TARGET"
          test -z "$(g status --porcelain=v1 --untracked-files=no)"
          echo "LABELS_APP_SHA=$TARGET"
          echo "LABELS_GITHUB_VPS_ALIGNMENT=PASS"
          echo "LABELS_TIMERS_UNCHANGED=PASS"
          DEPLOYED=0
                    REMOTE
