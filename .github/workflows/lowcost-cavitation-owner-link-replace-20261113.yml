name: Lowcost owner-approved Cavitation affiliate URL replacement 20261113
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-cavitation-owner-link-replace-20261113.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-prod-automation-controls
  cancel-in-progress: false
jobs:
  replace:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Existing pinned SSH owner-approved one-off replacement with DB backup
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          cd "$ROOT"
          test "$(git -c safe.directory="$ROOT" rev-parse HEAD)" = '4c6e75e566dcf317624285fe4f92d5cbdd6ec2dc'
          test -z "$(git -c safe.directory="$ROOT" status --porcelain=v1 --untracked-files=no)"
          for unit in lowcost-europa.service lowcost-europa-cavitation-availability.timer lowcost-europa-indexnow.timer lowcost-europa-affiliate-report.timer; do
            systemctl is-active --quiet "$unit"
          done
          sh deploy/scripts/backup-postgres.sh
          BACKUP="$(find backups/daily -maxdepth 1 -type f -name 'lowcost-europa-*.dump' | sort | tail -n1)"
          test -s "$BACKUP" && test -s "$BACKUP.sha256"
          (cd backups/daily && sha256sum -c "$(basename "$BACKUP.sha256")" >/dev/null)
          echo CAVITATION_PRE_REPLACE_BACKUP_VERIFIED=PASS
          set -a
          . "$ROOT/private/systemd-env/lowcost-europa.env"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u le001_1789265592 -- "$ROOT/.venv/bin/python" - <<'PY'
          import django,hashlib
          django.setup()
          from django.db import transaction
          from django.test import Client
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement,OfferObservation,ProductFamily
          from apps.catalog.services.manual_candidate_intake import resolve_aliexpress_product_url
          from apps.catalog.services.public_eligibility import public_eligibility_q
          from apps.integrations.aliexpress.affiliate_url import is_https_affiliate_url
          from urllib.parse import urlsplit
          new_url='https://s.click.aliexpress.com/e/_c2yHtyBt'
          slug='cavitacao-rf-vacuum-corpo'
          assert is_https_affiliate_url(new_url)
          assert urlsplit(new_url).hostname=='s.click.aliexpress.com'
          product_id,_=resolve_aliexpress_product_url(new_url)
          family=ProductFamily.objects.get(slug=slug)
          before_placements={
              f:tuple(OfferFamilyPlacement.objects.filter(product_family__slug=f)
                .order_by('pk').values_list('pk','offer_id'))
              for f in ProductFamily.objects.values_list('slug',flat=True)
          }
          assert len(before_placements[slug])==20
          all_clicks=OfferClick.objects.count()
          old_link_hash=None
          with transaction.atomic():
              offer=Offer.objects.select_for_update().get(
                  source=Offer.Source.ALIEXPRESS_OWNER,external_product_id=product_id)
              assert OfferFamilyPlacement.objects.filter(product_family=family,offer=offer).count()==1
              assert OfferFamilyPlacement.objects.filter(offer=offer).count()==1, 'Product reused across categories'
              assert offer.is_active and not offer.owner_hidden, 'Owner item is hidden; no silent republish'
              assert Offer.objects.filter(affiliate_url=new_url).exclude(pk=offer.pk).count()==0
              old_url=offer.affiliate_url
              assert old_url.startswith('https://s.click.aliexpress.com/e/_')
              assert old_url!=new_url
              assert Offer.objects.filter(pk=offer.pk).filter(public_eligibility_q()).exists()
              old_link_hash=hashlib.sha256(old_url.encode('utf-8')).hexdigest()
              clicks_on_product=OfferClick.objects.filter(offer=offer).count()
              observations_on_product=OfferObservation.objects.filter(offer=offer).count()
              changed=Offer.objects.filter(pk=offer.pk,affiliate_url=old_url).update(affiliate_url=new_url)
              assert changed==1
              offer.refresh_from_db()
              assert offer.affiliate_url==new_url and offer.external_product_id==product_id
              assert OfferClick.objects.filter(offer=offer).count()==clicks_on_product
              assert OfferObservation.objects.filter(offer=offer).count()==observations_on_product
              assert Offer.objects.filter(pk=offer.pk).filter(public_eligibility_q()).exists()
              client=Client()
              resp=client.head('/go/'+str(offer.pk)+'/',secure=True,
                  HTTP_HOST='www.lowcost-europa.eu')
              assert resp.status_code==302 and resp['Location']==new_url
              page=client.get('/products/'+slug+'/',secure=True,
                  HTTP_HOST='www.lowcost-europa.eu')
              assert page.status_code==200
              assert new_url in page.content.decode('utf-8','replace')
              print('CAVITATION_UPDATED_OFFER_ID='+str(offer.pk))
              print('CAVITATION_OLD_AFFILIATE_SHA256='+old_link_hash)
              print('CAVITATION_NEW_AFFILIATE_SHA256='+hashlib.sha256(new_url.encode()).hexdigest())
              print('CAVITATION_HEAD_EXACT_REDIRECT_TO_OWNER_URL=PASS')
              print('CAVITATION_PAGE_INCLUDES_NEW_URL=PASS')
              print('CAVITATION_PRODUCT_CLICKS_AND_OBSERVATIONS_PRESERVED=PASS')
          assert OfferClick.objects.count()>=all_clicks
          for slug_old,pairs in before_placements.items():
              after=tuple(OfferFamilyPlacement.objects.filter(product_family__slug=slug_old)
                   .order_by('pk').values_list('pk','offer_id'))
              assert pairs==after,slug_old
          assert OfferFamilyPlacement.objects.filter(product_family=family).count()==20
          print('CAVITATION_20_ORIGINAL_PLACEMENTS_UNCHANGED=PASS')
          print('CAVITATION_OTHER_CATEGORIES_UNCHANGED=PASS')
          print('CAVITATION_HISTORICAL_CLICKS_PRESERVED=PASS')
          print('CAVITATION_OWNER_LINK_REPLACE=PASS')
          PY
          curl -fsS --max-time 20 'https://www.lowcost-europa.eu/products/cavitacao-rf-vacuum-corpo/' -o /dev/null
          systemctl is-active --quiet lowcost-europa.service
          echo CAVITATION_PRODUCTION_PAGE_HTTP_200=PASS
          test "$(git -c safe.directory="$ROOT" rev-parse HEAD)" = '4c6e75e566dcf317624285fe4f92d5cbdd6ec2dc'
          echo CAVITATION_GITHUB_VPS_CODE_ALIGNED=PASS
          REMOTE
