name: FADEGO marketing presentation staging

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/fadego-marketing-release.yml"
      - "ops/fadego_marketing_release.sh"

permissions:
  contents: read

concurrency:
  group: fadego-marketing-release
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'marketing/fadego-explainer-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact branding release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify narrow branded staging boundaries and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/fadego_marketing_release.sh
          grep -Fq 'FADEGO_MARKETING_APPLICATION=UPDATED_HOME_APPROVED_BRAND' ops/fadego_marketing_release.sh
          grep -Fq 'FADEGO_MARKETING_GMAIL_SEND=DISABLED' ops/fadego_marketing_release.sh
          grep -Fq 'FADEGO_MARKETING_RECOVERY=OLD_RELEASE_RESTORED' ops/fadego_marketing_release.sh
          grep -Fq 'FADEGO_BRAND_MAIL_GATES=DISABLED' ops/fadego_marketing_release.sh
          echo 'FADEGO_MARKETING_SHELL_AND_SAFE_GATES=VALIDATED'

  publish:
    needs: [validate]
    if: >-
      needs.validate.result == 'success' &&
      github.event.action == 'ready_for_review' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'marketing/fadego-explainer-20261017'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout reviewed immutable release automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact Owner PR and certified FADEGO candidate
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          bash -n ops/fadego_marketing_release.sh
          pr="$(curl -fsS --max-time 20 "https://api.github.com/repos/martaxi-boss/VPS/pulls/$PR_NUMBER")"
          jq -e --arg sha "$HEAD" \
            '.state == "open" and .draft == false and .head.sha == $sha and
             .head.ref == "marketing/fadego-explainer-20261017" and
             .head.repo.full_name == "martaxi-boss/VPS" and
             .base.ref == "main" and .user.login == "martaxi-boss"' <<<"$pr" >/dev/null
          app="$(curl -fsS --max-time 20 https://api.github.com/repos/martaxi-boss/fadego/pulls/15)"
          jq -e --arg sha "9243689cbb177ea814cf055ad18ea5d1967529e5" \
            '.state == "open" and .head.sha == $sha and .base.ref == "main"' <<<"$app" >/dev/null
          ci="$(curl -fsS --max-time 20 https://api.github.com/repos/martaxi-boss/fadego/actions/runs/39071246757)"
          jq -e --arg sha "9243689cbb177ea814cf055ad18ea5d1967529e5" \
            '.status == "completed" and .conclusion == "success" and .head_sha == $sha' <<<"$ci" >/dev/null
          echo 'FADEGO_MARKETING_EXACT_SHA_AND_CERTIFICATION=PASS'
      - name: Build and atomically install only FADEGO branding on pinned VPS
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}" || exit 2
          known="$RUNNER_TEMP/fadego-marketing-known"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$known"
          chmod 600 "$known"
          observed="$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')"
          test "$observed" = "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          timeout --signal=TERM --kill-after=15s 42m \
            sshpass -e ssh -T -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=5 \
            ubuntu@146.59.145.3 \
            'sudo -n env FADEGO_MARKETING_DEPLOY_APPROVED=1 bash -s' \
            < ops/fadego_marketing_release.sh
      - name: Verify real public demo new mark and private authentication from Internet
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/fadego-scissors-public-demo.html"
          headers="$RUNNER_TEMP/fadego-scissors-headers.txt"
          status="$(curl -sS --max-time 25 -D "$headers" -o "$page" -w '%{http_code}' https://fadego.duckdns.org/experimentar)"
          test "$status" = 200
          grep -qi '^content-security-policy:.*img-src data:' "$headers"
          grep -qi '^x-robots-tag: .*noindex' "$headers"
          grep -Fq 'Como funciona em três passos?' "$page"
          grep -Fq 'Menos confusão.' "$page"
          node - "$page" <<'NODE'
          const fs=require("node:fs"),crypto=require("node:crypto"),assert=require("node:assert/strict")
          const html=fs.readFileSync(process.argv[2],"utf8")
          const match=html.match(/src="data:image\/webp;base64,([A-Za-z0-9+/=]+)"/)
          assert.ok(match,"Approved scissors mark not embedded")
          const mark=Buffer.from(match[1],"base64")
          const digest=crypto.createHash("sha256").update(mark).digest("hex")
          assert.equal(digest,"8386058306f181827baa886e58262d2834044fa18a8e7bb2f488ce8b77f7c7c8")
          console.log("FADEGO_MARKETING_PUBLIC_BRAND=OWNER_APPROVED_SHA256")
          NODE
          for route in / /login /admin /api/auth/session; do
            status="$(curl -sS --max-time 18 -o /dev/null -w '%{http_code}' "https://fadego.duckdns.org$route")"
            test "$status" = 401
          done
          echo 'FADEGO_MARKETING_LIVE=PUBLIC_DEMO_AND_PRIVATE_APP_PROTECTED'
