name: Lowcost Brave and Seznam evidence documentation alignment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-search-results-align-once-20261108-1911.yml']
permissions:
  contents: read
jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Align verified documentation without restarting application
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          OLD=bd63578220b18c9297a018e742c96cd10a1bfc7a
          NEW=d2afac642eac9b0d371855b5a387fdbc35b9fd99
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" == "$OLD" ]]
          [[ -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          MASTER="$(systemctl show lowcost-europa.service -p MainPID --value)"
          git -c safe.directory="$ROOT" -C "$ROOT" fetch -q https://github.com/martaxi-boss/lowcost-europa.git main
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse FETCH_HEAD)" == "$NEW" ]]
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" diff --name-only "$OLD" "$NEW" | sort)" == "$(printf '%s\n' PROJECT_STATE.md docs/operations/international-search-20261108.md docs/operations/international-search-followup-20261108-1911.json | sort)" ]]
          trap 'result=$?; if [[ "$result" -ne 0 ]]; then git -c safe.directory="$ROOT" -C "$ROOT" checkout --detach -q "$OLD"; fi; exit "$result"' EXIT
          umask 022
          git -c safe.directory="$ROOT" -C "$ROOT" checkout --detach -q "$NEW"
          cmp -s /etc/systemd/system/lowcost-europa.service "$ROOT/deploy/systemd/lowcost-europa.service"
          [[ "$(systemctl show lowcost-europa.service -p MainPID --value)" == "$MASTER" ]]
          [[ ! -e "$ROOT/private/indexing-check-20261108-1645" ]]
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-indexnow.timer
          nginx -t >/dev/null 2>&1
          [[ -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          echo "LOWCOST_FINAL_SHA=$NEW"
          echo LOWCOST_DOCUMENTATION_ALIGNMENT=PASS
          trap - EXIT
          REMOTE
