name: Lowcost search metrics documentation alignment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-search-metrics-align-20261110.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-evidence-20261110
  cancel-in-progress: false
jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Align documentation only through existing SSH
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          TARGET=8386968266a2a6fa3b21fcb56250675adb059505
          cd "$ROOT"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$ROOT"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          PREVIOUS="$(git rev-parse HEAD)"
          systemctl is-active --quiet lowcost-europa.service
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "$TARGET"
          git merge-base --is-ancestor "$PREVIOUS" "$TARGET"
          CHANGES="$(git diff --name-only "$PREVIOUS" "$TARGET")"
          test -n "$CHANGES"
          while IFS= read -r p; do
            case "$p" in PROJECT_STATE.md|docs/*) ;; *) echo DOCUMENTATION_ONLY_GUARD=FAIL; exit 1;; esac
          done <<< "$CHANGES"
          INDEX_BEFORE="$(sha256sum .indexnow/accepted.json | cut -d ' ' -f1)"
          git merge --ff-only "$TARGET" >/dev/null
          test "$(git rev-parse HEAD)" = "$TARGET"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-indexnow.timer
          INDEX_AFTER="$(sha256sum .indexnow/accepted.json | cut -d ' ' -f1)"
          test "$INDEX_BEFORE" = "$INDEX_AFTER"
          echo "PREVIOUS_REVISION=$PREVIOUS"
          echo "ALIGNED_REVISION=$TARGET"
          echo DOCUMENTATION_ONLY_ALIGNMENT=PASS
          echo INDEXNOW_STATE_UNCHANGED=PASS
          echo NO_RELOAD_OR_SUBMISSION=PASS
          REMOTE
