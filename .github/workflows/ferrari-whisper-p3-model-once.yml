name: Ferrari faster-whisper P3 CPU model and real ASR one-shot
on:
  push:
    branches: [main]
    paths:
      - ferrari-release-requests/whisper-p3-proof-r2-20261106.json
permissions:
  contents: read
concurrency:
  group: ferrari-whisper-p3-real-proof
  cancel-in-progress: false
jobs:
  cpu-asr:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Read exactly one new authorized request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Gate pinned Ferrari and public fixture
        id: gate
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          added="$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER")"
          if [[ -z "$added" ]]; then
            echo execute=false >> "$GITHUB_OUTPUT"
            echo FERRARI_WHISPER_P3_GITHUB_HYGIENE=PASS
            exit 0
          fi
          test "$changed" = "$added"
          test "$changed" = ferrari-release-requests/whisper-p3-proof-r2-20261106.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected={
            "version":1,"task":"private-faster-whisper-cpu-asr-pyav19-r2",
            "root":"/srv/projects/skill-universal",
            "ferrari_sha":"4863c99cbd063d6dd17006c1c9dd67897316cc7e",
            "model_revision":"d90ca5fe260221311c53c58e660288d3deb8d356",
            "test_audio_git_blob":"e44b7c13897eae7f78beb220c61fe77429a3961d",
          }
          assert json.loads(Path("ferrari-release-requests/whisper-p3-proof-r2-20261106.json").read_text())==expected
          print("FERRARI_WHISPER_P3_REQUEST=PASS")
          PY
          echo execute=true >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Ferrari commit (no drifting main)
        if: steps.gate.outputs.execute == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 4863c99cbd063d6dd17006c1c9dd67897316cc7e
          path: ferrari
          persist-credentials: false
      - name: Validate exact source and network-free P3 tests
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile ferrari/install/vps-faster-whisper-tiny-model.py ferrari/install/vps-faster-whisper-cpu-smoke.py
          (cd ferrari && python3 -m unittest discover -s tests -p test_faster_whisper_private_cpu.py -v)
          echo FERRARI_WHISPER_P3_SOURCE=PASS
      - name: Pinned existing VPS SSH identity and runner-only sshpass
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/ferrari-whisper-host"
          chmod 600 "$RUNNER_TEMP/ferrari-whisper-host"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/ferrari-whisper-host" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass > /dev/null
          echo FERRARI_WHISPER_P3_EXISTING_SSH=PASS
      - name: Verify already installed private MIT model SHA256 without redeployment
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          ROOT=/srv/projects/skill-universal
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
              -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-whisper-host"
              -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
              -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6)
          before="$(sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 "readlink -e '$ROOT/current'")"
          test "$before" = "$ROOT/releases/a266b25e06a9c8acf1fdc940d22b99070cd17ded"
          echo FERRARI_WHISPER_P3_PREVIOUS_RELEASE_PRESERVED=PASS
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            "cd '$ROOT' && '$ROOT/runtimes/python3.12/bin/python3.12' - --check" \
            < ferrari/install/vps-faster-whisper-tiny-model.py
          after="$(sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 "readlink -e '$ROOT/current'")"
          test "$after" = "$before"
          echo FERRARI_WHISPER_P3_MODEL_PRIVATE_SHA256=PASS
          echo FERRARI_WHISPER_P3_ACTIVE_RELEASE_UNCHANGED=PASS
      - name: Real cgroup-bounded transcription, verify TXT SRT JSON in runner
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          ROOT=/srv/projects/skill-universal
          REMOTE="$ROOT/.runtime/.ferrari-whisper-p3-proof-20261106-r2.py"
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
              -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-whisper-host"
              -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
              -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6)
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            "test ! -e '$REMOTE' && test ! -L '$REMOTE'"
          sshpass -e scp -q "${opts[@]}" ferrari/install/vps-faster-whisper-cpu-smoke.py \
            "ubuntu@146.59.145.3:$REMOTE"
          set +e
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            "timeout 240 sudo -n systemd-run --scope -p MemoryMax=2G -p CPUQuota=150% -p TasksMax=128 -- /usr/sbin/runuser -u ubuntu -- '$ROOT/.runtime/venvs/extended/faster-whisper/bin/python' '$REMOTE'" \
            > "$RUNNER_TEMP/ferrari-whisper-p3-real.txt" 2>&1
          exit_code=$?
          set -e
          tail -n 90 "$RUNNER_TEMP/ferrari-whisper-p3-real.txt"
          test "$exit_code" -eq 0
          grep -q '^FERRARI_WHISPER_PRIVATE_MODEL_LOADED=PASS' "$RUNNER_TEMP/ferrari-whisper-p3-real.txt"
          grep -q '^FERRARI_WHISPER_REAL_ASR=PASS' "$RUNNER_TEMP/ferrari-whisper-p3-real.txt"
          mkdir -p "$RUNNER_TEMP/whisper-evidence"
          OUT="$ROOT/.runtime/faster-whisper-proof-20261106"
          for file in transcript.txt subtitles.srt report.json; do
            sshpass -e scp -q "${opts[@]}" \
              "ubuntu@146.59.145.3:$OUT/$file" "$RUNNER_TEMP/whisper-evidence/$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path(__import__('os').environ['RUNNER_TEMP'])/'whisper-evidence'
          report=json.loads((root/'report.json').read_text())
          text=(root/'transcript.txt').read_text()
          srt=(root/'subtitles.srt').read_text()
          assert report['status']=='completed' and report['device']=='cpu'
          assert report['compute_type']=='int8' and report['language']=='en'
          assert report['model_revision']=='d90ca5fe260221311c53c58e660288d3deb8d356'
          assert report['input_git_blob_sha1']=='e44b7c13897eae7f78beb220c61fe77429a3961d'
          assert len(text)>65 and all(x in text.lower() for x in ('ask','country','americans'))
          assert '-->' in srt and len(srt)>45
          for name,hash_expected in report['artifacts'].items():
              p=root/name
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==hash_expected
          print('FERRARI_WHISPER_P3_TXT_SRT_REPORT_VERIFIED=PASS')
          print('FERRARI_WHISPER_P3_ELAPSED_SECONDS='+str(report['time_seconds']))
          print('FERRARI_WHISPER_P3_SEGMENTS='+str(report['segments']))
          PY
          actual="$(sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 "readlink -e '$ROOT/current'")"
          test "$actual" = "$ROOT/releases/a266b25e06a9c8acf1fdc940d22b99070cd17ded"
          echo FERRARI_WHISPER_P3_END_TO_END=PASS
      - name: Remove only exact staged P3 Python transport script
        if: always() && steps.gate.outputs.execute == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          digest="$(sha256sum ferrari/install/vps-faster-whisper-cpu-smoke.py | awk '{print $1}')"
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-whisper-host" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 ubuntu@146.59.145.3 "python3 - '$digest'" <<'PY'
          import hashlib,os,sys
          from pathlib import Path
          f=Path('/srv/projects/skill-universal/.runtime/.ferrari-whisper-p3-proof-20261106-r2.py')
          if f.exists() and f.is_file() and not f.is_symlink() and f.stat().st_uid==os.getuid():
              if hashlib.sha256(f.read_bytes()).hexdigest()==sys.argv[1]:
                  f.unlink()
                  print('FERRARI_WHISPER_P3_STAGED_SCRIPT_REMOVED=PASS')
              else:
                  print('FERRARI_WHISPER_P3_STAGED_SCRIPT_PRESERVED_HASH_MISMATCH')
          else:
              print('FERRARI_WHISPER_P3_NO_STAGED_SCRIPT')
          PY
      - name: Save limited result artifacts and logs
        if: always() && steps.gate.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-whisper-p3-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/whisper-evidence/
            ${{ runner.temp }}/ferrari-whisper-p3-real.txt
          retention-days: 14
          if-no-files-found: warn
