name: Lowcost Europa Phase 7 Temporary Branch Cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lowcost-phase7-bundle-deploy.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete failed temporary Phase 7 branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HEAD_REF" = "ops/lowcost-phase7-bundle-deploy-001"
          python3 - <<'PY' > /tmp/delete-ref-url.txt
          import os
          from urllib.parse import quote
          repo=os.environ["GITHUB_REPOSITORY"]
          ref="heads/" + os.environ["HEAD_REF"]
          print(f"https://api.github.com/repos/{repo}/git/refs/{quote(ref, safe='')}")
          PY
          curl -fsS -X DELETE             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "$(cat /tmp/delete-ref-url.txt)"
          echo "TEMP_BRANCH_DELETED=PASS"
