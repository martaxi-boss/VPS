name: PINK Persistent Gateway 052
on:
  push:
    branches: [builder/pink-persistent-gateway-052]
    paths: ['ops/pink_vpn_052*', '.github/workflows/pink-persistent-gateway-052.yml', '.project-leader/transitions/PINK-IPTV-PERSISTENT-GATEWAY-052-*']
permissions:
  contents: read
concurrency:
  group: pink-persistent-gateway-052
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate bounded read-only source
        run: python -m py_compile ops/pink_vpn_052_audit.py
      - name: Native SSH structural gateway preflight
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 ubuntu@146.59.145.3 'sudo -n python3 -' \
            < ops/pink_vpn_052_audit.py
