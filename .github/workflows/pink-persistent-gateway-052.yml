# Retired historical Task 052: validation only.
# The maintained PINK IPTV deployment is owned by martaxi-boss/pink-iptv.
# Never SSH, install packages, touch WireGuard, or deploy old gateway code here.
name: PINK Historical Gateway 052 - Safe Source Validation
on:
  pull_request:
    paths:
      - 'ops/pink_vpn_052*.py'
      - '.github/workflows/pink-persistent-gateway-052.yml'
  push:
    branches: [main]
    paths:
      - 'ops/pink_vpn_052*.py'
      - '.github/workflows/pink-persistent-gateway-052.yml'
permissions:
  contents: read
concurrency:
  group: pink-historical-gateway-052-source-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile historical Python without executing any VPN mutation
        run: python -m py_compile ops/pink_vpn_052*.py
      - name: Verify original bounded peer and inverse safety tests
        run: python ops/pink_vpn_052_test.py
      - name: Enforce canonical project roots and refuse legacy deploy
        run: python ops/pink_vpn_052_path_guard_test.py
