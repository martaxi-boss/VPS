name: Lowcost microdermabrasion 9 owner links read only preflight 20261111
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-microdermo-nine-links-preflight-20261111.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-microdermo-nine-links-preflight
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Pinned SSH verify old placements, 9 URL identities and AliExpress details
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          test -d "$ROOT/.git" && test -s "$ENVFILE" && test ! -L "$ENVFILE"
          echo "MICRO_PREFLIGHT_CODE=$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)"
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          systemctl is-active --quiet lowcost-europa.service
          test "$(systemctl show lowcost-europa.service -p User --value)" = le001_1789265592
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u le001_1789265592 -- "$ROOT/.venv/bin/python" - <<'PY'
          import django
          from decimal import Decimal
          django.setup()
          from apps.catalog.models import ProductFamily,Offer,OfferFamilyPlacement,OfferClick
          from apps.catalog.services.public_eligibility import public_eligibility_q
          from apps.catalog.services.manual_candidate_intake import resolve_aliexpress_product_url
          from apps.integrations.aliexpress.client import AliExpressClient
          family=ProductFamily.objects.get(slug="hydrodermoabrasao-aqua-facial-multifuncoes")
          print("MICRO_FAMILY_NAME="+family.name)
          print("MICRO_FAMILY_STATUS="+family.status)
          places=OfferFamilyPlacement.objects.filter(product_family=family)
          print("MICRO_OLD_PLACEMENTS="+str(places.count()))
          print("MICRO_OLD_PUBLIC="+str(places.filter(offer__in=Offer.objects.filter(public_eligibility_q())).count()))
          print("MICRO_OLD_CLICKS="+str(OfferClick.objects.filter(offer__family_placements__product_family=family).distinct().count()))
          print("MICRO_OLD_SOURCE_STATS="+",".join(
              key+":"+str(places.filter(offer__source=key).count())
              for key in ("ALIEXPRESS","ALIEXPRESS_OWNER")
          ))
          links=(
              "https://s.click.aliexpress.com/e/_c4K1MNWr",
              "https://s.click.aliexpress.com/e/_c3rfP69D",
              "https://s.click.aliexpress.com/e/_c36pq3Xp",
              "https://s.click.aliexpress.com/e/_c3txZjGb",
              "https://s.click.aliexpress.com/e/_c2JMpzLt",
              "https://s.click.aliexpress.com/e/_c33ssvBv",
              "https://s.click.aliexpress.com/e/_c3cIMpHH",
              "https://s.click.aliexpress.com/e/_c3xMz5SB",
              "https://s.click.aliexpress.com/e/_c3CIKbYb",
          )
          assert len(links)==len(set(links))==9
          client=AliExpressClient()
          ids=[]
          verified=0
          for n,url in enumerate(links,1):
              try:
                  pid,canonical=resolve_aliexpress_product_url(url)
                  ids.append(pid)
                  assert canonical=="https://www.aliexpress.com/item/"+pid+".html"
                  print("MICRO_LINK_"+str(n)+"_ID="+pid)
                  matches=Offer.objects.filter(external_product_id=pid)
                  print("MICRO_LINK_"+str(n)+"_EXISTING="+str(matches.count()))
                  print("MICRO_LINK_"+str(n)+"_OWNER_MATCH="+str(matches.filter(
                      source=Offer.Source.ALIEXPRESS_OWNER,affiliate_url=url
                  ).count()))
                  print("MICRO_LINK_"+str(n)+"_IN_MICRO="+str(places.filter(
                      offer__external_product_id=pid).count()))
                  details=client.get_product_detail(pid,"PT","EUR")
                  assert str(details.product_id)==pid
                  assert details.title and details.title.strip()
                  assert details.price is not None and Decimal(str(details.price))>0
                  assert details.currency=="EUR"
                  print("MICRO_LINK_"+str(n)+"_TITLE="+str(details.title).replace("\n"," ")[:110])
                  print("MICRO_LINK_"+str(n)+"_PRICE="+str(details.price))
                  verified+=1
                  print("MICRO_LINK_"+str(n)+"_VALID=PASS")
              except Exception as e:
                  print("MICRO_LINK_"+str(n)+"_VALID=FAIL_"+type(e).__name__)
          print("MICRO_UNIQUE_IDS="+str(len(set(ids))))
          print("MICRO_VALID_COUNT="+str(verified))
          print("MICRO_NINE_PREFLIGHT_DONE=TRUE")
          PY
          echo MICRO_LINKS_PREFLIGHT_READONLY=PASS
          REMOTE
