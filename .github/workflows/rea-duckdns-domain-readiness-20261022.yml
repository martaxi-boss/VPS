name: REA DuckDNS domain readiness 20261022
on:
  push:
    branches: [trial/rea-chatgpt-20261022]
    paths:
      - ops/rea_duckdns_domain_readonly_20261022.py
      - .github/workflows/rea-duckdns-domain-readiness-20261022.yml
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Check read-only script
        run: |
          python3 -m py_compile ops/rea_duckdns_domain_readonly_20261022.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/rea_duckdns_domain_readonly_20261022.py').read_text()
          assert 'REA_DUCKDNS_DOMAIN_READONLY_V1' in s
          assert 'rea-reversa.duckdns.org' in s
          for bad in ('write_text(', 'unlink(', 'apt-get', 'systemctl restart','nginx -s'):
              assert bad not in s
          PY
      - name: Verify pinned VPS SSH identity
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/known"
          chmod 600 "$RUNNER_TEMP/known"
          observed="$(ssh-keygen -lf "$RUNNER_TEMP/known" -E sha256 | awk '{print $2}')"
          test "$observed" = "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc"
      - name: SSH helper installed only on temporary runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Inspect domain and vhost on VPS
        env: {SSHPASS: '${{ secrets.VPS_SSH_PASSWORD }}'}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 ubuntu@146.59.145.3 \
            'sudo -n python3 -' < ops/rea_duckdns_domain_readonly_20261022.py
