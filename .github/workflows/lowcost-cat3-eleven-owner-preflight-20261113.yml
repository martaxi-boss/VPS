name: Lowcost cat3 owner eleven AliExpress links preflight 20261113
on:
  push:
    branches: [main]
    paths: [.github/workflows/lowcost-cat3-eleven-owner-preflight-20261113.yml]
permissions: {contents: read}
concurrency:
  group: lowcost-prod-automation-controls
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Pinned SSH verify category three slots and distinct product IDs
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          cd "$ROOT"
          EXPECTED=4c6e75e566dcf317624285fe4f92d5cbdd6ec2dc
          test "$(git -c safe.directory="$ROOT" rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git -c safe.directory="$ROOT" status --porcelain=v1 --untracked-files=no)"
          test "$(git -c safe.directory="$ROOT" ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = "$EXPECTED"
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-cavitation-availability.timer
          set -a
          . "$ROOT/private/systemd-env/lowcost-europa.env"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u le001_1789265592 -- "$ROOT/.venv/bin/python" - <<'PY'
          import django
          django.setup()
          from apps.catalog.models import Offer,OfferFamilyPlacement,ProductFamily
          from apps.catalog.services.manual_candidate_intake import resolve_aliexpress_product_url,ManualCandidateIntakeError
          from apps.catalog.services.manual_storefront import MANUAL_ONLY_FAMILY_SLUGS
          from apps.catalog.services.public_eligibility import MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY,public_eligibility_q
          from apps.integrations.aliexpress.affiliate_url import is_https_affiliate_url
          from urllib.parse import urlsplit
          links=["https://s.click.aliexpress.com/e/_c2uCee7h","https://s.click.aliexpress.com/e/_c30ce58J","https://s.click.aliexpress.com/e/_c4ceqGqf","https://s.click.aliexpress.com/e/_c2zpVqNz","https://s.click.aliexpress.com/e/_c4CWtJlD","https://s.click.aliexpress.com/e/_c3juNcH5","https://s.click.aliexpress.com/e/_c45ltKQP","https://s.click.aliexpress.com/e/_c4LfZjSb","https://s.click.aliexpress.com/e/_c3H4YA7p","https://s.click.aliexpress.com/e/_c4dyw9uR","https://s.click.aliexpress.com/e/_c369cND1"]
          slug='diodo-laser-remocao-tatuagens-pigmentacao'
          assert len(links)==len(set(links))==11
          assert all(is_https_affiliate_url(u) and urlsplit(u).hostname=='s.click.aliexpress.com' for u in links)
          assert slug in MANUAL_ONLY_FAMILY_SLUGS
          family=ProductFamily.objects.get(slug=slug)
          placements=OfferFamilyPlacement.objects.filter(product_family=family)
          existing=placements.count()
          public=placements.filter(public_eligibility_q(prefix='offer__')).count()
          manual=placements.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()
          print('CAT3_FAMILY='+family.name)
          print('CAT3_PLACEMENTS='+str(existing))
          print('CAT3_PUBLIC='+str(public))
          print('CAT3_MANUAL='+str(manual))
          print('CAT3_AVAILABLE_SLOTS='+str(MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY-existing))
          assert existing==manual==public
          assert family.status!=ProductFamily.Status.RETIRED
          ids=set()
          can_add=[]
          for i,url in enumerate(links,1):
              try:
                  eid,_=resolve_aliexpress_product_url(url)
                  prior=Offer.objects.filter(source=Offer.Source.ALIEXPRESS_OWNER,external_product_id=eid).first()
                  if eid in ids:status='DUPLICATE_WITHIN_INPUT'
                  elif prior is None:status='NEW'
                  elif prior.affiliate_url!=url:status='PRODUCT_EXISTS_DIFFERENT_MANUAL_LINK'
                  elif placements.filter(offer=prior).exists():status='ALREADY_IN_CATEGORY'
                  else:status='EXISTS_SAME_LINK_OTHER_CATEGORY'
                  if status=='NEW':can_add.append(i)
                  ids.add(eid)
              except ManualCandidateIntakeError:status='INVALID_OR_UNRESOLVED'
              print('CAT3_LINK_'+str(i).zfill(2)+'='+status)
          print('CAT3_NEW_LINK_INDICES='+','.join(map(str,can_add)))
          print('CAT3_NEW_COUNT='+str(len(can_add)))
          print('CAT3_CAN_FIT_NEW='+str(existing+len(can_add)<=MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY).upper())
          assert existing+len(can_add)<=MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY
          print('CAT3_READONLY_DUPLICATE_AND_CAPACITY_AUDIT=PASS')
          PY
          REMOTE
