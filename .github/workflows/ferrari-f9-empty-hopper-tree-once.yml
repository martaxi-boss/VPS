name: Ferrari F9 one-time empty Hopper subtree cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ferrari-f9-empty-hopper-tree-once.yml'
permissions:
  contents: read
jobs:
  guarded-cleanup:
    if: github.repository == 'martaxi-boss/VPS' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify existing pinned SSH host
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/f9-host"
          chmod 600 "$RUNNER_TEMP/f9-host"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/f9-host" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
      - name: Disposable GitHub runner SSH helper
        shell: bash
        env:
          SSHPASS: '${{ secrets.VPS_SSH_PASSWORD }}'
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Delete only a verified empty historical directory
        shell: bash
        env:
          SSHPASS: '${{ secrets.VPS_SSH_PASSWORD }}'
        run: |
          set -euo pipefail
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/f9-host" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=10 ubuntu@146.59.145.3 \
            'sudo -n python3 -' > "$RUNNER_TEMP/f9-clean-result.txt" <<'PY_REMOTE'
          import os,stat,pwd,subprocess
          from pathlib import Path
          target=Path('/home/ubuntu/.local/share/hopper')
          units=('fadego-staging.service','lowcost-europa.service','pink-iptv-backend.service','pink-vpn.service','pm2-iptvpn-bot.service','pm2-telegram-robot-leads.service','nginx.service','postgresql@16-main.service')
          def health():return {u:subprocess.run(['systemctl','is-active',u],capture_output=True,text=True,timeout=8).stdout.strip() for u in units}
          before=health()
          if any(s!='active' for s in before.values()):raise SystemExit('BLOCKED_SERVICE_PRECHECK')
          if not target.exists() and not target.is_symlink():
              print('F9_EMPTY_HOPPER=ALREADY_ABSENT')
              raise SystemExit(0)
          st=target.lstat()
          if not stat.S_ISDIR(st.st_mode) or target.is_symlink() or os.path.ismount(target):
              raise SystemExit('BLOCKED_NOT_ORDINARY_DIR')
          if st.st_uid!=pwd.getpwnam('ubuntu').pw_uid or target.resolve()!=target:
              raise SystemExit('BLOCKED_OWNER_OR_CANONICAL')
          children=list(target.rglob('*'))
          if len(children)!=5:
              raise SystemExit('BLOCKED_CHANGED_SUBTREE_COUNT')
          for child in children:
              cs=child.lstat()
              if not stat.S_ISDIR(cs.st_mode) or child.is_symlink() or os.path.ismount(child):
                  raise SystemExit('BLOCKED_NON_DIRECTORY_CHILD')
              if cs.st_uid!=st.st_uid or not str(child.resolve()).startswith(str(target)+'/'):
                  raise SystemExit('BLOCKED_CHILD_OWNER_OR_PATH')
          print('F9_EMPTY_HOPPER_NESTED_DIRECTORIES='+str(len(children)))
          for p in Path('/proc').iterdir():
              if not p.name.isdigit():continue
              try:
                  links=[os.readlink(p/'cwd'),os.readlink(p/'exe')]
                  for fd in (p/'fd').iterdir():
                      try:links.append(os.readlink(fd))
                      except OSError:pass
                  if any(x==str(target) or x.startswith(str(target)+'/') for x in links):
                      raise SystemExit('BLOCKED_PROCESS_REFERENCES')
              except (OSError,PermissionError):pass
          for child in sorted(children,key=lambda p:len(p.parts),reverse=True):
              os.rmdir(child)
          os.rmdir(target)
          if target.exists() or health()!=before:raise SystemExit('BLOCKED_POSTCHECK')
          print('F9_EMPTY_HOPPER=REMOVED')
          print('F9_PROTECTED_SERVICES_UNCHANGED=8')
          PY_REMOTE
          cat "$RUNNER_TEMP/f9-clean-result.txt"
          grep -Eq '^F9_EMPTY_HOPPER=(REMOVED|ALREADY_ABSENT)$' "$RUNNER_TEMP/f9-clean-result.txt"
      - name: Save sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-f9-empty-hopper-${{ github.run_id }}
          path: ${{ runner.temp }}/f9-clean-result.txt
          if-no-files-found: warn
          retention-days: 7
