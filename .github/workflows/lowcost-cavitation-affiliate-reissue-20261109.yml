name: Lowcost Cavitation official affiliate reissue and exact public redirect verification 20261109
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-cavitation-affiliate-reissue-20261109.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-cavitation-affiliate-reissue
  cancel-in-progress: false
jobs:
  reissue:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Official AliExpress API reissue for 17 visible Cavitation offers with DB rollback
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/cav-kh"
          chmod 600 "$RUNNER_TEMP/cav-kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/cav-kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/cav-kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          EXPECTED=19090664e63ab00ffca86947c5109f0a906bc4a7
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          test -s "$ENVFILE" && test ! -L "$ENVFILE"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          systemctl is-active --quiet lowcost-europa.service
          nginx -t >/dev/null 2>&1
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          ENV_SHA="$(sha256sum "$ENVFILE" | awk '{print $1}')"
          sh "$ROOT/deploy/scripts/backup-postgres.sh"
          DUMP="$(find "$ROOT/backups/daily" -maxdepth 1 -type f -name '*.dump' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -s "$DUMP" && test -s "$DUMP.sha256"
          (cd "$ROOT/backups/daily" && sha256sum -c "$(basename "$DUMP.sha256")" >/dev/null)
          echo CAV_REISSUE_BACKUP_CHECKSUM=PASS
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PY'
          import os, time
          from dataclasses import replace
          from datetime import timedelta
          from urllib import error,request
          from urllib.parse import urlsplit
          import django
          django.setup()
          from django.db import transaction
          from django.utils import timezone
          from django.utils.translation import override
          from apps.catalog.models import Offer
          from apps.storefront.views import _family_queryset, _prepare_family
          from apps.integrations.aliexpress.affiliate_url import is_https_affiliate_url
          from apps.integrations.aliexpress.client import AliExpressClient
          from apps.integrations.aliexpress.config import AliExpressConfig
          from apps.integrations.aliexpress.exceptions import AliExpressAPIError
          slug='cavitacao-rf-vacuum-corpo'
          base='https://www.lowcost-europa.eu'
          with override('pt-pt'):
              family=_prepare_family(_family_queryset().get(slug=slug))
          offers=family.active_offers
          assert len(offers)==17 and len({o.pk for o in offers})==17, 'Visible set changed; no writes'
          ids={o.pk for o in offers}
          before={}
          for o in offers:
              assert o.affiliate_promotion_status=='ELIGIBLE', 'Not eligible; no writes'
              assert o.is_active and not o.owner_hidden, 'Not public; no writes'
              assert o.affiliate_promotion_verified_at is not None, 'Missing promotion; no writes'
              assert is_https_affiliate_url(o.affiliate_url), 'Bad old affiliate URL'
              assert o.product_url.startswith('https://'), 'Missing official source URL'
              before[o.pk]={'url':o.affiliate_url,'verified_at':o.affiliate_promotion_verified_at,'product_url':o.product_url}
          config=AliExpressConfig.from_env()
          assert config.tracking_id and config.app_key and config.app_secret
          # AliExpress throttles all users of the app key; never hammer it.
          # No global config, application source or timing defaults are changed.
          client=AliExpressClient(config=replace(config,
              min_interval_seconds=max(7.0,config.min_interval_seconds)))
          def generate_guarded(source_url):
              for attempt in range(4):
                  try:
                      return client.generate_affiliate_link(source_url)
                  except AliExpressAPIError as exc:
                      if 'ApiCallLimit' not in str(exc) or attempt==3:
                          raise
                      print('CAV_API_THROTTLE_BACKOFF=USED attempt='+str(attempt+1))
                      time.sleep(10*(attempt+1))
              raise AssertionError('Unreachable provider loop')
          print('CAV_REISSUE_AUTHENTICATED_TRACKING_CONFIG=PASS')
          fresh={}
          for o in offers:
              # Official link issuance signs the AliExpress request and sends
              # this app's own tracking_id. Never publish account tokens.
              url=generate_guarded(o.product_url)
              host=urlsplit(url).hostname
              assert is_https_affiliate_url(url) and host=='s.click.aliexpress.com', 'Unsafe official link'
              assert url not in fresh.values(), 'Duplicate affiliate link from provider'
              fresh[o.pk]=url
              print('CAV_REISSUE_GENERATED id='+str(o.pk)+' status=OFFICIAL_TRACKING_API_OK')
          assert len(fresh)==len(ids), 'Incomplete official reissue; no writes'
          probe=generate_guarded(offers[0].product_url)
          print('CAV_SHORT_LINKS_ROTATE_ON_REPEAT='+str(probe!=fresh[offers[0].pk]).upper())
          changed=sum(fresh[oid]!=before[oid]['url'] for oid in ids)
          print('CAV_OLD_VS_NEW_SHORT_KEY_DIFFERENCES='+str(changed))
          print('CAV_REISSUE_ALL_OFFICIAL_LINKS_READY=PASS count='+str(len(fresh)))
          promoted=False
          try:
              with transaction.atomic():
                  rows=list(Offer.objects.select_for_update().filter(pk__in=ids).order_by('pk'))
                  assert {o.pk for o in rows}==ids
                  at=timezone.now()
                  for o in rows:
                      old=before[o.pk]
                      assert o.affiliate_url==old['url'], 'Concurrent link edit'
                      assert o.product_url==old['product_url'], 'Concurrent product edit'
                      assert o.affiliate_promotion_status=='ELIGIBLE' and o.is_active and not o.owner_hidden
                      o.affiliate_url=fresh[o.pk]
                      o.affiliate_promotion_verified_at=at
                      o.save(update_fields=['affiliate_url','affiliate_promotion_verified_at','updated_at'])
              promoted=True
              print('CAV_REISSUE_ATOMIC_COMMIT=PASS count='+str(len(ids)))
              class NoRedirect(request.HTTPRedirectHandler):
                  def redirect_request(self,*a,**kw):return None
              op=request.build_opener(NoRedirect)
              verified=0
              for oid in sorted(ids):
                  req=request.Request(base+'/go/'+str(oid)+'/',method='HEAD')
                  try:
                      r=op.open(req,timeout=20)
                  except error.HTTPError as exc:
                      r=exc
                  assert r.code==302, 'Public link did not redirect'
                  assert r.headers.get('Location')==fresh[oid], 'Public URL differs from current account'
                  assert 'noindex' in r.headers.get('X-Robots-Tag','').lower(), 'Affiliate redirect became indexable'
                  verified+=1
                  print('CAV_REISSUE_PUBLIC_HEAD id='+str(oid)+' status=CURRENT_ACCOUNT_MATCH')
              assert verified==len(ids)
              with override('pt-pt'):
                  after_family=_prepare_family(_family_queryset().get(slug=slug))
              assert {o.pk for o in after_family.active_offers}==ids, 'Unexpected catalog publication change'
              for offer in after_family.active_offers:
                  assert offer.affiliate_url==fresh[offer.pk]
              print('CAV_REISSUE_ALL_PUBLIC_REDIRECTS=PASS '+str(verified)+'/'+str(len(ids)))
              print('CAV_REISSUE_ALL_VISIBLE_OFFERS_REMAIN=PASS count='+str(len(ids)))
          except Exception:
              if promoted:
                  with transaction.atomic():
                      rows=list(Offer.objects.select_for_update().filter(pk__in=ids).order_by('pk'))
                      for row in rows:
                          if row.affiliate_url!=fresh[row.pk]:
                              raise AssertionError('Rollback conflict; manual audit required')
                      for row in rows:
                          row.affiliate_url=before[row.pk]['url']
                          row.affiliate_promotion_verified_at=before[row.pk]['verified_at']
                          row.save(update_fields=['affiliate_url','affiliate_promotion_verified_at','updated_at'])
                  print('CAV_REISSUE_DB_ROLLBACK=PASS')
              raise
          print('CAV_REISSUE_CURRENT_ACCOUNT_AFFILIATE_LINKS=PASS '+str(len(ids))+'/'+str(len(ids)))
          print('CAV_REISSUE_DID_NOT_TEST_PLATFORM_COMMISSION_CREDIT=TRUE')
          PY
          test "$(sha256sum "$ENVFILE" | awk '{print $1}')" = "$ENV_SHA"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$EXPECTED"
          systemctl is-active --quiet lowcost-europa.service
          echo CAV_REISSUE_SITE_SOURCE_AND_SECRETS_UNCHANGED=PASS
          REMOTE
