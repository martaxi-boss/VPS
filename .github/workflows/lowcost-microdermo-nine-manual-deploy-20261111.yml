name: Lowcost Microdermabrasion replace legacy with nine manual links 20261111
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-microdermo-nine-manual-deploy-20261111.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-microdermo-manual-nine-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Pinned SSH site rollout and nine URLs in atomic PostgreSQL transaction
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 022
          ROOT=/srv/projects/lowcost-europa
          OLD=3900b0780978909637ba20f506c39717dadd44e7
          NEW=65732cd4185d8eedaa606a81da46f085ef0ad10e
          APPUSER=le001_1789265592
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          TASK="$ROOT/private/ops/microdermo-nine-owner-20261111-r2"
          FAMILY=hydrodermoabrasao-aqua-facial-multifuncoes
          BASE=https://www.lowcost-europa.eu
          TEMPLATE1="$ROOT/apps/storefront/templates/storefront/components/offer_card.html"
          TEMPLATE2="$ROOT/apps/storefront/templates/storefront/components/owner_family_tools.html"
          TEMPLATE3="$ROOT/apps/catalog/templates/catalog/owner_panel/family_manual.html"
          gitrepo() { git -c safe.directory="$ROOT" -C "$ROOT" "$@"; }
          test -d "$ROOT/.git" && test -s "$ENVFILE" && test ! -L "$ENVFILE"
          test ! -e "$TASK"
          exec 9>"$ROOT/private/ops/ptes-deploy.lock"
          flock -n 9
          test "$(gitrepo rev-parse HEAD)" = "$OLD"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          test "$(gitrepo ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = "$NEW"
          gitrepo fetch --no-tags -q https://github.com/martaxi-boss/lowcost-europa.git main
          test "$(gitrepo rev-parse FETCH_HEAD)" = "$NEW"
          gitrepo merge-base --is-ancestor "$OLD" "$NEW"
          EXPECTED="$(printf '%s\n' \
            apps/catalog/management/commands/discover_family_candidates.py \
            apps/catalog/management/commands/discover_family_deep.py \
            apps/catalog/owner_panel_views.py \
            apps/catalog/services/manual_storefront.py \
            apps/catalog/services/offer_maintenance.py \
            apps/catalog/services/weekly_discovery.py \
            apps/catalog/templates/catalog/owner_panel/family_manual.html \
            apps/catalog/tests/test_family_02_taxonomy_alignment.py \
            apps/catalog/tests/test_microdermo_manual_only.py \
            apps/catalog/tests/test_weekly_discovery.py \
            apps/storefront/templates/storefront/components/offer_card.html \
            apps/storefront/templates/storefront/components/owner_family_tools.html \
            apps/storefront/views.py \
            | LC_ALL=C sort)"
          test "$(gitrepo diff --name-only "$OLD" "$NEW" | LC_ALL=C sort)" = "$EXPECTED"
          chmod 644 "$ROOT/apps/catalog/owner_panel_views.py" "$ROOT/apps/catalog/services/manual_storefront.py" "$ROOT/apps/catalog/services/offer_maintenance.py" "$ROOT/apps/catalog/services/weekly_discovery.py" "$ROOT/apps/storefront/views.py"
          echo MICRO_EXACT_SOURCE_FILE_DIFF=PASS_13
          test "$(systemctl show lowcost-europa.service -p User --value)" = "$APPUSER"
          nginx -t >/dev/null 2>&1
          for unit in \
            lowcost-europa.service lowcost-europa-catalog-maintenance.timer \
            lowcost-europa-indexnow.timer lowcost-europa-backup.timer \
            lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer \
            lowcost-europa-affiliate-report.timer lowcost-europa-cavitation-availability.timer; do
            systemctl is-active --quiet "$unit"
          done
          ENV_SHA="$(sha256sum "$ENVFILE" | awk '{print $1}')"
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYPRE'
          import django
          django.setup()
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement,ProductFamily
          from apps.catalog.services.public_eligibility import public_eligibility_q
          fam=ProductFamily.objects.get(slug="hydrodermoabrasao-aqua-facial-multifuncoes")
          places=OfferFamilyPlacement.objects.filter(product_family=fam)
          assert places.count()==31
          assert places.filter(offer__in=Offer.objects.filter(public_eligibility_q())).count()==9
          assert places.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()==0
          old_ids=list(places.values_list("offer_id",flat=True))
          assert OfferClick.objects.filter(offer_id__in=old_ids).count()>=144
          target_ids=(
            "1005012631523599","1005010290538548","1005013119046635",
            "1005013020079055","1005013167560376","1005010064864229",
            "1005012717726753","1005012870924252","1005008389290638",
          )
          assert len(target_ids)==len(set(target_ids))==9
          assert not Offer.objects.filter(
              source=Offer.Source.ALIEXPRESS_OWNER,
              external_product_id__in=target_ids,
          ).exists()
          print("MICRO_PRECHECK=PASS_31_OLD_9_PUBLIC_0_MANUAL")
          print("MICRO_HISTORICAL_CLICKS_BEFORE_AT_LEAST=144")
          PYPRE
          sh "$ROOT/deploy/scripts/backup-postgres.sh"
          BACKUP="$(find "$ROOT/backups/daily" -maxdepth 1 -type f -name '*.dump' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -s "$BACKUP" && test -s "$BACKUP.sha256"
          (cd "$ROOT/backups/daily" && sha256sum -c "$(basename "$BACKUP.sha256")" >/dev/null)
          echo MICRO_BACKUP_POSTGRES=PASS
          mkdir -m 700 "$TASK"
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYSNAP' > "$TASK/old-placements.json"
          import json,django
          django.setup()
          from apps.catalog.models import OfferClick, OfferFamilyPlacement, ProductFamily
          fam=ProductFamily.objects.get(slug="hydrodermoabrasao-aqua-facial-multifuncoes")
          placements=list(OfferFamilyPlacement.objects.filter(product_family=fam)
            .values("offer_id","selection_position","display_order","selection_reason"))
          assert len(placements)==31
          clicks=OfferClick.objects.filter(offer_id__in=[x["offer_id"] for x in placements]).count()
          assert clicks>=144
          print(json.dumps({"placements":placements,"old_clicks":clicks},sort_keys=True))
          PYSNAP
          test -s "$TASK/old-placements.json"
          chmod 600 "$TASK/old-placements.json"
          SOURCE_CHANGED=0
          DATA_CHANGED=0
          rollback() {
            rc=$?
            trap - EXIT
            if test "$rc" -ne 0; then
              if test "$DATA_CHANGED" = 1; then
                cat "$TASK/old-placements.json" | runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" -c '
          import json,sys,django
          django.setup()
          from django.db import transaction
          from apps.catalog.models import Offer, OfferClick, OfferFamilyPlacement, OfferObservation, ProductFamily
          original=json.load(sys.stdin)
          ids=(
            "1005012631523599","1005010290538548","1005013119046635",
            "1005013020079055","1005013167560376","1005010064864229",
            "1005012717726753","1005012870924252","1005008389290638",
          )
          with transaction.atomic():
              fam=ProductFamily.objects.select_for_update().get(
                slug="hydrodermoabrasao-aqua-facial-multifuncoes")
              latest=Offer.objects.filter(source=Offer.Source.ALIEXPRESS_OWNER,
                                          external_product_id__in=ids)
              OfferFamilyPlacement.objects.filter(product_family=fam,offer__in=latest).delete()
              for entry in original["placements"]:
                  OfferFamilyPlacement.objects.get_or_create(
                    product_family=fam,offer_id=entry["offer_id"],
                    defaults={
                      "selection_position":entry["selection_position"],
                      "display_order":entry["display_order"],
                      "selection_reason":entry["selection_reason"],
                    })
              assert OfferFamilyPlacement.objects.filter(product_family=fam).count()==31
              for offer in latest:
                  if OfferClick.objects.filter(offer=offer).exists():
                      offer.owner_hidden=True
                      offer.save(update_fields=["owner_hidden"])
                  elif not OfferFamilyPlacement.objects.filter(offer=offer).exists():
                      OfferObservation.objects.filter(offer=offer).delete()
                      offer.delete()
          print("MICRO_ROLLBACK_OLD_PLACEMENTS_RESTORED=PASS")
          ' || true
              fi
              if test "$SOURCE_CHANGED" = 1; then
                gitrepo checkout --detach -q "$OLD" || true
                chmod 644 "$TEMPLATE1" "$TEMPLATE2" "$TEMPLATE3" || true
                systemctl reload lowcost-europa.service || true
              fi
              echo MICRO_ROLLBACK_TRIGGERED=TRUE
            fi
            exit "$rc"
          }
          trap rollback EXIT
          SOURCE_CHANGED=1
          gitrepo checkout --detach -q "$NEW"
          chmod 644 "$TEMPLATE1" "$TEMPLATE2" "$TEMPLATE3"
          runuser -u "$APPUSER" -- test -r "$TEMPLATE1"
          runuser -u "$APPUSER" -- test -r "$TEMPLATE2"
          runuser -u "$APPUSER" -- test -r "$TEMPLATE3"
          echo MICRO_TEMPLATES_ACCESSIBLE=PASS
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py check
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py makemigrations --check --dry-run
          DATA_CHANGED=1
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYPUBLISH'
          import django
          from django.core.management import call_command
          from django.db import transaction
          django.setup()
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement,ProductFamily
          from apps.catalog.services.public_eligibility import public_eligibility_q
          target=(
            ("1005012631523599","https://s.click.aliexpress.com/e/_c4K1MNWr"),
            ("1005010290538548","https://s.click.aliexpress.com/e/_c3rfP69D"),
            ("1005013119046635","https://s.click.aliexpress.com/e/_c36pq3Xp"),
            ("1005013020079055","https://s.click.aliexpress.com/e/_c3txZjGb"),
            ("1005013167560376","https://s.click.aliexpress.com/e/_c2JMpzLt"),
            ("1005010064864229","https://s.click.aliexpress.com/e/_c33ssvBv"),
            ("1005012717726753","https://s.click.aliexpress.com/e/_c3cIMpHH"),
            ("1005012870924252","https://s.click.aliexpress.com/e/_c3xMz5SB"),
            ("1005008389290638","https://s.click.aliexpress.com/e/_c3CIKbYb"),
          )
          assert len(target)==len(set(x[0] for x in target))==len(set(x[1] for x in target))==9
          slug="hydrodermoabrasao-aqua-facial-multifuncoes"
          with transaction.atomic():
              family=ProductFamily.objects.select_for_update().get(slug=slug)
              old=OfferFamilyPlacement.objects.select_for_update().filter(product_family=family)
              assert old.count()==31
              ids=list(old.values_list("offer_id",flat=True))
              clicks_before=OfferClick.objects.filter(offer_id__in=ids).count()
              assert clicks_before>=144
              for n,(pid,link) in enumerate(target):
                  if n==0:
                      call_command("publish_owner_affiliate_link",
                                   "--family",slug,"--replace-family",link)
                  else:
                      call_command("publish_owner_affiliate_link",
                                   "--family",slug,link)
                  offer=Offer.objects.get(
                      source=Offer.Source.ALIEXPRESS_OWNER,
                      external_product_id=pid,
                  )
                  assert offer.affiliate_url==link and offer.is_active and not offer.owner_hidden
                  assert OfferFamilyPlacement.objects.filter(
                      product_family=family,offer=offer).count()==1
                  print("MICRO_LINK_"+str(n+1)+"_PUBLISHED=PASS offer="+str(offer.pk))
              final=OfferFamilyPlacement.objects.filter(product_family=family)
              assert final.count()==9
              assert final.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()==9
              assert final.filter(offer__in=Offer.objects.filter(public_eligibility_q())).count()==9
              assert OfferClick.objects.filter(offer_id__in=ids).count()>=clicks_before
              assert not final.filter(offer__source=Offer.Source.ALIEXPRESS).exists()
          print("MICRO_TRANSACTION=PASS_9_MANUAL_ONLY")
          PYPUBLISH
          systemctl reload lowcost-europa.service
          systemctl is-active --quiet lowcost-europa.service
          sleep 3
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYVERIFY'
          import django,re,time,urllib.error,urllib.request
          from html.parser import HTMLParser
          django.setup()
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement,ProductFamily
          from apps.catalog.services.public_eligibility import public_eligibility_q
          expected={
            "1005012631523599":"https://s.click.aliexpress.com/e/_c4K1MNWr",
            "1005010290538548":"https://s.click.aliexpress.com/e/_c3rfP69D",
            "1005013119046635":"https://s.click.aliexpress.com/e/_c36pq3Xp",
            "1005013020079055":"https://s.click.aliexpress.com/e/_c3txZjGb",
            "1005013167560376":"https://s.click.aliexpress.com/e/_c2JMpzLt",
            "1005010064864229":"https://s.click.aliexpress.com/e/_c33ssvBv",
            "1005012717726753":"https://s.click.aliexpress.com/e/_c3cIMpHH",
            "1005012870924252":"https://s.click.aliexpress.com/e/_c3xMz5SB",
            "1005008389290638":"https://s.click.aliexpress.com/e/_c3CIKbYb",
          }
          fam=ProductFamily.objects.get(slug="hydrodermoabrasao-aqua-facial-multifuncoes")
          places=OfferFamilyPlacement.objects.filter(product_family=fam)
          assert places.count()==9
          assert places.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()==9
          assert places.filter(offer__in=Offer.objects.filter(public_eligibility_q())).count()==9
          offers={}
          for pid,link in expected.items():
              o=Offer.objects.get(source=Offer.Source.ALIEXPRESS_OWNER,external_product_id=pid)
              assert o.affiliate_url==link and o.is_active and not o.owner_hidden
              assert places.filter(offer=o).exists()
              assert OfferClick.objects.filter(offer=o).count()==0
              offers[o.pk]=link
          assert len(offers)==9
          print("MICRO_DATABASE=PASS_9_MANUAL")
          class Cards(HTMLParser):
              def __init__(self):
                  super().__init__();self.ids=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="article":
                      d=dict(attrs)
                      if "data-offer-card" in d:
                          self.ids.append(d.get("data-offer-id"))
          base="https://www.lowcost-europa.eu"
          for prefix in ("","/pt","/es"):
              url=base+prefix+"/products/hydrodermoabrasao-aqua-facial-multifuncoes/"
              html=None
              for attempt in range(8):
                  try:
                      req=urllib.request.Request(url,headers={"Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=22) as response:
                          assert response.status==200
                          html=response.read(2600000).decode("utf-8")
                      break
                  except (urllib.error.HTTPError,urllib.error.URLError):
                      if attempt==7:raise
                      time.sleep(3)
              cards=Cards();cards.feed(html)
              assert len(cards.ids)==9 and len(set(cards.ids))==9,(prefix,len(cards.ids))
              assert set(cards.ids)==set(str(pk) for pk in offers)
              assert html.count('class="offer-price-block offer-price-block--compact"')==9
              assert html.count("data-affiliate-share-button")==9
              assert html.count("data-compare-toggle")==9
              assert "data-affiliate-copy" not in html
              assert "offer-browser-help" not in html
              for link in expected.values():
                  assert 'data-affiliate-original-url="'+link+'"' in html,(prefix,link)
              print("MICRO_PUBLIC_"+(prefix.strip("/").upper() or "BASE")+"=PASS_9")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**k):return None
          opener=urllib.request.build_opener(NoRedirect)
          for pk,link in offers.items():
              req=urllib.request.Request(base+"/go/"+str(pk)+"/",method="HEAD",
                    headers={"User-Agent":"Mozilla/5.0 (Linux; Android 14) Chrome Mobile"})
              try: response=opener.open(req,timeout=22)
              except urllib.error.HTTPError as e:response=e
              assert response.code==302 and response.headers.get("Location")==link,(pk,response.code)
              assert OfferClick.objects.filter(offer_id=pk).count()==0
              print("MICRO_EXACT_302=PASS offer="+str(pk))
          print("MICRO_VERIFIED_SOURCE_AND_NINE_LINKS=PASS")
          PYVERIFY
          test "$(gitrepo rev-parse HEAD)" = "$NEW"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          test "$(sha256sum "$ENVFILE" | awk '{print $1}')" = "$ENV_SHA"
          nginx -t >/dev/null 2>&1
          for unit in \
            lowcost-europa.service lowcost-europa-catalog-maintenance.timer \
            lowcost-europa-indexnow.timer lowcost-europa-backup.timer \
            lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer \
            lowcost-europa-affiliate-report.timer lowcost-europa-cavitation-availability.timer; do
            systemctl is-active --quiet "$unit"
          done
          echo MICRODERMABRASAO_GITHUB_VPS_NINE_MANUAL=PASS
          trap - EXIT
          rm -rf -- "$TASK"
          if test -d "$ROOT/private/ops/microdermo-nine-owner-20261111"; then
            rm -rf -- "$ROOT/private/ops/microdermo-nine-owner-20261111"
          fi
          REMOTE
