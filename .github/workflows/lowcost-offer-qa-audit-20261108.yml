name: Lowcost offer evidence readiness read-only QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-offer-qa-audit-20261108.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-offer-qa-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Scope and known SSH identity
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")" == ".github/workflows/lowcost-offer-qa-audit-20261108.yml" ]]
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          echo LOWCOST_OFFER_AUDIT_SSH_PIN=PASS
      - name: Read-only production data and maintenance telemetry
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SSHPASS" ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          [[ -d "$ROOT/.git" ]]
          echo "LOWCOST_AUDIT_LIVE_SHA=$(git -c "safe.directory=$ROOT" -C "$ROOT" rev-parse HEAD)"
          echo "LOWCOST_AUDIT_TRACKED_DIRTY=$(git -c "safe.directory=$ROOT" -C "$ROOT" status --porcelain --untracked-files=no | wc -l)"
          for unit in lowcost-europa.service lowcost-europa-catalog-maintenance.timer lowcost-europa-catalog-maintenance.service lowcost-europa-affiliate-report.timer; do
            echo "LOWCOST_AUDIT_UNIT_${unit}=$(systemctl is-active "$unit" || true)"
          done
          systemctl show lowcost-europa-catalog-maintenance.service -p Result -p ExecMainStatus -p ActiveEnterTimestamp --no-pager | sed 's/^/LOWCOST_AUDIT_MAINTENANCE_/'
          systemctl list-timers lowcost-europa-catalog-maintenance.timer --no-pager --no-legend | cut -c1-210 | sed 's/^/LOWCOST_AUDIT_TIMER=/'
          cd "$ROOT"
          "$ROOT/.venv/bin/python" - <<'PYAUDIT'
          import os, pwd
          from collections import Counter, defaultdict
          from datetime import timedelta
          from pathlib import Path
          root=Path("/srv/projects/lowcost-europa")
          for line in (root/"private/systemd-env/lowcost-europa.env").read_text().splitlines():
              line=line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key,value=line.split("=",1)
              key=key.strip()
              if key.isidentifier():
                  value=value.strip()
                  if len(value)>1 and value[0] in ("'",'"') and value[-1]==value[0]:
                      value=value[1:-1]
                  os.environ[key]=value
          os.environ["DJANGO_SETTINGS_MODULE"]="config.settings.production"
          user=pwd.getpwnam("le001_1789265592")
          os.initgroups(user.pw_name,user.pw_gid)
          os.setgid(user.pw_gid)
          os.setuid(user.pw_uid)
          import django
          django.setup()
          from django.utils import timezone
          from django.db.models import Q, OuterRef, Subquery, Count
          from django.db.models.functions import Trim
          from apps.catalog.models import Offer,OfferFamilyPlacement,OfferObservation,ProductFamily,OfferCandidate
          from apps.catalog.services.public_eligibility import public_eligibility_q
          now=timezone.now()
          today=now-timedelta(hours=24)
          latest=OfferObservation.objects.filter(offer_id=OuterRef("pk")).order_by("-observed_at","-pk")
          price_obs=(OfferObservation.objects.filter(offer_id=OuterRef("pk"),price__isnull=False,currency__isnull=False).annotate(cc=Trim("currency")).exclude(cc="").order_by("-observed_at","-pk"))
          delivery_obs=OfferObservation.objects.filter(offer_id=OuterRef("pk")).filter(Q(delivery_days__isnull=False)|Q(search_delivery_days__isnull=False))
          ops=[ProductFamily.Status.NEW,ProductFamily.Status.TESTING,ProductFamily.Status.VERIFIED,ProductFamily.Status.PROVEN,ProductFamily.Status.WINNER,ProductFamily.Status.OBSERVATION]
          visible=Offer.objects.filter(is_active=True,owner_hidden=False,family_placements__product_family__status__in=ops).distinct()
          eligible=visible.filter(public_eligibility_q(now)).annotate(
              latest_at=Subquery(latest.values("observed_at")[:1]),
              latest_av=Subquery(latest.values("availability")[:1]),
              price_at=Subquery(price_obs.values("observed_at")[:1]),
              price_value=Subquery(price_obs.values("price")[:1]),
          )
          total=eligible.count()
          print("LIVE_OFFER_VISIBLE_EDITORIAL="+str(visible.count()))
          print("LIVE_OFFER_PUBLIC_ELIGIBLE="+str(total))
          print("LIVE_OFFER_BLOCKED_EDITORIAL="+str(visible.exclude(public_eligibility_q(now)).count()))
          print("LIVE_OFFER_ELIGIBLE_NO_ORIGIN_PROOF="+str(eligible.filter(Q(ship_from_country__isnull=True)|Q(ship_from_verified_at__isnull=True)).count()))
          with_rel=list(eligible.values("pk","latest_at","latest_av","price_at","price_value","ship_from_country"))
          tally=Counter(x["latest_av"] or "NO_OBS" for x in with_rel)
          print("LIVE_OFFER_LAST_AVAILABILITY="+str(sorted(tally.items())))
          price_bad=[x for x in with_rel if not x["price_at"] or x["price_at"]<today]
          print("LIVE_OFFER_PRICE_STALE_24H="+str(len(price_bad)))
          print("LIVE_OFFER_PRICE_NEVER_PROVEN="+str(sum(x["price_at"] is None for x in with_rel)))
          print("LIVE_OFFER_PRICE_STALE_IDS="+",".join(str(x["pk"]) for x in price_bad[:20]))
          print("LIVE_OFFER_LATEST_OBS_BEFORE_24H="+str(sum(not x["latest_at"] or x["latest_at"]<today for x in with_rel)))
          print("LIVE_OFFER_LAST_AVAILABILITY_UNKNOWN="+str(sum(x["latest_av"] in (None,"UNKNOWN") for x in with_rel)))
          print("LIVE_OFFER_MISSING_ALL_NUMERIC_DELIVERY="+str(eligible.exclude(pk__in=delivery_obs.values("offer_id")).count()))
          print("LIVE_OFFER_DELIVERY_HAS_ANY_HISTORY="+str(eligible.filter(pk__in=delivery_obs.values("offer_id")).count()))
          print("LIVE_OFFER_OBSERVATIONS_LAST_24H="+str(OfferObservation.objects.filter(observed_at__gte=today).count()))
          print("LIVE_OFFER_OBSERVATIONS_UNKNOWN_24H="+str(OfferObservation.objects.filter(observed_at__gte=today,availability="UNKNOWN").count()))
          print("LIVE_OFFER_OBSERVATIONS_AVAILABLE_24H="+str(OfferObservation.objects.filter(observed_at__gte=today,availability="AVAILABLE").count()))
          print("LIVE_OFFER_OBSERVATIONS_WITH_PRICE_24H="+str(OfferObservation.objects.filter(observed_at__gte=today,price__isnull=False).count()))
          print("LIVE_OFFER_OBSERVATIONS_WITH_DELIVERY_24H="+str(OfferObservation.objects.filter(observed_at__gte=today).filter(Q(delivery_days__isnull=False)|Q(search_delivery_days__isnull=False)).count()))
          print("LIVE_OFFER_TOTAL_ACTIVE="+str(Offer.objects.filter(is_active=True).count()))
          print("LIVE_OFFER_TOTAL_HIDDEN="+str(Offer.objects.filter(owner_hidden=True).count()))
          print("LIVE_OFFER_PENDING_CANDIDATES="+str(OfferCandidate.objects.filter(status="PENDING").count()))
          for fam in ProductFamily.objects.exclude(status=ProductFamily.Status.RETIRED).order_by("display_order","pk"):
              in_fam=Offer.objects.filter(family_placements__product_family=fam).filter(public_eligibility_q(now)).distinct()
              print("LIVE_FAMILY_"+str(fam.slug)+"_PUBLIC="+str(in_fam.count()))
          print("LIVE_OFFER_AUDIT_READ_ONLY=PASS")
          PYAUDIT
          REMOTE
