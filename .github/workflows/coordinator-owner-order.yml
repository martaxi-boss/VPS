name: Coordinator to existing Codex router (Owner order)

# This is an authenticated gateway, NOT another AI coordinator.
# The model stays in ops/coordinator_ai.py; workers stay in agent-switch.
on:
  issues:
    types: [opened]
  pull_request:
    paths:
      - '.github/workflows/coordinator-owner-order.yml'
      - '.github/workflows/coordinator-ai-smoke.yml'
      - '.github/workflows/agent-switch.yml'
      - '.github/workflows/codex-autonomous.yml'
      - 'ops/coordinator-smoke-remote.sh'
      - 'ops/agent_switch.py'
      - 'ops/tests/test_coordinator_owner_routing.py'
      - 'ops/coordinator_pr_integrator.py'
      - 'ops/tests/test_coordinator_pr_integrator.py'
      - '.github/workflows/coordinator-phase-cycle.yml'
      - 'ops/coordinator_phase_continuation.py'
      - 'ops/tests/test_coordinator_phase_continuation.py'

permissions: {}

jobs:
  offline-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4
        with:
          persist-credentials: false
      - name: Validate gateway, router and smoke offline; no models or secrets
        run: |
          bash -n ops/coordinator-smoke-remote.sh
          python3 -m py_compile ops/agent_switch.py ops/coordinator_ai.py ops/coordinator_pr_integrator.py ops/coordinator_supervisor.py ops/coordinator_phase_continuation.py
          python3 -m unittest discover -s ops/tests -p test_coordinator_phase_continuation.py -v
          python3 -m unittest discover -s ops/tests -p test_coordinator_owner_routing.py -v
          python3 -m unittest discover -s ops/tests -p test_coordinator_smoke.py -v
          python3 -m unittest discover -s ops/tests -p test_coordinator_pr_integrator.py -v

  plan:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[coordinator run] ')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      issues: write
    concurrency:
      group: coordinator-issue-${{ github.event.issue.id }}
      cancel-in-progress: false
    outputs:
      coordinator_plan_b64: ${{ steps.invoke.outputs.coordinator_plan_b64 }}
      audited_sha: ${{ steps.invoke.outputs.audited_sha }}
      phase_count: ${{ steps.invoke.outputs.phase_count }}
    steps:
      - name: Load reviewed Coordinator and dispatcher from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate Owner order and target publication access before using Codex
        shell: bash
        env:
          ORDER_BODY: ${{ github.event.issue.body }}
          CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY_ORDER'
          import base64, json, os, re, urllib.error, urllib.request
          from pathlib import Path
          body = os.environ.get('ORDER_BODY', '').strip()
          from ops.project_target import from_owner_order, TargetRefused
          if (not 50 <= len(body.encode('utf-8')) <= 8000 or
                  re.search(r'[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]', body)):
              raise SystemExit('COORDINATOR_OWNER_ORDER_REFUSED')
          try:
              target = from_owner_order(body)
          except TargetRefused:
              raise SystemExit('COORDINATOR_OWNER_ORDER_REFUSED')
          token = os.environ.get('CODEX_GITHUB_TOKEN', '')
          if not token:
              raise SystemExit('COORDINATOR_PUBLICATION_TOKEN_UNAVAILABLE')
          request = urllib.request.Request(
              'https://api.github.com/repos/' + target,
              headers={'Authorization': 'Bearer ' + token,
                       'Accept': 'application/vnd.github+json',
                       'User-Agent': 'Project-Leader-Codex-Owner-gate'})
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  info = json.load(response)
          except (OSError, ValueError):
              raise SystemExit('COORDINATOR_PUBLICATION_PREFLIGHT_REFUSED')
          if (info.get('full_name') != target or
                  info.get('owner', {}).get('login') != 'martaxi-boss' or
                  info.get('default_branch') != 'main' or
                  info.get('private') is not False or
                  info.get('archived') is True or
                  info.get('permissions', {}).get('push') is not True):
              raise SystemExit('COORDINATOR_TARGET_WRITE_NOT_VERIFIED')
          temp = Path(os.environ['RUNNER_TEMP'])
          encoded = base64.b64encode(body.encode('utf-8')).decode('ascii')
          if not re.fullmatch(r'[A-Za-z0-9+/=]{20,11000}', encoded):
              raise SystemExit('COORDINATOR_ORDER_ENCODE_FAILED')
          (temp / 'coordinator_owner_order.b64').write_text(encoded, encoding='ascii')
          (temp / 'coordinator_owner_target.txt').write_text(target, encoding='ascii')
          print('COORDINATOR_OWNER_SCOPE_AND_TOKEN_VERIFIED')
          PY_ORDER
          bash -n ops/coordinator-smoke-remote.sh

      - name: Verify existing Owner-observed Ed25519 VPS identity
        shell: bash
        run: |
          set -euo pipefail
          expected='SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          known_hosts="$RUNNER_TEMP/coordinator_owner_known_hosts"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$known_hosts" || exit 2
          chmod 600 "$known_hosts"
          observed="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}')"
          test "$observed" = "$expected" || exit 2
          ssh-keygen -F 146.59.145.3 -f "$known_hosts" >/dev/null || exit 2
          echo 'COORDINATOR_OWNER_SSH_PIN=VERIFIED'

      - name: Prepare isolated SSH client
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || exit 2
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Obtain one independently validated AI audit; never dispatch on VPS
        id: invoke
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          OWNER_ISSUE_ID: ${{ github.event.issue.id }}
        run: |
          set -euo pipefail
          job="$OWNER_ISSUE_ID-1"
          [[ "$job" =~ ^[1-9][0-9]{7,14}-1$ ]] || exit 12
          order_b64="$(cat "$RUNNER_TEMP/coordinator_owner_order.b64")"
          [[ "$order_b64" =~ ^[A-Za-z0-9+/=]{20,11000}$ ]] || exit 12
          output="$RUNNER_TEMP/coordinator_owner_audit.txt"
          # This is a private runner file, NOT a log or issue comment.
          timeout --signal=TERM --kill-after=10s 40m \
            sshpass -e ssh -T -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/coordinator_owner_known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=5 \
            ubuntu@146.59.145.3 "bash -s -- '$job' dispatch '$order_b64'" \
            < ops/coordinator-smoke-remote.sh > "$output" 2>/dev/null || exit 12
          python3 - "$output" "$GITHUB_OUTPUT" <<'PY_PLAN'
          import base64
          import os
          from pathlib import Path
          import re
          import sys
          from ops import agent_switch as router
          raw = Path(sys.argv[1]).read_bytes()
          pattern = re.compile(
              rb'COORDINATOR_DISPATCH_STATUS=VALIDATED\n'
              rb'TARGET_REPOSITORY=(martaxi-boss/[A-Za-z0-9._-]+)\n'
              rb'TARGET_SHA=([0-9a-f]{40})\n'
              rb'PHASE_COUNT=([1-8])\n'
              rb'FIRST_PHASE_WORKERS=([12])\n'
              rb'FIRST_PHASE_MODE=(serial|parallel)\n'
              rb'AUDIT_B64=([A-Za-z0-9+/=]{20,32000})\n\Z')
          match = pattern.fullmatch(raw) if len(raw) <= 33000 else None
          if not match:
              raise SystemExit('COORDINATOR_PLAN_FORMAT_REFUSED')
          expected_target = (Path(os.environ['RUNNER_TEMP']) /
                             'coordinator_owner_target.txt').read_text(encoding='ascii')
          encoded = match.group(6).decode('ascii')
          order, meta = router.parse_coordinator_envelope(encoded)
          routed = router.workflow_values(order)
          if (order['target_repository'] != expected_target or
                  match.group(1).decode('ascii') != expected_target or
                  meta['audited_revision'] != match.group(2).decode('ascii') or
                  int(routed['task_count']) != int(match.group(4)) or
                  routed['mode'] != match.group(5).decode('ascii') or
                  meta['phase_count'] != int(match.group(3)) or
                  routed['audit_managed'] != 'true'):
              raise SystemExit('COORDINATOR_ROUTE_MISMATCH')
          with open(sys.argv[2], 'a', encoding='ascii') as out:
              out.write('coordinator_plan_b64=' + encoded + '\n')
              out.write('audited_sha=' + meta['audited_revision'] + '\n')
              out.write('phase_count=' + str(meta['phase_count']) + '\n')
          print('COORDINATOR_AUDIT_VERIFIED_AND_ROUTED')
          PY_PLAN

      - name: Report bounded Coordinator status to original Owner Issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PLAN_OUTCOME: ${{ steps.invoke.outcome }}
          PLAN_SHA: ${{ steps.invoke.outputs.audited_sha }}
          PHASE_COUNT: ${{ steps.invoke.outputs.phase_count }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 2
          if [ "$PLAN_OUTCOME" = success ]; then
            # No arbitrary model content or private paths in the public report.
            [[ "$PLAN_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
            [[ "$PHASE_COUNT" =~ ^[1-8]$ ]] || exit 2
            message="COORDINATOR_VERIFIED: audited SHA $PLAN_SHA; phases $PHASE_COUNT. Plan sent to existing agent-switch router. Execution and later phases require the original security/CI gates."
          else
            message='COORDINATOR_NOT_CERTIFIED: no executor dispatched by this gateway.'
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "$message"$'\n'"Actions evidence: $RUN_URL"

      - name: Passive Supervisor receives once-only Coordinator planning result
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPERVISOR_PLAN_ISSUE: ${{ github.event.issue.number }}
          SUPERVISOR_PLAN_OUTCOME: ${{ steps.invoke.outcome }}
          SUPERVISOR_PLAN_PHASE_COUNT: ${{ steps.invoke.outputs.phase_count }}
        run: python3 -m ops.supervisor_live plan

  dispatch:
    needs: plan
    if: >-
      needs.plan.result == 'success' &&
      needs.plan.outputs.coordinator_plan_b64 != ''
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/agent-switch.yml
    with:
      coordinator_plan_b64: ${{ needs.plan.outputs.coordinator_plan_b64 }}
    secrets: inherit

  # This is a deterministic independent Project Leader trusted PR integrator gate.
  # It does not call the Coordinator, create workers, or get model transcripts.
  integrate:
    needs: [plan, dispatch]
    if: >-
      always() &&
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[coordinator run] ') &&
      needs.plan.result == 'success' &&
      needs.dispatch.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    outputs:
      phase_status: ${{ steps.terminal.outputs.phase_status }}
      merged_sha: ${{ steps.terminal.outputs.merged_sha }}
    steps:
      - name: Load reviewed independent Project Leader trusted PR integrator from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify worker PR and integrate only safe exact-CI documentation E1
        id: terminal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
          OWNER_ISSUE: ${{ github.event.issue.number }}
          OWNER_RUN: ${{ github.run_id }}
          WORKER_COUNT: ${{ needs.dispatch.outputs.task_count }}
          PHASE_COUNT: ${{ needs.dispatch.outputs.phase_count }}
          CANONICAL_SHA: ${{ needs.dispatch.outputs.worker_1_canonical_sha }}
          WORKER_1_STATUS: ${{ needs.dispatch.outputs.worker_1_status }}
          WORKER_1_PR: ${{ needs.dispatch.outputs.worker_1_pr }}
          WORKER_1_SHA: ${{ needs.dispatch.outputs.worker_1_sha }}
          WORKER_2_STATUS: ${{ needs.dispatch.outputs.worker_2_status }}
          WORKER_2_PR: ${{ needs.dispatch.outputs.worker_2_pr }}
          WORKER_2_SHA: ${{ needs.dispatch.outputs.worker_2_sha }}
          WORKER_2_CANONICAL: ${{ needs.dispatch.outputs.worker_2_canonical_sha }}
        run: |
          set -euo pipefail
          # A missing or different verified runtime is not a Human Gate.
          if [ "$WORKER_COUNT" = '2' ]; then
            test "$WORKER_2_CANONICAL" = "$CANONICAL_SHA" || exit 3
          fi
          python3 ops/coordinator_pr_integrator.py


  phase_2:
    needs: [plan, integrate]
    if: >-
      needs.integrate.result == 'success' &&
      needs.integrate.outputs.phase_status == 'PHASE_VALIDATED_PENDING_NEXT_PHASE'
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/coordinator-phase-cycle.yml
    with:
      original_plan_b64: ${{ needs.plan.outputs.coordinator_plan_b64 }}
      phase_number: 2
      previous_merged_sha: ${{ needs.integrate.outputs.merged_sha }}
    secrets: inherit

  phase_3:
    needs: [plan, phase_2]
    if: >-
      needs.phase_2.result == 'success' &&
      needs.phase_2.outputs.phase_status == 'PHASE_VALIDATED_PENDING_NEXT_PHASE'
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/coordinator-phase-cycle.yml
    with:
      original_plan_b64: ${{ needs.plan.outputs.coordinator_plan_b64 }}
      phase_number: 3
      previous_merged_sha: ${{ needs.phase_2.outputs.merged_sha }}
    secrets: inherit

  phase_4:
    needs: [plan, phase_3]
    if: >-
      needs.phase_3.result == 'success' &&
      needs.phase_3.outputs.phase_status == 'PHASE_VALIDATED_PENDING_NEXT_PHASE'
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/coordinator-phase-cycle.yml
    with:
      original_plan_b64: ${{ needs.plan.outputs.coordinator_plan_b64 }}
      phase_number: 4
      previous_merged_sha: ${{ needs.phase_3.outputs.merged_sha }}
    secrets: inherit

  phase_5:
    needs: [plan, phase_4]
    if: >-
      needs.phase_4.result == 'success' &&
      needs.phase_4.outputs.phase_status == 'PHASE_VALIDATED_PENDING_NEXT_PHASE'
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/coordinator-phase-cycle.yml
    with:
      original_plan_b64: ${{ needs.plan.outputs.coordinator_plan_b64 }}
      phase_number: 5
      previous_merged_sha: ${{ needs.phase_4.outputs.merged_sha }}
    secrets: inherit

  phase_6:
    needs: [plan, phase_5]
    if: >-
      needs.phase_5.result == 'success' &&
      needs.phase_5.outputs.phase_status == 'PHASE_VALIDATED_PENDING_NEXT_PHASE'
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/coordinator-phase-cycle.yml
    with:
      original_plan_b64: ${{ needs.plan.outputs.coordinator_plan_b64 }}
      phase_number: 6
      previous_merged_sha: ${{ needs.phase_5.outputs.merged_sha }}
    secrets: inherit

  phase_7:
    needs: [plan, phase_6]
    if: >-
      needs.phase_6.result == 'success' &&
      needs.phase_6.outputs.phase_status == 'PHASE_VALIDATED_PENDING_NEXT_PHASE'
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/coordinator-phase-cycle.yml
    with:
      original_plan_b64: ${{ needs.plan.outputs.coordinator_plan_b64 }}
      phase_number: 7
      previous_merged_sha: ${{ needs.phase_6.outputs.merged_sha }}
    secrets: inherit

  phase_8:
    needs: [plan, phase_7]
    if: >-
      needs.phase_7.result == 'success' &&
      needs.phase_7.outputs.phase_status == 'PHASE_VALIDATED_PENDING_NEXT_PHASE'
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/coordinator-phase-cycle.yml
    with:
      original_plan_b64: ${{ needs.plan.outputs.coordinator_plan_b64 }}
      phase_number: 8
      previous_merged_sha: ${{ needs.phase_7.outputs.merged_sha }}
    secrets: inherit
