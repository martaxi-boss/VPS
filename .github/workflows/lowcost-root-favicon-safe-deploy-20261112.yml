name: Lowcost root favicon guarded deploy and indexability validation 20261112
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-root-favicon-safe-deploy-20261112.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-prod-automation-controls
  cancel-in-progress: false
jobs:
  rollout:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Pinned SSH deploy 3-file change with backup and rollback
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          OLD=d4816fbcf5dabca6a27ba8288cd2abec50cb3733
          NEW=4c6e75e566dcf317624285fe4f92d5cbdd6ec2dc
          cd "$ROOT"
          gitrepo() { git -c safe.directory="$ROOT" -C "$ROOT" "$@"; }
          test "$(gitrepo rev-parse HEAD)" = "$OLD"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          test "$(gitrepo ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = "$NEW"
          gitrepo fetch --no-tags -q https://github.com/martaxi-boss/lowcost-europa.git main
          test "$(gitrepo rev-parse FETCH_HEAD)" = "$NEW"
          gitrepo merge-base --is-ancestor "$OLD" "$NEW"
          EXPECTED="$(printf '%s\n' apps/storefront/views.py apps/storefront/urls.py apps/storefront/tests/test_favicon.py | LC_ALL=C sort)"
          test "$(gitrepo diff --name-only "$OLD" "$NEW" | LC_ALL=C sort)" = "$EXPECTED"
          echo SEO_ONLY_THREE_FAVICON_CODE_FILES=PASS
          nginx -t >/dev/null 2>&1
          systemctl is-active --quiet lowcost-europa.service
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          test "$(systemctl show lowcost-europa.service -p CanReload --value)" = yes
          for unit in lowcost-europa-indexnow.timer lowcost-europa-affiliate-report.timer \
                      lowcost-europa-cavitation-availability.timer lowcost-europa-backup.timer \
                      lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer; do
            systemctl is-active --quiet "$unit"
          done
          for unit in lowcost-europa-catalog-maintenance.timer lowcost-europa-weekly-discovery.timer; do
            test "$(systemctl is-enabled "$unit" 2>/dev/null || true)" = disabled
            ! systemctl is-active --quiet "$unit"
          done
          test -d "$ROOT/private/ops" && test ! -L "$ROOT/private/ops"
          TASK="$(mktemp -d "$ROOT/private/ops/seo-favicon-XXXXXX")"
          chmod 700 "$TASK"
          CHANGED=0
          restore_if_needed() {
            code=$?
            trap - EXIT
            if test "$code" -ne 0 && test "$CHANGED" = 1; then
              gitrepo checkout --detach -q "$OLD" || true
              systemctl reload lowcost-europa.service || true
              echo SEO_FAVICON_ROLLBACK_ATTEMPTED=TRUE
            fi
            case "$TASK" in "$ROOT/private/ops"/seo-favicon-*) rm -rf -- "$TASK";; esac
            exit "$code"
          }
          trap restore_if_needed EXIT
          set -a
          . "$ROOT/private/systemd-env/lowcost-europa.env"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          sh "$ROOT/deploy/scripts/backup-postgres.sh"
          BACKUP="$(find "$ROOT/backups/daily" -maxdepth 1 -type f -name 'lowcost-europa-*.dump' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -s "$BACKUP" && test -s "$BACKUP.sha256"
          (cd "$ROOT/backups/daily" && sha256sum -c "$(basename "$BACKUP.sha256")" >/dev/null)
          echo SEO_FAVICON_DATABASE_BACKUP_VERIFIED=PASS
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PY' > "$TASK/manual.before"
          import django,hashlib,json
          django.setup()
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement
          from apps.catalog.services.manual_storefront import MANUAL_ONLY_FAMILY_SLUGS
          items=sorted(
            [p.offer_id,p.product_family.slug,p.offer.source,p.offer.affiliate_url]
            for p in OfferFamilyPlacement.objects.filter(product_family__slug__in=MANUAL_ONLY_FAMILY_SLUGS)
              .select_related('offer','product_family')
          )
          assert items and all(p[2]==Offer.Source.ALIEXPRESS_OWNER for p in items)
          print('URLS_COUNT='+str(len(items)))
          print('URLS_SHA256='+hashlib.sha256(json.dumps(items,sort_keys=True).encode()).hexdigest())
          print('CLICKS_COUNT='+str(OfferClick.objects.count()))
          PY
          test -s "$TASK/manual.before"
          CHANGED=1
          gitrepo checkout --detach -q "$NEW"
          while IFS= read -r path; do
            test -f "$ROOT/$path" && test ! -L "$ROOT/$path"
            chmod 644 "$ROOT/$path"
            runuser -u "$APPUSER" -- test -r "$ROOT/$path"
          done <<< "$EXPECTED"
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py check
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py makemigrations --check --dry-run
          systemctl reload lowcost-europa.service
          result=0
          for n in $(seq 1 35); do
            if curl -fsS --max-time 5 'https://www.lowcost-europa.eu/favicon.ico' -o "$TASK/fav.bin" \
              && cmp -s "$TASK/fav.bin" "$ROOT/apps/storefront/static/storefront/lowcost-europa-favicon.png"; then
                result=1
                break
            fi
            sleep 1
          done
          test "$result" = 1
          curl -fsSI --max-time 8 'https://www.lowcost-europa.eu/favicon.ico' > "$TASK/fav-head"
          grep -iq '^content-type: image/png' "$TASK/fav-head"
          grep -iq '^cache-control: public, max-age=86400' "$TASK/fav-head"
          echo SEO_FAVICON_ROOT_GET_HEAD_MATCH_BRAND=PASS
          curl -fsS --max-time 10 'https://www.lowcost-europa.eu/' -o "$TASK/home.html"
          grep -q 'lowcost-europa-favicon.png' "$TASK/home.html"
          curl -fsS --max-time 10 'https://www.lowcost-europa.eu/sitemap.xml' -o "$TASK/sitemap.xml"
          test "$(grep -o '<loc>' "$TASK/sitemap.xml" | wc -l)" = 23
          echo SEO_HOME_FAVICON_AND_SITEMAP_23=PASS
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PY' > "$TASK/manual.after"
          import django,hashlib,json
          django.setup()
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement
          from apps.catalog.services.manual_storefront import MANUAL_ONLY_FAMILY_SLUGS
          items=sorted(
            [p.offer_id,p.product_family.slug,p.offer.source,p.offer.affiliate_url]
            for p in OfferFamilyPlacement.objects.filter(product_family__slug__in=MANUAL_ONLY_FAMILY_SLUGS)
              .select_related('offer','product_family')
          )
          assert items and all(p[2]==Offer.Source.ALIEXPRESS_OWNER for p in items)
          print('URLS_COUNT='+str(len(items)))
          print('URLS_SHA256='+hashlib.sha256(json.dumps(items,sort_keys=True).encode()).hexdigest())
          print('CLICKS_COUNT='+str(OfferClick.objects.count()))
          PY
          test "$(sed -n '1,2p' "$TASK/manual.before")" = "$(sed -n '1,2p' "$TASK/manual.after")"
          click_before="$(sed -n 's/^CLICKS_COUNT=//p' "$TASK/manual.before")"
          click_after="$(sed -n 's/^CLICKS_COUNT=//p' "$TASK/manual.after")"
          test "$click_after" -ge "$click_before"
          cat "$TASK/manual.after"
          echo SEO_FAVICON_MANUAL_AFFILIATE_LINKS_UNCHANGED=PASS
          echo SEO_FAVICON_CLICK_HISTORY_NOT_DELETED=PASS
          for unit in lowcost-europa.service lowcost-europa-indexnow.timer \
                      lowcost-europa-affiliate-report.timer lowcost-europa-cavitation-availability.timer; do
            systemctl is-active --quiet "$unit"
          done
          for unit in lowcost-europa-catalog-maintenance.timer lowcost-europa-weekly-discovery.timer; do
            test "$(systemctl is-enabled "$unit" 2>/dev/null || true)" = disabled
          done
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          test "$(gitrepo rev-parse HEAD)" = "$NEW"
          test "$(gitrepo ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = "$NEW"
          nginx -t >/dev/null 2>&1
          echo SEO_FAVICON_GITHUB_VPS_ALIGNED=PASS
          echo SEO_FAVICON_GUARDED_ROLLOUT=PASS
          CHANGED=0
          REMOTE
