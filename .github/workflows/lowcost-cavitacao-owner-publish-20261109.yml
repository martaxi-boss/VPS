name: Lowcost Cavitacao owner-affiliate exact-links guarded replacement 20261109
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-cavitacao-owner-publish-20261109.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-cavitacao-manual-replacement
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Backup and atomically replace category 1 with 17 exact Owner-supplied affiliate links
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          EXPECTED=415270332e570cae935cfc47fc1a824bf6609693
          test -s "$ENVFILE" && test ! -L "$ENVFILE" && test -d "$ROOT/.git"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          exec 9>"$ROOT/private/ops/ptes-deploy.lock"
          flock -n 9
          systemctl is-active --quiet lowcost-europa.service
          nginx -t >/dev/null 2>&1
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          ENV_SHA="$(sha256sum "$ENVFILE" | awk '{print $1}')"
          sh "$ROOT/deploy/scripts/backup-postgres.sh"
          BACKUP="$(find "$ROOT/backups/daily" -maxdepth 1 -type f -name '*.dump' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -s "$BACKUP" && test -s "$BACKUP.sha256"
          (cd "$ROOT/backups/daily" && sha256sum -c "$(basename "$BACKUP.sha256")" >/dev/null)
          echo CAV_OWNER_BACKUP_SHA256=PASS
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PY'
          import django,hashlib
          from urllib import request,error
          from html.parser import HTMLParser
          django.setup()
          from django.db import transaction
          from django.utils import timezone
          from apps.catalog.models import Offer,OfferObservation,OfferFamilyPlacement,OfferClick,ProductFamily
          from apps.catalog.services.public_eligibility import public_eligibility_q
          from apps.catalog.services.offer_maintenance import select_maintenance_batch
          from apps.catalog.services.manual_candidate_intake import resolve_aliexpress_product_url
          from apps.integrations.aliexpress.affiliate_url import is_https_affiliate_url
          from apps.storefront.views import _family_queryset,_prepare_family
          SLUG="cavitacao-rf-vacuum-corpo"
          BASE="https://www.lowcost-europa.eu"
          expected=[
          ("1005012193878441","https://s.click.aliexpress.com/e/_c3UK1bHl"),
          ("1005012986165582","https://s.click.aliexpress.com/e/_c4Lzgx43"),
          ("1005013475210137","https://s.click.aliexpress.com/e/_c2wQDjzz"),
          ("1005013281932316","https://s.click.aliexpress.com/e/_c2x0EOun"),
          ("1005013139572255","https://s.click.aliexpress.com/e/_c4XeoZrp"),
          ("1005012684135880","https://s.click.aliexpress.com/e/_c2zqdO91"),
          ("1005010165916635","https://s.click.aliexpress.com/e/_c35duQBz"),
          ("1005010321198953","https://s.click.aliexpress.com/e/_c376CCpt"),
          ("1005013029911526","https://s.click.aliexpress.com/e/_c4FvGbQr"),
          ("1005013071722368","https://s.click.aliexpress.com/e/_c4s7YOO7"),
          ("1005013247320845","https://s.click.aliexpress.com/e/_c4BFwB5d"),
          ("1005013071707563","https://s.click.aliexpress.com/e/_c35XTWT9"),
          ("1005007300392491","https://s.click.aliexpress.com/e/_c4e7x4hh"),
          ("1005012079834974","https://s.click.aliexpress.com/e/_c3dBLPzN"),
          ("1005012454004727","https://s.click.aliexpress.com/e/_c2xHkkfH"),
          ("1005013212840427","https://s.click.aliexpress.com/e/_c3ZOknZl"),
          ("1005013070854347","https://s.click.aliexpress.com/e/_c3qslKyf"),
          ]
          assert len(expected)==17 and len(set(x[0] for x in expected))==17
          assert len(set(x[1] for x in expected))==17
          for n,(pid,link) in enumerate(expected,1):
              assert is_https_affiliate_url(link),n
              actual,_=resolve_aliexpress_product_url(link)
              assert actual==pid,("short-link product identity mismatch",n)
          print("CAV_OWNER_ALL_SHORT_LINK_IDENTITIES=PASS 17/17")
          target=ProductFamily.objects.get(slug=SLUG,display_order=1)
          assert target.status!="RETIRED"
          old_placements=list(OfferFamilyPlacement.objects.filter(product_family=target).values(
              "id","offer_id","selection_position","display_order","selection_reason","created_at","updated_at"))
          assert len(old_placements)==36, "Category 1 changed after read-only preflight: abort"
          old_ids={row["offer_id"] for row in old_placements}
          old_sources={}
          for pid,link in expected:
              old=Offer.objects.get(source=Offer.Source.ALIEXPRESS,external_product_id=pid)
              assert old.pk in old_ids and old.protocol_verified_at is not None
              assert old.title and old.image_url.startswith("https://")
              assert not Offer.objects.filter(source=Offer.Source.ALIEXPRESS_OWNER,external_product_id=pid).exists()
              old_sources[pid]=old
          others={
              f.pk:OfferFamilyPlacement.objects.filter(product_family=f).count()
              for f in ProductFamily.objects.exclude(pk=target.pk)}
          print("CAV_OWNER_EXISTING_PRODUCT_IMAGES=PASS 17/17")
          print("CAV_OWNER_OLD_PLACEMENTS_TO_REMOVE=36")
          print("CAV_OWNER_OTHER_CATEGORY_BASELINE=PASS")
          now=timezone.now()
          new_ids={}
          committed=False
          try:
              with transaction.atomic():
                  family=ProductFamily.objects.select_for_update().get(pk=target.pk)
                  placed=OfferFamilyPlacement.objects.select_for_update().filter(product_family=family)
                  assert set(placed.values_list("id",flat=True))=={x["id"] for x in old_placements}
                  placed.delete()
                  for order,(pid,link) in enumerate(expected,1):
                      original=old_sources[pid]
                      copy=Offer.objects.create(
                          source=Offer.Source.ALIEXPRESS_OWNER,external_product_id=pid,
                          product_family=family,title=original.title,
                          product_url=original.product_url,
                          image_url=original.image_url,affiliate_url=link,
                          affiliate_promotion_status=Offer.AffiliatePromotionStatus.UNKNOWN,
                          affiliate_promotion_verified_at=None,
                          protocol_verified_at=original.protocol_verified_at,
                          is_active=True,owner_hidden=False,is_primary=False,
                          equipment_type=original.equipment_type,
                          first_seen_at=original.first_seen_at,last_seen_at=now)
                      for market in ("PT","ES"):
                          q=OfferObservation.objects.filter(
                              offer=original,price__gt=0,currency__iexact="EUR")
                          q=q.filter(destination_country="ES") if market=="ES" else q.exclude(destination_country="ES")
                          obs=q.order_by("-observed_at","-pk").first()
                          if obs:
                              OfferObservation.objects.create(
                                  offer=copy,observed_at=obs.observed_at,
                                  destination_country="ES" if market=="ES" else "PT",
                                  price=obs.price,original_price=obs.original_price,
                                  currency=obs.currency,
                                  evaluation_rate_percent=obs.evaluation_rate_percent,
                                  sales_count=obs.sales_count,
                                  availability=OfferObservation.Availability.UNKNOWN)
                      OfferFamilyPlacement.objects.create(
                          offer=copy,product_family=family,
                          selection_position=None,display_order=order)
                      new_ids[pid]=copy.pk
                  assert OfferFamilyPlacement.objects.filter(product_family=family).count()==17
                  visible=OfferFamilyPlacement.objects.filter(product_family=family).filter(
                      public_eligibility_q(prefix="offer__"))
                  assert set(visible.values_list("offer_id",flat=True))==set(new_ids.values())
                  for fpk,n in others.items():
                      assert OfferFamilyPlacement.objects.filter(product_family_id=fpk).count()==n
              committed=True
              print("CAV_OWNER_ATOMIC_REPLACEMENT=PASS old=36 new=17")
              for pid,link in expected:
                  saved=Offer.objects.get(pk=new_ids[pid])
                  assert saved.source==Offer.Source.ALIEXPRESS_OWNER
                  assert saved.affiliate_url==link
                  assert saved.affiliate_promotion_verified_at is None
                  assert saved.pk not in [o.pk for o in select_maintenance_batch(20)]
                  print("CAV_OWNER_LINK "+pid+" id="+str(saved.pk)+
                      " sha256="+hashlib.sha256(link.encode()).hexdigest()+
                      " source=MANUAL_ONLY")
              class CardParser(HTMLParser):
                  def __init__(self):
                      super().__init__();self.ids=[];self.ctas=[]
                  def handle_starttag(self,tag,attrs):
                      a=dict(attrs)
                      if tag=="article" and "data-offer-card" in a:
                          self.ids.append(int(a["data-offer-id"]))
                      if tag=="a" and a.get("href","").startswith("/go/"):
                          self.ctas.append(a["href"])
              for locale in ("","/pt","/es"):
                  with request.urlopen(BASE+locale+"/products/"+SLUG+"/",timeout=25) as r:
                      assert r.status==200
                      html=r.read(1200000).decode("utf-8")
                  parsed=CardParser();parsed.feed(html)
                  assert set(parsed.ids)==set(new_ids.values()) and len(parsed.ids)==17,locale
                  assert set(parsed.ctas)=={"/go/"+str(v)+"/" for v in new_ids.values()},locale
                  print("CAV_OWNER_PUBLIC_HTML_"+(locale.strip("/").upper() or "BASE")+"=PASS cards=17")
              class NoRedirect(request.HTTPRedirectHandler):
                  def redirect_request(self,*args,**kwargs):return None
              opener=request.build_opener(NoRedirect)
              clicked_before=OfferClick.objects.filter(offer_id__in=new_ids.values()).count()
              for pid,link in expected:
                  req=request.Request(BASE+"/go/"+str(new_ids[pid])+"/",method="HEAD")
                  try:
                      r=opener.open(req,timeout=25)
                  except error.HTTPError as exc:
                      r=exc
                  assert r.code==302 and r.headers.get("Location")==link,("Affiliate redirect mismatch",pid)
                  assert "noindex" in r.headers.get("X-Robots-Tag","").lower()
              assert OfferClick.objects.filter(offer_id__in=new_ids.values()).count()==clicked_before
              print("CAV_OWNER_PUBLIC_HEAD_REDIRECTS_EXACT=PASS 17/17")
              print("CAV_OWNER_NO_FALSE_CLICKS=PASS")
              print("CAV_OWNER_OTHER_FOUR_CATEGORIES_UNCHANGED=PASS")
              print("CAV_OWNER_FINAL_STORE_COUNT=17")
          except Exception:
              if committed:
                  with transaction.atomic():
                      family=ProductFamily.objects.select_for_update().get(pk=target.pk)
                      current=list(OfferFamilyPlacement.objects.select_for_update().filter(
                          product_family=family).values_list("offer_id",flat=True))
                      assert set(current)==set(new_ids.values()) and len(current)==17,"Concurrent edits block recovery"
                      OfferFamilyPlacement.objects.filter(product_family=family).delete()
                      for row in old_placements:
                          place=OfferFamilyPlacement.objects.create(
                              pk=row["id"],offer_id=row["offer_id"],
                              product_family=family,
                              selection_position=row["selection_position"],
                              display_order=row["display_order"],
                              selection_reason=row["selection_reason"])
                          OfferFamilyPlacement.objects.filter(pk=place.pk).update(
                              created_at=row["created_at"],updated_at=row["updated_at"])
                      Offer.objects.filter(pk__in=new_ids.values()).update(owner_hidden=True)
                  print("CAV_OWNER_COMPENSATING_ROLLBACK=PASS restored=36")
              raise
          PY
          test "$(sha256sum "$ENVFILE" | awk '{print $1}')" = "$ENV_SHA"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          for unit in lowcost-europa.service lowcost-europa-catalog-maintenance.timer lowcost-europa-indexnow.timer lowcost-europa-backup.timer lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer lowcost-europa-affiliate-report.timer; do systemctl is-active --quiet "$unit"; done
          echo CAV_OWNER_ENV_UNCHANGED=PASS
          echo CAV_OWNER_SEVEN_UNITS=PASS
          echo CAV_OWNER_REPLACEMENT_COMPLETE=PASS
          REMOTE
