name: PINK External WireGuard Proof 034
on:
  push:
    branches: [builder/pink-wg-external-proof-034]
    paths: ['.github/workflows/pink-wg-external-proof-034.yml']
permissions:
  contents: read
concurrency:
  group: pink-external-wireguard-proof-034
  cancel-in-progress: false
jobs:
  proof:
    if: github.event.head_commit.message == 'Execute one temporary external WireGuard proof 034'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: One temporary external peer and exact host inverse
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass wireguard-tools >/dev/null
          umask 077
          workdir="$(mktemp -d)"
          remote_started=0
          cleanup() {
            outcome=$?
            trap - EXIT
            sudo ip link delete pink034ci 2>/dev/null || true
            if [ "$remote_started" = 1 ]; then
              if sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 ubuntu@146.59.145.3 'sudo -n python3 /var/backups/pink-iptv/task034-external-proof-r2/rollback.py cleanup'; then
                sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 ubuntu@146.59.145.3 'sudo -n systemctl stop pink034-rollback-r2.timer'
                echo ROLLBACK_WATCHDOG_DISARMED_AFTER_VERIFIED_INVERSE=PASS
              else
                echo HOST_INVERSE_PENDING_INDEPENDENT_WATCHDOG=YES
                outcome=1
              fi
            fi
            rm -f "$workdir/peer.key" "$workdir/peer.pub" "$workdir/client.conf" "$workdir/setup.sh" "$workdir/setup.log"
            rmdir "$workdir"
            echo RUNNER_PRIVATE_KEY_INTERFACE_REMOVED=PASS
            exit "$outcome"
          }
          trap cleanup EXIT
          test -z "$(sudo wg show interfaces)"
          ! ip link show pink034ci >/dev/null 2>&1
          wg genkey > "$workdir/peer.key"
          wg pubkey < "$workdir/peer.key" > "$workdir/peer.pub"
          target_ip="$(getent ahostsv4 api.github.com | awk '$2=="STREAM"{print $1;exit}')"
          test -n "$target_ip"
          cat > "$workdir/setup.sh" <<'SETUP'
          import os,sys,json,hashlib,subprocess,time,stat,ipaddress,base64
          from pathlib import Path
          
          ROOT=Path('/var/backups/pink-iptv/task034-external-proof-r2')
          IFACE='pink034'
          UNIT='pink034-rollback-r2'
          CHAINS=[('filter','INPUT','PINK034_IN'),('filter','FORWARD','PINK034_FWD'),('nat','POSTROUTING','PINK034_NAT')]
          
          def run(*args,check=True):
              p=subprocess.run(args,check=check,capture_output=True,text=True,timeout=20)
              return p.stdout
          
          def fw():
              return ''.join(t+' '+table+'\n'+run(t,'-w','5','-t',table,'-S')
                             for t in ('iptables','ip6tables') for table in ('filter','nat','mangle','raw'))
          
          def conf4():
              return {str(p):p.read_text().strip() for p in Path('/proc/sys/net/ipv4/conf').glob('*/*') if p.is_file()}
          
          def readiness():
              for service in ('ssh','nginx','postgresql','pink-iptv-backend','pink-tv-proof-final-isolated'):
                  run('systemctl','is-active','--quiet',service)
              assert run('curl','-sS','--max-time','5','-o','/dev/null','-w','%{http_code}',
                         'http://127.0.0.1:8010/openapi.json')=='200'
              run('pg_isready','-h','127.0.0.1','-p','5432','-t','3')
          
          def ipt(table,*args,check=True):return run('iptables','-w','5','-t',table,*args,check=check)
          
          def cleanup():
              if not (ROOT/'state.json').exists():return
              st=json.loads((ROOT/'state.json').read_text())
              # Every invocation is fixed to this task's interface, own chains and exact additions.
              links=json.loads(run('ip','-j','link','show'))
              present=any(x['ifname']==IFACE for x in links)
              if present:
                  actual=run('wg','show',IFACE,'public-key').strip()
                  expected=st.get('server_public_key')
                  index=next(x['ifindex'] for x in links if x['ifname']==IFACE)
                  assert index==st.get('ifindex') and expected is not None and actual in (expected,'(none)'), 'interface ownership changed'
                  run('ip','link','del',IFACE)
              for table,hook,chain in CHAINS:
                  rules=ipt(table,'-S').splitlines()
                  hookrule='-A '+hook+' -j '+chain
                  if hookrule in rules:ipt(table,'-D',hook,'-j',chain)
                  for entry in st['rules']:
                      if entry['table']==table and entry['args'][0]==chain:
                          test=subprocess.run(['iptables','-w','5','-t',table,'-C',*entry['args']],capture_output=True)
                          if test.returncode==0:ipt(table,'-D',*entry['args'])
                  if any(line.startswith('-N '+chain) for line in ipt(table,'-S').splitlines()):
                      assert not any(line.startswith('-A '+chain+' ') for line in ipt(table,'-S').splitlines()), 'unexpected owned-chain drift'
                      ipt(table,'-X',chain)
              # Restore this bounded test's value only with its manifest and no remaining VPN interface.
              assert not run('wg','show','interfaces').strip()
              baseline_conf=json.loads((ROOT/'baseline-ipv4-conf.json').read_text())
              current_conf=conf4()
              if 'active_conf' in st:
                  for p in baseline_conf:
                      assert current_conf[p]==st['active_conf'][p], 'concurrent IPv4 configuration drift'
              if Path('/proc/sys/net/ipv4/ip_forward').read_text().strip()!='0':
                  run('sysctl','-qw','net.ipv4.ip_forward=0')
              # Linux forwarding toggles may reset redirect/router defaults: restore only captured structural values.
              for p,v in baseline_conf.items():
                  if Path(p).read_text().strip()!=v:Path(p).write_text(v+'\n')
              assert all(conf4()[p]==v for p,v in baseline_conf.items())
              assert Path('/proc/sys/net/ipv6/conf/all/forwarding').read_text().strip()=='0'
              assert fw()==(ROOT/'baseline-firewall.txt').read_text()
              readiness()
              for filename in ('server-private.key','setup-state.tmp'):
                  p=ROOT/filename
                  if p.exists():p.unlink()
              assert not (ROOT/'server-private.key').exists()
              st['status']='ROLLED_BACK';st['completed_at_utc']=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
              (ROOT/'state.json').write_text(json.dumps(st,sort_keys=True))
              print('LIVE_EXACT_ADDITIVE_INVERSE=PASS',flush=True)
              print('HOST_INTERFACE_PRIVATE_KEY_REMOVED=PASS',flush=True)
              print('HOST_FIREWALL_FORWARDING_RESTORED=PASS',flush=True)
              print('HOST_IPV4_INTERFACE_CONFIGURATION_RESTORED=PASS',flush=True)
              print('EXISTING_SERVICES_API_DATABASE=PASS',flush=True)
              print('OBSERVED_AT_UTC='+st['completed_at_utc'],flush=True)
          
          assert os.geteuid()==0 and run('hostname').strip()=='vps-32bea5b6'
          os.umask(0o077)
          mode=sys.argv[1]
          if mode=='cleanup':
              cleanup();sys.exit(0)
          assert mode=='start'
          peer_key=os.environ['PINK034_PEER_KEY']
          assert len(base64.b64decode(peer_key,validate=True))==32
          target=str(ipaddress.IPv4Address(os.environ['PINK034_TARGET_IP']))
          assert ipaddress.IPv4Address(target).is_global
          runner=str(ipaddress.IPv4Address(os.environ['PINK034_RUNNER_IP']))
          assert ipaddress.IPv4Address(runner).is_global
          assert json.loads(Path('/var/backups/pink-iptv/task034-external-proof/state.json').read_text())['status']=='ROLLED_BACK'
          assert not Path('/var/backups/pink-iptv/task034-external-proof/server-private.key').exists()
          assert subprocess.run(['systemctl','is-active','--quiet','pink034-rollback.timer']).returncode!=0
          assert not ROOT.exists(), 'existing task state must be reconstructed before retry'
          readiness()
          assert Path('/proc/sys/net/ipv4/ip_forward').read_text().strip()=='0'
          assert Path('/proc/sys/net/ipv6/conf/all/forwarding').read_text().strip()=='0'
          assert not run('wg','show','interfaces').strip()
          assert not run('ss','-H','-lun','sport = :51820').strip()
          assert json.loads(run('ip','-j','route','show','default'))[0]['dev']=='ens3'
          assert fw()==Path('/var/backups/pink-iptv/task033-gateway/firewall-config.txt').read_text()
          for table,_,chain in CHAINS:assert chain not in ipt(table,'-S')
          assert IFACE not in {x['ifname'] for x in json.loads(run('ip','-j','link','show'))}
          ROOT.mkdir(parents=True,mode=0o700)
          (ROOT/'baseline-firewall.txt').write_text(fw())
          (ROOT/'baseline-ipv4-conf.json').write_text(json.dumps(conf4(),sort_keys=True))
          rules=[
              {'table':'filter','args':['PINK034_IN','-i','ens3','-s',runner+'/32','-p','udp','--dport','51820','-j','ACCEPT']},
              {'table':'filter','args':['PINK034_IN','-i',IFACE,'-s','10.66.0.2/32','-d','10.66.0.1/32','-p','icmp','-j','ACCEPT']},
              {'table':'filter','args':['PINK034_FWD','-i',IFACE,'-o','ens3','-s','10.66.0.2/32','-d',target+'/32','-p','tcp','--dport','443','-j','ACCEPT']},
              {'table':'filter','args':['PINK034_FWD','-i','ens3','-o',IFACE,'-d','10.66.0.2/32','-s',target+'/32','-m','conntrack','--ctstate','ESTABLISHED,RELATED','-j','ACCEPT']},
              {'table':'filter','args':['PINK034_FWD','-i',IFACE,'-j','DROP']},
              {'table':'nat','args':['PINK034_NAT','-s','10.66.0.2/32','-d',target+'/32','-o','ens3','-p','tcp','--dport','443','-j','MASQUERADE']},
          ]
          state={'status':'PREPARED','runner_ip':runner,'target_ip':target,'interface':IFACE,'server_public_key':None,'rules':rules}
          (ROOT/'state.json').write_text(json.dumps(state,sort_keys=True))
          # The fixed script is installed by the caller before starting the timed inverse.
          script=base64.b64decode(os.environ['PINK034_SCRIPT_B64'],validate=True)
          (ROOT/'rollback.py').write_bytes(script)
          run('python3','-m','py_compile',str(ROOT/'rollback.py'))
          run('systemd-run','--unit='+UNIT,'--on-active=15m','--timer-property=AccuracySec=1s',
              '--property=Type=oneshot','/usr/bin/python3',str(ROOT/'rollback.py'),'cleanup')
          run('systemctl','is-active','--quiet',UNIT+'.timer')
          print('INDEPENDENT_15_MINUTE_ROLLBACK=ARMED',flush=True)
          try:
              key=run('wg','genkey').strip();key_path=ROOT/'server-private.key';key_path.write_text(key+'\n')
              pub=subprocess.run(['wg','pubkey'],input=key+'\n',text=True,check=True,capture_output=True).stdout.strip()
              state['server_public_key']=pub;(ROOT/'state.json').write_text(json.dumps(state,sort_keys=True))
              run('ip','link','add',IFACE,'type','wireguard')
              state['ifindex']=next(x['ifindex'] for x in json.loads(run('ip','-j','link','show')) if x['ifname']==IFACE)
              (ROOT/'state.json').write_text(json.dumps(state,sort_keys=True))
              run('wg','set',IFACE,'private-key',str(key_path),'listen-port','51820',
                  'peer',peer_key,'allowed-ips','10.66.0.2/32')
              run('ip','address','add','10.66.0.1/24','dev',IFACE)
              run('ip','link','set','dev',IFACE,'mtu','1380','up')
              ipt('filter','-N','PINK034_IN')
              ipt('filter','-A','PINK034_IN','-i','ens3','-s',runner+'/32','-p','udp','--dport','51820','-j','ACCEPT')
              ipt('filter','-A','PINK034_IN','-i',IFACE,'-s','10.66.0.2/32','-d','10.66.0.1/32','-p','icmp','-j','ACCEPT')
              ipt('filter','-I','INPUT','1','-j','PINK034_IN')
              ipt('filter','-N','PINK034_FWD')
              ipt('filter','-A','PINK034_FWD','-i',IFACE,'-o','ens3','-s','10.66.0.2/32','-d',target+'/32',
                  '-p','tcp','--dport','443','-j','ACCEPT')
              ipt('filter','-A','PINK034_FWD','-i','ens3','-o',IFACE,'-d','10.66.0.2/32','-s',target+'/32',
                  '-m','conntrack','--ctstate','ESTABLISHED,RELATED','-j','ACCEPT')
              ipt('filter','-A','PINK034_FWD','-i',IFACE,'-j','DROP')
              ipt('filter','-I','FORWARD','1','-j','PINK034_FWD')
              ipt('nat','-N','PINK034_NAT')
              ipt('nat','-A','PINK034_NAT','-s','10.66.0.2/32','-d',target+'/32','-o','ens3','-p','tcp','--dport','443','-j','MASQUERADE')
              ipt('nat','-A','POSTROUTING','-j','PINK034_NAT')
              run('sysctl','-qw','net.ipv4.ip_forward=1')
              state['active_conf']=conf4();(ROOT/'state.json').write_text(json.dumps(state,sort_keys=True))
              assert '-P INPUT DROP' in ipt('filter','-S') and '-P FORWARD DROP' in ipt('filter','-S')
              assert len(run('wg','show',IFACE,'peers').splitlines())==1
              assert stat.S_IMODE(key_path.stat().st_mode)==0o600
              readiness()
              state['status']='ACTIVE';(ROOT/'state.json').write_text(json.dumps(state,sort_keys=True))
              print('ONE_TEMPORARY_PEER_READY=PASS',flush=True)
              print('SERVER_PUBLIC_KEY='+pub,flush=True)
          except BaseException:
              cleanup();raise
          SETUP
          remote_started=1
          { cat "$workdir/peer.pub"; printf '%s\n' "$target_ip"; cat "$workdir/setup.sh"; } | sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 ubuntu@146.59.145.3 'read -r peer; read -r target; runner="${SSH_CONNECTION%% *}"; sudo -n env PINK034_PEER_KEY="$peer" PINK034_TARGET_IP="$target" PINK034_RUNNER_IP="$runner" PINK034_SCRIPT_ python3 - start' > "$workdir/setup.log"
          sed -n '/INDEPENDENT_15_MINUTE_ROLLBACK=/p;/ONE_TEMPORARY_PEER_READY=/p' "$workdir/setup.log"
          server_pub="$(sed -n 's/^SERVER_PUBLIC_KEY=//p' "$workdir/setup.log")"
          test -n "$server_pub"
          {
            printf '[Interface]\nPrivateKey = '
            cat "$workdir/peer.key"
            printf '\n[Peer]\nPublicKey = %s\nEndpoint = 146.59.145.3:51820\nAllowedIPs = 10.66.0.0/24, %s/32\nPersistentKeepalive = 5\n' "$server_pub" "$target_ip"
          } > "$workdir/client.conf"
          sudo ip link add pink034ci type wireguard
          sudo wg setconf pink034ci "$workdir/client.conf"
          sudo ip address add 10.66.0.2/24 dev pink034ci
          sudo ip link set pink034ci mtu 1380 up
          ip route get 10.66.0.1 | awk '{for(i=1;i<=NF;i++)if($i=="dev")found=($(i+1)=="pink034ci")}END{exit !found}'
          sudo ip route add "$target_ip/32" dev pink034ci
          ping -n -c 3 -W 5 10.66.0.1 >/dev/null
          echo EXTERNAL_WIREGUARD_GATEWAY_PING=PASS
          handshake="$(sudo wg show pink034ci latest-handshakes | awk '{print $2}')"
          test "${handshake:-0}" -gt 0
          echo REAL_EXTERNAL_HANDSHAKE=PASS
          curl --interface pink034ci --resolve "api.github.com:443:$target_ip" --max-time 20 -fsS https://api.github.com/ -o /dev/null
          echo BOUNDED_HTTPS_NAT_EGRESS=PASS
          test "$(sudo wg show pink034ci peers | wc -l)" -eq 1
          echo EXACTLY_ONE_DEVICE_OWNED_TEST_PEER=PASS
          date -u '+PROOF_OBSERVED_AT_UTC=%Y-%m-%dT%H:%M:%SZ'
