name: Lowcost final mission - guarded evidence deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-final-mission-deploy-20261109.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-ptes-production-rollout
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Pin the existing VPS SSH identity and deploy with rollback
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          OLD=2092e65bf394c0772a824ff13d35f05569a726bd
          NEW=253a946fb8f8dc91e9cfcc11739c6976b614b1ea
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          TASK="$ROOT/private/ops/final-mission-20261109-retry1"
          mkdir -p -m 700 "$ROOT/private/ops"
          exec 9>"$ROOT/private/ops/ptes-deploy.lock"
          flock -n 9
          test ! -e "$TASK"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$OLD"
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = "$NEW"
          test "$(df -Pk "$ROOT" | awk 'END{print $4}')" -gt 500000
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          for unit in lowcost-europa.service lowcost-europa-indexnow.timer lowcost-europa-catalog-maintenance.timer lowcost-europa-backup.timer; do systemctl is-active --quiet "$unit"; done
          nginx -t >/dev/null 2>&1
          git -c safe.directory="$ROOT" -C "$ROOT" fetch -q https://github.com/martaxi-boss/lowcost-europa.git main
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse FETCH_HEAD)" = "$NEW"
          while IFS= read -r file; do
           case "$file" in
           apps/catalog/owner_panel_views.py|apps/catalog/services/commercial_evidence.py|apps/catalog/services/observation_display.py|apps/catalog/services/offer_maintenance.py|apps/catalog/services/public_eligibility.py|apps/catalog/services/market_observation.py|apps/catalog/management/commands/observe_market_offers.py|apps/catalog/templates/catalog/owner_panel/dashboard.html|apps/catalog/templates/catalog/owner_panel/commercial_table.html|apps/catalog/tests/test_commercial_evidence_owner.py|apps/catalog/tests/test_market_observation.py|apps/catalog/tests/test_owner_analytics_dashboard.py|apps/storefront/templates/storefront/components/offer_card.html|apps/storefront/ui_translations.py|docs/operations/final-mission-pt-es-20261109.md|docs/operations/final-mission-public-preflight-20261108.json) ;;
           *) echo "UNEXPECTED_SOURCE_PATH=$file"; exit 12;;
           esac
          done < <(git -c safe.directory="$ROOT" -C "$ROOT" diff --name-only "$OLD" "$NEW")
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" diff --name-only "$OLD" "$NEW" -- requirements deploy config apps/catalog/models.py apps/catalog/migrations)"
          sh "$ROOT/deploy/scripts/backup-postgres.sh"
          BACKUP="$(find "$ROOT/backups/daily" -maxdepth 1 -type f -name '*.dump' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$BACKUP" && test -s "$BACKUP" && test -s "$BACKUP.sha256"
          (cd "$ROOT/backups/daily" && sha256sum -c "$(basename "$BACKUP.sha256")" >/dev/null)
          echo LOWCOST_NEW_BACKUP=PASS
          mkdir -m 700 "$TASK"
          cp -a "$ENVFILE" "$TASK/env.before"
          printf '%s\n' "$OLD" > "$TASK/previous-source-sha"
          rollback() {
           result=$?; trap - EXIT
           if test "$result" -ne 0; then
            cp -a "$TASK/env.before" "$ENVFILE"
            git -c safe.directory="$ROOT" -C "$ROOT" checkout --detach -q "$OLD"
            if systemctl restart lowcost-europa.service && systemctl is-active --quiet lowcost-europa.service; then echo LOWCOST_ROLLBACK=PASS; else echo LOWCOST_ROLLBACK=FAILED; fi
           fi
           exit "$result"
          }
          trap rollback EXIT
          umask 022
          git -c safe.directory="$ROOT" -C "$ROOT" checkout --detach -q "$NEW"
          umask 077
          ENVFILE="$ENVFILE" python3 - <<'PYENV'
          import os
          from pathlib import Path
          p=Path(os.environ['ENVFILE']);old=p.read_text();key='GOOGLE_SEARCH_CONSOLE_PROPERTY'
          lines=[line for line in old.splitlines() if line.startswith(key+'=')]
          assert not lines or lines==[key+'=sc-domain:lowcost-europa.eu']
          if not lines:p.write_text(old+'\n'+key+'=sc-domain:lowcost-europa.eu\n')
          assert [line for line in p.read_text().splitlines() if not line.startswith(key+'=') and line.strip()]==[line for line in old.splitlines() if not line.startswith(key+'=') and line.strip()]
          print('NONSECRET_PROPERTY_SETTING_ONLY=PASS')
          PYENV
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py check
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py check --deploy
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py makemigrations --check --dry-run
          systemctl restart lowcost-europa.service
          systemctl is-active --quiet lowcost-europa.service
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYQA'
          import os,time,urllib.request,urllib.error,xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings.production')
          import django
          django.setup()
          from django.contrib.auth import get_user_model
          from django.test import RequestFactory
          from apps.catalog.owner_panel_views import dashboard
          from apps.catalog.models import ExternalMetricsSnapshot
          from apps.catalog.services.windsor_search_console_reporting import collect_search_console_report,SearchConsoleReportError
          class Tags(HTMLParser):
           def __init__(self):super().__init__();self.can=[];self.alt={};self.robots=[]
           def handle_starttag(self,t,a):
            a=dict(a)
            if t=='link' and a.get('rel')=='canonical':self.can.append(a.get('href'))
            if t=='link' and a.get('rel')=='alternate':self.alt[a.get('hreflang')]=a.get('href')
            if t=='meta' and a.get('name')=='robots':self.robots.append(a.get('content'))
          base='https://www.lowcost-europa.eu'
          def get(path):
           with urllib.request.urlopen(base+path,timeout=20) as r:return r.status,r.headers,r.read().decode()
          for attempt in range(20):
           try:
            if get('/')[0]==200:break
           except (urllib.error.URLError,TimeoutError):time.sleep(.5)
          else:raise AssertionError('readiness')
          status,_,xml=get('/sitemap.xml');assert status==200
          urls=[n.text for n in ET.fromstring(xml).iter('{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          assert len(urls)==len(set(urls))==23
          for url in urls:
           status,headers,body=get(url[len(base):]);assert status==200
           parser=Tags();parser.feed(body);assert parser.can==[url],url
           assert not any('noindex' in x for x in parser.robots)
           if '/products/' in url or url in [base+'/',base+'/pt/',base+'/es/']:
            assert set(parser.alt)=={'pt-PT','es-ES','x-default'},url
           if '/products/' in url:
            assert 'Dados de referência para Portugal' in body or 'Datos de referencia para Portugal' in body,url
          assert get('/robots.txt')[0]==200
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect)
          for path in ['/painel/','/admin/']:
           try:r=opener.open(base+path,timeout=20)
           except urllib.error.HTTPError as e:
            assert e.code==302 and 'noindex' in e.headers['X-Robots-Tag'] and 'private' in e.headers['Cache-Control'];e.close()
           else:raise AssertionError('private route exposed')
          owner=get_user_model().objects.filter(is_staff=True,is_active=True).first();assert owner
          request=RequestFactory().get('/painel/',secure=True,HTTP_HOST='www.lowcost-europa.eu');request.user=owner
          response=dashboard(request);assert response.status_code==200
          assert 'Espanha — apenas observações com destino ES'.encode() in response.content
          assert 'Leitura configurada — a aguardar dados'.encode() in response.content
          print('PUBLIC_23_CANONICAL_HREFLANG=PASS')
          print('PRIVATE_PANEL_MARKET_AND_GSC_RENDER=PASS')
          assert os.environ.get('GOOGLE_SEARCH_CONSOLE_PROPERTY')=='sc-domain:lowcost-europa.eu'
          before=ExternalMetricsSnapshot.objects.filter(source='GOOGLE_SEARCH_CONSOLE').count()
          try:
           report,start,end=collect_search_console_report()
          except SearchConsoleReportError as exc:
           print('GSC_SERVER_READ='+type(exc).__name__)
           assert before==ExternalMetricsSnapshot.objects.filter(source='GOOGLE_SEARCH_CONSOLE').count()
          else:
           assert report['property']=='sc-domain:lowcost-europa.eu'
           ExternalMetricsSnapshot.objects.update_or_create(source='GOOGLE_SEARCH_CONSOLE',defaults={'period_start':start,'period_end':end,'payload':report})
           print('GSC_SERVER_READ=VERIFIED_SNAPSHOT')
          print('NO_FABRICATED_METRICS=PASS')
          PYQA
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$NEW"
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          nginx -t >/dev/null 2>&1
          for unit in lowcost-europa.service lowcost-europa-indexnow.timer lowcost-europa-catalog-maintenance.timer lowcost-europa-backup.timer; do systemctl is-active --quiet "$unit"; done
          echo "LOWCOST_DEPLOYED_SHA=$NEW"
          echo LOWCOST_FINAL_MISSION_DEPLOY=PASS
          trap - EXIT
          REMOTE
