name: Lowcost publish two owner microdermo links 20261113
on:
  push:
    paths: [.github/workflows/lowcost-microdermo-publish-two-20261113.yml]
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Guarded SSH add two owner links and verify
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -euo pipefail
          cd /srv/projects/lowcost-europa
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = '4c6e75e566dcf317624285fe4f92d5cbdd6ec2dc'
          systemctl is-active --quiet lowcost-europa.service
          sh deploy/scripts/backup-postgres.sh
          BACKUP="$(find backups/daily -maxdepth 1 -type f -name 'lowcost-europa-*.dump' | sort | tail -n1)"
          test -s "$BACKUP" && test -s "$BACKUP.sha256"
          (cd backups/daily && sha256sum -c "$(basename "$BACKUP.sha256")" >/dev/null)
          echo MICRODERMO_PREWRITE_BACKUP_VERIFIED=PASS
          set -a
          . private/systemd-env/lowcost-europa.env
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u le001_1789265592 -- .venv/bin/python - <<'PY'
          import django
          django.setup()
          from django.db import transaction
          from django.core.management import call_command
          from django.test import Client
          from io import StringIO
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement,ProductFamily
          from apps.catalog.services.manual_storefront import MANUAL_ONLY_FAMILY_SLUGS
          from apps.catalog.services.public_eligibility import public_eligibility_q
          urls=['https://s.click.aliexpress.com/e/_c3Li4I0x','https://s.click.aliexpress.com/e/_c2zWtlHh']
          slug='hydrodermoabrasao-aqua-facial-multifuncoes'
          fam=ProductFamily.objects.get(slug=slug)
          def rows(s):
              return set((p.offer_id,p.offer.affiliate_url) for p in OfferFamilyPlacement.objects.filter(product_family__slug=s).select_related('offer'))
          before={s:rows(s) for s in MANUAL_ONLY_FAMILY_SLUGS}
          assert len(before[slug])==14
          clicks=OfferClick.objects.count()
          with transaction.atomic():
              for i,url in enumerate(urls,1):
                  out=StringIO()
                  call_command('publish_owner_affiliate_link',url,family=slug,stdout=out)
                  assert 'new_placement=TRUE' in out.getvalue()
                  print('MICRODERMO_NEW_LINK_'+str(i)+'=PASS')
              after=rows(slug)
              assert len(after)==16 and before[slug].issubset(after)
              assert {v for _,v in after}-{v for _,v in before[slug]}==set(urls)
              assert OfferFamilyPlacement.objects.filter(product_family=fam).filter(public_eligibility_q(prefix='offer__')).count()==16
              for s in MANUAL_ONLY_FAMILY_SLUGS:
                  if s!=slug:assert rows(s)==before[s]
          for url in urls:
              offer=Offer.objects.get(source=Offer.Source.ALIEXPRESS_OWNER,affiliate_url=url)
              resp=Client().head('/go/'+str(offer.pk)+'/',secure=True,HTTP_HOST='www.lowcost-europa.eu')
              assert resp.status_code==302 and resp['Location']==url
          assert OfferClick.objects.count()>=clicks
          print('MICRODERMO_16_MANUAL_LINKS=PASS')
          print('MICRODERMO_14_OLD_LINKS_AND_FOUR_CATEGORIES_UNCHANGED=PASS')
          print('MICRODERMO_TWO_EXACT_HEAD_REDIRECTS=PASS')
          print('MICRODERMO_ALL_FIVE_CATEGORIES='+str(sum(len(rows(s)) for s in MANUAL_ONLY_FAMILY_SLUGS)))
          PY
          curl -fsS --max-time 20 'https://www.lowcost-europa.eu/products/hydrodermoabrasao-aqua-facial-multifuncoes/' -o /dev/null
          systemctl is-active --quiet lowcost-europa.service
          echo MICRODERMO_SITE_HTTP_200=PASS
          REMOTE
