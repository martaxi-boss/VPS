name: Lowcost ES supplier evidence - bounded official API diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-es-supplier-probe-once-20261109.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-es-supplier-diagnostic
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Existing authenticated VPS SSH and 5 read-only supplier detail probes for ES
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "2092e65bf394c0772a824ff13d35f05569a726bd"
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = "le001_1789265592"
          systemctl is-active --quiet lowcost-europa.service
          cd "$ROOT"
          set -a
          . "$ROOT/private/systemd-env/lowcost-europa.env"
          set +a
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PY'
          from collections import Counter
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings.production')
          import django
          django.setup()
          from apps.catalog.models import Offer
          from apps.catalog.services.public_eligibility import public_eligibility_q
          from apps.integrations.aliexpress.client import AliExpressClient
          from apps.integrations.aliexpress.exceptions import AliExpressError, AliExpressRateLimitError
          ids=list(Offer.objects.filter(public_eligibility_q()).order_by('-last_seen_at').values_list('external_product_id',flat=True)[:5])
          assert len(ids)==5
          client=AliExpressClient()
          counts=Counter()
          print('ES_SUPPLIER_DIAGNOSTIC_API=OFFICIAL_AFFILIATE_PRODUCT_DETAIL')
          print('ES_SUPPLIER_DIAGNOSTIC_MAX=5')
          for product_id in ids:
              try:
                  value=client.get_product_detail(product_id,country='ES',currency='EUR')
                  counts['response_success']+=1
                  counts['es_country']+=int(value.destination_country=='ES')
                  counts['eur_price']+=int(value.price is not None and value.price>0 and (value.currency or '').upper()=='EUR')
                  counts['numerical_delivery']+=int(value.delivery_days is not None)
                  counts['availability_signal']+=int(bool(value.availability_raw))
              except AliExpressRateLimitError:
                  counts['rate_limit_stop']+=1
                  break
              except AliExpressError as exc:
                  counts['external_error_'+exc.__class__.__name__]+=1
          for k,v in sorted(counts.items()):
              print('ES_SUPPLIER_'+k.upper()+'='+str(v))
          print('ES_SUPPLIER_DB_WRITES=0')
          print('ES_SUPPLIER_NO_AFFILIATE_LINK_GENERATION=PASS')
          print('ES_SUPPLIER_DIAGNOSTIC=COMPLETED')
          PY
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "2092e65bf394c0772a824ff13d35f05569a726bd"
          systemctl is-active --quiet lowcost-europa.service
          echo LOWCOST_ES_PROBE_LIVE_SITE_UNCHANGED=PASS
          REMOTE
