name: Lowcost Cavitation affiliate and Google counters read-only audit 20261109
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-cavitation-affiliate-audit-20261109.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-cavitation-affiliate-proof
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify published Cavitation offers, redirects and current tracking
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/cav-kh"
          chmod 600 "$RUNNER_TEMP/cav-kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/cav-kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/cav-kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          EXPECTED=19090664e63ab00ffca86947c5109f0a906bc4a7
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          test -s "$ENVFILE" && test ! -L "$ENVFILE"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          systemctl is-active --quiet lowcost-europa.service
          nginx -t >/dev/null 2>&1
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          ENV_SHA="$(sha256sum "$ENVFILE" | awk '{print $1}')"
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PY'
          import json, os, re
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib import error, request
          from urllib.parse import urlsplit
          import django
          django.setup()
          from django.utils import timezone
          from django.utils.translation import override
          from apps.catalog.models import OfferClick, ExternalMetricsSnapshot
          from apps.catalog.services.search_referral_metrics import read_private_report
          from apps.storefront.views import _family_queryset, _prepare_family
          from apps.integrations.aliexpress.affiliate_url import is_https_affiliate_url
          from apps.integrations.aliexpress.client import AliExpressClient
          from apps.integrations.aliexpress.config import AliExpressConfig
          from apps.integrations.aliexpress.exceptions import AliExpressError, AliExpressRateLimitError

          slug = 'cavitacao-rf-vacuum-corpo'
          base = 'https://www.lowcost-europa.eu'
          now = timezone.now()
          with override('pt-pt'):
              family = _prepare_family(_family_queryset().get(slug=slug))
          offers = family.active_offers
          assert offers and len(offers)==len({o.pk for o in offers})
          public_ids={o.pk for o in offers}
          print('CAV_PRODUCTION_SOURCE_SHA=PASS')
          print('CAV_VISIBLE_OFFERS='+str(len(offers)))
          print('CAV_FEATURED='+str(len(family.selection_placements)))
          print('CAV_OTHER='+str(len(family.other_placements)))

          class Cards(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.cards={}
                  self.active=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='article' and 'data-offer-card' in a:
                      oid=int(a['data-offer-id'])
                      if oid in self.cards:raise AssertionError('Duplicate public card')
                      self.cards[oid]=[]
                      self.active=oid
                  if tag=='a' and self.active is not None:
                      href=a.get('href','')
                      if href.startswith('/go/'):
                          self.cards[self.active].append(href)
              def handle_endtag(self,tag):
                  if tag=='article':self.active=None

          for locale in ('', '/pt', '/es'):
              with request.urlopen(base+locale+'/products/'+slug+'/',timeout=25) as res:
                  assert res.status==200
                  html=res.read(1000000).decode('utf-8')
              p=Cards()
              p.feed(html)
              assert set(p.cards)==public_ids, 'Published card IDs mismatch'
              for oid,urls in p.cards.items():
                  assert urls==['/go/'+str(oid)+'/'], 'Wrong visible affiliate CTA'
              print('CAV_PUBLIC_HTML_'+(locale.strip('/').upper() or 'BASE')+'=PASS offers='+str(len(p.cards)))

          class NoRedirect(request.HTTPRedirectHandler):
              def redirect_request(self,*a,**kw):return None
          opener=request.build_opener(NoRedirect)
          before=OfferClick.objects.filter(offer_id__in=public_ids).count()
          ok_count=0
          hosts=Counter()
          for o in offers:
              host=urlsplit(o.affiliate_url).hostname if o.affiliate_url else ''
              hosts[host or '?']+=1
              verified_age=(now-o.affiliate_promotion_verified_at).total_seconds()/3600 if o.affiliate_promotion_verified_at else -1
              valid=bool(is_https_affiliate_url(o.affiliate_url)
                    and host and (host=='aliexpress.com' or host.endswith('.aliexpress.com'))
                    and o.affiliate_promotion_status=='ELIGIBLE'
                    and o.affiliate_promotion_verified_at is not None
                    and o.product_url.startswith('https://'))
              outcome='INVALID_AFFILIATE_DATA'
              if valid:
                  try:
                      res=opener.open(request.Request(base+'/go/'+str(o.pk)+'/',method='HEAD'),timeout=20)
                  except error.HTTPError as e:
                      res=e
                  if res.code==302 and res.headers.get('Location')==o.affiliate_url \
                      and 'noindex' in res.headers.get('X-Robots-Tag','').lower():
                      outcome='STORED_AND_PUBLIC_HEAD_PASS'
                      ok_count+=1
                  else:outcome='HEAD_MISMATCH'
              title=re.sub(r'[\x00-\x1f\x7f]',' ',o.title or '').strip()[:65]
              print('CAV_PRODUCT '+json.dumps({'id':o.pk,'product':o.external_product_id,
                'title':title,'affiliate_host':host,'promotion_verified_hours_ago':int(verified_age),
                'check':outcome},ensure_ascii=True,separators=(',',':')))
          after=OfferClick.objects.filter(offer_id__in=public_ids).count()
          assert before==after, 'HEAD must not create a click'
          print('CAV_NO_FALSE_CLICKS=PASS')
          print('CAV_DB_PUBLIC_REDIRECTS='+str(ok_count)+'/'+str(len(offers)))
          print('CAV_AFFILIATE_HOSTS='+json.dumps(hosts,sort_keys=True))

          local=read_private_report(Path('/srv/projects/lowcost-europa/.local-metrics/search-referrers.json'))
          if local:
              counts={x['name']:x['requests'] for x in local['rows']}
              print('GOOGLE_LOCAL_COUNTER=FRESH')
              print('GOOGLE_LOCAL_COUNT_LAST_UPDATED='+local['checked_at'].isoformat())
              print('GOOGLE_LOCAL_7D_REQUESTS='+str(counts['Google']))
              print('SEARCH_ENGINES_LOCAL_7D_REQUESTS='+str(local['total']))
          else:print('GOOGLE_LOCAL_COUNTER=UNAVAILABLE_OR_STALE')

          snapshot=ExternalMetricsSnapshot.objects.filter(source='GOOGLE_SEARCH_CONSOLE').first()
          good=bool(snapshot and isinstance(snapshot.payload,dict)
              and snapshot.payload.get('property')=='sc-domain:lowcost-europa.eu')
          print('GOOGLE_OFFICIAL_PANEL_SNAPSHOT='+('PRESENT' if good else 'AWAITING'))
          if good:
              print('GOOGLE_OFFICIAL_PANEL_SNAPSHOT_AGE_HOURS='+
                  str(int((now-snapshot.checked_at).total_seconds()//3600)))
          provider=os.environ.get('GOOGLE_SEARCH_CONSOLE_PROVIDER','WINDSOR').upper()
          authorization=bool(os.environ.get('GOOGLE_SEARCH_CONSOLE_PROPERTY')==
              'sc-domain:lowcost-europa.eu' and (
                bool(os.environ.get('WINDSOR_API_KEY')) if provider=='WINDSOR' else
                all(os.environ.get(k) for k in ('GOOGLE_OAUTH_CLIENT_ID',
                'GOOGLE_OAUTH_CLIENT_SECRET','GOOGLE_OAUTH_REFRESH_TOKEN'))))
          print('GOOGLE_OFFICIAL_PANEL_PROVIDER='+provider if provider in
              ('WINDSOR','GOOGLE_OFFICIAL') else 'GOOGLE_OFFICIAL_PANEL_PROVIDER=INVALID')
          print('GOOGLE_OFFICIAL_PANEL_ENV_AUTH_PRESENT='+str(authorization).upper())

          try:
              client=AliExpressClient(config=AliExpressConfig.from_env())
              print('ALIEXPRESS_ACCOUNT_TRACKING_CONFIG=PASS')
          except Exception as e:
              client=None
              print('ALIEXPRESS_ACCOUNT_TRACKING_CONFIG=ERROR_'+type(e).__name__)

          matched=differs=errors=verified=0
          if client:
              for o in offers:
                  if not o.product_url:
                      print('CAV_OFFICIAL_API '+str(o.pk)+' MISSING_PRODUCT_URL')
                      errors+=1
                      continue
                  try:
                      fresh=client.generate_affiliate_link(o.product_url)
                  except AliExpressRateLimitError:
                      print('CAV_OFFICIAL_API RATE_LIMIT_ABORT')
                      errors+=1
                      break
                  except (AliExpressError,Exception) as e:
                      print('CAV_OFFICIAL_API '+str(o.pk)+' ERROR_'+type(e).__name__)
                      errors+=1
                      continue
                  if not is_https_affiliate_url(fresh):
                      print('CAV_OFFICIAL_API '+str(o.pk)+' INVALID_NEW_LINK')
                      errors+=1
                      continue
                  verified+=1
                  if fresh==o.affiliate_url:
                      matched+=1
                      print('CAV_OFFICIAL_API '+str(o.pk)+' EXACT_ACCOUNT_TRACKING_LINK')
                  else:
                      differs+=1
                      print('CAV_OFFICIAL_API '+str(o.pk)+' DIFFERENT_FRESH_ACCOUNT_LINK')
          print('CAV_OFFICIAL_API_EXACT_MATCHES='+str(matched))
          print('CAV_OFFICIAL_API_DIFFERENCES='+str(differs))
          print('CAV_OFFICIAL_API_SUCCESSES='+str(verified)+'/'+str(len(offers)))
          print('CAV_OFFICIAL_API_ERRORS='+str(errors))
          if matched==len(offers) and ok_count==len(offers) and not errors:
              print('CAV_AFFILIATE_AUDIT=ALL_VISIBLE_LINKS_MATCH_LIVE_ALIEXPRESS_ACCOUNT')
          else:
              print('CAV_AFFILIATE_AUDIT=NOT_FULLY_ATTESTED')
          print('CAV_READ_ONLY_AUDIT_COMPLETED=PASS')
          PY
          test "$(sha256sum "$ENVFILE" | awk '{print $1}')" = "$ENV_SHA"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$EXPECTED"
          systemctl is-active --quiet lowcost-europa.service
          echo CAV_APP_AND_SECRETS_UNCHANGED=PASS
          REMOTE
