name: Ferrari F9 verified rollback and apt cleanup one-shot
on:
  push:
    branches: [main]
    paths:
      - ferrari-release-requests/ferrari-f9-apt-backup-final-20261106.json
      - ferrari-release-requests/ferrari-f9-apt-apply-20261106.json
permissions:
  contents: read
concurrency:
  group: ferrari-phase9-exact-eight-apt-20261106
  cancel-in-progress: false
jobs:
  f9:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact mode SHA and original project-only scope
        id: gate
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          added="$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER")"
          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          test "$added" = "$changed"
          case "$changed" in
            ferrari-release-requests/ferrari-f9-apt-backup-final-20261106.json) mode=backup ;;
            ferrari-release-requests/ferrari-f9-apt-apply-20261106.json) mode=apply ;;
            *) echo 'F9_REQUEST_UNAUTHORIZED'; exit 2 ;;
          esac
          python3 - "$changed" "$mode" <<'PY'
          import json,sys
          from pathlib import Path
          p,mode=sys.argv[1:]
          obj=json.loads(Path(p).read_text())
          assert obj=={'version':1,'phase':9,'mode':mode,'sha':'60b6a338df7ed4d5be07934bb691fa592c4b0636',
                       'packages':8,'private_only':True,'other_projects':'untouched'}
          print('FERRARI_F9_SIGNED_SCOPE=PASS '+mode)
          PY
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 60b6a338df7ed4d5be07934bb691fa592c4b0636
          persist-credentials: false
          path: ferrari
      - name: Pin existing VPS SSH host and prepare runner only
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/known"
          chmod 600 "$RUNNER_TEMP/known"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/known" -E sha256 | awk '{print $2}')" = SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Guarded F9 backup or exact-eight APT cleanup on existing Ferrari VPS
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          F9_MODE: ${{ steps.gate.outputs.mode }}
        run: |
          set -Eeuo pipefail
          test -f ferrari/install/vps-phase9-apt-reconcile.py
          python3 -m py_compile ferrari/install/vps-phase9-apt-reconcile.py
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known"
                -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          set +e
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            "sudo -n /usr/bin/python3 - --$F9_MODE" \
            < ferrari/install/vps-phase9-apt-reconcile.py \
            > "$RUNNER_TEMP/ferrari-f9-result.json"
          remote_rc=$?
          set -e
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'ferrari-f9-result.json'
          doc=json.loads(p.read_text())
          print('FERRARI_F9_MODE='+os.environ['F9_MODE'])
          print('FERRARI_F9_STATUS='+str(doc.get('status')))
          print('FERRARI_F9_PACKAGES_SAFELY_REMOVED='+str(doc.get('packages_removed',0)))
          print('FERRARI_F9_PACKAGES_BACKED_UP='+str(doc.get('packages_backed_up',0)))
          print('FERRARI_F9_PROTECTED_SERVICES='+str(doc.get('protected_services_active','unverified')))
          expected='rollback_archives_ready' if os.environ['F9_MODE']=='backup' else 'private_eight_global_purged'
          if doc.get('status')!=expected:raise SystemExit('FERRARI_F9_FAILED_CHECK_REPORT')
          PY
          test "$remote_rc" = 0
          echo 'FERRARI_F9_GUARDED_STAGE=PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ferrari-f9-apt-${{ steps.gate.outputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ferrari-f9-result.json
          if-no-files-found: warn
          retention-days: 14
