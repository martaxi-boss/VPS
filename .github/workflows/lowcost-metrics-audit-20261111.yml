name: Lowcost metrics private read-only audit 20261111
on:
  push:
    paths:
      - .github/workflows/lowcost-metrics-audit-20261111.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lowcost-metrics-audit-readonly-20261111
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify existing pinned SSH host
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
      - name: Inspect only sanitized metrics and authorization flags on existing VPS
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          test -d "$ROOT/.git" && test -s "$ENVFILE" && test ! -L "$ENVFILE"
          systemctl is-active --quiet lowcost-europa.service
          test "$(systemctl show lowcost-europa.service -p User --value)" = le001_1789265592
          cd "$ROOT"
          printf 'LOWCOST_RUNTIME_HEAD=%s\n' "$(git -c safe.directory="$ROOT" rev-parse --short=12 HEAD)"
          for unit in lowcost-europa-affiliate-report.timer lowcost-europa-backup.timer; do
            if systemctl is-active --quiet "$unit"; then
              printf 'TIMER_%s=ACTIVE\n' "$unit"
            else
              printf 'TIMER_%s=INACTIVE\n' "$unit"
            fi
          done
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u le001_1789265592 -- "$ROOT/.venv/bin/python" - <<'PY'
          import os
          from datetime import timedelta
          from pathlib import Path
          import django
          django.setup()
          from django.utils import timezone
          from apps.catalog.models import ExternalMetricsSnapshot, OfferClick
          from apps.catalog.services.search_referral_metrics import read_private_report
          now = timezone.now()
          print("READONLY_CHECK_AT_UTC="+now.strftime("%Y-%m-%dT%H:%M:%SZ"))
          print("GSC_SOURCE="+os.getenv("GOOGLE_SEARCH_CONSOLE_PROVIDER","WINDSOR").upper())
          print("GSC_PROPERTY_CORRECT="+str(os.getenv("GOOGLE_SEARCH_CONSOLE_PROPERTY")=="sc-domain:lowcost-europa.eu").upper())
          print("GSC_OFFICIAL_CREDENTIALS_PRESENT="+str(all(os.getenv(s) for s in ("GOOGLE_OAUTH_CLIENT_ID","GOOGLE_OAUTH_CLIENT_SECRET","GOOGLE_OAUTH_REFRESH_TOKEN"))).upper())
          print("GSC_WINDSOR_CREDENTIAL_PRESENT="+str(bool(os.getenv("WINDSOR_API_KEY"))).upper())
          for source in ("ALIEXPRESS","GOOGLE_SEARCH_CONSOLE"):
            snap = ExternalMetricsSnapshot.objects.filter(source=source).first()
            print(source+"_SNAPSHOT_PRESENT="+str(bool(snap)).upper())
            if snap and isinstance(snap.payload,dict):
              p=snap.payload
              print(source+"_SNAPSHOT_AGE_MINUTES="+str(int((now-snap.checked_at).total_seconds()//60)))
              if source=="ALIEXPRESS":
                print("ALIEXPRESS_PAID_COUNT="+str(p.get("paid_count","UNKNOWN")))
                print("ALIEXPRESS_RECEIVED_COUNT="+str(p.get("received_count","UNKNOWN")))
                print("ALIEXPRESS_TRACKING_GROUPS="+str(len(p.get("by_tracking",[]))))
              else:
                print("GSC_PROVIDER_IN_SNAPSHOT="+str(p.get("provider","UNSPECIFIED")))
                print("GSC_CLICKS="+str(p.get("clicks","UNKNOWN")))
                print("GSC_IMPRESSIONS="+str(p.get("impressions","UNKNOWN")))
          local=read_private_report(Path("/srv/projects/lowcost-europa/.local-metrics/search-referrers.json"),now=now)
          print("LOCAL_REPORT_PRESENT="+str(local is not None).upper())
          if local:
            print("LOCAL_REPORT_AGE_MINUTES="+str(int((now-local["checked_at"]).total_seconds()//60)))
            print("LOCAL_SEARCH_REQUESTS_7D="+str(local["total"]))
            for x in local["rows"]:
              print("LOCAL_"+x["name"].upper()+"_REQUESTS_7D="+str(x["requests"]))
            meta=local.get("meta")
            print("LOCAL_META_REPORT_PRESENT="+str(isinstance(meta,dict)).upper())
            if isinstance(meta,dict):
              for k in ("today","yesterday","total","paid_tagged","facebook","instagram"):
                print("LOCAL_META_"+k.upper()+"="+str(meta.get(k,"UNKNOWN")))
          print("OUTBOUND_YESTERDAY="+str(OfferClick.objects.filter(clicked_at__date=timezone.localdate(now)-timedelta(days=1)).count()))
          print("OUTBOUND_TODAY="+str(OfferClick.objects.filter(clicked_at__date=timezone.localdate(now)).count()))
          print("LOWCOST_METRICS_AUDIT_READONLY=PASS")
          PY
          REMOTE
