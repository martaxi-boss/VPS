name: Ferrari REA MCP catalog parity - one-time read-only
on:
  workflow_run:
    workflows: ['Ferrari Ubuntu - independent VPS installation']
    types: [completed]
permissions:
  contents: read
jobs:
  catalog:
    if: >-
      github.event.workflow_run.id == 41708388146 &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify existing pinned VPS SSH host
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/ferrari-mcp-host"
          chmod 600 "$RUNNER_TEMP/ferrari-mcp-host"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/ferrari-mcp-host" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
      - name: Load pinned read-only MCP comparison from the Ferrari repository
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 80 \
            --output "$RUNNER_TEMP/ferrari-rea-mcp-parity.py" \
            'https://raw.githubusercontent.com/martaxi-boss/skill-universal/2f4a5873b21e4c0f04de421e57f2f6a99f9fdf8e/install/vps-rea-mcp-parity-audit.py'
          test -s "$RUNNER_TEMP/ferrari-rea-mcp-parity.py"
          python3 -m py_compile "$RUNNER_TEMP/ferrari-rea-mcp-parity.py"
      - name: Compare legacy and Ferrari original MCP tool lists on VPS
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-mcp-host" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'python3 -' \
            < "$RUNNER_TEMP/ferrari-rea-mcp-parity.py" > "$RUNNER_TEMP/parity.json"
          python3 - "$RUNNER_TEMP/parity.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text().strip())
          print(json.dumps(r,sort_keys=True))
          if r.get('status')!='PARITY_PASS':
              print('FERRARI_REA_MCP_PARITY=NOT_CERTIFIED')
              sys.exit(3)
          print('FERRARI_REA_MCP_PARITY=PASS')
          PY
      - name: Preserve comparison JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-rea-mcp-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/parity.json
          if-no-files-found: warn
          retention-days: 7
