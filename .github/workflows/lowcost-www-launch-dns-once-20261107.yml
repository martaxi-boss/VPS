name: Lowcost www commercial launch DNS preflight (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-www-launch-dns-once-20261107.yml'
permissions:
  contents: read
jobs:
  dns:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify Dynadot DNS before public commercial cutover
        shell: bash
        run: |
          set -euo pipefail
          for host in lowcost-europa.eu www.lowcost-europa.eu; do
            authoritative="$(dig +time=3 +tries=1 +short @ns1.dyna-ns.net "$host" A | sort -u | tr '\n' ' ')"
            public="$(dig +time=3 +tries=1 +short @1.1.1.1 "$host" A | sort -u | tr '\n' ' ')"
            printf 'HOST=%s AUTHORITATIVE_A=%s PUBLIC_A=%s\n' "$host" "$authoritative" "$public"
            if [[ "$authoritative" == '146.59.145.3 ' && "$public" == '146.59.145.3 ' ]]; then
              echo "PUBLIC_DOMAIN_A_STATUS=READY"
            else
              echo "PUBLIC_DOMAIN_A_STATUS=PENDING_DYNADOT"
            fi
            aaaa="$(dig +time=3 +tries=1 +short @ns1.dyna-ns.net "$host" AAAA | tr '\n' ' ')"
            printf 'PUBLIC_DOMAIN_AAAA=%s\n' "$aaaa"
          done
          echo "MAIL_MX=$(dig +time=3 +tries=1 +short @ns1.dyna-ns.net lowcost-europa.eu MX | tr '\n' ' ')"
          echo "MAIL_SPF_PRESENT=$(dig +time=3 +tries=1 +short @ns1.dyna-ns.net lowcost-europa.eu TXT | grep -Fq v=spf1 && echo yes || echo no)"
          echo "MAIL_DKIM_CNAME=$(dig +time=3 +tries=1 +short @ns1.dyna-ns.net default._domainkey.lowcost-europa.eu CNAME | tr '\\n' ' ')"
          echo "MAIL_DKIM_TXT_CHAIN=$(dig +time=3 +tries=1 +short @1.1.1.1 default._domainkey.lowcost-europa.eu TXT | grep -Fq v=DKIM1 && echo resolvable || echo not_resolved)"
          echo "MAIL_DMARC_PRESENT=$(dig +time=3 +tries=1 +short @ns1.dyna-ns.net _dmarc.lowcost-europa.eu TXT | grep -Fq v=DMARC1 && echo yes || echo no)"
          echo LOWCOST_WWW_LAUNCH_AUDIT_READ_ONLY=PASS
