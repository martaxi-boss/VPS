name: Lowcost Strong Audit 2026-09-28

on:
  push:
    branches:
      - 'ops/lowcost-strong-audit-*'
    paths:
      - '.github/workflows/lowcost-strong-audit-20260928.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit Lowcost Europa runtime, catalog and AliExpress permission
        env:
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VPS_SSH_PASSWORD:-}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$VPS_SSH_PASSWORD"

          cat >/tmp/remote_audit.sh <<'SH'
          set -euo pipefail

          echo "=== RUNTIME ==="
          echo "HOST=$(hostname)"
          echo "NOW_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "APP_ACTIVE=$(systemctl is-active lowcost-europa.service 2>/dev/null || true)"
          echo "NGINX_ACTIVE=$(systemctl is-active nginx 2>/dev/null || true)"
          echo "POSTGRES_ACTIVE=$(systemctl is-active postgresql 2>/dev/null || true)"
          echo "GIT_HEAD=$(git -C /srv/lowcost-europa rev-parse HEAD 2>/dev/null || true)"
          echo "GIT_BRANCH=$(git -C /srv/lowcost-europa branch --show-current 2>/dev/null || true)"
          WT="$(git -C /srv/lowcost-europa status --short 2>/dev/null || true)"
          if [ -z "$WT" ]; then echo "WORKTREE=CLEAN"; else echo "WORKTREE=DIRTY"; printf '%s
' "$WT"; fi
          echo "PUBLIC_HOME=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 15 https://lowcost-europa.duckdns.org/ || true)"
          echo "PUBLIC_HEALTH=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 15 https://lowcost-europa.duckdns.org/health/ready/ || true)"

          echo "=== TIMERS ==="
          systemctl list-timers --all --no-pager | grep -Ei 'lowcost|catalog' || true
          echo "=== MAINTENANCE_SERVICE ==="
          systemctl show lowcost-europa-catalog-maintenance.service -p ActiveState -p Result -p ExecMainStatus -p ExecMainStartTimestamp -p ExecMainExitTimestamp 2>/dev/null || true
          echo "=== MAINTENANCE_RECENT_LOGS ==="
          journalctl -u lowcost-europa-catalog-maintenance.service --since '2026-09-23 18:00:00' --no-pager -n 120 2>/dev/null | grep -E 'offers_selected|detail_attempts|available_confirmed|unavailable_confirmed|offers_deactivated|promotion_|failures|Started|Finished|Failed' || true

          set -a
          . /etc/lowcost-europa/lowcost-europa.env
          set +a
          cd /srv/lowcost-europa

          echo "=== DJANGO_DB_AUDIT ==="
          .venv/bin/python manage.py shell <<'PY'
          from collections import Counter
          from datetime import timedelta
          from django.utils import timezone
          from apps.catalog.models import ProductFamily, Offer, OfferObservation, OfferCandidate, OfferFamilyPlacement, CandidateDecision, OfferClick
          from apps.catalog.services.public_eligibility import public_eligibility_q

          now=timezone.now()
          cutoff=now-timedelta(days=7)

          families=list(ProductFamily.objects.exclude(status=ProductFamily.Status.RETIRED).order_by("display_order","pk"))
          pub_q=public_eligibility_q(as_of=now)

          print(f"NOW={now.isoformat()}")
          print(f"FAMILIES_ACTIVE={len(families)}")
          print(f"OFFERS_TOTAL={Offer.objects.count()}")
          print(f"OFFERS_ACTIVE={Offer.objects.filter(is_active=True).count()}")
          print(f"OFFERS_INACTIVE={Offer.objects.filter(is_active=False).count()}")
          print(f"OFFERS_OWNER_VISIBLE={Offer.objects.filter(owner_hidden=False).count()}")
          print(f"OFFERS_OWNER_HIDDEN={Offer.objects.filter(owner_hidden=True).count()}")
          print(f"OFFERS_PUBLIC_ELIGIBLE={Offer.objects.filter(pub_q).distinct().count()}")
          print(f"PROMO_ELIGIBLE={Offer.objects.filter(affiliate_promotion_status='ELIGIBLE').count()}")
          print(f"PROMO_INELIGIBLE={Offer.objects.filter(affiliate_promotion_status='INELIGIBLE').count()}")
          print(f"PROMO_UNKNOWN={Offer.objects.filter(affiliate_promotion_status='UNKNOWN').count()}")
          print(f"PROTOCOL_MISSING={Offer.objects.filter(protocol_verified_at__isnull=True).count()}")
          print(f"PROTOCOL_STALE={Offer.objects.filter(protocol_verified_at__lt=cutoff).count()}")
          print(f"CANDIDATES_TOTAL={OfferCandidate.objects.count()}")
          print(f"CANDIDATES_PENDING={OfferCandidate.objects.filter(status='PENDING').count()}")
          print(f"CANDIDATES_APPROVED={OfferCandidate.objects.filter(status='APPROVED').count()}")
          print(f"CANDIDATES_REJECTED={OfferCandidate.objects.filter(status='REJECTED').count()}")
          print(f"DECISIONS_TOTAL={CandidateDecision.objects.count()}")
          print(f"OBSERVATIONS_TOTAL={OfferObservation.objects.count()}")
          print(f"CLICKS_TOTAL={OfferClick.objects.count()}")

          print("FAMILY_COUNTS_BEGIN")
          for fam in families:
              placements=OfferFamilyPlacement.objects.filter(product_family=fam)
              offer_ids=placements.values_list("offer_id",flat=True)
              offers=Offer.objects.filter(id__in=offer_ids)
              public=offers.filter(pub_q).distinct()
              pending=OfferCandidate.objects.filter(product_family=fam,status='PENDING')
              print(
                  f"FAMILY slug={fam.slug} placements={placements.count()} offers={offers.count()} "
                  f"active={offers.filter(is_active=True).count()} public={public.count()} pending={pending.count()}"
              )
          print("FAMILY_COUNTS_END")

          print("PUBLIC_OFFERS_BEGIN")
          for fam in families:
              placements=(OfferFamilyPlacement.objects.filter(product_family=fam,offer__in=Offer.objects.filter(pub_q))
                          .select_related("offer").order_by("selection_position","display_order","pk"))
              for pl in placements:
                  o=pl.offer
                  print(f"PUBLIC family={fam.slug} offer={o.pk} product={o.external_product_id} pos={pl.selection_position or '-'} verified={o.protocol_verified_at.isoformat() if o.protocol_verified_at else '-'}")
          print("PUBLIC_OFFERS_END")

          since=timezone.datetime(2026,9,23,17,5,17,tzinfo=timezone.utc)
          recent_unavail=(OfferObservation.objects.filter(availability='UNAVAILABLE',observed_at__gte=since)
                          .select_related("offer").order_by("observed_at"))
          print(f"RECENT_UNAVAILABLE_OBS={recent_unavail.count()}")
          print("RECENT_UNAVAILABLE_BEGIN")
          for obs in recent_unavail[:100]:
              fams=",".join(obs.offer.family_placements.values_list("product_family__slug",flat=True))
              print(f"UNAVAILABLE at={obs.observed_at.isoformat()} offer={obs.offer_id} product={obs.offer.external_product_id} active={obs.offer.is_active} families={fams}")
          print("RECENT_UNAVAILABLE_END")

          recent_ineligible=(Offer.objects.filter(affiliate_promotion_status='INELIGIBLE',affiliate_promotion_verified_at__gte=since)
                             .order_by("affiliate_promotion_verified_at"))
          print(f"RECENT_PROMO_INELIGIBLE={recent_ineligible.count()}")
          print("RECENT_PROMO_INELIGIBLE_BEGIN")
          for o in recent_ineligible[:100]:
              fams=",".join(o.family_placements.values_list("product_family__slug",flat=True))
              print(f"PROMO_INELIGIBLE at={o.affiliate_promotion_verified_at.isoformat() if o.affiliate_promotion_verified_at else '-'} offer={o.pk} product={o.external_product_id} active={o.is_active} hidden={o.owner_hidden} families={fams}")
          print("RECENT_PROMO_INELIGIBLE_END")

          print("NONPUBLIC_REASON_COUNTS_BEGIN")
          placed_ids=OfferFamilyPlacement.objects.filter(product_family__in=families).values_list("offer_id",flat=True).distinct()
          placed=Offer.objects.filter(id__in=placed_ids)
          counts=Counter()
          for o in placed:
              if not o.is_active:
                  counts["inactive"]+=1
              if o.owner_hidden:
                  counts["owner_hidden"]+=1
              if not o.affiliate_url:
                  counts["missing_affiliate_url"]+=1
              if o.affiliate_promotion_status!="ELIGIBLE":
                  counts[f"promo_{o.affiliate_promotion_status.lower()}"]+=1
              if o.affiliate_promotion_verified_at is None:
                  counts["promo_verified_missing"]+=1
              if o.protocol_verified_at is None:
                  counts["protocol_missing"]+=1
              elif o.protocol_verified_at < cutoff:
                  counts["protocol_stale"]+=1
          for k,v in sorted(counts.items()):
              print(f"{k}={v}")
          print("NONPUBLIC_REASON_COUNTS_END")

          print("PENDING_CANDIDATES_BEGIN")
          for fam in families:
              qs=OfferCandidate.objects.filter(product_family=fam,status='PENDING').order_by("-last_observed_at","pk")[:5]
              for c in qs:
                  print(
                      f"PENDING family={fam.slug} candidate={c.pk} product={c.external_product_id} "
                      f"price={c.price or '-'} currency={c.currency or '-'} search_days={c.search_delivery_days or '-'} detail_days={c.detail_delivery_days or '-'}"
                  )
          print("PENDING_CANDIDATES_END")
          PY

          echo "=== ALIEXPRESS_FREIGHT_PERMISSION_RETEST ==="
          .venv/bin/python manage.py shell <<'PY'
          from apps.integrations.aliexpress.client import AliExpressClient
          from apps.integrations.aliexpress.exceptions import AliExpressAPIError, AliExpressError

          client=AliExpressClient()
          product_id="1005013211231892"
          countries=("PL","CZ","FR","ES","DE")
          for country in countries:
              try:
                  data=client._call(
                      "aliexpress.social.product.freight.query",
                      {
                          "product_id":product_id,
                          "quantity":1,
                          "ship_to_country":"PT",
                          "ship_from_country":country,
                          "currency":"EUR",
                      },
                  )
              except Exception as exc:
                  msg=" ".join(str(exc).split())
                  if "InsufficientPermission" in msg or "does not have permission" in msg:
                      state="INSUFFICIENT_PERMISSION"
                  elif "MissingParameter" in msg:
                      state="METHOD_REACHED_MISSING_PARAMETER"
                  else:
                      state=f"ERROR_{exc.__class__.__name__}"
                  print(f"SOCIAL_FREIGHT country={country} state={state} message={msg[:220]}")
              else:
                  print(f"SOCIAL_FREIGHT country={country} state=AUTHORIZED_RESPONSE type={type(data).__name__}")
          PY
          SH

          sshpass -e ssh             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -o StrictHostKeyChecking=accept-new             -o ConnectTimeout=10             ubuntu@146.59.145.3             'sudo -n bash -s' < /tmp/remote_audit.sh
