name: REA HTTPS DNS inspection 20261022
on:
  push:
    branches:
      - trial/rea-chatgpt-20261022
    paths:
      - "ops/rea_https_dns_inspect_20261022.py"
      - ".github/workflows/rea-https-dns-inspect-20261022.yml"
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate read-only inspection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/rea_https_dns_inspect_20261022.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path("ops/rea_https_dns_inspect_20261022.py").read_text()
          assert "REA_HTTPS_DNS_READONLY_20261022" in s
          for dangerous in ("unlink(", "write_text(", "rm -rf", "apt-get", "systemctl restart", "nginx -s"):
              assert dangerous not in s, dangerous
          PY
      - name: Verify VPS identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/rea-dns-known"
          chmod 600 "$RUNNER_TEMP/rea-dns-known"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/rea-dns-known" -E sha256 | awk '{print $2}')" = "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc"
      - name: Install SSH helper on temporary runner only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Inspect Nginx DNS and certificate readiness
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rea-dns-known" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 ubuntu@146.59.145.3 'sudo -n python3 -' \
            < ops/rea_https_dns_inspect_20261022.py
