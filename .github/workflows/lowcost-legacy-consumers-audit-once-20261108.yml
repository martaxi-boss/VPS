name: Lowcost legacy DNS consumer audit (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-legacy-consumers-audit-once-20261108.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-legacy-consumers-audit-20261108
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify one-file scope and pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git diff --name-only HEAD^ HEAD)" == '.github/workflows/lowcost-legacy-consumers-audit-once-20261108.yml' ]]
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/known_hosts"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/known_hosts" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
      - name: Inspect only Lowcost runtime legacy dependencies without values
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SSHPASS" ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          [[ -d "$ROOT/.git" && -d "$ROOT/private" ]]
          printf 'LOWCOST_AUDIT_SITE_SHA='
          git -c "safe.directory=$ROOT" -C "$ROOT" rev-parse HEAD
          python3 - <<'PYAUDIT'
          from pathlib import Path
          locations=[
              Path("/srv/projects/lowcost-europa/private/systemd-env/lowcost-europa.env"),
              Path("/etc/lowcost-europa/lowcost-europa.env"),
          ]
          targets=("lowcost-europa.duckdns.org","lowcost-europa.146-59-145-3.sslip.io","lowcost-europa.165-22-114-67.sslip.io")
          for p in locations:
              if p.is_file():
                  keys=set()
                  for ln in p.read_text(encoding="utf-8").splitlines():
                      if "=" not in ln or ln.lstrip().startswith("#"): continue
                      k,v=ln.split("=",1)
                      if any(h in v.lower() for h in targets) and k.strip().isidentifier(): keys.add(k.strip())
                  print("LOWCOST_AUDIT_LEGACY_ENV_KEY_NAMES="+",".join(sorted(keys)) if keys else "LOWCOST_AUDIT_LEGACY_ENV_KEY_NAMES=NONE")
                  print("LOWCOST_AUDIT_ENV_SOURCE=LOWCOST_PROJECT_PRIVATE")
                  break
          else:
              print("LOWCOST_AUDIT_ENV_SOURCE=UNKNOWN")
          for p in (Path("/etc/nginx/sites-enabled/lowcost-europa-temp"),Path("/etc/nginx/sites-available/lowcost-europa-temp"),Path("/etc/nginx/sites-enabled/lowcost-europa-eu.conf")):
              print("LOWCOST_AUDIT_NGINX_"+p.name.replace(".","_")+"="+("PRESENT" if p.is_file() else "ABSENT"))
          for name in ("lowcost-europa.duckdns.org","lowcost-europa.146-59-145-3.sslip.io","lowcost-europa.165-22-114-67.sslip.io","lowcost-europa.eu"):
              p=Path("/etc/letsencrypt/renewal")/(name+".conf")
              print("LOWCOST_AUDIT_CERT_"+name.replace(".","_").replace("-","_")+"="+("PRESENT" if p.is_file() else "ABSENT"))
          PYAUDIT
          echo LOWCOST_AUDIT_CERT_CONSUMERS_BEGIN
          for name in lowcost-europa.duckdns.org lowcost-europa.146-59-145-3.sslip.io lowcost-europa.165-22-114-67.sslip.io; do
            printf 'LOWCOST_AUDIT_CERT_REFERENCED_%s=' "$name"
            grep -rlF "/etc/letsencrypt/live/$name/" /etc/nginx /etc/systemd/system 2>/dev/null | sed -e 's|^/etc/||' | paste -sd, - || true
          done
          echo LOWCOST_AUDIT_CERT_CONSUMERS_END
          nginx -t >/dev/null 2>&1 && echo LOWCOST_AUDIT_NGINX=PASS
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-catalog-maintenance.timer
          echo LOWCOST_AUDIT_SERVICE=PASS
          echo LOWCOST_AUDIT_READ_ONLY=PASS
          REMOTE
