name: Coordinator AI read-only live smoke

# Explicit Owner Issue only. PRs never see SSH credentials or start Codex.
on:
  issues:
    types: [opened]
  pull_request:
    paths:
      - '.github/workflows/coordinator-ai-smoke.yml'
      - 'ops/coordinator-smoke-remote.sh'
      - 'ops/tests/test_coordinator_smoke.py'

permissions: {}

jobs:
  offline-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4
        with:
          persist-credentials: false
      - name: Validate bounded smoke without accounts or model calls
        run: |
          bash -n ops/coordinator-smoke-remote.sh
          python3 -m unittest discover -s ops/tests -p test_coordinator_smoke.py -v

  coordinator-smoke:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[coordinator smoke] Test real de planeamento read-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: coordinator-ai-smoke-\${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Read verified smoke from repository main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4
        with:
          ref: \${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify Owner-observed Ed25519 VPS host identity
        shell: bash
        run: |
          set -euo pipefail
          expected='SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          known_hosts="$RUNNER_TEMP/coordinator_smoke_known_hosts"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$known_hosts" || exit 2
          chmod 600 "$known_hosts"
          observed="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}')"
          test "$observed" = "$expected" || exit 2
          ssh-keygen -F 146.59.145.3 -f "$known_hosts" >/dev/null || exit 2
          echo 'COORDINATOR_SSH_PIN=VERIFIED'

      - name: Prepare disposable SSH client
        shell: bash
        env:
          SSHPASS: \${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || exit 2
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Invoke exactly one read-only Coordinator test on VPS
        id: smoke
        continue-on-error: true
        shell: bash
        env:
          SSHPASS: \${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          job="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$job" =~ ^[1-9][0-9]{7,14}-[1-9][0-9]{0,3}$ ]] || exit 12
          output="$RUNNER_TEMP/coordinator_smoke_result.txt"
          test -f ops/coordinator-smoke-remote.sh || exit 12
          bash -n ops/coordinator-smoke-remote.sh || exit 12
          # The script travels through stdin; no code, secret or extra process
          # is installed persistently on the VPS. Never print raw remote text.
          timeout --signal=TERM --kill-after=10s 40m \
            sshpass -e ssh -T -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/coordinator_smoke_known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=5 \
            ubuntu@146.59.145.3 "bash -s -- '$job'" \
            < ops/coordinator-smoke-remote.sh > "$output" 2>/dev/null || exit 12
          python3 - "$output" "$RUNNER_TEMP/coordinator_smoke_verified.json" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys
          raw = Path(sys.argv[1]).read_bytes()
          expected = re.compile(
              rb'COORDINATOR_SMOKE_STATUS=PASS\n'
              rb'TARGET_REPOSITORY=martaxi-boss/Project-leader-codex\n'
              rb'TARGET_SHA=([0-9a-f]{40})\n'
              rb'PHASE_COUNT=([1-8])\n'
              rb'FIRST_PHASE_WORKERS=([12])\n'
              rb'FIRST_PHASE_MODE=(serial|parallel)\n\Z')
          match = expected.fullmatch(raw)
          if not match or (match.group(2) == b'2' and match.group(3) == b'0'):
              raise SystemExit(12)
          verified = {'target': 'martaxi-boss/Project-leader-codex',
                      'head': match.group(1).decode('ascii'),
                      'phase_count': int(match.group(2)),
                      'workers': int(match.group(3)),
                      'mode': match.group(4).decode('ascii')}
          Path(sys.argv[2]).write_text(json.dumps(verified), encoding='ascii')
          PY
          echo 'COORDINATOR_READ_ONLY_PLAN=VERIFIED'

      - name: Send allowlisted status to Owner Issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 2
          python3 - <<'PY_EOF'
          import json, os
          from pathlib import Path
          good = os.environ.get('SMOKE_OUTCOME') == 'success'
          result = Path(os.environ['RUNNER_TEMP']) / 'coordinator_smoke_verified.json'
          if good and result.is_file():
              data = json.loads(result.read_text(encoding='ascii'))
              lines = [
                  '## Coordenador IA: VERIFIED_READ_ONLY_PLAN',
                  '',
                  'Real signed-in Codex planning completed with no worker dispatch.',
                  '',
                  'Target: martaxi-boss/Project-leader-codex',
                  'SHA: ' + data['head'],
                  'Phases: ' + str(data['phase_count']),
                  'First phase workers: ' + str(data['workers']),
                  'Mode: ' + data['mode'],
              ]
          else:
              lines = [
                  '## Coordenador IA: NOT_CERTIFIED',
                  '',
                  'Read-only smoke did not return a verified valid plan.',
                  'No implementation workers were dispatched by this workflow.',
              ]
          lines.extend(['', 'Actions evidence: ' + os.environ['RUN_URL']])
          path = Path(os.environ['RUNNER_TEMP']) / 'coordinator_smoke_comment.md'
          path.write_text(chr(10).join(lines) + chr(10), encoding='utf-8')
          PY_EOF
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/coordinator_smoke_comment.md"

      - name: Enforce certified result
        if: always()
        shell: bash
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: test "$SMOKE_OUTCOME" = success
