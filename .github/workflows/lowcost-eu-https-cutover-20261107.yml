name: Lowcost Europa independent post-HTTPS launch technical QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-eu-https-cutover-20261107.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Guard scope and independently test production HTTPS/DNS
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")" == '.github/workflows/lowcost-eu-https-cutover-20261107.yml' ]]
          for resolver in ns1.dyna-ns.net ns2.dyna-ns.net 1.1.1.1; do
            for host in lowcost-europa.eu www.lowcost-europa.eu; do
              [[ "$(dig +short @"$resolver" "$host" A | sort -u)" == 146.59.145.3 ]]
              [[ -z "$(dig +short @"$resolver" "$host" AAAA)" ]]
            done
            [[ "$(dig +short @"$resolver" lowcost-europa.eu MX)" == '0 webhost.dynadot.com.' ]]
            dig +short @"$resolver" lowcost-europa.eu TXT | grep -Fq 'v=spf1 mx include:webhost-mail-out.dynadot.com'
            dig +short @"$resolver" default._domainkey.lowcost-europa.eu CNAME | grep -Fq 'clients._domainkey.webhost.dynadot.com.'
            dig +short @"$resolver" _dmarc.lowcost-europa.eu TXT | grep -Fq 'v=DMARC1; p=none'
          done
          echo LOWCOST_INDEPENDENT_DNS_SITE_MAIL=PASS
          hdr_www="$(curl -fsSI --max-time 30 https://www.lowcost-europa.eu/)"
          printf '%s\n' "$hdr_www" | grep -Eiq '^x-robots-tag:.*noindex'
          www_body="$(curl -fsSL --max-time 30 https://www.lowcost-europa.eu/)"
          [[ "$www_body" == *'id="familias"'* ]]
          printf '%s\n' "$www_body" | grep -q 'lowcost-europa.eu'
          root_hdr="$(curl -fsSI --max-time 30 https://lowcost-europa.eu/)"
          printf '%s\n' "$root_hdr" | grep -Eq '^HTTP/.* 301'
          printf '%s\n' "$root_hdr" | grep -Eiq '^location: https://www.lowcost-europa.eu/'
          old="$(curl -fsSI --max-time 30 https://lowcost-europa.duckdns.org/)"
          printf '%s\n' "$old" | grep -Eiq '^x-robots-tag:.*noindex'
          echo LOWCOST_INDEPENDENT_HTTPS_WWW_APEX_DUCKDNS=PASS
      - name: Verify pinned VPS SSH host identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/khost"
          chmod 600 "$RUNNER_TEMP/khost"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/khost" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          echo LOWCOST_INDEPENDENT_HOST_PIN=PASS
      - name: Read-only VPS Django Nginx certificate, catalog, and IP-country checks
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/khost" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          root=/srv/projects/lowcost-europa
          user=le001_1789265592
          [[ "$(git -c "safe.directory=$root" -C "$root" rev-parse HEAD)" == bb3921b646102cba0af0f397bddfde8b2f37d39a ]]
          [[ -z "$(git -c "safe.directory=$root" -C "$root" status --porcelain=v1 --untracked-files=no)" ]]
          systemctl is-active --quiet lowcost-europa.service
          nginx -t >/dev/null 2>&1
          [[ -L /etc/nginx/sites-enabled/lowcost-europa-eu.conf ]]
          [[ "$(readlink /etc/nginx/sites-enabled/lowcost-europa-eu.conf)" == "$root/deploy/nginx/lowcost-europa.eu.conf" ]]
          [[ ! -e /etc/nginx/sites-enabled/lowcost-europa-eu-acme.conf ]]
          envfile="$root/private/systemd-env/lowcost-europa.env"
          grep -Eq '^DJANGO_PUBLIC_SITE_URL=https://www.lowcost-europa.eu$' "$envfile"
          grep -E '^DJANGO_ALLOWED_HOSTS=' "$envfile" | grep -qF www.lowcost-europa.eu
          grep -E '^DJANGO_CSRF_TRUSTED_ORIGINS=' "$envfile" | grep -qF https://www.lowcost-europa.eu
          ! grep -Eq '^DJANGO_PUBLIC_INDEXING_ENABLED=true$' "$envfile"
          test -f "$root/private/deploy-rollbacks/www-https-20261107/env.bak"
          test -f "$root/private/deploy-rollbacks/dynadot-dns-cutover-20261107/dns-before.json"
          echo LOWCOST_QA_SHA_NGINX_ENV_ROLLBACK=PASS
          cert=/etc/letsencrypt/live/lowcost-europa.eu/fullchain.pem
          san="$(openssl x509 -in "$cert" -noout -ext subjectAltName)"
          [[ "$san" == *'DNS:lowcost-europa.eu'* && "$san" == *'DNS:www.lowcost-europa.eu'* ]]
          openssl x509 -in "$cert" -checkend 2592000 -noout >/dev/null
          test -f /etc/letsencrypt/renewal/lowcost-europa.eu.conf
          if systemctl list-timers --all --no-legend | grep -Eq '(certbot|snap.certbot.renew)'; then
            echo LOWCOST_QA_CERT_RENEWAL_TIMER=FOUND
          elif test -e /etc/cron.d/certbot || test -e /etc/cron.daily/certbot; then
            echo LOWCOST_QA_CERT_RENEWAL_CRON=FOUND
          else
            echo LOWCOST_QA_CERT_RENEWAL_SCHEDULER=NOT_VERIFIED
          fi
          echo LOWCOST_QA_SSL_SAN_VALIDITY_RENEWAL_FILE=PASS
          url=http://127.0.0.1:8001
          home="$(curl -fsS --max-time 18 -H 'Host: www.lowcost-europa.eu' -H 'X-Forwarded-Proto: https' "$url/")"
          [[ "$home" == *'id="familias"'* ]]
          nav="${home#*<nav class=\"family-index}"
          nav="${nav%%</nav>*}"
          count="$(printf '%s' "$nav" | grep -o 'href="[^"]*"' | wc -l)"
          [[ "$count" == 5 ]] || { echo "LOWCOST_QA_CATEGORIES_COUNT=$count"; exit 4; }
          echo LOWCOST_QA_FIVE_CATEGORIES=PASS
          panel="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -H 'Host: www.lowcost-europa.eu' -H 'X-Forwarded-Proto: https' "$url/painel/")"
          [[ "$panel" == 302 ]] || { echo "LOWCOST_QA_PANEL_STATUS=$panel"; exit 4; }
          echo LOWCOST_QA_PRIVATE_PANEL=PASS
          [[ -S /run/php/php8.3-fpm.sock ]] && echo LOWCOST_QA_ALIEXPRESS_PHP_SOCKET=PRESENT || echo LOWCOST_QA_ALIEXPRESS_PHP_SOCKET=NOT_FOUND
          test -f "$root/www/aliexpress/callback.php" && echo LOWCOST_QA_ALIEXPRESS_CALLBACK_FILE=PRESENT || echo LOWCOST_QA_ALIEXPRESS_CALLBACK_FILE=NOT_FOUND
          samples="$(runuser -u "$user" -- "$root/.venv/bin/python" - "$root/.geoip/dbip-country-lite.mmdb" <<'PY'
          import ipaddress,sys,maxminddb
          wanted={"PT":"pt-pt","ES":"es","FR":"fr","DE":"de","GB":"en","NL":"en"}
          result={}
          with maxminddb.open_database(sys.argv[1]) as db:
            for network,record in db:
              if network.version!=4 or not isinstance(record,dict): continue
              cc=(record.get("country") or {}).get("iso_code")
              if cc not in wanted or cc in result: continue
              candidate=network.network_address if network.prefixlen==32 else network.network_address+1
              if ipaddress.ip_address(candidate).is_global: result[cc]=str(candidate)
              if len(result)==len(wanted): break
          if len(result)!=len(wanted): raise SystemExit("Missing MMDB country")
          for cc,lang in wanted.items(): print(cc+"|"+result[cc]+"|"+lang)
          PY
          )"
          n=0
          while IFS='|' read -r cc ip lang; do
            [[ "$cc" =~ ^(PT|ES|FR|DE|GB|NL)$ && "$ip" =~ ^[0-9.]+$ ]]
            page="$(curl -fsS --max-time 18 -H 'Host: www.lowcost-europa.eu' -H 'X-Forwarded-Proto: https' -H "X-Real-IP: $ip" -H 'Accept-Language: ja-JP' "$url/")"
            [[ "$page" == *"<html lang=\"$lang\">"* ]] || exit 4
            echo LOWCOST_QA_IP_COUNTRY_$cc=PASS
            n=$((n+1))
          done <<< "$samples"
          [[ "$n" == 6 ]]
          echo LOWCOST_QA_WWW_SIX_COUNTRIES=PASS
          echo LOWCOST_QA_FINAL_READONLY=PASS
          REMOTE
