name: Ferrari Ruflo host private release and real Skill job one-shot
on:
  push:
    branches: [main]
    paths:
      - ferrari-release-requests/ferrari-ruflo-host-release-20261106.json
permissions:
  contents: read
concurrency:
  group: ferrari-private-ruflo-release-once-20261106
  cancel-in-progress: false
jobs:
  deploy-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Gate exact private-only Ferrari release request
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          added="$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER")"
          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          test "$added" = 'ferrari-release-requests/ferrari-ruflo-host-release-20261106.json'
          test "$changed" = "$added"
          python3 - <<'PY'
          from pathlib import Path
          import json
          req=json.loads(Path('ferrari-release-requests/ferrari-ruflo-host-release-20261106.json').read_text())
          assert req=={'version':1,'type':'ferrari-ruflo-single-host-deploy-and-certify','sha':'f1f3b03525adec7018d7d629243e7b0fbb7f5087',
             'previous':'a266b25e06a9c8acf1fdc940d22b99070cd17ded',
             'scope':'private-only','no_global_apt':True,'no_other_projects':True}
          print('FERRARI_RUFLO_RELEASE_REQUEST_GATE=PASS')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: f1f3b03525adec7018d7d629243e7b0fbb7f5087
          path: ferrari-source
          persist-credentials: false
      - name: Pin existing SSH and prepare runner only
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/known"
          chmod 600 "$RUNNER_TEMP/known"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/known" -E sha256 | awk '{print $2}')" = SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Privately check, activate with rollback, then run genuine Ruflo host Skill execution
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          ROOT=/srv/projects/skill-universal
          SHA=f1f3b03525adec7018d7d629243e7b0fbb7f5087
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known"
                -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          peer=ubuntu@146.59.145.3
          old="$(sshpass -e ssh -T "${opts[@]}" "$peer" 'readlink -f /srv/projects/skill-universal/current')"
          test "$old" = "$ROOT/releases/a266b25e06a9c8acf1fdc940d22b99070cd17ded"
          activated=0
          safe_rollback() {
            rc=$?
            trap - EXIT
            if (( rc != 0 && activated == 1 )); then
              echo 'FERRARI_RUFLO_RELEASE_POST_ACTIVATION_FAILED; ATTEMPTING_FERRARI_ONLY_ROLLBACK'
              set +e
              sshpass -e ssh -T "${opts[@]}" "$peer" \
                "cd '$ROOT' && test \$(readlink -f current) = '$ROOT/releases/$SHA' && test -d '$old' && ln -s '$old' .ruflo-rollback-next-\$\$ && mv -Tf .ruflo-rollback-next-\$\$ current"
              echo 'FERRARI_RUFLO_ROLLBACK_ATTEMPTED'
            fi
            exit "$rc"
          }
          trap safe_rollback EXIT
          bash -n ferrari-source/install/vps-isolated-release.sh
          echo FERRARI_RUFLO_SOURCE_SHA=$SHA
          sshpass -e ssh -T "${opts[@]}" "$peer" "bash -s -- '$SHA' --check" \
            < ferrari-source/install/vps-isolated-release.sh \
            > "$RUNNER_TEMP/ferrari-ruflo-precheck.log"
          grep -q 'FERRARI_RELEASE_PRIVATE_PREACTIVATION=PASS' "$RUNNER_TEMP/ferrari-ruflo-precheck.log"
          grep -q 'FERRARI_RELEASE_NOT_ACTIVATED_CHECK_ONLY' "$RUNNER_TEMP/ferrari-ruflo-precheck.log"
          echo FERRARI_RUFLO_NEW_RELEASE_PRECHECK=PASS
          sshpass -e ssh -T "${opts[@]}" "$peer" "bash -s -- '$SHA' --activate" \
            < ferrari-source/install/vps-isolated-release.sh \
            > "$RUNNER_TEMP/ferrari-ruflo-activation.log"
          grep -q 'FERRARI_RELEASE_SWITCH=PASS' "$RUNNER_TEMP/ferrari-ruflo-activation.log"
          activated=1
          test "$(sshpass -e ssh -T "${opts[@]}" "$peer" 'readlink -f /srv/projects/skill-universal/current')" = "$ROOT/releases/$SHA"
          echo FERRARI_RUFLO_ACTIVATED_RELEASE=$SHA
          python3 - <<'PY'
          import json,base64,os
          from pathlib import Path
          req={'version':1,'id':'ferrari-ruflo-release-real-test','kind':'ruflo-host','host':'ChatGPT',
               'max_parallel':2,
               'roles':[{'id':'coder','type':'coder'},{'id':'reviewer','type':'reviewer'}],
               'input':{'name':'synthetic.json','content_base64':base64.b64encode(b'{"ferrari":"ruflo-host","safe":true}\n').decode()},
               'steps':[
                {'id':'format','role':'coder','kind':'invoke','action':'jq-format-json'},
                {'id':'review','role':'reviewer','kind':'rea-mcp','mcp_requests':[
                  {'method':'tools/call','params':{'name':'inspect_analysis_settings','arguments':{}}}
                ]}
               ]}
          (Path(os.environ['RUNNER_TEMP'])/'ruflo-host-job.json').write_text(json.dumps(req))
          PY
          REMOTE_REQ="$ROOT/.runtime/skill-requests/ruflo-host-verification-$GITHUB_RUN_ID.json"
          REMOTE_OUT="$ROOT/.runtime/skill-results/ruflo-host-verification-$GITHUB_RUN_ID"
          sshpass -e scp "${opts[@]}" "$RUNNER_TEMP/ruflo-host-job.json" "$peer:$REMOTE_REQ"
          set +e
          sshpass -e ssh -T "${opts[@]}" "$peer" \
            "cd '$ROOT/current' && '$ROOT/runtimes/python3.12/bin/python3.12' -m engine.skill_job --request '$REMOTE_REQ' --output '$REMOTE_OUT'" \
            > "$RUNNER_TEMP/ferrari-ruflo-skill-output.log"
          result=$?
          set -e
          sshpass -e scp "${opts[@]}" "$peer:$REMOTE_OUT/response.zip" "$RUNNER_TEMP/ruflo-host-response.zip"
          echo FERRARI_RUFLO_SKILL_PROCESS_EXIT=$result
          python3 - <<'PY'
          import json,os,zipfile
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'ruflo-host-response.zip'
          with zipfile.ZipFile(p) as z:
            files=z.namelist()
            rep=json.loads(z.read('report.json'))
            assert rep.get('status')=='completed',rep.get('error')
            inner=[k for k in files if k.endswith('ruflo-host-report.json')]
            assert len(inner)==1,files
            evidence=json.loads(z.read(inner[0]))
            assert evidence['status']=='completed'
            assert len(evidence['roles'])==2 and len(evidence['steps'])==2
            assert evidence['independent_agent_model_calls']==0
            assert evidence['swarm_shutdown'] and evidence['cleanup_verified']
            assert any(k.endswith('formatted.json') for k in files)
            assert any(k.endswith('rea-mcp-result.json') for k in files)
            assert all(x['executor'].startswith('/srv/projects/skill-universal/') for x in evidence['steps'])
          print('FERRARI_RUFLO_2_AGENT_ROLE_REAL_JOB=PASS')
          print('FERRARI_RUFLO_1_HOST_AI=ChatGPT')
          print('FERRARI_RUFLO_REAL_PRIVATE_TOOLS=jq,REA')
          print('FERRARI_RUFLO_RESPONSE_ZIP=PASS')
          PY
          test "$result" = 0
          sshpass -e ssh -T "${opts[@]}" "$peer" '/usr/bin/python3 -' <<'PY'
          import subprocess,os
          from pathlib import Path
          p=Path('/srv/projects/skill-universal')
          assert p/'current' and (p/'current').resolve().name=='f1f3b03525adec7018d7d629243e7b0fbb7f5087'
          for svc in ('pink-iptv-backend','pink-vpn','fadego-staging','lowcost-europa',
              'pm2-iptvpn-bot','pm2-telegram-robot-leads','nginx','postgresql@16-main'):
              assert subprocess.run(['systemctl','is-active',svc],capture_output=True,text=True,timeout=8).stdout.strip()=='active'
          print('FERRARI_RUFLO_PROTECTED_SERVICES=8/8')
          PY
          echo FERRARI_RUFLO_PERSISTENT_INTEGRATION=PASS
          # Only our synthetic test input/result are ephemeral. The merged
          # Ferrari code, its own release and previous rollback are retained.
          sshpass -e ssh -T "${opts[@]}" "$peer" \
            "test -f '$REMOTE_REQ' && test -f '$REMOTE_OUT/response.zip' && rm -f -- '$REMOTE_REQ' && rm -rf -- '$REMOTE_OUT'"
          activated=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ferrari-ruflo-single-host-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ruflo-host-response.zip
            ${{ runner.temp }}/ferrari-ruflo-precheck.log
            ${{ runner.temp }}/ferrari-ruflo-activation.log
          if-no-files-found: warn
          retention-days: 14
