name: Ferrari P5 scoped VPS read-only alignment audit
on:
  push:
    branches: [main]
    paths:
      - ferrari-release-requests/ferrari-p5-audit-20261106-v1.json
permissions:
  contents: read
concurrency:
  group: ferrari-p5-read-only
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout scoped request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Gate exactly new bounded request
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          files="$(git diff --name-only "$BEFORE" "$AFTER")"
          added="$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER")"
          if [[ -z "$added" ]]; then echo execute=false >> "$GITHUB_OUTPUT"; exit 0; fi
          test "$added" = 'ferrari-release-requests/ferrari-p5-audit-20261106-v1.json'
          test "$files" = "$added"
          python3 - <<'PY'
          import json
          r=json.load(open('ferrari-release-requests/ferrari-p5-audit-20261106-v1.json'))
          assert r == {'version':1,'task':'ferrari-point5-read-only-isolation-audit','release':'a266b25e06a9c8acf1fdc940d22b99070cd17ded','scope':'/srv/projects/skill-universal','no_deletions':True}
          PY
          echo execute=true >> "$GITHUB_OUTPUT"
          echo FERRARI_P5_REQUEST=PASS
      - name: Pinned SSH fingerprint, install sshpass only on ephemeral runner
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/host"
          chmod 600 "$RUNNER_TEMP/host"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/host" -E sha256 | awk '{print $2}')" = SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass > /dev/null
      - name: Read VPS Ferrari installation, APT and service health
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
             -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/host"
             -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
             -o ConnectTimeout=20 -o ServerAliveInterval=15)
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 'python3 -' > "$RUNNER_TEMP/p5.json" <<'PY'
          import os,json,subprocess,shutil
          from pathlib import Path
          p=Path('/srv/projects/skill-universal')
          base=p.resolve(strict=True)
          assert p==base and p.is_dir() and not p.is_symlink() and p.stat().st_uid==os.getuid()
          release=p/'releases/a266b25e06a9c8acf1fdc940d22b99070cd17ded'
          assert (p/'current').resolve(strict=True)==release
          actions=json.loads((release/'engine/tool_actions.json').read_text())['actions']
          core=all((release/'engine'/n).is_file() for n in ('ferrari.py','orchestrator.py','tool_runtime.py','skill_job.py'))
          private={
            'comfyui':'tools/comfyui-v0.43.0/main.py',
            'sd15':'tools/comfyui-v0.43.0/models/diffusers/sd15-fp16-f03de327/FERRARI_PROVENANCE.json',
            'whisper':'.runtime/venvs/extended/faster-whisper/bin/python',
            'whisper_model':'.runtime/models/faster-whisper-tiny-d90ca5fe/FERRARI_PROVENANCE.json',
            'ruflo':'.runtime/npm/ruflo/node_modules/ruflo/bin/ruflo.js',
            'node':'runtimes/node-22.23.4/bin/node',
            'openpencil':'.runtime/npm/openpencil/node_modules/@open-pencil/cli/package.json',
            'rea':'.runtime/npm/rea/node_modules/rea-agents/package.json',
          }
          found={}
          for k,rel in private.items():
            f=p/rel
            try: found[k]=f.is_file() and f.resolve(strict=True).is_relative_to(base)
            except OSError: found[k]=False
          pkgmap={'libreoffice':'libreoffice','ansible':'ansible','yt-dlp':'yt-dlp','gimp':'gimp','blender':'blender','kdenlive':'kdenlive','darktable':'darktable','openscad':'openscad','librecad':'librecad','qgis':'qgis','audacity':'audacity','obs':'obs-studio','solvespace':'solvespace','synfig':'synfigstudio','openshot':'openshot-qt','calibre':'calibre'}
          apt={}
          for name,pkg in pkgmap.items():
            v=subprocess.run(['dpkg-query','-W','-f=${db:Status-Abbrev}',pkg],capture_output=True,text=True,timeout=10)
            apt[name]=(v.returncode==0 and v.stdout.startswith('ii '))
          remnants=[]
          for name in ('.runtime/.ferrari-whisper-p3-proof-20261106.py','.runtime/.ferrari-whisper-p3-proof-20261106-r2.py','.runtime/.ferrari-comfy-point2-proof.py','.runtime/.ferrari-comfy-point2-proof-r3.py','.runtime/.ferrari-comfy-point2-proof-sd15.py','.runtime/.ferrari-comfy-point2-proof-sd15-r5.py'):
            q=p/name
            if q.exists() or q.is_symlink(): remnants.append({'name':name,'size':q.lstat().st_size,'symlink':q.is_symlink()})
          for rel,glob in (('.runtime','.ruflo-functional-p4-*'),('.runtime/models','.ferrari-whisper-staging-*'),('tools/comfyui-v0.43.0/models/diffusers','.ferrari-sd15-stage-*')):
            q=p/rel
            if q.is_dir() and not q.is_symlink():
              for f in list(q.glob(glob))[:10]:
                remnants.append({'name':str(f.relative_to(p)),'size':f.lstat().st_size,'symlink':f.is_symlink()})
          svc={}
          for name in ('pink-iptv-backend','pink-vpn','fadego-staging','lowcost-europa','pm2-iptvpn-bot','pm2-telegram-robot-leads','nginx','postgresql@16-main'):
            v=subprocess.run(['systemctl','is-active',name],capture_output=True,text=True,timeout=7)
            svc[name]=v.stdout.strip() or 'unknown'
          outside={}
          for n in ('/home/ubuntu/.local/share/motor-ferrari','/home/ubuntu/.local/share/rea-github-transport','/home/ubuntu/.local/share/hopper','/root/.cursor','/root/.vscode'):
            outside[n]='present' if Path(n).exists() else 'not-visible-or-absent'
          output={'release':release.name,'actions':len(actions),'core':core,'private':found,'apt':apt,'remnants':remnants,'services':svc,'outside':outside,'disk_free_gib':round(shutil.disk_usage(p).free/(1024**3),2),'scope':'read-only Ferrari point5'}
          assert output['actions']==40 and core
          assert (p/'current').resolve(strict=True)==release
          print(json.dumps(output,sort_keys=True,indent=2))
          PY
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ['RUNNER_TEMP'])/'p5.json').read_text())
          assert x['actions']==40 and x['core']
          print('FERRARI_P5_RELEASE_AND_40_ACTIONS=PASS')
          print('FERRARI_P5_PRIVATE='+str(sum(x['private'].values()))+'/'+str(len(x['private'])))
          print('FERRARI_P5_APT_GLOBAL='+str(sum(x['apt'].values())))
          print('FERRARI_P5_REMNANTS='+str(len(x['remnants'])))
          print('FERRARI_P5_PROTECTED_ACTIVE='+str(sum(y=='active' for y in x['services'].values()))+'/8')
          print('FERRARI_P5_AUDIT=PASS_READ_ONLY')
          PY
      - name: Save bounded proof
        if: steps.gate.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-p5-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/p5.json
          if-no-files-found: error
          retention-days: 14
