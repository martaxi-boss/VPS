name: Ferrari private npm cache - one-time hygiene
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-ferrari-private-cache-20261103.yml'
permissions:
  contents: read
concurrency:
  group: ferrari-private-npm-cache-one-time
  cancel-in-progress: false
jobs:
  ferrari-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify pinned VPS SSH host
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/ferrari-known-hosts"
          chmod 600 "$RUNNER_TEMP/ferrari-known-hosts"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/ferrari-known-hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
      - name: Load pinned Ferrari-own hygiene script on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 90 \
            --output "$RUNNER_TEMP/ferrari-cache-hygiene.py" \
            'https://raw.githubusercontent.com/martaxi-boss/skill-universal/1545805dc942868ba8c3bb83f59bbb1d4b1b9fd8/install/ferrari-cache-hygiene.py'
          test -s "$RUNNER_TEMP/ferrari-cache-hygiene.py"
          python3 -m py_compile "$RUNNER_TEMP/ferrari-cache-hygiene.py"
          grep -q '^def audit(root:' "$RUNNER_TEMP/ferrari-cache-hygiene.py"
      - name: Audit, clean Ferrari cache only, verify the Ferrari and protected services
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          ferrari_ssh() {
            sshpass -e ssh -T \
              -o PreferredAuthentications=password -o PubkeyAuthentication=no \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-known-hosts" \
              -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 \
              ubuntu@146.59.145.3 "$@"
          }
          services='fadego-staging.service lowcost-europa.service pink-iptv-backend.service pink-vpn.service pm2-root.service'
          ferrari_ssh "systemctl is-active $services || true" > "$RUNNER_TEMP/protected-before.txt"
          ferrari_ssh 'python3 -' \
            < "$RUNNER_TEMP/ferrari-cache-hygiene.py" \
            > "$RUNNER_TEMP/ferrari-audit.txt"
          grep -Fx 'FERRARI_PRIVATE_NPM_CACHE_HYGIENE=PASS' "$RUNNER_TEMP/ferrari-audit.txt"
          ferrari_ssh 'python3 - --apply' \
            < "$RUNNER_TEMP/ferrari-cache-hygiene.py" \
            > "$RUNNER_TEMP/ferrari-applied.txt"
          grep -Fx 'FERRARI_PRIVATE_NPM_CACHE_HYGIENE=PASS' "$RUNNER_TEMP/ferrari-applied.txt"
          ferrari_ssh 'set -eu
            ROOT="$HOME/.local/share/motor-ferrari"
            export PATH="$ROOT/runtimes/node-22.23.4/bin:$PATH"
            test "$(node --version)" = "v22.23.4"
            test -x "$ROOT/.runtime/npm/rea/node_modules/.bin/rea"
            "$ROOT/.runtime/npm/rea/node_modules/.bin/rea" --help >/dev/null
            "$ROOT/.runtime/npm/ruflo/node_modules/.bin/ruflo" --help >/dev/null
            test "$("$ROOT/tools/apktool-3.0.3/bin/apktool" --version)" = "3.0.3"
            cd "$ROOT/current"
            python3 -m engine.ferrari doctor >/dev/null
            echo FERRARI_CACHE_POSTCHECK=PASS' \
            > "$RUNNER_TEMP/ferrari-postcheck.txt"
          grep -Fx 'FERRARI_CACHE_POSTCHECK=PASS' "$RUNNER_TEMP/ferrari-postcheck.txt"
          ferrari_ssh "systemctl is-active $services || true" > "$RUNNER_TEMP/protected-after.txt"
          cmp "$RUNNER_TEMP/protected-before.txt" "$RUNNER_TEMP/protected-after.txt"
          echo 'FERRARI_OTHER_SERVICES_UNCHANGED=PASS'
          cat "$RUNNER_TEMP/ferrari-audit.txt"
          cat "$RUNNER_TEMP/ferrari-applied.txt"
          cat "$RUNNER_TEMP/ferrari-postcheck.txt"
      - name: Upload scoped hygiene evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-private-cache-hygiene-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ferrari-audit.txt
            ${{ runner.temp }}/ferrari-applied.txt
            ${{ runner.temp }}/ferrari-postcheck.txt
            ${{ runner.temp }}/protected-before.txt
            ${{ runner.temp }}/protected-after.txt
          if-no-files-found: warn
          retention-days: 7
