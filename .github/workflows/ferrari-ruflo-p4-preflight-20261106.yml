name: Ferrari P4 Ruflo private preflight once
on:
  push:
    branches: [main]
    paths:
      - ferrari-release-requests/ruflo-p4-preflight-20261106.json
permissions:
  contents: read
concurrency:
  group: ferrari-ruflo-p4-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout authorized preflight
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify one newly created request only
        id: gate
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          added="$(git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA")"
          changed="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          if [[ -z "$added" ]]; then
            echo execute=false >> "$GITHUB_OUTPUT"
            echo FERRARI_RUFLO_P4_HYGIENE_ONLY=PASS
            exit 0
          fi
          test "$added" = 'ferrari-release-requests/ruflo-p4-preflight-20261106.json'
          test "$added" = "$changed"
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('ferrari-release-requests/ruflo-p4-preflight-20261106.json').read_text())
          assert actual=={
            "version":1, "task":"ruflo-private-package-and-cli-readonly-audit",
            "project_root":"/srv/projects/skill-universal",
            "no_services":True, "no_provider_calls":True
          }
          print('FERRARI_RUFLO_P4_REQUEST_VALID=PASS')
          PY
          echo execute=true >> "$GITHUB_OUTPUT"
      - name: Verify existing VPS SSH fingerprint
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/ferrari-ruflo-host"
          chmod 600 "$RUNNER_TEMP/ferrari-ruflo-host"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/ferrari-ruflo-host" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          echo FERRARI_RUFLO_P4_EXISTING_SSH=PASS
      - name: Read Ferrari-private Node Ruflo CLI without spawning agents
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
             -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-ruflo-host"
             -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
             -o ConnectTimeout=20 -o ServerAliveInterval=15)
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 'python3 -' > "$RUNNER_TEMP/ruflo-preflight.txt" <<'PY'
          import json,os,re,subprocess,tempfile,shutil
          from pathlib import Path
          root=Path('/srv/projects/skill-universal')
          base=root.resolve(strict=True)
          assert base==root and root.is_dir() and not root.is_symlink() and root.stat().st_uid==os.getuid()
          assert (root/'current').resolve(strict=True)==root/'releases/a266b25e06a9c8acf1fdc940d22b99070cd17ded'
          node=root/'runtimes/node-22.23.4/bin/node'
          npm=root/'.runtime/npm/ruflo'
          pkg=npm/'node_modules/ruflo/package.json'
          link=npm/'node_modules/.bin/ruflo'
          for p in (node,pkg,link):
            assert p.exists() and p.resolve(strict=True).is_relative_to(base)
          assert node.is_file() and os.access(node,os.X_OK)
          manifest=json.loads(pkg.read_text())
          version=manifest.get('version')
          assert version=='3.71.0',('unexpected_ruflo_version',version)
          target=link.resolve(strict=True)
          assert target.is_file() and target.is_relative_to(npm.resolve(strict=True))
          print('FERRARI_RUFLO_VERSION='+str(version))
          print('FERRARI_RUFLO_PACKAGE_NAME='+str(manifest.get('name')))
          print('FERRARI_RUFLO_CLI_RELATIVE='+str(target.relative_to(base)))
          print('FERRARI_RUFLO_NODE_RELATIVE='+str(node.relative_to(base)))
          print('FERRARI_RUFLO_MODULE_LICENSE='+str(manifest.get('license')))
          print('FERRARI_RUFLO_NODE_ENGINES='+str(manifest.get('engines',{}).get('node')))
          for k in ('dependencies','optionalDependencies','peerDependencies'):
            deps=manifest.get(k,{})
            if not isinstance(deps,dict):continue
            selected=sorted(n for n in deps if any(t in n.lower() for t in ('anthropic','openai','ollama','llama','provider','agent','transformer')))
            print('FERRARI_RUFLO_'+k.upper()+'_MODEL_NAMES='+','.join(selected)[:650])
          env=os.environ.copy()
          with tempfile.TemporaryDirectory(prefix='.ruflo-preflight-',dir=root/'.runtime') as d:
            home=Path(d)
            for sub in ('home','cache','config','data','tmp'):
              (home/sub).mkdir(mode=0o700)
            env.update({
              'HOME':str(home/'home'),'TMPDIR':str(home/'tmp'),'TMP':str(home/'tmp'),
              'XDG_CACHE_HOME':str(home/'cache'),'XDG_CONFIG_HOME':str(home/'config'),
              'XDG_DATA_HOME':str(home/'data'),'PATH':str(node.parent)+':/usr/bin:/bin',
              'CI':'1','NO_COLOR':'1','DO_NOT_TRACK':'1','DISABLE_TELEMETRY':'1',
              'OPENAI_API_KEY':'','ANTHROPIC_API_KEY':'','GOOGLE_API_KEY':'',
              'GEMINI_API_KEY':'','OPENROUTER_API_KEY':'',
            })
            for arg in ('--version','--help'):
              try:
                proc=subprocess.run([str(node),str(target),arg],cwd=str(home),env=env,
                        capture_output=True,text=True,timeout=25,check=False)
                text=proc.stdout+'\n'+proc.stderr
                text=re.sub(r'\x1b\[[0-9;]*m','',text)
                print('FERRARI_RUFLO_CLI_'+arg.replace('-','').upper()+'_EXIT='+str(proc.returncode))
                print('FERRARI_RUFLO_CLI_'+arg.replace('-','').upper()+'_SUMMARY='+repr(text[:4200]))
              except subprocess.TimeoutExpired:
                print('FERRARI_RUFLO_CLI_'+arg.replace('-','').upper()+'_TIMEOUT=YES')
          print('FERRARI_RUFLO_ONLY_HELP_TESTED=YES')
          print('FERRARI_RUFLO_AGENT_PROVIDER_NOT_INVOKED=PASS')
          print('FERRARI_RUFLO_NO_DAEMON_STARTED=PASS')
          print('FERRARI_RUFLO_PRECHECK=PASS_READ_ONLY')
          PY
          cat "$RUNNER_TEMP/ruflo-preflight.txt"
          grep -q '^FERRARI_RUFLO_PRECHECK=PASS_READ_ONLY' "$RUNNER_TEMP/ruflo-preflight.txt"
      - name: Keep bounded evidence
        if: steps.gate.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-ruflo-p4-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/ruflo-preflight.txt
          retention-days: 7
          if-no-files-found: error
