name: Lowcost category 3 five owner links read-only preflight 20261111
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-category3-five-links-preflight-20261111.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-category3-manual-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - name: Pinned SSH read-only current category, identities and partner prices
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 022
          ROOT=/srv/projects/lowcost-europa
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          test -d "$ROOT/.git" && test -s "$ENVFILE" && test ! -L "$ENVFILE"
          gitrepo() { git -c safe.directory="$ROOT" -C "$ROOT" "$@"; }
          echo "CAT3_SITE_SHA=$(gitrepo rev-parse HEAD)"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          test "$(systemctl show lowcost-europa.service -p User --value)" = le001_1789265592
          systemctl is-active --quiet lowcost-europa.service
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u le001_1789265592 -- "$ROOT/.venv/bin/python" - <<'PY'
          import django
          from decimal import Decimal
          django.setup()
          from apps.catalog.models import ProductFamily,Offer,OfferFamilyPlacement,OfferClick
          from apps.catalog.services.public_eligibility import public_eligibility_q
          from apps.catalog.services.manual_candidate_intake import resolve_aliexpress_product_url
          from apps.integrations.aliexpress.client import AliExpressClient
          family=ProductFamily.objects.get(slug="pressoterapia-vacuum-drenagem")
          assert family.display_order==3, family.display_order
          print("CAT3_FAMILY="+family.name)
          print("CAT3_SLUG="+family.slug)
          print("CAT3_STATUS="+family.status)
          all_place=OfferFamilyPlacement.objects.filter(product_family=family)
          old_ids=list(all_place.values_list("offer_id",flat=True))
          visible=all_place.filter(offer__in=Offer.objects.filter(public_eligibility_q()))
          print("CAT3_OLD_PLACEMENTS="+str(all_place.count()))
          print("CAT3_OLD_VISIBLE="+str(visible.count()))
          print("CAT3_OLD_OWNER="+str(all_place.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()))
          print("CAT3_OLD_CLICKS="+str(OfferClick.objects.filter(offer_id__in=old_ids).count()))
          links=(
            "https://s.click.aliexpress.com/e/_c34qgvBt",
            "https://s.click.aliexpress.com/e/_c3mf6Dux",
            "https://s.click.aliexpress.com/e/_c3t2kQTz",
            "https://s.click.aliexpress.com/e/_c3VnQnsT",
            "https://s.click.aliexpress.com/e/_c4kKqTGx",
          )
          assert len(links)==len(set(links))==5
          client=AliExpressClient()
          ids=[]
          valid=0
          for n,url in enumerate(links,1):
              try:
                  pid,canonical=resolve_aliexpress_product_url(url)
                  assert canonical=="https://www.aliexpress.com/item/"+pid+".html"
                  ids.append(pid)
                  print("CAT3_LINK_"+str(n)+"_PRODUCT_ID="+pid)
                  print("CAT3_LINK_"+str(n)+"_OWNER_EXISTING="+str(Offer.objects.filter(
                      source=Offer.Source.ALIEXPRESS_OWNER,external_product_id=pid).count()))
                  print("CAT3_LINK_"+str(n)+"_PLACED_HERE="+str(all_place.filter(
                      offer__external_product_id=pid).count()))
                  details=client.get_product_detail(pid,"PT","EUR")
                  assert details.product_id==pid and details.title and details.title.strip()
                  assert details.price is not None and Decimal(str(details.price))>0 and details.currency=="EUR"
                  print("CAT3_LINK_"+str(n)+"_TITLE="+str(details.title).replace("\n"," ")[:115])
                  print("CAT3_LINK_"+str(n)+"_EUR="+str(details.price))
                  valid+=1
                  print("CAT3_LINK_"+str(n)+"_VALID=PASS")
              except Exception as exc:
                  print("CAT3_LINK_"+str(n)+"_VALID=FAIL_"+type(exc).__name__)
          print("CAT3_UNIQUE_PRODUCT_IDS="+str(len(set(ids))))
          print("CAT3_VALID_LINKS="+str(valid))
          assert len(set(ids))==5 and valid==5
          print("CAT3_LINKS_PREFLIGHT=PASS_5")
          PY
          echo CAT3_READONLY_PREFLIGHT_COMPLETE=PASS
          REMOTE
