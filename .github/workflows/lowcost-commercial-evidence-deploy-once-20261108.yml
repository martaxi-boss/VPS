name: Lowcost commercial evidence - safe one-time deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-commercial-evidence-deploy-once-20261108.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-commercial-evidence-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify precise workflow commit and pinned VPS host key
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git diff --name-only HEAD^ HEAD)" == '.github/workflows/lowcost-commercial-evidence-deploy-once-20261108.yml' ]]
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/known_hosts"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/known_hosts" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          echo LOWCOST_EVIDENCE_SSH_PIN=PASS
      - name: Scoped lowcost-only code rollout with rollback and public smoke test
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SSHPASS" ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          OLD=3e79d1110dd0f4bb38ea7a0e017bc88ae7e0bef0
          NEW=bd25002e619a3f4240b1b4ffe5247ae4a87a67e1
          BACK="$ROOT/private/deploy-rollbacks/owner-commercial-evidence-20261108-01"
          ALTERED=0
          rollback() {
            code=$?
            trap - EXIT
            if [[ "$ALTERED" -eq 1 ]]; then
              umask 022
              git -c "safe.directory=$ROOT" -C "$ROOT" checkout --detach -q "$OLD" || true
              umask 077
              systemctl restart lowcost-europa.service || true
              echo LOWCOST_EVIDENCE_ROLLBACK=EXECUTED
            else
              echo LOWCOST_EVIDENCE_NO_LIVE_CHANGES=YES
            fi
            exit "$code"
          }
          trap rollback EXIT
          [[ -d "$ROOT/.git" && -d "$ROOT/private" && ! -e "$BACK" ]]
          [[ "$(git -c "safe.directory=$ROOT" -C "$ROOT" rev-parse HEAD)" == "$OLD" ]]
          [[ -z "$(git -c "safe.directory=$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-catalog-maintenance.timer
          systemctl is-active --quiet lowcost-europa-affiliate-report.timer
          nginx -t >/dev/null 2>&1
          git -c "safe.directory=$ROOT" -C "$ROOT" fetch -q https://github.com/martaxi-boss/lowcost-europa.git main
          [[ "$(git -c "safe.directory=$ROOT" -C "$ROOT" rev-parse FETCH_HEAD)" == "$NEW" ]]
          [[ "$(git -c "safe.directory=$ROOT" -C "$ROOT" merge-base "$OLD" "$NEW")" == "$OLD" ]]
          expected="$(printf '%s\n' \
            'apps/catalog/owner_panel_views.py' \
            'apps/catalog/services/commercial_evidence.py' \
            'apps/catalog/services/observation_display.py' \
            'apps/catalog/templates/catalog/owner_panel/dashboard.html' \
            'apps/catalog/templates/catalog/owner_panel/family.html' \
            'apps/catalog/tests/test_commercial_evidence_owner.py' \
            'apps/storefront/templates/storefront/components/offer_card.html' \
            'apps/storefront/templates/storefront/components/owner_family_tools.html' \
            'apps/storefront/views.py' | sort)"
          actual="$(git -c "safe.directory=$ROOT" -C "$ROOT" diff --name-only "$OLD" "$NEW" | sort)"
          [[ "$actual" == "$expected" ]] || { echo LOWCOST_EVIDENCE_DIFF_SCOPE=BLOCK; exit 5; }
          mkdir -m 700 -p "$ROOT/private/deploy-rollbacks"
          mkdir -m 700 "$BACK"
          printf '%s\n' "$OLD" > "$BACK/old-sha"
          printf '%s\n' "$NEW" > "$BACK/target-sha"
          echo LOWCOST_EVIDENCE_ROLLBACK_BACKUP=PASS
          ALTERED=1
          umask 022
          git -c "safe.directory=$ROOT" -C "$ROOT" checkout --detach -q "$NEW"
          umask 077
          python3 - "$ROOT" <<'PYCOMPILE'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          for rel in (
              "apps/catalog/owner_panel_views.py",
              "apps/catalog/services/commercial_evidence.py",
              "apps/catalog/services/observation_display.py",
              "apps/storefront/views.py",
          ):
              compile((root/rel).read_text(),rel,"exec")
          PYCOMPILE
          systemctl restart lowcost-europa.service
          systemctl is-active --quiet lowcost-europa.service
          ok=0
          for try_id in $(seq 1 25); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 --resolve www.lowcost-europa.eu:443:146.59.145.3 https://www.lowcost-europa.eu/ || true)"
            if [[ "$code" == 200 ]]; then ok=1; break; fi
            sleep 1
          done
          [[ "$ok" -eq 1 ]] || exit 6
          headers="$(curl -sS -D - -o /dev/null --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 https://www.lowcost-europa.eu/painel/)"
          printf '%s\n' "$headers" | grep -Eq '^HTTP/.* 302'
          printf '%s\n' "$headers" | grep -Eiq '^x-robots-tag:.*noindex'
          www="$(curl -sSI --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 https://www.lowcost-europa.eu/)"
          printf '%s\n' "$www" | grep -Eq '^HTTP/.* 200'
          if printf '%s\n' "$www" | grep -Eiq '^x-robots-tag:.*noindex'; then exit 7; fi
          curl -fsS --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 https://www.lowcost-europa.eu/robots.txt -o /dev/null
          systemctl is-active --quiet lowcost-europa-catalog-maintenance.timer
          systemctl is-active --quiet lowcost-europa-affiliate-report.timer
          [[ -z "$(git -c "safe.directory=$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          echo "LOWCOST_EVIDENCE_GITHUB_VPS_SHA=$NEW"
          echo LOWCOST_EVIDENCE_OWNER_PRIVATE=PASS
          echo LOWCOST_EVIDENCE_PUBLIC_HTTPS_INDEXABLE=PASS
          echo LOWCOST_EVIDENCE_MAINTENANCE=PASS
          echo LOWCOST_EVIDENCE_NO_DB_MIGRATION=PASS
          echo LOWCOST_EVIDENCE_DEPLOY=PASS
          trap - EXIT
          REMOTE
