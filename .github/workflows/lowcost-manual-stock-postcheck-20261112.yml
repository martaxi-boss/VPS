name: Lowcost postcheck manual stock ten-minute polling only 20261112
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-manual-stock-postcheck-20261112.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Pinned SSH read-only verify real AliExpress polling and stopped old automation
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = 'dbed2cdead968118bcbd5c69486d679e65d0f90a'
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = 'dbed2cdead968118bcbd5c69486d679e65d0f90a'
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          test "$(systemctl is-enabled lowcost-europa-cavitation-availability.timer)" = enabled
          systemctl is-active --quiet lowcost-europa-cavitation-availability.timer
          test "$(systemctl show lowcost-europa-cavitation-availability.timer -p FragmentPath --value)" = '/etc/systemd/system/lowcost-europa-cavitation-availability.timer'
          grep -q '^OnCalendar=\*-\*-\* \*:0/10:00$' /etc/systemd/system/lowcost-europa-cavitation-availability.timer
          grep -q -- '--batch-size 10' /etc/systemd/system/lowcost-europa-cavitation-availability.service
          echo STOCK_10MIN_TIMER_ENABLED=PASS
          for unit in lowcost-europa-weekly-discovery.timer lowcost-europa-catalog-maintenance.timer; do
            test "$(systemctl is-enabled "$unit" 2>/dev/null || true)" = disabled
            ! systemctl is-active --quiet "$unit"
            echo "OLD_AUTOMATION_$unit=OFF"
          done
          journalctl --no-pager -o cat -u lowcost-europa-cavitation-availability.service \
             --since '2026-11-12 12:06:00 UTC' | grep 'CAVITATION_MANUAL_AVAILABILITY' | tail -n 3
          echo STOCK_LIVE_SERVICE_SUMMARY_PRESENT=PASS
          cd "$ROOT"
          set -a
          . "$ROOT/private/systemd-env/lowcost-europa.env"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PY'
          import django
          django.setup()
          from datetime import timedelta
          from django.utils import timezone
          from django.db.models import Count
          from apps.catalog.models import Offer,OfferFamilyPlacement,OfferObservation
          from apps.catalog.services.manual_storefront import MANUAL_ONLY_FAMILY_SLUGS
          from apps.catalog.services.cavitation_availability import MAX_BATCH_SIZE,MIN_CONFIRMATION_GAP
          assert len(MANUAL_ONLY_FAMILY_SLUGS)==5 and MAX_BATCH_SIZE==10
          assert MIN_CONFIRMATION_GAP==timedelta(minutes=20)
          expected=[20,9,5,6,5]
          actual=sorted(OfferFamilyPlacement.objects.filter(
              product_family__slug__in=MANUAL_ONLY_FAMILY_SLUGS
          ).values('product_family__display_order').annotate(
              n=Count('pk')
          ).order_by('product_family__display_order').values_list('n',flat=True))
          assert actual==sorted(expected),actual
          recent=OfferObservation.objects.filter(
              offer__source=Offer.Source.ALIEXPRESS_OWNER,
              observed_at__gte=timezone.now()-timedelta(minutes=15),
          )
          print('MANUAL_STOCK_RECENT_OBSERVATIONS_15MIN='+str(recent.count()))
          print('MANUAL_STOCK_RECENT_STATUS_COUNTS='+str(list(recent.values('availability').annotate(n=Count('pk')).order_by('availability'))))
          visible=OfferFamilyPlacement.objects.filter(
              product_family__slug__in=MANUAL_ONLY_FAMILY_SLUGS,
              offer__is_active=True,offer__owner_hidden=False,
          ).count()
          print('MANUAL_STOCK_VISIBLE_NOW='+str(visible))
          assert visible<=45
          print('MANUAL_STOCK_FIVE_CATEGORIES_SOURCE_AND_RUNTIME=PASS')
          PY
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-affiliate-report.timer
          nginx -t >/dev/null 2>&1
          echo LOWCOST_MANUAL_STOCK_POSTCHECK=PASS
          REMOTE
