name: Lowcost social groups real-time referrer read-only audit 20261113
on:
  push:
    paths:
      - .github/workflows/lowcost-social-posts-audit-20261113.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check live site from external runner
        shell: bash
        run: |
          set -euo pipefail
          for p in / /pt/ /pt/products/hifu/; do
            status="$(curl -sS -L --max-time 15 -o /dev/null -w '%{http_code}' "https://www.lowcost-europa.eu$p")"
            echo "SITE_PUBLIC_${p}=$status"
            test "$status" = 200
          done
      - name: Read-only aggregated Nginx social and Google referrers
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = 719738cbb80f366255c2adf1a6a60e445e6d9250
          systemctl is-active --quiet lowcost-europa.service
          cd "$ROOT"
          python3 - <<'PY'
          import gzip
          from collections import Counter
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from apps.catalog.services.search_referral_metrics import (
              _log_files, COMBINED, _public_page, _engine, _meta_origin, summarize_logs
          )
          now=datetime.now(timezone.utc)
          baseline=datetime(2026,11,13,15,34,47,tzinfo=timezone.utc)
          report=summarize_logs(Path('/var/log/nginx'),now=now)
          print('AUDIT_AT_UTC='+now.isoformat())
          print('AUDIT_LAST_OBSERVED_UTC='+str(report['last_observed']))
          print('SEVENDAY_GOOGLE='+str(report['engines']['Google']))
          print('SEVENDAY_META='+str(report['meta']['total']))
          print('SEVENDAY_META_FACEBOOK='+str(report['meta']['facebook']))
          print('SEVENDAY_META_INSTAGRAM='+str(report['meta']['instagram']))
          print('SEVENDAY_META_PAID_TAGGED='+str(report['meta']['paid_tagged']))
          print('TODAY_META='+str(report['meta']['today']))
          thresholds={'SINCE_PREVIOUS_SNAPSHOT':baseline,'LAST_60_MIN':now-timedelta(minutes=60),'LAST_30_MIN':now-timedelta(minutes=30),'LAST_15_MIN':now-timedelta(minutes=15)}
          counts={key:Counter() for key in thresholds}
          earliest=min(thresholds.values())
          for path in _log_files(Path('/var/log/nginx')):
            op=gzip.open if path.suffix=='.gz' else open
            with op(path,'rt',encoding='utf-8',errors='replace') as f:
              for line in f:
                m=COMBINED.match(line.rstrip('\n'))
                if not m:continue
                try:stamp=datetime.strptime(m.group('when'),'%d/%b/%Y:%H:%M:%S %z').astimezone(timezone.utc)
                except ValueError:continue
                if stamp<earliest or stamp>now or m.group('status') not in {'200','304'} or not _public_page(m.group('request')):continue
                meta=_meta_origin(m.group('request'),m.group('referer'))
                engine=_engine(m.group('referer'))
                for key,start in thresholds.items():
                  if stamp<start:continue
                  if meta:
                    origin, paid=meta
                    counts[key]['meta']+=1
                    counts[key]['meta_'+origin]+=1
                    counts[key]['meta_paid_tagged' if paid else 'meta_untagged_paid']+=1
                  if engine=='Google':counts[key]['google']+=1
          for key,c in counts.items():
            for field in ('meta','meta_facebook','meta_instagram','meta_unspecified','meta_paid_tagged','meta_untagged_paid','google'):
              print(key+'_'+field.upper()+'='+str(c[field]))
          print('LOWCOST_POSTS_REFERRER_READONLY=PASS')
          PY
          REMOTE
