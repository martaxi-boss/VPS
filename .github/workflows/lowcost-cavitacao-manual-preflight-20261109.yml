name: Lowcost manual Cavitacao links identification read-only 20261109
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-cavitacao-manual-preflight-20261109.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-cavitacao-manual-replacement
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Resolve Owner URLs and verify category 1 without modifying product data
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          EXPECTED=415270332e570cae935cfc47fc1a824bf6609693
          test -s "$ENVFILE" && test ! -L "$ENVFILE"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          systemctl is-active --quiet lowcost-europa.service
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYTHON'
          import django
          django.setup()
          from apps.catalog.models import OfferFamilyPlacement, ProductFamily, Offer
          from apps.catalog.services.public_eligibility import public_eligibility_q
          from apps.catalog.services.manual_candidate_intake import resolve_aliexpress_product_url
          urls = """https://s.click.aliexpress.com/e/_c3UK1bHl
          https://s.click.aliexpress.com/e/_c4Lzgx43
          https://s.click.aliexpress.com/e/_c2wQDjzz
          https://s.click.aliexpress.com/e/_c2x0EOun
          https://s.click.aliexpress.com/e/_c4XeoZrp
          https://s.click.aliexpress.com/e/_c2zqdO91
          https://s.click.aliexpress.com/e/_c35duQBz
          https://s.click.aliexpress.com/e/_c376CCpt
          https://s.click.aliexpress.com/e/_c4FvGbQr
          https://s.click.aliexpress.com/e/_c4s7YOO7
          https://s.click.aliexpress.com/e/_c4BFwB5d
          https://s.click.aliexpress.com/e/_c35XTWT9
          https://s.click.aliexpress.com/e/_c4e7x4hh
          https://s.click.aliexpress.com/e/_c3dBLPzN
          https://s.click.aliexpress.com/e/_c2xHkkfH
          https://s.click.aliexpress.com/e/_c3ZOknZl
          https://s.click.aliexpress.com/e/_c3qslKyf""".splitlines()
          assert len(urls)==17 and len(set(urls))==17
          family=ProductFamily.objects.get(slug="cavitacao-rf-vacuum-corpo",display_order=1)
          assert family.status!="RETIRED"
          old=OfferFamilyPlacement.objects.filter(product_family=family)
          visible=old.filter(public_eligibility_q(prefix="offer__"))
          print("CAV_PREFLIGHT_OLD_PLACEMENTS="+str(old.count()))
          print("CAV_PREFLIGHT_OLD_VISIBLE="+str(visible.count()))
          print("CAV_PREFLIGHT_OTHER_CATEGORIES=UNCHANGED")
          ids=[]
          failures=0
          for i,url in enumerate(urls,1):
              try:
                  product_id,_=resolve_aliexpress_product_url(url)
                  ids.append(product_id)
                  existing=Offer.objects.filter(source="ALIEXPRESS_OWNER",external_product_id=product_id).first()
                  duplicate=product_id in ids[:-1]
                  print("CAV_PREFLIGHT_LINK "+str(i)+" product_id="+product_id+
                      " previously_manual="+str(bool(existing)).upper()+
                      " duplicated="+str(duplicate).upper())
              except Exception as exc:
                  failures+=1
                  print("CAV_PREFLIGHT_LINK "+str(i)+" ERROR="+type(exc).__name__)
          print("CAV_PREFLIGHT_UNIQUE_PRODUCT_IDS="+str(len(set(ids))))
          print("CAV_PREFLIGHT_LINK_RESOLVE_FAILURES="+str(failures))
          print("CAV_PREFLIGHT_DB_WRITES=ZERO")
          assert not failures and len(ids)==17 and len(set(ids))==17, "Resolve or duplicate check blocked batch"
          print("CAV_PREFLIGHT_ALL_17_RESOLVED=PASS")
          PYTHON
          echo CAV_PREFLIGHT_SITE_UNMODIFIED=PASS
          REMOTE
