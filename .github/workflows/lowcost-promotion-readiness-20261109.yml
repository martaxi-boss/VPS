name: Lowcost promotion readiness - private read-only audit (one-shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-promotion-readiness-20261109.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-ptes-production-rollout
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify existing pinned SSH host
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
      - name: VPS live commercial + SEO + backup readiness, counts only
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          test -d "$ROOT/.git" && test -s "$ENVFILE"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = 12cc13933e7d4a14d27debd51148dc2bb173ef3e
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain --untracked-files=no)"
          nginx -t >/dev/null 2>&1
          test -s /var/log/nginx/lowcost-europa.access.log
          for unit in lowcost-europa.service lowcost-europa-catalog-maintenance.timer lowcost-europa-indexnow.timer lowcost-europa-backup.timer lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer lowcost-europa-affiliate-report.timer; do
            systemctl is-active --quiet "$unit"
          done
          echo "APPLICATION_AND_SIX_TIMERS=PASS"
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          test -f "$ROOT/data/offsite-backup.last-success" && test ! -L "$ROOT/data/offsite-backup.last-success"
          test "$(stat -c %U:%G:%a "$ROOT/data/offsite-backup.last-success")" = root:root:600
          echo "OFFSITE_BACKUP_MARKER_PERMISSION=PASS"
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PY'
          import os
          from collections import Counter
          from datetime import timedelta
          from pathlib import Path
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings.production')
          import django
          django.setup()
          from django.utils import timezone
          from apps.catalog.models import ExternalMetricsSnapshot, OfferClick
          from apps.catalog.services.commercial_evidence import owner_commercial_evidence_rows
          from apps.catalog.services.search_referral_metrics import read_private_report
          now=timezone.now()
          print('READ_ONLY_COMMERCIAL_AUDIT_AT_UTC='+now.strftime('%Y-%m-%dT%H:%M:%SZ'))
          for country in ('PT','ES'):
              rows=owner_commercial_evidence_rows(as_of=now,country=country)
              buckets=Counter(row.publication for row in rows)
              visible=sum(row.publication=='Na montra' for row in rows)
              origin_known=sum(row.publication=='Na montra' and row.origin_at is not None for row in rows)
              price_recent=sum(row.publication=='Na montra' and row.price_state.startswith('Observação recente') for row in rows)
              delivery_seen=sum(row.publication=='Na montra' and row.delivery_at is not None for row in rows)
              delivery_fresh=sum(row.publication=='Na montra' and row.delivery_state.startswith('Estimativa observada') for row in rows)
              if any(row.publication=='Na montra' and row.price_state!='Observação recente (até 24 h)' for row in rows):
                  raise AssertionError('public offer without fresh EUR price')
              print(f'{country}_ACTIVE_REVIEW_ROWS={len(rows)}')
              print(f'{country}_PUBLIC_WITH_FRESH_EUR={visible}')
              print(f'{country}_PUBLIC_ORIGIN_RECORDED={origin_known}')
              print(f'{country}_PUBLIC_DELIVERY_OBSERVATIONS={delivery_seen}')
              print(f'{country}_PUBLIC_RECENT_DELIVERY_ESTIMATES={delivery_fresh}')
              print(f'{country}_RETAINED_OLD_PRICE={buckets.get("Retida — preço sem prova recente",0)}')
              print(f'{country}_PRICE_RECENT_PUBLIC={price_recent}')
          clicks=OfferClick.objects.filter(clicked_at__gte=now-timedelta(days=7)).count()
          print('RAW_AFFILIATE_OUTBOUND_CLICKS_7D='+str(clicks))
          for source in ('ALIEXPRESS','GOOGLE_SEARCH_CONSOLE'):
              snapshot=ExternalMetricsSnapshot.objects.filter(source=source).first()
              print(source+'_SNAPSHOT_PRESENT='+str(bool(snapshot)))
              if snapshot:
                  print(source+'_SNAPSHOT_AGE_HOURS='+str(round((now-snapshot.checked_at).total_seconds()/3600,1)))
          report=read_private_report(Path('.local-metrics/search-referrers.json'),now=now)
          print('LOCAL_SEARCH_REFERRER_REPORT_READABLE='+str(bool(report)))
          if report:
              print('LOCAL_SEARCH_REFERRER_REQUESTS='+str(report['total']))
          print('NO_EXTERNAL_ORDERS_OR_SITES_MODIFIED=PASS')
          PY
          echo "READONLY_VPS_COMMERCIAL_AUDIT=PASS"
          REMOTE
