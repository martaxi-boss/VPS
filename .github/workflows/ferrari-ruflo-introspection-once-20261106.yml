name: Ferrari Ruflo MCP contracts one-shot
on:
  push:
    branches: [main]
    paths:
      - ferrari-release-requests/ferrari-ruflo-contracts-20261106.json
permissions:
  contents: read
jobs:
  ruflo-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: One exact synthetic audit request
        id: gate
        env:
          OLD: ${{ github.event.before }}
          NEW: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          added="$(git diff --name-only --diff-filter=A "$OLD" "$NEW")"
          changed="$(git diff --name-only "$OLD" "$NEW")"
          test "$added" = 'ferrari-release-requests/ferrari-ruflo-contracts-20261106.json'
          test "$changed" = "$added"
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('ferrari-release-requests/ferrari-ruflo-contracts-20261106.json').read_text())
          assert x=={'version':1,'kind':'ruflo-mcp-tool-contracts','scope':'read-only','project':'skill-universal','no_external_models':True}
          print('RUFLO_SCOPE_GATE=PASS')
          PY
      - name: Verify existing pinned SSH and runner transport
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/known"
          chmod 600 "$RUNNER_TEMP/known"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/known" -E sha256 | awk '{print $2}')" = SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Inspect actual Ruflo CLI and MCP tools with no credentials and disposable HOME
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known"
                -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 '/usr/bin/python3 -' > "$RUNNER_TEMP/ruflo-schema.json" <<'PY'
          import os,sys,json,subprocess,shutil,tempfile,selectors,time,signal,resource
          from pathlib import Path
          root=Path('/srv/projects/skill-universal')
          cli=root/'.runtime/npm/ruflo/node_modules/ruflo/bin/ruflo.js'
          node=root/'runtimes/node-22.23.4/bin/node'
          assert root.is_dir() and not root.is_symlink() and cli.is_file() and node.is_file()
          assert cli.resolve().is_relative_to(root.resolve()) and node.resolve().is_relative_to(root.resolve())
          def limit():
              resource.setrlimit(resource.RLIMIT_CORE,(0,0))
              resource.setrlimit(resource.RLIMIT_NOFILE,(256,256))
          def terminate(p):
              if p.poll() is None:
                  try: os.killpg(p.pid,signal.SIGTERM)
                  except ProcessLookupError: pass
                  try: p.wait(timeout=3)
                  except subprocess.TimeoutExpired:
                      os.killpg(p.pid,signal.SIGKILL);p.wait(timeout=3)
          def run(argv,env,cwd,secs=14):
              p=subprocess.Popen([str(node),str(cli),*argv],cwd=cwd,env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True,preexec_fn=limit)
              try:
                  o,e=p.communicate(timeout=secs)
                  return {'exit':p.returncode,'stdout':o.decode(errors='replace')[:1200],'stderr':e.decode(errors='replace')[:300]}
              except subprocess.TimeoutExpired:
                  terminate(p)
                  return {'exit':'timeout'}
          def mcp_probe(env,cwd):
              p=subprocess.Popen([str(node),str(cli),'mcp','start'],cwd=cwd,env=env,stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,start_new_session=True,preexec_fn=limit,bufsize=0)
              state={'initialize':False,'tools_count':0,'names':[],'schemas':{},'errors':[]}
              try:
                  p.stdin.write((json.dumps({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-03-26','capabilities':{},'clientInfo':{'name':'ferrari-audit','version':'1.0'}}})+'\n').encode());p.stdin.flush()
                  sel=selectors.DefaultSelector();sel.register(p.stdout,selectors.EVENT_READ)
                  buf=b'';deadline=time.monotonic()+22;requested=False
                  while time.monotonic()<deadline:
                      for _,_ in sel.select(timeout=0.8):
                          chunk=os.read(p.stdout.fileno(),65536)
                          if not chunk: return state
                          buf+=chunk
                          if len(buf)>300000: state['errors'].append('oversize');return state
                          while b'\n' in buf:
                              line,_,buf=buf.partition(b'\n')
                              try: data=json.loads(line)
                              except: continue
                              if data.get('id')==1:
                                  state['initialize']=bool('result' in data)
                                  if state['initialize']:
                                      p.stdin.write((json.dumps({'jsonrpc':'2.0','method':'notifications/initialized'})+'\n').encode())
                                      p.stdin.write((json.dumps({'jsonrpc':'2.0','id':2,'method':'tools/list'})+'\n').encode());p.stdin.flush();requested=True
                                  else: state['errors'].append('initialize_error')
                              if data.get('id')==2:
                                  tools=data.get('result',{}).get('tools',[])
                                  state['tools_count']=len(tools)
                                  # Only benign public method names are exposed, not arbitrary tool output.
                                  state['names']=[x['name'] for x in tools if isinstance(x,dict) and isinstance(x.get('name'),str)][:400]
                                  chosen={'swarm_init','swarm_status','swarm_shutdown','agent_spawn','agent_list','agent_status','task_create','task_assign','task_list','task_complete','agent_execute'}
                                  state['schemas']={x['name']:x.get('inputSchema') for x in tools if isinstance(x,dict) and x.get('name') in chosen}
                                  return state
                      if p.poll() is not None: state['errors'].append('server_exited');return state
                  state['errors'].append('deadline')
                  return state
              finally: terminate(p)
          with tempfile.TemporaryDirectory(prefix='ruflo-introspect-',dir=root/'.runtime') as tmp:
              env={'PATH':str(node.parent)+':/usr/bin:/bin','HOME':tmp,'TMPDIR':tmp,'XDG_CONFIG_HOME':tmp,'XDG_CACHE_HOME':tmp,'XDG_DATA_HOME':tmp,'LANG':'C','CI':'true','NODE_OPTIONS':'--max-old-space-size=512'}
              r={'release':(root/'current').resolve().name,'ruflo_private':True,'cli':{},'mcp':{}}
              for args in [ ['--version'], ['swarm','--help'], ['agent','--help'], ['task','--help'], ['mcp','--help'], ['providers','--help'], ['workflow','--help'], ['route','--help'] ]:
                  r['cli'][' '.join(args)]=run(args,env,tmp)
              r['mcp']=mcp_probe(env,tmp)
              r['private_temp_only']=tmp.startswith(str(root/'.runtime'))
              print(json.dumps(r,ensure_ascii=False))
          PY
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'ruflo-schema.json').read_text())
          print('RUFLO_PRIVATE_CLI_VERSION='+str(d['cli']['--version']['stdout'].strip()))
          print('RUFLO_MCP_INITIALIZE='+str(d['mcp']['initialize']))
          print('RUFLO_MCP_TOOLS='+str(d['mcp']['tools_count']))
          print('RUFLO_PERSISTENT_VPS_CHANGES=NO')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ferrari-ruflo-introspect-${{ github.run_id }}
          path: ${{ runner.temp }}/ruflo-schema.json
          if-no-files-found: warn
          retention-days: 7
