name: Lowcost PT ES launch - read-only VPS preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-ptes-preflight-once-20261109.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-launch-ptes-20261109
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read-only production preflight with pinned existing SSH
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc" ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          test -d "$ROOT/.git"
          test -f "$ROOT/private/systemd-env/lowcost-europa.env"
          test -x "$ROOT/.venv/bin/python"
          echo "LOWCOST_CURRENT_SHA=$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)"
          echo "LOWCOST_TRACKED_DIRTY_COUNT=$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no | wc -l)"
          echo "LOWCOST_REMOTE_MAIN_SHA=$(git -c safe.directory="$ROOT" -C "$ROOT" ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" remote -v | grep -c lowcost-europa)" -ge 1
          systemctl is-active --quiet lowcost-europa.service
          echo LOWCOST_SYSTEMD_ACTIVE=PASS
          for name in lowcost-europa-indexnow.timer lowcost-europa-catalog-maintenance.timer lowcost-europa-backup.timer; do
            if systemctl is-active --quiet "$name"; then echo "$name=active"; else echo "$name=inactive"; fi
          done
          nginx -t >/dev/null 2>&1
          echo LOWCOST_NGINX_CONFIG=PASS
          echo "LOWCOST_VENV_DJANGO_VERSION=$("$ROOT/.venv/bin/python" -m django --version)"
          echo "LOWCOST_DISK_AVAILABLE_KB=$(df -Pk "$ROOT" | awk 'END{print $4}')"
          if test -r "$ROOT/.geoip/dbip-country-lite.mmdb"; then echo GEOIP_DB_PRESENT=yes; else echo GEOIP_DB_PRESENT=no; fi
          if grep -Fq 'proxy_set_header X-Real-IP $remote_addr;' "$ROOT/deploy/nginx/lowcost-europa.eu.conf"; then echo NGINX_COUNTRY_IP_PROXY=pass; else echo NGINX_COUNTRY_IP_PROXY=unverified; fi
          ROOT="$ROOT" python3 - <<'PY'
          import os,re,ssl,urllib.error,urllib.request,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          env=(root/'private/systemd-env/lowcost-europa.env').read_text()
          for name in ('DJANGO_LOCALE_SEO_ENABLED','DJANGO_GEO_LANGUAGE_ENABLED','DJANGO_PUBLIC_INDEXING_ENABLED','DJANGO_PUBLIC_SITE_URL','DJANGO_SETTINGS_MODULE'):
              lines=re.findall(r'^'+name+r'=(.*)$',env,re.M)
              value=lines[-1].strip().strip(chr(34)+chr(39)) if lines else 'UNSET'
              if name=='DJANGO_PUBLIC_SITE_URL' and value!='UNSET' and not value.startswith('https://www.lowcost-europa.eu'):
                  value='OTHER_HOST'
              print('LOWCOST_CONFIG_'+name+'='+value)
          ctx=ssl.create_default_context()
          for path in ('/','/pt/','/es/','/sitemap.xml','/robots.txt','/painel/'):
              try:
                  req=urllib.request.Request('https://www.lowcost-europa.eu'+path,headers={'User-Agent':'Lowcost-Launch-PTES-ReadOnly/1.0'})
                  with urllib.request.urlopen(req,timeout=12,context=ctx) as resp:
                      data=resp.read(120000)
                      code=resp.status
              except urllib.error.HTTPError as exc:
                  code=exc.code;data=exc.read(120000)
              except Exception as exc:
                  print('LOWCOST_HTTP_'+path+'=ERROR:'+type(exc).__name__)
                  raise
              print('LOWCOST_HTTP_'+path+'='+str(code))
              if path=='/sitemap.xml' and code==200:
                  urls=ET.fromstring(data).findall('{http://www.sitemaps.org/schemas/sitemap/0.9}url')
                  print('LOWCOST_CURRENT_SITEMAP_URL_COUNT='+str(len(urls)))
          print('LOWCOST_PREFLIGHT_READ_ONLY=PASS')
          PY
          REMOTE
