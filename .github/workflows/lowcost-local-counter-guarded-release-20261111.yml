name: Lowcost free local counter guarded release 20261111
on:
  push:
    paths:
      - .github/workflows/lowcost-local-counter-guarded-release-20261111.yml
permissions:
  contents: read
concurrency:
  group: lowcost-local-counter-guarded-release-20261111
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - name: Verify original pinned SSH host
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
      - name: Install tested counter only and remove external metrics keys
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          OLD=3900b0780978909637ba20f506c39717dadd44e7
          NEW=af36616acee5a417ff767d022c2702e75c577b68
          APPUSER=le001_1789265592
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          gitrepo() { git -c safe.directory="$ROOT" -C "$ROOT" "$@"; }
          test -d "$ROOT/.git" && test -f "$ENVFILE" && test ! -L "$ENVFILE"
          test -d "$ROOT/private/ops" && test ! -L "$ROOT/private/ops"
          exec 9>"$ROOT/private/ops/ptes-deploy.lock"
          flock -n 9
          test "$(gitrepo rev-parse HEAD)" = "$OLD"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          test "$(gitrepo ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/release/local-counter-stable-20261111 | awk '{print $1}')" = "$NEW"
          gitrepo fetch --no-tags -q https://github.com/martaxi-boss/lowcost-europa.git refs/heads/release/local-counter-stable-20261111
          test "$(gitrepo rev-parse FETCH_HEAD)" = "$NEW"
          gitrepo merge-base --is-ancestor "$OLD" "$NEW"
          EXPECTED="$(printf '%s\n' \
             apps/catalog/management/commands/sync_external_metrics.py \
             apps/catalog/management/commands/sync_google_search_console.py \
             apps/catalog/owner_panel_views.py \
             apps/catalog/services/official_search_console_reporting.py \
             apps/catalog/services/windsor_search_console_reporting.py \
             apps/catalog/templates/catalog/owner_panel/dashboard.html \
             apps/catalog/tests/test_meta_ads_reporting.py \
             apps/catalog/tests/test_official_search_console_reporting.py \
             apps/catalog/tests/test_owner_analytics_dashboard.py \
             apps/catalog/tests/test_owner_engine_comparison.py \
             apps/catalog/tests/test_windsor_search_console_reporting.py \
             docs/operations/CONTADOR-LOCAL-SEM-GOOGLE-OAUTH-20261111.md | LC_ALL=C sort)"
          test "$(gitrepo diff --name-only "$OLD" "$NEW" | LC_ALL=C sort)" = "$EXPECTED"
          echo LOCAL_COUNTER_EXACT_ONLY_METRICS_DIFF=PASS
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-affiliate-report.timer
          test "$(systemctl show lowcost-europa.service -p User --value)" = "$APPUSER"
          nginx -t >/dev/null 2>&1
          BACKUP="$(mktemp "$ROOT/private/ops/.local-counter-env-backup.XXXXXX")"
          chmod 600 "$BACKUP"
          cp -p "$ENVFILE" "$BACKUP"
          CHANGED=0
          rollback() {
            rc=$?
            trap - EXIT
            if test "$rc" -ne 0 && test "$CHANGED" = 1; then
              cp -p "$BACKUP" "$ENVFILE" || true
              gitrepo checkout --detach -q "$OLD" || true
              chmod 644 "$ROOT/apps/catalog/owner_panel_views.py" "$ROOT/apps/catalog/templates/catalog/owner_panel/dashboard.html" "$ROOT/apps/catalog/management/commands/sync_external_metrics.py" || true
              systemctl restart lowcost-europa.service || true
              echo LOCAL_COUNTER_ROLLBACK=ATTEMPTED
            fi
            rm -f "$BACKUP"
            exit "$rc"
          }
          trap rollback EXIT
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          affiliate_fingerprint() {
            runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYHASH'
          import hashlib,json,django
          django.setup()
          from apps.catalog.models import Offer
          rows=list(Offer.objects.filter(source="ALIEXPRESS_OWNER").order_by("pk").values_list("pk","affiliate_url","is_active","owner_hidden"))
          print(hashlib.sha256(json.dumps(rows,separators=(",",":")).encode()).hexdigest())
          PYHASH
          }
          BEFORE_LINKS="$(affiliate_fingerprint)"
          test -n "$BEFORE_LINKS"
          CHANGED=1
          gitrepo checkout --detach -q "$NEW"
          for rel in $(gitrepo diff --name-only --diff-filter=ACMR "$OLD" "$NEW"); do
            case "$rel" in
              apps/*.py|apps/*.html|apps/*/*.py|apps/*/*/*.py|apps/*/*/*/*.py|apps/*/*/*/*.html|docs/*.md|docs/*/*.md)
                test ! -L "$ROOT/$rel"
                chmod 644 "$ROOT/$rel"
                ;;
            esac
          done
          # Ensure private backend can import every updated source; not just owner views.
          chmod 644 "$ROOT/apps/catalog/owner_panel_views.py" \
            "$ROOT/apps/catalog/management/commands/sync_external_metrics.py" \
            "$ROOT/apps/catalog/templates/catalog/owner_panel/dashboard.html"
          runuser -u "$APPUSER" -- test -r "$ROOT/apps/catalog/owner_panel_views.py"
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py check
          python3 - "$ENVFILE" <<'PYENV'
          import os,re,stat,sys,tempfile
          from pathlib import Path
          p=Path(sys.argv[1])
          previous=p.stat()
          keys={
              "WINDSOR_API_KEY",
              "GOOGLE_SEARCH_CONSOLE_PROVIDER",
              "GOOGLE_SEARCH_CONSOLE_PROPERTY",
              "GOOGLE_OAUTH_CLIENT_ID",
              "GOOGLE_OAUTH_CLIENT_SECRET",
              "GOOGLE_OAUTH_REFRESH_TOKEN",
          }
          rows=p.read_text(encoding="utf-8").splitlines(keepends=True)
          kept=[]
          removed=set()
          for row in rows:
              m=re.match(r"^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=",row)
              if m and m.group(1) in keys:
                  removed.add(m.group(1))
              else:
                  kept.append(row)
          fd,temp=tempfile.mkstemp(prefix=".local-only-env-",dir=p.parent)
          try:
              os.fchmod(fd,stat.S_IMODE(previous.st_mode))
              os.fchown(fd,previous.st_uid,previous.st_gid)
              with os.fdopen(fd,"w",encoding="utf-8") as out:
                  out.writelines(kept)
                  out.flush()
                  os.fsync(out.fileno())
              os.replace(temp,p)
          finally:
              if os.path.exists(temp):os.unlink(temp)
          assert all(not re.match(r"^\s*(?:export\s+)?("+ "|".join(keys)+r")\s*=",x) for x in kept)
          print("LOCAL_COUNTER_PROVIDER_ENV_KEYS_ABSENT=PASS")
          print("LOCAL_COUNTER_DELETED_KEY_COUNT="+str(len(removed)))
          PYENV
          unset WINDSOR_API_KEY GOOGLE_SEARCH_CONSOLE_PROVIDER GOOGLE_SEARCH_CONSOLE_PROPERTY
          unset GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN
          set -a
          . "$ENVFILE"
          set +a
          systemctl restart lowcost-europa.service
          systemctl is-active --quiet lowcost-europa.service
          AFTER_LINKS="$(affiliate_fingerprint)"
          test "$BEFORE_LINKS" = "$AFTER_LINKS"
          echo LOCAL_COUNTER_ALL_OWNER_LINKS_PRESERVED=PASS
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYCHECK'
          import django,os
          from datetime import timedelta
          from pathlib import Path
          from types import SimpleNamespace
          from django.test import RequestFactory,Client
          from django.utils import timezone
          django.setup()
          from apps.catalog.owner_panel_views import dashboard
          from apps.catalog.models import Offer,OfferFamilyPlacement,ProductFamily,OfferClick
          from apps.catalog.services.search_referral_metrics import read_private_report
          for key in ("WINDSOR_API_KEY","GOOGLE_OAUTH_CLIENT_ID","GOOGLE_OAUTH_CLIENT_SECRET","GOOGLE_OAUTH_REFRESH_TOKEN"):
              assert not os.environ.get(key),key
          report=read_private_report(Path("/srv/projects/lowcost-europa/.local-metrics/search-referrers.json"))
          assert report is not None
          assert 0<= (timezone.now()-report["checked_at"]).total_seconds()<7200
          req=RequestFactory().get("/painel/",secure=True,HTTP_HOST="www.lowcost-europa.eu")
          req.user=SimpleNamespace(is_authenticated=True,is_staff=True)
          response=dashboard(req)
          body=response.content.decode("utf-8")
          assert response.status_code==200
          assert response["X-Robots-Tag"]=="noindex, nofollow"
          assert response["Cache-Control"]=="private, no-store"
          assert "Contador gratuito — Google, Meta e AliExpress" in body
          assert "Chegadas identificadas (VPS, 7 dias)" in body
          assert "Google Search Console" not in body
          assert "Windsor.ai" not in body
          assert "Google Ads" not in body
          assert "Google OAuth" not in body
          assert "Pagamento concluído" in body or "A aguardar primeira sincronização" in body
          guest=RequestFactory().get("/painel/",secure=True,HTTP_HOST="www.lowcost-europa.eu")
          guest.user=SimpleNamespace(is_authenticated=False,is_staff=False)
          assert dashboard(guest).status_code==302
          family=ProductFamily.objects.get(slug="cavitacao-rf-vacuum-corpo")
          offers=Offer.objects.filter(source="ALIEXPRESS_OWNER",is_active=True,owner_hidden=False,family_placements__product_family=family).distinct()
          assert offers.count()>=19,offers.count()
          before=OfferClick.objects.count()
          client=Client(HTTP_HOST="www.lowcost-europa.eu")
          for o in list(offers.order_by("pk"))[:5]:
              r=client.head("/go/"+str(o.pk)+"/",secure=True)
              assert r.status_code==302
              assert r["Location"]==o.affiliate_url
          assert OfferClick.objects.count()==before
          print("LOCAL_COUNTER_PRIVATE_DASHBOARD=PASS")
          print("LOCAL_COUNTER_NGINX_GOOGLE_META=PASS")
          print("LOCAL_COUNTER_NO_OAUTH_ADS_WINDSOR=PASS")
          print("LOCAL_COUNTER_CAVITATION_19_PLUS_PRESERVED=PASS")
          print("LOCAL_COUNTER_OWNER_ONLY_AND_GO_HEAD=PASS")
          PYCHECK
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYHTTP'
          import urllib.request
          B="https://www.lowcost-europa.eu"
          for path in ("/","/pt/","/es/","/pt/products/cavitacao-rf-vacuum-corpo/","/es/products/cavitacao-rf-vacuum-corpo/","/pt/products/hydrodermoabrasao-aqua-facial-multifuncoes/","/es/products/hydrodermoabrasao-aqua-facial-multifuncoes/","/robots.txt","/sitemap.xml"):
              with urllib.request.urlopen(B+path,timeout=20) as res:
                  assert res.status==200,path
                  body=res.read(2500000).decode("utf-8","replace")
                  if path=="/sitemap.xml":assert body.count("<loc>")==23
                  if path=="/pt/products/cavitacao-rf-vacuum-corpo/":assert "buyer-question" in body
                  if path=="/es/products/cavitacao-rf-vacuum-corpo/":assert "buyer-question" not in body
          print("LOCAL_COUNTER_PT_ES_MICRODERMO_PUBLIC_PRESERVED=PASS")
          PYHTTP
          # The existing six-hour order API timer remains and no longer invokes
          # Google or any third-party analytics service.
          systemctl is-active --quiet lowcost-europa-affiliate-report.timer
          nginx -t >/dev/null 2>&1
          test "$(gitrepo rev-parse HEAD)" = "$NEW"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          echo LOCAL_COUNTER_HOTFIX_SOURCE_ALIGNED=PASS
          echo LOCAL_COUNTER_VPS_PUBLICATION=PASS
          trap - EXIT
          rm -f "$BACKUP"
          REMOTE
