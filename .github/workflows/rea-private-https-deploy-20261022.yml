name: REA private HTTPS MCP deployment 20261022
on:
  push:
    branches: [trial/rea-chatgpt-20261022]
    paths:
      - ops/rea_private_https_deploy_20261022.py
      - .github/workflows/rea-private-https-deploy-20261022.yml
permissions: {contents: read}
concurrency:
  group: rea-private-https-deploy-single
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Validate scoped authenticated deploy source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/rea_private_https_deploy_20261022.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path("ops/rea_private_https_deploy_20261022.py").read_text()
          for x in ('rea-reversa.duckdns.org','ProtectHome=true',
                    'IPAddressDeny=any','NoNewPrivileges=true',
                    'UNAUTHENTICATED_REQUEST','AUTHENTICATED_MCP',
                    '127.0.0.1','CPUQuota=200%','MemoryMax=3G'):
              assert x in s,x
          assert 'token_hex(32)' in s
          assert 'proxy_set_header Authorization "";' in s
          assert 'TOKEN_FILE.read_text' in s
          print("REA_SCOPED_DEPLOY_SOURCE=PASS")
          PY
      - name: Verify pinned VPS identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/rea-deploy-known"
          chmod 600 "$RUNNER_TEMP/rea-deploy-known"
          observed="$(ssh-keygen -lf "$RUNNER_TEMP/rea-deploy-known" -E sha256 | awk '{print $2}')"
          test "$observed" = "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc"
      - name: SSH helper on GitHub runner
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Deploy isolated REA service and private HTTPS endpoint
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rea-deploy-known" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=6 \
            ubuntu@146.59.145.3 \
            'NODE_BIN="$(command -v node)"; sudo -n env REA_NODE_BIN="$NODE_BIN" python3 -' \
            < ops/rea_private_https_deploy_20261022.py
