name: REA original official CLI through GitHub Actions SSH
on:
  push:
    branches:
      - rea/one-skill-bridge-20261023
    paths:
      - ".github/workflows/rea-mcp-transport-20261027.yml"
      - "rea-linux/install/rea_original_upstream_cli_probe_20261029.sh"
permissions:
  contents: read
concurrency:
  group: rea-one-skill-bridge
  cancel-in-progress: false
jobs:
  rea-original:
    if: github.actor == 'martaxi-boss'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout pinned project branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate isolated official REA runner
        shell: bash
        run: |
          set -euo pipefail
          bash -n rea-linux/install/rea_original_upstream_cli_probe_20261029.sh
          echo "REA_ORIGINAL_JOB_MODE=GITHUB_ACTIONS_SSH_CLI"
          echo "REA_ORIGINAL_USES_MCP=NO"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Verify pinned SSH host identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/rea-original-host-pin"
          chmod 600 "$RUNNER_TEMP/rea-original-host-pin"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/rea-original-host-pin" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc"
          echo "REA_ORIGINAL_SSH_PIN=PASS"
      - name: Install official source and run real capture tests over SSH
        env:
          SSHPASS: $\{{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rea-original-host-pin" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            ubuntu@146.59.145.3 'bash -se' \
            < rea-linux/install/rea_original_upstream_cli_probe_20261029.sh
