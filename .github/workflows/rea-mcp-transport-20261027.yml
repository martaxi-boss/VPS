name: REA original existing Linux supplier readiness through pinned GitHub SSH
on:
  push:
    branches:
      - rea/one-skill-bridge-20261023
    paths:
      - ".github/workflows/rea-mcp-transport-20261027.yml"
      - "rea-linux/install/rea_original_upstream_cli_probe_20261029.sh"
      - "rea-linux/tests/rea_original_historical_failure_replay_20261029.py"
      - "rea-linux/tests/rea_original_existing_vendors_matrix_20261029.py"
      - "rea-linux/tests/rea_original_existing_provider_paths_20261029.py"
      - "rea-linux/tests/rea_original_unblob_access_fix_20261029.py"
      - "rea-linux/tests/rea_original_functional_suppliers_step2_20261029.py"
      - "rea-linux/tests/rea_original_apktool_functional_20261029.py"
      - "rea-linux/tests/rea_original_external_supplier_gap_audit_20261029.py"
      - "rea-linux/install/rea_original_optional_free_suppliers_20261029.py"
      - "rea-linux/tests/rea_original_optional_free_supplier_acceptance_20261029.py"
      - "rea-linux/tests/rea_original_existing_optional_suppliers_point2_20261029.py"
      - "rea-linux/tests/rea_original_existing_suppliers_point2_followup_20261029.py"
      - "rea-linux/tests/rea_original_chromium_owned_session_point2_20261029.py"
      - "rea-linux/tests/rea_original_point2_failing_supplier_readback_20261029.py"
      - "rea-linux/skill-bridge/execute_request.py"
      - "rea-linux/skill-requests/current.json"
      - "rea-linux/migration/stage_final_runtime_deps_20261029.py"
      - "rea-linux/migration/switch_final_runtime_deps_20261029.py"
      - "rea-linux/migration/retest_final_suppliers_20261029.py"
      - "rea-linux/migration/stage_final_vendors_20261029.py"
      - "rea-linux/migration/test_copied_vendors_20261029.py"
permissions:
  contents: read
concurrency:
  group: rea-one-skill-bridge
  cancel-in-progress: false
jobs:
  upstream-original:
    if: github.actor == 'martaxi-boss' && !startsWith(github.event.head_commit.message, 'skill-request:')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout isolated REA runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate installation script and SSH utility
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile rea-linux/tests/rea_original_existing_optional_suppliers_point2_20261029.py
          python3 -m py_compile rea-linux/migration/stage_final_runtime_deps_20261029.py
          python3 -m py_compile rea-linux/migration/switch_final_runtime_deps_20261029.py
          python3 -m py_compile rea-linux/migration/retest_final_suppliers_20261029.py
          python3 -m py_compile rea-linux/migration/stage_final_vendors_20261029.py
          python3 -m py_compile rea-linux/migration/test_copied_vendors_20261029.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          echo 'REA_ORIGINAL_MODE=STANDALONE_CLI_NO_MCP'
      - name: Verify pinned SSH host identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/rea-host-pin"
          chmod 600 "$RUNNER_TEMP/rea-host-pin"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/rea-host-pin" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc"
          echo "REA_ORIGINAL_SSH_PIN=PASS"
      - name: Stage independent dependencies inside final runtime
        if: startsWith(github.event.head_commit.message, 'migration-stage:')
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rea-host-pin" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=5 \
            ubuntu@146.59.145.3 "python3 -" \
            < rea-linux/migration/stage_final_runtime_deps_20261029.py
      - name: Switch final dependencies and run 8 regression tests
        if: startsWith(github.event.head_commit.message, 'migration-switch:')
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rea-host-pin" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=5 \
            ubuntu@146.59.145.3 "python3 -" \
            < rea-linux/migration/switch_final_runtime_deps_20261029.py
      - name: Retest Ghidra JADX Unblob and cleanup after independent dependencies
        if: startsWith(github.event.head_commit.message, 'migration-suppliers:')
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rea-host-pin" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=5 \
            ubuntu@146.59.145.3 "python3 -" \
            < rea-linux/migration/retest_final_suppliers_20261029.py
      - name: Stage final Linux vendor distributions without switching active paths
        if: startsWith(github.event.head_commit.message, 'migration-vendors-stage:')
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rea-host-pin" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=5 \
            ubuntu@146.59.145.3 "python3 -" \
            < rea-linux/migration/stage_final_vendors_20261029.py
      - name: Functional validation of copied suppliers against final original motor
        if: startsWith(github.event.head_commit.message, 'migration-vendors-test:')
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rea-host-pin" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=5 \
            ubuntu@146.59.145.3 "python3 -" \
            < rea-linux/migration/test_copied_vendors_20261029.py
      - name: Verify existing compatible suppliers and original REA process cleanup
        if: "!startsWith(github.event.head_commit.message, 'migration-stage:') && !startsWith(github.event.head_commit.message, 'migration-switch:') && !startsWith(github.event.head_commit.message, 'migration-suppliers:') && !startsWith(github.event.head_commit.message, 'migration-vendors-stage:') && !startsWith(github.event.head_commit.message, 'migration-vendors-test:')"
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rea-host-pin" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=5 \
            ubuntu@146.59.145.3 "python3 -" \
            < rea-linux/tests/rea_original_existing_optional_suppliers_point2_20261029.py

  engenharia-reversa-skill:
    # Triggered by a bounded request committed using the GitHub connector.
    if: github.actor == 'martaxi-boss' && startsWith(github.event.head_commit.message, 'skill-request:')
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout immutable reader and request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate allowlisted read-only request on runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile rea-linux/skill-bridge/execute_request.py
          python3 rea-linux/skill-bridge/execute_request.py --validate-request rea-linux/skill-requests/current.json
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          echo 'REA_SKILL_REQUEST_LOCAL_VALIDATION=PASS'
      - name: Verify existing pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/rea-skill-host-pin"
          chmod 600 "$RUNNER_TEMP/rea-skill-host-pin"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/rea-skill-host-pin" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc"
          echo 'REA_SKILL_SSH_PIN=PASS'
      - name: Run request against existing FINAL original CLI on VPS
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          request_b64="$(base64 -w0 < rea-linux/skill-requests/current.json)"
          request_len="$(printf %s "$request_b64" | wc -c)"
          test "$request_len" -le 5000
          sshpass -e ssh -T \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rea-skill-host-pin" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=5 \
            ubuntu@146.59.145.3 "python3 - --base64 $request_b64" \
            < rea-linux/skill-bridge/execute_request.py
