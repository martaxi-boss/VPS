name: REA 6.8 original MCP through GitHub SSH
on:
  push:
    branches:
      - rea/one-skill-bridge-20261023
    paths:
      - ".github/workflows/rea-mcp-transport-20261027.yml"
      - "ops/rea_mcp_transport_20261027.py"
      - "rea-linux/requests/*.json"
permissions:
  contents: read
concurrency:
  group: rea-one-skill-bridge
  cancel-in-progress: false
jobs:
  rea-transport:
    if: github.actor == 'martaxi-boss'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout existing isolated branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Prepare Python transport and select one request
        env:
          REA_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass python3-cryptography python3-jsonschema >/dev/null
          python3 -m py_compile ops/rea_mcp_transport_20261027.py
          /usr/bin/python3 ops/rea_mcp_transport_20261027.py --selftest
          export REA_TRANSPORT_REQUEST_PATH="$RUNNER_TEMP/rea-transport-request.json"
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          diff = subprocess.run(
              ["git", "diff-tree", "--no-commit-id", "--name-status", "-r", os.environ["REA_COMMIT"]],
              capture_output=True, text=True, check=True).stdout.splitlines()
          selected = []
          for line in diff:
              item = line.split("\t", 1)
              if len(item) != 2:
                  continue
              status, path = item
              if path.startswith("rea-linux/requests/"):
                  if not re.fullmatch(r"rea-linux/requests/[a-zA-Z0-9_-]{1,64}\.json", path):
                      raise RuntimeError("Invalid request filename")
                  if status == "D":
                      continue
                  if status != "A":
                      raise RuntimeError("Only new requests are executable")
                  selected.append(path)
          if len(selected) > 1:
              raise RuntimeError("Exactly zero or one request per commit")
          target = pathlib.Path(os.environ["REA_TRANSPORT_REQUEST_PATH"])
          if selected:
              target.write_bytes(pathlib.Path(selected[0]).read_bytes())
              print("REA_TRANSPORT_REQUEST="+selected[0])
          else:
              target.write_text('{"version":1,"action":"catalog"}', encoding="utf-8")
              print("REA_TRANSPORT_REQUEST=default-catalog")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write("REA_TRANSPORT_REQUEST_PATH="+str(target)+"\n")
          PY
          /usr/bin/python3 ops/rea_mcp_transport_20261027.py --validate "$REA_TRANSPORT_REQUEST_PATH"
      - name: Verify existing SSH server identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/rea-host-pin"
          chmod 600 "$RUNNER_TEMP/rea-host-pin"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/rea-host-pin" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc"
          echo "REA_TRANSPORT_SSH_PIN=PASS"
      - name: Read-only verify stale REA process-capture PIDs (one-shot)
        if: contains(github.event.head_commit.message, '[rea cleanup scope diagnostic]')
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rea-host-pin" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 \
            ubuntu@146.59.145.3 "python3 -" <<'PY'
          import json, os, pathlib, subprocess
          pids=(183864,174896,178364,179278,179471,179827,179928,180177,180321,180324,180337,180599,180633,180851,180917,181026,181041,181073,181196,181208,181217,181265,181482,181503,181801)
          service=subprocess.run(["systemctl","show","rea-reversa-mcp.service","-p","ActiveState","-p","MainPID","-p","SubState"],capture_output=True,text=True,timeout=10)
          print("REA_SCOPE_SERVICE="+json.dumps(service.stdout.splitlines(),separators=(",",":")))
          results=[]
          for pid in pids:
              p=pathlib.Path("/proc")/str(pid)
              try:
                  fields=p.joinpath("stat").read_text().rsplit(")",1)[1].split()
                  state=fields[0]
                  ppid=int(fields[1])
                  pgid=int(fields[2])
                  readable=os.access(p/"environ",os.R_OK)
                  try:
                      os.kill(pid,0)
                      exists="yes"
                  except ProcessLookupError:
                      exists="no"
                  except PermissionError:
                      exists="permission-denied"
                  results.append({"pid":pid,"status":"present","state":state,"ppid":ppid,"pgid":pgid,"environ_readable":readable,"kill0":exists})
              except FileNotFoundError:
                  results.append({"pid":pid,"status":"absent"})
              except ProcessLookupError:
                  results.append({"pid":pid,"status":"absent"})
              except Exception as exc:
                  results.append({"pid":pid,"status":"unverified","error":type(exc).__name__})
          from hashlib import sha256
          compiled=pathlib.Path("/opt/rea-reversa/rea/dist/process/ProcessOwnershipObservation.js")
          if compiled.is_file():
              code=compiled.read_bytes()
              text_code=code.decode("utf-8")
              marker="pid: Number(match[1])"
              i=text_code.find(marker)
              print("REA_SCOPE_DIST_CODE_SHA="+sha256(code).hexdigest())
              print("REA_SCOPE_DIST_MARKER_FOUND="+str(i>=0))
              if i>=0:
                  print("REA_SCOPE_DIST_CONTEXT="+json.dumps(text_code[max(0,i-350):i+580],separators=(",",":")))
          else:
              print("REA_SCOPE_DIST_MISSING=1")
          import time, stat
          from collections import defaultdict
          buckets=defaultdict(int)
          now=time.time()
          for entry in pathlib.Path("/tmp").iterdir():
              if not entry.name.startswith("rea-process-"):
                  continue
              try:
                  meta=entry.lstat()
                  kind="directory" if stat.S_ISDIR(meta.st_mode) and not stat.S_ISLNK(meta.st_mode) else "non-directory"
                  age="over_10m" if now-meta.st_mtime>=600 else "recent"
                  buckets[str(meta.st_uid)+":"+kind+":"+age]+=1
              except OSError:
                  buckets["stat_failed"]+=1
          print("REA_SCOPE_TEMP_ROOT_COUNTS="+json.dumps(dict(buckets),sort_keys=True))
          account=subprocess.run(["systemctl","show","rea-reversa-mcp.service","-p","User"],capture_output=True,text=True)
          print("REA_SCOPE_SERVICE_ACCOUNT="+json.dumps(account.stdout.strip()))
          command=subprocess.run(["ps","-axo","pid=,ppid=,pgid=,uid=,stat=,command="],capture_output=True,text=True,timeout=12)
          matches=[line.strip() for line in command.stdout.splitlines() if line.lstrip().startswith("183864 ")]
          print("REA_SCOPE_PS_EXACT="+json.dumps(matches[:2]))
          import re
          regex=re.compile(r"\s*(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\S+)\s+(.*)")
          parsed=[regex.search(line) for line in command.stdout.splitlines()]
          parsed=[x for x in parsed if x and x[1]=="183864"]
          print("REA_SCOPE_PS_REGEX="+json.dumps([{"pid":x[1],"ppid":x[2],"pgid":x[3],"platform_pass":int(x[3])>0} for x in parsed]))
          executable=subprocess.run(["node","--version"],capture_output=True,text=True,timeout=5)
          print("REA_SCOPE_NODE_VERSION="+json.dumps(executable.stdout.strip() if executable.returncode==0 else "not-in-path"))
          if executable.returncode==0:
              script="""import {systemProcessOwnershipHost as h} from '/opt/rea-reversa/rea/dist/process/ProcessOwnershipObservation.js';const p=await h.listProcesses();console.log('REA_SCOPE_RUNTIME_LIST='+JSON.stringify({platform:h.platform,count:p.length,zeroGroups:p.filter(x=>x.processGroupId===0).length,match:p.filter(x=>x.pid===183864)}));"""
              run=subprocess.run(["node","--input-type=module","-e",script],capture_output=True,text=True,timeout=25)
              print("REA_SCOPE_RUNTIME_EXIT="+str(run.returncode))
              for line in run.stdout.splitlines():
                  if line.startswith("REA_SCOPE_RUNTIME_LIST="):print(line)
              if run.returncode!=0:print("REA_SCOPE_RUNTIME_ERR="+json.dumps(run.stderr[:300]))
          owned=pathlib.Path("/opt/rea-reversa/rea/dist/process/ProcessOwnership.js")
          if owned.is_file():
              owned_code=owned.read_bytes()
              owned_txt=owned_code.decode("utf-8")
              needle="const knownUnrelated ="
              pos=owned_txt.find(needle)
              print("REA_SCOPE_OWNERSHIP_CODE_SHA="+sha256(owned_code).hexdigest())
              print("REA_SCOPE_OWNERSHIP_MARKER_COUNT="+str(owned_txt.count(needle)))
              if pos>=0:
                  print("REA_SCOPE_OWNERSHIP_CONTEXT="+json.dumps(owned_txt[max(0,pos-200):pos+1220],separators=(",",":")))
          else:
              print("REA_SCOPE_OWNERSHIP_MISSING=1")
          from collections import Counter
          print("REA_SCOPE_DIAGNOSTIC_VERSION=2")
          print("REA_SCOPE_PID_COUNTS="+json.dumps(dict(Counter(x["status"] for x in results)),sort_keys=True))
          print("REA_SCOPE_PID_OBSERVATIONS="+json.dumps(results,separators=(",",":")))
          PY

      - name: Apply REA priority1 retained-ownership guard (one-shot)
        if: contains(github.event.head_commit.message, '[rea priority1 guard apply]')
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          script="rea-linux/install/rea_process_ownership_kernel_guard_20261028.py"
          python3 -m py_compile "$script"
          ssh_flags=(-T
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/rea-host-pin"
            -o GlobalKnownHostsFile=/dev/null
            -o HostKeyAlgorithms=ssh-ed25519
            -o ConnectTimeout=15
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=5)
          ssh_remote() {
            sshpass -e ssh "${ssh_flags[@]}" ubuntu@146.59.145.3 "$@"
          }
          patch_action() {
            ssh_remote "sudo -n python3 - $1" < "$script"
          }
          current="$(ssh_remote 'sudo -n systemctl show rea-reversa-mcp.service -p MainPID --value')"
          [[ "$current" =~ ^[0-9]+$ ]] && (( current > 0 ))
          test "$(ssh_remote 'sudo -n systemctl is-active rea-reversa-mcp.service')" = active
          patch_action selftest
          patch_action check | grep -F "REA_PRIORITY1_OWNERSHIP_STATE=original"
          patch_action apply
          patch_action check | grep -F "REA_PRIORITY1_OWNERSHIP_STATE=patched"
          if ! ssh_remote "sudo -n systemctl restart rea-reversa-mcp.service"; then
            patch_action rollback || echo "REA_PRIORITY1_OWNERSHIP_ROLLBACK_FAILED"
            ssh_remote "sudo -n systemctl restart rea-reversa-mcp.service" || true
            exit 1
          fi
          next="$(ssh_remote 'sudo -n systemctl show rea-reversa-mcp.service -p MainPID --value')"
          if [[ ! "$next" =~ ^[0-9]+$ || "$next" == "$current" ]] || \
             [[ "$(ssh_remote 'sudo -n systemctl is-active rea-reversa-mcp.service')" != active ]]; then
            patch_action rollback || echo "REA_PRIORITY1_OWNERSHIP_ROLLBACK_FAILED"
            ssh_remote "sudo -n systemctl restart rea-reversa-mcp.service" || true
            echo "REA_PRIORITY1_SERVICE_RESTART=FAIL"
            exit 1
          fi
          patch_action check | grep -F "REA_PRIORITY1_OWNERSHIP_STATE=patched"
          echo "REA_PRIORITY1_OWNERSHIP_SERVICE_RESTART=PASS"
          echo "REA_PRIORITY1_OWNERSHIP_READY_FOR_MCP_REGRESSION=PASS"

      - name: Execute existing REA MCP over authenticated SSH
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          umask 077
          bootstrap="$RUNNER_TEMP/rea-transport-remote.py"
          raw="$RUNNER_TEMP/rea-transport-private-output.txt"
          trap 'rm -f "$bootstrap" "$raw"' EXIT
          python3 - "$REA_TRANSPORT_REQUEST_PATH" > "$bootstrap" <<'PY'
          import base64, pathlib, sys
          encoded=base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode("ascii")
          print("import os")
          print("os.environ['REA_TRANSPORT_JOB_B64']="+repr(encoded))
          sys.stdout.write(pathlib.Path("ops/rea_mcp_transport_20261027.py").read_text())
          PY
          sshpass -e ssh -T \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rea-host-pin" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=5 \
            ubuntu@146.59.145.3 "python3 - --run" \
            < "$bootstrap" > "$raw"
          python3 - "$raw" "$RUNNER_TEMP/rea-result.json" <<'PY'
          import base64, json, pathlib, sys
          lines=pathlib.Path(sys.argv[1]).read_text().splitlines()
          meta=[line.split("=",1)[1] for line in lines if line.startswith("REA_TRANSPORT_META=")]
          if len(meta)!=1:
              raise RuntimeError("Transport did not return one valid status")
          status=json.loads(meta[0])
          if status.get("status")!="PASS":
              raise RuntimeError("REA transport returned failure")
          print("REA_TRANSPORT_STATUS=PASS")
          if "tool_count" in status:
              print("REA_TRANSPORT_TOOL_COUNT="+str(status["tool_count"]))
          if "schema_count" in status:
              print("REA_TRANSPORT_SCHEMA_COUNT="+str(status["schema_count"]))
          if "smoke" in status:
              print("REA_TRANSPORT_SMOKE="+status["smoke"])
              print("REA_TRANSPORT_SMOKE_RESULTS="+json.dumps(status["results"]))
          if "transport_public_key" in status:
              print("REA_TRANSPORT_PUBLIC_KEY_B64="+status["transport_public_key"])
          if "calls_executed" in status:
              print("REA_TRANSPORT_CALLS_EXECUTED="+str(status["calls_executed"]))
          sealed=[line.split("=",1)[1] for line in lines if line.startswith("REA_TRANSPORT_ENVELOPE_B64=")]
          if sealed:
              if len(sealed)!=1:
                  raise RuntimeError("Unexpected encrypted artifact count")
              artifact=json.loads(base64.b64decode(sealed[0], validate=True))
              if set(artifact)!={"version","request_sha256","sealed"}:
                  raise RuntimeError("Malformed result transport")
              pathlib.Path(sys.argv[2]).write_text(json.dumps(artifact, separators=(",",":")))
              print("REA_TRANSPORT_PRIVATE_ARTIFACT=ENCRYPTED")
          PY
      - name: Preserve encrypted result only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-680-encrypted-result
          path: ${{ runner.temp }}/rea-result.json
          if-no-files-found: ignore
          retention-days: 1
