name: Lowcost GitHub VPS alignment read only 20261110
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-alignment-readonly-20261110.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-github-vps-alignment-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Pinned SSH independent production alignment and housekeeping inventory
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          EXPECTED=7580bfa844aad2c9047c832b0446bd0ec8794e08
          APPUSER=le001_1789265592
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          JS="$ROOT/staticfiles/storefront/catalog-explorer.js"
          REPORT="$ROOT/.local-metrics/search-referrers.json"
          gitrepo() { git -c safe.directory="$ROOT" -C "$ROOT" "$@"; }
          echo ALIGN_AUDIT_MODE=READ_ONLY
          test -d "$ROOT/.git" && test -s "$ENVFILE" && test ! -L "$ENVFILE"
          test -d "$ROOT/.venv" && test -f "$JS" && test ! -L "$JS"
          ACTUAL="$(gitrepo rev-parse HEAD)"
          REMOTE_SHA="$(gitrepo ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')"
          echo "ALIGN_SITE_GITHUB_SHA=$REMOTE_SHA"
          echo "ALIGN_SITE_VPS_SHA=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED" && test "$REMOTE_SHA" = "$EXPECTED"
          echo ALIGN_SITE_COMMIT=PASS
          if test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"; then
            echo ALIGN_TRACKED_WORKTREE=PASS
          else
            echo ALIGN_TRACKED_WORKTREE=FAIL
            exit 20
          fi
          cmp -s "$ROOT/apps/storefront/static/storefront/catalog-explorer.js" "$JS"
          echo ALIGN_DEPLOYED_SHARE_JS=PASS
          test "$(systemctl show lowcost-europa.service -p User --value)" = "$APPUSER"
          nginx -t >/dev/null 2>&1
          echo ALIGN_NGINX_CONFIG=PASS
          for unit in \
            lowcost-europa.service \
            lowcost-europa-catalog-maintenance.timer \
            lowcost-europa-indexnow.timer \
            lowcost-europa-backup.timer \
            lowcost-europa-offsite-backup.timer \
            lowcost-europa-offsite-backup-health.timer \
            lowcost-europa-affiliate-report.timer \
            lowcost-europa-cavitation-availability.timer; do
              systemctl is-active --quiet "$unit"
              echo "ALIGN_UNIT_ACTIVE=$unit"
          done
          echo ALIGN_PROTECTED_UNITS=PASS_8_OF_8
          echo "ALIGN_PROJECT_DISK_KIB=$(du -sk "$ROOT" | awk '{print $1}')"
          echo "ALIGN_PROJECT_BACKUPS_DISK_KIB=$(du -sk "$ROOT/backups" | awk '{print $1}')"
          echo "ALIGN_PRIVATE_OPS_DISK_KIB=$(du -sk "$ROOT/private/ops" | awk '{print $1}')"
          echo "ALIGN_FILESYSTEM_USE_PERCENT=$(df -P "$ROOT" | awk 'NR==2{print $5}')"
          BACKUP="$(find "$ROOT/backups/daily" -maxdepth 1 -type f -name '*.dump' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if test -n "$BACKUP" && test -s "$BACKUP" && test -s "$BACKUP.sha256" && \
             (cd "$ROOT/backups/daily" && sha256sum -c "$(basename "$BACKUP.sha256")" >/dev/null); then
            echo ALIGN_LATEST_BACKUP_CHECKSUM=PASS
          else
            echo ALIGN_LATEST_BACKUP_CHECKSUM=UNAVAILABLE
          fi
          echo ALIGN_SYSTEMD_TIMERS_BEGIN
          systemctl list-timers --all --no-pager --no-legend | grep -E 'lowcost-europa' | sed -E 's/[[:space:]]+/ /g' || true
          echo ALIGN_SYSTEMD_TIMERS_END
          set -a
          . "$ENVFILE"
          set +a
          cd "$ROOT"
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py check
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py makemigrations --check --dry-run
          echo ALIGN_DJANGO_CHECKS=PASS
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PY'
          import django, hashlib, urllib.request, urllib.error
          from pathlib import Path
          from django.utils import timezone
          from django.db import connection
          from django.db.migrations.executor import MigrationExecutor
          django.setup()
          from apps.catalog.models import Offer, ExternalMetricsSnapshot
          from apps.catalog.services.search_referral_metrics import read_private_report
          from django.template.loader import get_template
          rows=sorted(Offer.objects.filter(
              source=Offer.Source.ALIEXPRESS_OWNER,is_active=True,owner_hidden=False,
              family_placements__product_family__slug="cavitacao-rf-vacuum-corpo"
          ).values_list("external_product_id","affiliate_url"))
          assert len(rows)==17 and len({x[0] for x in rows})==17 and len({x[1] for x in rows})==17
          assert all(url.startswith("https://s.click.aliexpress.com/e/") for _,url in rows)
          assert hashlib.sha256(dict(rows)["1005013070854347"].encode()).hexdigest()=="676e98c3d53e327bb6998a6ce805fdb11d9b6ebd6c6845ac9cdd394340fa73c3"
          print("ALIGN_AFFILIATE_LINKS=PASS_17_OF_17")
          get_template("catalog/owner_panel/dashboard.html")
          print("ALIGN_DASHBOARD_TEMPLATE=PASS")
          migrations=MigrationExecutor(connection)
          pending=migrations.migration_plan(migrations.loader.graph.leaf_nodes())
          print("ALIGN_UNAPPLIED_MIGRATIONS="+str(len(pending)))
          assert not pending
          report=read_private_report(Path("/srv/projects/lowcost-europa/.local-metrics/search-referrers.json"))
          assert report and report.get("meta") is not None
          print("ALIGN_LOCAL_METRICS_SCHEMA=PASS_2")
          print("ALIGN_LOCAL_METRICS_AGE_HOURS="+str(int((timezone.now()-report["checked_at"]).total_seconds()//3600)))
          print("ALIGN_META_OBSERVED_7D="+str(report["meta"]["total"]))
          print("ALIGN_META_PAID_TAGGED_7D="+str(report["meta"]["paid_tagged"]))
          print("ALIGN_SEARCH_REFERRERS_OBSERVED_7D="+str(report["total"]))
          ali=ExternalMetricsSnapshot.objects.filter(source="ALIEXPRESS").first()
          print("ALIGN_AFFILIATE_REPORT_STATUS="+("PRESENT" if ali else "NO_VERIFIED_SNAPSHOT"))
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**k): return None
          opener=urllib.request.build_opener(NoRedirect)
          base="https://www.lowcost-europa.eu"
          for path in ("/", "/pt/", "/es/", "/sitemap.txt", "/robots.txt", "/products/cavitacao-rf-vacuum-corpo/"):
              with urllib.request.urlopen(base+path, timeout=20) as resp:
                  assert resp.status==200, (path,resp.status)
                  assert resp.read(1000000)
              print("ALIGN_PUBLIC_HTTP_200="+path)
          offer=Offer.objects.get(source=Offer.Source.ALIEXPRESS_OWNER,external_product_id="1005013070854347")
          for agent in ("Mozilla/5.0 (Linux; Android 14) Chrome/131 Mobile",
                        "Mozilla/5.0 (Windows NT 10.0) Chrome/131"):
              req=urllib.request.Request(base+"/go/"+str(offer.pk)+"/",
                                         method="HEAD",headers={"User-Agent":agent})
              try: resp=opener.open(req,timeout=20)
              except urllib.error.HTTPError as exc: resp=exc
              assert resp.code==302 and resp.headers.get("Location")==offer.affiliate_url
          print("ALIGN_AFFILIATE_302=PASS_MOBILE_DESKTOP")
          print("ALIGN_PUBLIC_SITE=PASS")
          PY
          echo LOWCOST_GITHUB_VPS_AUDIT=PASS
          REMOTE
