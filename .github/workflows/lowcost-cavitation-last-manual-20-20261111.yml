name: Lowcost Cavitation 20th final owner manual affiliate guarded publish 20261111
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-cavitation-last-manual-20-20261111.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-cavitation-last-owner-link-20
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Pinned SSH verify, backup, publish exact affiliate and audit 20 cards
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          EXPECTED=9b30e5156ed51ba8b3a578ec7311068d63d9587d
          APPUSER=le001_1789265592
          FAMILY=cavitacao-rf-vacuum-corpo
          URL='https://s.click.aliexpress.com/e/_c4lDhAoP'
          gitrepo() { git -c safe.directory="$ROOT" -C "$ROOT" "$@"; }
          test -d "$ROOT/.git" && test -s "$ENVFILE" && test ! -L "$ENVFILE"
          exec 9>"$ROOT/private/ops/ptes-deploy.lock"
          flock -n 9
          test "$(gitrepo rev-parse HEAD)" = "$EXPECTED"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          test "$(gitrepo ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = "$EXPECTED"
          test "$(systemctl show lowcost-europa.service -p User --value)" = "$APPUSER"
          nginx -t >/dev/null 2>&1
          for unit in \
            lowcost-europa.service \
            lowcost-europa-catalog-maintenance.timer \
            lowcost-europa-indexnow.timer \
            lowcost-europa-backup.timer \
            lowcost-europa-offsite-backup.timer \
            lowcost-europa-offsite-backup-health.timer \
            lowcost-europa-affiliate-report.timer \
            lowcost-europa-cavitation-availability.timer; do
            systemctl is-active --quiet "$unit"
          done
          ENV_SHA="$(sha256sum "$ENVFILE" | awk '{print $1}')"
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYPRE'
          import django
          from decimal import Decimal
          django.setup()
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement,ProductFamily
          from apps.catalog.services.public_eligibility import public_eligibility_q,MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY
          from apps.catalog.services.manual_candidate_intake import resolve_aliexpress_product_url
          from apps.integrations.aliexpress.client import AliExpressClient
          url="https://s.click.aliexpress.com/e/_c4lDhAoP"
          family=ProductFamily.objects.get(slug="cavitacao-rf-vacuum-corpo")
          placements=OfferFamilyPlacement.objects.filter(product_family=family)
          eligible=placements.filter(offer__in=Offer.objects.filter(public_eligibility_q()))
          assert MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY==20
          assert placements.count()==19,(placements.count(),"placements")
          assert eligible.count()==19 and eligible.filter(
              offer__source=Offer.Source.ALIEXPRESS_OWNER).count()==19
          old=dict(eligible.values_list("offer__external_product_id","offer__affiliate_url"))
          assert len(old)==19 and len(set(old.values()))==19
          assert old["1005013070854347"]=="https://s.click.aliexpress.com/e/_c3qslKyf"
          pid,canonical=resolve_aliexpress_product_url(url)
          assert pid.isdigit() and canonical=="https://www.aliexpress.com/item/"+pid+".html"
          assert pid not in old
          assert not Offer.objects.filter(source=Offer.Source.ALIEXPRESS_OWNER,
                                          external_product_id=pid).exists()
          assert not Offer.objects.filter(affiliate_url=url).exists()
          details=AliExpressClient().get_product_detail(pid,"PT","EUR")
          assert details.product_id==pid
          assert details.title and details.title.strip()
          assert details.price is not None and Decimal(str(details.price))>0
          assert details.currency=="EUR"
          print("CAVITATION_PRECHECK=PASS_19_MANUAL_LINKS_NO_DUPLICATES")
          print("CAVITATION_LAST_PRODUCT_ID="+pid)
          print("CAVITATION_LAST_TITLE="+details.title.replace("\n"," ")[:125])
          print("CAVITATION_LAST_EUR_PRICE="+str(details.price))
          PYPRE
          snapshot_old() {
            runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYHASH'
          import django,hashlib
          django.setup()
          from apps.catalog.models import Offer,OfferFamilyPlacement
          from apps.catalog.services.public_eligibility import public_eligibility_q
          links=list(OfferFamilyPlacement.objects.filter(
              product_family__slug="cavitacao-rf-vacuum-corpo",
              offer__source=Offer.Source.ALIEXPRESS_OWNER,
              offer__in=Offer.objects.filter(public_eligibility_q())
          ).exclude(offer__affiliate_url="https://s.click.aliexpress.com/e/_c4lDhAoP"
          ).values_list("offer__external_product_id","offer__affiliate_url"))
          assert len(links)==19 and len(set(links))==19
          print(hashlib.sha256("\n".join(pid+"\t"+link for pid,link in sorted(links)).encode()).hexdigest())
          PYHASH
          }
          BEFORE_19="$(snapshot_old)"
          test -n "$BEFORE_19"
          sh "$ROOT/deploy/scripts/backup-postgres.sh"
          BACKUP="$(find "$ROOT/backups/daily" -maxdepth 1 -type f -name '*.dump' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -s "$BACKUP" && test -s "$BACKUP.sha256"
          (cd "$ROOT/backups/daily" && sha256sum -c "$(basename "$BACKUP.sha256")" >/dev/null)
          echo CAVITATION_LAST_PRODUCT_DB_BACKUP=PASS
          CHANGED=0
          rollback() {
            rc=$?
            trap - EXIT
            if test "$rc" -ne 0 && test "$CHANGED" = 1; then
              runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYUNDO' || true
          import django
          django.setup()
          from django.db import transaction
          from apps.catalog.models import Offer,OfferClick,OfferObservation,OfferFamilyPlacement,ProductFamily
          link="https://s.click.aliexpress.com/e/_c4lDhAoP"
          with transaction.atomic():
              family=ProductFamily.objects.select_for_update().get(slug="cavitacao-rf-vacuum-corpo")
              offer=Offer.objects.select_for_update().filter(
                  source=Offer.Source.ALIEXPRESS_OWNER,affiliate_url=link).first()
              if offer is not None:
                  OfferFamilyPlacement.objects.filter(product_family=family,offer=offer).delete()
                  if OfferClick.objects.filter(offer=offer).exists():
                      offer.owner_hidden=True
                      offer.save(update_fields=["owner_hidden"])
                  elif not OfferFamilyPlacement.objects.filter(offer=offer).exists():
                      OfferObservation.objects.filter(offer=offer).delete()
                      offer.delete()
              assert OfferFamilyPlacement.objects.filter(product_family=family).count()==19
          print("CAVITATION_LAST_LINK_ROLLBACK=PASS")
          PYUNDO
            fi
            exit "$rc"
          }
          trap rollback EXIT
          CHANGED=1
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py publish_owner_affiliate_link \
            --family "$FAMILY" "$URL"
          AFTER_19="$(snapshot_old)"
          test "$BEFORE_19" = "$AFTER_19"
          echo CAVITATION_ORIGINAL_19_URLS_BYTE_IDENTICAL=PASS
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYVERIFY'
          import django,urllib.request,urllib.error
          from html.parser import HTMLParser
          django.setup()
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement
          from apps.catalog.services.public_eligibility import public_eligibility_q
          link="https://s.click.aliexpress.com/e/_c4lDhAoP"
          new=Offer.objects.get(source=Offer.Source.ALIEXPRESS_OWNER,affiliate_url=link)
          assert new.external_product_id.isdigit() and new.is_active and not new.owner_hidden
          family=OfferFamilyPlacement.objects.filter(product_family__slug="cavitacao-rf-vacuum-corpo")
          visible=family.filter(offer__in=Offer.objects.filter(public_eligibility_q()))
          assert family.count()==20 and visible.count()==20
          assert visible.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()==20
          assert OfferClick.objects.filter(offer=new).count()==0
          print("CAVITATION_FINAL_OFFER_ID="+str(new.pk))
          print("CAVITATION_FAMILY=PASS_20_OF_20")
          class Cards(HTMLParser):
              def __init__(self):
                  super().__init__();self.ids=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="article":
                      d=dict(attrs)
                      if "data-offer-card" in d:
                          self.ids.append(d.get("data-offer-id"))
          base="https://www.lowcost-europa.eu"
          for prefix in ("","/pt","/es"):
              req=urllib.request.Request(base+prefix+"/products/cavitacao-rf-vacuum-corpo/",
                                          headers={"Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  assert r.status==200
                  html=r.read(2500000).decode("utf-8")
              cards=Cards();cards.feed(html)
              assert len(cards.ids)==20 and len(set(cards.ids))==20,(prefix,len(cards.ids))
              assert str(new.pk) in cards.ids
              assert html.count("data-affiliate-share-button")==20
              assert html.count("data-compare-toggle")==20
              assert html.count('class="offer-price-block offer-price-block--compact"')==20
              assert 'data-affiliate-original-url="'+link+'"' in html
              assert "data-affiliate-copy" not in html
              print("CAVITATION_PUBLIC_"+(prefix.strip("/").upper() or "BASE")+"=PASS_20")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**k):return None
          opener=urllib.request.build_opener(NoRedirect)
          for user_agent in ("Mozilla/5.0 (Linux; Android 14) Chrome/131 Mobile",
                             "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/157"):
              req=urllib.request.Request(base+"/go/"+str(new.pk)+"/",
                  method="HEAD",headers={"User-Agent":user_agent})
              try:response=opener.open(req,timeout=25)
              except urllib.error.HTTPError as exc:response=exc
              assert response.code==302 and response.headers.get("Location")==link
          assert OfferClick.objects.filter(offer=new).count()==0
          print("CAVITATION_ORIGINAL_LINK_302_ANDROID_WINDOWS=PASS")
          for slug,expected in (("hydrodermoabrasao-aqua-facial-multifuncoes",9),
                                ("pressoterapia-vacuum-drenagem",5)):
              qs=OfferFamilyPlacement.objects.filter(product_family__slug=slug,
                  offer__in=Offer.objects.filter(public_eligibility_q()))
              assert qs.count()==expected
          print("CAVITATION_OTHER_MANUAL_CATEGORIES_PRESERVED=PASS_9_AND_5")
          PYVERIFY
          test "$(gitrepo rev-parse HEAD)" = "$EXPECTED"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          test "$(sha256sum "$ENVFILE" | awk '{print $1}')" = "$ENV_SHA"
          nginx -t >/dev/null 2>&1
          for unit in \
            lowcost-europa.service \
            lowcost-europa-catalog-maintenance.timer \
            lowcost-europa-indexnow.timer \
            lowcost-europa-backup.timer \
            lowcost-europa-offsite-backup.timer \
            lowcost-europa-offsite-backup-health.timer \
            lowcost-europa-affiliate-report.timer \
            lowcost-europa-cavitation-availability.timer; do
            systemctl is-active --quiet "$unit"
          done
          echo CAVITATION_TWENTIETH_OWNER_AFFILIATE_FINAL=PASS_20_OF_20
          trap - EXIT
          REMOTE
