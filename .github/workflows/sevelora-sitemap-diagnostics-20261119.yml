name: Sevelora - one-off public sitemap diagnostics
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sevelora-sitemap-diagnostics-20261119.yml"
permissions:
  contents: read
jobs:
  check-sitemap:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read-only DNS, HTTP, Googlebot and XML checks from independent runner
        shell: bash
        run: |
          set -euo pipefail
          echo CHECK_DATE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for name in sevelora.eu www.sevelora.eu; do
            echo DNS_LOOKUP_BEGIN=$name
            getent ahostsv4 "$name" | awk '{print $1}' | sort -u | head -n 5 || true
            echo DNS_LOOKUP_END=$name
          done
          for url in 'http://sevelora.eu/sitemap.xml' 'https://www.sevelora.eu/sitemap.xml'; do
            echo REDIRECT_CHECK=$url
            curl -sS -I --connect-timeout 10 --max-time 20 "$url" | grep -iE '^HTTP/|^location:|^content-type:' || true
          done
          echo SITEMAP_NORMAL_FETCH_BEGIN
          curl -fsS -L --connect-timeout 10 --max-time 30 --retry 2 -D /tmp/sev-normal-headers.txt -o /tmp/sev-sitemap-normal.xml -w 'NORMAL_STATUS=%{http_code} NORMAL_MIME=%{content_type} NORMAL_BYTES=%{size_download} NORMAL_IP=%{remote_ip}\n' https://sevelora.eu/sitemap.xml
          grep -iE '^HTTP/|^content-type:|^x-robots-tag:|^cache-control:|^content-encoding:' /tmp/sev-normal-headers.txt || true
          echo SITEMAP_GOOGLEBOT_FETCH_BEGIN
          curl -fsS -L --connect-timeout 10 --max-time 30 --retry 2 -A 'Googlebot/2.1 (+http://www.google.com/bot.html)' -D /tmp/sev-googlebot-headers.txt -o /tmp/sev-sitemap-googlebot.xml -w 'GOOGLEBOT_STATUS=%{http_code} GOOGLEBOT_MIME=%{content_type} GOOGLEBOT_BYTES=%{size_download} GOOGLEBOT_IP=%{remote_ip}\n' https://sevelora.eu/sitemap.xml
          grep -iE '^HTTP/|^content-type:|^x-robots-tag:|^cache-control:' /tmp/sev-googlebot-headers.txt || true
          echo ROBOTS_FETCH_BEGIN
          curl -fsS -L --connect-timeout 10 --max-time 30 -D /tmp/sev-robots-headers.txt -o /tmp/sev-robots.txt -w 'ROBOTS_STATUS=%{http_code} ROBOTS_MIME=%{content_type}\n' https://sevelora.eu/robots.txt
          cat /tmp/sev-robots.txt
          echo HOMEPAGE_FETCH_BEGIN
          curl -fsS -L --connect-timeout 10 --max-time 30 -D /tmp/sev-home-headers.txt -o /tmp/sev-home.html -w 'HOME_STATUS=%{http_code} HOME_MIME=%{content_type}\n' https://sevelora.eu/
          grep -iE '^x-robots-tag:' /tmp/sev-home-headers.txt || true
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for kind in ('normal', 'googlebot'):
            payload=Path('/tmp/sev-sitemap-'+kind+'.xml').read_bytes()
            root=ET.fromstring(payload)
            urls=[(x.text or '').strip() for x in root.iter() if x.tag.endswith('}loc') or x.tag=='loc']
            print(kind.upper()+'_XML_VALID=PASS')
            print(kind.upper()+'_URL_COUNT='+str(len(urls)))
            print(kind.upper()+'_SAMPLE_HOME_PRESENT='+str('https://sevelora.eu' in urls or 'https://sevelora.eu/' in urls))
            print(kind.upper()+'_ALL_CANONICAL='+str(all(x.startswith('https://sevelora.eu') for x in urls)))
            assert len(urls)>100 and all(x.startswith('https://sevelora.eu') for x in urls)
          robots=Path('/tmp/sev-robots.txt').read_text()
          print('ROBOTS_SITEMAP_DECLARED='+str('https://sevelora.eu/sitemap.xml' in robots))
          assert 'https://sevelora.eu/sitemap.xml' in robots
          homepage=Path('/tmp/sev-home.html').read_text()
          import re
          metas=re.findall(r'<meta\s+[^>]*name="robots"[^>]*>',homepage,re.I)
          bad=any('noindex' in x.lower() for x in metas)
          print('HOMEPAGE_META_NOINDEX='+str(bad))
          assert not bad
          PY
          echo SEVELORA_PUBLIC_SITEMAP_DIAGNOSTICS=PASS
