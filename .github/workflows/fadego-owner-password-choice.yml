name: FADEGO owner password choice without minimum staging

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - ".github/workflows/fadego-owner-password-choice.yml"
      - "ops/fadego_owner_password_command.sh"

permissions:
  contents: read

concurrency:
  group: fadego-owner-password-choice-install
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/fadego-owner-password-choice-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout pinned proposed password setup command
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Offline syntax and security invariants
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/fadego_owner_password_command.sh
          sed -n '/^const fs = require/,/^JS_PASSWORD_ROTATION$/p' ops/fadego_owner_password_command.sh | sed '$d' > "$RUNNER_TEMP/fadego-rotation.js"
          node --check "$RUNNER_TEMP/fadego-rotation.js"
          grep -Fq '/root/project-secrets/fadego-staging/admin-password' ops/fadego_owner_password_command.sh
          grep -Fq 'FADEGO_PASSWORD=CONFIGURADA' ops/fadego_owner_password_command.sh
          grep -Fq 'COFRE_FADEGO=ATUALIZADO' ops/fadego_owner_password_command.sh
          grep -Fq 'FADEGO_PASSWORD=NAO_ALTERADA' ops/fadego_owner_password_command.sh
          grep -Fq 'ROLLBACK' ops/fadego_owner_password_command.sh
          grep -Fq 'scrypt' ops/fadego_owner_password_command.sh
          grep -Fq 'flock -n 9' ops/fadego_owner_password_command.sh
          grep -Fq 'passwordHash' ops/fadego_owner_password_command.sh
          grep -Fq 'pilot-admin@fadego.invalid' ops/fadego_owner_password_command.sh
          grep -Fq 'secret.length === 0' ops/fadego_owner_password_command.sh
          grep -Fq 'O terminal nao recebeu nenhum caracter.' ops/fadego_owner_password_command.sh
          if grep -Fq 'Minimo: 12' ops/fadego_owner_password_command.sh; then
            echo 'Old owner password minimum still present'; exit 2
          fi
          if grep -Fq 'secret.length < 12' ops/fadego_owner_password_command.sh; then
            echo 'Old owner password length enforcement still present'; exit 2
          fi
          # Verify the embedded SSH installer shell before invoking a paid remote runner.
          python3 - <<'PY_REMOTE_SHELL'
          from pathlib import Path
          content=Path(".github/workflows/fadego-owner-password-choice.yml").read_text()
          section=content.split("      - name: Install root-only interactive password command on pinned FADEGO VPS\n",1)[1]
          section=section.split("      - name: Confirm published login still needs the Owner to define password\n",1)[0]
          body=section.split("        run: |\n",1)[1]
          lines=[line[10:] if line.startswith("          ") else line for line in body.splitlines()]
          Path("/tmp/fadego-owner-password-ssh-step.sh").write_text("\n".join(lines)+"\n")
          PY_REMOTE_SHELL
          bash -n /tmp/fadego-owner-password-ssh-step.sh
          echo 'FADEGO_OWNER_PASSWORD_CHOICE=NO_MINIMUM_EMPTY_REJECTED_SAFE_CONTRACT_PASS'

  install:
    needs: [validate]
    if: >-
      needs.validate.result == 'success' &&
      github.event.action == 'ready_for_review' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/fadego-owner-password-choice-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed immutable installer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR and last successful FADEGO staging release
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD"
          bash -n ops/fadego_owner_password_command.sh
          pr="$(curl -fsS --max-time 25 "https://api.github.com/repos/martaxi-boss/VPS/pulls/$PR_NUMBER")"
          jq -e --arg sha "$HEAD" \
            '.state=="open" and .draft==false and .head.sha==$sha and
             .head.ref=="ops/fadego-owner-password-choice-20261018" and
             .head.repo.full_name=="martaxi-boss/VPS" and .base.ref=="main" and
             .user.login=="martaxi-boss"' <<<"$pr" >/dev/null
          app="$(curl -fsS --max-time 25 https://api.github.com/repos/martaxi-boss/fadego/pulls/15)"
          jq -e --arg sha '1d19279f834ba726c5fede3f164d537f1414d3ea' \
            '.state=="open" and .head.sha==$sha and .base.ref=="main"' <<<"$app" >/dev/null
          deployed="$(curl -fsS --max-time 25 https://api.github.com/repos/martaxi-boss/VPS/actions/runs/39077125990)"
          jq -e '.status=="completed" and .conclusion=="success" and .head_sha=="3c74b86876a540cdcdba774cdefedc9acff7e1bd"' <<<"$deployed" >/dev/null
          prior="$(curl -fsS --max-time 25 https://api.github.com/repos/martaxi-boss/VPS/actions/runs/39078425067)"
          jq -e '.status=="completed" and .conclusion=="success" and .head_sha=="36f601fde7e3c3ff56f7685c708d0ee683059319"' <<<"$prior" >/dev/null
          echo 'FADEGO_PASSWORD_CHOICE_CERTIFIED_RUNTIME=PASS'
      - name: Install root-only interactive password command on pinned FADEGO VPS
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}" || exit 2
          known="$RUNNER_TEMP/fadego-password-known-hosts"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$known"
          chmod 600 "$known"
          observed="$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')"
          test "$observed" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          source="ops/fadego_owner_password_command.sh"
          remote_source="/home/ubuntu/.fadego-password-setup-$HEAD.sh"
          digest="$(sha256sum "$source" | cut -d' ' -f1)"
          sshpass -e scp -q -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no -o ConnectTimeout=20 \
            "$source" "ubuntu@146.59.145.3:$remote_source"
          sshpass -e ssh -T -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no -o ConnectTimeout=20 \
            ubuntu@146.59.145.3 \
            "sudo -n env EXPECTED_SHA=$digest bash -c 'set -Eeuo pipefail; umask 077; \
            test -L /srv/fadego-staging/current; \
            test \"\$(readlink -f /srv/fadego-staging/current)\" = /srv/fadego-staging/releases/1d19279f834ba726c5fede3f164d537f1414d3ea; \
            test -f /root/project-secrets/fadego-staging/admin-password; \
            test -f /usr/local/sbin/fadego-password; \
            test ! -L /usr/local/sbin/fadego-password; \
            test \"\$(git hash-object /usr/local/sbin/fadego-password)\" = c734d7855de2e09b19800031969c28ac25b78e17; \
            test \"\$(stat -c %u:%a /usr/local/sbin/fadego-password)\" = 0:700; \
            tmp=\$(mktemp /usr/local/sbin/.fadego-password.XXXXXXXX); \
            install -o root -g root -m 0700 $remote_source \"\$tmp\"; \
            bash -n \"\$tmp\"; \
            test \"\$(sha256sum \"\$tmp\" | cut -d\" \" -f1)\" = \"\$EXPECTED_SHA\"; \
            mv -T \"\$tmp\" /usr/local/sbin/fadego-password; \
            echo FADEGO_PASSWORD_CHOICE=UPDATED_NO_CREDENTIAL_CHANGED'"
          sshpass -e ssh -T -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no -o ConnectTimeout=20 \
            ubuntu@146.59.145.3 "rm -f -- $remote_source"
      - name: Confirm published login still needs the Owner to define password
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 25 https://fadego.duckdns.org/login)"
          grep -Fq 'O meu Portal FADEGO' <<<"$body"
          grep -Fq 'name="password"' <<<"$body"
          if grep -Fq 'name="email"' <<<"$body"; then exit 2; fi
          echo 'FADEGO_PASSWORD_CHOICE=READY_FOR_OWNER_TERMINAL_INPUT'
