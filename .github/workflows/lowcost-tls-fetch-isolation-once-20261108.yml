name: Lowcost TLS and actual engine fetch isolation read only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-tls-fetch-isolation-once-20261108.yml']
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect private TLS failures and identify recent engine requests
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          python3 - <<'PY'
          import collections,json,re
          from pathlib import Path
          p=Path('/var/log/nginx/error.log')
          count=0
          with p.open(errors='replace') as f:
              for line in collections.deque(f,maxlen=20000):
                  if not line.startswith('2026/11/08 '):continue
                  if not any(s in line for s in ('connect() failed','upstream timed out','SSL_do_handshake() failed')):continue
                  own=('lowcost-europa.eu' in line or '127.0.0.1:8001' in line)
                  if not own:continue
                  route=re.search(r'request: "\S+ ([^ ]+)',line)
                  path=(route.group(1).split('?',1)[0] if route else 'unknown')
                  safe=path if path in ('/','/robots.txt','/sitemap.xml') else 'other'
                  print('LOWCOST_UPSTREAM_ERROR='+json.dumps(dict(time=line[:19],type='connect_refused' if 'connect() failed' in line else ('timeout' if 'upstream timed out' in line else 'tls'),path=safe)))
                  count+=1
          print('LOWCOST_RELEVANT_UPSTREAM_ERRORS='+str(count))
          PY
          systemctl is-active --quiet lowcost-europa.service
          echo LOWCOST_CURRENT_APPLICATION=ACTIVE
          REMOTE
