name: Ferrari F9 close private SolveSpace resource links and retest GUI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ferrari-f9-solvespace-resources-once-20261106.yml'
permissions:
  contents: read
concurrency:
  group: ferrari-f9-solvespace-resources-real
  cancel-in-progress: false
jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout immutable tested Ferrari source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 0b50e1d403deff8f3ccb421edd0b41c397d66b9b
          persist-credentials: false
          path: ferrari
      - name: Verify Ubuntu resource closure and GUI audit source tests
        run: |
          set -Eeuo pipefail
          python3 -m py_compile ferrari/install/vps-phase9-private-solvespace-resources.py ferrari/install/vps-phase9-gui-startup-audit.py
          python3 -m unittest discover -s ferrari/tests -p test_phase9_private_solvespace_resources.py -v
          python3 -m unittest discover -s ferrari/tests -p test_phase9_gui_startup_audit.py -v
          echo F9_SOURCE_RESOURCE_AND_GUI_TESTS=PASS
      - name: Check existing VPS host fingerprint
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS" || exit 2
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/f9-known-hosts"
          chmod 600 "$RUNNER_TEMP/f9-known-hosts"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/f9-known-hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' || exit 3
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          echo F9_EXISTING_SSH_PIN=PASS
      - name: Copy pinned source to Ferrari private runtime only
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes
                -o "UserKnownHostsFile=$RUNNER_TEMP/f9-known-hosts"
                -o GlobalKnownHostsFile=/dev/null
                -o HostKeyAlgorithms=ssh-ed25519 -o ConnectTimeout=25
                -o ServerAliveInterval=15)
          root=/srv/projects/skill-universal
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            'test -d /srv/projects/skill-universal/.runtime && test ! -L /srv/projects/skill-universal'
          sshpass -e scp "${opts[@]}" ferrari/install/vps-phase9-private-solvespace-resources.py \
            "ubuntu@146.59.145.3:$root/.runtime/f9-solvespace-res-$GITHUB_RUN_ID.py"
          sshpass -e scp "${opts[@]}" ferrari/install/vps-phase9-gui-startup-audit.py \
            "ubuntu@146.59.145.3:$root/.runtime/f9-gui-res-$GITHUB_RUN_ID.py"
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 'bash -s' -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ulimit -c 0
          root=/srv/projects/skill-universal
          run="$1"
          [[ "$run" =~ ^[0-9]+$ ]] || exit 4
          installer="$root/.runtime/f9-solvespace-res-$run.py"
          probe="$root/.runtime/f9-gui-res-$run.py"
          trap 'rm -f -- "$installer" "$probe"' EXIT
          test "$(id -un)" = ubuntu && test "$(id -u)" -ne 0
          test -f "$installer" && test -f "$probe" && test ! -L "$installer" && test ! -L "$probe"
          before="$(readlink -f "$root/current")"
          test "$before" = "$root/releases/f1f3b03525adec7018d7d629243e7b0fbb7f5087" || { echo F9_RELEASE_CHANGED_ABORT; exit 5; }
          services=(pink-iptv-backend pink-vpn fadego-staging lowcost-europa
                    pm2-iptvpn-bot pm2-telegram-robot-leads nginx postgresql@16-main)
          for s in "${services[@]}"; do
            test "$(systemctl is-active "$s")" = active || { echo "F9_PRE_SERVICE_FAILED:$s"; exit 6; }
          done
          echo F9_SOLVESPACE_RESOURCE_PRECHECK=PASS
          python3 "$installer" --repair
          python3 "$installer" --check
          echo F9_SOLVESPACE_PRIVATE_RESOURCES=PASS
          audit="$(python3 "$probe" --audit)"
          printf '%s\n' "$audit" | grep '^F9_GUI_STARTUP_PROBE=' || true
          printf '%s\n' "$audit" | python3 -c 'import sys,json; lines=[s for s in sys.stdin if s.startswith("F9_GUI_AUDIT=")]; assert len(lines)==1,lines; r=json.loads(lines[0].split("=",1)[1]); assert r.get("status")=="audit_complete" and r.get("applications_checked")==6,r; names={x["tool"]:x for x in r["results"]}; assert names["solvespace"]["startup_survived_seven_seconds"] is True,names["solvespace"]; assert r["startups_survived"]==6,r; assert r["gui_functions_certified"]==0,r; print("F9_GUI_STARTUP_6_OF_6=PASS"); print("F9_GUI_FULL_FUNCTIONS_STILL_PENDING=TRUE")'
          for pkg in solvespace libjs-three unifont; do
            test "$(dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null)" = 'install ok installed' || { echo "F9_GLOBAL_APT_CHANGED:$pkg"; exit 7; }
          done
          for s in "${services[@]}"; do
            test "$(systemctl is-active "$s")" = active || { echo "F9_POST_SERVICE_FAILED:$s"; exit 8; }
          done
          test "$(readlink -f "$root/current")" = "$before" || exit 9
          df -hT "$root"
          du -sh "$root/tools/solvespace-3.1-ubuntu24"
          echo F9_SOLVESPACE_GLOBAL_PACKAGES_PRESERVED=PASS
          echo F9_PROTECTED_SERVICES=8_OF_8_PASS
          REMOTE
