name: Ferrari - private REA deep Ghidra JADX audit one time
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ferrari-rea-deep-audit-once.yml'
permissions:
  contents: read
concurrency:
  group: ferrari-rea-deep-provider-audit-once
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'martaxi-boss/VPS' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Verify pinned VPS SSH identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/rea-audit-host"
          chmod 600 "$RUNNER_TEMP/rea-audit-host"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/rea-audit-host" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          echo 'FERRARI_REA_PINNED_SSH=PASS'
      - name: Prepare GitHub runner only
        shell: bash
        env:
          SSHPASS: '${{ secrets.VPS_SSH_PASSWORD }}'
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Execute existing Ferrari-private Ghidra and JADX smoke on VPS
        shell: bash
        env:
          SSHPASS: '${{ secrets.VPS_SSH_PASSWORD }}'
        run: |
          set -euo pipefail
          sshpass -e ssh -T \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/rea-audit-host" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=10 \
            ubuntu@146.59.145.3 \
            'bash -lc '"'"'set -euo pipefail; ROOT=/srv/projects/skill-universal; test "$(readlink -f "$ROOT/current")" = "$ROOT/releases/758e1b435317fa26277b332b75bc47c67910be81"; cd "$ROOT/current"; test -f install/vps-rea-deep-provider-smoke.sh; bash install/vps-rea-deep-provider-smoke.sh'"'"'' \
            > "$RUNNER_TEMP/ferrari-rea-deep-audit.txt" 2>&1 || {
              tail -n 40 "$RUNNER_TEMP/ferrari-rea-deep-audit.txt"
              exit 1
            }
          cat "$RUNNER_TEMP/ferrari-rea-deep-audit.txt"
          grep -q '^FERRARI_REA_DEEP_PROVIDERS=PASS$' "$RUNNER_TEMP/ferrari-rea-deep-audit.txt"
      - name: Save sanitized markers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-rea-private-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/ferrari-rea-deep-audit.txt
          if-no-files-found: warn
          retention-days: 7
