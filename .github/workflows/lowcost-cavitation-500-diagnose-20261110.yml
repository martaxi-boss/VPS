name: Lowcost diagnose cavitation HTTP 500 read only 20261110
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-cavitation-500-diagnose-20261110.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-cavitation-http500-readonly
  cancel-in-progress: false
jobs:
  read-only-diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Pinned SSH inspect public HTTP and Django exception types without changing data
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          test -s "$ENVFILE" && test -d "$ROOT/.git"
          echo "LIVE_CODE_SHA=$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)"
          for path in / /products/cavitacao-rf-vacuum-corpo/ /pt/products/cavitacao-rf-vacuum-corpo/; do
            code=$(curl --silent --show-error --output /dev/null --max-time 20 --write-out '%{http_code}' "https://www.lowcost-europa.eu$path")
            case "$path" in 
              /) echo "LIVE_HTTP_HOME=$code";;
              /products*) echo "LIVE_HTTP_CAVITATION_BASE=$code";;
              /pt*) echo "LIVE_HTTP_CAVITATION_PT=$code";;
            esac
          done
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u le001_1789265592 -- "$ROOT/.venv/bin/python" - <<'PY'
          import django,traceback
          django.setup()
          from django.test import Client
          for path in ("/","/products/cavitacao-rf-vacuum-corpo/","/pt/products/cavitacao-rf-vacuum-corpo/"):
              try:
                  response=Client(raise_request_exception=True).get(
                      path,HTTP_HOST="www.lowcost-europa.eu",
                      HTTP_USER_AGENT="Mozilla/5.0 (Linux; Android 14) Chrome/131 Mobile",
                  )
                  print("DJANGO_TEST_REQUEST="+path+"="+str(response.status_code))
              except Exception as exc:
                  print("DJANGO_TEST_REQUEST="+path+"=EXCEPTION_"+type(exc).__name__)
                  print("DJANGO_EXCEPTION_DETAIL="+str(exc).replace("\n"," ")[:280])
                  for frame in traceback.extract_tb(exc.__traceback__):
                      if ("/apps/" in frame.filename or "/django/template" in frame.filename):
                          print("DJANGO_EXCEPTION_FRAME="+frame.filename.rsplit("/",3)[-1]+":"+str(frame.lineno)+":"+frame.name)
          PY
          echo LOWCOST_HTTP500_READ_ONLY_DIAGNOSIS=PASS
          REMOTE
