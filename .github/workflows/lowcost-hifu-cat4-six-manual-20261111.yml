name: Lowcost HIFU category 4 six owner affiliate links guarded deployment 20261111
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-hifu-cat4-six-manual-20261111.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-hifu-category-four-guarded-manual-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Pinned SSH, PostgreSQL backup, atomic replacement, live verification
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          TASK="$ROOT/private/ops/hifu-six-owner-manual-20261111"
          OLD=9b30e5156ed51ba8b3a578ec7311068d63d9587d
          APPUSER=le001_1789265592
          FAMILY=hifu
          gitrepo() { git -c safe.directory="$ROOT" -C "$ROOT" "$@"; }
          test -d "$ROOT/.git" && test -s "$ENVFILE" && test ! -L "$ENVFILE"
          test ! -e "$TASK"
          exec 9>"$ROOT/private/ops/ptes-deploy.lock"
          flock -n 9
          test "$(gitrepo rev-parse HEAD)" = "$OLD"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          NEW="$(gitrepo ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')"
          test -n "$NEW" && test "$NEW" != "$OLD"
          gitrepo fetch --no-tags -q https://github.com/martaxi-boss/lowcost-europa.git main
          test "$(gitrepo rev-parse FETCH_HEAD)" = "$NEW"
          gitrepo merge-base --is-ancestor "$OLD" "$NEW"
          EXPECTED="$(printf '%s\n' \
            apps/catalog/management/commands/owner_manual_product_intake.py \
            apps/catalog/services/cavitation_availability.py \
            apps/catalog/services/manual_storefront.py \
            apps/catalog/templates/catalog/owner_panel/family_manual.html \
            apps/catalog/tests/test_cavitation_manual_only.py \
            apps/catalog/tests/test_hifu_manual_only.py \
            apps/catalog/tests/test_manual_candidate_intake.py \
            apps/catalog/tests/test_owner_manual_product_intake_command.py \
            apps/catalog/tests/test_weekly_discovery.py \
            apps/storefront/tests/test_seo_ranking_readiness.py \
            apps/storefront/templates/storefront/components/offer_card.html \
            | LC_ALL=C sort)"
          test "$(gitrepo diff --name-only "$OLD" "$NEW" | LC_ALL=C sort)" = "$EXPECTED"
          gitrepo show "$NEW:apps/catalog/services/manual_storefront.py" | grep -q 'HIFU_MANUAL_FAMILY_SLUG = "hifu"'
          echo CAT4_EXACT_ELEVEN_CODE_PATHS=PASS
          test "$(systemctl show lowcost-europa.service -p User --value)" = "$APPUSER"
          nginx -t >/dev/null 2>&1
          for unit in \
            lowcost-europa.service lowcost-europa-catalog-maintenance.timer \
            lowcost-europa-indexnow.timer lowcost-europa-backup.timer \
            lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer \
            lowcost-europa-affiliate-report.timer lowcost-europa-cavitation-availability.timer; do
            systemctl is-active --quiet "$unit"
          done
          ENV_SHA="$(sha256sum "$ENVFILE" | awk '{print $1}')"
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYPRE'
          import django
          django.setup()
          from apps.catalog.models import Offer,OfferFamilyPlacement,ProductFamily
          from apps.catalog.services.public_eligibility import MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY
          from apps.catalog.services.manual_candidate_intake import resolve_aliexpress_product_url
          from apps.integrations.aliexpress.affiliate_url import is_https_affiliate_url
          urls=(
              "https://s.click.aliexpress.com/e/_c3vykGRN",
              "https://s.click.aliexpress.com/e/_c4sSEbtd",
              "https://s.click.aliexpress.com/e/_c3EyKM7V",
              "https://s.click.aliexpress.com/e/_c3l3zGbz",
              "https://s.click.aliexpress.com/e/_c3XWrl6B",
              "https://s.click.aliexpress.com/e/_c3yeHmTV",
          )
          assert MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY==20
          assert len(urls)==len(set(urls))==6
          family=ProductFamily.objects.get(slug="hifu",display_order=4)
          assert family.status!=ProductFamily.Status.RETIRED
          old=OfferFamilyPlacement.objects.filter(product_family=family)
          assert old.count()<=20
          ids=[]
          for index,url in enumerate(urls,1):
              assert is_https_affiliate_url(url)
              pid,canonical=resolve_aliexpress_product_url(url)
              assert pid.isdigit()
              assert canonical=="https://www.aliexpress.com/item/"+pid+".html"
              ids.append(pid)
              prior=Offer.objects.filter(source=Offer.Source.ALIEXPRESS_OWNER,
                                          external_product_id=pid).first()
              assert prior is None or prior.affiliate_url==url
              print("CAT4_PREFLIGHT_LINK_"+str(index)+"=VALID product="+pid)
          assert len(set(ids))==6,"Duplicate AliExpress products in submitted links"
          print("CAT4_PREFLIGHT=PASS_SIX_UNIQUE_EXACT_OWNER_URLS")
          print("CAT4_OLD_PLACEMENTS="+str(old.count()))
          PYPRE
          sh "$ROOT/deploy/scripts/backup-postgres.sh"
          BACKUP="$(find "$ROOT/backups/daily" -maxdepth 1 -type f -name '*.dump' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -s "$BACKUP" && test -s "$BACKUP.sha256"
          (cd "$ROOT/backups/daily" && sha256sum -c "$(basename "$BACKUP.sha256")" >/dev/null)
          echo CAT4_DATABASE_BACKUP_SHA256=PASS
          mkdir -m 700 "$TASK"
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYSNAP' > "$TASK/before.json"
          import json,django
          django.setup()
          from apps.catalog.models import Offer,OfferClick,OfferCandidate,OfferFamilyPlacement,ProductFamily
          family=ProductFamily.objects.get(slug="hifu",display_order=4)
          old=list(OfferFamilyPlacement.objects.filter(product_family=family)
              .values("offer_id","selection_position","display_order","selection_reason"))
          old_ids=[x["offer_id"] for x in old]
          other={}
          for slug in (
              "cavitacao-rf-vacuum-corpo",
              "hydrodermoabrasao-aqua-facial-multifuncoes",
              "pressoterapia-vacuum-drenagem",
              "diodo-laser-remocao-tatuagens-pigmentacao",
          ):
              placements=OfferFamilyPlacement.objects.filter(product_family__slug=slug)
              other[slug]=list(placements.order_by("offer_id").values_list(
                  "offer_id","offer__source","offer__affiliate_url",
                  "selection_position","display_order","selection_reason"))
          pending=list(OfferCandidate.objects.filter(
              product_family__slug="diodo-laser-remocao-tatuagens-pigmentacao"
          ).order_by("pk").values_list("pk","status"))
          print(json.dumps({
              "placements":old,
              "old_clicks":OfferClick.objects.filter(offer_id__in=old_ids).count(),
              "other":other,
              "cat5_candidates":pending,
          },sort_keys=True))
          PYSNAP
          test -s "$TASK/before.json"
          chmod 600 "$TASK/before.json"
          echo CAT4_PRIVATE_SNAPSHOT=PASS
          CODE_CHANGED=0
          DATA_CHANGED=0
          rollback() {
            rc=$?
            trap - EXIT
            if test "$rc" -ne 0; then
              if test "$DATA_CHANGED" = 1; then
                cat "$TASK/before.json" | runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" -c '
          import django,json,sys
          django.setup()
          from django.db import transaction
          from apps.catalog.models import Offer,OfferFamilyPlacement,ProductFamily
          data=json.load(sys.stdin)
          urls=(
              "https://s.click.aliexpress.com/e/_c3vykGRN",
              "https://s.click.aliexpress.com/e/_c4sSEbtd",
              "https://s.click.aliexpress.com/e/_c3EyKM7V",
              "https://s.click.aliexpress.com/e/_c3l3zGbz",
              "https://s.click.aliexpress.com/e/_c3XWrl6B",
              "https://s.click.aliexpress.com/e/_c3yeHmTV",
          )
          with transaction.atomic():
              family=ProductFamily.objects.select_for_update().get(slug="hifu")
              new=Offer.objects.filter(source=Offer.Source.ALIEXPRESS_OWNER,
                                       affiliate_url__in=urls)
              OfferFamilyPlacement.objects.filter(product_family=family).delete()
              for row in data["placements"]:
                  OfferFamilyPlacement.objects.create(
                      product_family=family,offer_id=row["offer_id"],
                      selection_position=row["selection_position"],
                      display_order=row["display_order"],
                      selection_reason=row["selection_reason"])
              for offer in new:
                  if not OfferFamilyPlacement.objects.filter(offer=offer).exists():
                      offer.owner_hidden=True
                      offer.save(update_fields=["owner_hidden"])
              assert OfferFamilyPlacement.objects.filter(product_family=family).count()==len(data["placements"])
          print("CAT4_LEGACY_PLACEMENTS_RESTORED=PASS")
          ' || true
              fi
              if test "$CODE_CHANGED" = 1; then
                gitrepo checkout --detach -q "$OLD" || true
                while IFS= read -r changed; do
                  if test -f "$ROOT/$changed" && test ! -L "$ROOT/$changed"; then
                    chmod 644 "$ROOT/$changed" || true
                  fi
                done <<< "$EXPECTED"
                systemctl restart lowcost-europa.service || true
              fi
              echo CAT4_ROLLBACK_ATTEMPTED=TRUE
            fi
            exit "$rc"
          }
          trap rollback EXIT
          CODE_CHANGED=1
          gitrepo checkout --detach -q "$NEW"
          while IFS= read -r changed; do
            test -f "$ROOT/$changed" && test ! -L "$ROOT/$changed"
            chmod 644 "$ROOT/$changed"
            runuser -u "$APPUSER" -- test -r "$ROOT/$changed"
          done <<< "$EXPECTED"
          echo CAT4_CODE_AND_PANEL_READABLE=PASS
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py check
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py makemigrations --check --dry-run
          DATA_CHANGED=1
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYPUBLISH'
          import django
          from django.core.management import call_command
          from django.db import transaction
          django.setup()
          from apps.catalog.models import Offer,OfferFamilyPlacement,ProductFamily
          from apps.catalog.services.public_eligibility import (
              MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY,public_eligibility_q
          )
          urls=(
              "https://s.click.aliexpress.com/e/_c3vykGRN",
              "https://s.click.aliexpress.com/e/_c4sSEbtd",
              "https://s.click.aliexpress.com/e/_c3EyKM7V",
              "https://s.click.aliexpress.com/e/_c3l3zGbz",
              "https://s.click.aliexpress.com/e/_c3XWrl6B",
              "https://s.click.aliexpress.com/e/_c3yeHmTV",
          )
          assert MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY==20
          with transaction.atomic():
              family=ProductFamily.objects.select_for_update().get(slug="hifu",display_order=4)
              for index,url in enumerate(urls,1):
                  if index==1:
                      call_command("publish_owner_affiliate_link",
                                   "--family","hifu","--replace-family",url)
                  else:
                      call_command("publish_owner_affiliate_link",
                                   "--family","hifu",url)
                  offer=Offer.objects.get(source=Offer.Source.ALIEXPRESS_OWNER,affiliate_url=url)
                  assert offer.is_active and not offer.owner_hidden
                  assert OfferFamilyPlacement.objects.filter(product_family=family,offer=offer).count()==1
                  print("CAT4_MANUAL_AFFILIATE_"+str(index)+"=PASS offer="+str(offer.pk))
              items=OfferFamilyPlacement.objects.filter(product_family=family)
              assert items.count()==6
              assert items.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()==6
              assert items.filter(offer__in=Offer.objects.filter(public_eligibility_q())).count()==6
              assert set(items.values_list("offer__affiliate_url",flat=True))==set(urls)
          print("CAT4_ATOMIC_FULL_REPLACEMENT=PASS_6_MANUAL_ZERO_LEGACY")
          PYPUBLISH
          systemctl restart lowcost-europa.service
          systemctl is-active --quiet lowcost-europa.service
          sleep 3
          cat "$TASK/before.json" | runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" -c '
          import django,json,sys
          django.setup()
          from apps.catalog.models import Offer,OfferClick,OfferCandidate,OfferFamilyPlacement
          old=json.load(sys.stdin)
          assert OfferClick.objects.filter(
              offer_id__in=[r["offer_id"] for r in old["placements"]]
          ).count()>=old["old_clicks"]
          for slug,expected in old["other"].items():
              actual=list(OfferFamilyPlacement.objects.filter(product_family__slug=slug)
                  .order_by("offer_id").values_list("offer_id","offer__source",
                  "offer__affiliate_url","selection_position","display_order",
                  "selection_reason"))
              assert actual==[tuple(row) for row in expected],slug
          fifth=list(OfferCandidate.objects.filter(
              product_family__slug="diodo-laser-remocao-tatuagens-pigmentacao"
          ).order_by("pk").values_list("pk","status"))
          assert fifth==[tuple(row) for row in old["cat5_candidates"]]
          print("CAT4_OTHER_FOUR_CATEGORIES_AND_HISTORY_UNCHANGED=PASS")
          '
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYVERIFY'
          import django,urllib.request,urllib.error,time
          from html.parser import HTMLParser
          django.setup()
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement
          from apps.catalog.services.manual_storefront import MANUAL_ONLY_FAMILY_SLUGS
          from apps.catalog.services.public_eligibility import public_eligibility_q
          expected=(
              "https://s.click.aliexpress.com/e/_c3vykGRN",
              "https://s.click.aliexpress.com/e/_c4sSEbtd",
              "https://s.click.aliexpress.com/e/_c3EyKM7V",
              "https://s.click.aliexpress.com/e/_c3l3zGbz",
              "https://s.click.aliexpress.com/e/_c3XWrl6B",
              "https://s.click.aliexpress.com/e/_c3yeHmTV",
          )
          assert "hifu" in MANUAL_ONLY_FAMILY_SLUGS
          qs=OfferFamilyPlacement.objects.filter(product_family__slug="hifu")
          assert qs.count()==6
          assert qs.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()==6
          assert qs.filter(offer__in=Offer.objects.filter(public_eligibility_q())).count()==6
          offers={}
          for url in expected:
              o=Offer.objects.get(source=Offer.Source.ALIEXPRESS_OWNER,affiliate_url=url)
              assert o.is_active and not o.owner_hidden
              assert qs.filter(offer=o).count()==1
              offers[str(o.pk)]=url
              print("CAT4_LINK_STORED_EXACT=PASS offer="+str(o.pk))
          assert len(offers)==6
          class Cards(HTMLParser):
              def __init__(self):
                  super().__init__();self.ids=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="article":
                      data=dict(attrs)
                      if "data-offer-card" in data:self.ids.append(data.get("data-offer-id"))
          base="https://www.lowcost-europa.eu"
          for prefix in ("","/pt","/es"):
              path=base+prefix+"/products/hifu/"
              html=None
              for attempt in range(9):
                  try:
                      req=urllib.request.Request(path,headers={"Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=24) as res:
                          assert res.status==200
                          html=res.read(2500000).decode("utf-8")
                      break
                  except (urllib.error.HTTPError,urllib.error.URLError):
                      if attempt==8:raise
                      time.sleep(3)
              cards=Cards();cards.feed(html)
              assert len(cards.ids)==6 and set(cards.ids)==set(offers),prefix
              assert html.count('class="offer-price-block offer-price-block--compact"')==6,prefix
              assert html.count("data-affiliate-share-button")==6,prefix
              assert html.count("data-compare-toggle")==6,prefix
              assert "data-affiliate-copy" not in html,prefix
              for url in expected:
                  assert 'data-affiliate-original-url="'+url+'"' in html,(prefix,url)
              print("CAT4_LIVE_"+(prefix.strip("/").upper() or "BASE")+"=PASS_6")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect)
          for pk,url in offers.items():
              for agent in ("Mozilla/5.0 (Linux; Android 14) Chrome Mobile",
                            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/157"):
                  req=urllib.request.Request(base+"/go/"+pk+"/",method="HEAD",
                                             headers={"User-Agent":agent})
                  try:res=opener.open(req,timeout=24)
                  except urllib.error.HTTPError as exc:res=exc
                  assert res.code==302 and res.headers.get("Location")==url,(pk,res.code)
              print("CAT4_ANDROID_WINDOWS_REDIRECT_EXACT=PASS offer="+pk)
          print("CAT4_PUBLIC_SIX_MANUAL_LINKS_AND_DESIGN=PASS")
          PYVERIFY
          test "$(gitrepo rev-parse HEAD)" = "$NEW"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          test "$(gitrepo ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = "$NEW"
          test "$(sha256sum "$ENVFILE" | awk '{print $1}')" = "$ENV_SHA"
          nginx -t >/dev/null 2>&1
          for unit in \
            lowcost-europa.service lowcost-europa-catalog-maintenance.timer \
            lowcost-europa-indexnow.timer lowcost-europa-backup.timer \
            lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer \
            lowcost-europa-affiliate-report.timer lowcost-europa-cavitation-availability.timer; do
            systemctl is-active --quiet "$unit"
          done
          echo CAT4_FINAL_GITHUB_VPS_ALIGNMENT=PASS
          echo CAT4_OWNER_LINKS=PASS_6_OF_6_HIFU
          trap - EXIT
          rm -rf -- "$TASK"
          REMOTE
