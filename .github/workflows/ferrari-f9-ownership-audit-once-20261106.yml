name: Ferrari F9 Git ownership and legacy residue proof one shot
on:
  push:
    branches: [main]
    paths:
      - ferrari-release-requests/ferrari-f9-owner-inspect-20261106.json
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Exact F9 owner audit gate
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          p="$(git diff --name-only "$BEFORE" "$AFTER")"
          test "$p" = ferrari-release-requests/ferrari-f9-owner-inspect-20261106.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('ferrari-release-requests/ferrari-f9-owner-inspect-20261106.json').read_text())
          assert d=={'version':1,'phase':9,'mode':'read-only-owner-and-process-audit'}
          print('F9_OWNER_AUDIT_SCOPE=PASS')
          PY
      - name: Pinned SSH and temporary runner helper
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/known"
          chmod 600 "$RUNNER_TEMP/known"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/known" -E sha256 | awk '{print $2}')" = SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Inspect owners and actual process references without reading any private file contents
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known"
                -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 'sudo -n /usr/bin/python3 -' > "$RUNNER_TEMP/f9-owners.json" <<'PY'
          import os,json,subprocess
          from pathlib import Path
          out={'phase':9,'root_execution':os.getuid(),'projects':{},'legacy':{}}
          for name in ('pink-iptv','iptvpn-bot'):
            p=Path('/srv/projects')/name
            g=p/'.git'
            r={'project_uid':p.lstat().st_uid,'git_uid':g.lstat().st_uid,
               'project_gid':p.lstat().st_gid,'git_gid':g.lstat().st_gid,
               'git_is_directory':g.is_dir() and not g.is_symlink()}
            safe='safe.directory='+str(p)
            c=subprocess.run(['git','-c',safe,'-C',str(p),'status','--porcelain','--untracked-files=no'],
                text=True,capture_output=True,timeout=15)
            r['git_status_exit']=c.returncode
            r['tracked_modified_count']=len(c.stdout.splitlines()) if c.returncode==0 else -1
            out['projects'][name]=r
          candidates=('/root/.cursor','/root/.vscode','/root/.claude-server-commander',
               '/home/ubuntu/.local/share/rea-github-transport',
               '/root/migration-preserved','/root/migration-20260923')
          for name in candidates:
            p=Path(name)
            if not p.exists() and not p.is_symlink():
              out['legacy'][name]={'exists':False};continue
            links=0
            for proc in Path('/proc').iterdir():
              if not proc.name.isdecimal():continue
              try:
                refs=[os.readlink(proc/'exe'),os.readlink(proc/'cwd')]
                for fd in (proc/'fd').iterdir():
                  try:refs.append(os.readlink(fd))
                  except OSError:pass
                if any(x==name or x.startswith(name+'/') for x in refs):links+=1
              except (OSError,PermissionError):pass
            out['legacy'][name]={'exists':True,'uid':p.lstat().st_uid,'is_symlink':p.is_symlink(),
               'active_process_path_references':links}
          print(json.dumps(out,sort_keys=True))
          PY
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'f9-owners.json').read_text())
          print('F9_OWNER_PINK='+str(d['projects']['pink-iptv']['project_uid'])+'/'+str(d['projects']['pink-iptv']['git_uid']))
          print('F9_OWNER_BOT='+str(d['projects']['iptvpn-bot']['project_uid'])+'/'+str(d['projects']['iptvpn-bot']['git_uid']))
          print('F9_OWNER_AUDIT=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ferrari-f9-owners-${{ github.run_id }}
          path: ${{ runner.temp }}/f9-owners.json
          if-no-files-found: warn
          retention-days: 14
