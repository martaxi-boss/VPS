name: Ferrari Ubuntu - independent VPS installation
# Existing Ferrari-only transport. No changes to the VPS SSH bridge or other projects.
# The historical global-APT deployment is retired; only a pinned, private-only
# preflight and protected activation are allowed through new GitHub request files.
on:
  push:
    branches: [main]
    paths:
      - 'ferrari-release-requests/phase5-check-20261105-r2.json'
      - 'ferrari-release-requests/phase5-activate-20261105-r2.json'
      - 'ferrari-release-requests/phase5-rollback-cert-20261105.json'
      - 'ferrari-release-requests/phase6-audit-20261105.json'
      - 'ferrari-release-requests/phase6-check-20261105.json'
      - 'ferrari-release-requests/phase6-activate-20261105.json'
      - 'ferrari-release-requests/phase6-post-audit-20261105.json'
      - 'ferrari-release-requests/phase6-full-audit-20261105.json'
      - 'ferrari-release-requests/phase6-certify-deep-20261105.json'

permissions:
  contents: read

concurrency:
  group: isolated-ferrari-vps-delivery
  cancel-in-progress: false

jobs:
  ferrari-private-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exactly one new authorized phase-5 request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable SHA and phase-5 mode
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          case "$changed" in
            ferrari-release-requests/phase5-check-20261105-r2.json) MODE=--check ;;
            ferrari-release-requests/phase5-activate-20261105-r2.json) MODE=--activate ;;
            ferrari-release-requests/phase5-rollback-cert-20261105.json) MODE=--certify-rollback ;;
            ferrari-release-requests/phase6-audit-20261105.json) MODE=--audit ;;
            ferrari-release-requests/phase6-check-20261105.json) MODE=--phase6-check ;;
            ferrari-release-requests/phase6-activate-20261105.json) MODE=--phase6-activate ;;
            ferrari-release-requests/phase6-post-audit-20261105.json) MODE=--post-audit ;;
            ferrari-release-requests/phase6-full-audit-20261105.json) MODE=--full-audit ;;
            ferrari-release-requests/phase6-certify-deep-20261105.json) MODE=--deep-cert ;;
            *) echo 'FERRARI_PHASE5_REQUEST_NOT_SINGLE_OR_NOT_ALLOWED' >&2; exit 2 ;;
          esac
          python3 - "$changed" "$MODE" <<'PY'
          import json,sys
          path,mode=sys.argv[1:]
          with open(path,encoding="utf-8") as fh:
              payload=json.load(fh)
          if mode.startswith("--phase6-") or mode in ("--post-audit","--full-audit","--deep-cert"):
              expected={"version":1,"phase":6,"sha":"146145d5ada9c13e368df18727e4dbf4f5807664",
                        "mode":mode.removeprefix("--phase6-").removeprefix("--")}
          else:
              expected={"version":1,"phase":6 if mode=="--audit" else 5,
                        "sha":"40c0e1cdf31b1fe9589ad8be90e5eac06eec2856",
                        "mode":mode.removeprefix("--")}
          if payload != expected:
              raise SystemExit("FERRARI_PHASE5_REQUEST_MISMATCH")
          print("FERRARI_PHASE5_REQUEST_VALID=PASS")
          PY
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Read pinned candidate from the independent Ferrari repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 40c0e1cdf31b1fe9589ad8be90e5eac06eec2856
          persist-credentials: false
          path: ferrari

      - name: Checkout pinned Ferrari rollback-only test (no code promotion)
        if: steps.request.outputs.mode == '--certify-rollback'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: ff5f52c2354ab5f4ba4fbe9e4e50bf3de443e16d
          persist-credentials: false
          path: ferrari-cert

      - name: Checkout exact Ferrari phase-6 read-only audit script
        if: steps.request.outputs.mode == '--audit' || steps.request.outputs.mode == '--post-audit' || steps.request.outputs.mode == '--full-audit'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: f648b7282f897f61242997f3ece6e14a3111b635
          persist-credentials: false
          path: ferrari-phase6

      - name: Checkout pinned Ferrari phase-6 release for protected preflight
        if: steps.request.outputs.mode == '--phase6-check' || steps.request.outputs.mode == '--phase6-activate'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 146145d5ada9c13e368df18727e4dbf4f5807664
          persist-credentials: false
          path: ferrari-next

      - name: Checkout immutable Ferrari deep audit sources
        if: steps.request.outputs.mode == '--deep-cert'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 2a22b5b2534e8ebd1e39523a2dcf3203dcdeed04
          path: ferrari-deep
          persist-credentials: false

      - name: Validate the project-owned release script
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n ferrari/install/vps-isolated-release.sh
          test -f ferrari/engine/tool_actions.json
          echo 'FERRARI_PHASE5_PINNED_SCRIPT_SYNTAX=PASS'
          if [[ "${{ steps.request.outputs.mode }}" == '--deep-cert' ]]; then
            python3 -m py_compile ferrari-deep/install/vps-phase6-certify.py
            echo 'FERRARI_PHASE6_DEEP_SCRIPT=VALID'
          fi
          if [[ "${{ steps.request.outputs.mode }}" == '--phase6-check' ||
                "${{ steps.request.outputs.mode }}" == '--phase6-activate' ]]; then
            bash -n ferrari-next/install/vps-isolated-release.sh
            test -f ferrari-next/engine/tool_actions.json
            echo 'FERRARI_PHASE6_PINNED_RELEASE_SYNTAX=PASS'
          fi
          if [[ "${{ steps.request.outputs.mode }}" == '--audit' || "${{ steps.request.outputs.mode }}" == '--post-audit' || "${{ steps.request.outputs.mode }}" == '--full-audit' ]]; then
            test -f ferrari-phase6/install/vps-phase6-audit.py
            python3 -m py_compile ferrari-phase6/install/vps-phase6-audit.py
            echo 'FERRARI_PHASE6_AUDIT_SCRIPT_SYNTAX=PASS'
          fi

      - name: Reuse existing VPS SSH password and pinned host fingerprint
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS" || { echo 'FERRARI_VPS_SSH_SECRET_MISSING' >&2; exit 2; }
          known_hosts="$RUNNER_TEMP/ferrari-pinned-host"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$known_hosts" ||
            { echo 'FERRARI_VPS_HOST_KEY_UNAVAILABLE' >&2; exit 2; }
          chmod 600 "$known_hosts"
          fingerprint="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc" ||
            { echo 'FERRARI_VPS_HOST_KEY_MISMATCH' >&2; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          echo 'FERRARI_PHASE5_EXISTING_SSH_PIN=PASS'

      - name: Run Ferrari-only check or protected activation and read back active release
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          MODE: ${{ steps.request.outputs.mode }}
        run: |
          set -Eeuo pipefail
          SHA="40c0e1cdf31b1fe9589ad8be90e5eac06eec2856"
          [[ "$MODE" == '--check' || "$MODE" == '--activate' || "$MODE" == '--certify-rollback' || "$MODE" == '--audit' || "$MODE" == '--post-audit' || "$MODE" == '--full-audit' || "$MODE" == '--phase6-check' || "$MODE" == '--phase6-activate' ]] || exit 3
          opts=(-T -o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes
                -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-pinned-host"
                -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          BEFORE="$(sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 'readlink -e /srv/projects/skill-universal/current')"
          echo "FERRARI_PHASE5_CURRENT_BEFORE=$BEFORE"
          if [[ "$MODE" == '--phase6-check' || "$MODE" == '--phase6-activate' ]]; then
            [[ "$BEFORE" == "/srv/projects/skill-universal/releases/40c0e1cdf31b1fe9589ad8be90e5eac06eec2856" ]] ||
              { echo 'FERRARI_PHASE6_UNEXPECTED_CURRENT_BEFORE' >&2; exit 8; }
            NEXT_SHA="146145d5ada9c13e368df18727e4dbf4f5807664"
            NEXT_MODE=--check
            if [[ "$MODE" == '--phase6-activate' ]]; then NEXT_MODE=--activate; fi
            sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 \
              "bash -s -- '$NEXT_SHA' '$NEXT_MODE'" < ferrari-next/install/vps-isolated-release.sh
            AFTER="$(sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 'readlink -e /srv/projects/skill-universal/current')"
            echo "FERRARI_PHASE6_CURRENT_AFTER=$AFTER"
            if [[ "$NEXT_MODE" == '--check' ]]; then
              [[ "$BEFORE" == "$AFTER" ]] || { echo 'FERRARI_PHASE6_CHECK_CHANGED_CURRENT' >&2; exit 8; }
              echo 'FERRARI_PHASE6_CHECK=PASS'
            else
              [[ "$AFTER" == "/srv/projects/skill-universal/releases/$NEXT_SHA" ]] ||
                { echo 'FERRARI_PHASE6_ACTIVATION_SHA_MISMATCH' >&2; exit 8; }
              echo "FERRARI_PHASE6_FALLBACK_PRESERVED=$BEFORE"
              echo 'FERRARI_PHASE6_ACTIVATION=PASS'
            fi
            exit 0
          fi
          if [[ "$MODE" == '--post-audit' || "$MODE" == '--full-audit' ]]; then
            [[ "$BEFORE" == "/srv/projects/skill-universal/releases/146145d5ada9c13e368df18727e4dbf4f5807664" ]] ||
              { echo 'FERRARI_PHASE6_POST_AUDIT_RELEASE_NOT_ACTIVE' >&2; exit 7; }
            sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 \
              "cd '/srv/projects/skill-universal/current' && '/srv/projects/skill-universal/runtimes/python3.12/bin/python3.12' -B - '146145d5ada9c13e368df18727e4dbf4f5807664' '40c0e1cdf31b1fe9589ad8be90e5eac06eec2856'" \
              < ferrari-phase6/install/vps-phase6-audit.py \
              > "$RUNNER_TEMP/ferrari-phase6-audit.json"
            python3 - "$RUNNER_TEMP/ferrari-phase6-audit.json" <<'POST'
          import json,sys
          doc=json.load(open(sys.argv[1],encoding="utf-8"))
          assert doc["mode"]=="audit_only" and doc["active_release"]=="146145d5ada9c13e368df18727e4dbf4f5807664"
          assert doc["private_actions_confirmed"]==40 and not doc["missing_or_escaping_actions"]
          assert doc["selected_detected_in_active_release"]>=47,doc["selected_detected_in_active_release"]
          assert doc["fallback_preserved"] and doc["deletion_authorized"] is False
          print("FERRARI_PHASE6_POST_PRIVATE_ACTIONS=40/40_PASS")
          print("FERRARI_PHASE6_POST_CATALOGUE_FOUND="+str(doc["selected_detected_in_active_release"])+"/56")
          print("FERRARI_PHASE6_POST_LDD_SAMPLES="+str(doc["shared_libraries"].get("sampled",0)))
          external=sum(1 for row in doc["shared_libraries"]["records"]
                       for lib in row.get("libraries",[])
                       if lib["origin"]=="system_or_other_project_review")
          missing=sum(1 for row in doc["shared_libraries"]["records"]
                      for lib in row.get("libraries",[])
                      if lib["origin"]=="missing")
          print("FERRARI_PHASE6_LIBRARIES_EXTERNAL_REVIEW="+str(external))
          print("FERRARI_PHASE6_LIBRARIES_MISSING="+str(missing))
          POST
            AFTER="$(sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 'readlink -e /srv/projects/skill-universal/current')"
            echo "FERRARI_PHASE6_CURRENT_AFTER=$AFTER"
            [[ "$BEFORE" == "$AFTER" ]] ||
              { echo 'FERRARI_PHASE6_POST_AUDIT_CHANGED_CURRENT' >&2; exit 7; }
            echo 'FERRARI_PHASE6_POST_AUDIT=PASS'
            exit 0
          fi
          if [[ "$MODE" == '--audit' ]]; then
            [[ "$BEFORE" == "/srv/projects/skill-universal/releases/$SHA" ]] ||
              { echo 'FERRARI_PHASE6_BASELINE_SHA_CHANGED' >&2; exit 7; }
            # No installations, no production writes: audit owns its own code
            # and imports only the active Ferrari motor on the VPS.
            sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 \
              "cd '/srv/projects/skill-universal/current' && '/srv/projects/skill-universal/runtimes/python3.12/bin/python3.12' -B - '$SHA' '87969badbde0a77c2c181bb9605357d51a4a30c0'" \
              < ferrari-phase6/install/vps-phase6-audit.py \
              > "$RUNNER_TEMP/ferrari-phase6-audit.json"
            python3 - "$RUNNER_TEMP/ferrari-phase6-audit.json" <<'AUDIT'
          import json,sys
          doc=json.load(open(sys.argv[1],encoding="utf-8"))
          assert doc["mode"]=="audit_only" and doc["active_release"]=="40c0e1cdf31b1fe9589ad8be90e5eac06eec2856"
          assert doc["registered_actions"]==40 and doc["private_actions_confirmed"]==40
          assert doc["fallback_preserved"] and not doc["missing_or_escaping_actions"]
          assert doc["deletion_authorized"] is False and doc["global_package_ownership_proven"] is False
          print("FERRARI_PHASE6_PRIVATE_EXECUTORS=40/40_PASS")
          print("FERRARI_PHASE6_READONLY_CONSUMER_INVENTORY=PASS")
          print("FERRARI_PHASE6_LDD_SAMPLES="+str(doc["shared_libraries"].get("sampled",0)))
          AUDIT
            AFTER="$(sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 'readlink -e /srv/projects/skill-universal/current')"
            echo "FERRARI_PHASE6_CURRENT_AFTER=$AFTER"
            [[ "$BEFORE" == "$AFTER" ]] ||
              { echo 'FERRARI_PHASE6_AUDIT_CHANGED_PRODUCTION' >&2; exit 7; }
            echo 'FERRARI_PHASE6_AUDIT=PASS'
            exit 0
          fi
          if [[ "$MODE" == '--certify-rollback' ]]; then
            [[ "$BEFORE" == "/srv/projects/skill-universal/releases/$SHA" ]] ||
              { echo 'FERRARI_PHASE5_ROLLBACK_CERT_WRONG_ACTIVE_SHA' >&2; exit 5; }
            # No production symlink swap: execute the real active script's cleanup
            # and atomic switching blocks against Ferrari-owned sandbox copies.
            sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 \
              'test -f /srv/projects/skill-universal/releases/87969badbde0a77c2c181bb9605357d51a4a30c0/engine/ferrari.py && echo FERRARI_PHASE5_FALLBACK_INTACT=PASS'
            test -f ferrari-cert/tests/test_phase5_isolated_rollback.py
            sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 \
              'FERRARI_PHASE5_LIVE_ROOT=/srv/projects/skill-universal /srv/projects/skill-universal/runtimes/python3.12/bin/python3.12 -B -' \
              < ferrari-cert/tests/test_phase5_isolated_rollback.py
            AFTER="$(sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 'readlink -e /srv/projects/skill-universal/current')"
            echo "FERRARI_PHASE5_CURRENT_AFTER=$AFTER"
            [[ "$BEFORE" == "$AFTER" ]] ||
              { echo 'FERRARI_PHASE5_CERT_CHANGED_PRODUCTION' >&2; exit 6; }
            echo "FERRARI_PHASE5_ROLLBACK_CERTIFIED=PASS"
            exit 0
          fi
          sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 \
            "bash -s -- '$SHA' '$MODE'" < ferrari/install/vps-isolated-release.sh
          AFTER="$(sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 'readlink -e /srv/projects/skill-universal/current')"
          echo "FERRARI_PHASE5_CURRENT_AFTER=$AFTER"
          if [[ "$MODE" == '--check' ]]; then
            [[ "$BEFORE" == "$AFTER" ]] || { echo 'FERRARI_PHASE5_CHECK_CHANGED_CURRENT' >&2; exit 4; }
            echo 'FERRARI_PHASE5_CHECK=PASS'
          else
            [[ "$AFTER" == "/srv/projects/skill-universal/releases/$SHA" ]] ||
              { echo 'FERRARI_PHASE5_ACTIVE_SHA_MISMATCH' >&2; exit 5; }
            echo "FERRARI_PHASE5_ACTIVATION=PASS"
            echo "FERRARI_PHASE5_FALLBACK_PRESERVED=$BEFORE"
          fi

      - name: Return safe Ferrari-only phase-6 audit evidence
        if: steps.request.outputs.mode == '--audit' || steps.request.outputs.mode == '--post-audit' || steps.request.outputs.mode == '--full-audit'
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-phase6-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/ferrari-phase6-audit.json
          if-no-files-found: error
          retention-days: 14
