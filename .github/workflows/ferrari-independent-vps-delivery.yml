name: Ferrari Ubuntu - independent VPS installation
# Existing Ferrari-only transport. No changes to the VPS SSH bridge or other projects.
# The historical global-APT deployment is retired; only a pinned, private-only
# preflight and protected activation are allowed through new GitHub request files.
on:
  push:
    branches: [main]
    paths:
      - 'ferrari-release-requests/phase5-check-20261105-r2.json'
      - 'ferrari-release-requests/phase5-activate-20261105-r2.json'
      - 'ferrari-release-requests/phase5-rollback-cert-20261105.json'
      - 'ferrari-release-requests/phase6-audit-20261105.json'
      - 'ferrari-release-requests/phase6-check-20261105.json'
      - 'ferrari-release-requests/phase6-activate-20261105.json'
      - 'ferrari-release-requests/phase6-post-audit-20261105.json'
      - 'ferrari-release-requests/phase6-full-audit-20261105.json'
      - 'ferrari-release-requests/phase6-certify-deep-20261105.json'
      - 'ferrari-release-requests/phase6-hygiene-preview-20261105.json'
      - 'ferrari-release-requests/phase6-hygiene-apply-20261105.json'
      - 'ferrari-release-requests/phase6-symlink-final-20261105.json'
      - 'ferrari-release-requests/phase6-venvs-preview-20261105.json'
      - 'ferrari-release-requests/phase6-venvs-apply-20261105.json'
      - 'ferrari-release-requests/phase6-final-preview-20261105.json'
      - 'ferrari-release-requests/phase6-final-apply-20261105.json'
      - 'ferrari-release-requests/phase7-check-20261105.json'
      - 'ferrari-release-requests/phase7-activate-20261105.json'
      - 'ferrari-release-requests/phase7-certify-20261105.json'
      - 'ferrari-release-requests/universal-catalog-check-20261106.json'
      - 'ferrari-release-requests/universal-catalog-activate-20261106.json'
      - 'ferrari-release-requests/universal-catalog-preview-20261106.json'
      - 'ferrari-release-requests/universal-catalog-apply-20261106.json'
      - 'ferrari-release-requests/universal-catalog-deep-audit-20261106.json'
      - 'ferrari-release-requests/universal-catalog-empty-preview-20261106.json'
      - 'ferrari-release-requests/universal-catalog-empty-apply-20261106.json'
      - 'ferrari-release-requests/universal-f9-apt-consumers-20261106.json'
      - 'ferrari-release-requests/universal-f9-dpkg-confirm-20261106.json'
      - 'ferrari-release-requests/universal-f9-qgis-native-20261106.json'
      - 'ferrari-release-requests/universal-f9-qgis-ogr-20261106.json'
      - 'ferrari-release-requests/universal-f9-qgis-geojson-20261106.json'
      - 'ferrari-release-requests/universal-f9-providers-diagnose-20261106.json'
      - 'ferrari-release-requests/universal-f9-hdf5-preview-20261106.json'
      - 'ferrari-release-requests/universal-f9-hdf5-apply-20261106.json'
      - 'ferrari-release-requests/universal-f9-pdal-runtime-20261106.json'
      - 'ferrari-release-requests/universal-f9-librecad-20261106.json'
      - 'ferrari-release-requests/universal-f9-librecad-xvfb-20261106.json'
      - 'ferrari-release-requests/universal-f10-precheck-20261106.json'
      - 'ferrari-release-requests/universal-f10-activate-20261106.json'
      - 'ferrari-release-requests/universal-f10-hygiene-preview-20261106.json'
      - 'ferrari-release-requests/universal-f10-hygiene-apply-20261106.json'
      - 'ferrari-release-requests/universal-f10-legacy-state-audit-20261106.json'
      - 'ferrari-release-requests/universal-f11-pdal-las-20261107.json'
      - 'ferrari-release-requests/universal-final-acceptance-20261107.json'
      - 'ferrari-release-requests/universal-f10-hygiene-preview-r2-20261106.json'
      - 'ferrari-release-requests/universal-qa-precheck-20261108.json'
      - 'ferrari-release-requests/universal-qa-activate-20261108.json'
      - 'ferrari-release-requests/universal-runtime-precheck-20261108.json'
      - 'ferrari-release-requests/universal-runtime-precheck-r2-20261108.json'
      - 'ferrari-release-requests/universal-runtime-precheck-r3-20261108.json'
      - 'ferrari-release-requests/universal-runtime-activate-20261108.json'
      - 'ferrari-release-requests/universal-valkey-precheck-20261108.json'
      - 'ferrari-release-requests/universal-valkey-activate-20261108.json'

permissions:
  contents: read

concurrency:
  group: isolated-ferrari-vps-delivery
  cancel-in-progress: false

jobs:
  ferrari-private-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exactly one new authorized phase-5 request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable SHA and phase-5 mode
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          case "$changed" in
            ferrari-release-requests/phase5-check-20261105-r2.json) MODE=--check ;;
            ferrari-release-requests/phase5-activate-20261105-r2.json) MODE=--activate ;;
            ferrari-release-requests/phase5-rollback-cert-20261105.json) MODE=--certify-rollback ;;
            ferrari-release-requests/phase6-audit-20261105.json) MODE=--audit ;;
            ferrari-release-requests/phase6-check-20261105.json) MODE=--phase6-check ;;
            ferrari-release-requests/phase6-activate-20261105.json) MODE=--phase6-activate ;;
            ferrari-release-requests/phase6-post-audit-20261105.json) MODE=--post-audit ;;
            ferrari-release-requests/phase6-full-audit-20261105.json) MODE=--full-audit ;;
            ferrari-release-requests/phase6-certify-deep-20261105.json) MODE=--deep-cert ;;
            ferrari-release-requests/phase6-hygiene-preview-20261105.json) MODE=--hygiene-preview ;;
            ferrari-release-requests/phase6-hygiene-apply-20261105.json) MODE=--hygiene-apply ;;
            ferrari-release-requests/phase6-symlink-final-20261105.json) MODE=--deep-final ;;
            ferrari-release-requests/phase6-venvs-preview-20261105.json) MODE=--venvs-preview ;;
            ferrari-release-requests/phase6-venvs-apply-20261105.json) MODE=--venvs-apply ;;
            ferrari-release-requests/phase6-final-preview-20261105.json) MODE=--final-preview ;;
            ferrari-release-requests/phase6-final-apply-20261105.json) MODE=--final-apply ;;
            ferrari-release-requests/phase7-check-20261105.json) MODE=--phase7-check ;;
            ferrari-release-requests/phase7-activate-20261105.json) MODE=--phase7-activate ;;
            ferrari-release-requests/phase7-certify-20261105.json) MODE=--phase7-certify ;;
            ferrari-release-requests/universal-catalog-check-20261106.json) MODE=--universal-check ;;
            ferrari-release-requests/universal-catalog-activate-20261106.json) MODE=--universal-activate ;;
            ferrari-release-requests/universal-catalog-preview-20261106.json) MODE=--universal-preview ;;
            ferrari-release-requests/universal-catalog-apply-20261106.json) MODE=--universal-apply ;;
            ferrari-release-requests/universal-catalog-deep-audit-20261106.json) MODE=--universal-deep-audit ;;
            ferrari-release-requests/universal-catalog-empty-preview-20261106.json) MODE=--universal-empty-preview ;;
            ferrari-release-requests/universal-catalog-empty-apply-20261106.json) MODE=--universal-empty-apply ;;
            ferrari-release-requests/universal-f9-apt-consumers-20261106.json) MODE=--universal-f9-consumers ;;
            ferrari-release-requests/universal-f9-dpkg-confirm-20261106.json) MODE=--universal-f9-dpkg-confirm ;;
            ferrari-release-requests/universal-f9-qgis-native-20261106.json) MODE=--universal-f9-qgis-native ;;
            ferrari-release-requests/universal-f9-qgis-ogr-20261106.json) MODE=--universal-f9-qgis-ogr ;;
            ferrari-release-requests/universal-f9-qgis-geojson-20261106.json) MODE=--universal-f9-qgis-geojson ;;
            ferrari-release-requests/universal-f9-providers-diagnose-20261106.json) MODE=--universal-f9-providers-diagnose ;;
            ferrari-release-requests/universal-f9-hdf5-preview-20261106.json) MODE=--universal-f9-hdf5-preview ;;
            ferrari-release-requests/universal-f9-hdf5-apply-20261106.json) MODE=--universal-f9-hdf5-apply ;;
            ferrari-release-requests/universal-f9-pdal-runtime-20261106.json) MODE=--universal-f9-pdal-runtime ;;
            ferrari-release-requests/universal-f9-librecad-20261106.json) MODE=--universal-f9-librecad ;;
            ferrari-release-requests/universal-f9-librecad-xvfb-20261106.json) MODE=--universal-f9-librecad ;;
            ferrari-release-requests/universal-f10-precheck-20261106.json) MODE=--universal-f10-precheck ;;
            ferrari-release-requests/universal-f10-activate-20261106.json) MODE=--universal-f10-activate ;;
            ferrari-release-requests/universal-f10-hygiene-preview-20261106.json) MODE=--universal-f10-hygiene-preview ;;
            ferrari-release-requests/universal-f10-hygiene-apply-20261106.json) MODE=--universal-f10-hygiene-apply ;;
            ferrari-release-requests/universal-f10-legacy-state-audit-20261106.json) MODE=--universal-f10-legacy-state-audit ;;
            ferrari-release-requests/universal-f11-pdal-las-20261107.json) MODE=--universal-f11-pdal-las ;;
            ferrari-release-requests/universal-final-acceptance-20261107.json) MODE=--universal-final-acceptance ;;
            ferrari-release-requests/universal-f10-hygiene-preview-r2-20261106.json) MODE=--universal-f10-hygiene-preview ;;
            ferrari-release-requests/universal-qa-precheck-20261108.json) MODE=--universal-qa-precheck ;;
            ferrari-release-requests/universal-qa-activate-20261108.json) MODE=--universal-qa-activate ;;
            ferrari-release-requests/universal-runtime-precheck-20261108.json) MODE=--universal-runtime-precheck ;;
            ferrari-release-requests/universal-runtime-precheck-r2-20261108.json) MODE=--universal-runtime-precheck ;;
            ferrari-release-requests/universal-runtime-precheck-r3-20261108.json) MODE=--universal-runtime-precheck ;;
            ferrari-release-requests/universal-runtime-activate-20261108.json) MODE=--universal-runtime-activate ;;
            ferrari-release-requests/universal-valkey-precheck-20261108.json) MODE=--universal-valkey-precheck ;;
            ferrari-release-requests/universal-valkey-activate-20261108.json) MODE=--universal-valkey-activate ;;
            *) echo 'FERRARI_PHASE5_REQUEST_NOT_SINGLE_OR_NOT_ALLOWED' >&2; exit 2 ;;
          esac
          if [[ "$MODE" == --universal-* ]]; then
            added="$(git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA")"
            [[ "$added" == "$changed" ]] || { echo 'FERRARI_UNIVERSAL_REQUEST_NOT_NEW' >&2; exit 2; }
          fi
          python3 - "$changed" "$MODE" <<'PY'
          import json,sys
          path,mode=sys.argv[1:]
          with open(path,encoding="utf-8") as fh:
              payload=json.load(fh)
          if mode in ("--universal-valkey-precheck","--universal-valkey-activate"):
              expected={"version":1,"phase":"universal-catalog",
                        "sha":"fc68bf215b2541a8295796ebe3d0ae7c7c95861e",
                        "mode":mode.removeprefix("--universal-")}
          elif mode in ("--universal-runtime-precheck", "--universal-runtime-activate"):
              expected={"version":1,"phase":"universal-catalog",
                        "sha":"a2181ce589e9967546949c3e3c143e56e98095f0",
                        "mode":mode.removeprefix("--universal-")}
          elif mode in ("--universal-qa-precheck", "--universal-qa-activate"):
              expected={"version":1,"phase":"universal-catalog",
                        "sha":"e83ed6dff335459c0fb3526b56241768dbe3b635",
                        "mode":mode.removeprefix("--universal-")}
          elif mode == "--universal-final-acceptance":
              expected={"version":1,"phase":"universal-catalog",
                        "sha":"be0b94eec679940168c6c700b022e3b00afcc478",
                        "mode":"final-acceptance"}
          elif mode == "--universal-f11-pdal-las":
              expected={"version":1,"phase":"universal-catalog",
                        "sha":"1a7566c88ffd344ec3fb0e92ff6f8910162fdf24",
                        "mode":"f11-pdal-las"}
          elif mode in ("--universal-f10-precheck","--universal-f10-activate",
                     "--universal-f10-hygiene-preview","--universal-f10-hygiene-apply",
                     "--universal-f10-legacy-state-audit"):
              expected={"version":1,"phase":"universal-catalog",
                        "sha":"205c6f0e970259c79fa2111b6670c2fe1672fb27",
                        "mode":mode.removeprefix("--universal-")}
          elif mode.startswith("--universal-"):
              expected={"version":1,"phase":"universal-catalog",
                        "sha":"7bf6dcecf15da26502c5969b5eee54d5e116fc32",
                        "mode":mode.removeprefix("--universal-")}
          elif mode.startswith("--phase7-"):
              expected={"version":1,"phase":7,"sha":"758e1b435317fa26277b332b75bc47c67910be81",
                        "mode":mode.removeprefix("--phase7-")}
          elif mode.startswith("--phase6-") or mode in ("--post-audit","--full-audit","--deep-cert","--deep-final","--hygiene-preview","--hygiene-apply","--venvs-preview","--venvs-apply","--final-preview","--final-apply"):
              expected={"version":1,"phase":6,"sha":"146145d5ada9c13e368df18727e4dbf4f5807664",
                        "mode":mode.removeprefix("--phase6-").removeprefix("--")}
          else:
              expected={"version":1,"phase":6 if mode=="--audit" else 5,
                        "sha":"40c0e1cdf31b1fe9589ad8be90e5eac06eec2856",
                        "mode":mode.removeprefix("--")}
          if payload != expected:
              raise SystemExit("FERRARI_PHASE5_REQUEST_MISMATCH")
          print("FERRARI_PHASE5_REQUEST_VALID=PASS")
          PY
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Read pinned candidate from the independent Ferrari repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 40c0e1cdf31b1fe9589ad8be90e5eac06eec2856
          persist-credentials: false
          path: ferrari

      - name: Checkout pinned Ferrari rollback-only test (no code promotion)
        if: steps.request.outputs.mode == '--certify-rollback'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: ff5f52c2354ab5f4ba4fbe9e4e50bf3de443e16d
          persist-credentials: false
          path: ferrari-cert

      - name: Checkout exact Ferrari phase-6 read-only audit script
        if: steps.request.outputs.mode == '--audit' || steps.request.outputs.mode == '--post-audit' || steps.request.outputs.mode == '--full-audit'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: f648b7282f897f61242997f3ece6e14a3111b635
          persist-credentials: false
          path: ferrari-phase6

      - name: Checkout pinned Ferrari phase-6 release for protected preflight
        if: steps.request.outputs.mode == '--phase6-check' || steps.request.outputs.mode == '--phase6-activate'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 146145d5ada9c13e368df18727e4dbf4f5807664
          persist-credentials: false
          path: ferrari-next

      - name: Checkout immutable Ferrari deep audit sources
        if: steps.request.outputs.mode == '--deep-cert' || steps.request.outputs.mode == '--deep-final'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: ${{ steps.request.outputs.mode == '--deep-final' && '2a9e44918093cc86d2cb3f5ad04f40116c02171e' || '2a22b5b2534e8ebd1e39523a2dcf3203dcdeed04' }}
          path: ferrari-deep
          persist-credentials: false

      - name: Checkout trusted Ferrari F6 bounded cleanup implementation
        if: steps.request.outputs.mode == '--hygiene-preview' || steps.request.outputs.mode == '--hygiene-apply'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: fd985327dedf855042435ff7a4ce9aaa0b1a17b4
          path: ferrari-clean
          persist-credentials: false

      - name: Checkout pinned Ferrari Python private venv migration
        if: steps.request.outputs.mode == '--venvs-preview' || steps.request.outputs.mode == '--venvs-apply'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 9e3be530f8c5d2f8374f956f1524c89bd78f6b1f
          path: ferrari-venvs
          persist-credentials: false

      - name: Checkout immutable Ferrari final hygiene source
        if: steps.request.outputs.mode == '--final-preview' || steps.request.outputs.mode == '--final-apply'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: fa832a71b7164e5163b89d14ee757bdba3b96f72
          path: ferrari-final
          persist-credentials: false

      - name: Checkout exactly pinned Ferrari phase-7 private release and certificate
        if: steps.request.outputs.mode == '--phase7-check' || steps.request.outputs.mode == '--phase7-activate' || steps.request.outputs.mode == '--phase7-certify'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 758e1b435317fa26277b332b75bc47c67910be81
          persist-credentials: false
          path: ferrari-f7

      - name: Checkout immutable universal Ferrari catalog and hygiene source
        if: startsWith(steps.request.outputs.mode, '--universal-')
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 7bf6dcecf15da26502c5969b5eee54d5e116fc32
          persist-credentials: false
          path: ferrari-universal

      - name: Checkout pinned Ferrari F10 modern universal release
        if: steps.request.outputs.mode == '--universal-f10-precheck' || steps.request.outputs.mode == '--universal-f10-activate' || steps.request.outputs.mode == '--universal-f10-hygiene-preview' || steps.request.outputs.mode == '--universal-f10-hygiene-apply' || steps.request.outputs.mode == '--universal-f10-legacy-state-audit'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: f6bb0d74f12ec18dcd700649a3c26b3b83caf9e9
          path: ferrari-f10
          persist-credentials: false

      - name: Checkout immutable Ferrari final acceptance source
        if: steps.request.outputs.mode == '--universal-final-acceptance'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: be0b94eec679940168c6c700b022e3b00afcc478
          path: ferrari-accept
          persist-credentials: false

      - name: Checkout pinned Ferrari F11 private PDAL LAS functional test
        if: steps.request.outputs.mode == '--universal-f11-pdal-las'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 1a7566c88ffd344ec3fb0e92ff6f8910162fdf24
          path: ferrari-f11-pdal
          persist-credentials: false

      - name: Checkout immutable Ferrari old-release deep-audit source
        if: steps.request.outputs.mode == '--universal-deep-audit'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: bd7b21c6302dc24282ddb9704f2462fdd922d880
          persist-credentials: false
          path: ferrari-deep-audit

      - name: Checkout immutable audited-empty-runtime Ferrari cleanup source
        if: steps.request.outputs.mode == '--universal-empty-preview' || steps.request.outputs.mode == '--universal-empty-apply'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 4805b9e8e885de8816340bf01f9ec9286181621b
          persist-credentials: false
          path: ferrari-empty-hygiene

      - name: Checkout pinned Ferrari F9 readonly APT consumer audit
        if: steps.request.outputs.mode == '--universal-f9-consumers'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 540aafd4617d064f347b7b72c99217c4e9168dd6
          persist-credentials: false
          path: ferrari-f9-apt

      - name: Checkout Ferrari F9 independent dpkg status verifier
        if: steps.request.outputs.mode == '--universal-f9-dpkg-confirm'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: a139b8ec31848fc1f4b2c98f6cfa03e6cc239a78
          persist-credentials: false
          path: ferrari-f9-dpkg

      - name: Checkout pinned Ferrari-native QGIS functional certificate
        if: steps.request.outputs.mode == '--universal-f9-qgis-native'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: b3fe4f78a1fbdd34a33df2fdbef1889008f30d70
          persist-credentials: false
          path: ferrari-qgis-native

      - name: Checkout corrected immutable QGIS OGR verification script
        if: steps.request.outputs.mode == '--universal-f9-qgis-ogr'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: c98deda66b7fcc1c01cac27f1101302afd16856c
          persist-credentials: false
          path: ferrari-qgis-ogr

      - name: Checkout pinned Ferrari native QGIS GeoJSON certificate
        if: steps.request.outputs.mode == '--universal-f9-qgis-geojson'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: d5a347799a9f94081e6d08e15603fb68e6145df0
          persist-credentials: false
          path: ferrari-qgis-geojson

      - name: Checkout pinned Ferrari QGIS/PDAL isolated provider diagnostic
        if: steps.request.outputs.mode == '--universal-f9-providers-diagnose'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 2fc738b15de9d8f9bcc30a50d6e4a1e5b5851d68
          persist-credentials: false
          path: ferrari-qgis-providers

      - name: Checkout pinned Ferrari LibreCAD DXF-to-PDF certificate
