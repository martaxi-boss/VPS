name: Ferrari Ubuntu - independent VPS installation
# Existing Ferrari-only transport. No changes to the VPS SSH bridge or other projects.
# The historical global-APT deployment is retired; only a pinned, private-only
# preflight and protected activation are allowed through new GitHub request files.
on:
  push:
    branches: [main]
    paths:
      - 'ferrari-release-requests/phase5-check-20261105-r2.json'
      - 'ferrari-release-requests/phase5-activate-20261105-r2.json'
      - 'ferrari-release-requests/phase5-rollback-cert-20261105.json'
      - 'ferrari-release-requests/phase6-audit-20261105.json'
      - 'ferrari-release-requests/phase6-check-20261105.json'
      - 'ferrari-release-requests/phase6-activate-20261105.json'
      - 'ferrari-release-requests/phase6-post-audit-20261105.json'
      - 'ferrari-release-requests/phase6-full-audit-20261105.json'
      - 'ferrari-release-requests/phase6-certify-deep-20261105.json'
      - 'ferrari-release-requests/phase6-hygiene-preview-20261105.json'
      - 'ferrari-release-requests/phase6-hygiene-apply-20261105.json'
      - 'ferrari-release-requests/phase6-symlink-final-20261105.json'
      - 'ferrari-release-requests/phase6-venvs-preview-20261105.json'
      - 'ferrari-release-requests/phase6-venvs-apply-20261105.json'
      - 'ferrari-release-requests/phase6-final-preview-20261105.json'
      - 'ferrari-release-requests/phase6-final-apply-20261105.json'
      - 'ferrari-release-requests/phase7-check-20261105.json'
      - 'ferrari-release-requests/phase7-activate-20261105.json'
      - 'ferrari-release-requests/phase7-certify-20261105.json'
      - 'ferrari-release-requests/universal-catalog-check-20261106.json'
      - 'ferrari-release-requests/universal-catalog-activate-20261106.json'
      - 'ferrari-release-requests/universal-catalog-preview-20261106.json'
      - 'ferrari-release-requests/universal-catalog-apply-20261106.json'

permissions:
  contents: read

concurrency:
  group: isolated-ferrari-vps-delivery
  cancel-in-progress: false

jobs:
  ferrari-private-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exactly one new authorized phase-5 request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate immutable SHA and phase-5 mode
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          case "$changed" in
            ferrari-release-requests/phase5-check-20261105-r2.json) MODE=--check ;;
            ferrari-release-requests/phase5-activate-20261105-r2.json) MODE=--activate ;;
            ferrari-release-requests/phase5-rollback-cert-20261105.json) MODE=--certify-rollback ;;
            ferrari-release-requests/phase6-audit-20261105.json) MODE=--audit ;;
            ferrari-release-requests/phase6-check-20261105.json) MODE=--phase6-check ;;
            ferrari-release-requests/phase6-activate-20261105.json) MODE=--phase6-activate ;;
            ferrari-release-requests/phase6-post-audit-20261105.json) MODE=--post-audit ;;
            ferrari-release-requests/phase6-full-audit-20261105.json) MODE=--full-audit ;;
            ferrari-release-requests/phase6-certify-deep-20261105.json) MODE=--deep-cert ;;
            ferrari-release-requests/phase6-hygiene-preview-20261105.json) MODE=--hygiene-preview ;;
            ferrari-release-requests/phase6-hygiene-apply-20261105.json) MODE=--hygiene-apply ;;
            ferrari-release-requests/phase6-symlink-final-20261105.json) MODE=--deep-final ;;
            ferrari-release-requests/phase6-venvs-preview-20261105.json) MODE=--venvs-preview ;;
            ferrari-release-requests/phase6-venvs-apply-20261105.json) MODE=--venvs-apply ;;
            ferrari-release-requests/phase6-final-preview-20261105.json) MODE=--final-preview ;;
            ferrari-release-requests/phase6-final-apply-20261105.json) MODE=--final-apply ;;
            ferrari-release-requests/phase7-check-20261105.json) MODE=--phase7-check ;;
            ferrari-release-requests/phase7-activate-20261105.json) MODE=--phase7-activate ;;
            ferrari-release-requests/phase7-certify-20261105.json) MODE=--phase7-certify ;;
            ferrari-release-requests/universal-catalog-check-20261106.json) MODE=--universal-check ;;
            ferrari-release-requests/universal-catalog-activate-20261106.json) MODE=--universal-activate ;;
            ferrari-release-requests/universal-catalog-preview-20261106.json) MODE=--universal-preview ;;
            ferrari-release-requests/universal-catalog-apply-20261106.json) MODE=--universal-apply ;;
            *) echo 'FERRARI_PHASE5_REQUEST_NOT_SINGLE_OR_NOT_ALLOWED' >&2; exit 2 ;;
          esac
          if [[ "$MODE" == --universal-* ]]; then
            added="$(git diff --name-only --diff-filter=A "$BEFORE_SHA" "$AFTER_SHA")"
            [[ "$added" == "$changed" ]] || { echo 'FERRARI_UNIVERSAL_REQUEST_NOT_NEW' >&2; exit 2; }
          fi
          python3 - "$changed" "$MODE" <<'PY'
          import json,sys
          path,mode=sys.argv[1:]
          with open(path,encoding="utf-8") as fh:
              payload=json.load(fh)
          if mode.startswith("--universal-"):
              expected={"version":1,"phase":"universal-catalog",
                        "sha":"7bf6dcecf15da26502c5969b5eee54d5e116fc32",
                        "mode":mode.removeprefix("--universal-")}
          elif mode.startswith("--phase7-"):
              expected={"version":1,"phase":7,"sha":"758e1b435317fa26277b332b75bc47c67910be81",
                        "mode":mode.removeprefix("--phase7-")}
          elif mode.startswith("--phase6-") or mode in ("--post-audit","--full-audit","--deep-cert","--deep-final","--hygiene-preview","--hygiene-apply","--venvs-preview","--venvs-apply","--final-preview","--final-apply"):
              expected={"version":1,"phase":6,"sha":"146145d5ada9c13e368df18727e4dbf4f5807664",
                        "mode":mode.removeprefix("--phase6-").removeprefix("--")}
          else:
              expected={"version":1,"phase":6 if mode=="--audit" else 5,
                        "sha":"40c0e1cdf31b1fe9589ad8be90e5eac06eec2856",
                        "mode":mode.removeprefix("--")}
          if payload != expected:
              raise SystemExit("FERRARI_PHASE5_REQUEST_MISMATCH")
          print("FERRARI_PHASE5_REQUEST_VALID=PASS")
          PY
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Read pinned candidate from the independent Ferrari repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 40c0e1cdf31b1fe9589ad8be90e5eac06eec2856
          persist-credentials: false
          path: ferrari

      - name: Checkout pinned Ferrari rollback-only test (no code promotion)
        if: steps.request.outputs.mode == '--certify-rollback'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: ff5f52c2354ab5f4ba4fbe9e4e50bf3de443e16d
          persist-credentials: false
          path: ferrari-cert

      - name: Checkout exact Ferrari phase-6 read-only audit script
        if: steps.request.outputs.mode == '--audit' || steps.request.outputs.mode == '--post-audit' || steps.request.outputs.mode == '--full-audit'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: f648b7282f897f61242997f3ece6e14a3111b635
          persist-credentials: false
          path: ferrari-phase6

      - name: Checkout pinned Ferrari phase-6 release for protected preflight
        if: steps.request.outputs.mode == '--phase6-check' || steps.request.outputs.mode == '--phase6-activate'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 146145d5ada9c13e368df18727e4dbf4f5807664
          persist-credentials: false
          path: ferrari-next

      - name: Checkout immutable Ferrari deep audit sources
        if: steps.request.outputs.mode == '--deep-cert' || steps.request.outputs.mode == '--deep-final'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: ${{ steps.request.outputs.mode == '--deep-final' && '2a9e44918093cc86d2cb3f5ad04f40116c02171e' || '2a22b5b2534e8ebd1e39523a2dcf3203dcdeed04' }}
          path: ferrari-deep
          persist-credentials: false

      - name: Checkout trusted Ferrari F6 bounded cleanup implementation
        if: steps.request.outputs.mode == '--hygiene-preview' || steps.request.outputs.mode == '--hygiene-apply'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: fd985327dedf855042435ff7a4ce9aaa0b1a17b4
          path: ferrari-clean
          persist-credentials: false

      - name: Checkout pinned Ferrari Python private venv migration
        if: steps.request.outputs.mode == '--venvs-preview' || steps.request.outputs.mode == '--venvs-apply'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 9e3be530f8c5d2f8374f956f1524c89bd78f6b1f
          path: ferrari-venvs
          persist-credentials: false

      - name: Checkout immutable Ferrari final hygiene source
        if: steps.request.outputs.mode == '--final-preview' || steps.request.outputs.mode == '--final-apply'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: fa832a71b7164e5163b89d14ee757bdba3b96f72
          path: ferrari-final
          persist-credentials: false

      - name: Checkout exactly pinned Ferrari phase-7 private release and certificate
        if: steps.request.outputs.mode == '--phase7-check' || steps.request.outputs.mode == '--phase7-activate' || steps.request.outputs.mode == '--phase7-certify'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 758e1b435317fa26277b332b75bc47c67910be81
          persist-credentials: false
          path: ferrari-f7

      - name: Checkout immutable universal Ferrari catalog and hygiene source
        if: startsWith(steps.request.outputs.mode, '--universal-')
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 7bf6dcecf15da26502c5969b5eee54d5e116fc32
          persist-credentials: false
          path: ferrari-universal

      - name: Validate the project-owned release script
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n ferrari/install/vps-isolated-release.sh
          test -f ferrari/engine/tool_actions.json
          echo 'FERRARI_PHASE5_PINNED_SCRIPT_SYNTAX=PASS'
          if [[ "${{ steps.request.outputs.mode }}" == --universal-* ]]; then
            bash -n ferrari-universal/install/vps-isolated-release.sh
            python3 -m py_compile ferrari-universal/install/vps-universal-catalog-hygiene.py
            python3 -c 'import json; d=json.load(open("ferrari-universal/engine/catalog.json")); assert len(d["tools"])==173 and len(d["functions"])==272 and len(d["dependencies"])==3 and len(d["providers"])==2 and d["counts"]["all_catalog_entries"]==450 and "actions" not in d and "names" not in d["mcp_capabilities"]; print("FERRARI_UNIVERSAL_SOURCE=PASS")'
          fi
          if [[ "${{ steps.request.outputs.mode }}" == '--phase7-check' ||
                "${{ steps.request.outputs.mode }}" == '--phase7-activate' ||
                "${{ steps.request.outputs.mode }}" == '--phase7-certify' ]]; then
            bash -n ferrari-f7/install/vps-isolated-release.sh
            python3 -m py_compile ferrari-f7/install/vps-phase7-certify.py
            test -f ferrari-f7/engine/orchestrator.py
            test -f ferrari-f7/engine/tool_actions.json
            echo 'FERRARI_PHASE7_PINNED_SOURCE=PASS'
          fi
          if [[ "${{ steps.request.outputs.mode }}" == '--final-preview' ||
                "${{ steps.request.outputs.mode }}" == '--final-apply' ]]; then
            python3 -m py_compile ferrari-final/install/vps-phase6-final-hygiene.py
            echo 'FERRARI_PHASE6_FINAL_HYGIENE_SCRIPT=VALID'
          fi
          if [[ "${{ steps.request.outputs.mode }}" == '--venvs-preview' ||
                "${{ steps.request.outputs.mode }}" == '--venvs-apply' ]]; then
            python3 -m py_compile ferrari-venvs/install/vps-phase6-private-venvs.py
            echo 'FERRARI_PHASE6_VENV_SCRIPT=VALID'
          fi
          if [[ "${{ steps.request.outputs.mode }}" == '--hygiene-preview' ||
                "${{ steps.request.outputs.mode }}" == '--hygiene-apply' ]]; then
            python3 -m py_compile ferrari-clean/install/ferrari-hygiene.py
            echo 'FERRARI_PHASE6_HYGIENE_SOURCE=VALID'
          fi
          if [[ "${{ steps.request.outputs.mode }}" == '--deep-cert' || "${{ steps.request.outputs.mode }}" == '--deep-final' ]]; then
            python3 -m py_compile ferrari-deep/install/vps-phase6-certify.py
            echo 'FERRARI_PHASE6_DEEP_SCRIPT=VALID'
          fi
          if [[ "${{ steps.request.outputs.mode }}" == '--phase6-check' ||
                "${{ steps.request.outputs.mode }}" == '--phase6-activate' ]]; then
            bash -n ferrari-next/install/vps-isolated-release.sh
            test -f ferrari-next/engine/tool_actions.json
            echo 'FERRARI_PHASE6_PINNED_RELEASE_SYNTAX=PASS'
          fi
          if [[ "${{ steps.request.outputs.mode }}" == '--audit' || "${{ steps.request.outputs.mode }}" == '--post-audit' || "${{ steps.request.outputs.mode }}" == '--full-audit' ]]; then
            test -f ferrari-phase6/install/vps-phase6-audit.py
            python3 -m py_compile ferrari-phase6/install/vps-phase6-audit.py
            echo 'FERRARI_PHASE6_AUDIT_SCRIPT_SYNTAX=PASS'
          fi

      - name: Reuse existing VPS SSH password and pinned host fingerprint
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS" || { echo 'FERRARI_VPS_SSH_SECRET_MISSING' >&2; exit 2; }
          known_hosts="$RUNNER_TEMP/ferrari-pinned-host"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$known_hosts" ||
            { echo 'FERRARI_VPS_HOST_KEY_UNAVAILABLE' >&2; exit 2; }
          chmod 600 "$known_hosts"
          fingerprint="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc" ||
            { echo 'FERRARI_VPS_HOST_KEY_MISMATCH' >&2; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          echo 'FERRARI_PHASE5_EXISTING_SSH_PIN=PASS'

      - name: Run Ferrari-only check or protected activation and read back active release
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          MODE: ${{ steps.request.outputs.mode }}
        run: |
          set -Eeuo pipefail
          SHA="40c0e1cdf31b1fe9589ad8be90e5eac06eec2856"
          [[ "$MODE" == '--check' || "$MODE" == '--activate' || "$MODE" == '--certify-rollback' || "$MODE" == '--audit' || "$MODE" == '--post-audit' || "$MODE" == '--full-audit' || "$MODE" == '--deep-cert' || "$MODE" == '--deep-final' || "$MODE" == '--hygiene-preview' || "$MODE" == '--hygiene-apply' || "$MODE" == '--venvs-preview' || "$MODE" == '--venvs-apply' || "$MODE" == '--final-preview' || "$MODE" == '--final-apply' || "$MODE" == '--phase6-check' || "$MODE" == '--phase6-activate' || "$MODE" == '--phase7-check' || "$MODE" == '--phase7-activate' || "$MODE" == '--phase7-certify' || "$MODE" == '--universal-check' || "$MODE" == '--universal-activate' || "$MODE" == '--universal-preview' || "$MODE" == '--universal-apply' ]] || exit 3
          opts=(-T -o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes
                -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-pinned-host"
                -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          BEFORE="$(sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 'readlink -e /srv/projects/skill-universal/current')"
          echo "FERRARI_PHASE5_CURRENT_BEFORE=$BEFORE"
          if [[ "$MODE" == --universal-* ]]; then
            TARGET="7bf6dcecf15da26502c5969b5eee54d5e116fc32"
            FALLBACK="952b0a75ba798471b07053677d53791bd078ed56"
            OLD="/srv/projects/skill-universal/releases/$FALLBACK"
            NEW="/srv/projects/skill-universal/releases/$TARGET"
            REPORT="$RUNNER_TEMP/ferrari-universal-report.json"
            echo "FERRARI_UNIVERSAL_MODE=$MODE"
            echo "FERRARI_UNIVERSAL_PREVIOUS=$BEFORE"
            if [[ "$MODE" == '--universal-check' || "$MODE" == '--universal-activate' ]]; then
              [[ "$BEFORE" == "$OLD" ]] || {
                echo 'FERRARI_UNIVERSAL_UNEXPECTED_ACTIVE_RELEASE' >&2; exit 15;
              }
              sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 \
                "bash -s -- '$TARGET' '--check'" \
                < ferrari-universal/install/vps-isolated-release.sh
              CHECK_AFTER="$(sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 'readlink -e /srv/projects/skill-universal/current')"
              [[ "$CHECK_AFTER" == "$OLD" ]] || {
                echo 'FERRARI_UNIVERSAL_CHECK_CHANGED_ACTIVE' >&2; exit 15;
              }
              echo 'FERRARI_UNIVERSAL_PRIVATE_PRECHECK=PASS'
              if [[ "$MODE" == '--universal-activate' ]]; then
                sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 \
                  "bash -s -- '$TARGET' '--activate'" \
                  < ferrari-universal/install/vps-isolated-release.sh
                AFTER="$(sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 'readlink -e /srv/projects/skill-universal/current')"
                [[ "$AFTER" == "$NEW" ]] || {
                  echo 'FERRARI_UNIVERSAL_ACTIVE_RELEASE_MISMATCH' >&2; exit 15;
                }
                sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 \
                  "cd '/srv/projects/skill-universal/current' && '/srv/projects/skill-universal/runtimes/python3.12/bin/python3.12' -B -" <<'VERIFY_UNIVERSAL'
          from engine import catalog_registry, tool_runtime
          d=catalog_registry.read_catalog()
          assert len(d["tools"])==173 and len(d["functions"])==272
          assert d["counts"]["all_catalog_entries"]==450
          assert len(d["actions"])==40 and len(d["mcp_capabilities"]["names"])==220
          assert len(tool_runtime.specs())==40
          print("FERRARI_UNIVERSAL_CATALOG_450_READBACK=PASS")
          VERIFY_UNIVERSAL
                echo 'FERRARI_UNIVERSAL_ACTIVATION=PASS'
              else
                AFTER="$OLD"
              fi
              printf '{"status":"PASS","mode":"%s","before":"%s","after":"%s","catalog_target":"%s","fallback_preserved":"%s"}\n' "$MODE" "$BEFORE" "$AFTER" "$TARGET" "$FALLBACK" > "$REPORT"
            else
              [[ "$BEFORE" == "$NEW" ]] || {
                echo 'FERRARI_UNIVERSAL_HYGIENE_REQUIRES_NEW_RELEASE' >&2; exit 16;
              }
              FLAGS=""
              if [[ "$MODE" == '--universal-apply' ]]; then FLAGS="--apply"; fi
              sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 \
                "cd '/srv/projects/skill-universal/current' && '/srv/projects/skill-universal/runtimes/python3.12/bin/python3.12' -B - --expected-active '$TARGET' --fallback '$FALLBACK' $FLAGS" \
                < ferrari-universal/install/vps-universal-catalog-hygiene.py > "$REPORT"
              python3 - "$REPORT" "$MODE" <<'VERIFY_HYGIENE'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["status"]=="PASS"
          assert d["universal_catalog_active"] is True
          assert d["active_catalog_entries"]==450
          assert not d["legacy_catalog_files_in_active"]
          assert d["other_projects_or_ubuntu_modified"] is False
          assert d["mode"]==("apply" if sys.argv[2]=="--universal-apply" else "preview")
          assert d["fallback_preserved"]=="952b0a75ba798471b07053677d53791bd078ed56"
          print("FERRARI_UNIVERSAL_HYGIENE_REPORT_VALID=PASS")
          VERIFY_HYGIENE
              AFTER="$(sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 'readlink -e /srv/projects/skill-universal/current')"
              [[ "$AFTER" == "$NEW" ]] || {
                echo 'FERRARI_UNIVERSAL_HYGIENE_CHANGED_ACTIVE' >&2; exit 16;
              }
            fi
            sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 'bash -s' <<'SERVICES'
          set -Eeuo pipefail
          for s in pink-iptv-backend pink-vpn fadego-staging lowcost-europa pm2-iptvpn-bot pm2-telegram-robot-leads nginx postgresql@16-main; do
            systemctl is-active --quiet "$s" || { echo "FERRARI_PROTECTED_SERVICE_NOT_ACTIVE=$s" >&2; exit 8; }
          done
          echo 'FERRARI_PROTECTED_SERVICES=8/8_PASS'
          SERVICES
            echo 'FERRARI_UNIVERSAL_WORKFLOW=PASS'
            exit 0
          fi
          if [[ "$MODE" == '--final-preview' || "$MODE" == '--final-apply' ]]; then
            [[ "$BEFORE" == "/srv/projects/skill-universal/releases/146145d5ada9c13e368df18727e4dbf4f5807664" ]] ||
              { echo 'FERRARI_PHASE6_FINAL_WRONG_ACTIVE' >&2; exit 11; }
            SCRIPT_MODE="--preview"
            if [[ "$MODE" == '--final-apply' ]]; then SCRIPT_MODE="--apply"; fi
            sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 \
              "cd '/srv/projects/skill-universal/current' && '/srv/projects/skill-universal/runtimes/python3.12/bin/python3.12' -B - '$SCRIPT_MODE'" \
              < ferrari-final/install/vps-phase6-final-hygiene.py \
              > "$RUNNER_TEMP/ferrari-phase6-final.json"
            python3 - "$RUNNER_TEMP/ferrari-phase6-final.json" "$MODE" <<'FINAL'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["release"]=="146145d5ada9c13e368df18727e4dbf4f5807664"
          assert r["fallback"]=="40c0e1cdf31b1fe9589ad8be90e5eac06eec2856"
          assert r["private_launchers_checked"]==4
          assert r["packages_removed"]==0 and r["service_changes"]==0
          assert r["other_projects_modified"] is False
          if sys.argv[2]=="--final-preview":
              assert r["mode"]=="preview" and r["private_files_changed"]==0
              print("FERRARI_PHASE6_FINAL_PREVIEW=PASS")
          else:
