          print("FERRARI_PHASE6_LDD_SAMPLES="+str(doc["shared_libraries"].get("sampled",0)))
          AUDIT
            AFTER="$(sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 'readlink -e /srv/projects/skill-universal/current')"
