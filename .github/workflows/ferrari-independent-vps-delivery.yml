            { echo 'FERRARI_VPS_HOST_KEY_UNAVAILABLE' >&2; exit 2; }
          chmod 600 "$known_hosts"
          fingerprint="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}')"
