name: Ferrari Ubuntu - independent VPS installation
# Ferrari engine logic lives only in martaxi-boss/skill-universal.
# This is a one-purpose transport using the EXISTING VPS SSH credential and host pin.
# Do not alter the existing SSH bridge, Supervisor or projects.
on:
  push:
    branches: [main]
    paths:
      - '.github/ferrari-final-isolation.audit'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: isolated-ferrari-vps-delivery
  cancel-in-progress: false

jobs:
  ferrari:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Load pinned Ferrari release from its independent repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 292aeb7d10eecef8c3ca84760cd579e84e4b97f3
          persist-credentials: false
          path: ferrari
      - name: Validate Ferrari delivery scripts and engine tests on runner
        shell: bash
        run: |
          set -euo pipefail
          cd ferrari
          bash -n install/vps-preflight.sh
          bash -n install/ferrari-ubuntu.sh
          bash -n install/vps-delivery.sh
          python3 -m unittest discover -s tests -v
          echo 'FERRARI_RUNNER_RELEASE_VALIDATION=PASS'
      - name: Verify existing VPS SSH host fingerprint and install disposable helper
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || { echo 'EXISTING_VPS_SSH_PASSWORD_MISSING'; exit 2; }
          known_hosts="$RUNNER_TEMP/ferrari-pinned-host"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$known_hosts" ||
            { echo 'FERRARI_VPS_HOST_KEY_UNAVAILABLE'; exit 2; }
          chmod 600 "$known_hosts"
          fingerprint="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc" ||
            { echo 'FERRARI_VPS_HOST_KEY_MISMATCH'; exit 2; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          echo 'FERRARI_EXISTING_SSH_PIN=PASS'
      - name: Live Ubuntu read-only precheck through existing SSH
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          opts=(-T -o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-pinned-host"
                -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          sshpass -e ssh "${opts[@]}" ubuntu@146.59.145.3 'bash -s' < ferrari/install/vps-preflight.sh
          echo 'FERRARI_LIVE_VPS_PREFLIGHT=PASS'
      - name: Copy pinned Ferrari source and run local installer on VPS
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          SHA="292aeb7d10eecef8c3ca84760cd579e84e4b97f3"
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-pinned-host"
                -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          tar --exclude=.git --exclude=.runtime --exclude=__pycache__             -czf "$RUNNER_TEMP/ferrari-source.tar.gz" -C ferrari .
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3             'mkdir -p "/srv/projects/skill-universal/releases/292aeb7d10eecef8c3ca84760cd579e84e4b97f3"'
          sshpass -e scp "${opts[@]}" "$RUNNER_TEMP/ferrari-source.tar.gz"             "ubuntu@146.59.145.3:/srv/projects/skill-universal/releases/$SHA/source.tar.gz"
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3             "bash -s -- '$SHA'" < ferrari/install/vps-delivery.sh
          echo 'FERRARI_APT_DELIVERY=PASS'
          # Transport only: all runtime logic stays in Ferrari's install script.
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            'cd "/srv/projects/skill-universal/current" && bash install/vps-external-agents.sh'
          # Isolated JDK25/JADX/Ghidra logic remains in Ferrari, not this transport.
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            'cd "/srv/projects/skill-universal/current" && bash install/vps-specialist-engines.sh'
          # CAD/3D/office installation logic lives only in the Ferrari repository.
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            'cd "/srv/projects/skill-universal/current" && bash install/vps-cad-3d.sh'
          # Universal tool discovery and real multidisciplinary work: all logic in Ferrari.
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            'cd "/srv/projects/skill-universal/current" && bash install/vps-tool-runtime-smoke.sh'
          # Ferrari-only release housekeeping; preserve active and one fallback.
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            'cd "/srv/projects/skill-universal/current" && python3 install/ferrari-hygiene.py'
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            'cd "/srv/projects/skill-universal/current" && python3 install/ferrari-hygiene.py --apply'
          echo 'FERRARI_DEPLOY_TRANSPORT=PASS'

  python-cli-release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Fetch tested Ferrari source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 2f79eaab8caa3d02bbede1aeb718521203e780bb
          persist-credentials: false
          path: ferrari

      - name: Verify corrected browser and unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ferrari
          python3 -m unittest discover -s tests -p test_professional_tools.py -v
          python3 -m unittest discover -s tests -p test_tool_runtime.py -v
          python3 -m py_compile install/vps-private-cli.py
          node --check engine/browser_check.js
          grep -F '/srv/projects/skill-universal/.runtime/npm/playwright/node_modules/playwright' engine/browser_check.js
          test ! -e .runtime
          echo 'FERRARI_SOURCE_CHECK=PASS'

      - name: Install corrected source only inside Ferrari project and run real browser smoke
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          SRC_SHA=2f79eaab8caa3d02bbede1aeb718521203e780bb
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/ferrari-host"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/ferrari-host" -E sha256 | awk '{print $2}')" = "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc"
          chmod 600 "$RUNNER_TEMP/ferrari-host"
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-host"
                -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          tar -czf "$RUNNER_TEMP/ferrari-source.tar.gz" -C ferrari --exclude=.git --exclude=__pycache__ --exclude=.runtime .
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            "test -d /srv/projects/skill-universal && test ! -L /srv/projects/skill-universal && mkdir -p /srv/projects/skill-universal/releases/$SRC_SHA"
          sshpass -e scp "${opts[@]}" "$RUNNER_TEMP/ferrari-source.tar.gz" \
            "ubuntu@146.59.145.3:/srv/projects/skill-universal/releases/$SRC_SHA/source.tar.gz"
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 "bash -s -- '$SRC_SHA' '$GITHUB_RUN_ID'" <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/skill-universal
          SHA="$1"
          RUN_ID="$2"
          RELEASE="$ROOT/releases/$SHA"
          cd "$RELEASE"
          export PYTHONDONTWRITEBYTECODE=1
          test -s source.tar.gz
          tar -xzf source.tar.gz
          rm source.tar.gz
          test -f engine/browser_check.js
          test ! -e "$RELEASE/.runtime"
          python3 -m unittest discover -s tests -p test_professional_tools.py -v
          NODE="$ROOT/runtimes/node-22.23.4/bin/node"
          test -x "$NODE"
          "$NODE" --check engine/browser_check.js
          test -f "$ROOT/.runtime/npm/playwright/node_modules/playwright/package.json"
          test -d "$ROOT/.runtime/browsers"
          python3 -m engine.ferrari doctor >/dev/null
          # Private Ferrari-only copies of six Ubuntu commands and their libraries.
          python3 install/vps-private-cli.py --apply
          python3 - "$ROOT" "$RUN_ID" <<'PY_CLI'
          import json,sys
          from pathlib import Path
          from engine import tool_runtime
          root=Path(sys.argv[1])
          private=(root/"tools/ubuntu-cli").resolve(strict=True)
          cert=root/".runtime/private-cli-cert"/sys.argv[2]
          cert.mkdir(parents=True,exist_ok=True)
          samples={
            "json":cert/"sample.json",
            "text":cert/"sample.txt",
            "elf":root/"runtimes/node-22.23.4/bin/node",
          }
          samples["json"].write_text('{"project":"Ferrari","independent":true}\n')
          samples["text"].write_text('Ferrari independent project\n')
          cases=[
            ("file-mime","json",None),
            ("jq-format-json","json",None),
            ("ripgrep-find-text","text","Ferrari"),
            ("readelf-header","elf",None),
            ("objdump-file-header","elf",None),
            ("strings-file-extract","elf",None),
          ]
          results=[]
          for action,fixture,query in cases:
              spec=tool_runtime.specs()[action]
              exe=tool_runtime.executable(spec["tool"],spec["binary"])
              assert exe and Path(exe).resolve().is_relative_to(private),{"action":action,"exe":exe}
              output=cert/action
              result=tool_runtime.invoke(action,str(samples[fixture]),str(output),query=query)
              assert result["confirmed"],result
              artifact=output/spec["artifact"]
              assert artifact.is_file() and artifact.stat().st_size>3,artifact
              results.append({"action":action,"executor":exe,"bytes":artifact.stat().st_size})
          all_actions=tool_runtime.specs()
          private_count=sum(bool(exe:=tool_runtime.executable(s["tool"],s["binary"])) and Path(exe).resolve().is_relative_to(root) for s in all_actions.values())
          print("FERRARI_SIX_PRIVATE_CLI_ACTIONS=PASS")
          print("FERRARI_PRIVATE_ACTIONS="+str(private_count))
          print("FERRARI_PRIVATE_CLI_RESULTS="+json.dumps(results,sort_keys=True))
          PY_CLI
          # Verify the four newly private FFmpeg and Poppler actions with real files.
          python3 - "$ROOT" "$RUN_ID" <<'PY_MEDIA'
          import json, math, struct, sys, wave
          from pathlib import Path
          from engine import tool_runtime
          root=Path(sys.argv[1])
          cert=root/".runtime/private-media-cert"/sys.argv[2]
          cert.mkdir(parents=True,exist_ok=True)
          audio=cert/"tone.wav"
          with wave.open(str(audio),"wb") as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(16000)
              w.writeframes(b"".join(struct.pack("<h",int(9000*math.sin(2*math.pi*440*i/16000))) for i in range(16000)))
          stream=b"BT /F1 18 Tf 50 700 Td (Ferrari PDF test) Tj ET\n"
          objects=[
              b"<< /Type /Catalog /Pages 2 0 R >>",
              b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
              b"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>",
              b"<< /Length "+str(len(stream)).encode()+b" >>\nstream\n"+stream+b"endstream",
              b"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
          ]
          pdf_bytes=bytearray(b"%PDF-1.4\n")
          offsets=[0]
          for idx,obj in enumerate(objects,1):
              offsets.append(len(pdf_bytes))
              pdf_bytes.extend((str(idx)+" 0 obj\n").encode()+obj+b"\nendobj\n")
          startxref=len(pdf_bytes)
          pdf_bytes.extend(("xref\n0 "+str(len(offsets))+"\n").encode())
          pdf_bytes.extend(b"0000000000 65535 f \n")
          for offset in offsets[1:]:
              pdf_bytes.extend(("%010d 00000 n \n"%offset).encode())
          pdf_bytes.extend(("trailer\n<< /Root 1 0 R /Size "+str(len(offsets))+" >>\nstartxref\n"+str(startxref)+"\n%%EOF\n").encode())
          pdf=cert/"sample.pdf"
          pdf.write_bytes(pdf_bytes)
          cases=[
              ("ffprobe-media-info",audio),
              ("ffmpeg-audio-wav",audio),
              ("pdfinfo-report",pdf),
              ("pdftotext-layout",pdf),
          ]
          private=root/"tools/ubuntu-cli/bin"
          results=[]
          for action,src in cases:
              spec=tool_runtime.specs()[action]
              exe=tool_runtime.executable(spec["tool"],spec["binary"])
              assert exe and Path(exe).resolve().is_relative_to(private),{"action":action,"exe":exe}
              target=cert/action
              response=tool_runtime.invoke(action,str(src),str(target))
              assert response["confirmed"],response
              artifact=target/spec["artifact"]
              assert artifact.is_file() and artifact.stat().st_size>10,artifact
              results.append({"action":action,"executor":exe,"bytes":artifact.stat().st_size})
          assert b"Ferrari" in (cert/"pdftotext-layout"/"extracted.txt").read_bytes()
          count=sum(bool(exe:=tool_runtime.executable(x["tool"],x["binary"])) and
                    Path(exe).resolve().is_relative_to(root) for x in tool_runtime.specs().values())
          print("FERRARI_FOUR_PRIVATE_MEDIA_DOC_ACTIONS=PASS")
          print("FERRARI_PRIVATE_ACTIONS="+str(count))
          print("FERRARI_PRIVATE_MEDIA_RESULTS="+json.dumps(results,sort_keys=True))
          PY_MEDIA

          # Functional tests for ten further Ferrari-private native actions.
          python3 - "$ROOT" "$RUN_ID" <<'PY_NATIVE'
          import json,struct,sys,zlib
          from pathlib import Path
          from engine import tool_runtime
          root=Path(sys.argv[1])
          cert=root/".runtime/native-cli-cert"/sys.argv[2]
          cert.mkdir(parents=True,exist_ok=True)
          svg=cert/"original.svg"
          svg.write_text('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="90"><rect width="160" height="90" fill="#ffffff"/><text x="10" y="50" font-size="26">Ferrari</text></svg>')
          dot=cert/"graph.dot"
          dot.write_text('digraph Ferrari { "Ubuntu" -> "Ferrari"; }\n')
          markdown=cert/"document.md"
          markdown.write_text('# Ferrari\n\nDocumento Ubuntu privado.\n')
          width,height=420,110
          chars={
             'F':["11111","10000","11110","10000","10000","10000","10000"],
             'E':["11111","10000","11110","10000","10000","10000","11111"],
             'R':["11110","10001","11110","10100","10010","10001","10001"],
             'A':["01110","10001","10001","11111","10001","10001","10001"],
             'I':["11111","00100","00100","00100","00100","00100","11111"]
          }
          pix=[[255]*width for _ in range(height)]
          for i,letter in enumerate("FERRARI"):
              for y,row in enumerate(chars[letter]):
                  for x,value in enumerate(row):
                      if value=="1":
                          for dy in range(9):
                              for dx in range(9):
                                  pix[17+y*9+dy][15+i*58+x*9+dx]=0
          raw=b"".join(b"\x00"+b"".join(bytes((v,v,v)) for v in row) for row in pix)
          def chunk(tag,data):
              return struct.pack(">I",len(data))+tag+data+struct.pack(">I",zlib.crc32(tag+data)&0xffffffff)
          png=cert/"sample.png"
          png.write_bytes(b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">IIBBBBB",width,height,8,2,0,0,0))+chunk(b"IDAT",zlib.compress(raw))+chunk(b"IEND",b""))
          pcap=cert/"sample.pcap"
          payload=b"Ferrari"
          udp=struct.pack("!HHHH",12345,45678,8+len(payload),0)
          ip=bytes((0x45,0))+struct.pack("!HHHBBH",20+len(udp)+len(payload),0,0,64,17,0)+b"\x0a\x00\x00\x01\x0a\x00\x00\x02"
          frame=b"\x02\x00\x00\x00\x00\x01\x02\x00\x00\x00\x00\x02\x08\x00"+ip+udp+payload
          pcap.write_bytes(struct.pack("<IHHIIII",0xa1b2c3d4,2,4,0,0,65535,1)+struct.pack("<IIII",1,0,len(frame),len(frame))+frame)
          cases=[
             ("pandoc-md-docx",markdown),
             ("graphviz-dot-svg",dot),
             ("imagemagick-identify",png),
             ("imagemagick-webp",png),
             ("tesseract-ocr",png),
             ("radare2-binary-info",root/"runtimes/node-22.23.4/bin/node"),
             ("vips-image-thumbnail",png),
             ("vips-image-inspect",png),
             ("tshark-pcap-summary",pcap),
             ("inkscape-svg-png",svg),
          ]
          private=root/"tools/ubuntu-cli/bin"
          results=[]
          for action,source in cases:
              spec=tool_runtime.specs()[action]
              exe=tool_runtime.executable(spec["tool"],spec["binary"])
              assert exe and Path(exe).resolve().is_relative_to(private),(action,exe)
              print("FERRARI_PRIVATE_NATIVE_TEST="+action,flush=True)
              outcome=tool_runtime.invoke(action,str(source),str(cert/action))
              assert outcome["confirmed"],outcome
              artifact=cert/action/spec["artifact"]
              assert artifact.is_file() and artifact.stat().st_size>0,artifact
              results.append({"action":action,"bytes":artifact.stat().st_size,"executor":str(exe)})
          n=sum(bool(exe:=tool_runtime.executable(s["tool"],s["binary"])) and
                Path(exe).resolve().is_relative_to(root) for s in tool_runtime.specs().values())
          print("FERRARI_TEN_NATIVE_ACTIONS=PASS")
          print("FERRARI_PRIVATE_ACTIONS="+str(n))
          print("FERRARI_NATIVE_RESULTS="+json.dumps(results,sort_keys=True))
          PY_NATIVE
          # Real Ferrari-owned DuckDB and Polars environments; no Ubuntu interpreter.
          python3 - "$ROOT" "$RUN_ID" <<'PY_DATA'
          import json,sys
          from pathlib import Path
          from engine import tool_runtime
          root=Path(sys.argv[1])
          workspace=root/".runtime/private-python-smoke"/sys.argv[2]
          workspace.mkdir(parents=True,exist_ok=True)
          csv=workspace/"sales.csv"
          csv.write_text("produto,valor\nFerrari,10\nUbuntu,20\n")
          verified=[]
          for name in ("duckdb","polars"):
              spec=tool_runtime.specs()[name+"-csv-profile"]
              exe=tool_runtime.executable(spec["tool"],spec["binary"])
              assert exe and Path(exe).resolve().is_relative_to(root/"runtimes/python3.12"),exe
              result=tool_runtime.invoke(name+"-csv-profile",str(csv),str(workspace/name))
              assert result["confirmed"],result
              out=workspace/name/spec["artifact"]
              data=json.loads(out.read_text())
              assert data["rows"]==2 and len(data["columns"])==2,data
              verified.append({"tool":name,"interpreter":str(Path(exe).resolve()),"rows":data["rows"]})
          count=sum(bool(exe:=tool_runtime.executable(x["tool"],x["binary"])) and
                    Path(exe).resolve().is_relative_to(root) for x in tool_runtime.specs().values())
          print("FERRARI_PRIVATE_PYTHON_DUCKDB_POLARS=PASS")
          print("FERRARI_PRIVATE_ACTIONS="+str(count))
          print("FERRARI_PRIVATE_PYTHON_RESULTS="+json.dumps(verified,sort_keys=True))
          PY_DATA
          python3 install/vps-private-python-smoke.py "$RUN_ID"
          bash install/vps-tool-runtime-smoke.sh
          TASK="$ROOT/.runtime/python-cli-release-smoke/$RUN_ID"
          mkdir -p "$TASK"
          python3 - "$TASK/request.json" <<'PY'
          import base64,io,json,sys,zipfile
          from pathlib import Path
          stream=io.BytesIO()
          with zipfile.ZipFile(stream,"w",zipfile.ZIP_DEFLATED) as archive:
              archive.writestr("index.html",'<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ferrari</title></head><body><main id="app" data-ready="yes"><h1>Ferrari browser smoke</h1></main></body></html>')
          job={"version":1,"id":"python-cli-release-smoke-20261105","kind":"operation","operation":"vite-build","input":{"name":"web.zip","content_base64":base64.b64encode(stream.getvalue()).decode("ascii")}}
          Path(sys.argv[1]).write_text(json.dumps(job)+"\n",encoding="utf-8")
          PY
          python3 -m engine.skill_job --request "$TASK/request.json" --output "$TASK/result"
          python3 - "$TASK/result" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          main=json.loads((p/"report.json").read_text())
          browser=json.loads((p/"artifacts/browser-check.json").read_text())
          build=json.loads((p/"artifacts/vite-build.json").read_text())
          assert main["status"]=="completed",main
          assert browser["status"]=="passed",browser
          assert build["browser_test"]["status"]=="passed",build
          assert (p/"artifacts/browser-screenshot.png").stat().st_size>100
          assert (p/"artifacts/browser-mobile.png").stat().st_size>100
          assert (p/"response.zip").stat().st_size>100
          print("FERRARI_PLAYWRIGHT_REAL=PASS")
          PY
          PREVIOUS="$(readlink -f "$ROOT/current")"
          test -d "$PREVIOUS"
          ln -s "$RELEASE" "$ROOT/current.next-$SHA"
          mv -Tf "$ROOT/current.next-$SHA" "$ROOT/current"
          test "$(readlink -f "$ROOT/current")" = "$RELEASE"
          printf 'FERRARI_PREVIOUS_RELEASE=%s\n' "$PREVIOUS"
          printf 'FERRARI_CURRENT_RELEASE=%s\n' "$SHA"
          echo 'FERRARI_ONLY_PRIVATE_PROJECT_WRITES=PASS'
          echo 'FERRARI_RELEASE_UPDATE=PASS'
          REMOTE
          echo 'FERRARI_ISOLATED_SOURCE_ONLY_DEPLOY=PASS'
