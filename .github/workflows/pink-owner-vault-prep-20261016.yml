name: PINK Owner original VPS vault one-time public import certificate
on:
  push:
    branches: ["release/pink-signing-readiness-20261016"]
    paths: [".github/workflows/pink-owner-vault-prep-20261016.yml"]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check exact repo and pinned VPS identity before SSH secret
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "martaxi-boss/VPS"
          test "$GITHUB_REF" = "refs/heads/release/pink-signing-readiness-20261016"
          git diff --check
          python3 -m py_compile ops/pink_owner_vault_transfer_20261016.py
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/vault-pinned-host"
          chmod 600 "$RUNNER_TEMP/vault-pinned-host"
          observed="$(ssh-keygen -lf "$RUNNER_TEMP/vault-pinned-host" -E sha256 | awk '{print $2}')"
          test "$observed" = "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc"
          echo PINNED_OWNER_VPS=PASS
      - name: Install SSH helper
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Obtain only one-time PUBLIC certificate from original Owner root vault
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vault-pinned-host" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 ubuntu@146.59.145.3 'sudo -n python3 - prepare' \
            < ops/pink_owner_vault_transfer_20261016.py
