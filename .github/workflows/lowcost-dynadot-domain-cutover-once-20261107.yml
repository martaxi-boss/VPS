name: Lowcost Europa Dynadot DNS cutover preserving mailbox (once)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-dynadot-domain-cutover-once-20261107.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-domain-dynadot-cutover
  cancel-in-progress: false
jobs:
  cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: One-workflow-only authorized change
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")" == '.github/workflows/lowcost-dynadot-domain-cutover-once-20261107.yml' ]]
          echo DOMAIN_CUTOVER_SCOPE=PASS
      - name: Connect to pinned VPS and update domain with complete mail DNS
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SSHPASS" ]]
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/known"
          chmod 600 "$RUNNER_TEMP/known"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/known" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          echo DOMAIN_CUTOVER_SSH_PIN=PASS
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/known" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          root=/srv/projects/lowcost-europa
          test "$(git -c "safe.directory=$root" -C "$root" rev-parse HEAD)" = bb3921b646102cba0af0f397bddfde8b2f37d39a
          systemctl is-active --quiet lowcost-europa.service
          nginx -t >/dev/null 2>&1
          test -L /etc/nginx/sites-enabled/lowcost-europa-eu-acme.conf
          test ! -e /etc/letsencrypt/live/lowcost-europa.eu/fullchain.pem
          python3 - <<'PY'
          import json, pathlib, subprocess, urllib.parse, urllib.request
          from urllib.error import HTTPError,URLError
          root=pathlib.Path("/srv/projects/lowcost-europa")
          cred=root/"private/dynadot/credentials.json"
          assert cred.is_file() and not cred.is_symlink() and (cred.stat().st_mode & 0o777)==0o600, "PRIVATE_KEY_FILE_INVALID"
          data=json.loads(cred.read_text())
          key=data.get("api_key","").strip()
          assert key and data.get("domain")=="lowcost-europa.eu", "DOMAIN_KEY_MISMATCH"
          domain="lowcost-europa.eu"
          apex="146.59.145.3"
          spf="v=spf1 mx include:webhost-mail-out.dynadot.com include:spf.webhost.dynadot.com ~all"
          dmarc="v=DMARC1; p=none; rua=mailto:client-dmarc@dynadot.com"
          mx="webhost.dynadot.com"
          dkim="clients._domainkey.webhost.dynadot.com"
          def dig(resolver,name,typ):
              p=subprocess.run(["dig","+time=4","+tries=1","+short","@"+resolver,name,typ],capture_output=True,text=True,timeout=8,check=True)
              return p.stdout.strip().splitlines()
          resolvers=("ns1.dyna-ns.net","ns2.dyna-ns.net")
          def recs(resolver):
              return {
                "apex_a":dig(resolver,domain,"A"),
                "www_a":dig(resolver,"www."+domain,"A"),
                "apex_aaaa":dig(resolver,domain,"AAAA"),
                "www_aaaa":dig(resolver,"www."+domain,"AAAA"),
                "mx":dig(resolver,domain,"MX"),
                "spf":dig(resolver,domain,"TXT"),
                "dkim":dig(resolver,"default._domainkey."+domain,"CNAME"),
                "dmarc":dig(resolver,"_dmarc."+domain,"TXT")
              }
          def mail_ok(r):
              return (
                  r["mx"]==["0 "+mx+"."] and
                  r["spf"]==['"'+spf+'"'] and
                  r["dkim"]==[dkim+"."] and
                  r["dmarc"]==['"'+dmarc+'"']
              )
          before={r:recs(r) for r in resolvers}
          for resolver,r in before.items():
              assert mail_ok(r),"MAIL_PREFLIGHT_MISMATCH_"+resolver
              assert not r["apex_aaaa"] and not r["www_aaaa"],"UNEXPECTED_IPV6"
              assert r["apex_a"]==["185.53.179.149"] and r["www_a"]==["185.53.179.149"],"DNS_CHANGED_EXTERNALLY"
          print("DYNADOT_AUTHORITATIVE_MAIL_PREFLIGHT=PASS")
          def api3(command,params):
              query={"key":key,"command":command,"domain":domain,**params}
              url="https://api.dynadot.com/api3.json?"+urllib.parse.urlencode(query)
              try:
                  with urllib.request.urlopen(url,timeout=25) as response: body=json.load(response)
              except (HTTPError,URLError) as exc:
                  raise RuntimeError("DYNADOT_API_REQUEST_FAILED") from None
              name={"get_dns":"GetDnsResponse","set_dns2":"SetDnsResponse"}[command]
              result=body.get(name,{})
              if str(result.get("ResponseCode"))!="0" or str(result.get("Status","")).lower()!="success":
                  raise RuntimeError("DYNADOT_"+command.upper()+"_FAILED_CODE_"+str(result.get("ResponseCode")))
              return result
          original=api3("get_dns",{})
          settings=original.get("GetDns",{})
          mode=(settings.get("NameServerSettings") or {}).get("Type")
          assert mode=="Dynadot Parking","UNEXPECTED_DNS_MODE"
          snapshot={
             "domain":domain,
             "previous_mode":mode,
             "previous_with_ads":(settings.get("NameServerSettings") or {}).get("WithAds"),
             "authoritative_before":before,
             "intended_apex":apex,
             "intended_www":apex,
             "email_dns_preserved":True
          }
          folder=root/"private/deploy-rollbacks"/"dynadot-dns-cutover-20261107"
          folder.mkdir(mode=0o700,parents=True,exist_ok=True)
          snapshot_file=folder/"dns-before.json"
          assert not snapshot_file.exists(),"DNS_BACKUP_ALREADY_EXISTS_ABORT"
          with snapshot_file.open("x") as h: json.dump(snapshot,h,indent=2)
          snapshot_file.chmod(0o600)
          print("DYNADOT_DNS_PRIVATE_BACKUP=PASS")
          params={
            "main_record_type0":"a","main_record0":apex,
            "main_record_type1":"mx","main_record1":mx,"main_recordx1":"0",
            "main_record_type2":"txt","main_record2":spf,
            "subdomain0":"www","sub_record_type0":"a","sub_record0":apex,
            "subdomain1":"default._domainkey","sub_record_type1":"cname","sub_record1":dkim,
            "subdomain2":"_dmarc","sub_record_type2":"txt","sub_record2":dmarc
          }
          result=api3("set_dns2",params)
          print("DYNADOT_SET_DNS2=SUCCESS")
          after_api=api3("get_dns",{})
          after_mode=(after_api.get("GetDns",{}).get("NameServerSettings") or {}).get("Type","unknown")
          print("DYNADOT_DNS_MODE_AFTER="+str(after_mode))
          # Authoritative propagation can lag, but will be independently checked.
          import time
          for attempt in range(18):
              current={r:recs(r) for r in resolvers}
              mail=all(mail_ok(x) for x in current.values())
              dns=all(x["apex_a"]==[apex] and x["www_a"]==[apex] for x in current.values())
              if mail and dns:
                  print("DYNADOT_DOMAIN_DNS=READY")
                  print("DYNADOT_MAIL_DNS=PRESERVED")
                  break
              if attempt==17:
                  print("DYNADOT_DOMAIN_DNS=PENDING_PROPAGATION" if not dns else "DYNADOT_DOMAIN_DNS=READY")
                  print("DYNADOT_MAIL_DNS=PENDING_RECHECK" if not mail else "DYNADOT_MAIL_DNS=PRESERVED")
              else:
                  time.sleep(10)
          print("DYNADOT_EMAIL_FORWARDING=NOT_CHANGED")
          PY
          REMOTE
