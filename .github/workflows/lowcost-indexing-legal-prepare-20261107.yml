name: Lowcost private legal deployment preparation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-indexing-legal-prepare-20261107.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify pinned VPS SSH host identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/khost"
          chmod 600 "$RUNNER_TEMP/khost"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/khost" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          echo LOWCOST_INDEPENDENT_HOST_PIN=PASS
      - name: Read-only VPS Django Nginx certificate, catalog, and IP-country checks
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/khost" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          root=/srv/projects/lowcost-europa
          [[ "$(git -c "safe.directory=$root" -C "$root" rev-parse HEAD)" == bb3921b646102cba0af0f397bddfde8b2f37d39a ]]
          [[ -z "$(git -c "safe.directory=$root" -C "$root" status --porcelain=v1 --untracked-files=no)" ]]
          keydir="$root/private/launch-indexing-20261107"
          install -d -m 700 "$keydir"
          if [[ ! -f "$keydir/legal-transport.pem" ]]; then
            umask 077
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$keydir/legal-transport.pem" 2>/dev/null
          fi
          echo LOWCOST_LEGAL_TRANSPORT_PUBLIC_KEY_BEGIN
          openssl pkey -in "$keydir/legal-transport.pem" -pubout
          echo LOWCOST_LEGAL_TRANSPORT_PUBLIC_KEY_END
          systemctl is-active --quiet lowcost-europa.service
          echo LOWCOST_LEGAL_PREPARATION=PASS
          REMOTE
