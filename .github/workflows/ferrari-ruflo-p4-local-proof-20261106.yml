name: Ferrari P4 Ruflo local offline functional proof once
on:
  push:
    branches: [main]
    paths:
      - ferrari-release-requests/ruflo-p4-local-proof-20261106.json
permissions:
  contents: read
concurrency:
  group: ferrari-ruflo-p4-local-proof
  cancel-in-progress: false
jobs:
  local-capabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout one authorized local-only request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Authorize exact read/ephemeral-memory task only
        id: gate
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          diff="$(git diff --name-only "$BEFORE" "$AFTER")"
          new="$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER")"
          if [[ -z "$new" ]]; then
            echo execute=false >> "$GITHUB_OUTPUT"
            echo FERRARI_RUFLO_P4_WORKFLOW_REMOVAL_ONLY=PASS
            exit 0
          fi
          test "$diff" = "$new"
          test "$new" = 'ferrari-release-requests/ruflo-p4-local-proof-20261106.json'
          python3 - <<'PY'
          import json
          from pathlib import Path
          req=json.loads(Path('ferrari-release-requests/ruflo-p4-local-proof-20261106.json').read_text())
          assert req=={"version":1,"task":"ruflo-local-route-and-ephemeral-memory-proof",
             "root":"/srv/projects/skill-universal",
             "no_agent_spawn":True,"no_daemon":True,"no_provider_credentials":True}
          print('FERRARI_RUFLO_P4_LOCAL_REQUEST=PASS')
          PY
          echo execute=true >> "$GITHUB_OUTPUT"
      - name: Verify existing SSH identity
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/host"
          chmod 600 "$RUNNER_TEMP/host"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/host" -E sha256 | awk '{print $2}')" = SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Execute bounded offline CLI operations with local-only temporary storage
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
             -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/host"
             -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
             -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6)
          set +e
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            'timeout 180 sudo -n systemd-run --scope -p MemoryMax=1500M -p CPUQuota=150% -p TasksMax=128 -- /usr/sbin/runuser -u ubuntu -- python3 -' \
            > "$RUNNER_TEMP/ruflo-p4-functional.txt" 2>&1 <<'PY'
          import os,sys,re,json,subprocess,tempfile
          from pathlib import Path
          R=Path('/srv/projects/skill-universal')
          N=R/'runtimes/node-22.23.4/bin/node'
          C=(R/'.runtime/npm/ruflo/node_modules/.bin/ruflo').resolve(strict=True)
          assert N.is_file() and C.is_file() and C.is_relative_to(R.resolve(strict=True))
          expected=R/'releases/a266b25e06a9c8acf1fdc940d22b99070cd17ded'
          assert (R/'current').resolve(strict=True)==expected
          name=R/'.runtime/npm/ruflo/node_modules/ruflo/package.json'
          assert json.loads(name.read_text())['version']=='3.71.0'
          with tempfile.TemporaryDirectory(prefix='.ruflo-functional-p4-',dir=R/'.runtime') as path:
            work=Path(path)
            for s in ('home','temp','cache','config','data'):
              (work/s).mkdir(mode=0o700)
            env=os.environ.copy()
            env.update({
              'HOME':str(work/'home'),'TMP':str(work/'temp'),'TMPDIR':str(work/'temp'),
              'XDG_CACHE_HOME':str(work/'cache'),'XDG_CONFIG_HOME':str(work/'config'),
              'XDG_DATA_HOME':str(work/'data'),'PATH':str(N.parent)+':/usr/bin:/bin',
              'CI':'1','DO_NOT_TRACK':'1','DISABLE_TELEMETRY':'1','NO_COLOR':'1',
              'OPENAI_API_KEY':'','ANTHROPIC_API_KEY':'','GOOGLE_API_KEY':'',
              'GEMINI_API_KEY':'','OPENROUTER_API_KEY':'',
              'HTTP_PROXY':'http://127.0.0.1:1',
              'HTTPS_PROXY':'http://127.0.0.1:1',
              'ALL_PROXY':'socks5://127.0.0.1:1','NO_PROXY':'',
            })
            tests=[
              ('route-list',['route','list-agents']),
              ('route-task',['route','task','write unit tests for a synthetic calculator']),
              ('memory-init',['memory','init']),
              ('memory-store',['memory','store','-k','ferrari-p4-synthetic-key','-v','synthetic nonconfidential example']),
              ('memory-get',['memory','retrieve','-k','ferrari-p4-synthetic-key']),
              ('memory-search',['memory','search','-q','synthetic nonconfidential example']),
              ('memory-peek',['memory','peek']),
            ]
            results={}
            for label,argv in tests:
              try:
                cp=subprocess.run([str(N),str(C),*argv],cwd=str(work),env=env,
                                  capture_output=True,text=True,timeout=22,check=False)
                output=re.sub(r'\x1b\[[0-9;]*m','',cp.stdout+'\n'+cp.stderr)
                results[label]={'status':cp.returncode,'output':output[:1800]}
                print('FERRARI_RUFLO_LOCAL_TEST='+label+' exit='+str(cp.returncode),flush=True)
                print('FERRARI_RUFLO_LOCAL_OUTPUT='+label+' '+repr(output[:1300]),flush=True)
              except subprocess.TimeoutExpired:
                results[label]={'status':124,'output':'timeout'}
                print('FERRARI_RUFLO_LOCAL_TEST='+label+' TIMEOUT',flush=True)
            acceptable=any(results[name]['status']==0 and len(results[name]['output'].strip())>20
                           for name in ('route-task','route-list','memory-store','memory-get','memory-search'))
            if not acceptable:
              print('FERRARI_RUFLO_LOCAL_OPERATIONAL_PROOF=BLOCKED_NO_USEFUL_RESULT',flush=True)
              raise SystemExit(4)
            print('FERRARI_RUFLO_LOCAL_OPERATIONAL_PROOF=PASS_AT_LEAST_ONE',flush=True)
            print('FERRARI_RUFLO_LOCAL_EPHEMERAL_DIRECTORY_ISOLATED=PASS',flush=True)
          assert not work.exists()
          assert (R/'current').resolve(strict=True)==expected
          print('FERRARI_RUFLO_LOCAL_TEMP_REMOVED=PASS',flush=True)
          print('FERRARI_RUFLO_P4_NO_SWARM_DAEMON_OR_AGENT_SPAWN=PASS',flush=True)
          PY
          status=$?
          set -e
          tail -n 90 "$RUNNER_TEMP/ruflo-p4-functional.txt"
          test "$status" -eq 0
          grep -q '^FERRARI_RUFLO_LOCAL_OPERATIONAL_PROOF=PASS_AT_LEAST_ONE' "$RUNNER_TEMP/ruflo-p4-functional.txt"
          echo FERRARI_RUFLO_P4_LOCAL_EXECUTION=PASS
      - name: Preserve bounded proof log
        if: always() && steps.gate.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-ruflo-p4-local-${{ github.run_id }}
          path: ${{ runner.temp }}/ruflo-p4-functional.txt
          retention-days: 14
          if-no-files-found: warn
