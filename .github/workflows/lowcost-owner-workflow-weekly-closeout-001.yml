name: Lowcost Owner Workflow Weekly Closeout 001

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lowcost-owner-workflow-weekly-closeout-001.yml"

jobs:
  deploy-and-initial-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout authoritative Lowcost main on runner
        uses: actions/checkout@v4
        with:
          repository: martaxi-boss/lowcost-europa
          ref: main
          fetch-depth: 0
          token: ${{ secrets.LOWCOST_GITHUB_READ_TOKEN }}
          persist-credentials: false
          path: lowcost-src

      - name: Verify exact main and build bundle
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="3c83587e1d573ec8bfb777f9c26f16aa8f986d1f"
          ACTUAL="$(git -C lowcost-src rev-parse HEAD)"
          echo "RUNNER_CHECKOUT_SHA=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          if git -C lowcost-src config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "PERSISTED_CHECKOUT_CREDENTIAL=YES"
            exit 10
          fi
          echo "PERSISTED_CHECKOUT_CREDENTIAL=NO"
          git -C lowcost-src update-ref refs/heads/main "$EXPECTED"
          git -C lowcost-src bundle create "$GITHUB_WORKSPACE/lowcost-europa-main.bundle" refs/heads/main
          git -C lowcost-src bundle verify "$GITHUB_WORKSPACE/lowcost-europa-main.bundle"
          git -C lowcost-src bundle list-heads "$GITHUB_WORKSPACE/lowcost-europa-main.bundle" | grep -Fx "$EXPECTED refs/heads/main"
          chmod 600 "$GITHUB_WORKSPACE/lowcost-europa-main.bundle"
          echo "BUNDLE_VERIFY=PASS"

      - name: Install SSH transport dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: OVH JIT preflight
        env:
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          HOST="146.59.145.3"
          USER="ubuntu"
          test -n "${VPS_SSH_PASSWORD:-}"
          sshpass -p "$VPS_SSH_PASSWORD" ssh             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -o StrictHostKeyChecking=accept-new             -o ConnectTimeout=10             "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP="/srv/lowcost-europa"
          APP_USER="le001_1789265592"
          EXPECTED_HEAD="fd9af286b5268b935b76bcead7739ecf31463d9d"
          EXPECTED_BRANCH="main"
          DUCK_HOST="lowcost-europa.duckdns.org"

          git_app() { sudo -u "$APP_USER" git -C "$APP" "$@"; }
          http_code() {
            host="$1"; path="$2"
            curl --noproxy "*" --resolve "$host:443:127.0.0.1" --max-time 12               -sS -o /dev/null -w "%{http_code}" "https://$host$path"
          }

          HEAD_NOW="$(git_app rev-parse HEAD)"
          BRANCH_NOW="$(git_app branch --show-current)"
          echo "PRE_HEAD=$HEAD_NOW"
          echo "PRE_BRANCH=$BRANCH_NOW"
          test "$HEAD_NOW" = "$EXPECTED_HEAD"
          test "$BRANCH_NOW" = "$EXPECTED_BRANCH"
          test -z "$(git_app status --porcelain)"
          echo "PRE_WORKTREE=CLEAN"

          for unit in lowcost-europa.service nginx postgresql; do
            state="$(systemctl is-active "$unit" || true)"
            echo "PRE_SERVICE=$unit:$state"
            test "$state" = active
          done

          if systemctl list-timers --all --no-legend 2>/dev/null | awk '{print $1}' | grep -E 'lowcost.*discovery' | grep -v '^lowcost-europa-weekly-discovery.timer$' >/dev/null; then
            echo "UNEXPECTED_DISCOVERY_TIMER=YES"
            exit 21
          fi
          TARGET_TIMER_STATE="$(systemctl is-active lowcost-europa-weekly-discovery.timer 2>/dev/null || true)"
          echo "PRE_WEEKLY_TIMER_ACTIVE=$TARGET_TIMER_STATE"
          test "$TARGET_TIMER_STATE" != active

          echo "PRE_HOME_HTTP=$(http_code "$DUCK_HOST" /)"
          echo "PRE_LIVE_HTTP=$(http_code "$DUCK_HOST" /health/live/)"
          echo "PRE_READY_HTTP=$(http_code "$DUCK_HOST" /health/ready/)"
          test "$(http_code "$DUCK_HOST" /)" = 200
          test "$(http_code "$DUCK_HOST" /health/live/)" = 200
          test "$(http_code "$DUCK_HOST" /health/ready/)" = 200
          echo "JIT_PREFLIGHT=PASS"
          REMOTE

      - name: Transport bundle only
        env:
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          HOST="146.59.145.3"
          USER="ubuntu"
          LOCAL_BUNDLE="$GITHUB_WORKSPACE/lowcost-europa-main.bundle"
          UPLOAD="/tmp/lowcost-europa-main-3c83587e.bundle.upload"
          BUNDLE="/tmp/lowcost-europa-main-3c83587e.bundle"
          sshpass -p "$VPS_SSH_PASSWORD" scp             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -o StrictHostKeyChecking=accept-new             -o ConnectTimeout=10             "$LOCAL_BUNDLE" "$USER@$HOST:$UPLOAD"
          sshpass -p "$VPS_SSH_PASSWORD" ssh             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -o StrictHostKeyChecking=accept-new             -o ConnectTimeout=10             "$USER@$HOST"             "sudo -n mv '$UPLOAD' '$BUNDLE' && sudo -n chown le001_1789265592:le001_1789265592 '$BUNDLE' && sudo -n chmod 600 '$BUNDLE'"
          echo "BUNDLE_TRANSPORT=PASS"
          echo "GITHUB_READ_TOKEN_TRANSMITTED_TO_OVH=NO"

      - name: Deploy exact main install timer and run initial campaign
        env:
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          HOST="146.59.145.3"
          USER="ubuntu"
          sshpass -p "$VPS_SSH_PASSWORD" ssh             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -o StrictHostKeyChecking=accept-new             -o ConnectTimeout=10             "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP="/srv/lowcost-europa"
          APP_USER="le001_1789265592"
          EXPECTED_PRE="fd9af286b5268b935b76bcead7739ecf31463d9d"
          EXPECTED_MAIN="3c83587e1d573ec8bfb777f9c26f16aa8f986d1f"
          BUNDLE="/tmp/lowcost-europa-main-3c83587e.bundle"
          BEFORE="/tmp/lowcost-weekly-before.json"
          DUCK_HOST="lowcost-europa.duckdns.org"
          WEEKLY_SERVICE="lowcost-europa-weekly-discovery.service"
          WEEKLY_TIMER="lowcost-europa-weekly-discovery.timer"

          cleanup() {
            sudo -n rm -f "$BUNDLE" /tmp/lowcost-europa-main-3c83587e.bundle.upload "$BEFORE" || true
          }
          trap cleanup EXIT

          git_app() { sudo -u "$APP_USER" git -C "$APP" "$@"; }
          run_manage() {
            sudo -n bash -c '
              set -a
              . /etc/lowcost-europa/lowcost-europa.env
              set +a
              cd /srv/lowcost-europa
              exec sudo -u le001_1789265592 -E /srv/lowcost-europa/.venv/bin/python manage.py "$@"
            ' _ "$@"
          }
          run_python() {
            sudo -n bash -c '
              set -a
              . /etc/lowcost-europa/lowcost-europa.env
              set +a
              cd /srv/lowcost-europa
              exec sudo -u le001_1789265592 -E /srv/lowcost-europa/.venv/bin/python "$@"
            ' _ "$@"
          }
          http_code() {
            host="$1"; path="$2"
            curl --noproxy "*" --resolve "$host:443:127.0.0.1" --max-time 12               -sS -o /dev/null -w "%{http_code}" "https://$host$path"
          }

          echo "== REVALIDATE TARGET =="
          PRE_HEAD="$(git_app rev-parse HEAD)"
          PRE_BRANCH="$(git_app branch --show-current)"
          echo "PRE_HEAD=$PRE_HEAD"
          echo "PRE_BRANCH=$PRE_BRANCH"
          test "$PRE_HEAD" = "$EXPECTED_PRE"
          test "$PRE_BRANCH" = main
          test -z "$(git_app status --porcelain)"
          for unit in lowcost-europa.service nginx postgresql; do
            test "$(systemctl is-active "$unit")" = active
          done

          echo "== BUNDLE IMPORT / FAST-FORWARD =="
          git_app bundle verify "$BUNDLE"
          git_app fetch "$BUNDLE" refs/heads/main:refs/remotes/origin/main
          git_app cat-file -e "$EXPECTED_MAIN^{commit}"
          git_app merge-base --is-ancestor "$EXPECTED_PRE" "$EXPECTED_MAIN"
          git_app checkout main
          git_app merge --ff-only "$EXPECTED_MAIN"
          test "$(git_app rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git_app branch --show-current)" = main
          test -z "$(git_app status --porcelain)"
          echo "RUNTIME_ALIGNMENT=PASS"

          echo "== APP VALIDATION / MIGRATION PLAN =="
          run_manage check
          run_manage makemigrations --check --dry-run
          echo "MIGRATION_PLAN_BEGIN"
          run_manage migrate --plan
          echo "MIGRATION_PLAN_END"
          run_manage migrate --noinput
          run_manage collectstatic --noinput
          sudo -n systemctl restart lowcost-europa.service
          test "$(systemctl is-active lowcost-europa.service)" = active

          echo "== INSTALL WEEKLY SYSTEMD =="
          sudo -n install -o root -g root -m 0644             "$APP/deploy/systemd/lowcost-europa-weekly-discovery.service"             "/etc/systemd/system/$WEEKLY_SERVICE"
          sudo -n install -o root -g root -m 0644             "$APP/deploy/systemd/lowcost-europa-weekly-discovery.timer"             "/etc/systemd/system/$WEEKLY_TIMER"
          sudo -n systemctl daemon-reload
          sudo -n cmp -s "$APP/deploy/systemd/lowcost-europa-weekly-discovery.service" "/etc/systemd/system/$WEEKLY_SERVICE"
          sudo -n cmp -s "$APP/deploy/systemd/lowcost-europa-weekly-discovery.timer" "/etc/systemd/system/$WEEKLY_TIMER"
          test "$(systemctl show "$WEEKLY_SERVICE" -p User --value)" = "$APP_USER"
          systemctl cat "$WEEKLY_SERVICE" | grep -Fq 'EnvironmentFile=/etc/lowcost-europa/lowcost-europa.env'
          sudo -n systemctl enable "$WEEKLY_TIMER"
          test "$(systemctl is-enabled "$WEEKLY_TIMER")" = enabled
          echo "WEEKLY_TIMER_INSTALLED=YES"

          echo "== OWNER WORKFLOW DEPLOYED SOURCE ACCEPTANCE =="
          OWNER_TEMPLATE="$APP/apps/catalog/templates/catalog/owner_panel/family.html"
          grep -Fq '>APROVAR</button>' "$OWNER_TEMPLATE"
          ! grep -Fq 'name="ship_from_country"' "$OWNER_TEMPLATE"
          grep -Fq 'MOTIVO DA REJEIÇÃO' "$OWNER_TEMPLATE"
          grep -Fq 'name="reason" required' "$OWNER_TEMPLATE"
          grep -Fq 'Não envia para Portugal' "$APP/apps/catalog/services/candidate_approval.py"
          grep -Fq 'Outro motivo' "$APP/apps/catalog/services/candidate_approval.py"
          echo "OWNER_WORKFLOW_SOURCE=PASS"

          echo "== PUBLIC HTTP BEFORE INITIAL PUSH =="
          test "$(http_code "$DUCK_HOST" /)" = 200
          test "$(http_code "$DUCK_HOST" /health/live/)" = 200
          test "$(http_code "$DUCK_HOST" /health/ready/)" = 200
          for slug in             cavitacao-rf-vacuum-corpo             hydrodermoabrasao-aqua-facial-multifuncoes             pressoterapia-vacuum-drenagem             hifu             diodo-laser-remocao-tatuagens-pigmentacao
          do
            code="$(http_code "$DUCK_HOST" "/products/$slug/")"
            echo "FAMILY_HTTP_BEFORE=$slug:$code"
            test "$code" = 200
          done

          echo "== SNAPSHOT BEFORE INITIAL PUSH =="
          run_python - "$BEFORE" <<'PY'
          import hashlib
          import json
          import os
          import sys
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.production")
          import django
          django.setup()
          from apps.catalog.models import CandidateDecision, Offer, OfferCandidate, ProductFamily

          families = [
              "cavitacao-rf-vacuum-corpo",
              "hydrodermoabrasao-aqua-facial-multifuncoes",
              "pressoterapia-vacuum-drenagem",
              "hifu",
              "diodo-laser-remocao-tatuagens-pigmentacao",
          ]
          candidates = OfferCandidate.objects.all()
          offers = Offer.objects.order_by("pk")
          offer_rows = list(offers.values_list(
              "pk", "is_active", "owner_hidden", "affiliate_url",
              "affiliate_promotion_status", "affiliate_promotion_verified_at",
              "protocol_verified_at", "ship_from_country", "ship_from_verified_at",
              "updated_at",
          ))
          data = {
              "candidate_ids": list(candidates.values_list("pk", flat=True)),
              "candidate_total": candidates.count(),
              "pending_total": candidates.filter(status="PENDING").count(),
              "approved_total": candidates.filter(status="APPROVED").count(),
              "rejected_total": candidates.filter(status="REJECTED").count(),
              "decision_total": CandidateDecision.objects.count(),
              "offer_total": offers.count(),
              "offer_state_hash": hashlib.sha256(
                  json.dumps(offer_rows, default=str, sort_keys=True).encode()
              ).hexdigest(),
              "pending_by_family": {
                  slug: candidates.filter(
                      product_family__slug=slug, status="PENDING"
                  ).count()
                  for slug in families
              },
          }
          with open(sys.argv[1], "w", encoding="utf-8") as fh:
              json.dump(data, fh, sort_keys=True)
          print("PENDING_BEFORE=" + str(data["pending_total"]))
          for slug, count in data["pending_by_family"].items():
              print(f"PENDING_BEFORE_FAMILY={slug}:{count}")
          print("OFFERS_BEFORE=" + str(data["offer_total"]))
          print("DECISIONS_BEFORE=" + str(data["decision_total"]))
          print("OFFER_STATE_HASH_BEFORE=" + data["offer_state_hash"])
          PY

          echo "== INITIAL CONTROLLED WEEKLY-STYLE PUSH =="
          START_TS="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          set +e
          sudo -n systemctl start "$WEEKLY_SERVICE"
          PUSH_RC=$?
          set -e
          JOURNAL="$(sudo -n journalctl -u "$WEEKLY_SERVICE" --since "$START_TS" -o cat --no-pager)"
          echo "WEEKLY_DISCOVERY_JOURNAL_BEGIN"
          printf '%s
' "$JOURNAL"
          echo "WEEKLY_DISCOVERY_JOURNAL_END"
          echo "INITIAL_PUSH_RC=$PUSH_RC"
          echo "INITIAL_PUSH_RESULT=$(systemctl show "$WEEKLY_SERVICE" -p Result --value)"
          echo "INITIAL_PUSH_EXEC_STATUS=$(systemctl show "$WEEKLY_SERVICE" -p ExecMainStatus --value)"

          echo "== SNAPSHOT AFTER INITIAL PUSH =="
          run_python - "$BEFORE" <<'PY'
          import hashlib
          import json
          import os
          import sys
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.production")
          import django
          django.setup()
          from apps.catalog.models import CandidateDecision, Offer, OfferCandidate

          families = [
              "cavitacao-rf-vacuum-corpo",
              "hydrodermoabrasao-aqua-facial-multifuncoes",
              "pressoterapia-vacuum-drenagem",
              "hifu",
              "diodo-laser-remocao-tatuagens-pigmentacao",
          ]
          with open(sys.argv[1], encoding="utf-8") as fh:
              before = json.load(fh)
          candidates = OfferCandidate.objects.all()
          offers = Offer.objects.order_by("pk")
          after_ids = set(candidates.values_list("pk", flat=True))
          new_ids = sorted(after_ids - set(before["candidate_ids"]))
          new_rows = list(
              candidates.filter(pk__in=new_ids)
              .order_by("pk")
              .values_list("pk", "product_family__slug", "status")
          )
          offer_rows = list(offers.values_list(
              "pk", "is_active", "owner_hidden", "affiliate_url",
              "affiliate_promotion_status", "affiliate_promotion_verified_at",
              "protocol_verified_at", "ship_from_country", "ship_from_verified_at",
              "updated_at",
          ))
          offer_hash = hashlib.sha256(
              json.dumps(offer_rows, default=str, sort_keys=True).encode()
          ).hexdigest()
          pending_by_family = {
              slug: candidates.filter(
                  product_family__slug=slug, status="PENDING"
              ).count()
              for slug in families
          }

          assert all(status == "PENDING" for _, _, status in new_rows)
          assert candidates.filter(status="APPROVED").count() == before["approved_total"]
          assert candidates.filter(status="REJECTED").count() == before["rejected_total"]
          assert CandidateDecision.objects.count() == before["decision_total"]
          assert offers.count() == before["offer_total"]
          assert offer_hash == before["offer_state_hash"]
          for slug in families:
              old = before["pending_by_family"][slug]
              new = pending_by_family[slug]
              if old >= 20:
                  assert new == old
              else:
                  assert new <= 20

          print("PENDING_AFTER=" + str(candidates.filter(status="PENDING").count()))
          for slug in families:
              print(f"PENDING_AFTER_FAMILY={slug}:{pending_by_family[slug]}")
          print("NEW_CANDIDATES=" + str(len(new_rows)))
          print("NEW_CANDIDATE_IDS=" + ",".join(str(row[0]) for row in new_rows))
          for pk, slug, status in new_rows:
              print(f"NEW_CANDIDATE={pk}:{slug}:{status}")
          print("AUTO_APPROVED=0")
          print("AUTO_PUBLISHED=0")
          print("AFFILIATE_LINKS_GENERATED_BY_DISCOVERY=0")
          print("OWNER_DECISIONS_CREATED_BY_DISCOVERY=0")
          print("OFFERS_STATE_UNCHANGED=YES")
          print("OFFER_STATE_HASH_AFTER=" + offer_hash)
          PY

          if [ "$PUSH_RC" -ne 0 ]; then
            echo "INITIAL_PUSH=BLOCKED"
            exit 50
          fi
          for slug in             cavitacao-rf-vacuum-corpo             hydrodermoabrasao-aqua-facial-multifuncoes             pressoterapia-vacuum-drenagem             hifu             diodo-laser-remocao-tatuagens-pigmentacao
          do
            printf '%s
' "$JOURNAL" | grep -Fq "FAMÍLIA=$slug"
          done
          printf '%s
' "$JOURNAL" | grep -Fq 'AUTO APROVADOS=0'
          printf '%s
' "$JOURNAL" | grep -Fq 'AUTO PUBLICADOS=0'
          printf '%s
' "$JOURNAL" | grep -Fq 'LINKS AFILIADOS GERADOS PELA DESCOBERTA=0'
          printf '%s
' "$JOURNAL" | grep -Fq 'OPERAÇÕES LÓGICAS='
          printf '%s
' "$JOURNAL" | grep -Fq 'RATE-LIMIT ABORT='
          echo "INITIAL_PUSH=PASS"

          echo "== ACTIVATE WEEKLY TIMER =="
          sudo -n systemctl start "$WEEKLY_TIMER"
          test "$(systemctl is-enabled "$WEEKLY_TIMER")" = enabled
          test "$(systemctl is-active "$WEEKLY_TIMER")" = active
          echo "TIMER_ACTIVE=YES"
          echo "TIMER_ENABLED=YES"
          echo "EXACT_SCHEDULE=Mon *-*-* 23:40:00 UTC"
          echo "NEXT_RUN=$(systemctl show "$WEEKLY_TIMER" -p NextElapseUSecRealtime --value)"
          systemctl list-timers "$WEEKLY_TIMER" --all --no-pager

          echo "== SHARED ALIEXPRESS STATE =="
          run_python - <<'PY'
          from apps.integrations.aliexpress.client import DEFAULT_CADENCE_PATH, DEFAULT_LOCK_PATH
          print("SHARED_LOCK=" + DEFAULT_LOCK_PATH)
          print("SHARED_CADENCE=" + DEFAULT_CADENCE_PATH)
          assert DEFAULT_LOCK_PATH == "/run/lowcost-europa/aliexpress.lock"
          assert DEFAULT_CADENCE_PATH == "/run/lowcost-europa/aliexpress.last-start"
          PY
          for state_file in /run/lowcost-europa/aliexpress.lock /run/lowcost-europa/aliexpress.last-start; do
            test -f "$state_file"
            echo "STATE_FILE=$state_file:$(stat -c '%U:%G:%a' "$state_file")"
          done

          echo "== FINAL LIVE ACCEPTANCE =="
          FINAL_HEAD="$(git_app rev-parse HEAD)"
          FINAL_BRANCH="$(git_app branch --show-current)"
          echo "FINAL_HEAD=$FINAL_HEAD"
          echo "FINAL_BRANCH=$FINAL_BRANCH"
          test "$FINAL_HEAD" = "$EXPECTED_MAIN"
          test "$FINAL_BRANCH" = main
          test -z "$(git_app status --porcelain)"
          echo "FINAL_WORKTREE=CLEAN"
          for unit in lowcost-europa.service nginx postgresql; do
            state="$(systemctl is-active "$unit" || true)"
            echo "FINAL_SERVICE=$unit:$state"
            test "$state" = active
          done
          echo "HOME_HTTP=$(http_code "$DUCK_HOST" /)"
          echo "LIVE_HTTP=$(http_code "$DUCK_HOST" /health/live/)"
          echo "READY_HTTP=$(http_code "$DUCK_HOST" /health/ready/)"
          test "$(http_code "$DUCK_HOST" /)" = 200
          test "$(http_code "$DUCK_HOST" /health/live/)" = 200
          test "$(http_code "$DUCK_HOST" /health/ready/)" = 200
          for slug in             cavitacao-rf-vacuum-corpo             hydrodermoabrasao-aqua-facial-multifuncoes             pressoterapia-vacuum-drenagem             hifu             diodo-laser-remocao-tatuagens-pigmentacao
          do
            code="$(http_code "$DUCK_HOST" "/products/$slug/")"
            echo "FAMILY_HTTP_AFTER=$slug:$code"
            test "$code" = 200
          done
          if sudo -n grep -qE '^(LOWCOST_GITHUB_READ_TOKEN|GITHUB_TOKEN|GH_TOKEN|GITHUB_PAT|GIT_TOKEN)=' /etc/lowcost-europa/lowcost-europa.env; then
            echo "GITHUB_CREDENTIAL_ON_OVH=YES"
            exit 61
          fi
          echo "GITHUB_CREDENTIAL_ON_OVH=NO"
          echo "LOWCOST_CLOSEOUT_DEPLOY=PASS"
          REMOTE
