name: Ferrari F8 - one-off read-only PINK APK and private ADB preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ferrari-f8-pink-adb-readonly-20261105.yml'
permissions:
  contents: read
concurrency:
  group: ferrari-f8-pink-adb-readonly-20261105
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read-only snapshot through existing pinned SSH identity (no APK transfer or installation)
        shell: bash
        env:
          SSHPASS: \${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/f8-adb-known-hosts"
          chmod 600 "$RUNNER_TEMP/f8-adb-known-hosts"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/f8-adb-known-hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/f8-adb-known-hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'python3 -' <<'PY_REMOTE'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import collections

          ferrari = Path('/srv/projects/skill-universal')
          pink = Path('/srv/projects/pink-iptv')
          adb = ferrari/'tools/android-cli-36.0.0/platform-tools/adb'
          print('FERRARI_ROOT_PRESENT=' + str(ferrari.is_dir()).lower())
          print('PINK_ROOT_PRESENT=' + str(pink.is_dir()).lower())
          print('FERRARI_PRIVATE_ADB_PRESENT=' + str(adb.is_file() and not adb.is_symlink()).lower())
          if not (ferrari.is_dir() and pink.is_dir() and adb.is_file() and not adb.is_symlink()):
              raise SystemExit('F8_PREFLIGHT_MISSING_ROOT_OR_ADB')
          find = subprocess.run(
              ['find', str(pink), '-xdev', '-type', 'f', '-iname', '*.apk'],
              capture_output=True, text=True, timeout=40, check=False)
          print('PINK_APK_DISCOVERY_EXIT=' + str(find.returncode))
          paths = [Path(s) for s in find.stdout.splitlines() if s.startswith(str(pink)+'/')]
          paths = [p for p in paths if p.is_file() and not p.is_symlink()]
          print('PINK_APK_FILE_COUNT=' + str(len(paths)))
          if paths:
              target = max(paths, key=lambda p: p.stat().st_mtime)
              print('PINK_APK_CANDIDATE_SIZE_BYTES=' + str(target.stat().st_size))
              digest = hashlib.sha256()
              with target.open('rb') as stream:
                  while True:
                      chunk = stream.read(1024*1024)
                      if not chunk: break
                      digest.update(chunk)
              print('PINK_APK_CANDIDATE_SHA256=' + digest.hexdigest())
          state_root = ferrari/'.runtime'
          if not state_root.is_dir():
              raise SystemExit('F8_PRIVATE_RUNTIME_NOT_PRESENT')
          with tempfile.TemporaryDirectory(prefix='f8-adb-readonly-', dir=state_root) as work:
              work = Path(work)
              env = os.environ.copy()
              for key, sub in {
                  'HOME':'home', 'TMPDIR':'tmp', 'XDG_CACHE_HOME':'cache',
                  'XDG_CONFIG_HOME':'config', 'XDG_DATA_HOME':'data'}.items():
                  p=work/sub
                  p.mkdir(mode=0o700, exist_ok=True)
                  env[key]=str(p)
              env['ANDROID_USER_HOME']=str(work/'home/.android')
              env['ADB_SERVER_PORT']='15387'
              env['ANDROID_ADB_SERVER_PORT']='15387'
              counts=collections.Counter()
              try:
                  run=subprocess.run([str(adb),'devices','-l'],capture_output=True,
                                      text=True,env=env,timeout=18,check=False)
                  print('FERRARI_ADB_DEVICES_EXIT=' + str(run.returncode))
                  for line in run.stdout.splitlines():
                      if not line.strip() or line.startswith('List of devices'):
                          continue
                      fields=line.split()
                      if len(fields)>=2:
                          status=fields[1] if fields[1] in ('device','unauthorized','offline','recovery','sideload') else 'other'
                          counts[status]+=1
                  print('FERRARI_ADB_DEVICE_COUNTS=' + ','.join(f'{k}:{counts[k]}' for k in sorted(counts)))
                  print('FERRARI_ADB_AUTHORIZED_DEVICE_PRESENT=' + str(counts.get('device',0)>0).lower())
              except (subprocess.TimeoutExpired, OSError) as exc:
                  print('FERRARI_ADB_DEVICE_PROBE_ERROR=' + type(exc).__name__)
              finally:
                  try:
                      subprocess.run([str(adb),'kill-server'],capture_output=True,env=env,timeout=8)
                  except (subprocess.TimeoutExpired,OSError):
                      print('FERRARI_ADB_TEMPORARY_SERVER_CLEANUP_UNVERIFIED')
          for service in ('pink-iptv-backend.service','pink-vpn.service'):
              result=subprocess.run(['systemctl','is-active',service],capture_output=True,text=True,timeout=8)
              status=result.stdout.strip()
              print('SERVICE_' + service.replace('.','_').replace('-','_').upper() + '=' +
                    (status if status in ('active','inactive','failed','activating','deactivating') else 'unknown'))
          print('F8_NO_PINK_APK_TRANSFER_OR_INSTALL=PASS')
          print('F8_NO_GLOBAL_APT_ON_VPS=PASS')
          PY_REMOTE
