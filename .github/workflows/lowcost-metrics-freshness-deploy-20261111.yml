name: Lowcost guarded dashboard freshness production deploy 20261111
on:
  push:
    paths:
      - .github/workflows/lowcost-metrics-freshness-deploy-20261111.yml
permissions:
  contents: read
concurrency:
  group: lowcost-metrics-freshness-deploy-20261111
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Verify existing SSH host pin
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
      - name: Deploy exact verified commit with rollback and private render checks
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          OLD=060b072964fcf3523643206e94c4ad26807cdf48
          NEW=3900b0780978909637ba20f506c39717dadd44e7
          APPUSER=le001_1789265592
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          gitrepo() { git -c safe.directory="$ROOT" -C "$ROOT" "$@"; }
          test -d "$ROOT/.git" && test -s "$ENVFILE" && test ! -L "$ENVFILE"
          test -d "$ROOT/private/ops"
          exec 9>"$ROOT/private/ops/ptes-deploy.lock"
          flock -n 9
          test "$(gitrepo rev-parse HEAD)" = "$OLD"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          test "$(gitrepo ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = "$NEW"
          gitrepo fetch --no-tags -q https://github.com/martaxi-boss/lowcost-europa.git main
          test "$(gitrepo rev-parse FETCH_HEAD)" = "$NEW"
          gitrepo merge-base --is-ancestor "$OLD" "$NEW"
          EXPECTED="$(printf '%s\n' \
            apps/catalog/owner_panel_views.py \
            apps/catalog/templates/catalog/owner_panel/dashboard.html \
            apps/catalog/tests/test_owner_analytics_dashboard.py \
            docs/audits/LOWCOST-END2END-20261111.md | LC_ALL=C sort)"
          test "$(gitrepo diff --name-only "$OLD" "$NEW" | LC_ALL=C sort)" = "$EXPECTED"
          echo METRICS_EXACT_FOUR_FILE_DIFF=PASS
          test "$(systemctl show lowcost-europa.service -p User --value)" = "$APPUSER"
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-affiliate-report.timer
          nginx -t >/dev/null 2>&1
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          affiliate_fingerprint() {
            runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYHASH'
          import hashlib,json,django
          django.setup()
          from apps.catalog.models import Offer
          offers=list(Offer.objects.filter(source="ALIEXPRESS_OWNER").order_by("pk").values_list("pk","affiliate_url"))
          print(hashlib.sha256(json.dumps(offers,separators=(",",":")).encode()).hexdigest())
          PYHASH
          }
          BEFORE_LINKS="$(affiliate_fingerprint)"
          test -n "$BEFORE_LINKS"
          CHANGED=0
          rollback() {
            rc=$?
            trap - EXIT
            if test "$rc" -ne 0 && test "$CHANGED" = 1; then
              gitrepo checkout --detach -q "$OLD" || true
              chmod 644 "$ROOT/apps/catalog/owner_panel_views.py" "$ROOT/apps/catalog/templates/catalog/owner_panel/dashboard.html" || true
              systemctl reload lowcost-europa.service || true
              echo METRICS_FRESHNESS_ROLLBACK=ATTEMPTED
            fi
            exit "$rc"
          }
          trap rollback EXIT
          CHANGED=1
          gitrepo checkout --detach -q "$NEW"
          chmod 644 "$ROOT/apps/catalog/owner_panel_views.py" "$ROOT/apps/catalog/templates/catalog/owner_panel/dashboard.html"
          runuser -u "$APPUSER" -- test -r "$ROOT/apps/catalog/templates/catalog/owner_panel/dashboard.html"
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py check
          AFTER_LINKS="$(affiliate_fingerprint)"
          test "$BEFORE_LINKS" = "$AFTER_LINKS"
          echo METRICS_MANUAL_LINKS_UNCHANGED=PASS
          systemctl reload lowcost-europa.service
          systemctl is-active --quiet lowcost-europa.service
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PY'
          import django
          django.setup()
          from datetime import timedelta
          from pathlib import Path
          from types import SimpleNamespace
          from unittest.mock import patch
          from django.utils import timezone
          from django.test import RequestFactory
          from apps.catalog.owner_panel_views import dashboard
          from apps.catalog.services.search_referral_metrics import read_private_report
          def private_render(patchreport=None):
              req=RequestFactory().get("/painel/",secure=True,HTTP_HOST="www.lowcost-europa.eu")
              req.user=SimpleNamespace(is_authenticated=True,is_staff=True)
              if patchreport is None:
                  return dashboard(req)
              with patch("apps.catalog.owner_panel_views.read_private_report",return_value=patchreport):
                  return dashboard(req)
          report=read_private_report(Path("/srv/projects/lowcost-europa/.local-metrics/search-referrers.json"))
          assert report is not None
          delta=timezone.now()-report["checked_at"]
          assert timedelta(0)<=delta<timedelta(hours=2),(str(delta),"report_not_recent")
          response=private_render()
          body=response.content.decode("utf-8")
          assert response.status_code==200
          assert response["X-Robots-Tag"]=="noindex, nofollow"
          assert response["Cache-Control"]=="private, no-store"
          assert body.count("Recolha local recente")>=2
          assert "Google Search Console" in body
          assert "AliExpress" in body
          assert "Fonte de consulta atualmente configurada: Windsor.ai" in body
          print("METRICS_PRIVATE_FRESH_RENDER=PASS")
          mocked=dict(report)
          mocked["checked_at"]=timezone.now()-timedelta(hours=5)
          response=private_render(mocked)
          body=response.content.decode("utf-8")
          assert body.count("Recolha atrasada")>=2
          assert "Relatório local com atraso" in body
          print("METRICS_PRIVATE_STALE_WARNING=PASS")
          guest=RequestFactory().get("/painel/",secure=True,HTTP_HOST="www.lowcost-europa.eu")
          guest.user=SimpleNamespace(is_authenticated=False,is_staff=False)
          guest_response=dashboard(guest)
          assert guest_response.status_code==302
          print("METRICS_PRIVATE_OWNER_AUTH=PASS")
          PY
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PY'
          import urllib.request,urllib.error
          B="https://www.lowcost-europa.eu"
          for path in ("/","/pt/","/es/","/pt/products/cavitacao-rf-vacuum-corpo/","/es/products/cavitacao-rf-vacuum-corpo/","/sitemap.xml","/robots.txt"):
              with urllib.request.urlopen(B+path,timeout=20) as res:
                  assert res.status==200,path
                  body=res.read(900000).decode("utf-8","replace")
                  if path=="/sitemap.xml":assert body.count("<loc>")==23
                  if path=="/pt/products/cavitacao-rf-vacuum-corpo/":assert "buyer-question" in body
                  if path=="/es/products/cavitacao-rf-vacuum-corpo/":assert "buyer-question" not in body
          print("METRICS_PUBLIC_SITE_AND_ES_HEALTH=PASS")
          PY
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-affiliate-report.timer
          nginx -t >/dev/null 2>&1
          test "$(gitrepo rev-parse HEAD)" = "$NEW"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          echo METRICS_GITHUB_VPS_SHA_ALIGNED=PASS
          echo METRICS_FRESHNESS_PRODUCTION=PASS
          trap - EXIT
          REMOTE
