name: Ferrari ComfyUI point2 targeted hygiene one-shot
on:
  push:
    branches: [main]
    paths:
      - 'ferrari-release-requests/comfyui-point2-hygiene-20261106.json'
permissions:
  contents: read
concurrency:
  group: ferrari-comfyui-point2-hygiene
  cancel-in-progress: false
jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify exact hygiene authorization
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate one new request with fixed proof SHA
        id: gate
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          added="$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER")"
          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          if [[ -z "$added" ]]; then
            echo execute=false >> "$GITHUB_OUTPUT"
            echo FERRARI_COMFY_HYGIENE_GITHUB_ONLY=PASS
            exit 0
          fi
          test "$added" = ferrari-release-requests/comfyui-point2-hygiene-20261106.json
          test "$changed" = "$added"
          python3 - <<'PY'
          import json
          from pathlib import Path
          req=json.loads(Path('ferrari-release-requests/comfyui-point2-hygiene-20261106.json').read_text())
          assert req=={
            "version":1,
            "task":"remove-only-verified-unsupported-tinysd-and-temporary-smokes",
            "root":"/srv/projects/skill-universal",
            "proof_sha256":"6941da15940f182e95e4b65c4e8fe58b7bf8d67756410efc27df3bb8465b64f9",
          }
          PY
          echo execute=true >> "$GITHUB_OUTPUT"
          echo FERRARI_COMFY_HYGIENE_REQUEST=PASS

      - name: Verify existing pinned SSH host
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/host"
          chmod 600 "$RUNNER_TEMP/host"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/host" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Revalidate working SD15 and exact TinySD hashes before targeted cleanup
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/host" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'python3 -' > "$RUNNER_TEMP/comfy-hygiene.txt" <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil
          root=Path('/srv/projects/skill-universal')
          base=root.resolve(strict=True)
          assert root.is_dir() and not root.is_symlink() and root.stat().st_uid==os.getuid()
          current=(root/'current').resolve(strict=True)
          expected_release=root/'releases/a266b25e06a9c8acf1fdc940d22b99070cd17ded'
          assert current==expected_release,'FERRARI_COMFY_ACTIVE_RELEASE_CHANGED'
          comfy=root/'tools/comfyui-v0.43.0'
          models=comfy/'models/diffusers'
          sd=models/'sd15-fp16-f03de327'
          old=models/'segmind-tiny-sd-3d25de3'
          assert sd.is_dir() and not sd.is_symlink()
          sha_sd={
            'unet/diffusion_pytorch_model.fp16.safetensors':'c83908253f9a64d08c25fc90874c9c8aef9a329ce1ca5fb909d73b0c83d1ea21',
            'text_encoder/model.fp16.safetensors':'77795e2023adcf39bc29a884661950380bd093cf0750a966d473d1718dc9ef4e',
            'vae/diffusion_pytorch_model.fp16.safetensors':'4fbcf0ebe55a0984f5a5e00d8c4521d52359af7229bb4d81890039d2aa16dd7c',
          }
          sha_old={
            'text_encoder/model.safetensors':'cd56d54a36ac54c1de9a247a681059d19751e3706817a09e8b7a75c67ae93584',
            'unet/diffusion_pytorch_model.safetensors':'7a42d33f11664e625855aa437dd5aa5dabed711b54d55eb92d5e027db1c04196',
            'vae/diffusion_pytorch_model.safetensors':'249bd6adf5e03a78cfbc21c689b08f9e285fa49fa81f2cf9ff175c6272a2740a',
          }
          def sha(path):
            h=hashlib.sha256()
            with path.open('rb') as f:
              for b in iter(lambda:f.read(4*1024*1024),b''):h.update(b)
            return h.hexdigest()
          def checked(path, expected):
            assert path.is_dir() and not path.is_symlink() and path.resolve(strict=True).is_relative_to(base)
            for name,digest in expected.items():
              p=path/name
              assert p.is_file() and not p.is_symlink()
              assert p.resolve(strict=True).is_relative_to(path)
              assert sha(p)==digest,'MODEL_WEIGHT_SHA_MISMATCH: '+name
          checked(sd,sha_sd)
          print('FERRARI_COMFY_SD15_WORKING_MODEL_PRESERVED=PASS',flush=True)
          out=root/'.runtime/comfyui-proof-20261106'
          rep=json.loads((out/'report.json').read_text())
          png=out/'comfyui-sd15-proof.png'
          assert rep['status']=='completed' and rep['device']=='cpu'
          assert rep['source_revision']=='f03de327dd89b501a01da37fc5240cf4fdba85a1'
          assert png.is_file() and not png.is_symlink()
          assert sha(png)==rep['sha256']=='6941da15940f182e95e4b65c4e8fe58b7bf8d67756410efc27df3bb8465b64f9'
          print('FERRARI_COMFY_REAL_PNG_PRESERVED=PASS',flush=True)
          checked(old,sha_old)
          assert json.loads((old/'FERRARI_PROVENANCE.json').read_text())['revision']=='3d25de3e8d5aacf94ce91176f204e6d11d120315'
          expected=set(sha_old)|{'model_index.json','text_encoder/config.json','unet/config.json','vae/config.json','FERRARI_PROVENANCE.json'}
          actual={str(p.relative_to(old)) for p in old.rglob('*') if p.is_file()}
          assert actual==expected,(actual-expected,expected-actual)
          for p in old.rglob('*'):
            assert not p.is_symlink() and p.stat().st_uid==os.getuid()
          freed=sum(p.stat().st_size for p in old.rglob('*') if p.is_file())
          shutil.rmtree(old)
          assert not old.exists()
          print('FERRARI_COMFY_UNSUPPORTED_TINYSD_REMOVED=PASS bytes='+str(freed),flush=True)
          # Optional old test scripts, exact Git blob guarded; no wildcard delete.
          scripts={
           '.ferrari-comfy-point2-proof.py':'4435ba6981e9ba89e410a21b3858f2c4ab087b6a',
           '.ferrari-comfy-point2-proof-r3.py':'a7992e33b1b07a74add00d6eee50f0d16938a3da',
           '.ferrari-comfy-point2-proof-sd15.py':'1c84565148b272c1472b9e6620d3432cfb26014f',
           '.ferrari-comfy-point2-proof-sd15-r5.py':'7c7ea28dfd30868738b9e847f986e9a0adf48f08',
          }
          runtime=root/'.runtime'
          for name,gitblob in scripts.items():
            p=runtime/name
            if not p.exists() and not p.is_symlink():continue
            if not p.is_file() or p.is_symlink():
              print('FERRARI_COMFY_SCRIPT_PRESERVED_CONFLICT='+name,flush=True);continue
            data=p.read_bytes()
            actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            if actual==gitblob and p.stat().st_uid==os.getuid():
              p.unlink()
              print('FERRARI_COMFY_OLD_SMOKE_REMOVED='+name,flush=True)
            else:print('FERRARI_COMFY_SCRIPT_PRESERVED_MISMATCH='+name,flush=True)
          assert (root/'current').resolve(strict=True)==expected_release
          assert sd.is_dir() and png.is_file()
          print('FERRARI_COMFY_POINT2_TARGETED_HYGIENE=PASS',flush=True)
          PY
          cat "$RUNNER_TEMP/comfy-hygiene.txt"
          grep -q '^FERRARI_COMFY_POINT2_TARGETED_HYGIENE=PASS' "$RUNNER_TEMP/comfy-hygiene.txt"

      - name: Save limited evidence
        if: steps.gate.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-comfy-hygiene-${{ github.run_id }}
          path: ${{ runner.temp }}/comfy-hygiene.txt
          retention-days: 7
          if-no-files-found: error
