name: Lowcost Europa Storefront Conversion Cleanup 001

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lowcost-storefront-conversion-001.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove superseded VPS temp branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/ops/lowcost-storefront-conversion-001"
          echo "OLD_VPS_TEMP_BRANCH_DELETED=YES"

      - name: Remove merged Lowcost builder branch
        env:
          LOWCOST_TOKEN: ${{ secrets.LOWCOST_GITHUB_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LOWCOST_TOKEN:-}"
          code="$(curl -sS -o /tmp/lowcost-delete-body -w "%{http_code}" \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $LOWCOST_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/martaxi-boss/lowcost-europa/git/refs/heads/builder/storefront-conversion-001")"
          echo "LOWCOST_BRANCH_DELETE_HTTP=$code"
          if [ "$code" != 204 ] && [ "$code" != 422 ]; then
            cat /tmp/lowcost-delete-body | sed -E 's/"documentation_url":"[^"]+"/"documentation_url":"omitted"/g'
            exit 1
          fi
          echo "LOWCOST_BUILDER_BRANCH_DELETED=YES"

      - name: Remove current VPS temp branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/ops/lowcost-storefront-conversion-deploy-001"
          echo "CURRENT_VPS_TEMP_BRANCH_DELETED=YES"
