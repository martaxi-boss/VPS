name: Lowcost Europa Storefront Conversion VPS Cleanup 001

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lowcost-storefront-conversion-001.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove current VPS temp branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/ops/lowcost-storefront-conversion-deploy-001"
          echo "CURRENT_VPS_TEMP_BRANCH_DELETED=YES"
