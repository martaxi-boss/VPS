name: Lowcost Facebook groups and Google traffic current check 20261113 1753
on:
  push:
    paths:
      - .github/workflows/lowcost-social-groups-counter-20261113-1753.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read-only status of public site
        shell: bash
        run: |
          set -euo pipefail
          for p in / /pt/ /sitemap.xml; do
            status="$(curl -sS -L --max-time 15 -o /dev/null -w '%{http_code}' "https://www.lowcost-europa.eu$p")"
            echo "PUBLIC_${p}_HTTP=$status"
            test "$status" = 200
          done
      - name: Check current VPS private aggregate counts against 1642 baseline
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          test -d "$ROOT/.git"
          systemctl is-active --quiet lowcost-europa.service
          cd "$ROOT"
          python3 - <<'PY'
          import gzip
          from collections import Counter
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from apps.catalog.services.search_referral_metrics import (
              _log_files, COMBINED, _public_page, _engine, _meta_origin, summarize_logs
          )
          now=datetime.now(timezone.utc)
          baseline=datetime(2026,11,13,16,42,9,tzinfo=timezone.utc)
          report=summarize_logs(Path('/var/log/nginx'),now=now)
          print('CHECKED_AT_UTC='+now.isoformat())
          print('LOG_LAST_OBSERVED_UTC='+str(report['last_observed']))
          print('ALL_META_7D='+str(report['meta']['total']))
          print('FACEBOOK_7D='+str(report['meta']['facebook']))
          print('INSTAGRAM_7D='+str(report['meta']['instagram']))
          print('META_UNSPECIFIED_7D='+str(report['meta']['unspecified']))
          print('META_PAID_TAGGED_7D='+str(report['meta']['paid_tagged']))
          print('META_TODAY='+str(report['meta']['today']))
          for engine,n in report['engines'].items():
            print('ENGINE_'+engine.upper()+'_7D='+str(n))
          windows={'SINCE_1642':baseline,'LAST_60M':now-timedelta(minutes=60),'LAST_30M':now-timedelta(minutes=30),'LAST_15M':now-timedelta(minutes=15)}
          counts={k:Counter() for k in windows}
          earliest=min(windows.values())
          for p in _log_files(Path('/var/log/nginx')):
            opener=gzip.open if p.suffix=='.gz' else open
            with opener(p,'rt',encoding='utf-8',errors='replace') as log:
              for line in log:
                m=COMBINED.match(line.rstrip('\n'))
                if not m:continue
                try:ts=datetime.strptime(m.group('when'),'%d/%b/%Y:%H:%M:%S %z').astimezone(timezone.utc)
                except ValueError:continue
                if ts<earliest or ts>now or m.group('status') not in {'200','304'} or not _public_page(m.group('request')):continue
                social=_meta_origin(m.group('request'),m.group('referer'))
                google=_engine(m.group('referer'))=='Google'
                for name,start in windows.items():
                  if ts<start:continue
                  if social:
                    origin,paid=social
                    counts[name]['meta']+=1
                    counts[name]['meta_'+origin]+=1
                    counts[name]['meta_paid' if paid else 'meta_without_paid_utm']+=1
                  if google:counts[name]['google']+=1
          for name,c in counts.items():
            for source in ('meta','meta_facebook','meta_instagram','meta_unspecified','meta_paid','meta_without_paid_utm','google'):
              print(name+'_'+source.upper()+'='+str(c[source]))
          print('LOWCOST_SOCIAL_GROUPS_READ_ONLY_CHECK=PASS')
          PY
          REMOTE
