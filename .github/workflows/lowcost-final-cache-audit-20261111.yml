name: Lowcost final VPS safe cache audit 20261111
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lowcost-final-cache-audit-20261111.yml
permissions:
  contents: read
concurrency:
  group: lowcost-final-vps-hygiene-cache-audit-20261111
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout audited hygiene script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify pinned SSH host
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
      - name: Build existing trusted safe-hygiene code in RAM
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/vps_hygiene_050.py ops/vps_housekeeping_safe.py
          python3 - <<'PY' > "$RUNNER_TEMP/audit.py"
          from pathlib import Path
          source=Path('ops/vps_hygiene_050.py').read_text(encoding='utf-8')
          wrapper=Path('ops/vps_housekeeping_safe.py').read_text(encoding='utf-8')
          print("import types, sys")
          print("module = types.ModuleType('vps_hygiene_050')")
          print("sys.modules['vps_hygiene_050'] = module")
          print("exec(compile(" + repr(source) + ", '<trusted-cache-operations>', 'exec'), module.__dict__)")
          print("exec(compile(" + repr(wrapper) + ", '<trusted-vps-housekeeping>', 'exec'))")
          PY
      - name: Audit safe allowlist on existing VPS
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n python3 - audit' \
            < "$RUNNER_TEMP/audit.py" > "$RUNNER_TEMP/result.json"
          test -s "$RUNNER_TEMP/result.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'result.json'
          o=json.loads(p.read_text(encoding='utf-8'))
          allowed=('status','mode','cache_roots_checked','eligible_files','eligible_allocated_bytes','disk_free_delta',
                   'protected_services_unchanged','health_after','package_manager_busy','cache_open_reference_count',
                   'runtime_sessions_deleted','app_or_database_data_deleted')
          for k in allowed:
              print('SAFE_CACHE_'+k.upper()+'='+str(o.get(k,'MISSING')))
          assert o.get('status')=='AUDIT_ONLY',o.get('status')
          assert o.get('protected_services_unchanged') is True
          assert o.get('health_after') is True
          assert o.get('app_or_database_data_deleted')==0
          assert o.get('runtime_sessions_deleted')==0
          print('SAFE_CACHE_AUDIT=PASS')
          PY
