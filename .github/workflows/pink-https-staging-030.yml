name: PINK HTTPS Staging Provision 030
on:
  push:
    branches: [builder/pink-https-staging-030]
    paths: ['.github/workflows/pink-https-staging-030.yml']
permissions:
  contents: read
concurrency:
  group: pink-https-staging-030
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose effective nginx readiness 030'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fixed readonly existing account compatibility
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 ubuntu@146.59.145.3 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          test "$(hostname)" = vps-32bea5b6
          sudo -n python3 - <<'PY'
          import glob,json,os,subprocess,re
          config=open('/etc/nginx/nginx.conf').read()
          patterns=re.findall(r'(?m)^\\s*include\\s+(/etc/nginx/sites-enabled/[^;]+);',config)
          print('SITES_ENABLED_INCLUDE_PATTERNS='+','.join(patterns))
          raw=subprocess.run(['nginx','-T'],capture_output=True,text=True,check=True).stdout
          print('SITES_ENABLED_EFFECTIVE_INCLUDE_COUNT='+str(raw.count('# configuration file /etc/nginx/sites-enabled/')))
          for p in ['/var/backups/pink-iptv/task030-https','/var/backups/pink-iptv/task030-https-r2']:
              print('PROTECTED_ATTEMPT_BACKUP_PRESENT='+str(os.path.isdir(p)))
          paths=glob.glob('/etc/letsencrypt/accounts/acme-v02.api.letsencrypt.org/directory/*/regr.json')
          print('EXISTING_ACCOUNT_COUNT='+str(len(paths)))
          for n,path in enumerate(paths):
              data=json.load(open(path))
              print('ACCOUNT_METADATA_KEYS='+','.join(sorted(data)))
              print('ACCOUNT_BODY_KEYS='+','.join(sorted(data.get('body',{}))))
              print('ACCOUNT_STATUS_PRESENT='+str('status' in data.get('body',{})))
              print('ACCOUNT_PRIVATE_FILE_PRESENT='+str(os.path.isfile(os.path.join(os.path.dirname(path),'private_key.json'))))
              account=os.path.basename(os.path.dirname(path))
              p=subprocess.run(['certbot','show_account','--config','/dev/null','--non-interactive','--server','https://acme-v02.api.letsencrypt.org/directory','--account',account],capture_output=True,text=True,timeout=30)
              print('ACCOUNT_SHOW_EXIT='+str(p.returncode))
          for path in ['/var/backups/pink-iptv/task030-https','/var/lib/pink-iptv-acme030','/etc/nginx/sites-available/pink-iptv-https','/etc/nginx/sites-enabled/pink-iptv-https']:
              print('TASK_PATH_PRESENT='+path+':'+str(os.path.lexists(path)))
          PY
          for service in ssh nginx postgresql pink-iptv-backend; do printf 'SERVICE[%s]=' "$service"; systemctl is-active "$service"; done
          REMOTE_SCRIPT
