name: Lowcost Europa exact owner requested homepage restore 20261107
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-owner-restore-20261107.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-owner-restore-20261107
  cancel-in-progress: false
jobs:
  rollout:
    if: github.repository == 'martaxi-boss/VPS' && github.actor == 'martaxi-boss'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Verify pinned VPS SSH host identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/lowcost-known-hosts"
          chmod 600 "$RUNNER_TEMP/lowcost-known-hosts"
          observed="$(ssh-keygen -lf "$RUNNER_TEMP/lowcost-known-hosts" -E sha256 | awk '{print $2}')"
          test "$observed" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          echo 'LOWCOST_PINNED_VPS=PASS'
      - name: Verify and execute bounded rollback-safe deployment
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          printf '%s' '' | base64 -d | gzip -dc > "$RUNNER_TEMP/lowcost-rollout-once.sh"
          python3 - "$RUNNER_TEMP/lowcost-rollout-once.sh" <<'PY_ATELIER'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          s=s.replace('BEFORE=388860c6a167686a378b89f4282304bce89c25de','BEFORE=2d116175b71ec193a80ab0e71ac92217c7c6347e')
          s=s.replace('TARGET=2d116175b71ec193a80ab0e71ac92217c7c6347e','TARGET=6ff280ae6bb2e727166515f21c0803bad4d2e627')
          start=s.index('# Preserve only the nine exact reviewed tracked changes.')
          end=s.index('# Do not modify source if local and remote backups are not valid.',start)
          s=s[:start]+'''# The previous release's tracked source must be pristine. Never overwrite local edits.
          [[ -z "$("${G[@]}" status --porcelain --untracked-files=no)" ]] || fail existing_tracked_local_edits
          [[ -z "$("${G[@]}" diff --name-only HEAD)" ]] || fail unexpected_dirty_files

          '''+s[end:]
          s=''.join(line for line in s.splitlines(keepends=True) if 'tracked-before.tar' not in line and 'hash-object "$ROOT/deploy/scripts/offsite-restore-drill.sh"' not in line)
          s=s.replace("[[ \"$home\" == *'Escolhas mais claras.'* ]] || fail new_home_copy", "[[ \"$home\" == *'Compare antes de escolher.'* ]] || fail new_home_copy\n[[ \"$home\" == *'atelier-specialties'* ]] || fail new_home_structure\n[[ \"$home\" == *'atelier-20261107b'* ]] || fail new_home_cache_revision")
          p.write_text(s)
          PY_ATELIER
          printf '%s  %s\n' '3e19a30fda516f7dff31e79fece6f8afe3bebd2f4bb1a4abb4889feb8a87276a' "$RUNNER_TEMP/lowcost-rollout-once.sh" | sha256sum -c - >/dev/null
          python3 - "$RUNNER_TEMP/lowcost-rollout-once.sh" <<'PY_RESTORE'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          substitutions=[
              ('BEFORE=2d116175b71ec193a80ab0e71ac92217c7c6347e','BEFORE=6ff280ae6bb2e727166515f21c0803bad4d2e627'),
              ('TARGET=6ff280ae6bb2e727166515f21c0803bad4d2e627','TARGET=52a1de3a8386a52178eea492e8d41eaaba54b437'),
              ('''[[ "$home" == *'Compare antes de escolher.'* ]] || fail new_home_copy
          [[ "$home" == *'atelier-specialties'* ]] || fail new_home_structure
          [[ "$home" == *'atelier-20261107b'* ]] || fail new_home_cache_revision''',
               '''[[ "$home" == *'Escolhas mais claras.'* ]] || fail restore_home_copy
          [[ "$home" == *'class="family-index family-index--compact"'* ]] || fail restore_categories_navigation
          [[ "$home" == *'VER EQUIPAMENTOS E PREÇOS'* ]] || fail restore_primary_button
          [[ "$home" == *'ux-20261107'* ]] || fail restore_static_revision
          [[ "$home" != *'atelier-specialties'* ]] || fail atelier_still_visible'''),
          ]
          for old,new in substitutions:
              if s.count(old)!=1:
                  raise SystemExit('Restore guard did not find exact expected source.')
              s=s.replace(old,new)
          p.write_text(s)
          PY_RESTORE
          printf '%s  %s\n' '3848bd8350de4ec3bd5ed4b3d1d4c4720dbb1ebeec9496bd89725313adc854d1' "$RUNNER_TEMP/lowcost-rollout-once.sh" | sha256sum -c - >/dev/null
          bash -n "$RUNNER_TEMP/lowcost-rollout-once.sh"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/lowcost-known-hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' < "$RUNNER_TEMP/lowcost-rollout-once.sh"
      - name: Preserve audited rollout procedure (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lowcost-one-shot-procedure-${{ github.run_id }}
          path: ${{ runner.temp }}/lowcost-rollout-once.sh
          if-no-files-found: warn
          retention-days: 7
      - name: Verify external HTTPS and staging noindex
        shell: bash
        run: |
          set -euo pipefail
          base=https://lowcost-europa.duckdns.org
          headers="$(curl -fsSIL --max-time 35 "$base/")"
          printf '%s\n' "$headers" | grep -Eiq '^x-robots-tag:.*noindex'
          robots="$(curl -fsSL --max-time 35 "$base/robots.txt")"
          [[ "$robots" == *'Disallow: /'* ]]
          home="$(curl -fsSL --max-time 35 "$base/")"
          [[ "$home" == *'Escolhas mais claras.'* ]]
          [[ "$home" == *'family-index--compact'* ]]
          css="$(curl -fsSL --max-time 35 "$base/static/storefront/storefront.css?v=ux-20261107")"
          [[ "$css" == *'.family-index--compact'* ]]
          js="$(curl -fsSL --max-time 35 "$base/static/storefront/catalog-explorer.js?v=ux-20261107")"
          [[ "$js" == *'data-compare-dock'* ]]
          [[ "$home" != *'atelier-specialties'* ]]
          echo 'LOWCOST_OWNER_RESTORE_LIVE_HTTPS=PASS'
