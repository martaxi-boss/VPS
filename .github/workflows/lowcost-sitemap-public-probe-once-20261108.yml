name: Lowcost public sitemap independent transport diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-sitemap-public-probe-once-20261108.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify twelve public transport variants without resubmission
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess,tempfile,xml.etree.ElementTree as ET
          from pathlib import Path
          url='https://www.lowcost-europa.eu/sitemap.xml'
          agents={'plain':'Lowcost-Sitemap-Audit/1.0','google':'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)','bing':'Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)'}
          hashes=set()
          with tempfile.TemporaryDirectory() as directory:
              p=Path(directory)
              for engine,agent in agents.items():
                  for protocol in ('--http1.1','--http2'):
                      for encoding in ('identity','gzip'):
                          args=['curl','-sS','--max-time','25',protocol,'-A',agent,'-H','Accept-Encoding: '+encoding,'-D',str(p/'headers'),'-o',str(p/'body'),'-w','%{http_code}|%{time_total}|%{ssl_verify_result}',url]
                          if encoding=='gzip': args.insert(1,'--compressed')
                          r=subprocess.run(args,capture_output=True,text=True,timeout=30)
                          assert r.returncode==0, 'Public sitemap transport failed'
                          status,seconds,tls=r.stdout.split('|')
                          body=(p/'body').read_bytes()
                          tree=ET.fromstring(body)
                          assert tree.tag=='{http://www.sitemaps.org/schemas/sitemap/0.9}urlset'
                          locs=[n.text for n in tree.findall('{http://www.sitemaps.org/schemas/sitemap/0.9}url/{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
                          assert len(locs)==len(set(locs))==11
                          assert all(x.startswith('https://www.lowcost-europa.eu/') and '?' not in x for x in locs)
                          digest=hashlib.sha256(body).hexdigest()
                          hashes.add(digest)
                          allowed={'content-type','content-encoding','content-length','x-robots-tag','location','vary','cache-control','content-language'}
                          headers={}
                          for line in (p/'headers').read_text().splitlines():
                              if ':' in line:
                                  k,v=line.split(':',1)
                                  if k.lower() in allowed: headers[k.lower()]=v.strip()
                          print('PUBLIC_SITEMAP_PROBE='+json.dumps(dict(agent=engine,protocol=protocol,encoding=encoding,http=status,tls_verify=tls,seconds=seconds,xml_bytes=len(body),urls=len(locs),headers=headers)))
                          assert status=='200' and tls=='0'
              assert len(hashes)==1
          print('PUBLIC_SITEMAP_12_VARIANTS_IDENTICAL=PASS')
          print('SYNTHETIC_AGENTS_ARE_NOT_AUTHENTICATED_CRAWLERS=YES')
          PY
