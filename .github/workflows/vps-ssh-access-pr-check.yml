name: VPS SSH Access PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test SSH access to VPS
        env:
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          HOST="146.59.145.3"

          if [ -z "${VPS_SSH_PASSWORD:-}" ]; then
            echo "VPS_SSH_PASSWORD secret is missing or empty"
            exit 2
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

          for USER in root ubuntu; do
            echo "Testing SSH user: $USER"
            if sshpass -p "$VPS_SSH_PASSWORD" ssh               -o PreferredAuthentications=password               -o PubkeyAuthentication=no               -o StrictHostKeyChecking=accept-new               -o ConnectTimeout=10               "$USER@$HOST"               'printf "SSH_ACCESS=PASS\n"; printf "REMOTE_USER=%s\n" "$(id -un)"; printf "HOSTNAME=%s\n" "$(hostname)"; uptime; df -h /; free -h' ; then
              echo "WORKING_SSH_USER=$USER"
              exit 0
            fi
          done

          echo "SSH_ACCESS=FAIL"
          exit 1
