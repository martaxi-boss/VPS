name: Telegram commands to Codex

# Telegram bot processes only commands from TELEGRAM_CHAT_ID.
# No long-lived process on production VPS. No ChatGPT Work polling.
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

concurrency:
  group: telegram-codex-polling
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  telegram:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read reviewed bot source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate Telegram gateway syntax
        run: python3 -m py_compile ops/telegram_gateway.py

      - name: Process authorized private Telegram messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/telegram_gateway.py poll
