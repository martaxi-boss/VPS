name: Lowcost Cavitation owner heading only guarded deploy 20261110
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-cavitation-heading-only-20261110.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-cavitation-heading-only-20261110
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Pinned SSH apply exact two-file source diff with rollback
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          OLD=71d2b7b749d0b74642e3d950d6c0e2275b12f395
          NEW=6d68a4aae3255512f7f6b5477de9398c8e2aea89
          APPUSER=le001_1789265592
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          gitrepo() { git -c safe.directory="$ROOT" -C "$ROOT" "$@"; }
          test -d "$ROOT/.git" && test -s "$ENVFILE" && test ! -L "$ENVFILE"
          exec 9>"$ROOT/private/ops/ptes-deploy.lock"
          flock -n 9
          test "$(gitrepo rev-parse HEAD)" = "$OLD"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          test "$(gitrepo ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = "$NEW"
          gitrepo fetch --no-tags -q https://github.com/martaxi-boss/lowcost-europa.git main
          test "$(gitrepo rev-parse FETCH_HEAD)" = "$NEW"
          gitrepo merge-base --is-ancestor "$OLD" "$NEW"
          EXPECTED="$(printf '%s\n' \
            apps/storefront/templates/storefront/components/offer_card.html \
            apps/storefront/tests/test_offer_go.py | LC_ALL=C sort)"
          test "$(gitrepo diff --name-only "$OLD" "$NEW" | LC_ALL=C sort)" = "$EXPECTED"
          echo CAVITATION_HEADING_ONLY_TWO_FILE_DIFF=PASS
          test "$(systemctl show lowcost-europa.service -p User --value)" = "$APPUSER"
          nginx -t >/dev/null 2>&1
          systemctl is-active --quiet lowcost-europa.service
          SOURCE_CHANGED=0
          rollback() {
            rc=$?
            trap - EXIT
            if test "$rc" -ne 0 && test "$SOURCE_CHANGED" = 1; then
              gitrepo checkout --detach -q "$OLD" || true
              systemctl reload lowcost-europa.service || true
              echo CAVITATION_HEADING_ROLLBACK=ATTEMPTED
            fi
            exit "$rc"
          }
          trap rollback EXIT
          SOURCE_CHANGED=1
          gitrepo checkout --detach -q "$NEW"
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py check
          systemctl reload lowcost-europa.service
          systemctl is-active --quiet lowcost-europa.service
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PY'
          import re, urllib.request, urllib.error
          from html.parser import HTMLParser
          import django
          django.setup()
          from apps.catalog.models import Offer, OfferClick, OfferFamilyPlacement
          from apps.catalog.services.public_eligibility import public_eligibility_q
          offers=OfferFamilyPlacement.objects.filter(
              product_family__slug="cavitacao-rf-vacuum-corpo",
              offer__in=Offer.objects.filter(public_eligibility_q())
          )
          assert offers.count()==17
          assert not Offer.objects.get(pk=212).owner_hidden is False
          assert OfferClick.objects.filter(offer_id=212).count()>=2
          print("CAVITATION_HEADING_PRODUCT_COUNT=PASS_17")
          for prefix in ("","/pt"):
              url="https://www.lowcost-europa.eu"+prefix+"/products/cavitacao-rf-vacuum-corpo/"
              with urllib.request.urlopen(url,timeout=25) as response:
                  assert response.status==200
                  html=response.read(2000000).decode("utf-8")
              assert html.count('class="offer-origin-heading"')==17
              assert html.count('class="offer-price-block offer-price-block--compact"')==17
              pairs=re.findall(
                  r'<div class="offer-price-block offer-price-block--compact">\s*'
                  r'<p class="offer-origin-heading">Enviado da Europa</p>\s*'
                  r'<p class="fact-label">Preço observado</p>',
                  html
              )
              assert len(pairs)==17,(prefix,len(pairs))
              assert 'class="offer-origin-unknown"' not in html
              assert "data-affiliate-original-url=" in html
              assert "data-compare-toggle" in html
              assert 'data-offer-id="212"' not in html
              print("CAVITATION_HEADING_PUBLIC_"+(prefix.strip("/") or "BASE").upper()+"=PASS_17")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**k):return None
          opener=urllib.request.build_opener(NoRedirect)
          for pk,expected_status in ((211,302),(212,404)):
              req=urllib.request.Request("https://www.lowcost-europa.eu/go/"+str(pk)+"/",
                  method="HEAD",headers={"User-Agent":"Mozilla/5.0 (Linux; Android 14) Chrome/131 Mobile"})
              try: response=opener.open(req,timeout=22)
              except urllib.error.HTTPError as e: response=e
              assert response.code==expected_status,(pk,response.code)
              if pk==211:
                  assert response.headers.get("Location")==Offer.objects.get(pk=pk).affiliate_url
          print("CAVITATION_HEADING_AFFILIATE_LINKS_UNCHANGED=PASS")
          PY
          test "$(gitrepo rev-parse HEAD)" = "$NEW"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          nginx -t >/dev/null 2>&1
          systemctl is-active --quiet lowcost-europa.service
          echo CAVITATION_HEADING_ONLY_PRODUCTION=PASS
          trap - EXIT
          REMOTE
