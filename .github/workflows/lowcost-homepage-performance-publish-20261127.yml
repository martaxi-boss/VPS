name: Lowcost homepage performance guarded rollout 20261127
on:
  push:
    paths:
      - .github/workflows/lowcost-homepage-performance-publish-20261127.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lowcost-homepage-performance-rollout
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify pinned VPS SSH host
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
      - name: Deploy tested homepage optimization with backup and rollback
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 022
          export GIT_TERMINAL_PROMPT=0
          ROOT=/srv/projects/lowcost-europa
          TARGET=846e0fdfe3a8c1eb733c47f4a33a74884b4a22ed
          EXPECTED=61d1197ad050902bee81c378fab34a4d82ffbd1c
          test -d "$ROOT/.git"
          g() { git -c safe.directory="$ROOT" -C "$ROOT" "$@"; }
          test -z "$(g status --porcelain=v1 --untracked-files=no)"
          systemctl is-active --quiet lowcost-europa.service
          nginx -t >/dev/null 2>&1
          case "$(g remote get-url origin)" in
            https://github.com/martaxi-boss/lowcost-europa|https://github.com/martaxi-boss/lowcost-europa.git|git@github.com:martaxi-boss/lowcost-europa.git) ;;
            *) echo 'PERF_ORIGIN_UNEXPECTED'; exit 1 ;;
          esac
          exec 9< "$ROOT/.git/HEAD"
          flock -n 9
          OLD="$(g rev-parse HEAD)"
          echo "PERF_OLD_SHA=$OLD"
          test "$OLD" = "$EXPECTED"
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          g fetch -q --no-tags origin main
          test "$(g rev-parse FETCH_HEAD)" = "$TARGET"
          g merge-base --is-ancestor "$OLD" "$TARGET"
          g diff --name-only "$OLD" "$TARGET" | python3 -c '
          import sys
          assert set(sys.stdin.read().splitlines()) == {"apps/storefront/views.py", "apps/storefront/tests/test_placement_read_path.py"}
          print("PERF_SOURCE_SCOPE=PASS")
          '
          BACKUP="$ROOT/.deploy-backups/homepage-perf-20261127-$(date -u +%H%M%S)"
          install -d -m 700 "$BACKUP"
          g archive "$OLD" apps/storefront/views.py apps/storefront/tests/test_placement_read_path.py | gzip > "$BACKUP/source-before.tar.gz"
          chmod 600 "$BACKUP/source-before.tar.gz"
          printf '%s\n' "$OLD" > "$BACKUP/source-before.sha"
          TIMER_BEFORE="$(systemctl is-active lowcost-europa-indexnow.timer lowcost-europa-affiliate-report.timer lowcost-europa-cavitation-availability.timer)"
          cat > "$BACKUP/check.py" <<'PYCHECK'
          import json,subprocess,sys,time,statistics
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          from xml.etree import ElementTree as ET
          BASE="https://www.lowcost-europa.eu"
          HOMES=("/", "/pt/", "/es/")
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.canon=[];self.alts={};self.go=set();self.noindex=False
                  self.title=[];self.in_title=False;self.images=[];self.headings=[];self.heading=None
              def handle_starttag(self,t,a):
                  d=dict(a)
                  if t=="link" and d.get("rel")=="canonical":self.canon.append(d.get("href"))
                  if t=="link" and d.get("hreflang"):self.alts[d["hreflang"]]=d.get("href")
                  if t=="meta" and d.get("name")=="robots" and "noindex" in d.get("content","").lower():self.noindex=True
                  if t=="title":self.in_title=True
                  if t in ("h1","h2","h3"):self.heading=t
                  if t=="a" and urlsplit(d.get("href","")).path.startswith("/go/"):self.go.add(urlsplit(d["href"]).path)
                  if t=="img":self.images.append((d.get("src"),d.get("alt")))
              def handle_endtag(self,t):
                  if t=="title":self.in_title=False
                  if t==self.heading:self.heading=None
              def handle_data(self,d):
                  if self.in_title:self.title.append(d)
                  if self.heading:self.headings.append(d)
          def get(path):
              start=time.monotonic()
              data=subprocess.check_output(["curl","-fsS","--connect-timeout","5","--max-time","40","--resolve","www.lowcost-europa.eu:443:127.0.0.1",BASE+path])
              return data.decode(), round(time.monotonic()-start,3)
          mode=sys.argv[1]; evidence=Path(sys.argv[2])
          urls=get("/sitemap.txt")[0].split()
          xml=[n.text for n in ET.fromstring(get("/sitemap.xml")[0]).iter() if n.tag.rsplit("}",1)[-1]=="loc"]
          assert len(urls)==len(set(urls))==23 and set(urls)==set(xml)
          robots=get("/robots.txt")[0]
          assert BASE+"/sitemap.xml" in robots and BASE+"/sitemap.txt" in robots
          pages={}; timings={}
          for u in urls:
              path=urlsplit(u).path
              html,elapsed=get(path)
              p=Page();p.feed(html);assert p.canon==[u] and not p.noindex, path
              pages[u]={"canonical":p.canon,"alternates":p.alts,"title":p.title,"headings":p.headings,"links":sorted(p.go),"images":p.images}
              timings[path]=[elapsed]
          for u,p in pages.items():
              for target in p["alternates"].values():assert pages[target]["alternates"]==p["alternates"],u
          for path in HOMES:
              timings[path].extend(get(path)[1] for _ in range(2))
          medians={k:round(statistics.median(v),3) for k,v in timings.items()}
          result={"pages":pages,"medians":medians,"robots":robots,"urls":urls}
          print("PERF_"+mode.upper()+"_23_CANONICAL_HREFLANG=PASS",flush=True)
          print("PERF_"+mode.upper()+"_SECONDS="+json.dumps(medians,sort_keys=True),flush=True)
          if mode=="before":
              evidence.write_text(json.dumps(result,ensure_ascii=False))
          else:
              before=json.loads(evidence.read_text())
              # JSON serializes tuples as lists. Compare the same representation.
              assert json.loads(json.dumps(pages))==before["pages"],"Public headings, images, titles or affiliate paths changed"
              assert urls==before["urls"] and robots==before["robots"],"Discovery files changed"
              print("PERF_PUBLIC_CONTENT_AND_SITEMAPS_UNCHANGED=PASS",flush=True)
              for path in HOMES:
                  prev=before["medians"][path]; curr=medians[path]
                  assert curr <= max(2.0,prev*0.8), f"Insufficient improvement {path}: {prev}s -> {curr}s"
              print("PERF_HOMEPAGE_IMPROVEMENT=PASS",flush=True)
          PYCHECK
          chmod 600 "$BACKUP/check.py"
          python3 "$BACKUP/check.py" before "$BACKUP/public-before.json"
          chmod 600 "$BACKUP/public-before.json"
          DEPLOYED=0
          rollback() {
            code=$?
            if [ "$code" -ne 0 ] && [ "$DEPLOYED" = 1 ]; then
              g checkout --detach "$OLD" >/dev/null || true
              chmod 644 "$ROOT/apps/storefront/views.py" "$ROOT/apps/storefront/tests/test_placement_read_path.py" || true
              systemctl reload lowcost-europa.service || systemctl restart lowcost-europa.service || true
              echo 'PERF_ROLLBACK_ATTEMPTED=YES'
            fi
            exit "$code"
          }
          trap rollback EXIT
          DEPLOYED=1
          g checkout --detach "$TARGET" >/dev/null
          chmod 644 "$ROOT/apps/storefront/views.py" "$ROOT/apps/storefront/tests/test_placement_read_path.py"
          runuser -u "$APPUSER" -- test -r "$ROOT/apps/storefront/views.py"
          python3 -c 'import ast,pathlib;ast.parse(pathlib.Path("/srv/projects/lowcost-europa/apps/storefront/views.py").read_text())'
          systemctl reload lowcost-europa.service
          systemctl is-active --quiet lowcost-europa.service
          nginx -t >/dev/null 2>&1
          python3 "$BACKUP/check.py" after "$BACKUP/public-before.json"
          test "$TIMER_BEFORE" = "$(systemctl is-active lowcost-europa-indexnow.timer lowcost-europa-affiliate-report.timer lowcost-europa-cavitation-availability.timer)"
          test "$(g rev-parse HEAD)" = "$TARGET"
          test -z "$(g status --porcelain=v1 --untracked-files=no)"
          echo "PERF_APP_SHA=$TARGET"
          echo "PERF_GITHUB_VPS_ALIGNMENT=PASS"
          echo "PERF_TIMERS_UNCHANGED=PASS"
          DEPLOYED=0
          REMOTE
