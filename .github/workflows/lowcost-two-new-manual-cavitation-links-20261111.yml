name: Lowcost Cavitation two new owner links to 19 guarded publish 20261111
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-two-new-manual-cavitation-links-20261111.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-manual-cavitation-two-new-links
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Pinned SSH backup, atomic manual publication, public verification and rollback
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          EXPECTED=3900b0780978909637ba20f506c39717dadd44e7
          APPUSER=le001_1789265592
          FAMILY=cavitacao-rf-vacuum-corpo
          gitrepo() { git -c safe.directory="$ROOT" -C "$ROOT" "$@"; }
          test -d "$ROOT/.git" && test -s "$ENVFILE" && test ! -L "$ENVFILE"
          exec 9>"$ROOT/private/ops/ptes-deploy.lock"
          flock -n 9
          test "$(gitrepo rev-parse HEAD)" = "$EXPECTED"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          test "$(gitrepo ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = "$EXPECTED"
          test "$(systemctl show lowcost-europa.service -p User --value)" = "$APPUSER"
          nginx -t >/dev/null 2>&1
          for unit in \
            lowcost-europa.service \
            lowcost-europa-catalog-maintenance.timer \
            lowcost-europa-indexnow.timer \
            lowcost-europa-backup.timer \
            lowcost-europa-offsite-backup.timer \
            lowcost-europa-offsite-backup-health.timer \
            lowcost-europa-affiliate-report.timer \
            lowcost-europa-cavitation-availability.timer; do
              systemctl is-active --quiet "$unit"
          done
          ENV_SHA="$(sha256sum "$ENVFILE" | awk '{print $1}')"
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          snapshot_originals() {
            runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYHASH'
          import django,hashlib
          django.setup()
          from apps.catalog.models import Offer,OfferFamilyPlacement
          from apps.catalog.services.public_eligibility import public_eligibility_q
          old=OfferFamilyPlacement.objects.filter(
              product_family__slug="cavitacao-rf-vacuum-corpo",
              offer__source=Offer.Source.ALIEXPRESS_OWNER,
              offer__in=Offer.objects.filter(public_eligibility_q()),
          ).exclude(offer__external_product_id__in=[
              "1005012940786022","1005013204172598",
          ]).values_list("offer__external_product_id","offer__affiliate_url")
          rows=sorted(old)
          assert len(rows)==17 and len({x[0] for x in rows})==17
          assert all(url.startswith("https://s.click.aliexpress.com/e/") for _,url in rows)
          assert dict(rows)["1005013070854347"]=="https://s.click.aliexpress.com/e/_c3qslKyf"
          print(hashlib.sha256("\n".join(pid+"\t"+link for pid,link in rows).encode()).hexdigest())
          PYHASH
          }
          BEFORE_17="$(snapshot_originals)"
          test -n "$BEFORE_17"
          echo CAVITATION_BASELINE_17_LINKS=PASS
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYPRE'
          import django
          django.setup()
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement,ProductFamily
          from apps.catalog.services.public_eligibility import public_eligibility_q
          family=ProductFamily.objects.get(slug="cavitacao-rf-vacuum-corpo")
          placements=OfferFamilyPlacement.objects.filter(product_family=family)
          visible=placements.filter(offer__in=Offer.objects.filter(public_eligibility_q()))
          assert visible.count()==17 and placements.count()==18
          assert visible.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()==17
          old=Offer.objects.get(pk=208,source=Offer.Source.ALIEXPRESS_OWNER,
                               external_product_id="1005012079834974")
          assert placements.filter(offer=old).exists() and not old.owner_hidden
          test=Offer.objects.get(pk=212,source=Offer.Source.ALIEXPRESS_OWNER,
                                 external_product_id="1005013114375206")
          assert test.owner_hidden and placements.filter(offer=test).count()==1
          assert OfferClick.objects.filter(offer=test).count()>=2
          assert not Offer.objects.filter(
              source=Offer.Source.ALIEXPRESS_OWNER,
              external_product_id__in=["1005012940786022","1005013204172598"]
          ).exists()
          print("CAVITATION_PRECHECK_17_VISIBLE_18_PLACEMENTS_AND_HIDDEN_TEST=PASS")
          PYPRE
          sh "$ROOT/deploy/scripts/backup-postgres.sh"
          BACKUP="$(find "$ROOT/backups/daily" -maxdepth 1 -type f -name '*.dump' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -s "$BACKUP" && test -s "$BACKUP.sha256"
          (cd "$ROOT/backups/daily" && sha256sum -c "$(basename "$BACKUP.sha256")" >/dev/null)
          echo CAVITATION_TWO_PRODUCTS_DB_BACKUP=PASS
          PUBLISHED=0
          rollback() {
            rc=$?
            trap - EXIT
            if test "$rc" -ne 0 && test "$PUBLISHED" = 1; then
              runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYUNDO' || true
          import django
          django.setup()
          from django.db import transaction
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement,OfferObservation,ProductFamily
          intended={
              "1005012940786022":"https://s.click.aliexpress.com/e/_c3yCICGf",
              "1005013204172598":"https://s.click.aliexpress.com/e/_c3gNtzPv",
          }
          with transaction.atomic():
              family=ProductFamily.objects.select_for_update().get(slug="cavitacao-rf-vacuum-corpo")
              for pid,link in intended.items():
                  offer=Offer.objects.select_for_update().filter(
                      source=Offer.Source.ALIEXPRESS_OWNER,
                      external_product_id=pid,affiliate_url=link).first()
                  if offer is None: continue
                  OfferFamilyPlacement.objects.filter(offer=offer,product_family=family).delete()
                  if OfferClick.objects.filter(offer=offer).exists():
                      offer.owner_hidden=True
                      offer.save(update_fields=["owner_hidden"])
                  else:
                      OfferObservation.objects.filter(offer=offer).delete()
                      try:
                          offer.delete()
                      except Exception:
                          offer.owner_hidden=True
                          offer.save(update_fields=["owner_hidden"])
              test=Offer.objects.get(pk=212,source=Offer.Source.ALIEXPRESS_OWNER,
                                     external_product_id="1005013114375206",
                                     owner_hidden=True)
              OfferFamilyPlacement.objects.get_or_create(
                  offer=test,product_family=family,
                  defaults={"selection_position":None,"display_order":0})
          print("CAVITATION_ROLLBACK_ATTEMPTED=YES")
          PYUNDO
            fi
            exit "$rc"
          }
          trap rollback EXIT
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYPUBLISH'
          import django
          from django.db import transaction
          from django.core.management import call_command
          django.setup()
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement,ProductFamily
          from apps.catalog.services.public_eligibility import public_eligibility_q,MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY
          family_slug="cavitacao-rf-vacuum-corpo"
          intended=(
              ("1005012940786022","https://s.click.aliexpress.com/e/_c3yCICGf"),
              ("1005013204172598","https://s.click.aliexpress.com/e/_c3gNtzPv"),
          )
          assert MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY==20
          with transaction.atomic():
              family=ProductFamily.objects.select_for_update().get(slug=family_slug)
              placements=OfferFamilyPlacement.objects.select_for_update().filter(product_family=family)
              assert placements.count()==18
              visible=placements.filter(offer__in=Offer.objects.filter(public_eligibility_q()))
              assert visible.count()==17
              hidden=Offer.objects.select_for_update().get(
                  pk=212,source=Offer.Source.ALIEXPRESS_OWNER,
                  external_product_id="1005013114375206",owner_hidden=True)
              assert placements.filter(offer=hidden).count()==1
              assert OfferClick.objects.filter(offer=hidden).count()>=2
              for pid,_ in intended:
                  assert not Offer.objects.filter(
                      source=Offer.Source.ALIEXPRESS_OWNER,
                      external_product_id=pid).exists()
              removed,_=placements.filter(offer=hidden).delete()
              assert removed==1 and placements.count()==17
              print("CAVITATION_HIDDEN_TEST_PLACEMENT_REMOVED_HISTORY_PRESERVED=PASS")
              for pid,link in intended:
                  call_command("publish_owner_affiliate_link",
                               "--family",family_slug,link)
                  offer=Offer.objects.get(source=Offer.Source.ALIEXPRESS_OWNER,
                                          external_product_id=pid)
                  assert offer.affiliate_url==link and not offer.owner_hidden and offer.is_active
                  assert placements.filter(offer=offer).count()==1
                  print("CAVITATION_NEW_PRODUCT_PUBLISHED="+pid+" offer="+str(offer.pk))
              assert placements.count()==19
              assert placements.filter(
                  offer__in=Offer.objects.filter(public_eligibility_q())).count()==19
              assert not placements.filter(offer=hidden).exists()
              assert OfferClick.objects.filter(offer=hidden).count()>=2
              assert placements.filter(
                  offer__external_product_id="1005012079834974",
                  offer__source=Offer.Source.ALIEXPRESS_OWNER).count()==1
          print("CAVITATION_ATOMIC_PUBLICATION=PASS_19_VISIBLE")
          PYPUBLISH
          PUBLISHED=1
          AFTER_17="$(snapshot_originals)"
          test "$BEFORE_17" = "$AFTER_17"
          echo CAVITATION_ALL_17_ORIGINAL_LINKS_PRESERVED=PASS
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PYVERIFY'
          import django,urllib.request,urllib.error
          from html.parser import HTMLParser
          django.setup()
          from apps.catalog.models import Offer,OfferFamilyPlacement,OfferClick
          from apps.catalog.services.public_eligibility import public_eligibility_q
          target={
              "1005012940786022":"https://s.click.aliexpress.com/e/_c3yCICGf",
              "1005013204172598":"https://s.click.aliexpress.com/e/_c3gNtzPv",
          }
          offers={}
          for pid,link in target.items():
              o=Offer.objects.get(source=Offer.Source.ALIEXPRESS_OWNER,external_product_id=pid)
              assert o.affiliate_url==link and o.is_active and not o.owner_hidden
              assert OfferClick.objects.filter(offer=o).count()==0
              offers[o.pk]=link
              print("CAVITATION_NEW_OFFER_ID="+str(o.pk)+" product="+pid)
          assert len(offers)==2
          visible=OfferFamilyPlacement.objects.filter(
              product_family__slug="cavitacao-rf-vacuum-corpo",
              offer__in=Offer.objects.filter(public_eligibility_q()))
          assert visible.count()==19
          assert visible.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()==19
          assert OfferClick.objects.filter(offer_id=212).count()>=2
          assert Offer.objects.get(pk=212).owner_hidden
          print("CAVITATION_VISIBLE_COUNT_AND_TEST_HISTORY=PASS_19")
          class Cards(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="article":
                      d=dict(attrs)
                      if "data-offer-card" in d and "data-offer-id" in d:
                          self.ids.append(d["data-offer-id"])
          base="https://www.lowcost-europa.eu"
          for prefix in ("","/pt","/es"):
              url=base+prefix+"/products/cavitacao-rf-vacuum-corpo/"
              req=urllib.request.Request(url,headers={"Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=25) as response:
                  assert response.status==200
                  body=response.read(2500000).decode("utf-8")
              cards=Cards()
              cards.feed(body)
              assert len(cards.ids)==19 and len(set(cards.ids))==19,(prefix,len(cards.ids))
              assert all(str(pk) in cards.ids for pk in offers)
              assert "212" not in cards.ids
              assert "data-affiliate-share-button" in body
              assert "data-compare-toggle" in body
              print("CAVITATION_PUBLIC_"+(prefix.strip("/").upper() or "BASE")+"=PASS_19")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**k):return None
          opener=urllib.request.build_opener(NoRedirect)
          for pk,link in offers.items():
              req=urllib.request.Request(base+"/go/"+str(pk)+"/",method="HEAD",
                      headers={"User-Agent":"Mozilla/5.0 (Linux; Android 14) Chrome Mobile"})
              try: response=opener.open(req,timeout=25)
              except urllib.error.HTTPError as e: response=e
              assert response.code==302 and response.headers.get("Location")==link
              assert OfferClick.objects.filter(offer_id=pk).count()==0
              print("CAVITATION_EXACT_AFFILIATE_302=PASS offer="+str(pk))
          print("CAVITATION_THREE_REQUESTED_LINKS_TWO_DISTINCT_ADDED=PASS")
          PYVERIFY
          test "$(sha256sum "$ENVFILE" | awk '{print $1}')" = "$ENV_SHA"
          test "$(gitrepo rev-parse HEAD)" = "$EXPECTED"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          nginx -t >/dev/null 2>&1
          for unit in \
            lowcost-europa.service \
            lowcost-europa-catalog-maintenance.timer \
            lowcost-europa-indexnow.timer \
            lowcost-europa-backup.timer \
            lowcost-europa-offsite-backup.timer \
            lowcost-europa-offsite-backup-health.timer \
            lowcost-europa-affiliate-report.timer \
            lowcost-europa-cavitation-availability.timer; do
              systemctl is-active --quiet "$unit"
          done
          echo CAVITATION_TWO_MANUAL_PRODUCTS_FINAL=PASS_19_OF_20
          trap - EXIT
          REMOTE
