name: Lowcost GitHub VPS alignment and independent HTTP diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-alignment-diagnostic-20261109.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-evidence-20261109
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Gather live PT ES indexing and commercial proof counts without secrets
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          gitrepo() { git -c safe.directory="$ROOT" -C "$ROOT" "$@"; }
          test -d "$ROOT/.git"
          echo DEPLOYED_COMMIT="$(gitrepo rev-parse HEAD)"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          gitrepo fetch --no-tags -q https://github.com/martaxi-boss/lowcost-europa.git main
          echo GITHUB_CURRENT_COMMIT="$(gitrepo rev-parse FETCH_HEAD)"
          echo DIFF_PATHS_START
          gitrepo diff --name-only HEAD FETCH_HEAD
          echo DIFF_PATHS_END
          gitrepo diff --exit-code --quiet HEAD FETCH_HEAD -- apps config deploy requirements manage.py
          echo EXECUTABLE_TREE_ALIGNED=PASS
          systemctl is-active --quiet lowcost-europa.service
          python3 - <<'PYCONFIG'
          import subprocess,json,os,re,hashlib
          from pathlib import Path
          root=Path('/srv/projects/lowcost-europa')
          props={}
          for line in subprocess.check_output(['systemctl','show','lowcost-europa.service','-p','User','-p','WorkingDirectory','-p','MainPID','-p','ActiveState','-p','FragmentPath'],text=True).splitlines():
           k,v=line.split('=',1);props[k]=v
          props['process_cwd_matches']=os.path.realpath('/proc/'+props['MainPID']+'/cwd')==str(root)
          print('APP_RUNTIME='+json.dumps(props,sort_keys=True))
          assert props['WorkingDirectory']==str(root) and props['process_cwd_matches']
          cp=subprocess.run(['nginx','-T'],capture_output=True,text=True)
          assert cp.returncode==0
          conf=cp.stdout
          files=re.findall(r'^# configuration file ([^:]+):$',conf,re.M)
          matches=[]
          expected=root/'deploy/nginx/lowcost-europa.eu.conf'
          for name in files:
           p=Path(name)
           if not p.is_file():continue
           if p.resolve()==expected.resolve():
            matches.append({'path':str(p),'target':str(p.resolve()),'matches_tracked':p.read_bytes()==expected.read_bytes()})
          print('NGINX_LOWCOST_CONFIG='+json.dumps(matches))
          assert matches
          # Print only bounded structural indicators, never complete global config.
          print('NGINX_HOST_DECLARATIONS='+json.dumps([line.strip() for line in conf.splitlines() if re.search(r'^\s*server_name\s+.*lowcost-europa\.eu',line)]))
          print('NGINX_TRANSPORT_FLAGS='+json.dumps({'proxy_protocol_mentions':conf.count('proxy_protocol'),'geoip_mentions':conf.lower().count('geoip'),'limit_req_mentions':conf.count('limit_req'),'ua_google_mentions':len(re.findall('googlebot|inspectiontool',conf,re.I))}))
          print('TRACKED_CONFIG_SHA256='+hashlib.sha256(expected.read_bytes()).hexdigest())
          PYCONFIG
          python3 - <<'PYHTTP'
          import urllib.request,urllib.error,xml.etree.ElementTree as ET,hashlib,json,gzip,socket
          socket.setdefaulttimeout(15)
          class NR(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*a,**kw):return None
          op=urllib.request.build_opener(NR)
          base='https://www.lowcost-europa.eu'
          hashes=set();allurls=[];failures=[]
          profiles=[{}, {'Accept-Language':'pt-PT'}, {'Accept-Language':'es-ES'}, {'Accept-Language':'fr-FR'}, {'Accept-Encoding':'gzip'}, {'User-Agent':'Googlebot'}, {'User-Agent':'Google-InspectionTool'}]
          for headers in profiles:
           req=urllib.request.Request(base+'/sitemap.xml',headers=headers)
           try:
            r=op.open(req,timeout=20);body=r.read(1000000)
            if r.headers.get('Content-Encoding')=='gzip':body=gzip.decompress(body)
            urls=[n.text for n in ET.fromstring(body).iter('{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
            digest=hashlib.sha256(body).hexdigest();hashes.add(digest);allurls=urls
            out={'profile':headers,'status':r.status,'bytes':len(body),'urls':len(urls),'unique':len(set(urls)),'sha256':digest,'location':r.headers.get('Location'),'robots':r.headers.get('X-Robots-Tag')}
            if r.status!=200 or len(urls)!=23 or len(set(urls))!=23:failures.append(out)
            print('MATRIX='+json.dumps(out,sort_keys=True));r.close()
           except Exception as e:failures.append({'profile':headers,'error':type(e).__name__});print('MATRIX_ERROR='+type(e).__name__)
          for url in allurls:
           try:
            r=op.open(urllib.request.Request(url),timeout=20);body=r.read(2000000).decode('utf-8');code=r.status
            import re
            canon=re.findall(r'<link[^>]*rel=["\']canonical["\'][^>]*href=["\']([^"\']+)',body)
            noindex=bool(re.search(r'<meta[^>]*name=["\']robots["\'][^>]*content=["\'][^"\']*noindex',body,re.I))
            out={'url':url,'status':code,'canonical_matches':canon==[url],'noindex':noindex}
            if code!=200 or canon!=[url] or noindex:failures.append(out)
            print('SITEMAP_TARGET='+json.dumps(out));r.close()
           except urllib.error.HTTPError as e:
            out={'url':url,'status':e.code,'location':e.headers.get('Location')};failures.append(out);print('SITEMAP_TARGET='+json.dumps(out))
           except Exception as e:failures.append({'url':url,'error':type(e).__name__})
          print('MATRIX_SUMMARY='+json.dumps({'distinct_xml_hashes':len(hashes),'failures':failures,'tested_urls':len(allurls)}))
          assert len(hashes)==1 and not failures
          PYHTTP
          echo ALIGNMENT_AND_HTTP_AUDIT=PASS
          REMOTE
          echo INDEPENDENT_GITHUB_RUNNER_HTTP_MATRIX_START
          python3 - <<'PYEXTERNAL'
          import urllib.request,urllib.error,xml.etree.ElementTree as ET,hashlib,json,gzip,socket
          socket.setdefaulttimeout(15)
          class NR(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*a,**kw):return None
          op=urllib.request.build_opener(NR)
          base='https://www.lowcost-europa.eu'
          hashes=set();allurls=[];failures=[]
          profiles=[{}, {'Accept-Language':'pt-PT'}, {'Accept-Language':'es-ES'}, {'Accept-Language':'fr-FR'}, {'Accept-Encoding':'gzip'}, {'User-Agent':'Googlebot'}, {'User-Agent':'Google-InspectionTool'}]
          for headers in profiles:
           req=urllib.request.Request(base+'/sitemap.xml',headers=headers)
           try:
            r=op.open(req,timeout=20);body=r.read(1000000)
            if r.headers.get('Content-Encoding')=='gzip':body=gzip.decompress(body)
            urls=[n.text for n in ET.fromstring(body).iter('{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
            digest=hashlib.sha256(body).hexdigest();hashes.add(digest);allurls=urls
            out={'profile':headers,'status':r.status,'bytes':len(body),'urls':len(urls),'unique':len(set(urls)),'sha256':digest,'location':r.headers.get('Location'),'robots':r.headers.get('X-Robots-Tag')}
            if r.status!=200 or len(urls)!=23 or len(set(urls))!=23:failures.append(out)
            print('MATRIX='+json.dumps(out,sort_keys=True));r.close()
           except Exception as e:failures.append({'profile':headers,'error':type(e).__name__});print('MATRIX_ERROR='+type(e).__name__)
          for url in allurls:
           try:
            r=op.open(urllib.request.Request(url),timeout=20);body=r.read(2000000).decode('utf-8');code=r.status
            import re
            canon=re.findall(r'<link[^>]*rel=["\']canonical["\'][^>]*href=["\']([^"\']+)',body)
            noindex=bool(re.search(r'<meta[^>]*name=["\']robots["\'][^>]*content=["\'][^"\']*noindex',body,re.I))
            out={'url':url,'status':code,'canonical_matches':canon==[url],'noindex':noindex}
            if code!=200 or canon!=[url] or noindex:failures.append(out)
            print('SITEMAP_TARGET='+json.dumps(out));r.close()
           except urllib.error.HTTPError as e:
            out={'url':url,'status':e.code,'location':e.headers.get('Location')};failures.append(out);print('SITEMAP_TARGET='+json.dumps(out))
           except Exception as e:failures.append({'url':url,'error':type(e).__name__})
          print('MATRIX_SUMMARY='+json.dumps({'distinct_xml_hashes':len(hashes),'failures':failures,'tested_urls':len(allurls)}))
          assert len(hashes)==1 and not failures
          PYEXTERNAL
          echo INDEPENDENT_GITHUB_RUNNER_HTTP_MATRIX=PASS
