name: Lowcost microdermo fourteen manual links production postcheck 20261113
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-microdermo-14-links-postcheck-20261113.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify live site serves fourteen exact owner-controlled links
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          cd "$ROOT"
          test "$(git -c safe.directory="$ROOT" rev-parse HEAD)" = '4c6e75e566dcf317624285fe4f92d5cbdd6ec2dc'
          test -z "$(git -c safe.directory="$ROOT" status --porcelain=v1 --untracked-files=no)"
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-cavitation-availability.timer
          nginx -t >/dev/null 2>&1
          set -a
          . "$ROOT/private/systemd-env/lowcost-europa.env"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u le001_1789265592 -- .venv/bin/python - <<'PY'
          import django
          django.setup()
          from django.test import Client
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement
          from apps.catalog.services.manual_storefront import MANUAL_ONLY_FAMILY_SLUGS
          from apps.catalog.services.public_eligibility import public_eligibility_q
          from urllib.request import Request,urlopen
          slug='hydrodermoabrasao-aqua-facial-multifuncoes'
          qs=OfferFamilyPlacement.objects.filter(product_family__slug=slug).select_related('offer')
          rows=list(qs)
          assert len(rows)==14
          assert all(p.offer.source==Offer.Source.ALIEXPRESS_OWNER for p in rows)
          assert qs.filter(public_eligibility_q(prefix='offer__')).count()==14
          old=OfferClick.objects.count()
          with urlopen(Request('https://www.lowcost-europa.eu/products/'+slug+'/',headers={'User-Agent':'LowcostEuropaReadback/1.0'}),timeout=20) as response:
            assert response.status==200
            page=response.read(1500000).decode('utf-8','replace')
          for p in rows:
            assert p.offer.affiliate_url in page,'Owner link not visible in public HTML'
          assert page.count('data-affiliate-original-url=')>=14
          client=Client()
          for p in rows:
            resp=client.head('/go/'+str(p.offer_id)+'/',secure=True,HTTP_HOST='www.lowcost-europa.eu')
            assert resp.status_code==302 and resp['Location']==p.offer.affiliate_url
          assert OfferClick.objects.count()==old
          print('MICRODERMO_LIVE_14_OWNER_LINKS_IN_PUBLIC_HTML=PASS')
          print('MICRODERMO_HEAD_14_EXACT_REDIRECTS_NO_CLICKS=PASS')
          print('MICRODERMO_PUBLIC_ELIGIBLE_14_OF_14=PASS')
          print('MICRODERMO_CATEGORY_TWO_COUNT=14')
          print('MICRODERMO_ALL_FAMILY_PLACEMENTS='+str(OfferFamilyPlacement.objects.filter(product_family__slug__in=MANUAL_ONLY_FAMILY_SLUGS).count()))
          PY
          echo MICRODERMO_VERIFIED_GITHUB_VPS_AND_PUBLIC_SITE=PASS
          REMOTE
