name: Final mission Lowcost external closeout - independent readback and bounded ES observations
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-final-mission-postflight-20261109.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-evidence-20261109
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Gather live PT ES indexing and commercial proof counts without secrets
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          OLD=8d1752c0f3dee38fc3dc3c8f0bd1c067d5f2f858
          NEW=381c34adcff8f26fab3e60a86979c488e73a680f
          TASK="$ROOT/private/ops/final-mission-20261109-final2"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$OLD"
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          test -f "$TASK/es-collection-completed"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = "$NEW"
          sh "$ROOT/deploy/scripts/backup-postgres.sh"
          BACKUP="$(find "$ROOT/backups/daily" -maxdepth 1 -type f -name '*.dump' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$BACKUP" && test -s "$BACKUP" && test -s "$BACKUP.sha256"
          (cd "$ROOT/backups/daily" && sha256sum -c "$(basename "$BACKUP.sha256")" >/dev/null)
          echo FINAL_ES_DATA_BACKUP=PASS
          git -c safe.directory="$ROOT" -C "$ROOT" fetch -q https://github.com/martaxi-boss/lowcost-europa.git main
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse FETCH_HEAD)" = "$NEW"
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" diff --name-only "$OLD" "$NEW")" = PROJECT_STATE.md
          printf '%s\n' "$OLD" > "$TASK/before-documentation-sync-sha"
          umask 022
          git -c safe.directory="$ROOT" -C "$ROOT" checkout --detach -q "$NEW"
          umask 077
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" diff --name-only "$OLD" "$NEW" -- apps config deploy requirements)"
          for unit in lowcost-europa.service lowcost-europa-indexnow.timer lowcost-europa-catalog-maintenance.timer lowcost-europa-backup.timer lowcost-europa-affiliate-report.timer lowcost-europa-offsite-backup.timer lowcost-europa-offsite-backup-health.timer; do systemctl is-active --quiet "$unit"; done
          nginx -t >/dev/null 2>&1
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          cd "$ROOT"
          set -a
          . "$ROOT/private/systemd-env/lowcost-europa.env"
          set +a
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PY'
          import os,json,hashlib,io,urllib.request,urllib.error,xml.etree.ElementTree as ET
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings.production')
          import django
          django.setup()
          from django.core.management import call_command
          from django.utils import timezone
          from apps.catalog.models import OfferObservation,ExternalMetricsSnapshot
          from apps.catalog.services.commercial_evidence import owner_commercial_evidence_rows
          from pathlib import Path
          es=OfferObservation.objects.filter(destination_country='ES')
          print('FINAL_ES_OBSERVATIONS='+str(es.count()))
          print('FINAL_ES_DISTINCT_OFFERS='+str(es.values('offer_id').distinct().count()))
          print('FINAL_ES_POSITIVE_EUR_OBSERVATIONS='+str(es.filter(price__gt=0,currency__iexact='EUR').count()))
          print('FINAL_ES_NULL_PRICE_OBSERVATIONS='+str(es.filter(price__isnull=True).count()))
          print('FINAL_ES_NUMERIC_DELIVERY='+str(es.filter(delivery_days__isnull=False).count()))
          print('FINAL_ES_AVAILABLE_SIGNALS='+str(es.filter(availability='AVAILABLE').count()))
          print('FINAL_ES_OWNER_PRICE_ROWS='+str(sum(row.price is not None for row in owner_commercial_evidence_rows(country='ES'))))
          call_command('sync_google_search_console',dry_run=True)
          print('FINAL_GSC_SNAPSHOTS='+str(ExternalMetricsSnapshot.objects.filter(source='GOOGLE_SEARCH_CONSOLE').count()))
          base='https://www.lowcost-europa.eu'
          for path in ['/','/pt/','/es/','/robots.txt','/sitemap.xml']:
           with urllib.request.urlopen(base+path,timeout=20) as r:
            body=r.read();assert r.status==200
           if path=='/sitemap.xml':assert len(list(ET.fromstring(body).iter('{http://www.sitemaps.org/schemas/sitemap/0.9}loc')))==23
          print('FINAL_HTTP_AND_SITEMAP=PASS')
          accepted=Path('.indexnow/accepted.json');digest=hashlib.sha256(accepted.read_bytes()).hexdigest()
          print('FINAL_INDEXNOW_ACCEPTED='+str(len(json.loads(accepted.read_text()))))
          out=io.StringIO();call_command('notify_indexnow',dry_run=True,stdout=out);print(out.getvalue().strip())
          assert digest==hashlib.sha256(accepted.read_bytes()).hexdigest()
          print('FINAL_INDEXNOW_NO_RESUBMISSION=PASS')
          PY
          test "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" = "$NEW"
          test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"
          echo "FINAL_GITHUB_VPS_SHA=$NEW"
          echo FINAL_DOCUMENTATION_ONLY_SYNC_NO_RESTART=PASS
          echo FINAL_RUNTIME_READBACK=PASS
          REMOTE

