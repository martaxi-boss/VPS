name: Lowcost publish five unique owner microdermo links 20261113
on:
  push:
    paths: [.github/workflows/lowcost-microdermo-owner-manual-seven-20261113.yml]
permissions: {contents: read}
jobs:
  add:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Pinned SSH guarded publish five new unique Owner affiliate links
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -euo pipefail
          cd /srv/projects/lowcost-europa
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = '4c6e75e566dcf317624285fe4f92d5cbdd6ec2dc'
          systemctl is-active --quiet lowcost-europa.service
          sh deploy/scripts/backup-postgres.sh
          BACKUP="$(find backups/daily -maxdepth 1 -type f -name 'lowcost-europa-*.dump' -printf '%T@ %p\\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -s "$BACKUP" && test -s "$BACKUP.sha256"
          (cd backups/daily && sha256sum -c "$(basename "$BACKUP.sha256")" >/dev/null)
          echo MICRODERMO_BACKUP_VERIFIED=PASS
          set -a
          . private/systemd-env/lowcost-europa.env
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u le001_1789265592 -- .venv/bin/python - <<'PY'
          import django
          django.setup()
          from io import StringIO
          from django.core.management import call_command
          from django.db import transaction
          from django.test import Client
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement,ProductFamily
          from apps.catalog.services.manual_storefront import MANUAL_ONLY_FAMILY_SLUGS
          from apps.catalog.services.public_eligibility import public_eligibility_q
          urls=["https://s.click.aliexpress.com/e/_c4P5jWTZ","https://s.click.aliexpress.com/e/_c2uT3m6r","https://s.click.aliexpress.com/e/_c43RKiSf","https://s.click.aliexpress.com/e/_c4l6vclH","https://s.click.aliexpress.com/e/_c3DVjsYx","https://s.click.aliexpress.com/e/_c32VRUnv","https://s.click.aliexpress.com/e/_c341cEPZ"]
          accepted=[(i,urls[i-1]) for i in (1,3,4,6,7)]
          slug='hydrodermoabrasao-aqua-facial-multifuncoes'
          family=ProductFamily.objects.get(slug=slug)
          def snapshot(family_slug):
              return set((p.offer_id,p.offer.affiliate_url,p.offer.source,p.offer.external_product_id)
                for p in OfferFamilyPlacement.objects.filter(product_family__slug=family_slug).select_related('offer'))
          before={s:snapshot(s) for s in MANUAL_ONLY_FAMILY_SLUGS}
          assert len(before[slug])==9
          assert all(x[2]==Offer.Source.ALIEXPRESS_OWNER for x in before[slug])
          original_clicks=OfferClick.objects.count()
          with transaction.atomic():
              for i,url in accepted:
                  output=StringIO()
                  call_command('publish_owner_affiliate_link',url,family=slug,stdout=output)
                  result=output.getvalue()
                  assert 'OWNER_MANUAL_AFFILIATE_PUBLISHED=PASS' in result
                  assert 'new_placement=TRUE' in result
                  print('MICRODERMO_LINK_'+str(i)+'=PUBLISHED_FROM_OWNER_URL')
              after=snapshot(slug)
              assert len(after)==14
              assert before[slug].issubset(after)
              assert {x[1] for x in after}-{x[1] for x in before[slug]}=={u for _,u in accepted}
              assert all(x[2]==Offer.Source.ALIEXPRESS_OWNER for x in after)
              assert OfferFamilyPlacement.objects.filter(product_family=family).filter(
                  public_eligibility_q(prefix='offer__')).count()==14
              for s in MANUAL_ONLY_FAMILY_SLUGS:
                  if s!=slug:
                      assert snapshot(s)==before[s],s
              print('MICRODERMO_TRANSACTION_CHECKS=PASS')
          client=Client()
          for i,url in accepted:
              offer=Offer.objects.get(source=Offer.Source.ALIEXPRESS_OWNER,affiliate_url=url)
              response=client.head('/go/'+str(offer.pk)+'/',secure=True,
                                   HTTP_HOST='www.lowcost-europa.eu')
              assert response.status_code==302,(i,response.status_code)
              assert response['Location']==url
          assert snapshot(slug)==after
          assert OfferClick.objects.count()>=original_clicks
          print('MICRODERMO_FIVE_OWNER_REDIRECTS_EXACT=PASS')
          print('MICRODERMO_EXISTING_NINE_UNCHANGED=PASS')
          print('MICRODERMO_OTHER_FOUR_CATEGORIES_UNCHANGED=PASS')
          print('MICRODERMO_CATEGORY_TWO_FINAL_COUNT='+str(len(after)))
          print('MICRODERMO_TOTAL_FIVE_CATEGORIES='+str(sum(len(snapshot(s)) for s in MANUAL_ONLY_FAMILY_SLUGS)))
          print('MICRODERMO_MANUAL_LINK_PUBLISH=PASS')
          PY
          curl -fsS --max-time 20 'https://www.lowcost-europa.eu/products/hydrodermoabrasao-aqua-facial-multifuncoes/' -o /dev/null
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-cavitation-availability.timer
          echo MICRODERMO_PUBLIC_PAGE_HTTP_200=PASS
          REMOTE
