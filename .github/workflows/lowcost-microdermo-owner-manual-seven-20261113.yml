name: Verify seven owner links against existing microdermo products 20261113
on:
  push:
    paths: [.github/workflows/lowcost-microdermo-owner-manual-seven-20261113.yml]
permissions: {contents: read}
jobs:
  add:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Pinned SSH read-only check for owner link duplicate identities
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -euo pipefail
          cd /srv/projects/lowcost-europa
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = '4c6e75e566dcf317624285fe4f92d5cbdd6ec2dc'
          systemctl is-active --quiet lowcost-europa.service
          true # Read-only identification, no backup or DB mutation
          set -a
          . private/systemd-env/lowcost-europa.env
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u le001_1789265592 -- .venv/bin/python - <<'PY'
          import django
          django.setup()
          from apps.catalog.models import Offer,OfferFamilyPlacement,ProductFamily
          from apps.catalog.services.manual_candidate_intake import resolve_aliexpress_product_url,ManualCandidateIntakeError
          urls=["https://s.click.aliexpress.com/e/_c4P5jWTZ","https://s.click.aliexpress.com/e/_c2uT3m6r","https://s.click.aliexpress.com/e/_c43RKiSf","https://s.click.aliexpress.com/e/_c4l6vclH","https://s.click.aliexpress.com/e/_c3DVjsYx","https://s.click.aliexpress.com/e/_c32VRUnv","https://s.click.aliexpress.com/e/_c341cEPZ"]
          slug='hydrodermoabrasao-aqua-facial-multifuncoes'
          family=ProductFamily.objects.get(slug=slug)
          count=OfferFamilyPlacement.objects.filter(product_family=family).count()
          assert count==9
          print('CATEGORY_2_EXISTING_PLACEMENTS='+str(count))
          seen=set()
          unique_new=0
          conflicts=0
          failed=0
          for i,url in enumerate(urls,1):
              try:
                  product_id,canonical=resolve_aliexpress_product_url(url)
              except ManualCandidateIntakeError as exc:
                  print('OWNER_LINK_'+str(i)+'=RESOLVE_FAILED')
                  failed+=1
                  continue
              if product_id in seen:
                  print('OWNER_LINK_'+str(i)+'=DUPLICATE_WITHIN_SEVEN')
                  conflicts+=1
                  continue
              seen.add(product_id)
              offer=Offer.objects.filter(source=Offer.Source.ALIEXPRESS_OWNER,external_product_id=product_id).first()
              if offer and offer.affiliate_url!=url:
                  status='DUPLICATE_EXISTING_CATEGORY_2' if OfferFamilyPlacement.objects.filter(product_family=family,offer=offer).exists() else 'DUPLICATE_OTHER_CATEGORY'
                  print('OWNER_LINK_'+str(i)+'='+status)
                  conflicts+=1
              elif offer and OfferFamilyPlacement.objects.filter(product_family=family,offer=offer).exists():
                  print('OWNER_LINK_'+str(i)+'=ALREADY_IN_CATEGORY')
                  conflicts+=1
              else:
                  print('OWNER_LINK_'+str(i)+'=NEW_ELIGIBLE_PRODUCT_ID')
                  unique_new+=1
          print('OWNER_LINKS_NEW_POSSIBLE='+str(unique_new))
          print('OWNER_LINKS_CONFLICTS='+str(conflicts))
          print('OWNER_LINKS_RESOLUTION_ERRORS='+str(failed))
          assert OfferFamilyPlacement.objects.filter(product_family=family).count()==9
          print('OWNER_SEVEN_LINK_IDENTIFICATION_READ_ONLY=PASS')
          PY
          REMOTE
