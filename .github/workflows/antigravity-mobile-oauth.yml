name: Google Antigravity mobile OAuth (Owner-only)

# Auth links/codes never appear in public GitHub Issues or runner logs.
# The only outbound delivery is a private Telegram notification.
# Telegram messages are NOT accepted as agent orders or as auth input.
on:
  issues:
    types: [opened]
  pull_request:
    paths:
      - '.github/workflows/antigravity-mobile-oauth.yml'
      - 'ops/antigravity_auth_capture.py'
      - 'ops/tests/test_antigravity_auth_capture.py'

permissions: {}

concurrency:
  group: antigravity-mobile-oauth-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python3 -m py_compile ops/antigravity_auth_capture.py
          python3 -m unittest discover -s ops/tests -p test_antigravity_auth_capture.py -v

  start:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[agent setup] antigravity oauth start'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Prepare private notification and SSH access
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS" && test -n "$TELEGRAM_BOT_TOKEN" && test -n "$TELEGRAM_CHAT_ID" || {
            echo 'OAUTH_SETUP=missing existing private channel or SSH'; exit 2;
          }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Start isolated login on VPS and send only privately to the Owner
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          remote='ubuntu@146.59.145.3'
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$remote" 'bash -se' <<'REMOTE'
          umask 077
          cli="$HOME/.local/bin/agy"
          test -x "$cli"
          command -v tmux >/dev/null
          if tmux -L agy-oauth has-session -t login 2>/dev/null; then
            echo 'OAUTH_SESSION_ALREADY_ACTIVE'
            exit 8
          fi
          # Distinct tmux socket; automatic expiry. Never invokes a model.
          tmux -L agy-oauth new-session -d -s login -x 512 -y 42 \
            "cd \"$HOME\" && env SSH_CONNECTION='127.0.0.1 40000 127.0.0.1 22' TZ=UTC timeout 1800s \"$cli\""
          echo 'OAUTH_SESSION_STARTED'
          REMOTE

          url=''
          for i in $(seq 1 40); do
            if url="$(sshpass -e ssh -T -o StrictHostKeyChecking=accept-new \
                      -o ConnectTimeout=12 "$remote" \
                      'tmux -L agy-oauth capture-pane -J -p -t login -S -200' 2>/dev/null \
                      | python3 ops/antigravity_auth_capture.py 2>/dev/null)"; then
              break
            fi
            sleep 1
          done
          if test -z "$url"; then
            echo 'OAUTH_LINK_NOT_READY; nothing was published or sent'
            exit 9
          fi
          export AGY_AUTH_URL="$url"
          python3 - <<'PY'
          import json, os, sys, urllib.request
          url = os.environ["AGY_AUTH_URL"]
          msg = (
              "Antigravity na VPS: abre este link no Chrome e entra com a tua conta Google.\n\n"
              + url
              + "\n\nQuando a Google mostrar o código de autorização, não respondas ao Telegram. "
                "No GitHub, abre Settings > Secrets and variables > Actions e cria "
                "o segredo AGY_AUTH_CODE com esse código. Depois diz 'já está' ao ChatGPT. "
                "A sessão de login expira em 30 minutos."
          )
          if len(msg) > 4000:
              raise SystemExit("OAuth link too long for private message")
          payload = json.dumps({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": msg,
              "disable_web_page_preview": True,
          }).encode("utf-8")
          req = urllib.request.Request(
              "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage",
              data=payload, headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  ok = json.load(response).get("ok")
              if ok is not True:
                  raise RuntimeError("Telegram did not accept the private notification")
          except Exception as exc:
              print("OAUTH_PRIVATE_DELIVERY_FAILED=" + type(exc).__name__, file=sys.stderr)
              raise SystemExit(5)
          print("OAUTH_LINK_SENT_PRIVATELY_TO_TELEGRAM")
          PY
          unset url AGY_AUTH_URL
          echo 'OAuth link delivered privately; no Google code received yet.' > "$RUNNER_TEMP/agy-auth-start.txt"
      - name: Publish sanitized delivery status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NO: ${{ github.event.issue.number }}
        run: |
          if test -s "$RUNNER_TEMP/agy-auth-start.txt"; then
            gh issue comment "$ISSUE_NO" --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/agy-auth-start.txt"
          else
            gh issue comment "$ISSUE_NO" --repo "$GITHUB_REPOSITORY" \
              --body 'OAuth link delivery NOT CONFIRMED. No sign-in URL or code was published.'
          fi

  finish:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.title == '[agent setup] antigravity oauth finish'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check private authorization code and SSH
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          AGY_AUTH_CODE: ${{ secrets.AGY_AUTH_CODE }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS" && test -n "$AGY_AUTH_CODE" || {
            echo 'AGY_OAUTH_FINISH=missing secret or SSH credential'; exit 2;
          }
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Type one-time code into existing private Antigravity login session
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          AGY_AUTH_CODE: ${{ secrets.AGY_AUTH_CODE }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$AGY_AUTH_CODE" | sshpass -e ssh -T \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            ubuntu@146.59.145.3 '
              set -eu
              IFS= read -r code || exit 11
              test "${#code}" -ge 6 && test "${#code}" -le 2048 || exit 12
              tmux -L agy-oauth has-session -t login >/dev/null 2>&1 || exit 13
              tmux -L agy-oauth send-keys -l -t login -- "$code"
              tmux -L agy-oauth send-keys -t login Enter
              unset code
              echo "OAUTH_CODE_DELIVERED_TO_PRIVATE_TERMINAL"
            '
          echo 'Google authorization code entered into the private VPS login session. Session validity must be confirmed separately.' > "$RUNNER_TEMP/agy-auth-finish.txt"
      - name: Report code delivery without disclosing the code
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NO: ${{ github.event.issue.number }}
        run: |
          if test -s "$RUNNER_TEMP/agy-auth-finish.txt"; then
            gh issue comment "$ISSUE_NO" --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/agy-auth-finish.txt"
          else
            gh issue comment "$ISSUE_NO" --repo "$GITHUB_REPOSITORY" \
              --body 'Google code was NOT delivered. Verify the secret and active 30-minute session.'
          fi
