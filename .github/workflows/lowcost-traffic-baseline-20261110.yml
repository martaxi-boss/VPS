name: Lowcost traffic baseline read-only 20261110
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-traffic-baseline-20261110.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-traffic-baseline-private
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Pinned SSH read-only existing local metrics and exit counts
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          test -d "$ROOT/.git" && test -s "$ENVFILE" && test ! -L "$ENVFILE"
          test "$(systemctl show lowcost-europa.service -p User --value)" = "le001_1789265592"
          systemctl is-active --quiet lowcost-europa.service
          echo "LOWCOST_PROD_SHA=$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)"
          if test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"; then echo LOWCOST_PROD_CLEAN=PASS; else echo LOWCOST_PROD_CLEAN=FAIL; fi
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u le001_1789265592 -- "$ROOT/.venv/bin/python" - <<'PY'
          import django
          from datetime import date, datetime, time, timedelta
          from zoneinfo import ZoneInfo
          django.setup()
          from apps.catalog.models import Offer, OfferClick
          from apps.catalog.services.search_referral_metrics import read_private_report
          from pathlib import Path
          z = ZoneInfo("Europe/Lisbon")
          for day in (date(2026,11,9), date(2026,11,10)):
              start = datetime.combine(day, time.min, tzinfo=z)
              end = start + timedelta(days=1)
              rows = OfferClick.objects.filter(clicked_at__gte=start, clicked_at__lt=end)
              print("RAW_GO_CLICKS_"+day.isoformat()+"="+str(rows.count()))
              print("OWNER_AFFILIATE_CLICKS_"+day.isoformat()+"="+str(rows.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()))
          rpt=read_private_report(Path("/srv/projects/lowcost-europa/.local-metrics/search-referrers.json"))
          if rpt is None:
              print("SEARCH_LOCAL_REPORT=UNAVAILABLE_OR_STALE")
          else:
              print("SEARCH_LOCAL_REPORT=PASS total="+str(rpt["total"])+" checked="+rpt["checked_at"].isoformat())
              print("META_LOCAL_REPORT="+("PRESENT" if rpt.get("meta") else "NOT_YET_DEPLOYED"))
          PY
          echo LOWCOST_LOCAL_AUDIT_READONLY=PASS
          REMOTE
