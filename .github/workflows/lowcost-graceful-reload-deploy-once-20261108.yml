name: Lowcost final documentation alignment and IndexNow readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-graceful-reload-deploy-once-20261108.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Align only documentation without restarting and inspect deduplication
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          OLD=4f59453306aeebbc37849f9face098f8a2133c50
          NEW=d29acbdf01e1b70ad37b0921bcd0211956094c02
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)" == "$OLD" ]]
          [[ -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          git -c safe.directory="$ROOT" -C "$ROOT" fetch -q https://github.com/martaxi-boss/lowcost-europa.git main
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse FETCH_HEAD)" == "$NEW" ]]
          [[ "$(git -c safe.directory="$ROOT" -C "$ROOT" diff --name-only "$OLD" "$NEW" | sort)" == "$(printf '%s\n' PROJECT_STATE.md docs/operations/international-search-20261108.md | sort)" ]]
          umask 022
          git -c safe.directory="$ROOT" -C "$ROOT" checkout --detach -q "$NEW"
          cmp -s /etc/systemd/system/lowcost-europa.service "$ROOT/deploy/systemd/lowcost-europa.service"
          [[ "$(systemctl show lowcost-europa.service -p CanReload --value)" == yes ]]
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-indexnow.timer
          STATEHASH="$(sha256sum "$ROOT/.indexnow/accepted.json" | cut -d' ' -f1)"
          systemd-run --quiet --wait --pipe --collect --unit=lowcost-indexnow-dryrun-20261108-1346 --property=User=le001_1789265592 --property=WorkingDirectory="$ROOT" --property=EnvironmentFile="$ROOT/private/systemd-env/lowcost-europa.env" "$ROOT/.venv/bin/python" manage.py notify_indexnow --dry-run
          [[ "$(sha256sum "$ROOT/.indexnow/accepted.json" | cut -d' ' -f1)" == "$STATEHASH" ]]
          nginx -t >/dev/null 2>&1
          echo LOWCOST_FINAL_ALIGNMENT=PASS
          echo INDEXNOW_ACCEPTED_STATE=UNCHANGED
          echo "LOWCOST_FINAL_SHA=$NEW"
          REMOTE
