name: Lowcost indexing - read-only transport and deduplication diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-indexing-readonly-20261109.yml']
permissions:
  contents: read
concurrency:
  group: lowcost-evidence-20261109
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Gather live PT ES indexing and commercial proof counts without secrets
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          test -d "$ROOT/.git"
          systemctl is-active --quiet lowcost-europa.service
          git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD
          python3 - <<'PY'
          import json,re,gzip,socket,ssl,urllib.request,urllib.error,hashlib,xml.etree.ElementTree as ET
          from pathlib import Path
          from collections import Counter
          socket.setdefaulttimeout(5)
          base='https://www.lowcost-europa.eu'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*a,**kw): return None
          op=urllib.request.build_opener(NoRedirect)
          for path in ['/sitemap.xml','/robots.txt']:
           for method in ['HEAD','GET']:
            for ua in ['Lowcost-Sitemap-Diagnostic/2.0','Googlebot']:
             req=urllib.request.Request(base+path,method=method,headers={'User-Agent':ua})
             try: r=op.open(req,timeout=20)
             except urllib.error.HTTPError as e:r=e
             body=r.read(1000000)
             result={'path':path,'method':method,'ua':ua,'status':r.code,'headers':{k:r.headers.get(k) for k in ['Content-Type','Content-Length','Content-Encoding','Location','X-Robots-Tag','Vary','Cache-Control']}}
             if method=='GET':
              result.update(bytes=len(body),sha256=hashlib.sha256(body).hexdigest())
              if path=='/sitemap.xml':
               root=ET.fromstring(body);urls=[x.text for x in root.iter('{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
               result.update(root=root.tag,urls=len(urls),unique=len(set(urls)),all_canonical=all(u.startswith(base+'/') for u in urls))
              else:result['robots']=body.decode()
             print('PUBLIC_FETCH='+json.dumps(result,sort_keys=True));r.close()
          host='www.lowcost-europa.eu'
          print('DNS_FAMILIES='+json.dumps(sorted(set(x[0] for x in socket.getaddrinfo(host,443)))))
          with socket.create_connection((host,443),timeout=10) as sock:
           with ssl.create_default_context().wrap_socket(sock,server_hostname=host) as ss:
            cert=ss.getpeercert()
            print('TLS='+json.dumps({'verified':True,'version':ss.version(),'expires':cert.get('notAfter'),'subjectAltName':cert.get('subjectAltName')}))
          # Error logs are explicitly host scoped; never print raw lines/IPs/requests.
          errors=Counter();last=None
          for p in [Path('/var/log/nginx/error.log'),Path('/var/log/nginx/error.log.1')]:
           if not p.exists():continue
           with p.open('rb') as f:
            f.seek(max(0,p.stat().st_size-10000000));lines=f.read().decode(errors='replace').splitlines()
           for line in lines:
            if not re.search(r'(?:host: "(?:www\.)?lowcost-europa\.eu"|server: (?:www\.)?lowcost-europa\.eu[, ])',line):continue
            if 'sitemap' not in line and 'robots.txt' not in line:continue
            m=re.match(r'(\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2})',line)
            if not m or m.group(1)<'2026/11/07':continue
            last=m.group(1)
            kind='timeout' if 'timed out' in line else 'upstream_connect' if 'connect() failed' in line else 'permission' if 'Permission denied' in line else 'other'
            errors[kind]+=1
          print('HOST_SCOPED_SITEMAP_ROBOTS_ERRORS='+json.dumps({'counts':dict(errors),'last':last,'scope':'current and previous uncompressed logs, last 10MB each, since Nov7'}))
          # Combined access logs lack Host: report candidates only, never claim host attribution.
          rx=re.compile(r'^(\S+) \S+ \S+ \[([^\]]+)\] "(GET|HEAD) (/sitemap\.xml|/robots\.txt)(?:\?[^ ]*)? HTTP/[^"]+" (\d+) (\S+) "[^"]*" "([^"]*)"')
          candidates=[];counts=Counter()
          for p in [Path('/var/log/nginx/access.log'),Path('/var/log/nginx/access.log.1')]:
           if not p.exists():continue
           with p.open('rb') as f:
            f.seek(max(0,p.stat().st_size-10000000));lines=f.read().decode(errors='replace').splitlines()
           for line in lines:
            m=rx.match(line)
            if not m:continue
            ip,stamp,method,path,status,size,ua=m.groups()
            if '/Nov/2026:' not in stamp:continue
            if 'Googlebot' not in ua and 'Google-InspectionTool' not in ua:continue
            kind='inspector' if 'Google-InspectionTool' in ua else 'claimed_googlebot'
            counts[(kind,path,status)]+=1
            candidates.append((ip,stamp,path,status,size,kind))
          verified={}
          for ip in list(dict.fromkeys(x[0] for x in candidates))[-12:]:
           try:
            name=socket.gethostbyaddr(ip)[0].lower().rstrip('.')
            suffix=next((s for s in ['.googlebot.com','.google.com','.googleusercontent.com'] if name.endswith(s)),None)
            forward={x[4][0] for x in socket.getaddrinfo(name,None)}
            verified[ip]=bool(suffix and ip in forward)
           except Exception: verified[ip]=False
          print('SHARED_LOG_CANDIDATE_COUNTS='+json.dumps([{'kind':k[0],'path':k[1],'status':k[2],'count':v} for k,v in counts.items()]))
          print('VERIFIED_GOOGLE_CANDIDATE_RECENT='+json.dumps([{'time':s,'path':p,'status':st,'bytes':b,'kind':k,'dns_verified':verified.get(ip)} for ip,s,p,st,b,k in candidates[-20:]]))
          print('ACCESS_LOG_LIMITATION=Shared combined log has no Host; candidate requests cannot establish which vhost answered.')
          print('READ_ONLY_DIAGNOSIS=COMPLETE')
          PY
          systemctl is-active --quiet lowcost-europa.service
          echo NO_SITE_CONFIG_OR_DATABASE_CHANGES=PASS
          REMOTE
