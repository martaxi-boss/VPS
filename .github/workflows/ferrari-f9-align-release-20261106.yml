name: Ferrari F9 align protected release GitHub to Ubuntu VPS
# One-time explicit Ferrari-only release validation and rollback-guarded activation.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ferrari-f9-align-release-20261106.yml'
permissions:
  contents: read
concurrency:
  group: ferrari-f9-guarded-release-align
  cancel-in-progress: false
jobs:
  ferrari-only-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout immutable Ferrari main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 0b50e1d403deff8f3ccb421edd0b41c397d66b9b
          persist-credentials: false
          path: ferrari
      - name: Verify protected Ferrari-only release script
        run: |
          set -Eeuo pipefail
          bash -n ferrari/install/vps-isolated-release.sh
          python3 -m py_compile ferrari/engine/tool_runtime.py
          test -f ferrari/engine/skill_job.py
          test -f ferrari/engine/tool_actions.json
          echo F9_RELEASE_IMMUTABLE_SOURCE=PASS
      - name: Reuse existing pinned VPS SSH host
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS" || exit 2
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/f9-known-hosts"
          chmod 600 "$RUNNER_TEMP/f9-known-hosts"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/f9-known-hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' || exit 3
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          echo F9_EXISTING_PINNED_SSH=PASS
      - name: Certify before switching then activate exactly Ferrari main SHA with rollback
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes
                -o "UserKnownHostsFile=$RUNNER_TEMP/f9-known-hosts"
                -o GlobalKnownHostsFile=/dev/null
                -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          root=/srv/projects/skill-universal
          script="$root/.runtime/f9-release-align-$GITHUB_RUN_ID.sh"
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 \
            'test -d /srv/projects/skill-universal/.runtime && test ! -L /srv/projects/skill-universal'
          sshpass -e scp "${opts[@]}" ferrari/install/vps-isolated-release.sh \
            "ubuntu@146.59.145.3:$script"
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 'bash -s' -- "$GITHUB_RUN_ID" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ulimit -c 0
          root=/srv/projects/skill-universal
          sha=0b50e1d403deff8f3ccb421edd0b41c397d66b9b
          run="$1"
          [[ "$run" =~ ^[0-9]+$ ]] || exit 4
          script="$root/.runtime/f9-release-align-$run.sh"
          trap 'rm -f -- "$script"' EXIT
          test "$(id -un)" = ubuntu && test "$(id -u)" -ne 0
          test -f "$script" && test ! -L "$script"
          previous="$root/releases/f1f3b03525adec7018d7d629243e7b0fbb7f5087"
          test "$(readlink -f "$root/current")" = "$previous" || { echo F9_RELEASE_MOVED_NO_SWITCH; exit 5; }
          for pkg in yt-dlp librecad qgis audacity obs-studio solvespace synfigstudio openshot-qt; do
            test "$(dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null)" = 'install ok installed' ||
              { echo "F9_PRE_APT_CHANGED:$pkg"; exit 6; }
          done
          services=(pink-iptv-backend pink-vpn fadego-staging lowcost-europa
                    pm2-iptvpn-bot pm2-telegram-robot-leads nginx postgresql@16-main)
          for s in "${services[@]}"; do
            test "$(systemctl is-active "$s")" = active || { echo "F9_PRE_SERVICE_FAILED:$s"; exit 7; }
          done
          echo F9_RELEASE_BEFORE="$previous"
          df -h "$root"
          bash "$script" "$sha" --check
          test "$(readlink -f "$root/current")" = "$previous" || { echo F9_PRECHECK_MUTATED_RELEASE; exit 8; }
          echo F9_RELEASE_PRE_ACTIVATION_TEST=PASS
          bash "$script" "$sha" --activate
          test "$(readlink -f "$root/current")" = "$root/releases/$sha" ||
            { echo F9_RELEASE_ACTIVATION_READBACK_MISMATCH; exit 9; }
          for s in "${services[@]}"; do
            test "$(systemctl is-active "$s")" = active || { echo "F9_POST_SERVICE_FAILED:$s"; exit 10; }
          done
          for pkg in yt-dlp librecad qgis audacity obs-studio solvespace synfigstudio openshot-qt; do
            test "$(dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null)" = 'install ok installed' ||
              { echo "F9_POST_APT_CHANGED:$pkg"; exit 11; }
          done
          python3 "$root/current/install/vps-phase9-private-solvespace-resources.py" --check
          python3 "$root/current/install/vps-phase9-private-qgis-conda.py" --check
          python3 "$root/current/install/vps-phase9-private-obs24.py" --check
          echo F9_RELEASE_FERRARI_MAIN_ALIGNED="$sha"
          echo F9_RELEASE_GLOBAL_APT_PRESERVED=PASS
          echo F9_RELEASE_PROTECTED_SERVICES=8_OF_8_PASS
          df -h "$root"
          REMOTE
