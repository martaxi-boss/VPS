name: Lowcost microdermo two owner affiliate URLs read-only preflight 20261113
on:
  push:
    branches: [main]
    paths: [.github/workflows/lowcost-microdermo-two-owner-links-20261113.yml]
permissions:
  contents: read
concurrency:
  group: lowcost-prod-automation-controls
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Pinned SSH verify exact two owner URLs and current microdermo capacity
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          cd "$ROOT"
          test "$(git -c safe.directory="$ROOT" rev-parse HEAD)" = '4c6e75e566dcf317624285fe4f92d5cbdd6ec2dc'
          test -z "$(git -c safe.directory="$ROOT" status --porcelain=v1 --untracked-files=no)"
          test "$(git -c safe.directory="$ROOT" ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = '4c6e75e566dcf317624285fe4f92d5cbdd6ec2dc'
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-cavitation-availability.timer
          systemctl is-active --quiet lowcost-europa-affiliate-report.timer
          set -a
          . "$ROOT/private/systemd-env/lowcost-europa.env"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u le001_1789265592 -- "$ROOT/.venv/bin/python" - <<'PY'
          import django
          django.setup()
          from apps.catalog.models import Offer,OfferClick,OfferFamilyPlacement,ProductFamily
          from apps.catalog.services.manual_candidate_intake import resolve_aliexpress_product_url
          from apps.catalog.services.public_eligibility import public_eligibility_q,MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY
          from apps.integrations.aliexpress.affiliate_url import is_https_affiliate_url
          from urllib.parse import urlsplit
          family_slug='hydrodermoabrasao-aqua-facial-multifuncoes'
          urls=["https://s.click.aliexpress.com/e/_c3Li4I0x","https://s.click.aliexpress.com/e/_c2zWtlHh"]
          assert len(urls)==len(set(urls))==2
          assert all(is_https_affiliate_url(url) and urlsplit(url).hostname=='s.click.aliexpress.com' for url in urls)
          family=ProductFamily.objects.get(slug=family_slug)
          placements=OfferFamilyPlacement.objects.filter(product_family=family)
          total=placements.count()
          visible=placements.filter(public_eligibility_q(prefix='offer__')).count()
          manual=placements.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()
          print('MICRODERMO_BEFORE_PLACEMENTS='+str(total))
          print('MICRODERMO_BEFORE_PUBLIC='+str(visible))
          print('MICRODERMO_BEFORE_MANUAL='+str(manual))
          print('MICRODERMO_CAPACITY='+str(MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY))
          print('MICRODERMO_CLICK_HISTORY='+str(OfferClick.objects.count()))
          assert total==14 and visible==14 and manual==14
          assert total+2<=MAX_PUBLIC_ELIGIBLE_OFFERS_PER_FAMILY
          ids=[]
          new=0
          for i,url in enumerate(urls,1):
              external_id,_=resolve_aliexpress_product_url(url)
              ids.append(external_id)
              prior=Offer.objects.filter(source=Offer.Source.ALIEXPRESS_OWNER,external_product_id=external_id).first()
              if prior is None:
                  status='NEW_PRODUCT'
                  new+=1
              elif prior.affiliate_url==url:
                  status='EXISTS_SAME_AFFILIATE_LINK'
              else:
                  status='EXISTS_DIFFERENT_AFFILIATE_LINK'
              print('MICRODERMO_OWNER_URL_'+str(i)+'='+status)
          print('MICRODERMO_TWO_URLS_DISTINCT_PRODUCTS='+str(len(set(ids))==2).upper())
          print('MICRODERMO_NEW_PRODUCTS='+str(new))
          print('MICRODERMO_READONLY_PRECHECK=PASS')
          PY
          REMOTE
