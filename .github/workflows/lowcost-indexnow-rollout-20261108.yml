name: Lowcost guarded IndexNow rollout and preservation checks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-indexnow-rollout-20261108.yml']
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Final authoritative DNS and email preservation
        shell: bash
        run: |
          set -euo pipefail
          for resolver in ns1.dyna-ns.net ns2.dyna-ns.net 1.1.1.1; do
            for host in lowcost-europa.eu www.lowcost-europa.eu; do
              [[ "$(dig +short @"$resolver" "$host" A | sort -u)" == 146.59.145.3 ]]
              [[ -z "$(dig +short @"$resolver" "$host" AAAA)" ]]
            done
            [[ "$(dig +short @"$resolver" lowcost-europa.eu MX)" == '0 webhost.dynadot.com.' ]]
            dig +short @"$resolver" lowcost-europa.eu TXT | grep -Fq 'v=spf1 mx include:webhost-mail-out.dynadot.com'
            dig +short @"$resolver" lowcost-europa.eu TXT | grep -Fq 'google-site-verification='
            dig +short @"$resolver" default._domainkey.lowcost-europa.eu CNAME | grep -Fq 'clients._domainkey.webhost.dynadot.com.'
            dig +short @"$resolver" _dmarc.lowcost-europa.eu TXT | grep -Fq 'v=DMARC1; p=none'
          done
          echo LOWCOST_FINAL_DNS_AND_EMAIL=PASS
      - name: Verify pinned VPS SSH host identity
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/khost"
          chmod 600 "$RUNNER_TEMP/khost"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/khost" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          echo LOWCOST_INDEPENDENT_HOST_PIN=PASS
      - name: Deploy tested IndexNow and verify unchanged public infrastructure
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/khost" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          root=/srv/projects/lowcost-europa
          current=1ed66513bdd577282789f862c8b94284c12da167
          target=93c5dedcf0877eeff583b2863fe246d132c7225c
          service_user=le001_1789265592
          envfile="$root/private/systemd-env/lowcost-europa.env"
          backup="$root/private/indexnow-rollout-20261108"
          g() { git -c "safe.directory=$root" -C "$root" "$@"; }
          [[ "$(g rev-parse HEAD)" == "$current" ]]
          changes="$(g status --porcelain=v1 --untracked-files=no)"
          [[ -z "$changes" ]]
          test ! -e "$backup"
          test ! -e /etc/systemd/system/lowcost-europa-indexnow.service
          test ! -e /etc/systemd/system/lowcost-europa-indexnow.timer
          nginx_before="$(sha256sum "$root/deploy/nginx/lowcost-europa.eu.conf")"
          cert_before="$(sha256sum /etc/letsencrypt/live/lowcost-europa.eu/fullchain.pem)"
          install -d -m 700 "$backup"
          cp -p "$envfile" "$backup/env.before"
          rollback() {
            set +e
            systemctl disable --now lowcost-europa-indexnow.timer >/dev/null 2>&1
            systemctl stop lowcost-europa-indexnow.service >/dev/null 2>&1
            rm -f /etc/systemd/system/lowcost-europa-indexnow.service /etc/systemd/system/lowcost-europa-indexnow.timer
            systemctl daemon-reload
            cp -p "$backup/env.before" "$envfile"
            g checkout --detach "$current" >/dev/null 2>&1
            systemctl restart lowcost-europa.service
            echo LOWCOST_INDEXNOW_ROLLBACK_EXECUTED
          }
          trap rollback ERR
          GIT_TERMINAL_PROMPT=0 g fetch origin main >/dev/null 2>&1
          [[ "$(g rev-parse origin/main)" == "$target" ]]
          g merge-base --is-ancestor "$current" "$target"
          g checkout --detach "$target" >/dev/null 2>&1
          "$root/.venv/bin/pip" install --disable-pip-version-check --no-deps defusedxml==0.7.1 >/dev/null
          python3 - "$envfile" "$backup/env.before" <<'PY'
          import pathlib,secrets,sys
          path=pathlib.Path(sys.argv[1]); before=pathlib.Path(sys.argv[2]).read_text()
          assert 'DJANGO_INDEXNOW_KEY=' not in before
          path.write_text(before.rstrip('\n')+'\nDJANGO_INDEXNOW_KEY='+secrets.token_hex(16)+'\n')
          assert path.read_text().split('DJANGO_INDEXNOW_KEY=')[0].rstrip('\n') == before.rstrip('\n')
          PY
          chmod 600 "$envfile"
          install -d -o "$service_user" -g "$service_user" -m 700 "$root/.indexnow"
          ln -s "$root/deploy/systemd/lowcost-europa-indexnow.service" /etc/systemd/system/lowcost-europa-indexnow.service
          ln -s "$root/deploy/systemd/lowcost-europa-indexnow.timer" /etc/systemd/system/lowcost-europa-indexnow.timer
          systemctl daemon-reload
          systemctl restart lowcost-europa.service
          ready=false
          for attempt in $(seq 1 25); do
            if curl -fsS --max-time 2 -H 'Host: www.lowcost-europa.eu' -H 'X-Forwarded-Proto: https' http://127.0.0.1:8001/health/ready/ >/dev/null; then ready=true; break; fi
            sleep 1
          done
          [[ "$ready" == true ]]
          nginx -t >/dev/null 2>&1
          [[ "$(sha256sum "$root/deploy/nginx/lowcost-europa.eu.conf")" == "$nginx_before" ]]
          [[ "$(sha256sum /etc/letsencrypt/live/lowcost-europa.eu/fullchain.pem)" == "$cert_before" ]]
          python3 - "$envfile" <<'PY'
          import pathlib,sys,urllib.request
          key=[line.split('=',1)[1] for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.startswith('DJANGO_INDEXNOW_KEY=')][0]
          with urllib.request.urlopen('https://www.lowcost-europa.eu/indexnow-'+key+'.txt',timeout=20) as response:
              assert response.status==200 and response.read().decode().strip()==key
          print('LOWCOST_INDEXNOW_EXTERNAL_PROOF=PASS')
          PY
          systemctl start lowcost-europa-indexnow.service
          journalctl -u lowcost-europa-indexnow.service --since '5 minutes ago' --no-pager -o cat | grep '^INDEXNOW_'
          systemctl enable --now lowcost-europa-indexnow.timer >/dev/null 2>&1
          systemctl is-active --quiet lowcost-europa-indexnow.timer
          systemctl is-active --quiet lowcost-europa.service
          [[ "$(stat -c %a "$root/.legal/operator.json")" == 600 ]]
          [[ "$(stat -c %a "$root/.indexnow")" == 700 ]]
          [[ "$(g rev-parse HEAD)" == "$target" ]]
          changes="$(g status --porcelain=v1 --untracked-files=no)"
          [[ -z "$changes" ]]
          echo "LOWCOST_INDEXNOW_ALIGNED_SHA=$target"
          echo LOWCOST_INDEXNOW_TIMER=PASS
          echo LOWCOST_HTTPS_NGINX_LEGAL_PRESERVED=PASS
          trap - ERR
                    REMOTE
