name: Lowcost Sales Audit 20260930

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lowcost-sales-audit-20260930.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read live sales indicators
        env:
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null

          sshpass -p "$VPS_SSH_PASSWORD" ssh             -o PreferredAuthentications=password             -o PubkeyAuthentication=no             -o StrictHostKeyChecking=accept-new             -o ConnectTimeout=10             ubuntu@146.59.145.3 'bash -s' <<'REMOTE'
          set -euo pipefail

          echo "RUNTIME_HEAD=$(sudo -u le001_1789265592 git -C /srv/lowcost-europa rev-parse HEAD)"
          echo "RUNTIME_BRANCH=$(sudo -u le001_1789265592 git -C /srv/lowcost-europa branch --show-current)"

          sudo -n bash -s <<'ROOT'
          set -euo pipefail
          set -a
          . /etc/lowcost-europa/lowcost-europa.env
          set +a
          cd /srv/lowcost-europa

          exec sudo -u le001_1789265592 -E /srv/lowcost-europa/.venv/bin/python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings.production")
          import django
          django.setup()

          from apps.catalog.models import OfferClick

          clicks = OfferClick.objects.all()
          first = clicks.order_by("clicked_at").values_list("clicked_at", flat=True).first()
          last = clicks.order_by("-clicked_at").values_list("clicked_at", flat=True).first()

          print(f"OFFER_CLICKS={clicks.count()}")
          print(f"FIRST_CLICK={first.isoformat() if first else 'NONE'}")
          print(f"LAST_CLICK={last.isoformat() if last else 'NONE'}")
          PY
          ROOT
          REMOTE
