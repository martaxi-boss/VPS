name: Ferrari Ruflo real single-host team certificate one-shot
on:
  push:
    branches: [main]
    paths:
      - ferrari-release-requests/ferrari-ruflo-cert-20261106.json
permissions:
  contents: read
jobs:
  certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Authorize exact bounded Ruflo test request
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          added="$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER")"
          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          test "$added" = "ferrari-release-requests/ferrari-ruflo-cert-20261106.json"
          test "$changed" = "$added"
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("ferrari-release-requests/ferrari-ruflo-cert-20261106.json").read_text())
          assert x=={"version":1,"kind":"ruflo-single-host-team-certification","scope":"synthetic-private","host":"ChatGPT","external_model_calls":False,"other_projects":"untouched"}
          print("FERRARI_RUFLO_ONE_HOST_GATE=PASS")
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/skill-universal
          ref: 1c07ee2357bc8be934f3198e958159d27b720551
          path: ferrari-source
          persist-credentials: false
      - name: Pin existing SSH fingerprint for the isolated Ferrari test
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/known"
          chmod 600 "$RUNNER_TEMP/known"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/known" -E sha256 | awk '{print $2}')" = SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
          echo FERRARI_EXISTING_SSH_PIN=PASS
      - name: Execute actual Ruflo MCP swarms and Ferrari REA/tool role handoffs
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known"
                -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          set +e
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 '/usr/bin/python3 -' \
            < ferrari-source/install/vps-ruflo-single-host-certificate.py \
            > "$RUNNER_TEMP/ruflo-certificate.json"
          remote_exit=$?
          set -e
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'ruflo-certificate.json').read_text())
          print('FERRARI_RUFLO_TEST_STATUS='+str(d.get('status')))
          print('FERRARI_RUFLO_TWO_REGISTERED_ROLES='+str(len(d.get('ruflo_mcp',{}).get('agent_roles_registered',[]))))
          print('FERRARI_RUFLO_REAL_PRIVATE_TOOLS='+str(sum(x.get('confirmed',False) for x in d.get('host_tool_executions',{}).values())))
          print('FERRARI_RUFLO_DISPOSABLE_CLEANED='+str(d.get('disposable_test_state_removed')))
          print('FERRARI_RUFLO_AGENT_LLM_CALLS='+str(d.get('agent_models_launched')))
          if d.get('status')!='host_mediated_work_verified' or not d.get('disposable_test_state_removed'):
            raise SystemExit('RUFLO_CERT_PARTIAL_OR_FAILED')
          PY
          test "$remote_exit" = 0
      - name: Verify all eight protected services still active and no Ruflo resident daemon
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
                -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known"
                -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 '/usr/bin/python3 -' <<'PY'
          import subprocess,os
          from pathlib import Path
          protected=('pink-iptv-backend','pink-vpn','fadego-staging','lowcost-europa','pm2-iptvpn-bot','pm2-telegram-robot-leads','nginx','postgresql@16-main')
          active={s:subprocess.run(['systemctl','is-active',s],capture_output=True,text=True,timeout=8).stdout.strip() for s in protected}
          print('FERRARI_RUFLO_PROTECTED_SERVICES='+str(sum(x=='active' for x in active.values()))+'/8')
          if not all(x=='active' for x in active.values()): raise SystemExit('PROTECTED_SERVICES_FAILED')
          suspicious=0
          for p in Path('/proc').iterdir():
            if not p.name.isdigit():continue
            try:
              if p.stat().st_uid!=os.getuid():continue
              cmd=(p/'cmdline').read_bytes()
              if b'/srv/projects/skill-universal/.runtime/npm/ruflo/' in cmd and any(x in cmd.lower() for x in (b'mcp start',b'daemon',b'swarm start')):suspicious+=1
            except (OSError,PermissionError):pass
          print('FERRARI_RUFLO_RESIDENT_COORDINATORS='+str(suspicious))
          if suspicious:raise SystemExit('RUFLO_RESIDENT_PROCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ferrari-ruflo-host-cert-${{ github.run_id }}
          path: ${{ runner.temp }}/ruflo-certificate.json
          if-no-files-found: warn
          retention-days: 14
