name: Lowcost SEO 23-URL production final technical gate 20261112
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-seo-23url-final-gate-20261112.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-prod-automation-controls
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Pinned-SSH read-only crawl readiness, exact SHA and IndexNow
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          APP_SHA=4c6e75e566dcf317624285fe4f92d5cbdd6ec2dc
          cd "$ROOT"
          gitrepo() { git -c safe.directory="$ROOT" -C "$ROOT" "$@"; }
          test "$(gitrepo rev-parse HEAD)" = "$APP_SHA"
          test -z "$(gitrepo status --porcelain=v1 --untracked-files=no)"
          test "$(gitrepo ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')" = "$APP_SHA"
          echo SEO_GITHUB_VPS_LATEST_APP_SHA=PASS
          nginx -t >/dev/null 2>&1
          for unit in lowcost-europa.service lowcost-europa-indexnow.timer \
                      lowcost-europa-affiliate-report.timer lowcost-europa-cavitation-availability.timer; do
            systemctl is-active --quiet "$unit"
            echo "SEO_UNIT_$unit=ACTIVE"
          done
          for unit in lowcost-europa-weekly-discovery.timer lowcost-europa-catalog-maintenance.timer; do
            test "$(systemctl is-enabled "$unit" 2>/dev/null || true)" = disabled
            ! systemctl is-active --quiet "$unit"
          done
          echo SEO_LEGACY_PRODUCT_AUTOMATION=OFF
          python3 - <<'PY'
          import urllib.request, urllib.error, re
          from xml.etree import ElementTree
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          base='https://www.lowcost-europa.eu'
          class Page(HTMLParser):
            def __init__(self):
              super().__init__()
              self.canonical=[]
              self.robots=[]
              self.alternates={}
              self.title=''
              self._title=False
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='link' and 'canonical' in a.get('rel','').lower().split():
                self.canonical.append(a.get('href',''))
              if tag=='link' and 'alternate' in a.get('rel','').lower().split() and a.get('hreflang'):
                self.alternates[a['hreflang']]=a.get('href')
              if tag=='meta' and a.get('name','').lower() in ('robots','googlebot','bingbot'):
                self.robots.append(a.get('content',''))
              if tag=='title':self._title=True
            def handle_data(self,s):
              if self._title:self.title+=s
            def handle_endtag(self,tag):
              if tag=='title':self._title=False
          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Lowcost Europa technical SEO readiness audit 2026-11'})
            with urllib.request.urlopen(req,timeout=16) as r:
              assert r.status==200,(url,r.status)
              body=r.read(1000000)
              return r.headers,body
          robots=fetch(base+'/robots.txt')[1].decode('utf-8','replace')
          sitemap=fetch(base+'/sitemap.xml')[1]
          text_map=fetch(base+'/sitemap.txt')[1].decode('utf-8','replace')
          ns='{http://www.sitemaps.org/schemas/sitemap/0.9}'
          root=ElementTree.fromstring(sitemap)
          urls=[node.text for node in root.findall(ns+'url/'+ns+'loc')]
          txt=[row.strip() for row in text_map.splitlines() if row.strip()]
          assert len(urls)==23 and len(set(urls))==23
          assert set(urls)==set(txt)
          assert all(url.startswith(base+'/') and urlsplit(url).query=='' for url in urls)
          assert 'sitemap.xml' in robots and 'sitemap.txt' in robots
          assert 'Disallow: /' not in robots.splitlines()
          print('SEO_SITEMAPS_23_PARITY_AND_ROBOTS=PASS')
          errors=[]
          scanned=0
          localized=0
          for url in urls:
            try:
              headers,body=fetch(url)
              html=body.decode('utf-8','replace')
              page=Page()
              page.feed(html)
              assert page.canonical==[url],('canonical',page.canonical)
              assert 'noindex' not in headers.get('X-Robots-Tag','').lower()
              assert all('noindex' not in item.lower() for item in page.robots)
              assert page.title.strip() and len(page.title.strip())>=8
              scanned+=1
              if '/pt/' in url or '/es/' in url:
                localized+=1
                assert page.alternates.get('pt-PT') and page.alternates.get('es-ES')
                assert page.alternates.get('x-default')
            except Exception as exc:
              errors.append({'url':url.replace(base,''),
                             'error':exc.__class__.__name__,
                             'detail':str(exc)[:95]})
          print('SEO_PUBLIC_URLS_SCANNED='+str(scanned))
          print('SEO_LOCALIZED_HREFLANG_SCANNED='+str(localized))
          print('SEO_PUBLIC_URL_ERRORS='+str(errors))
          assert not errors and scanned==23
          print('SEO_23_PUBLIC_URLS_HTTP_CANONICAL_NOINDEX=PASS')
          for slug in ('cavitacao-rf-vacuum-corpo','hydrodermoabrasao-aqua-facial-multifuncoes','pressoterapia-vacuum-drenagem','hifu','diodo-laser-remocao-tatuagens-pigmentacao'):
            for prefix in ('','pt/','es/'):
              assert base+'/'+prefix+'products/'+slug+'/' in urls
          print('SEO_FIVE_CATEGORIES_THREE_LOCALES_DISCOVERABLE=PASS')
          headers,icon=fetch(base+'/favicon.ico')
          assert len(icon)>=64
          assert 'image' in headers.get('Content-Type','').lower() or icon[:4]==b'\x00\x00\x01\x00'
          print('SEO_BRANDED_FAVICON_GET_200=PASS')
          PY
          test "$(systemctl show lowcost-europa-indexnow.service -p Result --value)" = success
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/srv/projects/lowcost-europa/.indexnow/accepted.json')
          assert p.is_file() and not p.is_symlink()
          data=json.loads(p.read_text())
          assert isinstance(data,dict) and len(data)==23
          print('SEO_INDEXNOW_23_ACCEPTED_URLS=PASS')
          PY
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          set -a
          . "$ROOT/private/systemd-env/lowcost-europa.env"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" manage.py notify_indexnow --dry-run
          echo SEO_INDEXNOW_DRY_RUN_ONLY=PASS
          nginx -t >/dev/null 2>&1
          echo LOWCOST_SEO_TECHNICAL_CLOSURE_GATE=PASS
          REMOTE
# Retest after restoring existing IndexNow service: VPS run 43281306161.
