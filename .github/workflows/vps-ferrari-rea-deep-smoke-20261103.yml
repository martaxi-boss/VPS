name: Ferrari REA Ghidra-JADX deep native smoke one-time
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-ferrari-rea-deep-smoke-20261103.yml'
permissions:
  contents: read
concurrency:
  group: ferrari-private-rea-deep-smoke
  cancel-in-progress: false
jobs:
  deep-rea-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Check existing pinned VPS SSH host
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/ferrari-known-hosts"
          chmod 600 "$RUNNER_TEMP/ferrari-known-hosts"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/ferrari-known-hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
      - name: Fetch pinned Ferrari-own smoke script
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error --max-time 90 \
            'https://raw.githubusercontent.com/martaxi-boss/skill-universal/c8b44abe86e7c6c5d64ace90746d817051da8e7b/install/vps-rea-deep-provider-smoke.sh' \
            --output "$RUNNER_TEMP/ferrari-deep-smoke.sh"
          test -s "$RUNNER_TEMP/ferrari-deep-smoke.sh"
          bash -n "$RUNNER_TEMP/ferrari-deep-smoke.sh"
      - name: Real private Ferrari Ghidra and JADX analysis on VPS
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/ferrari-known-hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'bash -s' \
            < "$RUNNER_TEMP/ferrari-deep-smoke.sh" \
            > "$RUNNER_TEMP/ferrari-deep-smoke-result.txt"
          cat "$RUNNER_TEMP/ferrari-deep-smoke-result.txt"
          grep -q '^FERRARI_REA_GHIDRA_NATIVE_ANALYSIS=PASS' "$RUNNER_TEMP/ferrari-deep-smoke-result.txt"
          grep -q '^FERRARI_REA_JADX_CLASS_ANALYSIS=PASS' "$RUNNER_TEMP/ferrari-deep-smoke-result.txt"
          grep -Fx 'FERRARI_REA_DEEP_PROVIDERS=PASS' "$RUNNER_TEMP/ferrari-deep-smoke-result.txt"
      - name: Upload minimal real smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-rea-deep-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/ferrari-deep-smoke-result.txt
          retention-days: 7
          if-no-files-found: warn
