name: Continue original Owner DAG (no repeated Coordinator AI)

# Called solely by the authenticated Owner Issue's original orchestrator.
# Preserve Owner phase identities, risk, one/two workers and their reasoning.
# Never call Codex in the control plane; only workers consume model quota.
on:
  workflow_call:
    inputs:
      original_plan_b64:
        required: true
        type: string
      phase_number:
        required: true
        type: number
      previous_merged_sha:
        required: true
        type: string
    outputs:
      phase_status:
        description: Independently verified post-merge state
        value: ${{ jobs.integrate.outputs.phase_status }}
      merged_sha:
        description: Independently certified target HEAD
        value: ${{ jobs.integrate.outputs.merged_sha }}

permissions: {}

jobs:
  prepare:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[coordinator run] ') &&
      inputs.phase_number >= 2 && inputs.phase_number <= 8
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    outputs:
      coordinator_plan_b64: ${{ steps.prepare.outputs.coordinator_plan_b64 }}
      remaining_phases: ${{ steps.prepare.outputs.remaining_phases }}
      audited_sha: ${{ steps.prepare.outputs.audited_sha }}
    steps:
      - name: Load reviewed deterministic phase dispatcher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify Owner Issue, previous merge and bounded original next phase
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
          OWNER_ISSUE: ${{ github.event.issue.number }}
          ORIGINAL_PLAN_B64: ${{ inputs.original_plan_b64 }}
          PHASE_NUMBER: ${{ inputs.phase_number }}
          PREVIOUS_MERGED_SHA: ${{ inputs.previous_merged_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY_PREPARE'
          import json, os, re, urllib.parse, urllib.request
          from ops.coordinator_phase_continuation import prepared_phase
          previous = os.environ.get('PREVIOUS_MERGED_SHA', '')
          issue_number = os.environ.get('OWNER_ISSUE', '')
          if (not re.fullmatch(r'[0-9a-f]{40}', previous) or
                  not re.fullmatch(r'[1-9][0-9]{0,15}', issue_number)):
              raise SystemExit('BOUND_ORIGINAL_PHASE_UNVERIFIED')
          def gh(url, token):
              if not token:
                  raise SystemExit('GITHUB_AUTH_UNAVAILABLE')
              req = urllib.request.Request(
                  'https://api.github.com/' + url,
                  headers={'Authorization': 'Bearer ' + token,
                           'Accept': 'application/vnd.github+json',
                           'User-Agent': 'Project-Leader-Deterministic-Phase'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = response.read(1000001)
              if len(data) > 1000000:
                  raise SystemExit('UNBOUNDED_GITHUB_RESPONSE')
              return json.loads(data)
          issue = gh('repos/martaxi-boss/VPS/issues/' + issue_number,
                     os.environ.get('GH_TOKEN', ''))
          if (issue.get('state') != 'open' or
                  issue.get('user', {}).get('login') != 'martaxi-boss' or
                  not issue.get('title', '').startswith('[coordinator run] ') or
                  not str(issue.get('body', '')).startswith(
                      'TARGET_REPOSITORY=martaxi-boss/Project-leader-codex\n')):
              raise SystemExit('OWNER_ISSUE_UNAUTHORIZED')
          actual = gh(
              'repos/martaxi-boss/Project-leader-codex/git/ref/heads/main',
              os.environ.get('CODEX_GITHUB_TOKEN', ''))
          if actual.get('object', {}).get('sha') != previous:
              raise SystemExit('VERIFIED_PREVIOUS_MERGE_HEAD_CHANGED')
          plan = prepared_phase(
              os.environ['ORIGINAL_PLAN_B64'], int(os.environ['PHASE_NUMBER']),
              previous)
          # Existing source files must still exist and stay regular.
          # The Codex worker later pins the same commit and checks its scope.
          for path in plan['paths']:
              url_path = urllib.parse.quote(path, safe='/')
              item = gh(
                  'repos/martaxi-boss/Project-leader-codex/contents/' +
                  url_path + '?ref=' + previous,
                  os.environ['CODEX_GITHUB_TOKEN'])
              if (item.get('type') != 'file' or item.get('path') != path or
                      item.get('size', -1) > 500000):
                  raise SystemExit('AUTHORIZED_PATH_MISSING_OR_UNSAFE')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as stream:
              stream.write('coordinator_plan_b64=' +
                           plan['coordinator_plan_b64'] + '\n')
              stream.write('remaining_phases=' +
                           str(plan['remaining_phases']) + '\n')
              stream.write('audited_sha=' + plan['audited_sha'] + '\n')
          print('OWNER_DAG_NEXT_PHASE_VERIFIED_WITHOUT_COORDINATOR_AI')
          PY_PREPARE

  dispatch:
    needs: prepare
    if: >-
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.coordinator_plan_b64 != ''
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/agent-switch.yml
    with:
      coordinator_plan_b64: ${{ needs.prepare.outputs.coordinator_plan_b64 }}
      phase_number: ${{ inputs.phase_number }}
    secrets: inherit

  integrate:
    needs: [prepare, dispatch]
    if: >-
      needs.prepare.result == 'success' &&
      needs.dispatch.result == 'success' &&
      github.event_name == 'issues' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    outputs:
      phase_status: ${{ steps.terminal.outputs.phase_status }}
      merged_sha: ${{ steps.terminal.outputs.merged_sha }}
    steps:
      - name: Load reviewed Project Leader trusted PR integrator from default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Independently validate worker Project Leader proof and guarded PR merge
        id: terminal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_GITHUB_TOKEN: ${{ secrets.CODEX_GITHUB_TOKEN }}
          OWNER_ISSUE: ${{ github.event.issue.number }}
          OWNER_RUN: ${{ github.run_id }}
          PHASE_NUMBER: ${{ inputs.phase_number }}
          WORKER_COUNT: ${{ needs.dispatch.outputs.task_count }}
          PHASE_COUNT: ${{ needs.prepare.outputs.remaining_phases }}
          CANONICAL_SHA: ${{ needs.dispatch.outputs.worker_1_canonical_sha }}
          WORKER_1_STATUS: ${{ needs.dispatch.outputs.worker_1_status }}
          WORKER_1_PR: ${{ needs.dispatch.outputs.worker_1_pr }}
          WORKER_1_SHA: ${{ needs.dispatch.outputs.worker_1_sha }}
          WORKER_2_STATUS: ${{ needs.dispatch.outputs.worker_2_status }}
          WORKER_2_PR: ${{ needs.dispatch.outputs.worker_2_pr }}
          WORKER_2_SHA: ${{ needs.dispatch.outputs.worker_2_sha }}
          WORKER_2_CANONICAL: ${{ needs.dispatch.outputs.worker_2_canonical_sha }}
        run: |
          set -euo pipefail
          if [ "$WORKER_COUNT" = '2' ]; then
            test "$WORKER_2_CANONICAL" = "$CANONICAL_SHA" || exit 12
          fi
          python3 ops/coordinator_pr_integrator.py
