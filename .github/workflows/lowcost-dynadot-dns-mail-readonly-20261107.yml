name: Lowcost Dynadot DNS/mail preserve audit read only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-dynadot-dns-mail-readonly-20261107.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Confirm only this audited workflow changed
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")" == '.github/workflows/lowcost-dynadot-dns-mail-readonly-20261107.yml' ]]
          echo LOWCOST_READONLY_SCOPE=PASS
      - name: Audit public DNS and email authentication on authoritative NS
        shell: bash
        run: |
          set -euo pipefail
          zone=lowcost-europa.eu
          for resolver in ns1.dyna-ns.net ns2.dyna-ns.net 1.1.1.1; do
            for entry in "$zone|A" "www.$zone|A" "$zone|AAAA" "www.$zone|AAAA" "$zone|MX" "$zone|TXT" "default._domainkey.$zone|CNAME" "default._domainkey.$zone|TXT" "_dmarc.$zone|TXT" "$zone|CAA" "_autodiscover._tcp.$zone|SRV" "autodiscover.$zone|CNAME"; do
              host="${entry%%|*}"
              type="${entry#*|}"
              result="$(dig +time=4 +tries=1 +short @"$resolver" "$host" "$type" | tr '\n' ' ' | cut -c1-1100)"
              printf 'DNS_RECORD resolver=%s name=%s type=%s value=%s\n' "$resolver" "$host" "$type" "$result"
            done
          done
          echo LOWCOST_DNS_AUDIT=PASS_NO_MUTATION
