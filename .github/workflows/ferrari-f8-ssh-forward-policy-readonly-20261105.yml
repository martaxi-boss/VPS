name: Ferrari F8 - diagnostic only SSH Remote forwarding
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ferrari-f8-ssh-forward-policy-readonly-20261105.yml'
permissions:
  contents: read
concurrency:
  group: ferrari-f8-ssh-forward-policy-readonly-20261105
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify existing SSH identity and inspect forwarding policy without mutations
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/f8-ssh-known-hosts"
          chmod 600 "$RUNNER_TEMP/f8-ssh-known-hosts"
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/f8-ssh-known-hosts" -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T             -o PreferredAuthentications=password -o PubkeyAuthentication=no             -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/f8-ssh-known-hosts"             -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519             -o ConnectTimeout=20 -o ServerAliveInterval=15             ubuntu@146.59.145.3 'python3 -' <<'PY_REMOTE'
          import subprocess
          print('F8_REMOTE_SSH_DIAG=BEGIN', flush=True)
          commands={
            'SSHD_EFFECTIVE_GLOBAL': ['sudo','-n','/usr/sbin/sshd','-T'],
            'SSH_SERVICE_ACTIVE':['systemctl','is-active','ssh'],
            'REMOTE_PORT_23989':['ss','-H','-ltn','sport = :23989']
          }
          selected={'allowtcpforwarding','disableforwarding','permitlisten','gatewayports','permitopen'}
          for label,command in commands.items():
            try:
              r=subprocess.run(command,capture_output=True,text=True,timeout=16)
              print(label+'_EXIT='+str(r.returncode))
              if label=='SSHD_EFFECTIVE_GLOBAL':
                for line in r.stdout.splitlines():
                  if line.split(' ',1)[0].lower() in selected:
                    print('SSHD_'+line.replace(' ','=',1))
              elif label=='REMOTE_PORT_23989':
                lines=[line for line in r.stdout.splitlines() if line.strip()]
                print('PORT_23989_LISTENERS='+str(len(lines)))
                for line in lines[:3]:
                  fields=line.split()
                  print('PORT_23989_LISTENER='+(' '.join(fields[:4]))[:200])
              else:
                print(label+'='+r.stdout.strip()[:80])
            except (OSError,subprocess.TimeoutExpired) as exc:
              print(label+'_EXCEPTION='+type(exc).__name__)
          print('F8_READONLY_NO_GLOBAL_APT_ON_VPS=PASS')
          print('F8_REMOTE_SSH_DIAG=END')
          import re,socket
          owner=subprocess.run(['sudo','-n','ss','-H','-ltpn','sport = :23989'],capture_output=True,text=True,timeout=8)
          print('F8_PORT_OWNER_COMMAND_EXIT='+str(owner.returncode))
          processes=sorted(x for x in ('sshd','systemd','adb','python3') if ('"'+x+'"') in owner.stdout)
          print('F8_PORT_23989_PROCESS_NAMES='+(','.join(processes) if processes else 'unknown'))
          try:
            with socket.create_connection(('127.0.0.1',23989),timeout=4):
              print('F8_PORT_23989_TCP_ACCEPT=PASS')
          except OSError as exc:
            print('F8_PORT_23989_TCP_ACCEPT='+type(exc).__name__)
          # No adb connect or install: this checks listener ownership and accepts only TCP.
          print('F8_NO_ADB_INSTALL_OR_PAIR=PASS')
          PY_REMOTE
