name: Lowcost radical hygiene - scoped read only inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-hygiene-inventory-once-20261108.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-hygiene-20261108
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify scope and production SSH pin
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git diff --name-only HEAD^ HEAD)" == '.github/workflows/lowcost-hygiene-inventory-once-20261108.yml' ]]
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/known_hosts"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/known_hosts" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          echo LOWCOST_INVENTORY_PIN=PASS
      - name: Read only VPS evidence with no private file content
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SSHPASS" ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          [[ -d "$ROOT/.git" && -d "$ROOT/private" ]]
          echo LOWCOST_INVENTORY_BEGIN=YES
          printf 'LOWCOST_INVENTORY_UTC='; date -u +%Y-%m-%dT%H:%M:%SZ
          printf 'LOWCOST_INVENTORY_SHA='; git -c "safe.directory=$ROOT" -C "$ROOT" rev-parse HEAD
          printf 'LOWCOST_INVENTORY_TRACKED_DIFF_COUNT='; git -c "safe.directory=$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no | wc -l
          printf 'LOWCOST_INVENTORY_ROOT_KIB='; du -sk "$ROOT" | awk '{print $1}'
          for dir in .git .venv private staticfiles www docs; do
            if [[ -d "$ROOT/$dir" ]]; then
              printf 'LOWCOST_INVENTORY_%s_KIB=' "$dir"
              du -sk "$ROOT/$dir" | awk '{print $1}'
            fi
          done
          for dir in private/deploy-rollbacks private/backups private/exports private/qa-artifacts; do
            if [[ -d "$ROOT/$dir" ]]; then
              printf 'LOWCOST_INVENTORY_%s_KIB=' "${dir//\//_}"
              du -sk "$ROOT/$dir" | awk '{print $1}'
              printf 'LOWCOST_INVENTORY_%s_TOPDIRS=' "${dir//\//_}"
              find "$ROOT/$dir" -mindepth 1 -maxdepth 1 -type d | wc -l
            fi
          done
          printf 'LOWCOST_INVENTORY_DOT_GIT_OBJECTS='; git -c "safe.directory=$ROOT" -C "$ROOT" count-objects -v | tr '\n' ';'
          printf '\n'
          printf 'LOWCOST_INVENTORY_ROOT_FS='; df -Pk "$ROOT" | awk 'NR==2 {print "total_kib="$2",used_kib="$3",available_kib="$4}'
          printf 'LOWCOST_INVENTORY_OLD_LEGACY_DNS_FILES='
          find "$ROOT/deploy/nginx" -maxdepth 1 -type f \( -name 'lowcost-europa.conf' -o -name 'lowcost-europa.eu-acme.conf' \) | wc -l
          printf 'LOWCOST_INVENTORY_NGINX_HOSTS_BEGIN\n'
          nginx -T 2>/dev/null | awk '/^[[:space:]]*server_name / && /lowcost-europa|duckdns|sslip/ {print}' | sort -u
          printf 'LOWCOST_INVENTORY_NGINX_HOSTS_END\n'
          echo LOWCOST_INVENTORY_NGINX_SITES_BEGIN
          find /etc/nginx/sites-enabled -mindepth 1 -maxdepth 1 -type l -printf '%f=%l\\n' | grep -i lowcost || true
          echo LOWCOST_INVENTORY_NGINX_SITES_END
          echo LOWCOST_INVENTORY_NGINX_LOADED_CONFIGS_BEGIN
          nginx -T 2>/dev/null | grep -E '^# configuration file .*lowcost.*:' | sort -u || true
          echo LOWCOST_INVENTORY_NGINX_LOADED_CONFIGS_END
          echo LOWCOST_INVENTORY_CERTBOT_CERTIFICATES_BEGIN
          if [[ -d /etc/letsencrypt/renewal ]]; then
            find /etc/letsencrypt/renewal -mindepth 1 -maxdepth 1 -type f -printf '%f\\n' | grep -E 'lowcost|duckdns|sslip' || true
          fi
          echo LOWCOST_INVENTORY_CERTBOT_CERTIFICATES_END
          echo LOWCOST_INVENTORY_DNS_TIMERS_BEGIN
          systemctl list-unit-files --no-pager --no-legend | grep -Ei 'lowcost.*dns|lowcost.*domain|duckdns|sslip' | head -n 20 || true
          echo LOWCOST_INVENTORY_DNS_TIMERS_END
          printf 'LOWCOST_INVENTORY_NGINX_TEST='
          nginx -t >/dev/null 2>&1 && echo PASS
          echo LOWCOST_INVENTORY_LOW_COST_SYSTEMD_BEGIN
          systemctl list-timers --all --no-pager --no-legend | grep 'lowcost-europa' | sed -E 's/^[^ ]+[[:space:]]+[^ ]+[[:space:]]+[^ ]+[[:space:]]+[^ ]+[[:space:]]+/TIMER /' | head -n 24 || true
          echo LOWCOST_INVENTORY_LOW_COST_SYSTEMD_END
          for service in lowcost-europa.service lowcost-europa-catalog-maintenance.timer lowcost-europa-weekly-discovery.timer lowcost-europa-indexnow.timer; do
            printf 'LOWCOST_INVENTORY_%s=' "$service"
            systemctl is-active "$service" || true
          done
          printf 'LOWCOST_INVENTORY_PYTHON_CACHE_COUNT='
          find "$ROOT" -xdev \( -name .venv -o -name .git -o -name private \) -prune -o -type d \( -name __pycache__ -o -name .pytest_cache -o -name .ruff_cache \) -print | wc -l
          printf 'LOWCOST_INVENTORY_TEMP_DIR_COUNT='
          find "$ROOT" -xdev \( -name .venv -o -name .git -o -name private \) -prune -o -type d \( -name qa-artifacts -o -name test-results -o -name playwright-report \) -print | wc -l
          printf 'LOWCOST_INVENTORY_ACTIVE_SERVICE='
          systemctl is-active lowcost-europa.service
          curl -fsSI --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 https://www.lowcost-europa.eu/ | grep -Eq '^HTTP/.* 200'
          echo LOWCOST_INVENTORY_PUBLIC_HTTPS=PASS
          echo LOWCOST_INVENTORY_READ_ONLY=PASS
          REMOTE
