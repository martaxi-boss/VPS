name: REA P265 stage reviewed original 6.7.0 dist (no activation)
on:
  push:
    branches:
      - rea/one-skill-bridge-20261023
    paths:
      - ".github/workflows/rea-p265-stage-reviewed-dist.yml"
permissions:
  contents: read
concurrency:
  group: rea-p265-stage-review
  cancel-in-progress: false
jobs:
  stage-original-dist:
    if: github.actor == 'martaxi-boss'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout EXACT verified repaired source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: martaxi-boss/Engenheira-reversa
          ref: c2e13a51cd00409d521cfd8b38db10e8b26fee28
          persist-credentials: false
          path: original-rea
      - name: Use Node.js 24 for original REA build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: original-rea/rea/package-lock.json
      - name: Compile and pin exact original reviewed release modules
        shell: bash
        run: |
          set -euo pipefail
          cd original-rea/rea
          npm ci --ignore-scripts --no-audit --no-fund
          npm run compile
          echo '06194e106c791c652f5eaed5c1d5327cacff9f9f4491156e43a75baecfbf4f17  dist/application/binary/BinarySession.js' | sha256sum --check --status
          echo 'cfa157e47e030ea945b80b5ee5e88a651fb03f35f6f882b4cb1f28ee79f4af69  dist/application/binary/BinarySessionRecords.js' | sha256sum --check --status
          echo '3ab3bee473a77ed4d52cc530e92c5df28e8da9deb61e925cb59c8271ca5ec907  dist/mcp/main.js' | sha256sum --check --status
          test "$(find dist -type l | wc -l)" -eq 0
          tar -czf "$RUNNER_TEMP/rea-p265-original-reviewed-dist.tar.gz" -C . dist
          test "$(stat -c %s "$RUNNER_TEMP/rea-p265-original-reviewed-dist.tar.gz")" -lt 12000000
          echo REA_P265_BUILD_MODULE_DIGESTS=PASS
      - name: Verify existing fixed SSH host pin
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/rea-p265-known"
          chmod 600 "$RUNNER_TEMP/rea-p265-known"
          observed="$(ssh-keygen -lf "$RUNNER_TEMP/rea-p265-known" -E sha256 | awk '{print $2}')"
          test "$observed" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          echo REA_P265_SSH_PIN=PASS
      - name: Stage compiled dist ONLY in existing private service directory; leave service running
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass > /dev/null
          ssh_args=(-T -o PreferredAuthentications=password -o PubkeyAuthentication=no
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/rea-p265-known"
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
            -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=5)
          backup='/opt/rea-reversa/rea/.rea-private/p262-live-evidence-11-8b17734c.json'
          archive='/opt/rea-reversa/rea/.rea-private/p265-staged-original-fixed-dist.tar.gz'
          baseline='8b17734cba53e5332e4780ce8ad4dad068a394fe3e52227274ab7c43712f5380'
          current="$(sshpass -e ssh "${ssh_args[@]}" ubuntu@146.59.145.3 "sudo -n -u rea-reversa sha256sum '$backup'" | awk '{print $1}')"
          test "$current" = "$baseline"
          pid_before="$(sshpass -e ssh "${ssh_args[@]}" ubuntu@146.59.145.3 'systemctl show rea-reversa-mcp.service -p MainPID --value')"
          test "$pid_before" -gt 1
          sha="$(sha256sum "$RUNNER_TEMP/rea-p265-original-reviewed-dist.tar.gz" | awk '{print $1}')"
          sshpass -e ssh "${ssh_args[@]}" ubuntu@146.59.145.3 "sudo -n -u rea-reversa /bin/sh -c 'umask 077; cat > $archive'" < "$RUNNER_TEMP/rea-p265-original-reviewed-dist.tar.gz"
          remote="$(sshpass -e ssh "${ssh_args[@]}" ubuntu@146.59.145.3 "sudo -n -u rea-reversa sha256sum '$archive'" | awk '{print $1}')"
          test "$sha" = "$remote"
          still="$(sshpass -e ssh "${ssh_args[@]}" ubuntu@146.59.145.3 "sudo -n -u rea-reversa sha256sum '$backup'" | awk '{print $1}')"
          test "$still" = "$baseline"
          pid_after="$(sshpass -e ssh "${ssh_args[@]}" ubuntu@146.59.145.3 'systemctl show rea-reversa-mcp.service -p MainPID --value')"
          test "$pid_after" = "$pid_before"
          echo REA_P265_DIST_STAGED_SHA256="$remote"
          echo REA_P265_PRIVATE_EVIDENCE_11_SHA256=PASS
          echo REA_P265_SERVICE_PID_UNCHANGED=PASS
          echo REA_P265_LIVE_RELEASE_APPLIED=NO
