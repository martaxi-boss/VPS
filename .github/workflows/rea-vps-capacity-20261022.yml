name: REA VPS capacity read-only 20261022
on:
  push:
    branches:
      - audit/rea-vps-capacity-20261022
    paths:
      - "ops/rea_vps_capacity_20261022.py"
      - ".github/workflows/rea-vps-capacity-20261022.yml"
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify probe syntax and absence of mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/rea_vps_capacity_20261022.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path("ops/rea_vps_capacity_20261022.py").read_text()
          assert "REA_VPS_CAPACITY_READ_ONLY_20261022" in s
          assert '"side_effects": False' in s
          for forbidden in ("os.environ", "apt-get", "npm install", "pip install", "systemctl start", "systemctl stop", "systemctl restart", "docker run", "write_text(", "unlink(", "Popen("):
              assert forbidden not in s, forbidden
          print("SOURCE_READ_ONLY=PASS")
          PY
      - name: Verify pinned VPS SSH host key
        shell: bash
        run: |
          set -euo pipefail
          known="$RUNNER_TEMP/rea-vps-known"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$known"
          chmod 600 "$known"
          observed="$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')"
          test "$observed" = "SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc"
          ssh-keygen -F 146.59.145.3 -f "$known" >/dev/null
          echo "SSH_PIN=PASS"
      - name: Install SSH helper on temporary runner only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Query remote VPS without modifying it
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/rea-vps-known" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            ubuntu@146.59.145.3 'python3 -' \
            < ops/rea_vps_capacity_20261022.py > "$RUNNER_TEMP/rea-vps-readiness.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ["RUNNER_TEMP"])/"rea-vps-readiness.json").read_text())
          assert data["probe"]=="REA_VPS_CAPACITY_READ_ONLY_20261022"
          assert data["side_effects"] is False
          assert data["memory_bytes"]["MemTotal"]>0
          print("REA_VPS_CAPACITY_RESULT="+json.dumps(data,sort_keys=True))
          PY
