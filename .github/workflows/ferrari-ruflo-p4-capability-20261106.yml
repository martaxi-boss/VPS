name: Ferrari P4 Ruflo command capability audit once
on:
  push:
    branches: [main]
    paths:
      - ferrari-release-requests/ruflo-p4-capability-20261106.json
permissions:
  contents: read
concurrency:
  group: ferrari-ruflo-p4-capabilities
  cancel-in-progress: false
jobs:
  ruflo-command-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact one-shot request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate only new one-shot request
        id: gate
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          new="$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER")"
          diff="$(git diff --name-only "$BEFORE" "$AFTER")"
          if [[ -z "$new" ]]; then
            echo execute=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$new" = ferrari-release-requests/ruflo-p4-capability-20261106.json
          test "$diff" = "$new"
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path("ferrari-release-requests/ruflo-p4-capability-20261106.json").read_text())=={
             "version":1,"task":"ruflo-help-capability-survey-only",
             "commands":["route","policy","workflow","task","agent","swarm","memory","providers","config","doctor","security"],
             "no_daemons":True,"no_model_provider":True}
          print("FERRARI_RUFLO_P4_CAPABILITY_REQUEST=PASS")
          PY
          echo execute=true >> "$GITHUB_OUTPUT"
      - name: Existing pinned SSH
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/host"
          chmod 600 "$RUNNER_TEMP/host"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/host" -E sha256 | awk '{print $2}')" = SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
      - name: Inspect help only in disposable Ferrari subfolder, no agent spawn
        if: steps.gate.outputs.execute == 'true'
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -Eeuo pipefail
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no
             -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/host"
             -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
             -o ConnectTimeout=20 -o ServerAliveInterval=15)
          sshpass -e ssh -T "${opts[@]}" ubuntu@146.59.145.3 'python3 -' > "$RUNNER_TEMP/ruflo-help-survey.txt" <<'PY'
          import json,os,re,subprocess,tempfile
          from pathlib import Path
          R=Path('/srv/projects/skill-universal')
          N=R/'runtimes/node-22.23.4/bin/node'
          C=(R/'.runtime/npm/ruflo/node_modules/.bin/ruflo').resolve(strict=True)
          assert N.is_file() and C.is_file() and C.is_relative_to(R.resolve(strict=True))
          names=['route','policy','workflow','task','agent','swarm','memory','providers','config','doctor','security']
          with tempfile.TemporaryDirectory(prefix='.ruflo-capability-',dir=R/'.runtime') as d:
            d=Path(d)
            for name in ('home','temp','cache','config','data'):
              (d/name).mkdir(mode=0o700)
            env=os.environ.copy()
            env.update({
              'HOME':str(d/'home'),'TMPDIR':str(d/'temp'),'TMP':str(d/'temp'),
              'XDG_CACHE_HOME':str(d/'cache'),'XDG_CONFIG_HOME':str(d/'config'),
              'XDG_DATA_HOME':str(d/'data'),'PATH':str(N.parent)+':/usr/bin:/bin',
              'CI':'1','DO_NOT_TRACK':'1','DISABLE_TELEMETRY':'1','NO_COLOR':'1',
              'OPENAI_API_KEY':'','ANTHROPIC_API_KEY':'','GEMINI_API_KEY':'','GOOGLE_API_KEY':'',
              'OPENROUTER_API_KEY':'','HTTP_PROXY':'http://127.0.0.1:1',
              'HTTPS_PROXY':'http://127.0.0.1:1','ALL_PROXY':'socks5://127.0.0.1:1',
              'NO_PROXY':'',
            })
            for name in names:
              try:
                result=subprocess.run([str(N),str(C),name,'--help'],
                       cwd=str(d),env=env,text=True,capture_output=True,timeout=22,check=False)
                stdout=re.sub(r'\x1b\[[0-9;]*m','',result.stdout+result.stderr)
                print('FERRARI_RUFLO_HELP_COMMAND='+name+' exit='+str(result.returncode),flush=True)
                print('FERRARI_RUFLO_HELP_TEXT='+name+' '+repr(stdout[:3100]),flush=True)
              except subprocess.TimeoutExpired:
                print('FERRARI_RUFLO_HELP_TIMEOUT='+name,flush=True)
          print('FERRARI_RUFLO_COMMAND_AUDIT=PASS_HELP_ONLY',flush=True)
          PY
          cat "$RUNNER_TEMP/ruflo-help-survey.txt"
          grep -q '^FERRARI_RUFLO_COMMAND_AUDIT=PASS_HELP_ONLY' "$RUNNER_TEMP/ruflo-help-survey.txt"
      - name: Retain limited evidence
        if: steps.gate.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ferrari-ruflo-p4-capability-${{ github.run_id }}
          path: ${{ runner.temp }}/ruflo-help-survey.txt
          retention-days: 7
          if-no-files-found: error
