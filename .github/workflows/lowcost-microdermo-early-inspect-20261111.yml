name: Lowcost Microdermoabrasion early failure read only inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lowcost-microdermo-early-inspect-20261111.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Pinned SSH read-only inspect code, files, tasks, data
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          test -d "$ROOT/.git" && test -s "$ENVFILE"
          echo "STATE_SHA=$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD)"
          echo "STATE_GITHUB_SHA=$(git -c safe.directory="$ROOT" -C "$ROOT" ls-remote https://github.com/martaxi-boss/lowcost-europa.git refs/heads/main | awk '{print $1}')"
          if test -z "$(git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)"; then
            echo STATE_TRACKED_WORKTREE=CLEAN
          else
            echo STATE_TRACKED_WORKTREE=DIRTY
            git -c safe.directory="$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no | head -n 20
          fi
          for dir in microdermo-nine-owner-20261111 microdermo-nine-owner-20261111-r2; do
            if test -d "$ROOT/private/ops/$dir"; then echo "STATE_TASK_$dir=PRESENT"; else echo "STATE_TASK_$dir=ABSENT"; fi
          done
          for path in apps/catalog/owner_panel_views.py apps/catalog/services/manual_storefront.py apps/catalog/services/weekly_discovery.py apps/storefront/views.py apps/storefront/templates/storefront/components/offer_card.html; do
            echo "STATE_FILE=$path MODE=$(stat -c '%a' "$ROOT/$path")"
            if runuser -u le001_1789265592 -- test -r "$ROOT/$path"; then echo "STATE_FILE_READ=PASS $path"; else echo "STATE_FILE_READ=FAIL $path"; fi
          done
          for unit in lowcost-europa.service lowcost-europa-backup.timer lowcost-europa-cavitation-availability.timer; do
            echo "STATE_UNIT=$unit STATUS=$(systemctl is-active "$unit" || true)"
          done
          for path in / /products/cavitacao-rf-vacuum-corpo/ /products/hydrodermoabrasao-aqua-facial-multifuncoes/; do
            status=$(curl --silent --show-error --output /dev/null --max-time 18 --write-out '%{http_code}' "https://www.lowcost-europa.eu$path" || true)
            echo "STATE_HTTP=$path $status"
          done
          cd "$ROOT"
          set -a
          . "$ENVFILE"
          set +a
          export DJANGO_SETTINGS_MODULE=config.settings.production
          runuser -u le001_1789265592 -- "$ROOT/.venv/bin/python" - <<'PY'
          import django
          try:
              django.setup()
              from apps.catalog.models import ProductFamily,Offer,OfferFamilyPlacement
              fam=ProductFamily.objects.get(slug="hydrodermoabrasao-aqua-facial-multifuncoes")
              placed=OfferFamilyPlacement.objects.filter(product_family=fam)
              print("STATE_MICRO_PLACEMENTS="+str(placed.count()))
              print("STATE_MICRO_OWNER_PLACEMENTS="+str(placed.filter(offer__source=Offer.Source.ALIEXPRESS_OWNER).count()))
              print("STATE_MICRO_LEGACY_PLACEMENTS="+str(placed.filter(offer__source=Offer.Source.ALIEXPRESS).count()))
              print("STATE_DJANGO_SETUP=PASS")
          except Exception as exc:
              print("STATE_DJANGO_SETUP=FAIL_"+type(exc).__name__)
              print("STATE_DJANGO_ERROR="+str(exc).replace("\n"," ")[:180])
          PY
          echo STATE_READONLY_INSPECTION=COMPLETE
          REMOTE
