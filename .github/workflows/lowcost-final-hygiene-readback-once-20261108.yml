name: Lowcost final hygiene - docs alignment and readback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-final-hygiene-readback-once-20261108.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-final-hygiene-readback-20261108
  cancel-in-progress: false
jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact workflow scope and SSH pin
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git diff --name-only HEAD^ HEAD)" == '.github/workflows/lowcost-final-hygiene-readback-once-20261108.yml' ]]
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
      - name: Readback production integrity and synchronize final documentation only
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SSHPASS" ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          ROOT=/srv/projects/lowcost-europa
          OLD=c248f516078b6fd9c23927853972a2038dd29e62
          NEW=f157e3b98786db21d6f541917ec7b545e9913485
          BACK="$ROOT/private/hygiene-rollbacks/lowcost-20261108-final-docs-01"
          MUTATED=0
          rollback() {
            code=$?
            trap - EXIT
            if [[ "$MUTATED" -eq 1 ]]; then
              git -c "safe.directory=$ROOT" -C "$ROOT" checkout --detach -q "$OLD" || true
              echo LOWCOST_FINAL_DOCS_ROLLBACK=EXECUTED
            else
              echo LOWCOST_FINAL_DOCS_MUTATIONS=NONE
            fi
            exit "$code"
          }
          trap rollback EXIT
          umask 077
          [[ -d "$ROOT/.git" && -d "$ROOT/private" && ! -e "$BACK" ]]
          [[ "$(git -c "safe.directory=$ROOT" -C "$ROOT" rev-parse HEAD)" == "$OLD" ]]
          [[ -z "$(git -c "safe.directory=$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          [[ ! -e /etc/nginx/sites-enabled/lowcost-europa-temp ]]
          [[ ! -e /etc/nginx/sites-available/lowcost-europa-temp ]]
          for name in lowcost-europa.duckdns.org lowcost-europa.146-59-145-3.sslip.io lowcost-europa.165-22-114-67.sslip.io; do
            [[ ! -e "/etc/letsencrypt/renewal/$name.conf" ]]
            if grep -Fq "$name" "$ROOT/private/systemd-env/lowcost-europa.env"; then exit 3; fi
          done
          [[ -f /etc/letsencrypt/renewal/lowcost-europa.eu.conf ]]
          systemctl is-active --quiet certbot.timer
          systemctl is-active --quiet lowcost-europa.service
          for timer in lowcost-europa-catalog-maintenance.timer lowcost-europa-weekly-discovery.timer lowcost-europa-indexnow.timer lowcost-europa-affiliate-report.timer; do
            systemctl is-active --quiet "$timer"
          done
          nginx -t >/dev/null 2>&1
          git -c "safe.directory=$ROOT" -C "$ROOT" fetch -q https://github.com/martaxi-boss/lowcost-europa.git main
          [[ "$(git -c "safe.directory=$ROOT" -C "$ROOT" rev-parse FETCH_HEAD)" == "$NEW" ]]
          [[ "$(git -c "safe.directory=$ROOT" -C "$ROOT" merge-base "$OLD" "$NEW")" == "$OLD" ]]
          expected="$(printf '%s\n' PROJECT_STATE.md docs/ops/LOWCOST-HYGIENE-20261108.md | sort)"
          actual="$(git -c "safe.directory=$ROOT" -C "$ROOT" diff --name-only "$OLD" "$NEW" | sort)"
          [[ "$expected" == "$actual" ]]
          mkdir -m 700 "$BACK"
          printf '%s\n' "$OLD" > "$BACK/old-sha"
          printf '%s\n' "$NEW" > "$BACK/new-sha"
          echo LOWCOST_FINAL_DOCS_SCOPE=PASS
          MUTATED=1
          umask 022
          git -c "safe.directory=$ROOT" -C "$ROOT" checkout --detach -q "$NEW"
          umask 077
          [[ -f "$ROOT/docs/ops/LOWCOST-HYGIENE-20261108.md" ]]
          [[ -z "$(git -c "safe.directory=$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          echo LOWCOST_FINAL_GIT_GC_BEFORE_BEGIN
          git -c "safe.directory=$ROOT" -C "$ROOT" count-objects -v | grep -E '^(count|packs|size|prune-packable|garbage):' || true
          echo LOWCOST_FINAL_GIT_GC_BEFORE_END
          printf 'LOWCOST_FINAL_GIT_BEFORE_KIB='
          du -sk "$ROOT/.git" | awk '{print $1}'
          owner="$(stat -c '%U' "$ROOT/.git")"
          if [[ "$owner" == root ]]; then
            if git -c "safe.directory=$ROOT" -C "$ROOT" gc --prune=2.weeks.ago >/dev/null 2>&1; then
              echo LOWCOST_FINAL_GIT_GC=PASS
            else
              echo LOWCOST_FINAL_GIT_GC=SKIPPED
            fi
          else
            echo LOWCOST_FINAL_GIT_GC=SKIPPED_OWNER_NOT_ROOT
          fi
          printf 'LOWCOST_FINAL_GIT_AFTER_KIB='
          du -sk "$ROOT/.git" | awk '{print $1}'
          [[ "$(git -c "safe.directory=$ROOT" -C "$ROOT" rev-parse HEAD)" == "$NEW" ]]
          [[ -z "$(git -c "safe.directory=$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 https://www.lowcost-europa.eu/)" == 200 ]]
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --resolve lowcost-europa.eu:443:146.59.145.3 https://lowcost-europa.eu/)" == 301 ]]
          for slug in cavitacao-rf-vacuum-corpo hydrodermoabrasao-aqua-facial-multifuncoes pressoterapia-vacuum-drenagem hifu diodo-laser-remocao-tatuagens-pigmentacao; do
            [[ "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 "https://www.lowcost-europa.eu/products/$slug/")" == 200 ]]
          done
          headers="$(curl -sS -D - -o /dev/null --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 https://www.lowcost-europa.eu/painel/)"
          printf '%s\n' "$headers" | grep -Eq '^HTTP/.* 302'
          printf '%s\n' "$headers" | grep -Eiq '^x-robots-tag:.*noindex'
          curl -fsS --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 https://www.lowcost-europa.eu/sitemap.xml -o /dev/null
          nginx -t >/dev/null 2>&1
          printf 'LOWCOST_FINAL_ROOT_KIB='
          du -sk "$ROOT" | awk '{print $1}'
          printf 'LOWCOST_FINAL_FREE_KIB='
          df -Pk "$ROOT" | awk 'NR==2 {print $4}'
          echo "LOWCOST_FINAL_GITHUB_VPS_SHA=$NEW"
          echo LOWCOST_FINAL_CANONICAL_HTTPS=PASS
          echo LOWCOST_FINAL_FIVE_CATEGORIES=PASS
          echo LOWCOST_FINAL_OWNER_PRIVATE=PASS
          echo LOWCOST_FINAL_TIMERS_AND_TLS=PASS
          echo LOWCOST_FINAL_HYGIENE_READBACK=PASS
          trap - EXIT
          REMOTE
