name: Lowcost canonical hygiene - one-time scoped VPS apply
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-hygiene-apply-once-20261108.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-canonical-hygiene-20261108
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify one file scope and pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git diff --name-only HEAD^ HEAD)" == '.github/workflows/lowcost-hygiene-apply-once-20261108.yml' ]]
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          [[ "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]]
          echo LOWCOST_HYGIENE_SSH_PIN=PASS
      - name: Scoped Lowcost cleanup with private rollback and canonical WWW postflight
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$SSHPASS" ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          ENVFILE="$ROOT/private/systemd-env/lowcost-europa.env"
          OLD=bd25002e619a3f4240b1b4ffe5247ae4a87a67e1
          NEW=c248f516078b6fd9c23927853972a2038dd29e62
          OLD_ENABLED=/etc/nginx/sites-enabled/lowcost-europa-temp
          OLD_AVAILABLE=/etc/nginx/sites-available/lowcost-europa-temp
          BACK="$ROOT/private/hygiene-rollbacks/lowcost-20261108-canonical-01"
          MUTATED=0
          restore_on_error() {
            code=$?
            trap - EXIT
            if [[ "$MUTATED" -eq 1 ]]; then
              echo LOWCOST_HYGIENE_ROLLBACK=BEGIN
              cp -a "$BACK/previous-env" "$ENVFILE" || true
              cp -a "$BACK/legacy-enabled" "$OLD_ENABLED" || true
              cp -a "$BACK/legacy-available" "$OLD_AVAILABLE" || true
              git -c "safe.directory=$ROOT" -C "$ROOT" checkout --detach -q "$OLD" || true
              nginx -t >/dev/null 2>&1 && systemctl reload nginx || true
              systemctl restart lowcost-europa.service || true
              echo LOWCOST_HYGIENE_ROLLBACK=EXECUTED
            else
              echo LOWCOST_HYGIENE_MUTATIONS=NONE
            fi
            exit "$code"
          }
          trap restore_on_error EXIT
          [[ -d "$ROOT/.git" && -d "$ROOT/private" && -f "$ENVFILE" ]]
          [[ -f "$OLD_ENABLED" && ! -L "$OLD_ENABLED" ]]
          [[ -f "$OLD_AVAILABLE" && ! -L "$OLD_AVAILABLE" ]]
          [[ -f /etc/nginx/sites-enabled/lowcost-europa-eu.conf ]]
          [[ -f /etc/letsencrypt/live/lowcost-europa.eu/fullchain.pem ]]
          [[ -z "$(git -c "safe.directory=$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          [[ "$(git -c "safe.directory=$ROOT" -C "$ROOT" rev-parse HEAD)" == "$OLD" ]]
          [[ ! -e "$BACK" ]]
          for file in "$OLD_ENABLED" "$OLD_AVAILABLE"; do
            grep -Fq 'lowcost-europa.duckdns.org' "$file"
            grep -Fq 'lowcost-europa.146-59-145-3.sslip.io' "$file"
            if grep -Fq 'www.lowcost-europa.eu' "$file"; then exit 3; fi
          done
          grep -Fq 'www.lowcost-europa.eu' /etc/nginx/sites-enabled/lowcost-europa-eu.conf
          openssl x509 -in /etc/letsencrypt/live/lowcost-europa.eu/fullchain.pem -noout -checkend 604800 >/dev/null
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-catalog-maintenance.timer
          systemctl is-active --quiet lowcost-europa-weekly-discovery.timer
          systemctl is-active --quiet lowcost-europa-indexnow.timer
          nginx -t >/dev/null 2>&1
          git -c "safe.directory=$ROOT" -C "$ROOT" fetch -q https://github.com/martaxi-boss/lowcost-europa.git main
          [[ "$(git -c "safe.directory=$ROOT" -C "$ROOT" rev-parse FETCH_HEAD)" == "$NEW" ]]
          [[ "$(git -c "safe.directory=$ROOT" -C "$ROOT" merge-base "$OLD" "$NEW")" == "$OLD" ]]
          expected="$(cat <<'FILELIST'
          .github/workflows/closed-pr-branch-hygiene.yml
          .github/workflows/staging-browser-qa.yml
          deploy/nginx/lowcost-europa.conf
          deploy/nginx/lowcost-europa.eu-acme.conf
          deploy/nginx/lowcost-europa.eu.conf
          docs/operations/custom-domain-dynadot-20261107.md
          docs/qa/MVP-QA-VISUAL-001.md
          docs/qa/README.md
          docs/qa/launch-readiness-001/mobile-cavitation-duckdns.png
          docs/qa/launch-readiness-001/mobile-contacto-duckdns.png
          docs/qa/launch-readiness-001/mobile-hifu-duckdns.png
          docs/qa/launch-readiness-001/mobile-home-duckdns.png
          docs/qa/launch-readiness-001/qa-results.json
          docs/qa/screenshots/detail-desktop.png
          docs/qa/screenshots/detail-mobile.png
          docs/qa/screenshots/homepage-desktop.png
          docs/qa/screenshots/homepage-mobile.png
          docs/qa/visual-commercial-001/desktop-hifu.png
          docs/qa/visual-commercial-001/desktop-home.png
          docs/qa/visual-commercial-001/desktop-products.png
          docs/qa/visual-commercial-001/mobile-cavitation.png
          docs/qa/visual-commercial-001/mobile-contacto.png
          docs/qa/visual-commercial-001/mobile-hifu.png
          docs/qa/visual-commercial-001/mobile-home.png
          docs/qa/visual-commercial-001/mobile-menu.png
          docs/qa/visual-commercial-001/qa-results.json
          tests/browser/staging-browser-smoke.cjs
          FILELIST
          )"
          actual="$(git -c "safe.directory=$ROOT" -C "$ROOT" diff --name-only "$OLD" "$NEW" | sort)"
          [[ "$actual" == "$expected" ]] || { echo LOWCOST_HYGIENE_DIFF_SCOPE=BLOCK; exit 4; }
          echo LOWCOST_HYGIENE_DIFF_SCOPE=PASS
          mkdir -m 700 -p "$ROOT/private/hygiene-rollbacks"
          mkdir -m 700 "$BACK"
          cp -a "$ENVFILE" "$BACK/previous-env"
          cp -a "$OLD_ENABLED" "$BACK/legacy-enabled"
          cp -a "$OLD_AVAILABLE" "$BACK/legacy-available"
          printf '%s\n' "$OLD" > "$BACK/old-revision"
          printf '%s\n' "$NEW" > "$BACK/new-revision"
          du -sk "$ROOT" | awk '{print "LOWCOST_HYGIENE_BEFORE_KIB="$1}'
          echo LOWCOST_HYGIENE_PRIVATE_BACKUP=PASS
          MUTATED=1
          umask 022
          git -c "safe.directory=$ROOT" -C "$ROOT" checkout --detach -q "$NEW"
          umask 077
          python3 - "$ENVFILE" <<'PYENV'
          import os,stat,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          old=p.read_text(encoding="utf-8")
          lines=old.splitlines(keepends=True)
          legacy={
              "lowcost-europa.duckdns.org",
              "lowcost-europa.146-59-145-3.sslip.io",
              "lowcost-europa.165-22-114-67.sslip.io",
          }
          keys=("DJANGO_ALLOWED_HOSTS","DJANGO_CSRF_TRUSTED_ORIGINS")
          changed=[]
          result=[]
          for line in lines:
              name=next((k for k in keys if line.startswith(k+"=")),None)
              if name is None:
                  result.append(line)
                  continue
              rhs=line[len(name)+1:]
              eol="\n" if rhs.endswith("\n") else ""
              rhs=rhs.rstrip("\r\n")
              q=rhs[0] if len(rhs)>1 and rhs[0] in ("'",'"') and rhs[-1]==rhs[0] else ""
              val=rhs[1:-1] if q else rhs
              parts=[v.strip() for v in val.split(",") if v.strip()]
              keep=[v for v in parts if v.lower().removeprefix("https://").removeprefix("http://") not in legacy]
              if name=="DJANGO_ALLOWED_HOSTS" and "www.lowcost-europa.eu" not in keep:
                  raise RuntimeError("Canonical WWW host missing; refusing rewrite")
              if name=="DJANGO_CSRF_TRUSTED_ORIGINS" and "https://www.lowcost-europa.eu" not in keep:
                  raise RuntimeError("Canonical WWW CSRF origin missing; refusing rewrite")
              if len(keep)!=len(parts): changed.append(name)
              result.append(name+"="+q+",".join(keep)+q+eol)
          if set(changed)!=set(keys):
              raise RuntimeError("Unexpected legacy environment key set: "+",".join(changed))
          new="".join(result)
          if any(host in new.lower() for host in legacy):
              raise RuntimeError("Legacy host remained after rewrite")
          st=p.stat()
          temp=p.with_name(p.name+".hygiene-pending")
          fd=os.open(str(temp),os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          try:
              with os.fdopen(fd,"w",encoding="utf-8") as h:
                  h.write(new)
                  h.flush()
                  os.fsync(h.fileno())
              os.chown(temp,st.st_uid,st.st_gid)
              os.chmod(temp,stat.S_IMODE(st.st_mode))
              os.replace(temp,p)
          except Exception:
              temp.unlink(missing_ok=True)
              raise
          print("LOWCOST_HYGIENE_ENV_CLEANED_KEYS="+",".join(sorted(changed)))
          PYENV
          rm -- "$OLD_ENABLED" "$OLD_AVAILABLE"
          echo LOWCOST_HYGIENE_LEGACY_NGINX_REMOVED=PASS
          nginx -t >/dev/null 2>&1
          systemctl reload nginx
          systemctl restart lowcost-europa.service
          systemctl is-active --quiet lowcost-europa.service
          for host in www.lowcost-europa.eu lowcost-europa.eu; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --resolve "$host:443:146.59.145.3" "https://$host/")" = "$(test "$host" = www.lowcost-europa.eu && echo 200 || echo 301)"
          done
          headers="$(curl -sS -D - -o /dev/null --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 https://www.lowcost-europa.eu/painel/)"
          printf '%s\n' "$headers" | grep -Eq '^HTTP/.* 302'
          printf '%s\n' "$headers" | grep -Eiq '^x-robots-tag:.*noindex'
          www_headers="$(curl -sSI --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 https://www.lowcost-europa.eu/)"
          printf '%s\n' "$www_headers" | grep -Eq '^HTTP/.* 200'
          if printf '%s\n' "$www_headers" | grep -Eiq '^x-robots-tag:.*noindex'; then exit 5; fi
          for slug in cavitacao-rf-vacuum-corpo hydrodermoabrasao-aqua-facial-multifuncoes pressoterapia-vacuum-drenagem hifu diodo-laser-remocao-tatuagens-pigmentacao; do
            [[ "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 "https://www.lowcost-europa.eu/products/$slug/")" == 200 ]]
          done
          curl -fsS --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 https://www.lowcost-europa.eu/robots.txt | grep -q 'Sitemap: https://www.lowcost-europa.eu/sitemap.xml'
          curl -fsS --max-time 15 --resolve www.lowcost-europa.eu:443:146.59.145.3 https://www.lowcost-europa.eu/sitemap.xml -o /dev/null
          echo LOWCOST_HYGIENE_CANONICAL_SITE=PASS
          echo LOWCOST_HYGIENE_FIVE_CATEGORIES=PASS
          echo LOWCOST_HYGIENE_OWNER_PRIVATE=PASS
          echo LOWCOST_HYGIENE_SEO_SITEMAP=PASS
          if nginx -T 2>/dev/null | grep -Eq '^[[:space:]]*server_name .*lowcost-europa\.(duckdns\.org|146-59-145-3\.sslip\.io)'; then exit 6; fi
          echo LOWCOST_HYGIENE_LEGACY_VHOST_ABSENT=PASS
          for service in lowcost-europa-catalog-maintenance.timer lowcost-europa-weekly-discovery.timer lowcost-europa-indexnow.timer lowcost-europa-affiliate-report.timer; do
            systemctl is-active --quiet "$service"
          done
          echo LOWCOST_HYGIENE_TIMERS=PASS
          if nginx -T 2>/dev/null | grep -Fq 'server_name fadego.duckdns.org'; then :; else exit 7; fi
          if nginx -T 2>/dev/null | grep -Fq 'server_name pink-iptv.duckdns.org'; then :; else exit 8; fi
          echo LOWCOST_HYGIENE_OTHER_PROJECT_VHOSTS=UNCHANGED
          caches_before="$(find "$ROOT" -xdev \( -path "$ROOT/.git" -o -path "$ROOT/.venv" -o -path "$ROOT/private" \) -prune -o -type d \( -name __pycache__ -o -name .pytest_cache -o -name .ruff_cache \) -print | wc -l)"
          find "$ROOT" -xdev \( -path "$ROOT/.git" -o -path "$ROOT/.venv" -o -path "$ROOT/private" \) -prune -o -type d \( -name __pycache__ -o -name .pytest_cache -o -name .ruff_cache \) -prune -exec rm -rf -- {} +
          echo "LOWCOST_HYGIENE_SAFE_CACHE_DIRS_REMOVED=$caches_before"
          [[ -z "$(git -c "safe.directory=$ROOT" -C "$ROOT" status --porcelain=v1 --untracked-files=no)" ]]
          [[ "$(git -c "safe.directory=$ROOT" -C "$ROOT" rev-parse HEAD)" == "$NEW" ]]
          du -sk "$ROOT" | awk '{print "LOWCOST_HYGIENE_AFTER_KIB="$1}'
          df -Pk "$ROOT" | awk 'NR==2 {print "LOWCOST_HYGIENE_AVAILABLE_KIB="$4}'
          echo "LOWCOST_HYGIENE_GITHUB_VPS_SHA=$NEW"
          echo LOWCOST_HYGIENE_APPLY=PASS
          trap - EXIT
          REMOTE
