name: Lowcost crawler evidence and seven-engine counters 20261112
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lowcost-seo-crawler-and-metrics-audit-20261112.yml'
permissions:
  contents: read
concurrency:
  group: lowcost-search-referrers-private
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Pinned SSH audit Nginx crawler logs and refresh existing private report
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$RUNNER_TEMP/kh"
          chmod 600 "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/kh" -E sha256 | awk '{print $2}')" = 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc'
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            ubuntu@146.59.145.3 'sudo -n bash -s' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          ROOT=/srv/projects/lowcost-europa
          LOG=/var/log/nginx/lowcost-europa.access.log
          REPORT="$ROOT/.local-metrics/search-referrers.json"
          EXPECTED_SHA=dbed2cdead968118bcbd5c69486d679e65d0f90a
          cd "$ROOT"
          test "$(git -c safe.directory="$ROOT" rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git -c safe.directory="$ROOT" status --porcelain=v1 --untracked-files=no)"
          nginx -t >/dev/null 2>&1
          systemctl is-active --quiet lowcost-europa.service
          systemctl is-active --quiet lowcost-europa-indexnow.timer
          systemctl is-active --quiet lowcost-europa-affiliate-report.timer
          test -s "$LOG"
          test -d "$ROOT/.local-metrics" && test ! -L "$ROOT/.local-metrics"
          test ! -L "$REPORT"
          APPUSER="$(systemctl show lowcost-europa.service -p User --value)"
          test "$APPUSER" = le001_1789265592
          if test -f "$REPORT"; then
            echo "LOCAL_OLD_METRICS_AGE_MINUTES=$(( ($(date -u +%s) - $(stat -c %Y "$REPORT")) / 60 ))"
          fi
          python3 - <<'PY'
          import gzip,re,collections
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          now=datetime.now(timezone.utc)
          start=now-timedelta(days=7)
          folder=Path('/var/log/nginx')
          names=[p for p in folder.iterdir() if re.fullmatch(r'lowcost-europa\.access\.log(?:\.\d+(?:\.gz)?)?',p.name) and p.is_file() and not p.is_symlink()]
          assert 1<=len(names)<=24
          rx=re.compile(r'^\S+ \S+ \S+ \[([^\]]+)\] "([^"]+)" (\d{3}) \S+ "[^"]*" "([^"]*)"')
          bots=[
            ('Google',re.compile(r'Googlebot|Google-InspectionTool|GoogleOther',re.I)),
            ('Bing',re.compile(r'bingbot|msnbot|bingpreview',re.I)),
            ('Yandex',re.compile(r'YandexBot|YandexImages|YandexMobileBot',re.I)),
            ('Seznam',re.compile(r'SeznamBot',re.I)),
            ('DuckDuckGo',re.compile(r'DuckDuckBot',re.I)),
            ('Yahoo',re.compile(r'Slurp',re.I)),
            ('Brave',re.compile(r'BraveBot',re.I)),
          ]
          counts=collections.defaultdict(lambda:collections.Counter())
          last={}
          lines=0
          for p in names:
            op=gzip.open if p.suffix=='.gz' else open
            with op(p,'rt',encoding='utf-8',errors='replace') as fh:
              for line in fh:
                lines+=1
                if lines>3000000: raise RuntimeError('too many log lines')
                m=rx.search(line)
                if not m:continue
                try:dt=datetime.strptime(m.group(1),'%d/%b/%Y:%H:%M:%S %z').astimezone(timezone.utc)
                except ValueError:continue
                if not start<=dt<=now:continue
                req=m.group(2);code=int(m.group(3));ua=m.group(4)
                group=next((name for name,pattern in bots if pattern.search(ua)),None)
                if not group:continue
                c=counts[group]
                c['requests']+=1
                c['status_2xx']+=int(200<=code<300)
                c['status_3xx']+=int(300<=code<400)
                c['status_4xx']+=int(400<=code<500)
                c['status_5xx']+=int(500<=code<600)
                parts=req.split(' ')
                path=parts[1].split('?',1)[0] if len(parts)>=2 else ''
                c['sitemap']+=int(path in ('/sitemap.xml','/sitemap.txt'))
                c['robots']+=int(path=='/robots.txt')
                c['homepage']+=int(path in ('/','/pt/','/es/'))
                c['categories']+=int(path.startswith('/products/'))
                last[group]=max(last.get(group,dt),dt)
          print('CRAWL_AUDIT_SOURCE=dedicated_nginx_log_user_agent_unverified')
          print('CRAWL_AUDIT_WINDOW_DAYS=7')
          print('CRAWL_AUDIT_LINES_PARSED='+str(lines))
          for name,_ in bots:
            c=counts[name]
            print('CRAWL_UA_'+name.upper()+'='+','.join(k+':'+str(c[k]) for k in
                ('requests','status_2xx','status_3xx','status_4xx','status_5xx','sitemap','robots','homepage','categories')))
            print('CRAWL_UA_'+name.upper()+'_LATEST_UTC='+ (last[name].isoformat() if name in last else 'NONE'))
          print('CRAWL_UA_AUDIT=PASS_NOT_INDEX_CERTIFICATION')
          PY
          python3 -m apps.catalog.services.search_referral_metrics --log-dir /var/log/nginx --output "$REPORT"
          chown "$APPUSER:$APPUSER" "$REPORT"
          chmod 600 "$REPORT"
          runuser -u "$APPUSER" -- "$ROOT/.venv/bin/python" - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          from apps.catalog.services.search_referral_metrics import read_private_report
          data=read_private_report(Path('/srv/projects/lowcost-europa/.local-metrics/search-referrers.json'))
          assert data and (datetime.now(timezone.utc)-data['checked_at']).total_seconds()<120
          print('PANEL_SEVEN_ENGINES_NOW='+','.join(x['name']+':'+str(x['requests']) for x in data['rows']))
          print('PANEL_META_NOW='+str(data['meta']['total'] if data['meta'] else 'UNAVAILABLE'))
          print('PANEL_FRESH_SEVEN_ENGINE_REPORT=PASS')
          PY
          test "$(systemctl show lowcost-europa-indexnow.service -p Result --value)" = success
          for unit in lowcost-europa-weekly-discovery.timer lowcost-europa-catalog-maintenance.timer; do
            test "$(systemctl is-enabled "$unit" 2>/dev/null || true)" = disabled
            ! systemctl is-active --quiet "$unit"
          done
          echo INDEXNOW_HEALTH_AND_LEGACY_DISABLED=PASS
          echo LOWCOST_CRAWL_SIGNAL_AUDIT=PASS
          REMOTE
